[platformio]
default_envs = runtime, boot

[env]
platform = https://github.com/pioarduino/platform-espressif32/archive/32f6bf400b276b0f61cf42c50490a7808ee3457e.zip
board = esp32-c6-devkitc-1
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/archive/75c3d914bb6dbb413aa483f9a77d55baa97c8620.zip
    framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/esp32-arduino-libs-idf-release_v5.5-b774170f-v3.zip
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
upload_speed = 460800
monitor_speed = 115200
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DCORE_DEBUG_LEVEL=0 -Oz -ffunction-sections -fdata-sections -fmerge-constants -fno-ident -fno-exceptions -fno-rtti -fno-unwind-tables -fno-asynchronous-unwind-tables -Wl,--gc-sections
lib_deps = bblanchon/ArduinoJson @ 7.4.3

[env:runtime]
build_flags = ${env.build_flags} -DWEBSOCKETS_MAX_DATA_SIZE=16384
extra_scripts = post:tools/bounded_websocket.py
build_src_filter = +<OracleRelay.cpp> +<runtime.cpp> +<Common.cpp> +<FirmwareUpdate.cpp> +<Curtain.cpp> +<SmartDawnProtocol.cpp> +<PortMapping.cpp>
lib_deps = ${env.lib_deps}
    h2zero/NimBLE-Arduino @ 2.5.1
    links2004/WebSockets @ 2.7.3

[env:boot]
build_flags = ${env.build_flags} -DJH2_BOOT=1
build_src_filter = +<boot.cpp> +<BootCommon.cpp> +<FirmwareUpdate.cpp>
