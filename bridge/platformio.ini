[platformio]
default_envs = m5stack-nanoc6

[env:m5stack-nanoc6]
platform = https://github.com/pioarduino/platform-espressif32/archive/32f6bf400b276b0f61cf42c50490a7808ee3457e.zip
board = esp32-c6-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_ota.csv
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Os
    -fno-exceptions
    -fno-rtti
    -Wl,--gc-sections
