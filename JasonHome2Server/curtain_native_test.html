<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jason Home 2 · Native Curtain Test</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#08131d;color:#edf8ff;font:15px system-ui;margin:0}main{max-width:640px;margin:auto;padding:17px}
h1{font-size:21px}section{padding:20px;background:#152635;border:1px solid #385466;border-radius:16px}
.buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
button{background:#19866c;border:1px solid #50cfb5;color:white;border-radius:10px;padding:17px 13px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.45}canvas{width:200px;max-width:100%;image-rendering:pixelated;background:#000;border:1px solid #506a7c;border-radius:8px}
select{width:100%;font:inherit;background:#08131d;color:#edf8ff;border:1px solid #507185;border-radius:9px;padding:11px;margin:8px 0}#slotDetails{padding:10px 0;white-space:pre-wrap;font-size:14px}#allSlots{font:12px/1.5 ui-monospace,monospace;white-space:pre;overflow:auto;max-height:260px;color:#aed7e8;background:#08131d;border:1px solid #354b5d;border-radius:8px;padding:10px}#inspect{background:#28639a}
p{color:#bcd0d9}#status{white-space:pre-wrap;font-size:14px;line-height:1.5;color:#a5f1d3;min-height:58px}
</style></head><body><main><section><h1>🎞️ Native Curtain Test</h1>
<canvas id="preview" width="40" height="40" aria-label="40×40 test animation preview"></canvas>
<div class="buttons">
<button id="load" type="button">1. Load Test AVI</button>
<button id="convert" type="button" disabled>2. Convert &amp; Send to Controller</button>
</div><hr style="border:0;border-top:1px solid #385466;margin:20px 0"><h2 style="font-size:17px">Controller Slots</h2>
<button id="inspect" type="button">Read Controller Slots / IDs</button>
<label for="slotSelect" style="display:block;margin-top:12px">Stored effects <span id="slotCount">(not read)</span></label>
<select id="slotSelect" disabled><option value="">Press Read Controller Slots</option></select>
<div id="slotDetails" role="status">No inventory read yet.</div>
<pre id="allSlots" hidden aria-label="Complete controller inventory"></pre>
<p id="status" role="status">Select Load Test AVI to prepare a small 40×40 animation. Conversion runs locally; no cloud server.</p>
</section></main>
<script src="curtain_native_research.js"></script>
<script src="curtain_native_slot.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),R=window.JH2NativeResearch,N=window.JH2NativeSlot;
const ctx=$('preview').getContext('2d');
let frames=null,avi=null,busy=false,timer=null,storedSlots=[],inventoryLoaded=false;
function show(message){$('status').textContent=message;}
function update(){ $('load').disabled=busy; $('convert').disabled=busy||!avi; $('inspect').disabled=busy; $('slotSelect').disabled=busy||!storedSlots.length; }
function display(){
 if(!frames?.length)return;
 let idx=0;const paint=()=>{const image=ctx.createImageData(40,40);image.data.set(frames[idx++%frames.length]);ctx.putImageData(image,0,0);};
 if(timer)clearInterval(timer);paint();timer=setInterval(paint,400);
}
function load(list,label){
 if(!Array.isArray(list)||list.length<2||list.length>24||list.some(f=>!(f instanceof Uint8Array||f instanceof Uint8ClampedArray||Array.isArray(f))||f.length!==6400))throw Error('Test must contain 2–24 complete 40×40 RGBA frames');
 frames=list.map(f=>new Uint8ClampedArray(f));
 avi=R.makeAvi(frames,400);
 if(avi.bytes.length>800000)throw Error('Test AVI is too large');
 R.inspectAvi(avi.bytes);
 display();update();show(label+' loaded: '+avi.frames+' frames, '+avi.width+'×'+avi.height+' AVI ('+Math.round(avi.bytes.length/1024)+' KB).');
}
$('load').onclick=()=>{
 if(busy)return;
 try{load(R.sampleFrames(),'Test AVI')}catch(e){show('Load failed: '+e.message)}
};
$('convert').onclick=async()=>{
 if(busy||!avi)return;
 busy=true;update();
 try{
  show('Converting test AVI locally using the SmartDawn 1.2.4 native format…');
  const source=R.readAviFrames(avi.bytes);
  const eff=R.encodeSmartDawn(source,{name:'JH2 TEST',timestamp:Math.floor(Date.now()/1000)});
  const meta=R.inspectSmartDawnEff(eff);
  if(meta.cid!==83928||meta.version!==3||meta.itemHeader!=='DNX2')throw Error('Invalid locally generated native effect');
  show('SmartDawn DNMX v3 / DNX2 generated ('+Math.round(eff.length/1024)+' KB). Installing CID 83928 via NanoC6…');
  const result=await N.smartDawnUpload(eff,(message,entries)=>{show(message);if(Array.isArray(entries))renderSlots(entries);});
  show('CID '+result.cid+' installed in controller slot '+result.slot+'. Native Play command sent. Check the curtain for animation.');
  if(inventoryLoaded){
   const at=storedSlots.findIndex(e=>e.cid===result.cid);
   if(at>=0)storedSlots[at]={slot:result.slot,cid:result.cid};else storedSlots.push({slot:result.slot,cid:result.cid});
   renderSlots(storedSlots);
   resize();
  }
 }catch(e){
  show('Native conversion or controller upload failed: '+e.message);
 }finally{busy=false;update()}
};
function typeLabel(type){return ({1:'Micro-app',2:'Music',3:'Animation',4:'Scrolling text'})[type]||'Type '+type;}
function renderSlots(entries){
 inventoryLoaded=true;
 const incomplete=entries.partial===true;
 storedSlots=entries.slice().sort((a,b)=>(a.id??0)-(b.id??0)||a.slot-b.slot||(a.cid??0)-(b.cid??0));
 const picker=$('slotSelect');picker.replaceChildren();
 const option=(label,value)=>{const o=document.createElement('option');o.textContent=label;o.value=value;picker.appendChild(o)};
 if(!storedSlots.length){option('No native effects reported','');$('slotDetails').textContent='No effects received from controller.';}
 else for(let i=0;i<storedSlots.length;i++){
  const e=storedSlots[i];
  option('ID '+(e.id??'?')+' · Slot '+e.slot+' · CID '+(e.cid??'not reported')+(e.title?' · '+e.title:'')+(e.cid===83928?' · Test':''),String(i));
 }
 $('slotCount').textContent='('+storedSlots.length+' effects'+(incomplete?'; partial read':'')+')';
 $('allSlots').hidden=!storedSlots.length;
 $('allSlots').textContent='ID     SLOT   CID        TYPE   TITLE\\n'+storedSlots.map(e=>
  String(e.id??'?').padEnd(7)+String(e.slot).padEnd(7)+String(e.cid??'not reported').padEnd(11)+
  String(e.type??'?').padEnd(7)+(e.title||'')+(e.cid===83928?' [RESERVED TEST]':'')).join('\\n');
 update();selectSlot();
}
function selectSlot(){
 const i=Number($('slotSelect').value),e=storedSlots[i];
 $('slotDetails').textContent=e?
  'Effect ID: '+(e.id??'not supplied')+'\\nController slot: '+e.slot+
  '\\nCID: '+(e.cid??'not reported')+'\\nType: '+typeLabel(e.type)+
  (e.title?'\\nTitle: '+e.title:'')+(e.cid===83928?'\\nReserved test CID':''):
  'Select a returned effect to inspect its IDs.';
}
$('slotSelect').addEventListener('change',selectSlot);
$('inspect').onclick=async()=>{
 if(busy)return;busy=true;update();
 try{
  show('Reading every native effect list batch via Oracle → NanoC6 → Bluetooth…');
  const all=await N.inspect(show);
  if(!Array.isArray(all)||all.some(e=>!Number.isSafeInteger(e.slot)||!Number.isSafeInteger(e.id)||
    !(Number.isSafeInteger(e.cid)||e.cid===null)))
   throw Error('Controller returned an invalid effect-list entry');
  renderSlots(all);
  show((all.partial?'Incomplete controller read — ': 'Controller read complete — ')+
   all.length+' effect entries from '+all.batches+' native response batches'+
   (all.partial?'; expected at least '+all.expectedAtLeast+'. No uploads permitted until the list is complete.':
   '. IDs, slots, CIDs, types and names are displayed above.'));
 }catch(error){show('Controller slot read failed: '+error.message);}
 finally{busy=false;update();resize()}
};
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==window.parent||e.data?.kind!=='jh2-native-test-frames'||busy)return;
 try{load(e.data.frames,'Studio animation')}catch(err){show(err.message)}
});
function resize(){if(window.parent!==window)window.parent.postMessage({kind:'jh2-curtain-height',height:Math.max(500,document.documentElement.scrollHeight)},location.origin)}
window.addEventListener('load',()=>{resize();if(window.parent!==window)window.parent.postMessage({kind:'jh2-native-test-ready'},location.origin)});
update();
})();
</script></body></html>
