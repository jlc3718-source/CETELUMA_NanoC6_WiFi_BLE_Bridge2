<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jason Home 2 · Native Curtain Test</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#08131d;color:#edf8ff;font:15px system-ui;margin:0}main{max-width:640px;margin:auto;padding:17px}
h1{font-size:21px}section{padding:20px;background:#152635;border:1px solid #385466;border-radius:16px}
.buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
button{background:#19866c;border:1px solid #50cfb5;color:white;border-radius:10px;padding:17px 13px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.45}canvas{width:200px;max-width:100%;image-rendering:pixelated;background:#000;border:1px solid #506a7c;border-radius:8px}
select{width:100%;font:inherit;background:#08131d;color:#edf8ff;border:1px solid #507185;border-radius:9px;padding:11px;margin:8px 0}#slotDetails{padding:10px 0;white-space:pre-wrap;font-size:14px}#allSlots{font:12px/1.5 ui-monospace,monospace;white-space:pre;overflow:auto;max-height:260px;color:#aed7e8;background:#08131d;border:1px solid #354b5d;border-radius:8px;padding:10px}#inspect{background:#28639a}
p{color:#bcd0d9}#status{white-space:pre-wrap;font-size:14px;line-height:1.5;color:#a5f1d3;min-height:58px}
</style></head><body><main><section><h1>🎞️ Native Curtain Test</h1>
<canvas id="preview" width="40" height="40" aria-label="40×40 test animation preview"></canvas>
<p>Three independent pumpkin frames. Frame 1 sends a full image; frames 2 and 3 show only the pixels changed from the preceding frame. No controller slots are written.</p><div class="buttons"><button id="send1">1. Send full pumpkin</button><button id="send2">2. Remove eye · changed pixels</button><button id="send3">3. Restore eye · changed pixels</button></div><p id="deltaStats"></p><p id="status" role="status">Ready.</p></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),ctx=$('preview').getContext('2d');
const make=(eye)=>{const a=new Uint8Array(6400);const dot=(x,y,r,g,b)=>{if(x<0||x>=40||y<0||y>=40)return;const k=(y*40+x)*4;a[k]=r;a[k+1]=g;a[k+2]=b;a[k+3]=255;};
for(let y=0;y<40;y++)for(let x=0;x<40;x++){const dx=(x-19.5)/15.5,dy=(y-20)/14.5;if(dx*dx+dy*dy<=1)dot(x,y,255,112,0);else dot(x,y,0,0,0);if(y>=4&&y<=8&&x>=18&&x<=21)dot(x,y,30,175,45);if(y>=17&&y<=21&&x>=11&&x<=15)dot(x,y,20,10,5);if(eye&&y>=17&&y<=21&&x>=24&&x<=28)dot(x,y,20,10,5);if(y>=26&&y<=29&&x>=13&&x<=27)dot(x,y,20,10,5);}return a;};
const frames=[make(true),make(false),make(true)];
const delta=(a,b)=>{const out=[];for(let i=0;i<1600;i++){let k=i*4;if(a[k]!==b[k]||a[k+1]!==b[k+1]||a[k+2]!==b[k+2])out.push({x:i%40,y:Math.floor(i/40),r:b[k],g:b[k+1],b:b[k+2]});}return out;};
const d2=delta(frames[0],frames[1]),d3=delta(frames[1],frames[2]);
$('deltaStats').textContent='Frame 1: 1600 pixels · Frame 2: '+d2.length+' changed · Frame 3: '+d3.length+' changed';
const show=i=>{const im=ctx.createImageData(40,40);im.data.set(frames[i]);ctx.putImageData(im,0,0);};
const status=t=>$('status').textContent=t;show(0);
async function api(path,body){if(typeof parent.JH2CurtainApi!=='function')throw Error('Open from Jason Home 2');return parent.JH2CurtainApi(path,body);}
$('send1').onclick=async()=>{show(0);try{status('Sending full frame…');const b=frames[0];let binary='';for(let i=0;i<b.length;i+=4096)binary+=String.fromCharCode(...b.subarray(i,i+4096));const asset=await api('/api/curtain/assets',{name:'Pumpkin full frame',frames:[btoa(binary)],delays:[1000],quality:'pal8',loop:false});const cmd=await api('/api/curtain/call',{action:'asset',payload:{sha256:asset.sha256},idempotencyKey:crypto.randomUUID()});status('Full frame queued: command '+cmd.commandId+' (visual confirmation required).');}catch(e){status('Frame 1 failed: '+e.message)}};
$('send2').onclick=()=>{show(1);status('Frame 2 delta: '+d2.length+' pixels. Controller partial-pixel BLE opcode not verified; no packet transmitted.');};
$('send3').onclick=()=>{show(2);status('Frame 3 delta: '+d3.length+' pixels. Controller partial-pixel BLE opcode not verified; no packet transmitted.');};
window.addEventListener('load',()=>parent.postMessage({kind:'jh2-curtain-height',height:document.documentElement.scrollHeight},location.origin));
})();
</script></body></html>
