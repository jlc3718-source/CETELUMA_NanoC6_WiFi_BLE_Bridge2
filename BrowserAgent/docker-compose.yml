services:
  browser-agent:
    build: .
    container_name: oracle-browser-agent
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      PORT: "8932"
      DATA_DIR: "/data"
      DISPLAY: ":99"
      LOGIN_PASSWORD_SHA256: "fb511ae7467e01df1188ca57aee458ccfee349921055d3a8141b9b3ec6a8aee4"
    volumes:
      - /home/ubuntu/browser-agent-data:/data
    ports:
      - "127.0.0.1:8932:8932"
