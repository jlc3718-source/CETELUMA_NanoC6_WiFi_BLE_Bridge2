services:
  browser-agent:
    build: .
    container_name: oracle-browser-agent
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      PORT: "8932"
      DATA_DIR: "/data"
      DISPLAY: ":99"
      LOGIN_PASSWORD_SHA256: "080bf176a72d105681656ff5e16783e6a60c1fe531a4f3b2e1e7010781534424"
    volumes:
      - /home/ubuntu/browser-agent-data:/data
    ports:
      - "127.0.0.1:8932:8932"
