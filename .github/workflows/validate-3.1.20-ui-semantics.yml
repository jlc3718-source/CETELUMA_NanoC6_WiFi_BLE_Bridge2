name: Validate Anderson Home 3.1.20 UI Semantics

on:
  push:
    branches: ['codex/3.1.20-favorite-holidays']
    paths:
      - 'tools/apply_3_1_20_ui_semantics.py'
      - '.github/workflows/validate-3.1.20-ui-semantics.yml'

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - name: Apply pending UI changes
        run: python tools/apply_3_1_20_ui_semantics.py
      - name: Install build tool
        run: python -m pip install -q -r tools/requirements-build.txt
      - name: Install pinned web minifier
        run: npm ci --prefix tools --no-audit --no-fund
      - name: Run maintenance and recovery checks
        run: python tools/test_maintenance.py
      - name: Run regression checks
        run: python tools/test_regressions.py
      - name: Run audit checks
        run: python tools/test_audit_fixes.py
      - name: Check scheduled event coverage
        run: python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full
      - name: Verify visible effects and semantic color invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          w=Path('firmware/web/index.html').read_text()
          assert "const EFFECT_BUTTON_VALUES=['Jump','Breath','Strobe','Solid']" in w
          assert 'enhanceEffectSelect' in w and 'effectButtonGroup' in w
          assert 'const SEMANTIC_COLOR_VISUAL=' in w and 'semanticColorName' in w
          assert "'Yellow':'#FFD400'" in w and "'Orange':'#FF7A00'" in w
          assert '${semanticColorName(c)}</span>' in w
          assert "$('liveColorCode').textContent=semanticColorName(h)" in w
          assert '<option value="Breath">Breath</option>' in w
          assert 'liveColorHex' in w and 'liveColorR' in w and 'liveColorG' in w and 'liveColorB' in w
          print('Visible effects and semantic color UI invariants passed')
          PY
      - name: Prepare release
        run: python tools/release.py prepare
      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package verified firmware
        run: python tools/release.py package
      - name: Verify packaged v3.1.20
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          assert Path('FIRMWARE_VERSION.txt').read_text().strip()=='3.1.20'
          p=Path('release/and_3.1.20.bin')
          assert p.exists() and p.stat().st_size>1000000
          assert p.read_bytes()[:1]==b'\xE9'
          r=json.loads(Path('release/release.json').read_text())
          assert r.get('version')=='3.1.20'
          info=r['files']['and_3.1.20.bin']
          assert info['bytes']==p.stat().st_size
          assert info['sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          print('v3.1.20 semantic UI package verified')
          PY
      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.20-Semantic-UI-Validation
          path: |
            release/*
            firmware/web/index.html
            tools/test_regressions.py
            firmware/RELEASE_NOTES_v3.1.20.md
          if-no-files-found: error
      - name: Materialize exact validated source and remove temporary validator
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tools/apply_3_1_20_ui_semantics.py .github/workflows/validate-3.1.20-ui-semantics.yml
          git add firmware/web/index.html tools/test_regressions.py firmware/RELEASE_NOTES_v3.1.20.md tools/apply_3_1_20_ui_semantics.py .github/workflows/validate-3.1.20-ui-semantics.yml
          git diff --cached --quiet && { echo 'No validated source changes to materialize'; exit 1; }
          git commit -m "Anderson Home v3.1.20 visible effects and semantic colors"
          git push origin HEAD:refs/heads/codex/3.1.20-favorite-holidays
