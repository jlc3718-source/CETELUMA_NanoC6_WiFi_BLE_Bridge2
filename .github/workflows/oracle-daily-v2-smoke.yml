name: Oracle Daily Read-only Verification
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oracle-daily-v2-smoke.yml"
      - ".github/oracle-daily-v2-smoke.trigger"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oracle-daily-runtime-maintenance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check Instagram and wheel bounds with manual session preserved
        run: python3 oracle-daily/run-agent.py smoke
      - name: Publish current evidence without rebasing generated files
        if: always()
        run: python3 oracle-daily/publish-results.py .github/oracle-daily-v2-smoke-result.json .github/oracle-promo-state-result.json .github/oracle-current-session-result.json
