name: Run Anderson v3.0.20 master calendar staging
on:
  push:
    branches: [staging/palette-holiday-update]
    paths: [.github/workflows/run-master-calendar-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/palette-holiday-update
          fetch-depth: 0
      - name: Recover and run verified staging script
        shell: bash
        run: |
          git show 44cad0fdccc56195af7b7fd18322e6be85a0fe90:.github/workflows/stage-master-calendar.yml > /tmp/stage.yml
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/stage.yml').read_text().splitlines()
          start=next(i for i,x in enumerate(lines) if "python - <<'PY'" in x)+1
          end=next(i for i,x in enumerate(lines[start:],start) if x.strip()=='PY')
          body=[]
          for line in lines[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          s='\n'.join(body)+'\n'
          old="assert ev.count('{\"evt')==210, ev.count('{\"evt')"
          new="assert ev.split('};\\nconst size_t EVENT_COUNT',1)[0].count('EventKind::')==210"
          if old not in s: raise SystemExit('staging assertion not found')
          Path('/tmp/stage.py').write_text(s.replace(old,new,1))
          PY
          python /tmp/stage.py
      - name: Commit staged v3.0.20 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware FIRMWARE_VERSION.txt README.md
          git commit -m "Stage v3.0.20 210-event master calendar"
          git push origin HEAD:staging/palette-holiday-update
