name: SD300 V9 test direct source access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sd300-v9-drive-access.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 10
    steps:
      - name: Test original cinematic source without downloading unrelated content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          url='https://drive.google.com/uc?export=download&id=1aPCT3hz7DTeF4nyf5DphGyzO2Cw1T9Sl'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Range':'bytes=0-1023'})
          try:
            with urllib.request.urlopen(req,timeout=35) as r:
              head=r.read(1024)
              print('HTTP',r.status,'TYPE',r.headers.get('Content-Type'),'LENGTH',r.headers.get('Content-Length'),'MAGIC',repr(head[:32]),'FINAL_HOST',r.url.split('/')[2])
              print('MP4_HEADER',b'ftyp' in head[:32])
          except Exception as e:print('ACCESS_ERROR',type(e).__name__,str(e)[:300])
          PY
