name: Inspect Factory Packet

on:
  push:
    branches: [jason-home-cloudflare-rebuild]
    paths: ['.github/workflows/inspect-factory-packet.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 8
    steps:
      - name: Inspect live factory records
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repo/JasonHomeServer
          TOKEN="$(sed -n 's/^JASON_HOME_API_TOKEN=//p' .env)"
          test -n "$TOKEN"
          python3 - <<'PY'
          import json, urllib.request, os, subprocess
          token=subprocess.check_output("sed -n 's/^JASON_HOME_API_TOKEN=//p' .env",shell=True,text=True).strip()
          def get(path):
              q=urllib.request.Request('http://127.0.0.1:8080'+path,headers={'Authorization':'Bearer '+token})
              return json.load(urllib.request.urlopen(q))
          data=get('/api/eufy/factory-presets?raw=1')
          ps=data.get('presets') or []
          print('COUNT',len(ps))
          for p in ps[:8]:
              raw=p.get('raw') or {}
              print('\nPRESET',p.get('lightId'),p.get('name'),'layers',len(p.get('layers') or []),'speed',p.get('speed'),'mode',p.get('layerExecutionMode'))
              print('RAW_KEYS',sorted(raw.keys()))
              le=raw.get('light_effect')
              if isinstance(le,list) and le:
                  e=le[0] if isinstance(le[0],dict) else {}
                  print('EFFECT_KEYS',sorted(e.keys()))
                  print('EFFECT_META',json.dumps({k:e.get(k) for k in e.keys() if k!='params'},sort_keys=True)[:3500])
                  params=e.get('params')
                  if isinstance(params,str):
                      try: params=json.loads(params)
                      except: pass
                  if isinstance(params,dict):
                      print('PARAM_KEYS',sorted(params.keys()))
                      print('PARAM_CORE',json.dumps({k:v for k,v in params.items() if k!='layer'},sort_keys=True)[:3500])
                      layers=params.get('layer') or []
                      for i,l in enumerate(layers[:4]):
                          if isinstance(l,dict):
                              print('LAYER',i+1,json.dumps(l,sort_keys=True)[:7000])
          PY
