name: Build OpenAutoLink Correct Package AAB

on:
  push:
    paths:
      - ".github/workflows/build-openautolink-correct-aab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Build signed AAB
        env:
          OAL_NONINTERACTIVE: "1"
          OAL_APP_ID: "jlc3718.openautolink.silveradoev"
          OAL_SIGNER_NAME: "OpenAutoLink Silverado EV Personal"
          OAL_COUNTRY: "US"
          OAL_START_VERSION_CODE: "0"
          OAL_REF: "v0.1.497"
          OAL_BUILDER_STATE_DIR: "${{ runner.temp }}/openautolink-builder"
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/mossyhub/openautolink/v0.1.497/build-aab.sh -o /tmp/build-aab.sh
          chmod +x /tmp/build-aab.sh
          /tmp/build-aab.sh
          mkdir -p release
          cp "${OAL_BUILDER_STATE_DIR}"/output/*.aab release/
          sha256sum release/*.aab > release/SHA256SUMS.txt

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: openautolink-correct-package-v0.1.497
          path: release/*
          retention-days: 7
          if-no-files-found: error
