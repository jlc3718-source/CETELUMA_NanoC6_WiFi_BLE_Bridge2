name: Build Anderson Home 3.1.19 Major Holiday Schedule

on:
  push:
    branches: ['codex/3.1.19-major-holidays']

permissions:
  contents: write
  actions: write

concurrency:
  group: anderson-3-1-19-major-holidays
  cancel-in-progress: true

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/3.1.19-major-holidays
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - name: Apply v3.1.19 source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_one(path, old, new):
              p=Path(path); s=p.read_text(); count=s.count(old)
              assert count==1, f'{path}: expected one match, found {count}: {old[:120]!r}'
              p.write_text(s.replace(old,new,1))

          Path('FIRMWARE_VERSION.txt').write_text('3.1.19\n')
          replace_one('firmware/src/main.cpp','ANDERSON_FIRMWARE_VERSION="3.1.18"','ANDERSON_FIRMWARE_VERSION="3.1.19"')

          # Three selectable built-in calendar/palette profiles. Existing internal
          # 3.0.28 / 3.0.29 IDs remain compatible with stored settings and backups.
          replace_one('firmware/include/EventColorThemes.h',
            'enum class EventColorTheme : uint8_t { V3028=0, V3029=1 };',
            'enum class EventColorTheme : uint8_t { MajorUS=0, V3028=1, V3029=2 };')
          h=Path('firmware/include/EventColorThemes.h'); hs=h.read_text()
          marker='void applyModernEventColors(Theme& theme);\n'
          assert marker in hs
          hs=hs.replace(marker,marker+'void applyMajorUsEventColors(size_t index, Theme& theme);\nbool eventColorThemeIncludesEvent(EventColorTheme theme,size_t index);\n',1)
          h.write_text(hs)

          themes=Path('firmware/src/EventColorThemes.cpp'); s=themes.read_text()
          marker='static_assert(sizeof(PRESET_DEFAULTS)/sizeof(PRESET_DEFAULTS[0])==16,"preset value count");\n'
          assert marker in s
          major='''\n// Major U.S. federal holiday calendar. Indices are zero-based EventCatalog rows:\n// New Year, MLK, Washington's Birthday, Memorial Day, Juneteenth, Independence\n// Day, Labor Day, Columbus/Indigenous Peoples' Day, Veterans Day, Thanksgiving,\n// and Christmas. Every color index references only the original nine presets.\nstatic constexpr uint16_t MAJOR_US_EVENT_INDEX[]={5,10,25,94,105,117,143,172,192,196,207};\nstatic constexpr uint8_t MAJOR_US_EVENT_COLOR_COUNT[]={2,3,3,3,4,3,3,3,4,3,4};\nstatic constexpr uint8_t MAJOR_US_EVENT_COLOR_INDEX[][4]={\n  {3,8,0,0}, // New Year's Day: Yellow, White\n  {0,8,6,0}, // Martin Luther King Jr. Day: Red, White, Blue\n  {0,8,6,0}, // Washington's Birthday: Red, White, Blue\n  {0,8,6,0}, // Memorial Day: Red, White, Blue\n  {0,8,6,4}, // Juneteenth: Red, White, Blue, Green\n  {0,8,6,0}, // Independence Day: Red, White, Blue\n  {0,8,6,0}, // Labor Day: Red, White, Blue\n  {0,8,6,0}, // Columbus / Indigenous Peoples' Day: Red, White, Blue\n  {0,8,6,3}, // Veterans Day: Red, White, Blue, Yellow\n  {1,0,3,0}, // Thanksgiving: Orange, Red, Yellow\n  {0,4,3,8}, // Christmas: Red, Green, Yellow, White\n};\nstatic_assert(sizeof(MAJOR_US_EVENT_INDEX)/sizeof(MAJOR_US_EVENT_INDEX[0])==11,"major holiday event count");\nstatic_assert(sizeof(MAJOR_US_EVENT_COLOR_COUNT)/sizeof(MAJOR_US_EVENT_COLOR_COUNT[0])==11,"major holiday color count");\nstatic_assert(sizeof(MAJOR_US_EVENT_COLOR_INDEX)/sizeof(MAJOR_US_EVENT_COLOR_INDEX[0])==11,"major holiday color table");\n'''
          s=s.replace(marker,marker+major,1)
          old='const char* eventColorThemeName(EventColorTheme theme){return theme==EventColorTheme::V3028?"3.0.28 Colors":"3.0.29 Colors";}\nconst char* eventColorThemeId(EventColorTheme theme){return theme==EventColorTheme::V3028?"3.0.28":"3.0.29";}\nsize_t eventColorPresetCount(EventColorTheme theme){return theme==EventColorTheme::V3028?9U:16U;}\n'
          new='''const char* eventColorThemeName(EventColorTheme theme){\n  if(theme==EventColorTheme::MajorUS)return "Major U.S. Government Holidays - Basic Colors";\n  if(theme==EventColorTheme::V3028)return "Expanded Holidays - Basic Colors";\n  return "Expanded Holidays - Expanded Colors";\n}\nconst char* eventColorThemeId(EventColorTheme theme){return theme==EventColorTheme::MajorUS?"1":(theme==EventColorTheme::V3028?"3.0.28":"3.0.29");}\nsize_t eventColorPresetCount(EventColorTheme theme){return theme==EventColorTheme::V3029?16U:9U;}\nbool eventColorThemeIncludesEvent(EventColorTheme theme,size_t index){\n  if(theme!=EventColorTheme::MajorUS)return true;\n  for(size_t i=0;i<sizeof(MAJOR_US_EVENT_INDEX)/sizeof(MAJOR_US_EVENT_INDEX[0]);i++)if(MAJOR_US_EVENT_INDEX[i]==index)return true;\n  return false;\n}\nvoid applyMajorUsEventColors(size_t index,Theme& theme){\n  for(size_t row=0;row<sizeof(MAJOR_US_EVENT_INDEX)/sizeof(MAJOR_US_EVENT_INDEX[0]);row++){\n    if(MAJOR_US_EVENT_INDEX[row]!=index)continue;\n    theme.colorCount=MAJOR_US_EVENT_COLOR_COUNT[row];\n    for(uint8_t c=0;c<theme.colorCount;c++)theme.colors[c]=resolvedPresetColor(PRESET_DEFAULTS[MAJOR_US_EVENT_COLOR_INDEX[row][c]]);\n    return;\n  }\n}\n'''
          assert old in s
          s=s.replace(old,new,1)
          themes.write_text(s)

          # Persist/select the new major-holiday profile and apply its calendar filter.
          main=Path('firmware/src/main.cpp'); s=main.read_text()
          old='static bool loadEventColorTheme(){Preferences p;if(!p.begin("anderson-evpal",true))return false;String id=p.getString("scheme","3.0.29");uint32_t g=p.getUInt("gen",1);p.end();activeEventColorTheme=id=="3.0.28"?EventColorTheme::V3028:EventColorTheme::V3029;eventColorThemeGeneration=max((uint32_t)1,g);return true;}'
          new='static bool loadEventColorTheme(){Preferences p;if(!p.begin("anderson-evpal",true))return false;String id=p.getString("scheme","3.0.29");uint32_t g=p.getUInt("gen",1);p.end();activeEventColorTheme=id=="1"?EventColorTheme::MajorUS:(id=="3.0.28"?EventColorTheme::V3028:EventColorTheme::V3029);eventColorThemeGeneration=max((uint32_t)1,g);return true;}'
          assert old in s;s=s.replace(old,new,1)
          marker='static bool setEventColorTheme(EventColorTheme next){if(next==activeEventColorTheme)return true;uint32_t nextGen=eventColorThemeGeneration+1;if(!nextGen)nextGen=1;Preferences p;if(!p.begin("anderson-evpal",false))return false;String id=eventColorThemeId(next);size_t ws=p.putString("scheme",id),wg=p.putUInt("gen",nextGen);bool ok=ws==id.length()&&wg>0&&p.getString("scheme","")==id&&p.getUInt("gen",0)==nextGen;p.end();if(!ok)return false;activeEventColorTheme=next;eventColorThemeGeneration=nextGen;return true;}\n'
          assert marker in s
          s=s.replace(marker,marker+'bool eventAllowedInActiveSchedule(size_t i){return i<EVENT_COUNT&&eventColorThemeIncludesEvent(activeEventColorTheme,i);}\n',1)
          old='Theme applyEventOverrideByIndex(size_t i,const Theme& base){Theme t=base;if(i<EVENT_COUNT){if(activeEventColorTheme==EventColorTheme::V3028)applyOriginalEventColors(i,t);else applyModernEventColors(t);}scheduledEventSpeedHint=eventSpeed(i);'
          new='Theme applyEventOverrideByIndex(size_t i,const Theme& base){Theme t=base;if(i<EVENT_COUNT){if(activeEventColorTheme==EventColorTheme::MajorUS)applyMajorUsEventColors(i,t);else if(activeEventColorTheme==EventColorTheme::V3028)applyOriginalEventColors(i,t);else applyModernEventColors(t);}scheduledEventSpeedHint=eventSpeed(i);'
          assert old in s;s=s.replace(old,new,1)
          old='if(ect=="3.0.28"||ect=="3.0.29")ok=setEventColorTheme(ect=="3.0.28"?EventColorTheme::V3028:EventColorTheme::V3029)&&ok;'
          new='if(ect=="1"||ect=="3.0.28"||ect=="3.0.29")ok=setEventColorTheme(ect=="1"?EventColorTheme::MajorUS:(ect=="3.0.28"?EventColorTheme::V3028:EventColorTheme::V3029))&&ok;'
          assert old in s;s=s.replace(old,new,1)
          old='for(size_t i=0;i<EVENT_COUNT;i++){if(!eventOccursInMonth(i,year,month))continue;Theme et=effectiveEventTheme(i);'
          new='for(size_t i=0;i<EVENT_COUNT;i++){if(!eventAllowedInActiveSchedule(i)||!eventOccursInMonth(i,year,month))continue;Theme et=effectiveEventTheme(i);'
          assert old in s;s=s.replace(old,new,1)
          old='for(size_t i=0;i<EVENT_COUNT&&i<MAX_BUILTIN_EVENTS;i++){String when=eventWhen(i,year);'
          new='for(size_t i=0;i<EVENT_COUNT&&i<MAX_BUILTIN_EVENTS;i++){if(!eventAllowedInActiveSchedule(i))continue;String when=eventWhen(i,year);'
          assert old in s;s=s.replace(old,new,1)
          old='if(!d["speed"].isNull())esp=constrain(d["speed"].as<int>(),1,5);'
          new='if(!d["speed"].isNull())esp=constrain(d["speed"].as<int>(),1,2);'
          assert old in s;s=s.replace(old,new,1)
          old='server.on("/api/event-color-theme",HTTP_POST,[]{if(!requireUser())return;JsonDocument d;if(!body(d))return;String id=d["theme"]|String("");EventColorTheme next=id=="3.0.28"?EventColorTheme::V3028:(id=="3.0.29"?EventColorTheme::V3029:activeEventColorTheme);if(id!="3.0.28"&&id!="3.0.29"){server.send(400,"application/json","{\\"ok\\":false,\\"error\\":\\"Choose 3.0.28 or 3.0.29 colors\\"}");return;}if(!setEventColorTheme(next)){'
          new='server.on("/api/event-color-theme",HTTP_POST,[]{if(!requireUser())return;JsonDocument d;if(!body(d))return;String id=d["theme"]|String("");EventColorTheme next=id=="1"?EventColorTheme::MajorUS:(id=="3.0.28"?EventColorTheme::V3028:(id=="3.0.29"?EventColorTheme::V3029:activeEventColorTheme));if(id!="1"&&id!="3.0.28"&&id!="3.0.29"){server.send(400,"application/json","{\\"ok\\":false,\\"error\\":\\"Choose Major U.S., 9-color expanded, or 16-color expanded holidays\\"}");return;}if(!setEventColorTheme(next)){'
          assert old in s;s=s.replace(old,new,1)
          main.write_text(s)

          # Scheduler must ignore non-major entries when the Major U.S. profile is selected.
          sched=Path('firmware/src/Scheduler.cpp'); s=sched.read_text()
          marker='extern Theme applyEventOverrideByIndex(size_t i,const Theme& base);\n'
          assert marker in s;s=s.replace(marker,marker+'extern bool eventAllowedInActiveSchedule(size_t i);\n',1)
          old='for(size_t i=0;i<EVENT_COUNT&&i<MAX_BUILTIN_EVENTS;i++){h^=(uint32_t)(eventStateEnabled(i)?(i+1):0);h*=16777619u;}'
          new='for(size_t i=0;i<EVENT_COUNT&&i<MAX_BUILTIN_EVENTS;i++){h^=(uint32_t)(eventStateEnabled(i)&&eventAllowedInActiveSchedule(i)?(i+1):0);h*=16777619u;}'
          assert old in s;s=s.replace(old,new,1)
          old='    if(!eventStateEnabled(i))continue;const auto&e=EVENTS[i];if(e.rule==RuleType::Month)continue;'
          new='    if(!eventStateEnabled(i)||!eventAllowedInActiveSchedule(i))continue;const auto&e=EVENTS[i];if(e.rule==RuleType::Month)continue;'
          assert old in s;s=s.replace(old,new,1)
          old='    if(i>=MAX_BUILTIN_EVENTS||!eventStateEnabled(i))continue;const auto&e=EVENTS[i];bool active=eventActiveOn(i,l);'
          new='    if(i>=MAX_BUILTIN_EVENTS||!eventStateEnabled(i)||!eventAllowedInActiveSchedule(i))continue;const auto&e=EVENTS[i];bool active=eventActiveOn(i,l);'
          assert old in s;s=s.replace(old,new,1)
          old='for(size_t i=0;i<EVENT_COUNT;i++){if(!eventStateEnabled(i)||EVENTS[i].rule==RuleType::Month)continue;'
          new='for(size_t i=0;i<EVENT_COUNT;i++){if(!eventStateEnabled(i)||!eventAllowedInActiveSchedule(i)||EVENTS[i].rule==RuleType::Month)continue;'
          assert old in s;s=s.replace(old,new,1)
          sched.write_text(s)

          # Schedules tab: new Major U.S. profile on top; relabel preserved 9/16 profiles.
          web=Path('firmware/web/index.html'); s=web.read_text()
          old='''      <div class="eventColorThemeBox">\n        <div><strong>Event Color Scheme</strong><div class="sub">Switch all non-customized built-in scheduled events between the preserved historical color assignments.</div></div>\n        <div class="eventColorThemeGrid" role="group" aria-label="Event color scheme">\n          <button id="eventColors3028" class="eventColorThemeTile" type="button" data-theme="3.0.28" aria-pressed="false"><span class="eventColorThemeCheck">✓</span><span class="eventColorThemeLetter">28</span><span><strong>3.0.28 Colors</strong><small>Original 9-color event scheme</small></span></button>\n          <button id="eventColors3029" class="eventColorThemeTile" type="button" data-theme="3.0.29" aria-pressed="true"><span class="eventColorThemeCheck">✓</span><span class="eventColorThemeLetter">29</span><span><strong>3.0.29 Colors</strong><small>Expanded 16-color event scheme</small></span></button>\n        </div>\n      </div>'''
          new='''      <div class="eventColorThemeBox">\n        <div><strong>Built-in Holiday Schedule</strong><div class="sub">Choose which built-in holiday calendar runs and which saved color palette it uses.</div></div>\n        <div class="eventColorThemeGrid" role="group" aria-label="Built-in holiday schedule">\n          <button id="eventColors1" class="eventColorThemeTile" type="button" data-theme="1" aria-pressed="false"><span class="eventColorThemeCheck">✓</span><span class="eventColorThemeLetter">1</span><span><strong>Major U.S. Government Holidays</strong><small>Basic Colors · original 9-color palette</small></span></button>\n          <button id="eventColors3028" class="eventColorThemeTile" type="button" data-theme="3.0.28" aria-pressed="false"><span class="eventColorThemeCheck">✓</span><span class="eventColorThemeLetter">9</span><span><strong>Expanded Holidays — Basic Colors</strong><small>9-color expanded holiday calendar</small></span></button>\n          <button id="eventColors3029" class="eventColorThemeTile" type="button" data-theme="3.0.29" aria-pressed="true"><span class="eventColorThemeCheck">✓</span><span class="eventColorThemeLetter">16</span><span><strong>Expanded Holidays — Expanded Colors</strong><small>16-color expanded holiday calendar</small></span></button>\n        </div>\n      </div>'''
          assert old in s;s=s.replace(old,new,1)
          s=s.replace('Searches the full 210-event calendar for the selected year.','Searches the selected built-in holiday calendar for the selected year.',1)
          old="let currentEventColorTheme='3.0.29';\nfunction renderEventColorTheme(theme){currentEventColorTheme=theme==='3.0.28'?'3.0.28':'3.0.29';[['3.0.28','eventColors3028'],['3.0.29','eventColors3029']].forEach(([v,id])=>{const b=$(id);if(b)b.setAttribute('aria-pressed',String(v===currentEventColorTheme))})}"
          new="let currentEventColorTheme='3.0.29';\nfunction renderEventColorTheme(theme){currentEventColorTheme=theme==='1'?'1':(theme==='3.0.28'?'3.0.28':'3.0.29');[['1','eventColors1'],['3.0.28','eventColors3028'],['3.0.29','eventColors3029']].forEach(([v,id])=>{const b=$(id);if(b)b.setAttribute('aria-pressed',String(v===currentEventColorTheme))})}"
          assert old in s;s=s.replace(old,new,1)
          old="async function chooseEventColorTheme(theme){if(theme===currentEventColorTheme)return;const b=$(theme==='3.0.28'?'eventColors3028':'eventColors3029');"
          new="async function chooseEventColorTheme(theme){if(theme===currentEventColorTheme)return;const b=$(theme==='1'?'eventColors1':(theme==='3.0.28'?'eventColors3028':'eventColors3029'));"
          assert old in s;s=s.replace(old,new,1)
          old="$('eventColors3028').addEventListener('click',()=>chooseEventColorTheme('3.0.28'));$('eventColors3029').addEventListener('click',()=>chooseEventColorTheme('3.0.29'));"
          new="$('eventColors1').addEventListener('click',()=>chooseEventColorTheme('1'));$('eventColors3028').addEventListener('click',()=>chooseEventColorTheme('3.0.28'));$('eventColors3029').addEventListener('click',()=>chooseEventColorTheme('3.0.29'));"
          assert old in s;s=s.replace(old,new,1)
          web.write_text(s)

          # Regression gates for the new calendar profile plus existing no-Breath/slow invariants.
          tests=Path('tools/test_regressions.py'); s=tests.read_text()
          s=s.replace('# v3.1.18 Breath restored, automatic events capped at Slow, preset names preserved','# v3.1.19 major U.S. holiday profile, relabeled expanded calendars, slow/no-Breath defaults',1)
          old="assert '/api/event-color-theme' in main+web and 'eventColors3028' in web and 'eventColors3029' in web"
          new="assert '/api/event-color-theme' in main+web and 'eventColors1' in web and 'eventColors3028' in web and 'eventColors3029' in web"
          assert old in s;s=s.replace(old,new,1)
          old="assert '<strong>3.0.28 Colors</strong>' in web and '<strong>3.0.29 Colors</strong>' in web\nassert 'Original 9-color event scheme' in web and 'Expanded 16-color event scheme' in web"
          new="assert '<strong>Major U.S. Government Holidays</strong>' in web\nassert '<span class=\"eventColorThemeLetter\">1</span>' in web and '<span class=\"eventColorThemeLetter\">9</span>' in web and '<span class=\"eventColorThemeLetter\">16</span>' in web\nassert '<strong>Expanded Holidays — Basic Colors</strong>' in web and '<strong>Expanded Holidays — Expanded Colors</strong>' in web"
          assert old in s;s=s.replace(old,new,1)
          marker="version=t('FIRMWARE_VERSION.txt').strip(); assert f'ANDERSON_FIRMWARE_VERSION=\"{version}\"' in main\n"
          extra='''assert 'EventColorTheme::MajorUS' in main and 'EventColorTheme::MajorUS' in original\nassert 'eventAllowedInActiveSchedule' in main and 'eventAllowedInActiveSchedule' in sched\nassert 'MAJOR_US_EVENT_INDEX[]={5,10,25,94,105,117,143,172,192,196,207}' in original\nassert 'MAJOR_US_EVENT_COLOR_INDEX' in original and 'eventColorPresetCount(EventColorTheme theme){return theme==EventColorTheme::V3029?16U:9U;}' in original\nfor name in ["New Year's Day","Martin Luther King Jr. Day","Presidents' Day / Washington's Birthday","Memorial Day","Juneteenth","Independence Day","Labor Day","Indigenous Peoples' Day / Columbus Day","Veterans Day","Thanksgiving","Christmas Day"]: assert name in ev,name\nmajor_colors=re.search(r'static constexpr uint8_t MAJOR_US_EVENT_COLOR_INDEX\\[\\]\\[4\\]=\\{(.*?)\\};',original,re.S); assert major_colors\nassert max(int(x) for x in re.findall(r'\\b\\d+\\b',major_colors.group(1)))<=8\nassert 'applyMajorUsEventColors' in original and 'resolvedPresetColor(PRESET_DEFAULTS[' in original\nassert 'Choose Major U.S., 9-color expanded, or 16-color expanded holidays' in main\n'''
          assert marker in s;s=s.replace(marker,extra+marker,1)
          tests.write_text(s)

          Path('firmware/RELEASE_NOTES_v3.1.19.md').write_text('''# Anderson Home v3.1.19\n\n- Adds a top-level Major U.S. Government Holidays built-in calendar using only the original nine color preset slots.\n- Major calendar includes the 11 nationwide U.S. federal holidays already represented in the built-in catalog.\n- Relabels the preserved 3.0.28 schedule as 9 / Expanded Holidays — Basic Colors.\n- Relabels the preserved 3.0.29 schedule as 16 / Expanded Holidays — Expanded Colors.\n- Major-holiday colors use nationally recognizable combinations from the original nine-color palette and honor calibrated preset values.\n- Built-in and custom scheduled scenes remain capped at Slow or Very Slow.\n- No built-in event or automatic scheduler scene is assigned Breath; Breath remains available for deliberate manual selection.\n''')

          # Do not keep the one-shot helper workflow in the validated release source.
          Path('.github/workflows/build-3.1.19-major-holidays.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Anderson Home v3.1.19 add major U.S. holiday calendar"
          git push origin HEAD:refs/heads/codex/3.1.19-major-holidays
      - name: Install build dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Run maintenance and recovery checks
        run: python tools/test_maintenance.py
      - name: Run regression checks
        run: python tools/test_regressions.py
      - name: Run audit checks
        run: python tools/test_audit_fixes.py
      - name: Check scheduled event coverage
        run: python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full
      - name: Verify major U.S. calendar invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          ev=Path('firmware/src/EventCatalog.cpp').read_text()
          th=Path('firmware/src/EventColorThemes.cpp').read_text()
          sched=Path('firmware/src/Scheduler.cpp').read_text()
          main=Path('firmware/src/main.cpp').read_text()
          web=Path('firmware/web/index.html').read_text()
          names=["New Year's Day","Martin Luther King Jr. Day","Presidents' Day / Washington's Birthday","Memorial Day","Juneteenth","Independence Day","Labor Day","Indigenous Peoples' Day / Columbus Day","Veterans Day","Thanksgiving","Christmas Day"]
          assert all(name in ev for name in names)
          assert 'MAJOR_US_EVENT_INDEX[]={5,10,25,94,105,117,143,172,192,196,207}' in th
          block=re.search(r'MAJOR_US_EVENT_COLOR_INDEX\[\]\[4\]=\{(.*?)\};',th,re.S); assert block
          assert max(map(int,re.findall(r'\b\d+\b',block.group(1))))<=8
          assert 'Effect::Breath' not in ev and 't.effect=Effect::Breath' not in sched
          speeds=re.search(r'EVENT_SPEEDS\[\]\s*=\s*\{(.*?)\};',ev,re.S); assert speeds
          vals=[int(x) for x in re.findall(r'\b\d+\b',speeds.group(1))]; assert len(vals)==210 and max(vals)<=2
          assert 'eventAllowedInActiveSchedule' in main and sched.count('eventAllowedInActiveSchedule')>=4
          assert 'eventColors1' in web and 'eventColorThemeLetter">9<' in web and 'eventColorThemeLetter">16<' in web
          print('Major U.S. holiday calendar invariants passed')
          PY
      - name: Prepare release
        run: python tools/release.py prepare
      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package verified firmware
        run: python tools/release.py package
      - name: Verify v3.1.19 packaged identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          r=json.loads(Path('release/release.json').read_text());f=Path('release/and_3.1.19.bin');data=f.read_bytes();digest=hashlib.sha256(data).hexdigest()
          assert r['version']=='3.1.19' and r['commit']==sha
          assert data and data[0]==0xE9 and len(data)<0x1E0000
          assert r['files'][f.name]['bytes']==len(data) and r['files'][f.name]['sha256']==digest
          print('bytes',len(data),'sha256',digest,'commit',sha)
          PY
      - name: Upload verified v3.1.19
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.19-Major-Holidays-Validated
          path: release/*
          if-no-files-found: error
