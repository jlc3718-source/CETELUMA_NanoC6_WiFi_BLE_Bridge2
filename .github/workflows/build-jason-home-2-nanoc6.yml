name: Build Jason Home 2 NanoC6
on:
  push:
    branches:
    - jason-home-2-nanoc6
    paths:
    - JasonHome2NanoC6/**
    - '!JasonHome2NanoC6/tools/prepare_snapshot.py'
    - '!JasonHome2NanoC6/tools/convert_backup.py'
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: jason-home-2-nanoc6
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/cache@v4
      with:
        path: '~/.platformio/platforms

          ~/.platformio/packages

          JasonHome2NanoC6/.pio/libdeps

          '
        key: jh2-nanoc6-pio-${{ hashFiles('JasonHome2NanoC6/platformio.ini') }}
    - run: python -m pip install platformio==6.2.0 esptool==5.5.0 Pillow==11.3.0
    - name: Prepare exact source and check protocols/migration
      run: 'python JasonHome2NanoC6/tools/prepare.py

        node JasonHome2NanoC6/tests/generate-vectors.mjs /tmp/jh2-vectors.tsv

        g++ -std=c++17 -O2 -I JasonHome2NanoC6/include JasonHome2NanoC6/tests/protocol-parity.cpp
        JasonHome2NanoC6/src/EufyProtocol.cpp -o /tmp/jh2-parity

        /tmp/jh2-parity /tmp/jh2-vectors.tsv

        g++ -std=c++17 -O2 -I JasonHome2NanoC6/src JasonHome2NanoC6/tests/smartdawn.cpp
        JasonHome2NanoC6/src/SmartDawnProtocol.cpp -o /tmp/jh2-curtain

        /tmp/jh2-curtain

        python -m unittest discover -s JasonHome2NanoC6/tests -p ''test_*.py''

        '
    - name: Mobile interface smoke test
      run: 'npm install --prefix /tmp/jh2-ui playwright@1.61.1 --no-audit --no-fund

        /tmp/jh2-ui/node_modules/.bin/playwright install --with-deps chromium

        NODE_PATH=/tmp/jh2-ui/node_modules CODEX_PRIMARY_RUNTIME_NODE_MODULES=/tmp/jh2-ui/node_modules
        node JasonHome2NanoC6/tests/ui-smoke.cjs

        '
    - name: Build two apps and settings volume
      run: 'python -m platformio run -d JasonHome2NanoC6 -e runtime -e boot -j 4

        python -m platformio run -d JasonHome2NanoC6 -e runtime -t buildfs

        python JasonHome2NanoC6/tools/package.py

        '
    - uses: actions/upload-artifact@v4
      with:
        name: Jason-Home-2-NanoC6-firmware
        path: JasonHome2NanoC6/release/
        if-no-files-found: error
        retention-days: 30
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Compile phone app
      shell: bash
      run: 'set -euo pipefail

        export ANDROID_HOME=/usr/local/lib/android/sdk

        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

        yes | sdkmanager --licenses >/dev/null 2>&1 || true

        sdkmanager "platforms;android-35" "build-tools;35.0.0"

        BT="$ANDROID_HOME/build-tools/35.0.0"

        JAR="$ANDROID_HOME/platforms/android-35/android.jar"

        OUT="$PWD/android-build"

        mkdir -p "$OUT/classes" "$OUT/dex"

        "$BT/aapt2" link -o "$OUT/base.apk" -I "$JAR" --manifest JasonHome2NanoC6/android/AndroidManifest.xml
        --min-sdk-version 26 --target-sdk-version 35

        javac --release 17 -cp "$JAR" -d "$OUT/classes" JasonHome2NanoC6/android/src/com/jasonhome2/app/*.java

        "$BT/d8" --min-api 26 --lib "$JAR" --output "$OUT/dex" "$OUT/classes/com/jasonhome2/app/"*.class

        (cd "$OUT/dex" && zip -q -u "$OUT/base.apk" classes.dex)

        "$BT/zipalign" -f 4 "$OUT/base.apk" "$OUT/Jason-Home-2-2.1.0-NanoC6-UNSIGNED.apk"

        "$BT/aapt2" dump badging "$OUT/Jason-Home-2-2.1.0-NanoC6-UNSIGNED.apk" | grep
        "package: name=''com.jasonhome2.app'' versionCode=''12'' versionName=''2.1.0''"

        cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"

        printf ''%s\n'' "$GITHUB_SHA" > "$OUT/source-commit.txt"

        '
    - uses: actions/upload-artifact@v4
      with:
        name: Jason-Home-2-NanoC6-Android-unsigned
        path: 'android-build/*UNSIGNED.apk

          android-build/apksigner.jar

          android-build/source-commit.txt

          '
        retention-days: 14
  publish:
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        name: Jason-Home-2-NanoC6-firmware
        path: release-work
    - name: Verify and sign dedicated channel
      env:
        OTA_SIGNING_KEY_B64: ${{ secrets.ANDERSON_OTA_SIGNING_KEY_B64 }}
      run: 'set -euo pipefail

        python release-work/flash.py --verify-only

        python - <<''PY''

        import json,os

        from pathlib import Path

        m=json.loads(Path(''release-work/release.json'').read_text())

        assert m[''commit'']==os.environ[''GITHUB_SHA'']

        PY

        test -n "$OTA_SIGNING_KEY_B64"

        key="$RUNNER_TEMP/jh2-ota-key.pem"

        trap ''rm -f "$key"'' EXIT

        printf ''%s'' "$OTA_SIGNING_KEY_B64" | base64 --decode > "$key"

        chmod 600 "$key"

        python JasonHome2NanoC6/tools/sign_manifest.py --key "$key" --release release-work/release.json
        --output release-work/latest.json

        '
    - name: Prepare release source without changing compiler inputs
      shell: bash
      run: "set -euo pipefail\npython - <<'PYTHON'\nimport json,os,urllib.request,urllib.error\n\
        from pathlib import Path\napi='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']\n\
        def call(path,data=None):\n    headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}\n\
        \    if data is not None:headers['Content-Type']='application/json'\n    request=urllib.request.Request(api+path,None\
        \ if data is None else json.dumps(data).encode(),headers)\n    with urllib.request.urlopen(request,timeout=45)\
        \ as response:return json.load(response)\nrepo=call('');source=os.environ['GITHUB_SHA'];default=call('/git/ref/heads/'+repo['default_branch'])['object']['sha']\n\
        source_commit=call('/git/commits/'+source);default_commit=call('/git/commits/'+default)\n\
        entries=call('/git/trees/'+default_commit['tree']['sha']+'?recursive=1')['tree']\n\
        workflows=next(x['sha'] for x in entries if x['path']=='.github/workflows'\
        \ and x['type']=='tree')\ntree=call('/git/trees',{'base_tree':source_commit['tree']['sha'],'tree':[{'path':'.github/workflows','mode':'040000','type':'tree','sha':workflows}]})['sha']\n\
        version=Path('JasonHome2NanoC6/VERSION').read_text().strip();branch='jh2-nanoc6-release-'+version\n\
        try:\n    target=call('/git/ref/heads/'+branch)['object']['sha']\n    assert\
        \ call('/git/commits/'+target)['tree']['sha']==tree,'Version exists with different\
        \ source; bump VERSION'\nexcept urllib.error.HTTPError as error:\n    if error.code!=404:raise\n\
        \    target=call('/git/commits',{'message':'Jason Home 2 NanoC6 '+version+'\
        \ release source (compiler inputs unchanged)','tree':tree,'parents':[default,source]})['sha']\n\
        \    call('/git/refs',{'ref':'refs/heads/'+branch,'sha':target})\nwith open(os.environ['GITHUB_ENV'],'a')\
        \ as output:output.write('RELEASE_SOURCE='+target+'\\n')\nprint('Prepared\
        \ release source; only CI definitions follow the default branch. Compiled\
        \ source:',source)\nPYTHON\n"
    - name: Publish installation candidate and verify public bytes
      shell: bash
      run: "set -euo pipefail\nVERSION=\"$(cat JasonHome2NanoC6/VERSION)\"\nTAG=\"\
        jason-home-2-nanoc6-v$VERSION\"\nif ! gh release view \"$TAG\" >/dev/null\
        \ 2>&1; then\n  gh release create \"$TAG\" --target \"$RELEASE_SOURCE\" --prerelease\
        \ --latest=false --title \"Jason Home 2 NanoC6 $VERSION \u2014 installation\
        \ candidate\" --notes-file JasonHome2NanoC6/TESTING.md\nelse\n  remote_sha=\"\
        $(gh api \"repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG\" --jq .object.sha)\"\
        \n  test \"$remote_sha\" = \"$RELEASE_SOURCE\"\nfi\ngh release upload \"$TAG\"\
        \ release-work/*.bin release-work/*.zip release-work/release.json release-work/SHA256SUMS\
        \ release-work/INSTALL.md release-work/TESTING.md release-work/latest.json\
        \ --clobber\nmkdir -p downloaded\ncurl --fail --location --retry 3 \"https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/jh2-runtime-$VERSION.bin\"\
        \ -o \"downloaded/jh2-runtime-$VERSION.bin\"\npython - <<'PY'\nimport json,hashlib\n\
        from pathlib import Path\nm=json.loads(Path('release-work/release.json').read_text());name=f\"\
        jh2-runtime-{m['version']}.bin\";data=Path('downloaded',name).read_bytes()\n\
        assert len(data)==m['files'][name]['bytes'] and hashlib.sha256(data).hexdigest()==m['files'][name]['sha256']\n\
        PY\n"
    - name: Advance Jason Home 2 channel only
      run: "set -euo pipefail\ncp release-work/latest.json \"$RUNNER_TEMP/jh2-latest.json\"\
        \ngit config user.name \"Jason Home 2 build\"\ngit config user.email \"325178451+jlc3718-source@users.noreply.github.com\"\
        \nif git ls-remote --exit-code origin refs/heads/jh2-nanoc6-ota >/dev/null\
        \ 2>&1; then\n  git fetch origin jh2-nanoc6-ota\n  git checkout -B jh2-nanoc6-ota\
        \ FETCH_HEAD\nelse\n  git checkout --orphan jh2-nanoc6-ota\n  git rm -rf .\
        \ >/dev/null\nfi\ncp \"$RUNNER_TEMP/jh2-latest.json\" latest.json\ngit add\
        \ latest.json\nif ! git diff --cached --quiet; then git commit -m \"Publish\
        \ signed Jason Home 2 NanoC6 runtime\"; git push origin HEAD:jh2-nanoc6-ota;\
        \ fi\n"
    - uses: actions/upload-artifact@v4
      with:
        name: Jason-Home-2-NanoC6-signed-channel
        path: ${{ runner.temp }}/jh2-latest.json
        retention-days: 30
  sign-android:
    needs:
    - android
    - publish
    runs-on:
    - self-hosted
    - Linux
    - ARM64
    - oracle
    - jason-home
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Repair ownership of this project's generated cache
      run: 'if test -d "$GITHUB_WORKSPACE/JasonHome2NanoC6/tools/__pycache__"; then
        sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/JasonHome2NanoC6/tools/__pycache__";
        fi

        '
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/download-artifact@v4
      with:
        name: Jason-Home-2-NanoC6-Android-unsigned
        path: sign-work
    - name: Sign with permanent Jason Home 2 identity
      shell: bash
      run: "set -euo pipefail\nKEYSTORE=/home/ubuntu/.jason-home-signing/jason-home-release.jks\n\
        PASSFILE=/home/ubuntu/.jason-home-signing/password\nif ! test -s \"$KEYSTORE\"\
        \ || ! test -s \"$PASSFILE\"; then\n  for base in /home/ubuntu/repo/JasonHome/Signing\
        \ /opt/jason-home-2; do\n    candidate=\"$base/jason-home-release.jks\"\n\
        \    candidate_pass=\"$base/password\"\n    if test -s \"$candidate\" && test\
        \ -s \"$candidate_pass\"; then\n      if keytool -list -v -keystore \"$candidate\"\
        \ -storepass:file \"$candidate_pass\" -alias jason-home 2>/dev/null | grep\
        \ -qi '76:B2:8E:FD:4F:5D:13:2A:D3:04:8F:19:BA:E6:C3:5A:A5:F8:4C:4A:39:0E:98:C8:0D:EE:EB:C0:C3:E7:3A:E1';\
        \ then KEYSTORE=\"$candidate\"; PASSFILE=\"$candidate_pass\"; break; fi\n\
        \    fi\n  done\nfi\ntest -s \"$KEYSTORE\" && test -s \"$PASSFILE\"\nKEYPASSFILE=\"\
        $RUNNER_TEMP/jh2-keypass-$GITHUB_RUN_ID\"\ncp \"$PASSFILE\" \"$KEYPASSFILE\"\
        \ntrap 'rm -f \"$KEYPASSFILE\"' EXIT\nOUT=Jason-Home-2-2.1.0-NanoC6-SIGNED.apk\n\
        java -jar sign-work/apksigner.jar sign --ks \"$KEYSTORE\" --ks-key-alias jason-home\
        \ --ks-pass \"file:$PASSFILE\" --key-pass \"file:$KEYPASSFILE\" --out \"$OUT\"\
        \ sign-work/Jason-Home-2-2.1.0-NanoC6-UNSIGNED.apk\njava -jar sign-work/apksigner.jar\
        \ verify --verbose --print-certs \"$OUT\" > signing-verification.txt\ngrep\
        \ -qi 'Signer #1 certificate SHA-256 digest: 76b28efd4f5d132ad3048f19bae6c35aa5f84c4a390e98c80deeebc0c3e73ae1'\
        \ signing-verification.txt\nsha256sum \"$OUT\" > APK-SHA256SUMS\n"
    - uses: actions/upload-artifact@v4
      with:
        name: Jason-Home-2-NanoC6-Android-signed
        path: '*NanoC6-SIGNED.apk

          APK-SHA256SUMS

          signing-verification.txt

          sign-work/source-commit.txt

          '
        retention-days: 30
  prepare-migration:
    runs-on:
    - self-hosted
    - Linux
    - ARM64
    - oracle
    - jason-home
    timeout-minutes: 5
    steps:
    - name: Repair ownership of this project's generated cache
      run: 'if test -d "$GITHUB_WORKSPACE/JasonHome2NanoC6/tools/__pycache__"; then
        sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/JasonHome2NanoC6/tools/__pycache__";
        fi

        '
    - uses: actions/checkout@v4
    - name: Prepare private migration snapshot without changing automation
      run: 'target="$RUNNER_TEMP/jh2-migration-$GITHUB_RUN_ID"

        mkdir -p -m 700 "$target"

        trap ''sudo chown -R "$(id -u):$(id -g)" "$target"'' EXIT

        sudo python3 -B JasonHome2NanoC6/tools/prepare_snapshot.py --output "$target"

        '
    - name: Encrypt migration files for their owner
      run: 'target="$RUNNER_TEMP/jh2-migration-$GITHUB_RUN_ID"

        (cd "$target" && python3 -m zipfile -c "$RUNNER_TEMP/jh2-migration-$GITHUB_RUN_ID.zip"
        *.json)

        openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/jh2-migration-$GITHUB_RUN_ID.zip"
        -out "$RUNNER_TEMP/jh2-migration-$GITHUB_RUN_ID.p7m" -outform DER .github/certs/jh2-migration-recipient.pem

        rm "$RUNNER_TEMP/jh2-migration-$GITHUB_RUN_ID.zip"

        '
    - uses: actions/upload-artifact@v4
      with:
        name: Jason-Home-2-NanoC6-ENCRYPTED-migration
        path: ${{ runner.temp }}/jh2-migration-${{ github.run_id }}.p7m
        retention-days: 7
        if-no-files-found: error
  publish-android:
    needs:
    - sign-android
    - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: Jason-Home-2-NanoC6-Android-signed
        path: signed
    - name: Publish verified APK
      run: 'set -euo pipefail

        VERSION="$(cat JasonHome2NanoC6/VERSION)"

        (cd signed && sha256sum -c APK-SHA256SUMS)

        gh release upload "jason-home-2-nanoc6-v$VERSION" signed/*SIGNED.apk signed/APK-SHA256SUMS
        signed/signing-verification.txt --clobber

        '
