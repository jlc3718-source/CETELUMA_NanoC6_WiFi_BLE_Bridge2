name: Patch Anderson v4.0.6 OTA and CPU

on:
  push:
    branches: ['codex/release-current']
    paths: ['.github/workflows/patch-v406.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-current
          fetch-depth: 0
      - name: Apply fixes and advance to 4.0.6
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firmware/include/NetworkClient.h')
          s=p.read_text()
          old='''    if(n==0)connected_=false;\n    return n;\n'''
          new='''    // A zero-length read can be transient on ESP-IDF HTTPS streams.\n    // Only declare EOF when the HTTP client confirms the response is complete.\n    if(n==0&&esp_http_client_is_complete_data_received(h_))connected_=false;\n    return n;\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('firmware/src/main.cpp')
          s=p.read_text()
          old='''  delay(2);\n}\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,'''  // 10 ms cooperative idle keeps BLE timing responsive while avoiding a hot main loop.\n  delay(10);\n}\n''',1))
          PY
          python tools/release.py bump
          python tools/release.py bump
          test "$(cat FIRMWARE_VERSION.txt)" = "4.0.6"
          python tools/test_maintenance.py
          python tools/test_regressions.py
          python tools/test_audit_fixes.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FIRMWARE_VERSION.txt README.md firmware/include/NetworkClient.h firmware/src/main.cpp firmware/sdkconfig.defaults
          git commit -m "Anderson Home 4.0.6: fix OTA zero-byte reads and hot loop"
          git push origin HEAD:refs/heads/codex/release-current
