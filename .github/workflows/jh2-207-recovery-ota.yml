name: JH2 2.0.7 BLE Stability, Reboot Diagnostics and Persistent Auto OTA
on:
  push:
    branches:
      - fix/jh2-2.0.7-oracle-root-ble-reconnect-20261025
    paths:
      - JasonHome2NanoC6_IDF/**
      - .github/workflows/jh2-207-recovery-ota.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: jh2-207-runtime-ci
  cancel-in-progress: false
jobs:
  compile-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Validate A/B firmware and secret-handling policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          partition = Path("JasonHome2NanoC6_IDF/partitions.csv").read_text()
          factory = Path("JasonHome2NanoC6_Rescue/partitions.csv").read_text()
          assert [x.strip() for x in partition.splitlines() if x.strip() and not x.startswith("#")] == [x.strip() for x in factory.splitlines() if x.strip() and not x.startswith("#")], "Runtime and rescue partition maps differ"
          assert "runtime, app, ota_0, 0x110000, 0x160000" in partition
          assert "runtime_b, app, ota_1, 0x270000, 0x160000" in partition
          assert "rescue, app, factory, 0x10000, 0x100000" in partition
          web = Path("JasonHome2NanoC6_IDF/main/web_recovery.c").read_text()
          bridge = Path("JasonHome2NanoC6_IDF/main/bridge.c").read_text()
          runtime = Path("JasonHome2NanoC6_IDF/main/main.c").read_text()
          mark=re.search(r'"(JH2V200PRIVATEORACLETOKENREPLACEME_+)"',web)
          assert mark and len(mark.group(1)) == 64, "Exactly 64-byte placeholder required"
          assert 'seed_embedded_oracle_if_missing();' in web
          assert 'read_saved();' in web
          assert web.index('if(!start_net())') < web.index('fs_ready=mount_store();'), "Filesystem initialized before AP"
          assert web.index('httpd_register_uri_handler') < web.index('fs_ready=mount_store();'), "HTTP not registered before filesystem"
          assert 'static const char *ORACLE_HTML' in web
          assert 'oracle_autolink_post' in web and 'oracle_link_status_get' in web
          assert '/settings/oracle' in web
          assert 'jh2_bridge_autolink_request()' in web
          assert 'CONFIG_ESP_MAIN_TASK_STACK_SIZE=16384' in Path("JasonHome2NanoC6_IDF/sdkconfig.defaults").read_text()
          assert 'jh2_bridge_start();' not in runtime
          assert '2.0.6 setup AP ready' in runtime  # unchanged AP startup log preserved
          assert 'jh2_bridge_autolink_request(void)' in Path("JasonHome2NanoC6_IDF/main/bridge.c").read_text()
          assert 'https_json("/api/curtain-bridge/bootstrap",NULL)' in bridge
          assert 'const wifi_mode_t mode=saved_ssid[0]?WIFI_MODE_APSTA:WIFI_MODE_AP;' in web, "First boot must be AP-only"
          assert 'WIFI_EVENT_AP_STACONNECTED' in web and 'WIFI_EVENT_AP_STADISCONNECTED' in web
          assert 'SETUP_AP_CLIENT_JOINED' in web and 'SETUP_AP_CLIENT_LEFT' in web
          assert 'setupApJoinEvents' in web and 'setupApLastLeaveReason' in web
          # LAN homepage redirects only after a verified Oracle link.
          assert 'home_lan_request(r)' in web
          assert 'httpd_resp_set_hdr(r,"Location","http://150.136.245.51/jason");' in web
          assert 'if(strcmp(r->uri,"/")==0 && home_lan_request(r))' in web
          assert 'HOME_LAN_WEB=http://' in web
          assert 'const char *page=bluetooth_settings?BLE_HTML' in web
          assert 'static const char *BLE_HTML' in web
          assert '/settings/bluetooth' in web
          assert 'jh2_ble_full_scan()' in web and 'jh2_ble_reconnect_last()' in web
          assert '/api/ble/reconnect-last' in web
          assert 'static void setup_ap_guard_task(void *arg)' in web
          assert 'now-sta_ip_since_us>=20000000LL' in web
          assert 'now-wifi_down_since>=45000000LL' in web
          assert 'setupApAutoShutdownEnabled' in web
          assert 'cJSON_AddStringToObject(o,"oracleWebUrl",saved_oracle_endpoint);' in web
          assert 'cfg.server_port=80;' in web
          assert 'cJSON_AddStringToObject(o,"homeIp",assigned_ip);' in web
          assert 'Bluetooth deferred until home Wi-Fi connects' in runtime
          assert 'start_ble_after_home_wifi();' in runtime
          assert 'nimble_port_init();' not in runtime.split('void app_main(void){',1)[1]
          assert 'start_ble_after_home_wifi(void)' in runtime
          assert 'xEventGroupGetBits(group)&BIT0' in runtime
          assert 'cJSON_AddStringToObject(out,"state",jh2_bridge_autolink_status())' in web
          assert 'valid_hex(jh2_builtin_oracle_token)' in web
          assert 'esp_wifi_set_mode(WIFI_MODE_APSTA)!=ESP_OK' in web
          assert 'if(saved_ssid[0]){' in web, "Unconfigured Wi-Fi must not connect"
          assert 'pdMS_TO_TICKS(15000)' in web, "Working 1.1.79 retry interval missing"
          assert 'esp_wifi_set_storage(WIFI_STORAGE_RAM)' not in web, "Original 1.1.79 storage semantics were changed"
          assert 'WIFI_AUTH_OPEN' in web and 'JH2-Nano-Fresh' in web
          disconnect=web.split('if(event==WIFI_EVENT&&id==WIFI_EVENT_STA_DISCONNECTED){',1)[1].split('if(event==IP_EVENT',1)[0]
          assert 'esp_wifi_connect()' not in disconnect, "Immediate disconnected-event retry regression"
          assert web.index('ap_netif=esp_netif_create_default_wifi_ap();') < web.index('sta_netif=esp_netif_create_default_wifi_sta();')
          assert 'lastWifiDisconnectReason' in web and 'homeWifiRetryAttempts' in web
          assert 'homeWifiConfigured' in web and 'homeIp' in web
          assert "if(enabled){ESP_LOGW(TAG" not in bridge, "Automatic OTA still blocked"
          assert 'firmware_auto_update=stored==1' in bridge
          assert 'jh2_ota_install_staged' in bridge
          assert 'jh2_ota_stage_signed' in bridge
          assert 'start_oracle_after_home_wifi();' in runtime
          assert 'ble_scan_only' in runtime
          # Stability regression checks: no scan/reconnect recursion, no
          # forced 2M PHY, reconnect backoff, persistent OTA and reset codes.
          assert 'BLE_HS_FOREVER' not in runtime
          assert 'ble_gap_set_prefered_le_phy(' not in runtime
          assert 'schedule_ble_retry("disconnected")' in runtime
          assert 'BLE_RETRY_SCHEDULED' in runtime
          assert 'ble_service_tick();' in runtime
          assert 'BLE_STABILITY_MODE retaining controller default PHY' in runtime
          assert 'BLE_RETRY_SCHEDULED' in runtime
          assert 'ble_connect_pending=true;' in runtime
          assert 'nativeRetryInSeconds' in runtime
          assert 'jh2_runtime_boot_diagnostics(status);' in bridge
          assert 'bootCounter' in runtime and 'espResetReason' in runtime
          assert 'jh2_runtime_boot_diagnostics(o);' in web
          assert 'confirmed.signedAutoUpdate!==enabled' in web
          assert 'if(!autoPreferenceSaving)' in web
          assert 'AUTO_SIGNED_OTA_PERSISTED' in bridge
          assert 'nvs_get_u8(n,"auto",&enabled)' in bridge
          assert bridge.count('now_us>=300000000LL')==2
          assert 'jH2dangerousErase' not in runtime

          assert 'BLE_FULL_SCAN_COMPLETE' in runtime
          assert 'if(!selected && !named)return 0;' in runtime
          assert 'ble_last_connect_error=event->connect.status;' in runtime
          assert 'BLE_FULL_SCAN_COMPLETE found=%u; reconnect resumed' in runtime
          assert 'bool jh2_ble_reconnect_last(void)' in runtime
          assert 'nvs_set_blob(n,"target",&addr,sizeof(addr))' in runtime
          assert 'jh2_ota_status(o);' in web and '/api/firmware/stage' in web
          assert 'jh2_bridge_set_auto_update_enabled(true)' in web
          assert 'mbedtls_sha256_finish' in Path("JasonHome2NanoC6_IDF/main/signed_ota.c").read_text()
          assert 'esp_ota_get_next_update_partition' in Path("JasonHome2NanoC6_IDF/main/signed_ota.c").read_text()
          assert 'esp_ota_set_boot_partition(ota_staged_partition)' in Path("JasonHome2NanoC6_IDF/main/signed_ota.c").read_text()
          assert 'if(!fs_ready)return;' not in web.split('static void read_saved(void){',1)[1].split('static bool save_config',1)[0], "NVS fallback lost when LittleFS unavailable"
          assert '2.0.7-native-upload-flow' in web
          assert 'strlcpy((char *)cfg.ap.ssid,"JH2-Nano-Fresh",sizeof(cfg.ap.ssid))' in web
          assert 'cfg.ap.authmode=WIFI_AUTH_OPEN' in web
          assert 'if(!jh2_web_has_oracle_credentials())' not in runtime
          assert 'NATIVE_FW_VERSION "2.0.7"' in bridge
          assert '2.0.6 setup AP ready' in runtime  # unchanged AP startup log preserved
          assert 'nvs_open("jh2basic",NVS_READONLY' in web
          assert 'failsafe_confirm_after_60s();' in runtime
          assert '#define NATIVE_FW_VERSION "2.0.7"' in bridge
          assert "Remote OTA locked off" not in Path("JasonHome2NanoC6_IDF/main/signed_ota.c").read_text()
          assert 'CONFIG_ESP_MAIN_TASK_STACK_SIZE=16384' in Path("JasonHome2NanoC6_IDF/sdkconfig.defaults").read_text()
          print("JH2_207_A_B_WIFI_MANUAL_ORACLE_BOOTSTRAP_SOURCE_VERIFIED")
          PY
          gcc -std=c11 -Wall -Wextra -Werror -O2 JasonHome2NanoC6_IDF/main/native_slot_guard.c JasonHome2NanoC6_IDF/tests/native_slot_guard_test.c -o /tmp/guard207
          /tmp/guard207
      - name: Enable native Oracle, BLE, manual browser recovery
        shell: bash
        run: |
          cat >> JasonHome2NanoC6_IDF/sdkconfig.defaults <<'EOF'
          CONFIG_JH2_NATIVE_ENABLE_ORACLE=y
          CONFIG_JH2_NATIVE_BROWSER_OTA_COMPAT=y
          CONFIG_JH2_NATIVE_READONLY_ACCEPTANCE=n
          EOF
      - name: Compile ESP32-C6 A/B runtime (ESP-IDF 5.5.1)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32c6
          path: JasonHome2NanoC6_IDF
          command: idf.py build
      - name: Validate image, size, token marker and output checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jh2-207-output
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          app=Path("JasonHome2NanoC6_IDF/build/jh2_native_ble_probe.bin").read_bytes()
          assert 0<len(app)<=0x160000,("Runtime exceeds 1.375MiB OTA slot",len(app))
          assert app[0]==0xe9, "Not an ESP image"
          marker=b"JH2V200PRIVATEORACLETOKENREPLACEME".ljust(64,b"_")
          assert len(marker)==64
          assert app.count(marker)==1, "Unique private 64-byte patch point missing"
          assert b"2.0.7-native-upload-flow" in app
          assert b"JH2-Nano-Fresh" in app
          assert b"c6e361f91c250cbb" in app
          assert b"https://150.136.245.51/jason-home-2" in app
          out=Path("jh2-207-output/JH2-NanoC6-2.0.7-RUNTIME-UNPERSONALIZED.bin")
          out.write_bytes(app)
          sha=hashlib.sha256(app).hexdigest()
          manifest={"version":"2.0.7","base":"1.1.78","dual_slot_runtime":True,
            "slot_max_bytes":0x160000,"runtime_bytes":len(app),"runtime_sha256":sha,
            "private_oracle_token_embedded":False,"wifi_config":"manual",
            "original_recovery_preserved":True,"auto_install":False,
            "hardware_verified":False,"source_commit":os.environ["GITHUB_SHA"]}
          Path("jh2-207-output/manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          Path("jh2-207-output/README.txt").write_text(
            "2.0.7 Wi-Fi recovery candidate, requires private personalization. DO NOT INSTALL AS-IS.\n"
            "Contains an intentionally invalid 64-byte Oracle token placeholder.\n"
            "Do not publish the final token-personalized BIN in public GitHub Actions or releases.\n"
            "Private customization must regenerate ESP image integrity and verify device pairing.\n"
            "Use local A/B updater; do not change bootloader, recovery or partition table.\n")
          print("JH2_207_COMPILED",len(app),sha)
          PY
          cd jh2-207-output && sha256sum *.bin
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-2.0.7-RUNTIME-UNPERSONALIZED-CI
          path: jh2-207-output/
          retention-days: 14
          if-no-files-found: error

  sign-publish:
    needs: compile-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JH2-2.0.7-RUNTIME-UNPERSONALIZED-CI
          path: unsigned-runtime
      - name: Verify, ECDSA-sign, and publish runtime
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_SIGNING_KEY_B64: ${{ secrets.ANDERSON_OTA_SIGNING_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-package
          cp unsigned-runtime/JH2-NanoC6-2.0.7-RUNTIME-UNPERSONALIZED.bin signed-package/jh2-runtime-2.0.7.bin
          python3 - <<'PY'
          from pathlib import Path
          import os,hashlib,json
          b=Path('signed-package/jh2-runtime-2.0.7.bin').read_bytes()
          m=json.loads(Path('unsigned-runtime/manifest.json').read_text())
          sha=hashlib.sha256(b).hexdigest()
          assert m['source_commit']==os.environ['GITHUB_SHA']
          assert m['version']=='2.0.7' and m['runtime_sha256']==sha and m['runtime_bytes']==len(b)
          assert m['private_oracle_token_embedded'] is False
          assert 0x100000<len(b)<=0x160000 and b[0]==0xe9
          assert b.count(b'JH2V200PRIVATEORACLETOKENREPLACEME'.ljust(64,b'_'))==1
          assert b'2.0.7-native-upload-flow' in b
          assert b'JH2-Nano-Fresh' in b
          assert b'http://150.136.245.51/jason' in b
          release={'product':'jason-home-2-nanoc6','version':'2.0.7','commit':os.environ['GITHUB_SHA'],
                   'files':{'jh2-runtime-2.0.7.bin':{'bytes':len(b),'sha256':sha}}}
          Path('signed-package/release.json').write_text(json.dumps(release,indent=2)+'\n')
          print('JH2_207_RUNTIME_VERIFIED',len(b),sha)
          PY
          test -n "$OTA_SIGNING_KEY_B64"
          key="$RUNNER_TEMP/jh2-207-sign.pem"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          printf '%s' "$OTA_SIGNING_KEY_B64" | base64 -d > "$key"
          chmod 600 "$key"
          python3 JasonHome2NanoC6/tools/sign_manifest.py --key "$key" --release signed-package/release.json --output signed-package/latest.json
          python3 - <<'PY'
          import base64,subprocess,tempfile,json,hashlib
          from pathlib import Path
          m=json.loads(Path('signed-package/latest.json').read_text())
          with tempfile.TemporaryDirectory() as x:
            p=Path(x)
            (p/'payload').write_text(m['payload'])
            (p/'signature').write_bytes(base64.b64decode(m['signature']))
            subprocess.run(['openssl','dgst','-sha256','-verify','remote-update/anderson_ota_signing_public.pem','-signature',str(p/'signature'),str(p/'payload')],check=True)
          print('JH2_207_OTA_SIGNATURE_VERIFIED')
          PY
          tag="jason-home-2-nanoc6-v2.0.7"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; verifying exact content instead of overwriting"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'jh2-runtime-2.0.7.bin' --dir "$RUNNER_TEMP/existing"
            cmp "$RUNNER_TEMP/existing/jh2-runtime-2.0.7.bin" signed-package/jh2-runtime-2.0.7.bin
          else
            gh release create "$tag" signed-package/jh2-runtime-2.0.7.bin signed-package/latest.json signed-package/release.json --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "Jason Home 2 Nano C6 2.0.7 - Oracle root and SmartDawn BLE reconnect" --notes "Signed A/B runtime only. Redirect local LAN / to Oracle /jason; retain local setup and rescue. Resume BLE after discovery and accept selected/recovered SmartDawn address."
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'jh2-runtime-2.0.7.bin' --dir "$RUNNER_TEMP/verify-release"
          cmp "$RUNNER_TEMP/verify-release/jh2-runtime-2.0.7.bin" signed-package/jh2-runtime-2.0.7.bin
          echo 'JH2_207_PUBLIC_RELEASE_VERIFIED'
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-2.0.7-SIGNED-ORACLE-OTA
          path: signed-package/
          retention-days: 45
          if-no-files-found: error
  stage-oracle:
    needs: sign-publish
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JH2-2.0.7-SIGNED-ORACLE-OTA
          path: signed-package
      - name: Verify signed runtime and atomically activate Oracle OTA channel
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -n --preserve-env=GITHUB_WORKSPACE python3 - <<'PY'
          from pathlib import Path
          import os,hashlib,json,base64,subprocess,tempfile,shutil
          work=Path(os.environ['GITHUB_WORKSPACE'])/'signed-package'
          repo=Path(os.environ['GITHUB_WORKSPACE'])
          names=('jh2-runtime-2.0.7.bin','latest.json','release.json')
          assert all((work/x).is_file() for x in names)
          m=json.loads((work/'latest.json').read_text())
          f=dict(row.split('=',1) for row in m['payload'].strip().splitlines())
          b=(work/names[0]).read_bytes()
          info=json.loads((work/'release.json').read_text())
          assert f['product']=='jason-home-2-nanoc6' and f['version']=='2.0.7'
          assert f['commit']==info['commit']==os.environ['GITHUB_SHA']
          assert hashlib.sha256(b).hexdigest()==f['sha256']==info['files'][names[0]]['sha256']
          assert len(b)==int(f['bytes']) and len(b)<=0x160000 and b[0]==0xe9
          with tempfile.TemporaryDirectory() as d:
            p=Path(d);(p/'payload').write_text(m['payload'])
            (p/'sig').write_bytes(base64.b64decode(m['signature']))
            subprocess.run(['openssl','dgst','-sha256','-verify',str(repo/'remote-update/anderson_ota_signing_public.pem'),'-signature',str(p/'sig'),str(p/'payload')],check=True)
          docker=json.loads(subprocess.check_output(['docker','inspect','jason-home-2-web'],text=True))[0]
          mounts=[x for x in docker['Mounts'] if x['Destination']=='/data' and x['Type']=='bind']
          assert len(mounts)==1
          root=Path(mounts[0]['Source'])/'signed-ota'
          assert root.is_dir()
          dest=root/'2.0.7'
          if dest.exists():
            assert all((dest/x).read_bytes()==(work/x).read_bytes() for x in names)
          else:
            temp=root/('.2.0.7-'+str(os.getpid()))
            temp.mkdir(mode=0o755)
            try:
              for x in names:shutil.copy2(work/x,temp/x)
              temp.rename(dest)
            except BaseException:
              shutil.rmtree(temp,ignore_errors=True);raise
          approved=root/'approved'
          if approved.exists() or approved.is_symlink():
            old=json.loads((approved/'latest.json').read_text())
            older=dict(line.split('=',1) for line in old['payload'].strip().splitlines())['version']
            assert tuple(map(int,older.split('.')))<=(2,0,7),'Refusing downgrade'
            if not approved.is_symlink():
              approved.rename(root/('approved-backup-207-'+str(os.getpid())))
          link=root/('.approved-207-'+str(os.getpid()))
          link.symlink_to('2.0.7',target_is_directory=True)
          os.replace(link,approved)
          assert all((approved/x).read_bytes()==(work/x).read_bytes() for x in names)
          print('ORACLE_207_SIGNED_OTA_STAGED',len(b),f['sha256'],flush=True)
          PY
          sudo -n docker exec jason-home-2-web node -e '
          (async()=>{
          const base="http://127.0.0.1:"+(process.env.JH2_PORT||8081);
          const r=await fetch(base+"/api/curtain/firmware-manifest");const d=await r.json();
          if(!r.ok||!d.payload.includes("version=2.0.7"))throw Error("Oracle OTA manifest mismatch");
          const b=await fetch(base+"/api/curtain/firmware-runtime/2.0.7.bin");
          if(!b.ok)throw Error("Oracle runtime unavailable");
          console.log("ORACLE_207_SIGNED_RUNTIME_HTTP_200",Number(b.headers.get("content-length")));
          })().catch(e=>{console.error(e);process.exitCode=1});'
