name: Publish Anderson Home Firmware

on:
  workflow_run:
    workflows: ["Build Anderson Home Firmware"]
    types: [completed]

concurrency:
  group: anderson-production-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'codex/release-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Resolve production version
        run: |
          VERSION="$(tr -d '\r\n' < FIRMWARE_VERSION.txt)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+[a-z]?$ ]]
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "OTA_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/anderson-v$VERSION/and_$VERSION.bin" >> "$GITHUB_ENV"
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main "$HEAD_SHA"
      - name: Download exact successful build artifact
        run: gh run download "$BUILD_RUN_ID" --name "Anderson-Home-NanoC6-v$VERSION" --dir release-work
      - name: Verify artifact identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('release-work'); version=os.environ['VERSION']; head=os.environ['HEAD_SHA']
          manifest=json.loads((root/'release.json').read_text())
          name=f'and_{version}.bin'; data=(root/name).read_bytes(); digest=hashlib.sha256(data).hexdigest()
          assert manifest['version']==version
          assert manifest['commit']==head
          assert manifest['ota_slot_bytes']==0x1E0000
          assert data and data[0]==0xE9 and len(data)<0x1E0000
          assert manifest['files'][name]['bytes']==len(data)
          assert manifest['files'][name]['sha256']==digest
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'OTA_BYTES={len(data)}\nOTA_SHA256={digest}\n')
          PY
      - name: Wait for exact signed OTA manifest
        run: |
          mkdir -p publish-input
          for attempt in $(seq 1 120); do
            encoded="$(gh api "/repos/$GITHUB_REPOSITORY/contents/remote-update/pending/$VERSION.json?ref=ota" --jq '.content' 2>/dev/null || true)"
            if [ -n "$encoded" ]; then
              printf '%s' "$encoded" | tr -d '\n' | base64 --decode > publish-input/latest.json
              break
            fi
            sleep 5
          done
          test -s publish-input/latest.json
          python tools/verify_ota_manifest.py \
            --manifest publish-input/latest.json \
            --version "$VERSION" \
            --bytes "$OTA_BYTES" \
            --sha256 "$OTA_SHA256" \
            --commit "$HEAD_SHA" \
            --url "$OTA_URL"
      - name: Publish or verify stable release
        run: |
          TAG="anderson-v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "release-work/and_$VERSION.bin" release-work/release.json \
              --target "$HEAD_SHA" --title "Anderson Home v$VERSION" \
              --notes "Verified Anderson Home production release from commit $HEAD_SHA. APP-only OTA image and release manifest were produced by the successful firmware build."
          fi
          rm -rf public-check && mkdir public-check
          gh release download "$TAG" --pattern "and_$VERSION.bin" --pattern release.json --dir public-check
          cmp "release-work/and_$VERSION.bin" "public-check/and_$VERSION.bin"
          cmp release-work/release.json public-check/release.json
      - name: Promote the preverified OTA manifest
        run: |
          git fetch origin ota --quiet
          rm -rf ../anderson-ota
          git worktree add -B ota-release ../anderson-ota origin/ota
          mkdir -p ../anderson-ota/remote-update/pending
          cp publish-input/latest.json ../anderson-ota/remote-update/latest.json
          rm -f "../anderson-ota/remote-update/pending/$VERSION.json"
          cd ../anderson-ota
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add remote-update/latest.json remote-update/pending
          if ! git diff --cached --quiet; then
            git commit -m "Publish signed Anderson Home v$VERSION OTA manifest"
            git push origin HEAD:refs/heads/ota
          fi
      - name: Fast-forward production main
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main "$HEAD_SHA"
          git push origin "$HEAD_SHA:refs/heads/main"
      - name: Production housekeeping
        continue-on-error: true
        env:
          CLEAN_RELEASES: '1'
          DELETE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BRANCH_MAX_AGE_HOURS: '2'
        run: |
          bash .github/scripts/anderson-retention.sh
          bash .github/scripts/anderson-cache-cleanup.sh
          bash .github/scripts/anderson-branch-cleanup.sh
