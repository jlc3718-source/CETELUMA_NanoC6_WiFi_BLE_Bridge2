name: Test Anderson NimBLE Log Trim

on:
  push:
    branches: ['codex/3.1.24-lean-nimble-logs']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Restore PlatformIO dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
            firmware/.pio/libdeps
          key: ${{ runner.os }}-pio-v1-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-v1-
      - name: Validate source and schedules
        run: |
          python tools/test_maintenance.py
          python tools/test_regressions.py
          python tools/test_audit_fixes.py
          python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full
      - name: Prepare generated web and recovery headers
        run: python tools/release.py prepare
      - name: Compile log-trimmed firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Compare exact image size
        run: |
          python - <<'PY'
          from pathlib import Path
          ini=Path('firmware/platformio.ini').read_text()
          assert '-DCONFIG_BT_NIMBLE_LOG_LEVEL=5' in ini
          assert '-DCONFIG_NIMBLE_CPP_LOG_LEVEL=0' in ini
          p=Path('firmware/.pio/build/m5stack-nanoc6/firmware.bin')
          assert p.exists()
          size=p.stat().st_size
          baseline=1817392
          print(f'NIMBLE_LOG_TRIM_BIN_BYTES={size}')
          print(f'PRODUCTION_3_1_23_BYTES={baseline}')
          print(f'SAVED_BYTES={baseline-size}')
          print(f'SAVED_PERCENT={(baseline-size)*100/baseline:.3f}')
          assert size < baseline, 'NimBLE log trim produced no firmware-size benefit'
          PY
      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-NimBLE-Log-Trim-Comparison
          path: |
            firmware/.pio/build/m5stack-nanoc6/firmware.bin
            firmware/.pio/build/m5stack-nanoc6/firmware.elf
          if-no-files-found: error
