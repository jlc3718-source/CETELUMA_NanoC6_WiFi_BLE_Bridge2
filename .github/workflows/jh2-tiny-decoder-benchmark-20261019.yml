name: Jason Home 2 isolated tiny decoder image benchmark
on:
  push:
    branches: [codex/jh2-image-model-benchmark-20261019]
    paths: ['.github/workflows/jh2-tiny-decoder-benchmark-20261019.yml']
permissions: {contents: read}
concurrency: {group: jason-home-oracle-production, cancel-in-progress: false}
jobs:
  benchmark:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 18
    steps:
      - name: Generate actual isolated model images with CPU, memory and headroom guards
        shell: bash
        run: |
          python3 - <<'PYTHON'
          """Finite, no-network inference tests. Only new benchmark containers/files are touched."""
          import hashlib,json,os,pathlib,struct,subprocess,time,urllib.request
          ROOT=pathlib.Path('/opt/jh2-image-benchmark-20261019')
          setup=json.loads((ROOT/'runtime_setup_result.json').read_text())
          assert setup['returnCode']==0
          model=json.loads((ROOT/'model_manifest.json').read_text())
          OUTPUT=ROOT/'output'/'tiny-decoder'
          OUTPUT.mkdir(exist_ok=True)
          # Resolve official publisher metadata once, then download an immutable revision.
          api='https://huggingface.co/api/models/madebyollin/taesd?blobs=true'
          with urllib.request.urlopen(api,timeout=45) as r: metadata=json.load(r)
          revision=metadata['sha'];assert len(revision)==40 and all(c in '0123456789abcdef' for c in revision)
          entry=next(x for x in metadata['siblings'] if x['rfilename']=='diffusion_pytorch_model.safetensors')
          expected=entry['lfs']['sha256'];assert len(expected)==64
          decoder=ROOT/'models'/'taesd-official.safetensors'
          url='https://huggingface.co/madebyollin/taesd/resolve/'+revision+'/diffusion_pytorch_model.safetensors'
          if not decoder.exists() or hashlib.sha256(decoder.read_bytes()).hexdigest()!=expected:
              with urllib.request.urlopen(url,timeout=90) as r: data=r.read(15*1024**2)
              assert hashlib.sha256(data).hexdigest()==expected
              decoder.write_bytes(data)
          assert decoder.stat().st_size==entry['size']
          with urllib.request.urlopen('https://raw.githubusercontent.com/madebyollin/taesd/d968ebf70e930b76243c773a63162ed94482361f/LICENSE',timeout=30) as r: license_text=r.read()
          assert b'MIT License' in license_text
          (ROOT/'models'/'TAESD-LICENSE.txt').write_bytes(license_text)
          tae={'repository':'madebyollin/taesd','revision':revision,'file':decoder.name,'sha256':expected,'bytes':decoder.stat().st_size,'license':'MIT','licenseSourceRevision':'d968ebf70e930b76243c773a63162ed94482361f'}
          (OUTPUT/'decoder_manifest.json').write_text(json.dumps(tae,indent=2))
          print('DECODER_MANIFEST '+json.dumps(tae),flush=True)
          def docker(*args,**kw):return subprocess.run(['sudo','-n','docker',*args],capture_output=True,text=True,timeout=30,**kw)
          def memory_available():
              return int(next(l.split()[1] for l in pathlib.Path('/proc/meminfo').read_text().splitlines() if l.startswith('MemAvailable:')))*1024
          def cgroup(pid):
              lines=pathlib.Path('/proc/'+str(pid)+'/cgroup').read_text().splitlines()
              cg=next(l.split(':',2)[2] for l in lines if l.startswith('0::'))
              return pathlib.Path('/sys/fs/cgroup')/cg.lstrip('/')
          tests=[
            ('ghost_tiny_256',256,'a friendly blue ghost with two dark eyes and a smiling mouth',4,360),
            ('novel_armadillo_tiny_256',256,'a green armadillo wearing a red scarf',4,360)
          ]
          report={'model':model,'runtime':{k:setup[k] for k in ['runtimeRevision','binarySha256','image']},'tests':[],
                  'decoder':tae,'productionIntegrated':False,'physicalCommandsSent':0,'templatesUsed':False}
          for label,res,subject,steps,timeout in tests:
              if memory_available()<2600*1024**2:
                  report['tests'].append({'label':label,'status':'not_run','reason':'Insufficient headroom while preserving running applications'});break
              name='jh2-image-bench-'+label.replace('_','-')
              assert docker('inspect',name).returncode!=0,'Existing test container must not be overwritten'
              prompt='flat pixel art icon of '+subject+', full body centered and fully visible, bold clear silhouette, large solid shapes, pure black background, simple limited color palette, no text'
              args=['create','--name',name,'--network','none','--read-only','--cap-drop','ALL','--security-opt','no-new-privileges',
                    '--user',str(os.getuid())+':'+str(os.getgid()),'--cpus=0.55','--cpu-shares=128','--memory=2048m','--memory-swap=2048m',
                    '--pids-limit=64','--mount','type=bind,source='+str(ROOT/'bin')+',target=/inference-bin,readonly',
                    '--mount','type=bind,source='+str(ROOT/'models')+',target=/models,readonly',
                    '--mount','type=bind,source='+str(OUTPUT)+',target=/output',
                    '--entrypoint','/inference-bin/sd',setup['image'],'-m','/models/'+model['file'],
                    '-p',prompt,'--sampling-method','lcm','--cfg-scale','1','--steps',str(steps),'-t','1',
                    '-W',str(res),'-H',str(res),'--seed','42','--taesd','/models/'+decoder.name,'-o','/output/'+label+'.png']
              created=docker(*args);assert created.returncode==0,created.stderr
              started=time.monotonic();assert docker('start',name).returncode==0
              peak=0;cpu=0;minimum=memory_available();cg=None;stopped=None
              while True:
                  s=docker('inspect',name,'--format','{{json .State}}');state=json.loads(s.stdout)
                  if not state['Running']:break
                  try:
                      if cg is None and state.get('Pid'):cg=cgroup(state['Pid'])
                      if cg:
                          peak=max(peak,int((cg/'memory.peak').read_text()))
                          stats=dict(l.split() for l in (cg/'cpu.stat').read_text().splitlines());cpu=int(stats['usage_usec'])
                  except (OSError,ValueError):pass
                  available=memory_available();minimum=min(minimum,available)
                  if available<650*1024**2:stopped='host_headroom_guard'
                  elif time.monotonic()-started>timeout:stopped='inference_time_limit'
                  if stopped:docker('stop','--time','5',name)
                  time.sleep(.3)
              elapsed=time.monotonic()-started
              log=docker('logs',name);(OUTPUT/(label+'.log')).write_text(log.stdout+log.stderr)
              row={'label':label,'prompt':prompt,'resolution':res,'steps':steps,'wallSeconds':round(elapsed,3),
                   'cpuSeconds':round(cpu/1e6,3),'sampledPeakMemoryBytes':peak,'minHostAvailableBytes':minimum,
                   'exitCode':state['ExitCode'],'oomKilled':state['OOMKilled'],'stopReason':stopped,
                   'cpuLimit':.55,'memoryLimitBytes':2147483648,'swapBytes':0,'templateFallback':False,'decoder':'taesd'}
              path=OUTPUT/(label+'.png')
              if path.exists():
                  b=path.read_bytes();assert b[:8]==b'\x89PNG\r\n\x1a\n';width,height=struct.unpack('>II',b[16:24]);assert (width,height)==(res,res)
                  row.update(status='generated_requires_visual_review',file=path.name,bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
              else:
                  row['status']='failed';row['errorTail']=(log.stdout+log.stderr).splitlines()[-12:]
              report['tests'].append(row);print('IMAGE_BENCHMARK '+json.dumps(row),flush=True)
              (OUTPUT/'image_benchmark_results.json').write_text(json.dumps(report,indent=2))
              assert docker('rm',name).returncode==0
              if row['status']=='failed':break
          try:
              with urllib.request.urlopen('http://127.0.0.1:8081/api/health',timeout=8) as response:report['applicationHealth']=json.load(response)
          except Exception as e:report['applicationHealth']={'ok':False,'error':type(e).__name__}
          (OUTPUT/'image_benchmark_results.json').write_text(json.dumps(report,indent=2))
          print('BENCHMARK_SUMMARY '+json.dumps({'cases':len(report['tests']),'applicationHealth':report['applicationHealth'],'productionIntegrated':False}),flush=True)
          PYTHON
      - name: Retain actual isolated tiny-decoder images and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jh2-tiny-decoder-benchmark-20261019
          path: /opt/jh2-image-benchmark-20261019/output/tiny-decoder/*
          retention-days: 3
          if-no-files-found: warn
