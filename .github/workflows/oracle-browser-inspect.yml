name: Oracle Browser Agent Inspect

on:
  push:
    paths:
      - ".github/oracle-browser-inspect.trigger"
      - ".github/workflows/oracle-browser-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Oracle Browser Agent API and persistent profile
        shell: bash
        run: |
          set -u
          OUT=".github/oracle-browser-inspect-result.txt"
          {
            echo "=== TIME ==="
            date -Is
            echo
            echo "=== HEALTH ==="
            curl -sS --max-time 5 http://127.0.0.1:8932/health || true
            echo
            echo
            echo "=== READ-ONLY AGENT HEALTH TASK ==="
            curl -sS --max-time 15 -X POST http://127.0.0.1:8932/run -H 'Content-Type: application/json' --data '{"id":"agent-health-recovery","task":"health"}' || true
            echo
            echo
            echo "=== DOCKER CONTAINERS ==="
            (docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' 2>/dev/null || sudo docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' 2>/dev/null || true)
            echo
            echo "=== CHROMIUM PROCESSES ==="
            (ps -ef | grep -E '[c]hromium|[c]hrome|[p]laywright' | head -80 || true)
            echo
            echo "=== PROFILE LOCK METADATA ==="
            (sudo find /home/ubuntu/browser-agent-data/daily -maxdepth 2 -name 'Singleton*' -ls 2>/dev/null || find /home/ubuntu/browser-agent-data/daily -maxdepth 2 -name 'Singleton*' -ls 2>/dev/null || true)
            echo
            echo "=== PROFILE DIRECTORY METADATA ==="
            (sudo ls -ld /home/ubuntu/browser-agent-data /home/ubuntu/browser-agent-data/daily 2>/dev/null || ls -ld /home/ubuntu/browser-agent-data /home/ubuntu/browser-agent-data/daily 2>/dev/null || true)
            echo
            echo "=== CONTAINER CHROMIUM PROCESSES ==="
            CID="$(sudo docker ps --format '{{.ID}} {{.Ports}}' 2>/dev/null | awk '/127\\.0\\.0\\.1:8932->8932/{print $1; exit}')"
            if [ -n "$CID" ]; then sudo docker exec "$CID" sh -lc "ps -ef | grep -E '[c]hromium|[c]hrome|[p]laywright' | head -80" 2>/dev/null || true; fi
          } > "$OUT"
          cat "$OUT"

      - name: Publish inspection result
        shell: bash
        run: |
          set -e
          git config user.name "oracle-runner"
          git config user.email "oracle-runner@users.noreply.github.com"
          git add .github/oracle-browser-inspect-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish Oracle Browser Agent health check"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
