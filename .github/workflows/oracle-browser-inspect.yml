name: Oracle Browser Agent Inspect

on:
  push:
    paths:
      - ".github/oracle-browser-inspect.trigger"
      - ".github/workflows/oracle-browser-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - name: Inspect local Oracle Browser Agent safely
        shell: bash
        run: |
          set -u
          echo "=== HOST ==="
          hostname
          uname -a
          echo
          echo "=== LISTENERS ==="
          ss -ltn 2>/dev/null | grep -E ':(8931|8932|6080)\b' || true
          echo
          echo "=== 8932 PROCESS ==="
          PIDS="$(fuser -n tcp 8932 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' | sort -u || true)"
          for pid in $PIDS; do
            echo "PID=$pid"
            echo "EXE=$(readlink -f /proc/$pid/exe 2>/dev/null || true)"
            echo "CWD=$(readlink -f /proc/$pid/cwd 2>/dev/null || true)"
            printf "CMD="
            tr '\0' ' ' </proc/$pid/cmdline 2>/dev/null | sed -E 's/(token|password|secret|key)=[^ ]+/\1=REDACTED/Ig' || true
            echo
            cwd="$(readlink -f /proc/$pid/cwd 2>/dev/null || true)"
            if [ -n "$cwd" ] && [ -d "$cwd" ]; then
              echo "--- files in $cwd"
              find "$cwd" -maxdepth 2 -type f 2>/dev/null                 | grep -Ev '/(node_modules|data|profile|\.git)/|\.env$|\.log$'                 | head -200 || true
              echo "--- route-like source lines"
              grep -R --line-number --binary-files=without-match                 --exclude='.env' --exclude='*.log' --exclude-dir='node_modules' --exclude-dir='data' --exclude-dir='profile'                 -E "(app\.(get|post|put|delete)|router\.(get|post|put|delete)|createServer|8932|/run|/task|/jobs|/login|profile)"                 "$cwd" 2>/dev/null | head -300 || true
            fi
          done
          echo
          echo "=== SAFE HTTP PROBES 8932 ==="
          for p in /health /status /openapi.json /docs /; do
            echo "--- $p"
            curl -i -sS --max-time 4 "http://127.0.0.1:8932$p" 2>/dev/null | head -c 12000 || true
            echo
          done
