name: Oracle Browser Agent Inspect

on:
  push:
    paths:
      - ".github/oracle-browser-inspect.trigger"
      - ".github/workflows/oracle-browser-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect local Oracle Browser Agent safely
        shell: bash
        run: |
          set -u
          OUT=".github/oracle-browser-inspect-result.txt"
          TMP="${OUT}.tmp"
          {
            echo "=== TIME ==="
            date -Is
            echo
            echo "=== HOST ==="
            hostname
            uname -a
            echo
            echo "=== LISTENERS WITH PROCESS ==="
            sudo ss -ltnp 2>/dev/null | grep -E ':(8931|8932|6080)\b' || ss -ltnp 2>/dev/null | grep -E ':(8931|8932|6080)\b' || true
            echo
            echo "=== PROCESS CANDIDATES ==="
            ps -eo pid,ppid,user,args --sort=pid | grep -Ei 'node|playwright|browser-agent|oracle-browser|8932' | grep -v grep | head -200 || true
            echo
            echo "=== LSOF 8932 ==="
            sudo lsof -nP -iTCP:8932 -sTCP:LISTEN 2>/dev/null || lsof -nP -iTCP:8932 -sTCP:LISTEN 2>/dev/null || true
            echo
            echo "=== SOURCE FILE CANDIDATES ==="
            MATCHES="$(find /home/ubuntu /opt -maxdepth 6 -type f -size -3M 2>/dev/null               | grep -Ev '/(node_modules|profile|data|\.git|_work)/|\.env$|\.log$|\.db$|\.sqlite$'               | xargs -r grep -Il -E 'oracle-browser-agent|login_active|127\.0\.0\.1:8932|PORT.?8932' 2>/dev/null               | head -80 || true)"
            printf '%s\n' "$MATCHES"
            for f in $MATCHES; do
              echo "--- FILE: $f"
              grep -nE 'app\.(get|post|put|delete)|router\.(get|post|put|delete)|/health|/run|/task|/job|/login|profile|login_active|8932|browser' "$f" 2>/dev/null | head -400 || true
            done
            echo
            echo "=== SAFE HTTP PROBES 8932 ==="
            for p in /health /status /openapi.json /docs /routes /api /api/routes /jobs /tasks; do
              echo "--- GET $p"
              curl -i -sS --max-time 4 "http://127.0.0.1:8932$p" 2>/dev/null | head -c 20000 || true
              echo
              echo "--- OPTIONS $p"
              curl -i -sS -X OPTIONS --max-time 4 "http://127.0.0.1:8932$p" 2>/dev/null | head -c 4000 || true
              echo
            done
          } > "$TMP"

          sed -E             -e 's/(Authorization: Bearer )[A-Za-z0-9._~+\/-]+/\1REDACTED/Ig'             -e 's/((token|password|secret|api[_-]?key)[\"'\''=: ]+)[^ ,\"'\'']+/\1REDACTED/Ig'             "$TMP" > "$OUT"
          rm -f "$TMP"

      - name: Publish inspection result
        shell: bash
        run: |
          set -e
          git config user.name "oracle-runner"
          git config user.email "oracle-runner@users.noreply.github.com"
          git add .github/oracle-browser-inspect-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish Oracle Browser Agent inspection result"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
