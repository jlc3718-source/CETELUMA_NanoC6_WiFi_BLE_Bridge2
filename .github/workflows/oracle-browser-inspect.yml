name: Oracle Browser Agent Inspect

on:
  push:
    paths:
      - ".github/oracle-browser-inspect.trigger"
      - ".github/workflows/oracle-browser-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Oracle Browser Agent safely
        shell: bash
        run: |
          set -u
          OUT=".github/oracle-browser-inspect-result.txt"
          TMP="${OUT}.tmp"
          {
            echo "=== TIME ==="
            date -Is
            echo
            echo "=== HEALTH ==="
            curl -sS --max-time 4 http://127.0.0.1:8932/health || true
            echo
            echo
            echo "=== DOCKER PS ==="
            docker ps --format '{{.ID}} {{.Names}} {{.Image}} {{.Ports}}' 2>/dev/null || sudo docker ps --format '{{.ID}} {{.Names}} {{.Image}} {{.Ports}}' 2>/dev/null || true
            CID="$(docker ps --format '{{.ID}} {{.Ports}}' 2>/dev/null | awk '/127\.0\.0\.1:8932->8932/{print $1; exit}')"
            if [ -z "$CID" ]; then
              CID="$(sudo docker ps --format '{{.ID}} {{.Ports}}' 2>/dev/null | awk '/127\.0\.0\.1:8932->8932/{print $1; exit}')"
            fi
            echo "CID=$CID"
            if [ -n "$CID" ]; then
              echo
              echo "=== CONTAINER PROCESS ==="
              (docker exec "$CID" sh -lc 'ps -ef 2>/dev/null || ps aux 2>/dev/null' || sudo docker exec "$CID" sh -lc 'ps -ef 2>/dev/null || ps aux 2>/dev/null') 2>/dev/null | head -100 || true
              echo
              echo "=== SERVER ROUTES ==="
              (docker exec "$CID" sh -lc "grep -nE 'app\\.(get|post|put|delete|use)|router\\.(get|post|put|delete)|req\\.body|/health|/run|/login|profile|browser' /app/src/server.js 2>/dev/null" || sudo docker exec "$CID" sh -lc "grep -nE 'app\\.(get|post|put|delete|use)|router\\.(get|post|put|delete)|req\\.body|/health|/run|/login|profile|browser' /app/src/server.js 2>/dev/null") 2>/dev/null | head -500 || true
              echo
              echo "=== SERVER SOURCE ==="
              (docker exec "$CID" sh -lc 'cat /app/src/server.js 2>/dev/null' || sudo docker exec "$CID" sh -lc 'cat /app/src/server.js 2>/dev/null') 2>/dev/null | head -1200 || true
              echo
              echo "=== APP FILES ==="
              (docker exec "$CID" sh -lc "find /app -maxdepth 3 -type f 2>/dev/null | grep -Ev '/node_modules/|\\.env$|\\.log$' | head -250" || sudo docker exec "$CID" sh -lc "find /app -maxdepth 3 -type f 2>/dev/null | grep -Ev '/node_modules/|\\.env$|\\.log$' | head -250") 2>/dev/null || true
            fi
          } > "$TMP"

          python3 - "$TMP" "$OUT" <<'PY'
          import re, sys
          src, dst = sys.argv[1:]
          s = open(src, encoding="utf-8", errors="replace").read()
          s = re.sub(r'(?i)(Authorization:\\s*Bearer\\s+)[^\\s]+', r'\\1REDACTED', s)
          s = re.sub(r'''(?i)((?:token|password|secret|api[_-]?key)["'=: ]+)[^ ,"']+''', r'\\1REDACTED', s)
          open(dst, "w", encoding="utf-8").write(s)
          PY
          rm -f "$TMP"

      - name: Publish inspection result
        shell: bash
        run: |
          set -e
          git config user.name "oracle-runner"
          git config user.email "oracle-runner@users.noreply.github.com"
          git add .github/oracle-browser-inspect-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish Oracle Browser Agent inspection"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
