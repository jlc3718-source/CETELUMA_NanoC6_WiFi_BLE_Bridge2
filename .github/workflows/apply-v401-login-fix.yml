name: Apply v4.0.1 login recovery cleanup
on:
  push:
    branches: ['work/v4.0.0-native-idf']
    paths: ['.github/workflows/apply-v401-login-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.0.0-native-idf
          fetch-depth: 0
      - name: Apply cleanup
        run: python tools/fix_v401_login.py
      - name: Commit non-workflow source changes
        run: |
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git rm tools/fix_v401_login.py
          git add firmware tools
          git commit -m 'Finish v4.0.1 login recovery cleanup'
          git push origin HEAD:work/v4.0.0-native-idf
