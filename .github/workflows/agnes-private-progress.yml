name: Agnes private job status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agnes-private-progress.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Agnes encrypted private reference video']
    types: [completed]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 4
    steps:
      - name: Read only job milestones and query accepted Agnes IDs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, urllib.error
          import subprocess
          p=subprocess.run(['systemctl','show','agnes-private-roborock.service','--property=ActiveState,SubState,ExecMainStatus'],capture_output=True,text=True)
          print('SERVICE_STATUS',p.stdout.strip().replace('\n',' '))
          import re,shutil
          journal=subprocess.run(['journalctl','-u','agnes-private-roborock.service','-n','35','--no-pager','-o','cat'],capture_output=True,text=True)
          print('JOURNAL_READ_EXIT',journal.returncode)
          for line in journal.stdout.splitlines():
              if re.fullmatch(r'(?:PRIVATE_INPUT_DECRYPTED_AND_VERIFIED|REFERENCE_IMAGE_READY|FAILED [A-Za-z]+|(?:AGNES_ACCEPTED|REUSING_ACCEPTED_JOB|VIDEO_VERIFIED|COMPLETED_RESULT_URL_MISSING|NARRATION_DURATION_EXCEEDS_CLIP) [0-9A-Za-z_-]+|[0-9A-Za-z_-]+ STATUS [A-Za-z_]+)',line.strip()): print('SAFE_MILESTONE',line.strip())
          print('TOOLS_AVAILABLE',*[bool(shutil.which(x)) for x in ('ffmpeg','ffprobe','espeak-ng','espeak')])
          root=pathlib.Path.home()/'.agnes-private-jobs'/'roborock-2026-11'
          f=root/'state.json'
          if not f.is_file():
              print('PRIVATE_JOB_STATE_NOT_CREATED'); raise SystemExit(0)
          s=json.loads(f.read_text())
          print('REFERENCE_READY', bool(s.get('ref_url')))
          for name, entry in s.get('submissions',{}).items():
              print('SUBMISSION',name,'HTTP',entry.get('http'),'STATUS',entry.get('status'),'RETRIES',entry.get('retries',0),'DELAY',entry.get('retry_delay_seconds'))
          print('ENCRYPTED_RESULT_READY', (root/'agnes-private-result.enc').is_file())
          print('ACCEPTED_SCENE_COUNT',sum(bool(x.get('video_id')) for x in s.get('scenes',{}).values()))
          for n,x in enumerate(s.get('scenes',{}).values(),1):
              v=x.get('video_id')
              print('SCENE',n,'ACCEPTED',bool(v))
              if not v: continue
              try:
                  k=pathlib.Path('/home/ubuntu/agnes-sd300/key').read_text().strip()
                  q=urllib.parse.urlencode({'video_id':v,'model_name':'agnes-video-2.5-flash'})
                  req=urllib.request.Request('https://apihub.agnes-ai.com/agnesapi?'+q,headers={'Authorization':'Bearer '+k,'Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      o=json.load(r); d=o.get('data'); d=d if isinstance(d,dict) else o
                      status=str(d.get('status','unknown')).lower()
                      allowed={'queued','pending','processing','running','completed','succeeded','success','failed','error','cancelled','canceled','in_progress','submitted','generating'}
                      print('AGNES_SCENE',n,'HTTP',r.status,'STATUS',status if status in allowed else 'unknown')
              except urllib.error.HTTPError as e: print('AGNES_SCENE',n,'HTTP',e.code)
              except Exception as e: print('AGNES_SCENE',n,'READ_ERROR',type(e).__name__)
          print('RAW_OUTPUT_COUNT',sum(p.stat().st_size>50000 for p in root.glob('*-raw.mp4')))
          print('VERIFIED_OUTPUT_COUNT',sum(p.stat().st_size>50000 for p in root.glob('*.mp4') if not p.name.endswith('-raw.mp4') and not p.name.endswith('.tmp.mp4')))
          PY
      - name: Stage encrypted finished result if available
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          f="$HOME/.agnes-private-jobs/roborock-2026-11/agnes-private-result.enc"
          if [ -s "$f" ]; then
            cp "$f" "$RUNNER_TEMP/agnes-private-result.enc"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.stage.outputs.ready == 'true'
        with:
          name: agnes-private-encrypted-result
          path: ${{ runner.temp }}/agnes-private-result.enc
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
