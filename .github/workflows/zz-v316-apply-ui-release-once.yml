name: Apply Anderson v3.1.6 UI and Release Integration Once
on:
  push:
    branches: [codex/release-v3.1.6-event-fairness]
    paths: ['.github/workflows/zz-v316-apply-ui-release-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final v3.1.6 source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              found=s.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old[:100]!r}')
              p.write_text(s.replace(old,new,count))

          # Bottom-menu Logout: preserve the existing authenticated logout action,
          # but move the control out of the header and make its purpose explicit.
          p=Path('firmware/web/v3_mockup.js'); s=p.read_text()
          old="""    user: '<circle cx=\"12\" cy=\"7\" r=\"4\"/><path d=\"M4 22v-3a8 8 0 0 1 16 0v3\"/>',
    wifi: '<path d=\"M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0\"/><circle cx=\"12\" cy=\"20\" r=\"1\"/>',"""
          new="""    user: '<circle cx=\"12\" cy=\"7\" r=\"4\"/><path d=\"M4 22v-3a8 8 0 0 1 16 0v3\"/>',
    logout: '<path d=\"M10 17l5-5-5-5M15 12H3M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5\"/>',
    wifi: '<path d=\"M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0\"/><circle cx=\"12\" cy=\"20\" r=\"1\"/>',"""
          if s.count(old)!=1: raise SystemExit('v3_mockup.js: icon insertion anchor mismatch')
          s=s.replace(old,new,1)
          old="""    const actions = q('.headerActions'), badge = byId('connectionBadge'), profile = byId('activeProfile');
    badge.style.display = 'none';
    profile.className = 'v3ProfileName'; profile.style.display = 'none';
    const switcher = byId('switchProfile'); switcher.innerHTML = icon('user'); switcher.setAttribute('aria-label','Switch user'); switcher.title = 'Switch user';
    actions.replaceChildren(badge, profile, switcher);"""
          new="""    const actions = q('.headerActions'), badge = byId('connectionBadge'), profile = byId('activeProfile');
    badge.style.display = 'none';
    profile.className = 'v3ProfileName'; profile.style.display = 'none';
    const switcher = byId('switchProfile'); switcher.className = 'tab v3LogoutTab'; switcher.innerHTML = icon('logout') + '<span>Logout</span>'; switcher.setAttribute('aria-label','Logout'); switcher.title = 'Logout';
    actions.replaceChildren(badge, profile); nav.appendChild(switcher);"""
          if s.count(old)!=1: raise SystemExit('v3_mockup.js: header switcher anchor mismatch')
          s=s.replace(old,new,1)
          old="byId('switchProfile').setAttribute('aria-label',window.andersonProfile ? `Switch user, currently ${window.andersonProfile.name}`:'Switch user'); syncPage();"
          new="byId('switchProfile').setAttribute('aria-label',window.andersonProfile ? `Logout ${window.andersonProfile.name}`:'Logout'); syncPage();"
          if s.count(old)!=1: raise SystemExit('v3_mockup.js: syncRole switcher anchor mismatch')
          s=s.replace(old,new,1); p.write_text(s)

          # User-facing scheduler rules now describe the actual starvation-free policy.
          replace('firmware/web/index.html','<button id="switchProfile" class="btn switchProfile" type="button" hidden>Switch User</button>','<button id="switchProfile" class="btn switchProfile" type="button" hidden>Logout</button>')
          replace('firmware/web/index.html',"v==='rotate'?'Each enabled monthly event gets a full night, then the next one runs the following night.':v==='split'?'The scheduled night is divided evenly among enabled month-long events.':'Colors from all enabled month-long events are combined into one theme.'","v==='rotate'?'Each enabled monthly event gets a full available night in order. If higher-priority dates leave too few nights, only the remaining themes share those available nights so none are skipped.':v==='split'?'The scheduled night is divided evenly among enabled month-long events.':'Colors from all enabled month-long events are combined into one theme.'")
          replace('firmware/web/index.html','<div class="panel"><strong>Priority</strong><div class="sub" style="display:grid;gap:4px;margin-top:8px"><div>1. Manual override</div><div>2. Custom scheduled light</div><div>3. Specific holiday / awareness day</div><div>4. Holiday window</div><div>5. Month-long events</div><div>6. Seasonal theme</div><div>7. Normal preset</div></div></div>','<div class="panel"><strong>Priority</strong><div class="sub" style="display:grid;gap:4px;margin-top:8px"><div>1. Manual override</div><div>2. Custom scheduled light</div><div>3. Specific holiday / awareness / seasonal day</div><div>4. Holiday window</div><div>5. Month-long events</div><div>6. Normal preset</div></div></div>')

          # Make the coverage audit a permanent release gate.
          replace('.github/workflows/compile-anderson-home-multi.yml','      - name: Check Anderson source regressions\n        run: python tools/test_regressions.py\n','      - name: Check Anderson source regressions\n        run: python tools/test_regressions.py\n      - name: Check scheduled event coverage\n        run: python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full\n')

          # Lock the implementation and Logout placement into regression checks.
          p=Path('tools/test_regressions.py'); s=p.read_text()
          s=s.replace('# v3.1.5 final UI build trigger','# v3.1.6 event fairness and bottom-menu logout',1)
          anchor="assert 'id=\\\"homeSpeed\\\"' in mock and 'Effect Speed' in mock and \"bindSpeedControl('homeSpeed')\" in mock\n"
          addition="""assert 'id=\\\"homeSpeed\\\"' in mock and 'Effect Speed' in mock and \"bindSpeedControl('homeSpeed')\" in mock
assert \"icon('logout') + '<span>Logout</span>'\" in mock and 'nav.appendChild(switcher)' in mock
assert 'actions.replaceChildren(badge, profile, switcher)' not in mock and \"'Logout'\" in mock
assert 'Specific holiday / awareness / seasonal day' in web and '<div>6. Normal preset</div>' in web
assert 'timedTierPick' in sched and 'monthlyEligiblePosition' in sched and 'MAX_ACTIVE_TIER_EVENTS=64' in sched
assert 'Holiday, awareness, and seasonal dates all share the specific-event tier.' in sched
assert 'if(specificCount)' in sched and 'if(holidayWindowCount)' in sched
assert 'python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full' in build
"""
          if s.count(anchor)!=1: raise SystemExit('test_regressions.py: insertion anchor mismatch')
          s=s.replace(anchor,addition,1); p.write_text(s)

          # v3.1.6 version markers must agree before CI packages anything.
          Path('FIRMWARE_VERSION.txt').write_text('3.1.6\n')
          replace('firmware/src/main.cpp','static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.5";','static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.6";')
          PY
      - name: Validate source before commit
        run: |
          python3 tools/test_regressions.py
          python3 tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full
      - name: Remove one-time audit workflows and commit final source
        run: |
          git rm -f .github/workflows/zz-v316-event-audit-once.yml .github/workflows/zz-v316-apply-ui-release-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware tools FIRMWARE_VERSION.txt .github/workflows/compile-anderson-home-multi.yml
          git commit -m 'Prepare Anderson Home v3.1.6 event fairness and logout'
          git push origin HEAD:codex/release-v3.1.6-event-fairness
