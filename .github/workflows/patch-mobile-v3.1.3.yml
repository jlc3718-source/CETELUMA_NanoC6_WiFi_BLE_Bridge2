name: Patch Anderson Home v3.1.3 mobile UI

on:
  push:
    branches:
      - codex/v3.1.3-mobile-ui-effects
    paths:
      - .github/workflows/patch-mobile-v3.1.3.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3.1.3-mobile-ui-effects
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/patch_v313.py
      - name: Validate patched UI
        run: |
          node --check firmware/web/v3_mockup.js
          grep -F 'requestAnimationFrame(animate)' firmware/web/v3_mockup.js
          grep -F 'ANDERSON_MOBILE_V3_1_3' firmware/web/v3_mockup.css
          test "$(cat FIRMWARE_VERSION.txt)" = "3.1.3"
      - name: Commit clean source
        run: |
          rm .github/patch_v313.py .github/workflows/patch-mobile-v3.1.3.yml
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git add firmware/web/v3_mockup.js firmware/web/v3_mockup.css FIRMWARE_VERSION.txt README.md .github/patch_v313.py .github/workflows/patch-mobile-v3.1.3.yml
          git commit -m 'v3.1.3 repair effect previews and mobile layouts'
          git push origin HEAD:codex/v3.1.3-mobile-ui-effects
      - name: Dispatch exact firmware build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run compile-anderson-home-multi.yml --ref codex/v3.1.3-mobile-ui-effects
