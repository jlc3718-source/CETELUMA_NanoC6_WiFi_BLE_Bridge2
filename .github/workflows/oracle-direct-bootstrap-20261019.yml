name: Verify atomic scoped Oracle file writes and automatic deployment rollback
on:
  push:
    branches: [codex/oracle-direct-bootstrap-20261019]
    paths: ['.github/workflows/oracle-direct-bootstrap-20261019.yml']
permissions: {contents: read}
concurrency: {group: jason-home-oracle-production, cancel-in-progress: false}
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate restricted tools and OAuth before installation
        run: python3 -m unittest discover -s OracleDevelopment -p 'test_*.py'
      - name: One-time installation with isolated HTTPS vhost and live rollback verification
        run: sudo -n python3 OracleDevelopment/install.py
