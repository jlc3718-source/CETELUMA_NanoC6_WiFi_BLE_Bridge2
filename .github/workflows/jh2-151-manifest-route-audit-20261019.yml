name: JH2 1.1.51 Read-Only Oracle Signed OTA Route Audit
on:
  push:
    branches: [codex/jh2-slot-inventory-fix-20261018]
    paths: ['.github/workflows/jh2-151-manifest-route-audit-20261019.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 4
    steps:
      - name: Inspect current signed OTA deployment inputs without changing production
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 - <<'PY'
          import json,subprocess,urllib.request
          for n in ('jason-home','jason-home-2-web'):
              o=json.loads(subprocess.check_output(['docker','inspect',n],text=True))[0]
              print('CONTAINER',n,'MOUNTS',[{'destination':m.get('Destination'),'type':m.get('Type')} for m in o['Mounts']],flush=True)
          url='http://127.0.0.1:8081'
          for path in ('/api/curtain/firmware-manifest',):
              try:
                  with urllib.request.urlopen(url+path,timeout=8) as r:
                      v=json.load(r)
                  p=v.get('payload','')
                  print('MANIFEST',path,'schema',v.get('schema'),'payloadFields',[x.split('=',1)[0] for x in p.strip().splitlines()],'version',[x for x in p.splitlines() if x.startswith('version=')],flush=True)
              except Exception as e:print('MANIFEST_ERROR',type(e).__name__,str(e)[:150])
          # Read-only production server route locations; print code names only.
          code=subprocess.run(['docker','exec','jason-home-2-web','sh','-c',"grep -Rn -m 2 -E 'firmware-manifest|firmware-runtime' /app 2>/dev/null | head -20"],text=True,capture_output=True,timeout=25)
          for line in code.stdout.splitlines():
              # Not logging line contents; log filename/line only.
              print('MATCH_FILE_LINE',line.split(':',2)[:2],flush=True)
          code=subprocess.run(['docker','exec','jason-home-2-web','sh','-c',"sed -n '955,1040p' /app/server.mjs"],text=True,capture_output=True,timeout=20)
          for line in code.stdout.splitlines():
              if any(word in line for word in ('firmware','latest.json','readFile','release','manifest','RUNTIME','ota','firmware-manifest','firmware-runtime','function get','async function','return','path.join','statSync','existsSync','replyJson','sendJSON')):
                  print('ROUTE_CONTEXT',line[:300].strip(),flush=True)
          print('READ_ONLY_ROUTE_AUDIT_FINISHED',flush=True)
          PY
