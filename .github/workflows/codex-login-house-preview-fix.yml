name: Fix Login House Preview Release Check

on:
  push:
    branches: ['codex/release-current']
    paths: ['.github/trigger-login-house-preview-fix.txt']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-current
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix login hero statement separator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firmware/web/v3_mockup.js')
          s=p.read_text()
          bad='y&&(y.textContent="A DIFFERENT KIND OF HOME"),const loginWelcome=q(".v3Welcome");'
          good='y&&(y.textContent="A DIFFERENT KIND OF HOME");const loginWelcome=q(".v3Welcome");'
          if s.count(bad)!=1:
              raise SystemExit(f'Expected one bad separator, found {s.count(bad)}')
          p.write_text(s.replace(bad,good,1))
          PY
      - name: Run exact release UI checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
          python tools/release.py check
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/web/v3_mockup.js
          git commit -m 'Fix login house preview JavaScript release syntax'
          git push origin HEAD:codex/release-current
