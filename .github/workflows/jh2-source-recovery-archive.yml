name: Jason Home 2 latest validated Oracle recovery archive
on:
  push:
    branches: [jason-home-2-web]
    paths:
      - '.github/workflows/jh2-source-recovery-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact current Android UI, Oracle gateway and Eufy controller sources
        shell: bash
        run: |
          set -euo pipefail
          APP_SHA="$(git rev-parse origin/release/jason-home-2-fixes-20261011^{commit})"
          SERVER_SHA="$(git rev-parse origin/release/oracle-eufy-fixes-20261011^{commit})"
          mkdir -p /tmp/jh2-current/app /tmp/jh2-current/controller jh2-source-recovery
          git archive "$APP_SHA" | tar -xf - -C /tmp/jh2-current/app
          git archive "$SERVER_SHA" | tar -xf - -C /tmp/jh2-current/controller
          test -s /tmp/jh2-current/app/JasonHome2Server/server.mjs
          test -s /tmp/jh2-current/app/JasonHome2Android/AndroidManifest.xml
          test -s /tmp/jh2-current/app/JasonHome2Server/curtain_real_00.js
          test -s /tmp/jh2-current/app/JasonHome2Server/curtain_real_10.js
          test -s /tmp/jh2-current/app/JasonHome2Server/curtain_real_manifest.json
          test -s /tmp/jh2-current/controller/JasonHomeServer/src/server.ts
          test -s /tmp/jh2-current/controller/JasonHomeServer/src/eufy/client.ts
          node --test /tmp/jh2-current/app/JasonHome2Server/tests/curtain-images.mjs
          printf 'Jason Home 2 Android/web SHA: %s\nOracle Eufy controller SHA: %s\n' "$APP_SHA" "$SERVER_SHA" > /tmp/jh2-current/IMMUTABLE_SOURCE_REVISIONS.txt
          printf 'Jason Home 2 current source, NOT private runtime database or .env. Preserve the separate signed APK, signing backup, Oracle DB, nginx configuration and private credentials.\n' > /tmp/jh2-current/READ-BEFORE-RESTORE.txt
          tar -czf jh2-source-recovery/Jason-Home-2-LATEST-VALIDATED-SOURCE-RECOVERY.tar.gz -C /tmp/jh2-current .
          tar -tzf jh2-source-recovery/Jason-Home-2-LATEST-VALIDATED-SOURCE-RECOVERY.tar.gz > /tmp/jh2-current-file-list.txt
          grep -q '^./app/JasonHome2Server/server.mjs$' /tmp/jh2-current-file-list.txt
          grep -q '^./controller/JasonHomeServer/src/server.ts$' /tmp/jh2-current-file-list.txt
          (cd jh2-source-recovery && sha256sum *.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Jason-Home-2-LATEST-VALIDATED-SOURCE-RECOVERY
          path: jh2-source-recovery/
          if-no-files-found: error
          retention-days: 90
