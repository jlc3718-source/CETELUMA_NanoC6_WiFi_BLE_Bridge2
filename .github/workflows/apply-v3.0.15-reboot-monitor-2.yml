name: Apply Anderson Home v3.0.15 reboot monitor retry

on:
  push:
    branches: [codex/v3.0.15-reboot-monitor]
    paths:
      - '.github/workflows/apply-v3.0.15-reboot-monitor-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3.0.15-reboot-monitor
      - name: Apply corrected focused changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          workflow=Path('.github/workflows/apply-v3.0.15-reboot-monitor.yml').read_text()
          code=workflow.split("python - <<'PY'\n",1)[1].split('\n          PY',1)[0]
          code=textwrap.dedent(code)
          pattern=r'''replace_once\('firmware/web/index\.html','''\s*<div class="sysMetric"><span class="sysLabel">Auto Update</span><strong id="sysUpdate">—</strong><span id="sysUpdateSub" class="sysSub">next check</span></div>.*?\nreplace_once\('firmware/web/index\.html','let sysUpdateDeadline=0,systemMonitorBusy=false;'[^\n]*\n'''
          replacement='''replace_once('firmware/web/index.html','        <div class="sysMetric"><span class="sysLabel">Auto Update</span><strong id="sysUpdate">—</strong><span id="sysUpdateSub" class="sysSub">next check</span></div>','        <div class="sysMetric"><span class="sysLabel">Auto Update</span><strong id="sysUpdate">—</strong><span id="sysUpdateSub" class="sysSub">next check</span></div>\\n        <div class="sysMetric"><span class="sysLabel">Next Reboot</span><strong id="sysReboot">—</strong><span id="sysRebootSub" class="sysSub">time remaining</span></div>')
replace_once('firmware/web/index.html','let sysUpdateDeadline=0,systemMonitorBusy=false;', 'let sysUpdateDeadline=0,sysRebootDeadline=0,systemMonitorBusy=false;')
'''
          code,count=re.subn(pattern,replacement,code,count=1,flags=re.S)
          if count!=1: raise SystemExit('could not correct System Monitor metric patch in helper')
          exec(compile(code,'v3.0.15-helper','exec'))
          PY
      - name: Run focused maintenance regression tests
        run: python tools/test_maintenance.py
      - name: Commit source changes
        run: |
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git add FIRMWARE_VERSION.txt README.md AGENTS.md firmware/src/main.cpp firmware/web/index.html tools/test_maintenance.py
          git commit -m 'Add four daily reboots and next-reboot monitor (v3.0.15)'
          git push origin HEAD:codex/v3.0.15-reboot-monitor
