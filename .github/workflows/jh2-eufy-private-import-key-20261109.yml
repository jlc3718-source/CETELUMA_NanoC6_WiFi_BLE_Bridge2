name: JH2 one-time Eufy local identity secure RSA import key
on:
  push:
    branches: [feature/jh2-nano-eufy-from-2.0.14-20261109]
    paths: ['.github/workflows/jh2-eufy-private-import-key-20261109.yml']
permissions: {contents: read}
jobs:
  key:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Create restricted one-time RSA private key only on Oracle; publish public key
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          root=Path('/root/.jh2-eufy-local-private-import')
          root.mkdir(mode=0o700,exist_ok=True)
          private=root/'identity-onetime.key'
          if private.exists():
           print('ONE_TIME_PRIVATE_KEY_ALREADY_EXISTS_REFUSE_REPLACEMENT')
           raise SystemExit(1)
          subprocess.run(['openssl','genpkey','-algorithm','RSA','-pkeyopt','rsa_keygen_bits:2048',
                          '-out',str(private)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          os.chmod(private,0o600)
          public=subprocess.check_output(['openssl','pkey','-in',str(private),'-pubout'],text=True)
          print('BEGIN_JH2_PUBLIC_KEY')
          print(public.strip())
          print('END_JH2_PUBLIC_KEY')
          PY
