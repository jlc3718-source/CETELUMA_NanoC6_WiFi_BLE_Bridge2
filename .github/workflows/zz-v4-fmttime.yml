name: Patch v4 Native IDF Time Formatter
on:
  push:
    branches:
      - work/v4.0.0-native-idf
    paths:
      - .github/workflows/zz-v4-fmttime.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.0.0-native-idf
      - name: Patch bounded time formatter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firmware/src/main.cpp')
          s=p.read_text()
          old='static String fmtTime(uint16_t m){char b[6];snprintf(b,sizeof(b),"%02d:%02d",m/60,m%60);return b;}'
          new='static String fmtTime(uint16_t m){m%=1440U;char b[6];snprintf(b,sizeof(b),"%02u:%02u",(unsigned)(m/60U),(unsigned)(m%60U));return b;}'
          assert s.count(old)==1, 'expected one fmtTime source line'
          p.write_text(s.replace(old,new,1))
          PY
          grep -q 'm%=1440U' firmware/src/main.cpp
          git diff --check
      - name: Commit patch and remove helper
        run: |
          rm -f .github/workflows/zz-v4-fmttime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Bound native IDF time formatter"
          git push origin HEAD:refs/heads/work/v4.0.0-native-idf
