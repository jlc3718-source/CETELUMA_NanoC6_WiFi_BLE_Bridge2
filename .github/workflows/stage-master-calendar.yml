name: Stage Anderson v3.0.20 master calendar

on:
  push:
    branches: [staging/palette-holiday-update]
    paths: [.github/workflows/stage-master-calendar.yml]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/palette-holiday-update
      - name: Apply master calendar source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,re
          
          def write(path,text):
              p=Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          def replace_once(path,old,new):
              p=Path(path);s=p.read_text();n=s.count(old)
              if n!=1: raise SystemExit(f"{path}: expected one exact match, found {n}")
              p.write_text(s.replace(old,new,1))
          
          write("firmware/src/EventCatalog.cpp",zlib.decompress(base64.b64decode('')).decode())
          write("firmware/include/EventCatalog.h",'#pragma once\n#include <Arduino.h>\n#include <time.h>\n#include "Types.h"\n\nextern const EventDef EVENTS[];\nextern const size_t EVENT_COUNT;\n\nint eventIndexById(const String& id);\nbool eventOccursInMonth(size_t index, int year, int month);\nbool eventActiveOn(size_t index, const tm& local);\nbool eventWindowActiveOn(size_t index, const tm& local, uint8_t lead, uint8_t trail);\nString eventWhen(size_t index, int year);\nTheme themeFromEvent(size_t index);\ntime_t eventStartEpoch(size_t index, int year);\nuint8_t eventSpeed(size_t index);\n')
          write("firmware/include/EventState.h",'#pragma once\n#include <Arduino.h>\n\nstatic constexpr size_t MAX_BUILTIN_EVENTS = 256;\nstatic constexpr size_t EVENT_STATE_WORDS = MAX_BUILTIN_EVENTS / 64;\n\nvoid eventStateBegin();\nbool eventStateEnabled(size_t index);\nbool eventStateFavorite(size_t index);\nbool eventStateSetEnabled(size_t index, bool enabled);\nbool eventStateSetFavorite(size_t index, bool favorite);\nbool eventStateResetAll();\n')
          write("firmware/src/EventState.cpp",'#include "EventState.h"\n#include <Preferences.h>\n\nstatic constexpr const char* EVENT_STATE_NS = "anderson-evstate";\nstatic constexpr uint8_t EVENT_STATE_REVISION = 1;\nstatic uint64_t enabledWords[EVENT_STATE_WORDS] = {UINT64_MAX,UINT64_MAX,UINT64_MAX,UINT64_MAX};\nstatic uint64_t favoriteWords[EVENT_STATE_WORDS] = {0,0,0,0};\nstatic bool stateLoaded = false;\n\nstatic String wordKey(const char* prefix,size_t word){return String(prefix)+String((unsigned)word);}\nstatic bool persistWord(const char* prefix,size_t word,uint64_t value){\n  Preferences p;if(!p.begin(EVENT_STATE_NS,false))return false;String key=wordKey(prefix,word);size_t wrote=p.putULong64(key.c_str(),value);uint64_t verify=p.getULong64(key.c_str(),~value);p.end();return wrote>0&&verify==value;\n}\nvoid eventStateBegin(){\n  Preferences p;if(!p.begin(EVENT_STATE_NS,false))return;uint8_t rev=p.getUChar("rev",0);\n  if(rev>=EVENT_STATE_REVISION){for(size_t w=0;w<EVENT_STATE_WORDS;w++){String ek=wordKey("en",w),fk=wordKey("fav",w);enabledWords[w]=p.getULong64(ek.c_str(),UINT64_MAX);favoriteWords[w]=p.getULong64(fk.c_str(),0);}}\n  else{for(size_t w=0;w<EVENT_STATE_WORDS;w++){enabledWords[w]=UINT64_MAX;favoriteWords[w]=0;String ek=wordKey("en",w),fk=wordKey("fav",w);p.putULong64(ek.c_str(),enabledWords[w]);p.putULong64(fk.c_str(),favoriteWords[w]);}p.putUChar("rev",EVENT_STATE_REVISION);}\n  p.end();stateLoaded=true;\n}\nbool eventStateEnabled(size_t index){if(index>=MAX_BUILTIN_EVENTS)return false;if(!stateLoaded)eventStateBegin();return (enabledWords[index/64]>>(index%64))&1ULL;}\nbool eventStateFavorite(size_t index){if(index>=MAX_BUILTIN_EVENTS)return false;if(!stateLoaded)eventStateBegin();return (favoriteWords[index/64]>>(index%64))&1ULL;}\nbool eventStateSetEnabled(size_t index,bool enabled){if(index>=MAX_BUILTIN_EVENTS)return false;if(!stateLoaded)eventStateBegin();size_t w=index/64;uint64_t bit=1ULL<<(index%64),next=enabled?enabledWords[w]|bit:enabledWords[w]&~bit;if(next==enabledWords[w])return true;if(!persistWord("en",w,next))return false;enabledWords[w]=next;return true;}\nbool eventStateSetFavorite(size_t index,bool favorite){if(index>=MAX_BUILTIN_EVENTS)return false;if(!stateLoaded)eventStateBegin();size_t w=index/64;uint64_t bit=1ULL<<(index%64),next=favorite?favoriteWords[w]|bit:favoriteWords[w]&~bit;if(next==favoriteWords[w])return true;if(!persistWord("fav",w,next))return false;favoriteWords[w]=next;return true;}\nbool eventStateResetAll(){\n  Preferences p;if(!p.begin(EVENT_STATE_NS,false))return false;bool ok=true;\n  for(size_t w=0;w<EVENT_STATE_WORDS;w++){enabledWords[w]=UINT64_MAX;favoriteWords[w]=0;String ek=wordKey("en",w),fk=wordKey("fav",w);p.putULong64(ek.c_str(),enabledWords[w]);p.putULong64(fk.c_str(),favoriteWords[w]);ok=ok&&p.getULong64(ek.c_str(),0)==UINT64_MAX&&p.getULong64(fk.c_str(),UINT64_MAX)==0;}\n  p.putUChar("rev",EVENT_STATE_REVISION);ok=ok&&p.getUChar("rev",0)==EVENT_STATE_REVISION;p.end();stateLoaded=true;return ok;\n}\n')
          write("firmware/include/Scheduler.h",'#pragma once\n#include <Arduino.h>\n#include <time.h>\n#include "Types.h"\nclass Scheduler {\n public:\n  Scheduler(AppSettings* settings):cfg(settings){}\n  Theme resolve(const tm& local);\n  bool inRunWindow(const tm& local) const;\n  String nextEventLabel(const tm& local) const;\n private:\n  AppSettings* cfg;\n};\n')
          write("firmware/src/Scheduler.cpp",'#include "Scheduler.h"\n#include "EventCatalog.h"\n#include "EventState.h"\n#include <vector>\nextern Theme applyEventOverrideByIndex(size_t i,const Theme& base);\n\nbool Scheduler::inRunWindow(const tm& l) const{\n  int m=l.tm_hour*60+l.tm_min,a=cfg->onMinutes,b=cfg->offMinutes;\n  if(a==b)return true;if(a<b)return m>=a&&m<b;return m>=a||m<b;\n}\nTheme Scheduler::resolve(const tm& l){\n  Theme normal;normal.name="Warm White";normal.effect=Effect::Solid;normal.colors[0]=0xFFFFFA;normal.colorCount=1;\n  if(!cfg->schedulerEnabled)return normal;\n  std::vector<size_t> exact,multiHoliday,monthly,seasonal;\n  for(size_t i=0;i<EVENT_COUNT;i++){\n    if(!eventStateEnabled(i)||!eventActiveOn(i,l))continue;const auto&e=EVENTS[i];\n    if(e.rule==RuleType::Month||(e.kind==EventKind::Awareness&&e.durationDays>1)){if(e.kind==EventKind::Seasonal)seasonal.push_back(i);else monthly.push_back(i);}\n    else if(e.kind==EventKind::Holiday&&e.durationDays>1)multiHoliday.push_back(i);\n    else exact.push_back(i);\n  }\n  auto pickHolidayFirst=[&](const std::vector<size_t>&v)->int{for(auto i:v)if(EVENTS[i].kind==EventKind::Holiday)return (int)i;return v.empty()?-1:(int)v[0];};\n  int p=pickHolidayFirst(exact);if(p>=0)return applyEventOverrideByIndex(p,themeFromEvent(p));\n  p=pickHolidayFirst(multiHoliday);if(p>=0)return applyEventOverrideByIndex(p,themeFromEvent(p));\n  if(!monthly.empty()){\n    if(monthly.size()==1)return applyEventOverrideByIndex(monthly[0],themeFromEvent(monthly[0]));\n    if(cfg->overlap==2){Theme t;t.name="Combined Monthly Themes";t.effect=Effect::Gradient;t.colorCount=0;for(auto i:monthly){Theme et=applyEventOverrideByIndex(i,themeFromEvent(i));for(int c=0;c<et.colorCount&&t.colorCount<8;c++)t.colors[t.colorCount++]=et.colors[c];}return t;}\n    int idx=0;if(cfg->overlap==0)idx=(l.tm_mday-1)%monthly.size();else{int mins=l.tm_hour*60+l.tm_min,start=cfg->onMinutes,end=cfg->offMinutes;if(end<=start)end+=1440;if(mins<start)mins+=1440;int span=max(1,end-start),pos=constrain(mins-start,0,span-1);idx=min((int)monthly.size()-1,(int)(pos*monthly.size()/span));}\n    return applyEventOverrideByIndex(monthly[idx],themeFromEvent(monthly[idx]));\n  }\n  if(!seasonal.empty())return applyEventOverrideByIndex(seasonal[0],themeFromEvent(seasonal[0]));return normal;\n}\nString Scheduler::nextEventLabel(const tm& l) const{\n  int y=l.tm_year+1900;tm copy=l;time_t now=mktime(&copy),best=0;int bi=-1;\n  for(size_t i=0;i<EVENT_COUNT;i++){if(!eventStateEnabled(i)||EVENTS[i].rule==RuleType::Month)continue;for(int yy=y;yy<=y+1;yy++){time_t s=eventStartEpoch(i,yy);if(s>now&&(!best||s<best)){best=s;bi=i;}}}\n  if(bi<0)return "-";tm out{};localtime_r(&best,&out);return String(EVENTS[bi].name)+" - "+eventWhen(bi,out.tm_year+1900);\n}\n')
          
          replace_once("firmware/include/Types.h",
            "enum class RuleType : uint8_t { Fixed, Month, NthWeekday, LastWeekday, EasterOffset, Hanukkah };",
            "enum class RuleType : uint8_t { Fixed, Month, NthWeekday, LastWeekday, EasterOffset, Hanukkah, MonthEnd, YearTable };")
          
          p="firmware/src/PaletteMigration.cpp";s=Path(p).read_text()
          if '#include "EventState.h"' not in s:s=s.replace('#include "ColorCorrection.h"','#include "ColorCorrection.h"\n#include "EventState.h"',1)
          s=s.replace('PALETTE_MIGRATION_REVISION=4','PALETTE_MIGRATION_REVISION=5',1)
          s=s.replace('for(size_t i=0;i<64;i++)','for(size_t i=0;i<MAX_BUILTIN_EVENTS;i++)')
          if 'static bool transformFavoriteJson(const String& original,String& corrected){\n  (void)original;JsonDocument d;JsonArray a=d.to<JsonArray>();\n  a.add("#FF0D00");a.add("#FF0024");a.add("#FFFF44");a.add("#28FF00");a.add("#0D00FF");a.add("#5B00E6");\n  serializeJson(d,corrected);return true;\n}' not in s: raise SystemExit('PaletteMigration favorite transform block not found')
          s=s.replace('static bool transformFavoriteJson(const String& original,String& corrected){\n  (void)original;JsonDocument d;JsonArray a=d.to<JsonArray>();\n  a.add("#FF0D00");a.add("#FF0024");a.add("#FFFF44");a.add("#28FF00");a.add("#0D00FF");a.add("#5B00E6");\n  serializeJson(d,corrected);return true;\n}','static bool transformFavoriteJson(const String& original,String& corrected){\n  (void)original;JsonDocument d;JsonArray a=d.to<JsonArray>();\n  a.add("#FF0000");a.add("#FF0D00");a.add("#FF0024");a.add("#FFFF44");a.add("#28FF00");a.add("#00BD4C");a.add("#0D00FF");a.add("#5B00E6");a.add("#FFFFFA");\n  serializeJson(d,corrected);return true;\n}',1).replace('six approved user baselines','nine approved user baselines')
          Path(p).write_text(s)
          
          p="firmware/src/main.cpp";s=Path(p).read_text()
          if '#include "EventState.h"' not in s:s=s.replace('#include "EventCatalog.h"','#include "EventCatalog.h"\n#include "EventState.h"',1)
          s=s.replace('static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.0.18";','static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.0.20";',1)
          s,n=re.subn(r'// v2\.0 Home favorite baseline:.*?(?=static bool storageSelfTest\(\))','// v3.0.20 master calendar migration: replace built-in event/favorite state once while\n// preserving Wi-Fi, BLE, PINs, custom lights, and custom schedules.\nstatic bool writeMasterFavoriteColors(){\n  JsonDocument d;JsonArray a=d.to<JsonArray>();\n  a.add("#FF0000");a.add("#FF0D00");a.add("#FF0024");a.add("#FFFF44");a.add("#28FF00");a.add("#00BD4C");a.add("#0D00FF");a.add("#5B00E6");a.add("#FFFFFA");\n  String raw;serializeJson(d,raw);Preferences p;if(!p.begin("anderson-colors",false))return false;size_t wrote=p.putString("saved",raw);bool ok=wrote==raw.length()&&p.getString("saved","")==raw;p.end();return ok;\n}\nstatic bool clearCustomPresetFavorites(){\n  JsonDocument presets;if(deserializeJson(presets,presetStoreRaw())||!presets.is<JsonArray>())return false;bool changed=false;\n  for(JsonObject p:presets.as<JsonArray>())if(p["favorite"]|false){p["favorite"]=false;changed=true;}\n  if(!changed)return true;String out;serializeJson(presets,out);return customFileWrite("/custom_lights.json",out);\n}\nstatic bool migrateMasterCalendarV1(){\n  Preferences marker;if(!marker.begin("anderson",true))return false;uint8_t rev=marker.getUChar("calendarrev",0);marker.end();if(rev>=1)return true;\n  if(!clearCustomPresetFavorites()||!writeMasterFavoriteColors())return false;\n  Preferences ep;if(!ep.begin("anderson-event",false))return false;bool cleared=ep.clear();ep.end();if(!cleared)return false;\n  if(!eventStateResetAll())return false;\n  auto&s=store.get();s.enabledMask=UINT64_MAX;s.favoriteMask=0;s.leadDays=0;s.trailDays=0;s.overlap=0;store.saveAll();\n  if(!marker.begin("anderson",false))return false;marker.putUChar("calendarrev",1);bool ok=marker.getUChar("calendarrev",0)==1;marker.end();return ok;\n}\n',s,count=1,flags=re.S)
          if n!=1:raise SystemExit('old home favorites migration block not found')
          s=s.replace('static EventOverrideCfg eventOverrides[64];','static EventOverrideCfg eventOverrides[MAX_BUILTIN_EVENTS];',1)
          if 'Theme applyEventOverrideByIndex(size_t i,const Theme& base){\n  Theme t=base;if(i>=64||!eventOverrides[i].valid){scheduledEventSpeedHint=1;return t;}\n  scheduledEventSpeedHint=constrain(eventOverrides[i].speed,1,5);t.effect=eventOverrides[i].effect;t.colorCount=eventOverrides[i].colorCount;\n  for(uint8_t c=0;c<t.colorCount;c++)t.colors[c]=eventOverrides[i].colors[c];\n  return t;\n}' not in s:raise SystemExit('applyEventOverride block not found')
          s=s.replace('Theme applyEventOverrideByIndex(size_t i,const Theme& base){\n  Theme t=base;if(i>=64||!eventOverrides[i].valid){scheduledEventSpeedHint=1;return t;}\n  scheduledEventSpeedHint=constrain(eventOverrides[i].speed,1,5);t.effect=eventOverrides[i].effect;t.colorCount=eventOverrides[i].colorCount;\n  for(uint8_t c=0;c<t.colorCount;c++)t.colors[c]=eventOverrides[i].colors[c];\n  return t;\n}','Theme applyEventOverrideByIndex(size_t i,const Theme& base){\n  Theme t=base;scheduledEventSpeedHint=eventSpeed(i);\n  if(i>=EVENT_COUNT||i>=MAX_BUILTIN_EVENTS||!eventOverrides[i].valid)return t;\n  scheduledEventSpeedHint=constrain(eventOverrides[i].speed,1,5);t.effect=eventOverrides[i].effect;t.colorCount=eventOverrides[i].colorCount;\n  for(uint8_t c=0;c<t.colorCount;c++)t.colors[c]=eventOverrides[i].colors[c];\n  return t;\n}',1)
          s=s.replace('for(size_t i=0;i<EVENT_COUNT&&i<64;i++){','for(size_t i=0;i<EVENT_COUNT&&i<MAX_BUILTIN_EVENTS;i++){')
          s=s.replace('if(i>=64)return;EventOverrideCfg&o=eventOverrides[i];','if(i>=EVENT_COUNT||i>=MAX_BUILTIN_EVENTS)return;EventOverrideCfg&o=eventOverrides[i];',1)
          s=s.replace('static void clearEventOverride(size_t i){if(i>=64)return;','static void clearEventOverride(size_t i){if(i>=EVENT_COUNT||i>=MAX_BUILTIN_EVENTS)return;',1)
          
          s=s.replace('e["customized"]=i<64?eventOverrides[i].valid:false;e["speed"]=(i<64&&eventOverrides[i].valid)?eventOverrides[i].speed:1;e["enabled"]=i<64?((s.enabledMask>>i)&1ULL):true;e["favorite"]=i<64?((s.favoriteMask>>i)&1ULL):false;','e["customized"]=i<MAX_BUILTIN_EVENTS?eventOverrides[i].valid:false;e["speed"]=(i<MAX_BUILTIN_EVENTS&&eventOverrides[i].valid)?eventOverrides[i].speed:eventSpeed(i);e["enabled"]=eventStateEnabled(i);e["favorite"]=eventStateFavorite(i);',1)
          s=s.replace('for(size_t i=0;i<EVENT_COUNT&&i<64;i++){if(!((s.favoriteMask>>i)&1ULL))continue;','for(size_t i=0;i<EVENT_COUNT&&i<MAX_BUILTIN_EVENTS;i++){if(!eventStateFavorite(i))continue;',1)
          s=s.replace('e["speed"]=eventOverrides[i].valid?eventOverrides[i].speed:1;','e["speed"]=eventOverrides[i].valid?eventOverrides[i].speed:eventSpeed(i);',1)
          s=s.replace('int i=eventIndexById(id);if(i<0||i>=64){server.send(404,"text/plain","Unknown event");return;}auto&s=store.get();','int i=eventIndexById(id);if(i<0||i>=(int)EVENT_COUNT||i>=(int)MAX_BUILTIN_EVENTS){server.send(404,"text/plain","Unknown event");return;}auto&s=store.get();',1)
          s=s.replace('if(!d["enabled"].isNull()){if(d["enabled"].as<bool>())s.enabledMask|=(1ULL<<i);else s.enabledMask&=~(1ULL<<i);}','if(!d["enabled"].isNull())eventStateSetEnabled(i,d["enabled"].as<bool>());',1)
          s=s.replace('if(!d["favorite"].isNull()){if(d["favorite"].as<bool>())s.favoriteMask|=(1ULL<<i);else s.favoriteMask&=~(1ULL<<i);}','if(!d["favorite"].isNull())eventStateSetFavorite(i,d["favorite"].as<bool>());',1)
          s=s.replace('for(size_t i=0;i<EVENT_COUNT&&i<64;i++)if(eventOccursInMonth(i,y,m)){if(en)s.enabledMask|=(1ULL<<i);else s.enabledMask&=~(1ULL<<i);}','for(size_t i=0;i<EVENT_COUNT&&i<MAX_BUILTIN_EVENTS;i++)if(eventOccursInMonth(i,y,m))eventStateSetEnabled(i,en);',1)
          
          old_setup='store.begin();remoteUpdateNoteBoot(ANDERSON_FIRMWARE_VERSION);loadPinAuthConfig();customFsReady=storageSelfTest();if(customFsReady){migrateLegacyCustomStorage();migrateV2HomeFavorites();runPaletteColorMigration();}loadEventOverrides();'
          new_setup='store.begin();eventStateBegin();remoteUpdateNoteBoot(ANDERSON_FIRMWARE_VERSION);loadPinAuthConfig();customFsReady=storageSelfTest();if(customFsReady){migrateLegacyCustomStorage();runPaletteColorMigration();migrateMasterCalendarV1();}loadEventOverrides();'
          if old_setup not in s:raise SystemExit('setup migration chain not found')
          s=s.replace(old_setup,new_setup,1)
          Path(p).write_text(s)
          
          Path("FIRMWARE_VERSION.txt").write_text("3.0.20\n")
          rp=Path("README.md");rs=rp.read_text();rs=rs.replace('Current firmware: **v3.0.19**.','Current firmware: **v3.0.20**.',1);rp.write_text(rs)
          
          ev=Path("firmware/src/EventCatalog.cpp").read_text();main=Path("firmware/src/main.cpp").read_text();pal=Path("firmware/src/PaletteMigration.cpp").read_text()
          assert ev.count('{"evt')==210, ev.count('{"evt')
          halloween=next(line for line in ev.splitlines() if '"Halloween"' in line)
          assert '0xFF0D00' in halloween and '0x5B00E6' in halloween and '0x28FF00' not in halloween, halloween
          assert 'eventOverrides[64]' not in main
          assert 'i<64' not in main
          assert 'migrateV2HomeFavorites' not in main
          assert 'eventStateBegin()' in main and 'migrateMasterCalendarV1()' in main
          assert 'ANDERSON_FIRMWARE_VERSION="3.0.20"' in main
          assert Path("FIRMWARE_VERSION.txt").read_text().strip()=="3.0.20"
          assert pal.count('a.add("#')>=9
          print('Validated 210-event master catalog, 9-color favorites, Halloween Orange/Purple only, and expanded event state.')
          PY
      - name: Commit staged source only
        shell: bash
        run: |
          rm -f .github/workflows/stage-master-calendar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage v3.0.20 210-event master calendar"
          git push origin HEAD:staging/palette-holiday-update
