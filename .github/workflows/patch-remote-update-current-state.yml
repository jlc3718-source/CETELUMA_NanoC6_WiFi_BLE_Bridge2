name: Fix Remote Update Current-State Button

on:
  push:
    branches: ['codex/release-current']
    paths: ['.github/trigger-remote-update-current-state.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-current
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-enable Remote Update when firmware is already current
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old,new,1))

          replace_once(
              'firmware/web/index.html',
              'if(!o.updateAvailable)return void(t.textContent=o.message||"Signed manifest verified; this firmware is current.");',
              'if(!o.updateAvailable){t.textContent=o.message||"Signed manifest verified; this firmware is current.",e.disabled=!1;return}'
          )
          replace_once('FIRMWARE_VERSION.txt','3.1.47\n','3.1.48\n')
          replace_once(
              'firmware/src/main.cpp',
              'static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.47";',
              'static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.48";'
          )
          Path('firmware/RELEASE_NOTES_v3.1.48.md').write_text(
              '# Anderson Home v3.1.48\n\n'
              '- Keeps the single **Remote Update** workflow introduced in v3.1.47.\n'
              '- Re-enables the Remote Update button after a successful check reports that the installed firmware is already current.\n'
              '- Signed-manifest, SHA-256, inactive-slot install, reboot verification, rollback, and update-hold protections are unchanged.\n'
          )
          PY
      - name: Run focused checks
        run: |
          python tools/test_regressions.py
          python tools/test_audit_fixes.py
          grep -q 'id="remoteFirmware"' firmware/web/index.html
          grep -q 'e.disabled=!1;return' firmware/web/index.html
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = "3.1.48"
      - name: Commit and remove one-shot scaffolding
        run: |
          rm -f .github/workflows/patch-remote-update-current-state.yml .github/trigger-remote-update-current-state.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Anderson Home 3.1.48 keep Remote Update reusable when current"
          git push origin HEAD:codex/release-current
