name: Align v3.1.13 Runtime Marker

on:
  push:
    branches: ['work/v3.1.13-backup-path-fix']

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.1.13-backup-path-fix
      - name: Align runtime version and validate
        run: |
          sed -i 's/ANDERSON_FIRMWARE_VERSION="3.1.12"/ANDERSON_FIRMWARE_VERSION="3.1.13"/' firmware/src/main.cpp
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.13"' firmware/src/main.cpp
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = "3.1.13"
          python tools/test_regressions.py
      - name: Commit alignment and remove helper
        run: |
          rm -f .github/workflows/zz-align-v3.1.13-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Align v3.1.13 runtime version"
          git push origin HEAD:refs/heads/work/v3.1.13-backup-path-fix
