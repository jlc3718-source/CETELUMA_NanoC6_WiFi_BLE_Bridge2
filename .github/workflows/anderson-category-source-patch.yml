name: Apply Anderson Event Category Source Patch

on:
  push:
    branches: ['codex/release-current']
    paths: ['.github/trigger-category-source-patch.txt']

permissions:
  contents: write

concurrency:
  group: anderson-category-source-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source patch
        run: |
          set -euo pipefail
          python tools/apply_event_category_patch.py
          node --check firmware/web/event_categories.js
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = "3.1.49"
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.49"' firmware/src/main.cpp
          grep -q 'EVENT_CATEGORY_CSS' tools/release.py
      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name "Anderson Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add FIRMWARE_VERSION.txt firmware/src/main.cpp tools/release.py
          git diff --cached --check
          git commit -m "Build Anderson Home 3.1.49 event categories"
          git push origin HEAD:codex/release-current
