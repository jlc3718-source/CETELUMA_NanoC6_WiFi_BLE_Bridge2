name: Jason Home 2 isolated pixel grounding experiment
on:
  push:
    branches: [codex/jh2-image-model-benchmark-20261019]
    paths: ['.github/workflows/jh2-vision-probe-20261019.yml']
permissions: {contents: read}
concurrency: {group: jason-home-oracle-production, cancel-in-progress: false}
jobs:
  pixel-grounding:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 25
    steps:
      - name: Verify free local vision weights and run isolated caption and polygon inference
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import pathlib
          pathlib.Path('/opt/jh2-image-benchmark-20261019/florence_probe.mjs').write_text("/** Isolated pixel-based caption/segmentation experiment; never a production acceptance claim. */\nimport fs from 'node:fs/promises';\nimport path from 'node:path';\nimport {performance} from 'node:perf_hooks';\nimport {Florence2ForConditionalGeneration,AutoProcessor,RawImage,env,cat,ones} from '@huggingface/transformers';\n\nenv.allowRemoteModels=false;\nenv.allowLocalModels=true;\nenv.backends.onnx.wasm.numThreads=1;\nconst modelPath='/vision-model';\nconst output='/output/vision-probe';\nawait fs.mkdir(output,{recursive:true});\nconst started=performance.now();\nconst model=await Florence2ForConditionalGeneration.from_pretrained(modelPath,{\n  local_files_only:true,dtype:'q8',device:'cpu',\n  session_options:{intraOpNumThreads:1,interOpNumThreads:1,executionMode:'sequential'},\n});\nconst processor=await AutoProcessor.from_pretrained(modelPath,{local_files_only:true});\nconst report={model:'onnx-community/Florence-2-base-ft',library:'@huggingface/transformers@3.8.1',\n  loadSeconds:(performance.now()-started)/1000,tests:[],productionIntegrated:false,physicalCommandsSent:0};\n\n// Florence's official processor quantizes coordinates into 1000 bins. The pinned\n// JS processor does not implement polygons, so retain raw tokens and decode only\n// explicitly present coordinate runs. Empty/malformed output remains a failure.\nfunction polygons(text,width,height){\n  const runs=[...text.matchAll(/(?:<loc_\\d+>){6,}/g)];\n  return runs.map(([run])=>{\n    const q=[...run.matchAll(/<loc_(\\d+)>/g)].map(x=>Number(x[1]));\n    if(q.length%2||q.some(x=>x<0||x>999))throw Error('Invalid polygon coordinate tokens');\n    return q.map((v,i)=>(v+.5)/1000*(i%2?height:width));\n  });\n}\n\nfor(const [file,labels] of [\n  ['ghost_tiny_256.png',['the ghost','the eyes of the ghost','the mouth of the ghost']],\n  ['novel_armadillo_tiny_256.png',['the armadillo','the red scarf']],\n]){\n  const image=await RawImage.read('/input/'+file);\n  const processed=await processor(image);\n  const visionStart=performance.now();\n  const features=await model.encode_image({pixel_values:processed.pixel_values});\n  const imageRow={file,visionSeconds:(performance.now()-visionStart)/1000,results:[]};\n  const tasks=[['<MORE_DETAILED_CAPTION>','',160],...labels.map(x=>['<REFERRING_EXPRESSION_SEGMENTATION>',x,640])];\n  for(const [task,label,max] of tasks){\n    const text=processor.tokenizer(processor.construct_prompts(task+label));\n    const inputs_embeds=cat([features,await model.encode_text({input_ids:text.input_ids})],1);\n    const attention_mask=cat([ones(features.dims.slice(0,2)),text.attention_mask],1);\n    const begin=performance.now();\n    const generated=await model.generate({inputs_embeds,attention_mask,max_new_tokens:max,do_sample:false,num_beams:1});\n    const raw=processor.batch_decode(generated,{skip_special_tokens:false})[0];\n    const row={task,label,seconds:(performance.now()-begin)/1000,raw};\n    if(task.includes('SEGMENTATION')){\n      row.polygons=polygons(raw,...image.size);\n      row.status=row.polygons.length?'polygon_requires_visual_review':'no_polygon';\n    }else row.caption=processor.post_process_generation(raw,task,image.size)[task];\n    imageRow.results.push(row);\n    console.log('VISION_RESULT '+JSON.stringify({file,...row}));\n    report.tests=[...report.tests.filter(x=>x.file!==file),imageRow];\n    await fs.writeFile(path.join(output,'vision_probe_results.json'),JSON.stringify(report,null,2));\n  }\n}\nreport.totalSeconds=(performance.now()-started)/1000;\nawait fs.writeFile(path.join(output,'vision_probe_results.json'),JSON.stringify(report,null,2));\nawait model.dispose();\n")
          """Finite Florence experiment; touches only the new Jason Home 2 benchmark directory."""
          import hashlib,json,os,pathlib,subprocess,time,urllib.request
          ROOT=pathlib.Path('/opt/jh2-image-benchmark-20261019')
          PROBE_SOURCE=(ROOT/'florence_probe.mjs').read_text()
          WORK=ROOT/'vision-runtime';MODEL=ROOT/'models'/'florence-2-base-ft';OUT=ROOT/'output'/'vision-probe'
          for p in [WORK,MODEL,OUT]:p.mkdir(exist_ok=True)
          def docker(*args,timeout=45):
              return subprocess.run(['sudo','-n','docker',*args],capture_output=True,text=True,timeout=timeout)
          def available():
              return int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))*1024
          def json_url(url):
              with urllib.request.urlopen(url,timeout=45) as r:return json.load(r)
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for b in iter(lambda:f.read(1024**2),b''):h.update(b)
              return h.hexdigest()
          assert all((ROOT/'output'/'tiny-decoder'/f).is_file() for f in ['ghost_tiny_256.png','novel_armadillo_tiny_256.png']), 'Real source images required before vision experiment'
          assert available()>2600*1024**2,'Insufficient available host RAM'
          meta=json_url('https://huggingface.co/api/models/onnx-community/Florence-2-base-ft?blobs=true')
          revision=meta['sha'];assert len(revision)==40 and all(c in '0123456789abcdef' for c in revision)
          names={'config.json','generation_config.json','preprocessor_config.json','processor_config.json','tokenizer.json',
                 'tokenizer_config.json','special_tokens_map.json','vocab.json','merges.txt','added_tokens.json','README.md'}
          names.update('onnx/'+x+'_quantized.onnx' for x in ['vision_encoder','embed_tokens','encoder_model','decoder_model_merged'])
          manifest={'repository':'onnx-community/Florence-2-base-ft','baseModel':'microsoft/Florence-2-base-ft',
                    'revision':revision,'license':'MIT','files':[],'productionIntegrated':False}
          for entry in meta['siblings']:
              name=entry['rfilename']
              if name not in names:continue
              target=MODEL/name;target.parent.mkdir(exist_ok=True)
              expected=entry.get('lfs',{}).get('sha256')
              if not target.is_file() or (expected and sha(target)!=expected):
                  temp=target.with_suffix(target.suffix+'.partial')
                  with urllib.request.urlopen('https://huggingface.co/'+manifest['repository']+'/resolve/'+revision+'/'+name,timeout=120) as r,temp.open('wb') as f:
                      total=0
                      while True:
                          chunk=r.read(1024**2)
                          if not chunk:break
                          total+=len(chunk);assert total<200*1024**2,'Unexpected model-file size'
                          f.write(chunk)
                  if expected:assert sha(temp)==expected,'Model checksum mismatch'
                  else:
                      data=temp.read_bytes()
                      git_sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                      assert git_sha==entry['blobId'],'Configuration Git blob mismatch'
                  temp.replace(target)
              manifest['files'].append({'file':name,'bytes':target.stat().st_size,'sha256':sha(target)})
          assert all((MODEL/('onnx/'+x+'_quantized.onnx')).is_file() for x in ['vision_encoder','embed_tokens','encoder_model','decoder_model_merged'])
          license_meta=json_url('https://huggingface.co/api/models/microsoft/Florence-2-base-ft')
          license_revision=license_meta['sha'];assert len(license_revision)==40
          with urllib.request.urlopen('https://huggingface.co/microsoft/Florence-2-base-ft/resolve/'+license_revision+'/LICENSE',timeout=30) as r:license_text=r.read()
          assert b'MIT License' in license_text and b'Microsoft' in license_text
          (MODEL/'LICENSE').write_bytes(license_text)
          manifest['licenseRevision']=license_revision
          (OUT/'vision_model_manifest.json').write_text(json.dumps(manifest,indent=2))
          print('VISION_MODEL_MANIFEST '+json.dumps(manifest),flush=True)
          
          base='node:22.20.0-bookworm-slim'
          pulled=docker('pull',base,timeout=300);assert pulled.returncode==0,pulled.stderr[-1200:]
          image=json.loads(docker('image','inspect',base).stdout)[0]
          image_id=image['Id'];manifest['runtimeImageId']=image_id
          manifest['runtimeImageDigests']=image.get('RepoDigests',[])
          (WORK/'package.json').write_text(json.dumps({'private':True,'type':'module','dependencies':{'@huggingface/transformers':'3.8.1'}}))
          (WORK/'probe.mjs').write_text(PROBE_SOURCE)
          observations=[]
          def guarded_container(name,args,limit):
              assert docker('inspect',name).returncode!=0,'Existing task container needs reconciliation'
              c=docker('create','--name',name,*args);assert c.returncode==0,c.stderr
              begin=time.monotonic();peak=0;cpu=0;minimum=available();reason=None;cg=None
              try:
                  assert docker('start',name).returncode==0
                  while True:
                      state=json.loads(docker('inspect',name,'--format','{{json .State}}').stdout)
                      if not state['Running']:break
                      try:
                          if cg is None:
                              line=next(l for l in pathlib.Path('/proc/'+str(state['Pid'])+'/cgroup').read_text().splitlines() if l.startswith('0::'))
                              cg=pathlib.Path('/sys/fs/cgroup')/line[3:].lstrip('/')
                          peak=max(peak,int((cg/'memory.peak').read_text()))
                          cpu=int(dict(x.split() for x in (cg/'cpu.stat').read_text().splitlines())['usage_usec'])
                      except (OSError,ValueError):pass
                      minimum=min(minimum,available())
                      if minimum<700*1024**2:reason='host_headroom_guard'
                      elif time.monotonic()-begin>limit:reason='time_limit'
                      if reason:docker('stop','--time','5',name)
                      time.sleep(.4)
                  log=docker('logs',name);(OUT/(name+'.log')).write_text(log.stdout+log.stderr)
                  row={'name':name,'wallSeconds':time.monotonic()-begin,'peakMemoryBytes':peak,'cpuSeconds':cpu/1e6,
                       'minHostAvailableBytes':minimum,'stopReason':reason,'exitCode':state['ExitCode'],'oomKilled':state['OOMKilled']}
                  observations.append(row);(OUT/'host_vision_results.json').write_text(json.dumps(observations,indent=2))
                  print('VISION_CONTAINER '+json.dumps(row),flush=True)
                  assert state['ExitCode']==0 and not reason, 'Isolated vision experiment failed; production remains unchanged'
              finally:
                  state=docker('inspect',name,'--format','{{.State.Running}}')
                  if state.returncode==0 and state.stdout.strip()=='true':docker('stop','--time','5',name)
                  if state.returncode==0:docker('rm',name)
          
          common=['--read-only','--cap-drop','ALL','--security-opt','no-new-privileges','--user',str(os.getuid())+':'+str(os.getgid()),
                  '--cpus=0.55','--cpu-shares=128','--pids-limit=128','--tmpfs','/tmp:rw,nosuid,size=256m',
                  '--mount','type=bind,source='+str(WORK)+',target=/workspace','--workdir','/workspace']
          guarded_container('jh2-vision-setup-20261019',common+['--memory=1536m','--memory-swap=1536m','--env','npm_config_cache=/tmp/npm-cache',image_id,
              'npm','install','--no-audit','--no-fund'],360)
          manifest['packageLockSha256']=sha(WORK/'package-lock.json')
          (OUT/'vision_model_manifest.json').write_text(json.dumps(manifest,indent=2))
          guarded_container('jh2-vision-probe-20261019',common+['--network','none','--memory=2048m','--memory-swap=2048m',
              '--mount','type=bind,source='+str(MODEL)+',target=/vision-model,readonly',
              '--mount','type=bind,source='+str(ROOT/'output'/'tiny-decoder')+',target=/input,readonly',
              '--mount','type=bind,source='+str(ROOT/'output')+',target=/output',image_id,'node','probe.mjs'],720)
          with urllib.request.urlopen('http://127.0.0.1:8081/api/health',timeout=8) as r:health=json.load(r)
          print('VISION_FINAL_HEALTH '+json.dumps(health),flush=True)
          PYTHON
      - name: Retain isolated vision measurements and exact model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jh2-vision-probe-20261019
          path: /opt/jh2-image-benchmark-20261019/output/vision-probe/*
          retention-days: 3
          if-no-files-found: warn
