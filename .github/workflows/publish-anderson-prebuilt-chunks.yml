name: Publish Prebuilt Anderson OTA (Local Payload)

on:
  push:
    branches: ['ota-staging-prebuilt/**']
    paths: ['prebuilt/**']

concurrency:
  group: anderson-production-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  STAGING_REF: ${{ github.ref_name }}

jobs:
  publish-prebuilt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout publisher tools only
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 1
      - name: Checkout exact staged local payload
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGING_REF }}
          path: staged
          fetch-depth: 1
      - name: Reassemble exact local firmware bytes
        run: |
          set -euo pipefail
          test -f staged/prebuilt/release.json
          XZ_FILE="$(find staged/prebuilt -maxdepth 1 -type f -name 'and_*.bin.xz' -print -quit)"
          if [ -n "$XZ_FILE" ]; then
            xz -dc "$XZ_FILE" > /tmp/anderson.bin
          else
            test -d staged/prebuilt/chunks
            cat staged/prebuilt/chunks/part*.b64 | base64 --decode > /tmp/anderson.bin.xz
            xz -dc /tmp/anderson.bin.xz > /tmp/anderson.bin
          fi
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,shutil
          root=Path('staged/prebuilt')
          manifest=json.loads((root/'release.json').read_text())
          version=str(manifest.get('version',''))
          commit=str(manifest.get('commit',''))
          assert re.fullmatch(r'\d+\.\d+\.\d+[a-z]?',version), 'invalid version'
          assert re.fullmatch(r'[0-9a-f]{40}',commit), 'invalid local source commit id'
          assert int(manifest.get('ota_slot_bytes',0))==0x1E0000, 'unexpected OTA slot'
          name=f'and_{version}.bin'; data=Path('/tmp/anderson.bin').read_bytes(); digest=hashlib.sha256(data).hexdigest()
          assert data and data[0]==0xE9, 'invalid ESP app header'
          assert len(data)<0x1E0000, 'app does not fit OTA slot'
          meta=manifest.get('files',{}).get(name)
          assert meta and int(meta.get('bytes',-1))==len(data) and meta.get('sha256')==digest, 'local payload hash/size mismatch'
          release_dir=Path('release-work'); release_dir.mkdir(exist_ok=True)
          shutil.copy2('/tmp/anderson.bin',release_dir/name)
          shutil.copy2(root/'release.json',release_dir/'release.json')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'VERSION={version}\nLOCAL_SOURCE_COMMIT={commit}\nOTA_BYTES={len(data)}\nOTA_SHA256={digest}\n')
          print(f'VERIFIED LOCAL PREBUILT {name}: {len(data)} bytes sha256={digest} source={commit}')
          PY
          source "$GITHUB_ENV"
          echo "OTA_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/anderson-v$VERSION/and_$VERSION.bin" >> "$GITHUB_ENV"
      - name: Create signed OTA manifest
        working-directory: repo
        env:
          OTA_SIGNING_KEY_B64: ${{ secrets.ANDERSON_OTA_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "${OTA_SIGNING_KEY_B64:-}"
          mkdir -p publish-input
          printf '%s' "$OTA_SIGNING_KEY_B64" | base64 --decode > /tmp/anderson-ota-signing-key.pem
          chmod 600 /tmp/anderson-ota-signing-key.pem
          python - <<'PY'
          from pathlib import Path
          import os
          Path('/tmp/anderson-ota-payload.txt').write_text(
              f"version={os.environ['VERSION']}\n"
              f"bytes={os.environ['OTA_BYTES']}\n"
              f"sha256={os.environ['OTA_SHA256']}\n"
              f"commit={os.environ['LOCAL_SOURCE_COMMIT']}\n"
              f"url={os.environ['OTA_URL']}\n"
          )
          PY
          openssl dgst -sha256 -sign /tmp/anderson-ota-signing-key.pem -out /tmp/anderson-ota-signature.der /tmp/anderson-ota-payload.txt
          OTA_SIGNATURE="$(base64 -w 0 /tmp/anderson-ota-signature.der)"; export OTA_SIGNATURE
          python - <<'PY'
          from pathlib import Path
          import json,os
          payload=Path('/tmp/anderson-ota-payload.txt').read_text()
          Path('publish-input/latest.json').write_text(json.dumps({'schema':1,'payload':payload,'signature':os.environ['OTA_SIGNATURE']},separators=(',',':')))
          PY
          shred -u /tmp/anderson-ota-signing-key.pem 2>/dev/null || rm -f /tmp/anderson-ota-signing-key.pem
          rm -f /tmp/anderson-ota-signature.der /tmp/anderson-ota-payload.txt
          python tools/verify_ota_manifest.py --manifest publish-input/latest.json --version "$VERSION" --bytes "$OTA_BYTES" --sha256 "$OTA_SHA256" --commit "$LOCAL_SOURCE_COMMIT" --url "$OTA_URL"
          cp publish-input/latest.json publish-input/ota-manifest.json
      - name: Publish release from exact local BIN
        working-directory: repo
        run: |
          set -euo pipefail
          TAG="anderson-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" "../release-work/and_$VERSION.bin" "../release-work/release.json" publish-input/ota-manifest.json --target main --title "Anderson Home v$VERSION" --notes "Locally built and verified Anderson Home firmware. Local source commit: $LOCAL_SOURCE_COMMIT. GitHub used only for signed OTA publication and hosting."
          rm -rf /tmp/release-check; mkdir -p /tmp/release-check
          gh release download "$TAG" --pattern "and_$VERSION.bin" --pattern release.json --pattern ota-manifest.json --dir /tmp/release-check
          cmp "../release-work/and_$VERSION.bin" "/tmp/release-check/and_$VERSION.bin"
          cmp "../release-work/release.json" /tmp/release-check/release.json
          cmp publish-input/ota-manifest.json /tmp/release-check/ota-manifest.json
      - name: Promote signed manifest to live OTA channel
        working-directory: repo
        run: |
          set -euo pipefail
          git fetch origin ota --quiet
          rm -rf ../ota-work
          git worktree add -B ota-prebuilt ../ota-work origin/ota
          mkdir -p ../ota-work/remote-update/releases ../ota-work/remote-update/pending
          if [ -s ../ota-work/latest.json ]; then
            python - <<'PY'
          import json,os,re
          def v(x):
            m=re.fullmatch(r'(\d+)\.(\d+)\.(\d+)([a-z]?)',x); assert m; return (*map(int,m.groups()[:3]),m.group(4))
          cur=json.load(open('../ota-work/latest.json'))['payload'].splitlines()[0].split('=',1)[1]
          assert v(os.environ['VERSION'])>v(cur),f'refusing non-upgrade OTA {cur} -> {os.environ["VERSION"]}'
          PY
          fi
          cp publish-input/latest.json ../ota-work/latest.json
          cp publish-input/latest.json ../ota-work/remote-update/latest.json
          cp publish-input/latest.json "../ota-work/remote-update/releases/$VERSION.json"
          rm -f "../ota-work/remote-update/pending/$VERSION.json"
          cd ../ota-work
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add latest.json remote-update
          git commit -m "Publish locally built Anderson Home v$VERSION OTA manifest"
          git push origin HEAD:refs/heads/ota
      - name: Verify live OTA matches local build exactly
        working-directory: repo
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.raw+json" "/repos/$GITHUB_REPOSITORY/contents/latest.json?ref=ota" > /tmp/live.json
          cmp publish-input/latest.json /tmp/live.json
          python tools/verify_ota_manifest.py --manifest /tmp/live.json --version "$VERSION" --bytes "$OTA_BYTES" --sha256 "$OTA_SHA256" --commit "$LOCAL_SOURCE_COMMIT" --url "$OTA_URL"
          gh release view "anderson-v$VERSION" --json assets > /tmp/assets.json
          python - <<'PY'
          import json,os
          a=json.load(open('/tmp/assets.json'))['assets']; name=f"and_{os.environ['VERSION']}.bin"
          hit=next(x for x in a if x['name']==name)
          assert int(hit['size'])==int(os.environ['OTA_BYTES'])
          assert (hit.get('digest') or '')==f"sha256:{os.environ['OTA_SHA256']}"
          PY
      - name: Remove temporary staging branch
        if: always()
        working-directory: repo
        continue-on-error: true
        run: git push origin --delete "$STAGING_REF"
