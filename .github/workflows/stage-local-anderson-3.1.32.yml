name: Stage Exact Local Anderson BIN 3.1.32

on:
  push:
    branches: ['staging-upload-3.1.32']
    paths: ['.github/transfer-trigger-3.1.32.txt']

permissions:
  contents: write

jobs:
  stage-exact-local-bin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch, verify, and stage exact local BIN
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat prebuilt/transfer-url.txt)"
          curl --fail --location --retry 2 --connect-timeout 15 "$URL" -o /tmp/and_3.1.32.bin
          test "$(stat -c%s /tmp/and_3.1.32.bin)" = "1825264"
          echo "5c64c841977a49ec38728daac120b52ef1efb0bce1f2ec53b9daf3d6c326f973  /tmp/and_3.1.32.bin" | sha256sum -c -
          test "$(od -An -tx1 -N1 /tmp/and_3.1.32.bin | tr -d ' \n')" = "e9"
          xz -9 -c /tmp/and_3.1.32.bin > prebuilt/and_3.1.32.bin.xz
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prebuilt/and_3.1.32.bin.xz
          git commit -m "Stage exact locally built Anderson 3.1.32 BIN for OTA publication"
          git push
