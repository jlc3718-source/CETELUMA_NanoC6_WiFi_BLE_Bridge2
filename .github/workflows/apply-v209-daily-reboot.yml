name: Apply Anderson v2.0.9 daily reboot
on:
  push:
    branches: [codex/daily-1800-reboot-v2-0-9]
    paths: [.github/workflows/apply-v209-daily-reboot.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/daily-1800-reboot-v2-0-9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply daily 6 PM reboot and bump firmware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firmware/src/main.cpp')
          s=p.read_text()
          anchor='void setup(){\n'
          assert s.count(anchor)==1
          block=r'''// ANDERSON_DAILY_MAINTENANCE_REBOOT: reboot once each local calendar day during the 18:00 minute.
static int32_t dailyRebootDateKey=0;
static uint32_t dailyRebootLastCheck=0;
static void loadDailyRebootMarker(){
  Preferences p;if(!p.begin("anderson-maint",true))return;dailyRebootDateKey=p.getInt("rebootDate",0);p.end();
}
static void checkDailyMaintenanceReboot(){
  if((uint32_t)(millis()-dailyRebootLastCheck)<1000UL)return;dailyRebootLastCheck=millis();
  if(!timeValid()||otaAutoRebootPending)return;
  time_t now=time(nullptr);tm local{};localtime_r(&now,&local);
  if(local.tm_hour!=18||local.tm_min!=0)return;
  int32_t dateKey=(local.tm_year+1900)*10000+(local.tm_mon+1)*100+local.tm_mday;
  if(dailyRebootDateKey==dateKey)return;
  Preferences p;if(!p.begin("anderson-maint",false))return;size_t wrote=p.putInt("rebootDate",dateKey);int32_t verify=p.getInt("rebootDate",0);p.end();
  if(wrote!=sizeof(int32_t)||verify!=dateKey)return;
  dailyRebootDateKey=dateKey;delay(100);ESP.restart();
}

'''
          s=s.replace(anchor,block+anchor)
          setup_old='  store.begin();remoteUpdateNoteBoot(ANDERSON_FIRMWARE_VERSION);loadPinAuthConfig();'
          setup_new='  store.begin();remoteUpdateNoteBoot(ANDERSON_FIRMWARE_VERSION);loadDailyRebootMarker();loadPinAuthConfig();'
          assert s.count(setup_old)==1
          s=s.replace(setup_old,setup_new)
          loop_old='void loop(){\n  server.handleClient();ble.loop();\n  if(!otaAutoRebootPending){remoteUpdateAutoLoop(ANDERSON_FIRMWARE_VERSION);'
          loop_new='void loop(){\n  server.handleClient();ble.loop();\n  checkDailyMaintenanceReboot();\n  if(!otaAutoRebootPending){remoteUpdateAutoLoop(ANDERSON_FIRMWARE_VERSION);'
          assert s.count(loop_old)==1
          s=s.replace(loop_old,loop_new)
          p.write_text(s)

          a=Path('AGENTS.md')
          t=a.read_text()
          marker='- Software speeds `2000/1000/500/250/100 ms`; Solid holds the first palette color.\n'
          assert t.count(marker)==1
          t=t.replace(marker,marker+'- Daily maintenance reboot occurs once per local calendar day during the 6:00 PM (18:00) minute after valid time sync; use the configured Anderson time zone/DST.\n')
          a.write_text(t)
          PY
          python tools/release.py bump
          python tools/release.py prepare
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/src/main.cpp firmware/web/index.html FIRMWARE_VERSION.txt README.md AGENTS.md
          git commit -m 'Anderson Home v2.0.9: reboot daily at 6 PM'
          git push origin HEAD:codex/daily-1800-reboot-v2-0-9
