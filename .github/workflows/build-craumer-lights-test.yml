name: Build Craumer Light Control

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Craumer_Lights_Eufy_Test_v2.zip'
      - 'craumer-lights-test/**'
      - '.github/workflows/build-craumer-lights-test.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /home/runner/.android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore stable Android debug signing identity
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: craumer-light-control-debug-signing-v2
      - name: Ensure stable Android debug signing identity exists
        run: |
          mkdir -p /home/runner/.android
          if [ ! -f /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -keystore /home/runner/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Craumer,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -f /home/runner/.android/debug.keystore
      - name: Extract Craumer base project
        run: |
          rm -rf build_source
          mkdir build_source
          unzip -q Craumer_Lights_Eufy_Test_v2.zip -d build_source
          test -f build_source/Craumer_Lights_Eufy_Test_v2/android/settings.gradle.kts
      - name: Apply Craumer v7 base
        run: python craumer-lights-test/v7_patch.py
      - name: Apply Craumer v8 discovery
        run: python craumer-lights-test/v8_patch.py
      - name: Apply Craumer v9 LAN discovery
        run: python craumer-lights-test/v9_patch.py
      - name: Apply known LAN light targets
        run: python craumer-lights-test/v10_known_lan_targets.py
      - name: Probe exact LAN targets
        run: python craumer-lights-test/v11_exact_target_probe.py
      - name: Listen for UDP discovery
        run: python craumer-lights-test/v12_udp_discovery_probe.py
      - name: Probe exact targets with UDP
        run: python craumer-lights-test/v13_active_udp_probe.py
      - name: Probe exact Eufy light identity
        run: python craumer-lights-test/v14_exact_identity_probe.py
      - name: Probe encrypted Eufy cloud inventory
        run: python craumer-lights-test/v16_security_cloud_probe.py
      - name: Apply permanent app name and login persistence
        run: python craumer-lights-test/app_name_patch.py
      - name: Build Android debug APK
        working-directory: build_source/Craumer_Lights_Eufy_Test_v2/android
        run: gradle --no-daemon assembleDebug
      - name: Copy APK
        run: cp build_source/Craumer_Lights_Eufy_Test_v2/android/app/build/outputs/apk/debug/app-debug.apk Craumer_Light_Control.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Craumer-Light-Control
          path: Craumer_Light_Control.apk
          if-no-files-found: error
