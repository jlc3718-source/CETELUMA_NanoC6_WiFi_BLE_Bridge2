name: Dispatch Anderson v3.1.24 Publish Once

on:
  push:
    branches: ['codex/publish-glass-3.1.24']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Dispatch Anderson v3.1.24 production publish'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch canonical production publisher
        run: |
          gh workflow run publish-anderson-home.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f build_run_id=34864577462 \
            -f head_sha=09d26ccd63e7fb774017f829a8211a8255607587 \
            -f head_branch=codex/release-current
