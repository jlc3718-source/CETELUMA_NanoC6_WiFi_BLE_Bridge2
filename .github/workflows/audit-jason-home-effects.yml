name: Audit Jason Home 2 device reports
on:
  push:
    branches: [jason-home-cloudflare-rebuild]
    paths: ['.github/workflows/audit-jason-home-effects.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - name: Read fresh reports from all four controllers
        run: |
          python3 - <<'PY'
          import json,urllib.request
          from pathlib import Path
          token=next(line.split('=',1)[1] for line in Path('/home/ubuntu/repo/JasonHomeServer/.env').read_text().splitlines() if line.startswith('JASON_HOME_API_TOKEN='))
          health=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/health'))
          assert health['build']['sha']=='1ca33c61c1b6cdea5c5e1be022fb8d6097a39f4a',health
          for target in ['Pool','House','Garage','Shed']:
              request=urllib.request.Request('http://127.0.0.1:8080/api/mqtt-probe',json.dumps({'target':target}).encode(),{'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              data=json.load(urllib.request.urlopen(request,timeout=45))
              print(json.dumps({k:data.get(k) for k in ['target','brokerAccepted','deviceReported','report']}))
              assert data.get('brokerAccepted') and data.get('deviceReported'),target
              assert data['report']['cmd']==2560,data['report']
          PY
