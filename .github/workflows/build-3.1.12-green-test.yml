name: Build Anderson 3.1.12 Green Test

on:
  push:
    branches: ['codex/3.1.12-green-test']
    paths: ['.github/workflows/build-3.1.12-green-test.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Create 3.1.12 green test from exact 3.1.11 source
        run: |
          python - <<'PY'
          from pathlib import Path
          v=Path('FIRMWARE_VERSION.txt')
          if v.read_text().strip() != '3.1.11':
              raise SystemExit('Base is not exact 3.1.11')
          v.write_text('3.1.12\n')

          p=Path('firmware/src/main.cpp')
          s=p.read_text()
          old='static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.11";'
          new='static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.12";'
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one 3.1.11 runtime version marker')
          p.write_text(s.replace(old,new,1))

          p=Path('firmware/web/v3_mockup.css')
          s=p.read_text()
          old='background:radial-gradient(ellipse at 2% 25%,#07316566,transparent 46%),radial-gradient(ellipse at 100% 68%,#25285c44,transparent 42%),linear-gradient(160deg,#030c1c,#020714)!important;'
          new='background:radial-gradient(ellipse at 2% 25%,#0d5a2f66,transparent 46%),radial-gradient(ellipse at 100% 68%,#214d3444,transparent 42%),linear-gradient(160deg,#03180c,#020d07)!important;'
          if s.count(old) != 1:
              raise SystemExit('Expected exact 3.1.11 page background once')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Prepare and validate release
        run: |
          python tools/release.py check
          python tools/release.py prepare
      - name: Compile NanoC6 app-only firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package app-only firmware
        run: python tools/release.py package
      - name: Verify app-only artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path('release/and_3.1.12.bin')
          if not p.exists(): raise SystemExit('Missing and_3.1.12.bin')
          data=p.read_bytes()
          if not data or data[0] != 0xE9: raise SystemExit('Invalid ESP app header')
          if len(data) >= 0x1E0000: raise SystemExit('Firmware exceeds OTA slot')
          m=json.loads(Path('release/release.json').read_text())
          h=hashlib.sha256(data).hexdigest()
          f=m['files']['and_3.1.12.bin']
          if f['bytes'] != len(data) or f['sha256'] != h: raise SystemExit('Manifest verification failed')
          print('and_3.1.12.bin', len(data), h)
          PY
      - name: Upload private test artifact only
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.12-GREEN-TEST
          path: |
            release/and_3.1.12.bin
            release/release.json
          if-no-files-found: error
          retention-days: 30
