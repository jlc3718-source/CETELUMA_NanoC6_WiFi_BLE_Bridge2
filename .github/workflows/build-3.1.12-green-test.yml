name: Build Anderson Home 3.1.12 Green Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Validate 3.1.12 green test source
        run: |
          set -euo pipefail
          test "$(cat FIRMWARE_VERSION.txt)" = "3.1.12"
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.12"' firmware/src/main.cpp
      - name: Prepare and validate release
        run: |
          python tools/release.py check
          python tools/release.py prepare
      - name: Compile NanoC6 app-only firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package app-only firmware
        run: python tools/release.py package
      - name: Upload private test artifact only
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.12-GREEN-TEST
          path: release/*
          if-no-files-found: error
          retention-days: 30
