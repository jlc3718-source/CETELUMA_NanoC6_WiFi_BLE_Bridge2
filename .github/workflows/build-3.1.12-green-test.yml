name: Build Anderson Home 3.1.12 Green Test

on:
  push:
    branches: ['codex/3.1.12-green-test']
    paths: ['.github/workflows/build-3.1.12-green-test.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Create 3.1.12 green test from exact 3.1.11 source
        run: |
          set -euo pipefail
          test "$(cat FIRMWARE_VERSION.txt)" = "3.1.12"
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.12"' firmware/src/main.cpp
      - name: Prepare and validate release
        run: |
          python tools/release.py check
          python tools/release.py prepare
      - name: Compile NanoC6 app-only firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package app-only firmware
        run: python tools/release.py package
      - name: Verify app-only artifact
        run: |
          set -euo pipefail
          test -s release/and_3.1.12.bin
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('release/and_3.1.12.bin');m=json.loads(Path('release/release.json').read_text())
          assert m['version']=='3.1.12'
          assert p.read_bytes()[0]==0xE9
          assert m['files']['and_3.1.12.bin']['bytes']==p.stat().st_size
          assert m['files']['and_3.1.12.bin']['sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          PY
      - name: Upload private test artifact only
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.12-GREEN-TEST
          path: release/*
          if-no-files-found: error
          retention-days: 30
