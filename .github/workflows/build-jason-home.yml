name: Build Jason Home Android

on:
  push:
    branches:
      - jason-home-3.1-build
      - jason-home-anderson-eufy
    paths:
      - 'JasonHome/**'
      - '.github/workflows/build-jason-home.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 5.0.22 production E120 engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          commands = Path('JasonHome/app/src/main/java/com/jasonhome/app/EufyLightCommands.java').read_text()
          controller = Path('JasonHome/app/src/main/java/com/jasonhome/app/BleLightController.java').read_text()
          bridge = Path('JasonHome/app/src/main/java/com/jasonhome/app/AndersonApiBridge.java').read_text()

          expected = {
              'Jump': 30009,
              'Breath': 30011,
              'Strobe': 30006,
              'Chase': 30010,
              'Gradient': 30007,
              'Twinkle': 30006,
              'Wipe': 30007,
              'Meteor': 30012,
              'Rainbow': 30013,
              'Pulse': 30013,
              'Solid / Static': 30014,
          }
          for name, mode in expected.items():
              if str(mode) not in commands:
                  raise SystemExit(f'Missing E120 mode {mode} for {name}')
          if 'return reverse ? 30008 : 30010' not in commands:
              raise SystemExit('Missing reverse-chase E120 mode')
          if 'groupedCatalogPresetE120(modeId,10034,speed,palette,lampCount,2)' not in commands:
              raise SystemExit('Production E120 grouped two-color path missing')
          if 'catalogPresetE120(modeId,10034,speed,palette,lampCount,false)' not in commands:
              raise SystemExit('Production E120 single-color path missing')
          if 'sendE120Static(job,g,c,p)' not in controller:
              raise SystemExit('Static color+hold sequence missing')
          if 'EufyLightCommands.effectE120(job.effect,job.colors,job.speed,job.reverse' not in controller:
              raise SystemExit('Normal EFFECT path is not using native E120 engine')
          if 'sendE120SceneEffect(job,g,c,p)' not in controller:
              raise SystemExit('Scene path is not using native E120 engine')
          if 'Craumer Home • Jason Home 5.0.22' not in bridge:
              raise SystemExit('Bridge version is not 5.0.22')
          print('5.0.22 production E120 source validation: PASS')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Anderson event calendar
        shell: bash
        run: |
          python3 JasonHome/tools/generate_anderson_events.py
          test -s JasonHome/app/src/main/java/com/jasonhome/app/AndersonEventData.java

      - name: Check E10 framing and session parser
        shell: bash
        run: |
          mkdir -p /tmp/jason-home-protocol-tests
          javac -d /tmp/jason-home-protocol-tests JasonHome/app/src/main/java/com/jasonhome/app/E10Probe.java JasonHome/tests/E10ProbeRegression.java
          java -cp /tmp/jason-home-protocol-tests com.jasonhome.app.E10ProbeRegression

      - name: Check E120/E22 effect serialization
        shell: bash
        run: |
          mkdir -p /tmp/jason-home-light-tests
          javac -d /tmp/jason-home-light-tests JasonHome/app/src/main/java/com/jasonhome/app/EufyLightCommands.java JasonHome/tests/EufyLightCommandsRegression.java
          java -cp /tmp/jason-home-light-tests com.jasonhome.app.EufyLightCommandsRegression

      - name: Check full Jason Home effect/color option catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("JasonHome/app/src/main/assets/anderson_home.html").read_text()
          js = Path("JasonHome/app/src/main/assets/v3_mockup.js").read_text()
          effects = [
              "Jump","Breath","Strobe","Solid","Chase","Gradient Sweep",
              "Candy Cane","Twinkle / Sparkle","Wipe / Fill","Meteor / Comet",
              "Rainbow Flow","Pulse Wave"
          ]
          quick = [
              "True Orange","Gold","Lime","Emerald","Aqua","Royal Blue",
              "Indigo","Magenta","Hot Pink","Rose","Warm White RGB","Neutral White RGB"
          ]
          missing = [x for x in effects if x not in html or x not in js]
          missing += [x for x in quick if x not in html]
          if missing:
              raise SystemExit("Missing Jason Home UI options: " + ", ".join(missing))
          print("Jason Home UI catalog regression: PASS")
          PY

      - name: Build unsigned release APK
        shell: bash
        run: |
          gradle -p JasonHome --no-daemon :app:assembleRelease
          cp JasonHome/app/build/outputs/apk/release/app-release-unsigned.apk Jason-Home-5.0.22-UNSIGNED.apk
          sha256sum Jason-Home-5.0.22-UNSIGNED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jason-Home-5.0.22-UNSIGNED-do-not-install
          path: Jason-Home-5.0.22-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package Android signing tools
        shell: bash
        run: |
          tar -czf android-build-tools-35.tar.gz -C "$ANDROID_HOME/build-tools" 35.0.0

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35
          path: android-build-tools-35.tar.gz
          if-no-files-found: error
          retention-days: 14
