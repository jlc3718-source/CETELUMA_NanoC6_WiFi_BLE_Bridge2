name: Build Craumer Home Android

on:
  push:
    branches:
      - jason-home-3.1-build
      - jason-home-anderson-eufy
      - jason-home-wifi-5.2.0-build
      - jason-home-cloudflare-rebuild
    paths:
      - 'JasonHome/**'
      - '.github/workflows/build-jason-home.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Jason Home Oracle Android source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          catalog=Path('JasonHome/app/src/main/java/com/jasonhome/app/LightPresetCatalog.java').read_text()
          commands=Path('JasonHome/app/src/main/java/com/jasonhome/app/EufyLightCommands.java').read_text()
          bridge=Path('JasonHome/app/src/main/java/com/jasonhome/app/AndersonApiBridge.java').read_text()
          main=Path('JasonHome/app/src/main/java/com/jasonhome/app/MainActivity.java').read_text()
          schedule_service=Path('JasonHome/app/src/main/java/com/jasonhome/app/AndersonScheduleService.java').read_text()
          cloud=Path('JasonHome/app/src/main/java/com/jasonhome/app/EufyCloudController.java').read_text()
          cloud_client=Path('JasonHome/app/src/main/java/com/jasonhome/app/CloudClient.java').read_text()
          secure_store=Path('JasonHome/app/src/main/java/com/jasonhome/app/CloudSessionStore.java').read_text()
          manifest=Path('JasonHome/app/src/main/AndroidManifest.xml').read_text()
          cloud_ui=Path('JasonHome/app/src/main/assets/jason_cloud_home.html')
          html=(cloud_ui if cloud_ui.exists() else Path('JasonHome/app/src/main/assets/anderson_home.html')).read_text()
          cloud_js=Path('JasonHome/app/src/main/assets/jason_cloud_home.js')
          js=(cloud_js if cloud_js.exists() else Path('JasonHome/app/src/main/assets/v3_mockup.js')).read_text()
          generator=Path('JasonHome/tools/generate_anderson_events.py').read_text()

          effects=['Solid / Static','Jump','Breath','Strobe','Chase','Gradient Sweep',
                   'Candy Cane','Twinkle / Sparkle','Wipe / Fill','Meteor / Comet',
                   'Rainbow Flow','Pulse Wave']
          for effect in effects:
              if effect not in catalog or effect not in js:
                  raise SystemExit('Missing effect '+effect)

          palette=catalog.split('static final NamedColor[] ANDERSON = {',1)[1].split('};',1)[0]
          if palette.count('new NamedColor(') != 36:
              raise SystemExit('Master color library is not 36 colors')

          required_colors=['Crimson','Coral','Bronze','Brown','Forest Green','Turquoise','Deep Purple','Black / Off']
          for color in required_colors:
              if color not in catalog:
                  raise SystemExit('Master catalog missing expanded color '+color)
              if not cloud_ui.exists() and color not in html:
                  raise SystemExit('Legacy UI missing expanded color '+color)

          if 'speedValueE22' not in commands or 'case 1: return 2;' not in commands or 'case 3: return 8;' not in commands or 'default: return 50;' not in commands:
              raise SystemExit('E22 five-speed calibration missing')
          if 'groupedCatalogPresetE120Multi' not in commands:
              raise SystemExit('E120 multi-color grouped serializer missing')
          if 'Wi-Fi / Internet' not in bridge or 'Eufy Cloud MQTT' not in bridge:
              raise SystemExit('Wi-Fi cloud status model missing')
          if '@JavascriptInterface' not in bridge or 'public String request(String method, String url, String body, String token)' not in bridge:
              raise SystemExit('Android WebView API bridge entry point missing')
          if 'Craumer Home • 5.4.11 Oracle' not in bridge:
              raise SystemExit('Bridge version is not 5.4.11 Oracle')
          for nav_marker in ['v3CurrentEventLink','openCurrentScheduledEvent','scheduledEventCard']:
              if nav_marker not in js:
                  raise SystemExit('Home current-event schedule jump missing '+nav_marker)
          for html_marker in ['dataset.eventId','dataset.customScheduleId']:
              if html_marker not in html:
                  raise SystemExit('Schedule card identity missing '+html_marker)
          if 'cloud.setScene' not in bridge or 'cloud.setBrightness' not in bridge or 'cloud.setEffect' not in bridge:
              raise SystemExit('Full Wi-Fi light controls are not routed through bridge')
          if 'cloud.setScene(0, scene.effect' not in schedule_service:
              raise SystemExit('Schedule service is not sending full Wi-Fi scenes')
          if 'new BleLightController' in main or 'BleLightController' in schedule_service:
              raise SystemExit('Bluetooth transport is still active in app startup or scheduler')
          if 'android.permission.BLUETOOTH' in manifest or 'android.hardware.bluetooth_le' in manifest:
              raise SystemExit('Bluetooth manifest permissions/features still enabled')
          for marker in ['class EufyCloudController','CloudSessionStore','setPower(int target,boolean on)','setBrightness(int target,int percent)','setEffect(int target,String effect','setScene(int target,String effect']:
              if marker not in cloud + secure_store:
                  raise SystemExit('Cloud controller/persistence missing '+marker)
          for marker in ['T8L006102353014B','T8L00610243503A2','T8L028102427474A','T8L0291024470193','get_user_mqtt_info','snTail','System.currentTimeMillis()%100000']:
              if marker not in cloud_client:
                  raise SystemExit('Validated Eufy cloud identity/transport missing '+marker)

          if 'data-tab="favorites"' in html:
              raise SystemExit('Favorites navigation still visible')
          if 'E120 command tests — Pool or House only' in html:
              raise SystemExit('Legacy E120 diagnostic panel still visible')
          if cloud_ui.exists():
              for marker in ['Jason Home','Cloudflare','Direct Eufy','Pool','House','Garage','Shed','Apply Scene','Schedules']:
                  if marker not in html:
                      raise SystemExit('Rebuilt cloud UI missing '+marker)
          elif 'Refresh Eufy Cloud Lights' not in html or 'only authorized lights' not in html:
              raise SystemExit('Fixed Eufy cloud device UI missing')
          if 'max="2"' in html and 'eventsSpeed' in html:
              raise SystemExit('Legacy event speed restriction remains')
          if not cloud_ui.exists():
              if 'Complete Craumer Home Backup' not in js or 'Back Up Everything Now' not in js:
                  raise SystemExit('Complete backup UI missing')
              if 'Users & Security' in js:
                  raise SystemExit('Users & Security settings tab still present')
              if '[\"general\",\"General\"]' in js or '<div id="systemMonitorPanel"' in html:
                  raise SystemExit('General settings tab still present')
          else:
              native = bridge + main + Path('JasonHome/app/src/main/java/com/jasonhome/app/CloudflareApiClient.java').read_text() + Path('JasonHome/app/src/main/java/com/jasonhome/app/CloudflareConfigStore.java').read_text()
              for marker in ['CloudflareApiClient','CloudflareConfigStore','usesDirectMode','forwardCloud']:
                  if marker not in native:
                      raise SystemExit('Cloud rebuild native routing missing '+marker)

          holiday_checks={
              '"Pride Month": ("Rainbow Flow",3':'Pride',
              '"Halloween": ("Strobe",3':'Halloween',
              '"Christmas Day": ("Candy Cane",2':'Christmas',
              '"National Human Trafficking Awareness Day": ("Breath",1,[0x245BFF])':'Human trafficking',
              '"988 Day": ("Breath",1,[0x00B4B4,0x5B00E6])':'988 Day',
              '"Kwanzaa": ("Wipe / Fill",2,[0xFF0000,0x000000,0x28FF00])':'Kwanzaa'
          }
          for needle,label in holiday_checks.items():
              if needle not in generator:
                  raise SystemExit('Holiday curation missing '+label)

          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)
          for i,script in enumerate(scripts):
              Path(f'/tmp/craumer-inline-{i}.js').write_text(script)
          print(f'Craumer Home 5.2 Wi-Fi source validation: PASS ({len(scripts)} inline scripts)')
          PY
          if [ -f JasonHome/app/src/main/assets/jason_cloud_home.js ]; then
            node --check JasonHome/app/src/main/assets/jason_cloud_home.js
          else
            node --check JasonHome/app/src/main/assets/v3_mockup.js
          node --check JasonHome/app/src/main/assets/event_categories.js
          fi
          for f in /tmp/craumer-inline-*.js; do node --check "$f"; done

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Craumer event calendar
        shell: bash
        run: |
          python3 JasonHome/tools/generate_anderson_events.py
          test -s JasonHome/app/src/main/java/com/jasonhome/app/AndersonEventData.java
          python3 - <<'PY'
          from pathlib import Path
          generated=Path('JasonHome/app/src/main/java/com/jasonhome/app/AndersonEventData.java').read_text()
          effects=['Solid / Static','Jump','Breath','Strobe','Chase','Gradient Sweep',
                   'Candy Cane','Twinkle / Sparkle','Wipe / Fill','Meteor / Comet',
                   'Rainbow Flow','Pulse Wave']
          if generated.count('new Event(') < 200:
              raise SystemExit('Generated event calendar is unexpectedly short')
          for marker in ['Pride Month','Halloween','Christmas Day','988 Day','Kwanzaa']:
              if marker not in generated:
                  raise SystemExit('Generated calendar missing '+marker)
          # The curated expanded calendar intentionally no longer requires the
          # legacy Jump default. Verify the diverse families we deliberately use.
          for effect in ('Candy Cane','Rainbow Flow','Twinkle / Sparkle','Breath','Wipe / Fill','Strobe','Gradient Sweep'):
              if effect not in generated:
                  raise SystemExit('Generated calendar missing curated effect '+effect)
          print('Craumer event calendar generation: PASS')
          PY

      - name: Check Eufy cloud wire fixtures
        shell: bash
        run: |
          mkdir -p /tmp/jason-home-cloud-tests
          javac -d /tmp/jason-home-cloud-tests JasonHome/app/src/main/java/com/jasonhome/app/CloudWire.java JasonHome/tests/CloudWireTest.java
          java -cp /tmp/jason-home-cloud-tests com.jasonhome.app.CloudWireTest

      - name: Verify expanded-only holiday designs and unchanged Basic profiles
        shell: bash
        run: |
          python3 JasonHome/tests/expanded_holidays.py
          mkdir -p /tmp/jason-home-expanded-tests
          javac -d /tmp/jason-home-expanded-tests \
            JasonHome/app/src/main/java/com/jasonhome/app/AndersonEventData.java \
            JasonHome/app/src/main/java/com/jasonhome/app/LightPresetCatalog.java \
            JasonHome/app/src/main/java/com/jasonhome/app/EufyLightCommands.java \
            JasonHome/tests/ExpandedHolidayRegression.java
          java -cp /tmp/jason-home-expanded-tests com.jasonhome.app.ExpandedHolidayRegression

      - name: Check E120/E22 effect serialization
        shell: bash
        run: |
          mkdir -p /tmp/jason-home-light-tests
          javac -d /tmp/jason-home-light-tests JasonHome/app/src/main/java/com/jasonhome/app/EufyLightCommands.java JasonHome/tests/EufyLightCommandsRegression.java
          java -cp /tmp/jason-home-light-tests com.jasonhome.app.EufyLightCommandsRegression

      - name: Check full Jason Home effect/color option catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("JasonHome/app/src/main/assets/anderson_home.html").read_text()
          js = Path("JasonHome/app/src/main/assets/v3_mockup.js").read_text()
          effects = [
              "Jump","Breath","Strobe","Solid","Chase","Gradient Sweep",
              "Candy Cane","Twinkle / Sparkle","Wipe / Fill","Meteor / Comet",
              "Rainbow Flow","Pulse Wave"
          ]
          cloud_ui = Path("JasonHome/app/src/main/assets/jason_cloud_home.html")
          cloud_js = Path("JasonHome/app/src/main/assets/jason_cloud_home.js")
          if cloud_ui.exists() and cloud_js.exists():
              html = cloud_ui.read_text()
              js = cloud_js.read_text()
              missing = [x for x in effects if x not in js]
              for marker in ["Cloudflare","Direct Eufy","Pool","House","Garage","Shed","Brightness","Effect","Speed","Schedules"]:
                  if marker not in html:
                      missing.append(marker)
          else:
              quick = [
                  "True Orange","Gold","Lime","Emerald","Aqua","Royal Blue",
                  "Indigo","Magenta","Hot Pink","Rose","Warm White RGB","Neutral White RGB"
              ]
              missing = [x for x in effects if x not in html or x not in js]
              missing += [x for x in quick if x not in html]
          if missing:
              raise SystemExit("Missing Jason Home UI options: " + ", ".join(missing))
          print("Jason Home UI catalog regression: PASS")
          classic = Path('JasonHome/app/src/main/assets/anderson_home.html').read_text()
          classic_js = Path('JasonHome/app/src/main/assets/android_eufy_ui.js').read_text()
          for marker in ['data-page="home"','data-page="lights"','data-page="events"','data-page="settings"','housePreview','Jason','Scheduling Rules','Eufy Devices']:
              if marker not in classic:
                  raise SystemExit('Classic Jason Home layout missing '+marker)
          for marker in ['cloudControllerMode','saveCloudController','testCloudController','/api/cloud/config','/api/cloud/test','Oracle — Internet controller','Test Oracle','factoryTab','Factory preset editor','Save & Apply','Advanced Layer Data','/api/eufy/factory-test','/api/eufy/factory-presets','/api/eufy/factory-presets/save','/api/eufy/factory-promotions' ,'installFactorySchedulePromotions','#factoryPresetList{display:grid']:
              if marker not in classic_js:
                  raise SystemExit('Classic Cloudflare integration missing '+marker)
          if 'page.hidden=false;' not in classic_js:
              raise SystemExit('Factory tab must unhide its dynamically-created page before activating it')
          print("Classic Jason Home Oracle layout regression: PASS")
          event_categories = Path('JasonHome/app/src/main/assets/event_categories.js').read_text()
          for marker in ['id:"eufyfactory"','name:"Eufy Factory"','color:"#31D89B"','/api/eufy/factory-promotions/group','setFactoryCategory']:
              if marker not in event_categories:
                  raise SystemExit('Eufy Factory category-row toggle missing '+marker)
          for obsolete in ['factoryPromotionMaster','factoryPromotionMasterCheck']:
              if obsolete in classic_js:
                  raise SystemExit('Standalone Eufy Factory master box returned: '+obsolete)
          print("Factory category-row toggle regression: PASS")
          if 'controllerPane.prepend(eufy)' not in classic_js or 'data-settings-pane="controllers"' not in classic_js:
              raise SystemExit('Cloudflare controller must live under Eufy Devices')
          print("Oracle Eufy Devices placement regression: PASS")
          bridge = Path('JasonHome/app/src/main/java/com/jasonhome/app/AndersonApiBridge.java').read_text()
          main = Path('JasonHome/app/src/main/java/com/jasonhome/app/MainActivity.java').read_text()
          if 'provisionCloudIdentity' not in bridge or '/api/provision-device' not in bridge or 'syncCalendarToOracleAsync' not in bridge or '/api/calendar/sync' not in bridge or '/api/eufy/factory-' not in bridge:
              raise SystemExit('Android Cloudflare identity provisioning missing')
          if 'requestAsync' not in bridge or 'onBridgeResponse' not in main:
              raise SystemExit('Non-blocking Android bridge missing')
          if '__andersonBridgeResolve' not in classic or 'Sending to Oracle' not in classic:
              raise SystemExit('Asynchronous/optimistic Oracle UI missing')
          if 'cloudIdentityProvisioned' not in bridge or 'touchCloudSnapshot' not in bridge:
              raise SystemExit('Oracle round-trip suppression missing')
          if 'Live Color Tuning' in classic or 'liveColorTunerPanel' in classic or 'loadLiveColorPresets' in classic:
              raise SystemExit('Removed Live Test code is still present')
          login_markers=['profileGate','profilePin','switchProfile','anderson-profile-selected','anderson-profile-cleared','/api/login-preview','hashPin','currentRole']
          combined_login_surface=classic+classic_js+bridge
          for obsolete in login_markers:
              if obsolete in combined_login_surface:
                  raise SystemExit('Removed login/profile code returned: '+obsolete)
          for marker in ['1 · Lighting','2 · Schedules','3 · Eufy Devices','4 · Backup & Restore']:
              if marker not in Path('JasonHome/app/src/main/assets/v3_mockup.js').read_text():
                  raise SystemExit('Settings tab renumbering missing '+marker)
          schedule_service = Path('JasonHome/app/src/main/java/com/jasonhome/app/AndersonScheduleService.java').read_text()
          manifest = Path('JasonHome/app/src/main/AndroidManifest.xml').read_text()
          audit_files = {
              'bridge': bridge,
              'main': main,
              'cloud_client': Path('JasonHome/app/src/main/java/com/jasonhome/app/CloudClient.java').read_text(),
              'schedule_service': schedule_service,
              'manifest': manifest,
              'settings_js': Path('JasonHome/app/src/main/assets/v3_mockup.js').read_text(),
              'factory_js': classic_js,
          }
          required_audit_markers = {
              'bridge': ['/api/automation/ownership','direct_scheduler_owned','Malformed JSON request body'],
              'main': ['setAllowUniversalAccessFromFileURLs(false)','shouldOverrideUrlLoading'],
              'cloud_client': ['MQTT PUBACK timeout','waiting for broker acknowledgment'],
              'schedule_service': ['pendingSceneKey','onCloudCommandResult'],
              'settings_js': ['jason-home-settings-tab'],
              'factory_js': ['Scheduled holiday playback uses the normal Schedule 1 brightness'],
              'manifest': ['@xml/backup_rules','@xml/data_extraction_rules'],
          }
          for key,markers in required_audit_markers.items():
              for audit_marker in markers:
                  if audit_marker not in audit_files[key]:
                      raise SystemExit('Audit repair missing '+key+' marker '+audit_marker)
          if Path('JasonHome/app/src/main/assets/scheduled_factory_promotions.js').exists():
              raise SystemExit('Obsolete second Factory promotion system returned')
          print("Audit repair regression: PASS")
          print("Oracle identity + editable Factory Lab + cleaned Settings routing regression: PASS")

          PY

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          node --check JasonHome/app/src/main/assets/android_eufy_ui.js
          node --check JasonHome/app/src/main/assets/v3_mockup.js

      - name: Build unsigned release APK
        shell: bash
        run: |
          gradle -p JasonHome --no-daemon :app:assembleRelease
          cp JasonHome/app/build/outputs/apk/release/app-release-unsigned.apk Jason-Home-5.4.11-Oracle-UNSIGNED.apk
          sha256sum Jason-Home-5.4.11-Oracle-UNSIGNED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jason-Home-5.4.11-Oracle-UNSIGNED-do-not-install
          path: Jason-Home-5.4.11-Oracle-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package Android signing tools
        shell: bash
        run: |
          tar -czf android-build-tools-35.tar.gz -C "$ANDROID_HOME/build-tools" 35.0.0

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35
          path: android-build-tools-35.tar.gz
          if-no-files-found: error
          retention-days: 14
