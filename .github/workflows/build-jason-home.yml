name: Build Jason Home Android

on:
  push:
    branches:
      - jason-home-3.1-build
    paths:
      - 'JasonHome/**'
      - '.github/workflows/build-jason-home.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p JasonHome --no-daemon :app:assembleDebug
          cp JasonHome/app/build/outputs/apk/debug/app-debug.apk Jason-Home-3.1-debug.apk
          sha256sum Jason-Home-3.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jason-Home-3.1-debug
          path: Jason-Home-3.1-debug.apk
          if-no-files-found: error
          retention-days: 14
