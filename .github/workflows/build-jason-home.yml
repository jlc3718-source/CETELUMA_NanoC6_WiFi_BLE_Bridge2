name: Build Jason Home Android

on:
  push:
    branches:
      - jason-home-3.1-build
      - jason-home-anderson-eufy
    paths:
      - 'JasonHome/**'
      - '.github/workflows/build-jason-home.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Anderson event calendar
        shell: bash
        run: |
          python3 JasonHome/tools/generate_anderson_events.py
          test -s JasonHome/app/src/main/java/com/jasonhome/app/AndersonEventData.java

      - name: Check E10 framing and session parser
        shell: bash
        run: |
          mkdir -p /tmp/jason-home-protocol-tests
          javac -d /tmp/jason-home-protocol-tests JasonHome/app/src/main/java/com/jasonhome/app/E10Probe.java JasonHome/tests/E10ProbeRegression.java
          java -cp /tmp/jason-home-protocol-tests com.jasonhome.app.E10ProbeRegression

      - name: Check E120/E22 effect serialization
        shell: bash
        run: |
          mkdir -p /tmp/jason-home-light-tests
          javac -d /tmp/jason-home-light-tests JasonHome/app/src/main/java/com/jasonhome/app/EufyLightCommands.java JasonHome/tests/EufyLightCommandsRegression.java
          java -cp /tmp/jason-home-light-tests com.jasonhome.app.EufyLightCommandsRegression

      - name: Check full Jason Home effect/color option catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("JasonHome/app/src/main/assets/anderson_home.html").read_text()
          js = Path("JasonHome/app/src/main/assets/v3_mockup.js").read_text()
          effects = [
              "Jump","Breath","Strobe","Solid","Chase","Gradient Sweep",
              "Candy Cane","Twinkle / Sparkle","Wipe / Fill","Meteor / Comet",
              "Rainbow Flow","Pulse Wave"
          ]
          quick = [
              "True Orange","Gold","Lime","Emerald","Aqua","Royal Blue",
              "Indigo","Magenta","Hot Pink","Rose","Warm White RGB","Neutral White RGB"
          ]
          missing = [x for x in effects if x not in html or x not in js]
          missing += [x for x in quick if x not in html]
          if missing:
              raise SystemExit("Missing Jason Home UI options: " + ", ".join(missing))
          print("Jason Home UI catalog regression: PASS")
          PY

      - name: Build unsigned release APK
        shell: bash
        run: |
          gradle -p JasonHome --no-daemon :app:assembleRelease
          cp JasonHome/app/build/outputs/apk/release/app-release-unsigned.apk Jason-Home-5.0.9-UNSIGNED.apk
          sha256sum Jason-Home-5.0.9-UNSIGNED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jason-Home-5.0.9-UNSIGNED-do-not-install
          path: Jason-Home-5.0.9-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package Android signing tools
        shell: bash
        run: |
          tar -czf android-build-tools-35.tar.gz -C "$ANDROID_HOME/build-tools" 35.0.0

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35
          path: android-build-tools-35.tar.gz
          if-no-files-found: error
          retention-days: 14
