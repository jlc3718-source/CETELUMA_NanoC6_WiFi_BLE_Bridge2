name: JH2 Nano Readonly Direct Reachability After Offline
on:
  push:
    branches: [feature/jh2-native-local-upload-no-repartition-20261024]
    paths: [.github/workflows/jh2-nano-direct-check-readonly-20261024.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 4
    steps:
      - name: Test existing user-provided Nano DDNS read-only and examine redacted relay logs
        shell: bash
        run: |
          sudo -n python3 - <<'PY'
          import socket,urllib.request,urllib.error,subprocess,re
          host='Craumer.tplinkdns.com'
          try:
              with socket.create_connection((host,80),timeout=4) as s:
                  print('DDNS_HTTP_80_TCP_REACHABLE',True,flush=True)
          except Exception as e:
              print('DDNS_HTTP_80_TCP_REACHABLE',False,'error',type(e).__name__,flush=True)
          for path in ('/','/status'):
              try:
                  req=urllib.request.Request('http://'+host+path,headers={'Accept':'text/html,application/json'},method='GET')
                  with urllib.request.urlopen(req,timeout=5) as res:
                      print('NANO_HTTP_GET',path,'STATUS',res.status,'TYPE',res.headers.get('Content-Type','')[:75],flush=True)
              except urllib.error.HTTPError as e:
                  print('NANO_HTTP_GET',path,'HTTP_CODE',e.code,flush=True)
              except Exception as e:
                  print('NANO_HTTP_GET',path,'ERROR',type(e).__name__,flush=True)
          logs=subprocess.check_output(['docker','logs','--tail','180','jason-home'],stderr=subprocess.STDOUT,text=True,timeout=12).splitlines()
          lines=[l for l in logs if re.search('nano|http|poll|command|wifi|ble|error|timeout|offline|reconnect|warn|connection',l,re.I)
                  and not re.search('token|cookie|authorization|password|api.key|secret|bearer|cert|private',l,re.I)]
          for line in lines[-45:]:
              print('REDACTED_RELAY_LOG',line[:330],flush=True)
          PY
