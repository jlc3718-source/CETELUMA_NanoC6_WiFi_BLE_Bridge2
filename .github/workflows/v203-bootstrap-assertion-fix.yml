name: Fix Anderson v2.0.3 bootstrap assertion
on:
  push:
    branches: ['codex/anderson-v2-0-3-remote-update']
    paths: ['.github/workflows/v203-bootstrap-assertion-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Correct validation string and retrigger bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/v203-remote-update-bootstrap.yml')
          s=p.read_text()
          old="assert 'Check for Remote Update' in w and 'automatic download/install is intentionally disabled' in w"
          new="assert 'Check for Remote Update' in w and 'Automatic download/install is intentionally disabled' in w"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git rm .github/workflows/v203-bootstrap-assertion-fix.yml
          git add .github/workflows/v203-remote-update-bootstrap.yml
          git commit -m 'Fix v2.0.3 remote-update bootstrap validation'
          git push
