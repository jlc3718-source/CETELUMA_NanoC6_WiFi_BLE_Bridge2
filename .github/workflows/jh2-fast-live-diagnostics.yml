name: Jason Home 2 Fast Live Diagnostics
on:
  push:
    branches: [codex/jh2-70k-buffers-studio-simplify-20261016]
    paths:
      - '.github/workflows/jh2-fast-live-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    name: Parallel AI Studio and bridge regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          node --check JasonHome2Server/server.mjs
          node --check JasonHome2Server/curtain_bridge.mjs
          node --test JasonHome2Server/tests/curtain-studio.mjs JasonHome2Server/tests/curtain-relay.mjs
  live-check:
    name: Read-only Oracle and Eufy queue inspection
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 4
    steps:
      - name: Inspect deployed services, queue age, and push transport without enqueuing
        shell: bash
        run: |
          sudo -n python3 - <<'PY'
          import json, subprocess, sqlite3, urllib.request, urllib.error, time, re, os
          from pathlib import Path
          def inspect(name): return json.loads(subprocess.check_output(['docker','inspect',name]))[0]
          def load(name):
              i=inspect(name)
              mounts={m['Destination']:m.get('Source') for m in i.get('Mounts',[])}
              env=dict(v.split('=',1) for v in i['Config']['Env'] if '=' in v)
              return i,mounts,env
          def call(host,path,body=None,headers=None):
              req=urllib.request.Request(host+path,data=json.dumps(body).encode() if body is not None else None,headers={'Content-Type':'application/json',**(headers or {})},method='POST' if body is not None else 'GET')
              try:
                  with urllib.request.urlopen(req,timeout=8) as resp:
                      return resp.status,json.load(resp),dict(resp.headers)
              except urllib.error.HTTPError as e:
                  try: data=json.loads(e.read().decode() or '{}')
                  except: data={}
                  return e.code,data,dict(e.headers)
          backend,bmount,benv=load('jason-home')
          web,wmount,wenv=load('jason-home-2-web')
          print('CONTAINERS',[(i['Name'],i['State']['Status'],i['State'].get('RestartCount',i.get('RestartCount')),i['State'].get('StartedAt')) for i in (backend,web)])
          token=benv['JASON_HOME_API_TOKEN']
          status,health,_=call('http://127.0.0.1:8081','/api/health')
          print('WEB_HEALTH',status,health.get('ok'),health.get('build','unknown'))
          status,session,h=call('http://127.0.0.1:8081','/api/session',{'token':token})
          print('SESSION',status)
          if status==200:
              cookie=h.get('Set-Cookie',h.get('set-cookie','')).split(';')[0]
              status,s,_=call('http://127.0.0.1:8081','/api/curtain/status',headers={'Cookie':cookie})
              if status==200:
                  print('CURTAIN',{'online':s.get('online'),'firmware':s.get('firmware'),'queue':s.get('queued'),'push':s.get('pushConnected'),'pushTransport':s.get('pushTransport'),'subscribers':s.get('pushSubscribers'),'lastSeenSecondsAgo':round((time.time()*1000-s.get('lastSeen',0))/1000,1) if s.get('lastSeen') else 'never','lastSyncSecondsAgo':round((time.time()*1000-s.get('lastSync',0))/1000,1) if s.get('lastSync') else 'never'})
              else: print('CURTAIN_STATUS_HTTP',status)
              code,_,_=call('http://127.0.0.1:8081','/api/curtain/generate-art',{'prompt':'x'},headers={'Cookie':cookie})
              print('AI_ROUTE_VALIDATION',code)
          for name,mounts,env in [('curtain',wmount,wenv),('eufy',bmount,benv)]:
              folder=mounts.get('/data')
              files=[]
              if folder and Path(folder).is_dir():
                  files=[p for p in Path(folder).glob('*.sqlite') if p.is_file()]+[p for p in Path(folder).glob('*.db') if p.is_file()]
              print(name.upper()+'_DATABASES',len(files))
              for p in files[:4]:
                  try:
                      con=sqlite3.connect('file:'+str(p)+'?mode=ro',uri=True,timeout=2)
                      names=[r[0] for r in con.execute("select name from sqlite_master where type='table'").fetchall()]
                      print(name.upper()+'_QUEUE_TABLES',[n for n in names if re.search('command|queue|job|outbox|task',n,re.I)])
                      for table in names:
                          if not re.search('command|queue|job|outbox|task',table,re.I) or not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*',table):continue
                          cols=[x[1] for x in con.execute('pragma table_info("'+table+'")')]
                          count=con.execute('select count(*) from "'+table+'"').fetchone()[0]
                          print('QUEUE_TABLE',name,table,'total',count)
                          if 'state' in cols:
                              print('STATES',table,con.execute('select state,count(*) from "'+table+'" group by state order by 2 desc limit 12').fetchall())
                              if table=='curtain_commands':
                                  entries=con.execute('select id,action,source,state,created from curtain_commands where state in ("queued","downloaded") order by id limit 10').fetchall()
                                  print('CURTAIN_PENDING_COMMANDS',[(n,a,source,state,round((time.time()*1000-created)/1000,1)) for n,a,source,state,created in entries])

                          if 'created' in cols and 'state' in cols:
                              arr=con.execute('select state,min(created),max(created) from "'+table+'" group by state').fetchall()
                              now=int(time.time()*1000)
                              def age(n):
                                  if not n:return None
                                  if n<10**11:n*=1000
                                  return round((now-n)/1000,1)
                              print('AGES_SECONDS',table,[(state,age(low),age(high)) for state,low,high in arr])
                      con.close()
                  except Exception as e: print('SQLITE_READ_ERROR',name,type(e).__name__,str(e)[:180])
          code,bs,_=call('http://127.0.0.1:8080','/api/status',headers={'Authorization':'Bearer '+token})
          print('EUFY_BACKEND_HTTP',code)
          if code==200:
              print('EUFY_STATUS_SUMMARY',{k:v for k,v in bs.items() if re.search(r'queue|pending|lag|online|ready|error|worker|sync',k,re.I) and isinstance(v,(int,float,bool,str))})
              for key,val in bs.items():
                  if isinstance(val,dict) and re.search(r'command|queue|worker|scheduler|relay',key,re.I):
                      print('EUFY_SUBSTATUS',key,{k:v for k,v in val.items() if re.search(r'queue|pending|lag|online|ready|error|worker|sync|count',k,re.I) and isinstance(v,(int,float,bool,str))})
          PY
