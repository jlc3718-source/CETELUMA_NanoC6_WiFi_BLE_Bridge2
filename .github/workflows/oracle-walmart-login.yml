name: Oracle Walmart Login
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oracle-daily-runtime-maintenance
  cancel-in-progress: false
jobs:
  login:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run requested Walmart login
        shell: bash
        run: |
          set -euo pipefail
          python3 oracle-daily/run-agent.py walmart-login
      - name: Publish current result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/oracle-walmart-login-result.json || exit 0
          git config user.name oracle-runner
          git config user.email oracle-runner@users.noreply.github.com
          git add .github/oracle-walmart-login-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish requested Walmart login result"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
