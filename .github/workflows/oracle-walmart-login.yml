name: Oracle Walmart Login
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oracle-daily-runtime-maintenance
  cancel-in-progress: false
jobs:
  login:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run requested Walmart login
        shell: bash
        run: |
          set -euo pipefail
          python3 oracle-daily/run-agent.py walmart-login
      - name: Publish current evidence without rebasing generated files
        if: always()
        run: python3 oracle-daily/publish-results.py .github/oracle-walmart-login-result.json
