name: Repair Settings Renderer v3.1.14

on:
  push:
    branches: ['work/v3.1.14-settings-repair']

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.1.14-settings-repair
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Repair Settings DOM composition
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('firmware/web/v3_mockup.js')
          s=p.read_text()
          pattern=r"  function settingsSubTabs\(\) \{.*?\n  \}\n  function syncRole\(\) \{"
          replacement="""  function settingsSubTabs() {
    const page=q('.page[data-page=\"settings\"]');
    if(!page || byId('v3SettingsTabs'))return;
    const title=q(':scope > .v3PageTitle',page);
    const legacyTabs=byId('settingsGeneralTab')?.parentElement;
    const generalHost=byId('settingsGeneralPane');
    const customHost=byId('settingsCustomizedPane');
    const direct=[...page.children].filter(node=>node!==title&&node!==legacyTabs&&node!==generalHost&&node!==customHost);
    const controllerNodes=generalHost?[...generalHost.children]:[];
    const defs=[['general','General'],['wifi','Wi-Fi'],['lighting','Lighting'],['schedules','Schedules'],['controllers','Controllers'],['security','Users & Security'],['firmware','Firmware'],['customized','Customized Settings']];
    const tabs=el('div','v3SettingsTabs');tabs.id='v3SettingsTabs';tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','Settings sections');
    const panes=new Map(),buttons=new Map();
    defs.forEach(([id,label])=>{
      const button=el('button','v3SettingsTab',label);button.type='button';button.dataset.settingsTab=id;button.setAttribute('role','tab');button.setAttribute('aria-controls','v3SettingsPane-'+id);tabs.appendChild(button);buttons.set(id,button);
      const pane=el('div','v3SettingsPane');pane.id='v3SettingsPane-'+id;pane.dataset.settingsPane=id;pane.setAttribute('role','tabpanel');panes.set(id,pane);
    });
    if(title)title.insertAdjacentElement('afterend',tabs);else page.prepend(tabs);
    defs.forEach(([id])=>page.appendChild(panes.get(id)));
    const category=node=>{
      if(node.classList.contains('v3SettingsLink'))return 'wifi';
      if(node.id==='systemMonitorPanel')return 'general';
      if(node.id==='liveColorTunerPanel')return 'lighting';
      const heading=q(':scope > strong',node)?.textContent.trim()||'';
      if(heading==='Overlap Behavior')return 'lighting';
      if(heading==='Scheduling Rules'||heading==='Priority')return 'schedules';
      if(heading==='Bluetooth Light Controllers')return 'controllers';
      if(heading==='Profile PINs')return 'security';
      if(heading==='Firmware Update'||heading==='Firmware Revision')return 'firmware';
      return 'general';
    };
    direct.forEach(node=>panes.get(category(node)).appendChild(node));
    controllerNodes.forEach(node=>panes.get(category(node)).appendChild(node));
    if(legacyTabs){legacyTabs.hidden=true;panes.get('general').appendChild(legacyTabs);}
    if(generalHost){generalHost.replaceChildren();generalHost.hidden=true;panes.get('general').appendChild(generalHost);}
    if(customHost){customHost.hidden=false;panes.get('customized').appendChild(customHost);}
    const activate=requested=>{
      const id=panes.has(requested)?requested:'general';
      defs.forEach(([key])=>{
        const active=key===id,button=buttons.get(key),pane=panes.get(key);
        button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active));button.tabIndex=active?0:-1;
        pane.classList.toggle('active',active);pane.hidden=!active;
      });
      if(customHost)customHost.hidden=id!=='customized';
      if(id==='customized'&&typeof window.loadCustomizedBackupStatus==='function')window.loadCustomizedBackupStatus();
    };
    window.andersonActivateSettingsTab=activate;
    buttons.forEach((button,id)=>button.addEventListener('click',()=>activate(id)));
    tabs.addEventListener('keydown',event=>{
      if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
      event.preventDefault();const ids=defs.map(([id])=>id),current=ids.findIndex(id=>buttons.get(id)===document.activeElement);let next=current<0?0:current;
      if(event.key==='ArrowRight')next=(next+1)%ids.length;else if(event.key==='ArrowLeft')next=(next-1+ids.length)%ids.length;else if(event.key==='Home')next=0;else next=ids.length-1;
      activate(ids[next]);buttons.get(ids[next]).focus();
    });
    const primarySettings=q('.tab[data-tab=\"settings\"]');if(primarySettings)primarySettings.addEventListener('click',()=>activate('general'));
    activate('general');
  }
  function syncRole() {"""
          s2,n=re.subn(pattern,lambda m:replacement,s,count=1,flags=re.S)
          assert n==1, 'settingsSubTabs function was not replaced exactly once'
          p.write_text(s2)

          # Bump both release and compiled runtime markers together.
          import subprocess
          subprocess.run(['python','tools/release.py','bump'],check=True)
          assert Path('FIRMWARE_VERSION.txt').read_text().strip()=='3.1.14'

          # Add structural regression guards so the Settings categories cannot silently go blank again.
          t=Path('tools/test_regressions.py')
          tests=t.read_text()
          marker="assert 'id=\"settingsCustomizedTab\"' in web and 'id=\"customBackupNow\"' in web and 'id=\"customRestoreNow\"' in web\n"
          extra="""assert \"['customized','Customized Settings']\" in mock\nassert \"const controllerNodes=generalHost?[...generalHost.children]:[]\" in mock\nassert \"controllerNodes.forEach(node=>panes.get(category(node)).appendChild(node))\" in mock\nassert \"window.andersonActivateSettingsTab=activate\" in mock\nassert \"primarySettings.addEventListener('click',()=>activate('general'))\" in mock\n"""
          assert marker in tests
          tests=tests.replace(marker,marker+extra,1)
          t.write_text(tests)
          PY
          python tools/test_maintenance.py
          python tools/test_regressions.py
          python tools/test_audit_fixes.py
          python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full
          python tools/release.py check
      - name: Commit repair and remove helper
        run: |
          rm -f .github/workflows/zz-settings-repair-v3.1.14.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Repair Settings tab composition in v3.1.14"
          git push origin HEAD:refs/heads/work/v3.1.14-settings-repair
