name: Repair Settings Renderer v3.1.14

on:
  push:
    branches: ['work/v3.1.14-settings-repair']

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.1.14-settings-repair
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Repair Settings DOM composition
        run: |
          echo '' | base64 -d > /tmp/repair.py
          python /tmp/repair.py
          python tools/test_maintenance.py
          python tools/test_regressions.py
          python tools/test_audit_fixes.py
          python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full
          python tools/release.py check
      - name: Commit repair and remove helper
        run: |
          rm -f .github/workflows/zz-settings-repair-v3.1.14.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Repair Settings tab composition in v3.1.14"
          git push origin HEAD:refs/heads/work/v3.1.14-settings-repair
