    try:
        meta=json.loads(mp.read_text()); packed=gp.read_bytes(); cached=rp.read_bytes()
        if meta.get('compression')==COMPRESSION_ID and meta.get('rendered_sha256')==digest and cached==rendered and meta.get('gzip_sha256')==sha(packed) and gzip.decompress(packed)==rendered:
            print(f'{name}: verified same-run gzip cache hit ({len(packed)} bytes)'); return packed
    except (OSError,ValueError,KeyError,json.JSONDecodeError): pass
