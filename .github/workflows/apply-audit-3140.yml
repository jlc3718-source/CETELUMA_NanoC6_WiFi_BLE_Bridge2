name: Apply Anderson 3.1.40 Audit Bundle

on:
  push:
    branches: ['audit/3.1.40-final-try']
    paths: ['.github/trigger-audit-3140.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/3.1.40-final-try
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate source audit bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = "3.1.39"
          sed -i 's/out,n=re.subn(pat,repl,s,count=1,flags=re.S)/out,n=re.subn(pat,lambda m: repl,s,count=1,flags=re.S)/' .github/scripts/apply-audit-3140.py
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/scripts/apply-audit-3140.py')
          s=p.read_text()
          s,n=re.subn(r"wf=text\('\.github/workflows/compile-anderson-home-multi\.yml'\).*?write\('\.github/workflows/compile-anderson-home-multi\.yml',wf\.replace\(c,d,1\)\)\n",'',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('workflow-edit block not found')
          p.write_text(s)
          PY
          python .github/scripts/apply-audit-3140.py
          if [ -d prebuilt ]; then git rm -rf prebuilt; fi
          python -m py_compile tools/release.py
          node --check firmware/web/v3_mockup.js
          python - <<'PY'
          import re,subprocess
          from pathlib import Path
          for script in re.findall(r'<script\b[^>]*>(.*?)</script>',Path('firmware/web/index.html').read_text(),re.S|re.I):
              subprocess.run(['node','--check'],input=script,text=True,check=True)
          PY
          printf '%s\n' '3.1.40 audit optimization bundle' > .github/trigger-build.txt
          git restore .github/scripts/apply-audit-3140.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FIRMWARE_VERSION.txt README.md tools/release.py .github/scripts/anderson-cache-cleanup.sh firmware/platformio.ini firmware/web/index.html firmware/web/v3_mockup.js firmware/src/Scheduler.cpp firmware/include/BleController.h firmware/src/BleController.cpp firmware/src/main.cpp .github/trigger-build.txt
          git add -u prebuilt 2>/dev/null || true
          git diff --cached --check
          git commit -m 'Anderson Home v3.1.40: implement efficiency audit bundle'
          git push origin HEAD:audit/3.1.40-final-try
