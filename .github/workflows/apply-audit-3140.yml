name: Apply Anderson 3.1.40 Audit Bundle

on:
  push:
    branches: ['audit/3.1.40-final-try']
    paths: ['.github/trigger-audit-3140.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/3.1.40-final-try
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate complete audit bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = "3.1.39"
          python .github/scripts/apply-audit-3140.py
          git rm -f .github/workflows/publish-anderson-prebuilt.yml 2>/dev/null || true
          git rm -f .github/workflows/publish-anderson-prebuilt-chunks.yml 2>/dev/null || true
          if [ -d prebuilt ]; then git rm -rf prebuilt; fi
          python -m py_compile tools/release.py
          node --check firmware/web/v3_mockup.js
          python - <<'PY'
          import re,subprocess
          from pathlib import Path
          for script in re.findall(r'<script\b[^>]*>(.*?)</script>',Path('firmware/web/index.html').read_text(),re.S|re.I):
              subprocess.run(['node','--check'],input=script,text=True,check=True)
          PY
          printf '%s\n' '3.1.40 audit optimization bundle' > .github/trigger-build.txt
          git rm .github/workflows/apply-audit-3140.yml .github/trigger-audit-3140.txt .github/scripts/apply-audit-3140.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Anderson Home v3.1.40: implement efficiency audit bundle'
          git push origin HEAD:audit/3.1.40-final-try
