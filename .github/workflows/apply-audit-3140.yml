name: Apply Anderson 3.1.40 Audit Bundle

on:
  push:
    branches: ['audit/3.1.40-final-try']
    paths: ['.github/trigger-audit-3140.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/3.1.40-final-try
          fetch-depth: 0
      - name: Apply complete audit bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = "3.1.39"
          python - <<'PY'
          from pathlib import Path
          import re
          def rep(path,old,new,count=1):
              p=Path(path);s=p.read_text()
              if s.count(old)!=count: raise SystemExit(f'{path}: anchor mismatch ({s.count(old)} != {count})')
              p.write_text(s.replace(old,new,count))
          def sub1(path,pattern,repl):
              p=Path(path);s=p.read_text();out,n=re.subn(pattern,repl,s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{path}: regex anchor mismatch')
              p.write_text(out)

          # Version.
          Path('FIRMWARE_VERSION.txt').write_text('3.1.40\n')
          rep('firmware/src/main.cpp','static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.39";','static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.40";')
          r=Path('README.md')
          if r.exists(): r.write_text(r.read_text().replace('**v3.1.39**','**v3.1.40**'))

          # Same-run verified web-compression reuse.
          rep('tools/release.py','ZOPFLI_ITERATIONS = 1000\n','ZOPFLI_ITERATIONS = 1000\nWEB_CACHE_DIR = ROOT / ".anderson-web-cache"\nCOMPRESSION_ID = f"zopfli-0.2.3.post1-gzip-{ZOPFLI_ITERATIONS}-unlimited-blocks"\n')
          anchor='''@lru_cache(maxsize=4)
def compress_page(rendered):
    """High-effort standard gzip; decompression stays in the existing browser."""
    packed = zopfli.gzip.compress(rendered, numiterations=ZOPFLI_ITERATIONS, blocksplittingmax=0)
    if gzip.decompress(packed) != rendered:
        raise ValueError('Compressed web page failed its lossless round-trip check')
    return packed
'''
