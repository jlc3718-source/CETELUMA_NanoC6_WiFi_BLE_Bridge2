name: Build Anderson Home 3.1.17 Event Palettes

on:
  push:
    branches: ['codex/3.1.17-event-palettes']

permissions:
  contents: write
  actions: write

concurrency:
  group: anderson-3-1-17-event-palettes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/3.1.17-event-palettes
          fetch-depth: 0
      - name: Fetch historical palette tags
        run: git fetch origin --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - name: Install build dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Apply v3.1.17 source changes
        run: python tools/apply_3_1_17_event_palettes.py
      - name: Commit exact release source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f tools/apply_3_1_17_event_palettes.py .github/workflows/build-3.1.17-event-palettes.yml
          git add -A
          git commit -m 'Anderson Home v3.1.17 selectable historical event palettes'
          git push origin HEAD:refs/heads/codex/3.1.17-event-palettes
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check maintenance and recovery
        run: python tools/test_maintenance.py
      - name: Check source regressions
        run: python tools/test_regressions.py
      - name: Check audited invariants
        run: python tools/test_audit_fixes.py
      - name: Check scheduled event coverage
        run: python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full
      - name: Check web JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('firmware/web/index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)
          Path('/tmp/anderson-web.js').write_text('\n'.join(scripts))
          assert 'Save Over Selected Preset' in html
          assert 'eventColors3028' in html and 'eventColors3029' in html
          assert 'liveColorHex' in html and 'liveColorR' in html and 'liveColorG' in html and 'liveColorB' in html
          PY
          node --check /tmp/anderson-web.js
      - name: Verify exact historical palette restoration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          ev=Path('firmware/src/EventCatalog.cpp').read_text()
          old28=Path('firmware/src/EventColorThemes.cpp').read_text()
          main=Path('firmware/src/main.cpp').read_text()
          assert len(re.findall(r'^\{"evt\d{3}"',ev,re.M))==210
          assert 'ORIGINAL_EVENT_COLOR_INDEX[210][6]' in old28
          assert 'ORIGINAL_EVENT_COLOR_COUNT[210]' in old28
          assert '0xE08700' in ev and '0xFFFF44' not in ev and '0xE0B400' not in ev
          for c in ['0x00B4B4','0x0096FF','0xFFA000','0xB464FF','0x001478','0x87002D','0xA0A5AF']:
              assert c in ev,c
          assert 'eventColorPresetCount(activeEventColorTheme)' in main
          assert 'saveEventColorPreset' in main
          assert 'schedule2Brightness\"]=10' in main
          PY
      - name: Prepare release
        run: python tools/release.py prepare
      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package verified firmware
        run: python tools/release.py package
      - name: Verify packaged identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os
          r=json.loads(Path('release/release.json').read_text())
          assert r['version']=='3.1.17'
          assert r['commit']==os.environ['RELEASE_SHA']
          f=Path('release/and_3.1.17.bin');data=f.read_bytes();sha=hashlib.sha256(data).hexdigest()
          assert data[0]==0xE9 and len(data)<0x1E0000
          assert r['files'][f.name]['bytes']==len(data)
          assert r['files'][f.name]['sha256']==sha
          print('bytes',len(data),'sha256',sha,'commit',r['commit'])
          PY
      - name: Upload isolated verified firmware
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.17-Event-Palettes
          path: release/*
          if-no-files-found: error
