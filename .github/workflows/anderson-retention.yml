name: Anderson Retention

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  release:
    types: [published]
  # Run once when this policy is first merged or later revised on main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/anderson-retention.yml'
      - '.github/scripts/anderson-retention.sh'

concurrency:
  group: anderson-retention
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep current plus one backup
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_RELEASES: '1'
        run: bash .github/scripts/anderson-retention.sh
