name: Jason Home 2 isolated free image runtime benchmark setup
on:
  push:
    branches: [codex/jh2-image-model-benchmark-20261019]
    paths: ['.github/workflows/jh2-image-model-setup-20261019.yml']
permissions: {contents: read}
concurrency: {group: jason-home-oracle-production, cancel-in-progress: false}
jobs:
  setup:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 40
    steps:
      - name: Download verified free weights and build isolated CPU runtime; no production cutover
        shell: bash
        run: |
          python3 - <<'PYTHON'
          """Fixed, isolated Oracle image benchmark setup. No application/device access."""
          import hashlib,json,os,pathlib,shutil,subprocess,time,urllib.request
          
          ROOT=pathlib.Path('/opt/jh2-image-benchmark-20261019')
          PIN='ac54e0076052a196b7df961eb1f792c9ff4d7f22'
          MODEL_REPO='darkmaniac7/TokForge-DreamShaper-LCM-GGUF-q4'
          MODEL_NAME='dreamshaper-7-lcm-q4_0.gguf'
          assert shutil.disk_usage('/opt').free > 8*1024**3, 'Insufficient isolated benchmark disk budget'
          assert not ROOT.is_symlink()
          subprocess.run(['sudo','-n','install','-d','-m','0755','-o',str(os.getuid()),'-g',str(os.getgid()),str(ROOT)],check=True)
          for name in ['models','output','bin']:(ROOT/name).mkdir(exist_ok=True)
          
          def download(url,path,expected=None):
              if path.exists() and expected and hashlib.file_digest(path.open('rb'),'sha256').hexdigest()==expected:return 0
              partial=path.with_suffix(path.suffix+'.partial');start=time.monotonic()
              with urllib.request.urlopen(url,timeout=60) as response,partial.open('wb') as target:
                  while True:
                      chunk=response.read(1024*1024)
                      if not chunk:break
                      target.write(chunk)
              if expected:
                  actual=hashlib.file_digest(partial.open('rb'),'sha256').hexdigest()
                  assert actual==expected,'Public model checksum mismatch'
              partial.replace(path)
              return round(time.monotonic()-start,3)
          
          with urllib.request.urlopen('https://huggingface.co/api/models/'+MODEL_REPO+'?blobs=true',timeout=30) as response:meta=json.load(response)
          revision=meta['sha'];file=next(x for x in meta['siblings'] if x['rfilename']==MODEL_NAME)
          expected=file['lfs']['sha256'];size=file['lfs']['size']
          assert size==1625041920,'Unexpected candidate model revision/size'
          modelinfo={'repository':MODEL_REPO,'revision':revision,'file':MODEL_NAME,'sha256':expected,'bytes':size,'license':meta.get('cardData',{}).get('license'),'runtimeSource':'https://github.com/leejet/stable-diffusion.cpp','runtimeRevision':PIN,'baseModel':'Lykon/dreamshaper-7','adapter':'latent-consistency/lcm-lora-sdv1-5','productionIntegration':False}
          (ROOT/'model_manifest.json').write_text(json.dumps(modelinfo,indent=2))
          download('https://huggingface.co/'+MODEL_REPO+'/resolve/'+revision+'/README.md',ROOT/'MODEL_README.md')
          download('https://huggingface.co/spaces/CompVis/stable-diffusion-license/resolve/main/LICENSE',ROOT/'MODEL_BASE_LICENSE.txt')
          modelinfo['downloadSeconds']=download('https://huggingface.co/'+MODEL_REPO+'/resolve/'+revision+'/'+MODEL_NAME,ROOT/'models'/MODEL_NAME,expected)
          (ROOT/'model_manifest.json').write_text(json.dumps(modelinfo,indent=2))
          print('MODEL_DOWNLOADED '+json.dumps(modelinfo),flush=True)
          
          build=r'''set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake build-essential pkg-config libgomp1
          if ! test -d /work/source/.git; then git clone --no-checkout --filter=blob:none https://github.com/leejet/stable-diffusion.cpp /work/source; fi
          git -C /work/source fetch --depth 1 origin ac54e0076052a196b7df961eb1f792c9ff4d7f22
          git -C /work/source checkout --detach ac54e0076052a196b7df961eb1f792c9ff4d7f22
          git -C /work/source submodule update --init --depth 1 ggml
          cmake -S /work/source -B /work/source/build -DCMAKE_BUILD_TYPE=Release -DSD_FLASH_ATTN=ON -DSD_BUILD_SHARED_LIBS=OFF
          cmake --build /work/source/build --target sd -j1
          cp /work/source/build/bin/sd /work/bin/sd
          /work/bin/sd --help
          '''
          name='jh2-image-benchmark-build-20261019'
          check=subprocess.run(['sudo','-n','docker','inspect',name],capture_output=True)
          assert check.returncode!=0,'A benchmark build container already exists; do not overwrite it'
          start=time.monotonic()
          args=['sudo','-n','docker','run','--name',name,'--cpus=0.55','--cpu-shares=128','--memory=1536m','--memory-swap=1536m','--pids-limit=256','--security-opt','no-new-privileges','--mount','type=bind,source='+str(ROOT)+',target=/work','ubuntu:24.04','bash','-lc',build]
          with (ROOT/'runtime_build.log').open('w') as log:
              try:rc=subprocess.run(args,stdout=log,stderr=subprocess.STDOUT,timeout=2100).returncode
              except subprocess.TimeoutExpired:
                  subprocess.run(['sudo','-n','docker','stop','--time','10',name],capture_output=True,timeout=30)
                  rc=124
          state=json.loads(subprocess.check_output(['sudo','-n','docker','inspect',name,'--format','{{json .State}}']))
          result={'returnCode':rc,'wallSeconds':round(time.monotonic()-start,3),'oomKilled':state['OOMKilled'],'runtimeRevision':PIN,'limits':{'cpu':0.55,'memoryBytes':1610612736,'swapBytes':0},'model':modelinfo}
          if rc==0:
              image='jh2-image-benchmark-runtime:20261019'
              subprocess.run(['sudo','-n','docker','commit',name,image],check=True,stdout=subprocess.DEVNULL)
              subprocess.run(['sudo','-n','docker','rm',name],check=True,stdout=subprocess.DEVNULL)
              result['image']=image
              result['binarySha256']=hashlib.file_digest((ROOT/'bin/sd').open('rb'),'sha256').hexdigest()
          else:
              lines=(ROOT/'runtime_build.log').read_text(errors='replace').splitlines()
              print('\n'.join(lines[-45:]),flush=True)
          (ROOT/'runtime_setup_result.json').write_text(json.dumps(result,indent=2))
          print('RUNTIME_SETUP '+json.dumps(result),flush=True)
          assert rc==0,'Isolated runtime build failed; production unchanged'
          PYTHON
