name: JH2 Live Oracle Bridge API Compatibility Inspect
on:
  push:
    branches: [codex/jh2-native-1-1-46-targeted-928-parity-20261018]
    paths: ['.github/workflows/jh2-live-bridge-compat-inspect-20261018.yml']
permissions: {contents: read}
jobs:
  read:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 3
    steps:
      - name: Inspect only installed JavaScript method signatures
        shell: bash
        run: |
          set -euo pipefail
          sudo -n docker exec jason-home-2-web node -e '
          const fs=require("fs");
          for(const filename of ["/app/curtain_bridge.mjs","/app/server.mjs"]){
            const lines=fs.readFileSync(filename,"utf8").split("\n");
            console.log("SOURCE",filename,"lines",lines.length);
            const hits=[];
            for(let i=0;i<lines.length;i++)if(/setEufyMasterEnabled|getEufyMasterEnabled|JH2_EUFY_MASTER|nativePlay|selectController/.test(lines[i]))hits.push(i);
            for(const i of hits.slice(0,12)){console.log("AT",i+1);for(let n=Math.max(0,i-3);n<=Math.min(lines.length-1,i+4);n++)console.log(n+1,lines[n].slice(0,270));}
          }'
