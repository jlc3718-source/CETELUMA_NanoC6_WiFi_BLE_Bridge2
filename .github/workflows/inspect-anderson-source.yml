name: Inspect Anderson Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-anderson-source.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract firmware source
        run: |
          rm -rf inspect_source source_snapshot
          mkdir inspect_source
          unzip -q Anderson_Home_Complete_Project.zip -d inspect_source
          FW=$(find inspect_source -type f -name platformio.ini -printf '%h\n' | head -1)
          test -n "$FW"
          echo "Firmware root: $FW"
          cp -a "$FW" source_snapshot
          find source_snapshot -maxdepth 3 -type f | sort
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Complete-Firmware-Source
          path: source_snapshot/
          if-no-files-found: error
