name: Inspect Anderson Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-anderson-source.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and locate source
        run: |
          rm -rf inspect_source source_snapshot
          mkdir inspect_source source_snapshot
          unzip -q Anderson_Home_Complete_Project.zip -d inspect_source
          echo '--- files ---'
          find inspect_source -maxdepth 6 -type f | sort
          find inspect_source -type f \( -name 'BleController.h' -o -name 'BleController.cpp' -o -name 'main.cpp' -o -name 'SettingsStore.h' -o -name 'SettingsStore.cpp' -o -name 'platformio.ini' \) -exec cp {} source_snapshot/ \;
          echo '--- snapshot ---'
          ls -la source_snapshot
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Source-Snapshot
          path: source_snapshot/
          if-no-files-found: error
