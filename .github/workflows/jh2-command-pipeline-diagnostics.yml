name: Jason Home 2 Existing Pipeline Check
on:
  push:
    branches: [codex/jh2-command-pipeline-20261016]
    paths: ['.github/workflows/jh2-command-pipeline-diagnostics.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Wait for signed Nano update and measure real command acknowledgments
        shell: bash
        env:
          PROBE_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sudo --preserve-env=PROBE_RUN python3 - <<'PY'
          import subprocess,json,urllib.request,time,os
          backend=json.loads(subprocess.check_output(['docker','inspect','jason-home']))[0]
          token=dict(v.split('=',1) for v in backend['Config']['Env'] if '=' in v)['JASON_HOME_API_TOKEN']
          def api(path,body=None,cookie=None):
            headers={'Content-Type':'application/json'}
            if cookie:headers['Cookie']=cookie
            req=urllib.request.Request('http://127.0.0.1:8081'+path,None if body is None else json.dumps(body).encode(),headers)
            with urllib.request.urlopen(req,timeout=10) as r:return json.loads(r.read()),r.headers
          _,head=api('/api/session',{'token':token});cookie=head['Set-Cookie'].split(';')[0]
          import sqlite3,pathlib
          web=json.loads(subprocess.check_output(['docker','inspect','jason-home-2-web']))[0]
          mount=next(m['Source'] for m in web['Mounts'] if m['Destination']=='/data')
          with sqlite3.connect('file:'+str(pathlib.Path(mount)/'jason-home-2.sqlite')+'?mode=ro',uri=True) as db:
            values={k:json.loads(v) for k,v in db.execute("SELECT key,value FROM curtain_meta WHERE key IN ('bootstrapExpires','lastSeen','lastSync','connectionDiagnostic','lastAutomaticSetupRequest')")}
          print('CONNECTION_DIAGNOSTIC',json.dumps(values),flush=True)
          import re,http.client,ssl,socket,hashlib,tempfile
          try:
            with socket.create_connection(('150.136.245.51',443),timeout=4) as tcp:
              with ssl.create_default_context().wrap_socket(tcp,server_hostname='150.136.245.51') as tls:
                cert=tls.getpeercert()
                print('ORACLE_TLS',json.dumps({'verified':True,'version':tls.version(),'issuer':cert.get('issuer'),'subjectAltName':cert.get('subjectAltName'),'notAfter':cert.get('notAfter')}),flush=True)
          except Exception as e:print('ORACLE_TLS',json.dumps({'verified':False,'error':str(e)}),flush=True)
          roots=pathlib.Path('JasonHome2NanoC6/include/Roots.h').read_text().split('R"PEM(',1)[1].split(')PEM"',1)[0]
          try:
            ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT);ctx.load_verify_locations(cadata=roots)
            ctx.minimum_version=ssl.TLSVersion.TLSv1_2;ctx.maximum_version=ssl.TLSVersion.TLSv1_2
            with socket.create_connection(('150.136.245.51',443),timeout=4) as tcp:
              with ctx.wrap_socket(tcp,server_hostname='150.136.245.51') as tls:
                print('EXACT_FIRMWARE_TLS',json.dumps({'verified':True,'version':tls.version()}),flush=True)
          except Exception as e:print('EXACT_FIRMWARE_TLS',json.dumps({'verified':False,'error':str(e)}),flush=True)
          upgrades=[]
          for log in pathlib.Path('/var/log/nginx').glob('*.log'):
            tail=subprocess.check_output(['tail','-n','1500',str(log)],text=True,errors='replace')
            for at,status in re.findall(r'\[([^\]]+)\].*"GET /jason-home-2/api/curtain-bridge/channel[^"\n]*" (\d{3}) ',tail):
              upgrades.append({'at':at,'status':int(status)})
          print('ORACLE_WS_UPGRADES',json.dumps(upgrades[-15:]),flush=True)
          home_ip=socket.gethostbyname('craumer.tplinkdns.com')
          print('HOME_DDNS_TARGET',home_ip,flush=True)
          tls_errors=[]
          for log in pathlib.Path('/var/log/nginx').glob('*error*.log'):
            tail=subprocess.check_output(['tail','-n','4000',str(log)],text=True,errors='replace')
            for line in tail.splitlines():
              client=re.search(r'client: ([^, ]+)',line)
              if client and client.group(1)==home_ip and ('SSL' in line or 'handshak' in line):
                tls_errors.append(line.split(', client:',1)[0][-1200:])
          print('HOME_TLS_ERRORS',json.dumps(tls_errors[-12:]),flush=True)
          for path in ['/api/firmware/access','/api/bridge/status','/']:
            c=http.client.HTTPConnection('craumer.tplinkdns.com',80,timeout=3);started=time.monotonic();connected=False
            try:
              c.connect();connected=True;c.request('GET',path,headers={'Accept':'application/json','Connection':'close'})
              r=c.getresponse();data=r.read(16384) if path!='/ ' and path!='/' else b''
              report={'path':path,'tcpConnected':True,'status':r.status,'milliseconds':round((time.monotonic()-started)*1000)}
              if path=='/api/bridge/status':report['bridge']=json.loads(data)
              print('NANO_HTTP_PROBE',json.dumps(report),flush=True)
            except Exception as e:print('NANO_HTTP_PROBE',json.dumps({'path':path,'tcpConnected':connected,'error':str(e),'milliseconds':round((time.monotonic()-started)*1000)}),flush=True)
            finally:c.close()

          for sample in range(3):
            try:
              with urllib.request.urlopen('http://craumer.tplinkdns.com/api/health',timeout=4) as r:physical=json.loads(r.read())
              print('PHYSICAL_NANO',json.dumps({'sample':sample,'firmware':physical.get('version'),'wifi':physical.get('wifi'),'timeValid':physical.get('timeValid'),'uptimeSeconds':physical.get('uptimeSeconds'),'freeHeap':physical.get('freeHeap'),'largestHeapBlock':physical.get('largestHeapBlock'),'oracle':physical.get('oracle'),'curtain':physical.get('curtain')}),flush=True)
            except Exception as e:print('PHYSICAL_NANO_ERROR',type(e).__name__,str(e),flush=True)
          ready=False
          for attempt in range(1):
            d,_=api('/api/curtain/status',cookie=cookie)
            print('CHANNEL_WATCH',json.dumps({'attempt':attempt,'online':d.get('online'),'channelConnected':d.get('channelConnected'),'firmware':d.get('firmware'),'transport':d.get('commandTransport'),'queued':d.get('queued'),'syncAgeSeconds':round((time.time()*1000-(d.get('lastSync') or 0))/1000,1)}),flush=True)
            if d.get('firmware') in ['1.1.13','1.1.14','1.1.15','1.1.16'] and d.get('online') and d.get('channelConnected') and d.get('commandTransport')=='wss-duplex':ready=True;break
          if not ready:
            print('PIPELINE_NOT_CONNECTED: recorded actual state; physical command delivery is not verified',flush=True)
            raise SystemExit(0)
          timings=[]
          for i in range(5):
            started=time.monotonic()
            command,_=api('/api/curtain/call',{'action':'nanoInfo','payload':{},'idempotencyKey':'pipeline-probe-'+os.environ['PROBE_RUN']+'-'+str(i)},cookie)
            cid=command['commandId']
            for attempt in range(200):
              d,_=api('/api/curtain/command?id='+str(cid),cookie=cookie);c=d['command']
              if c['state'] in ['applied','failed','expired','superseded']:break
              time.sleep(.05)
            elapsed=round((time.monotonic()-started)*1000)
            result=c.get('result') or {}
            print('REAL_COMMAND_ACK',json.dumps({'id':cid,'state':c['state'],'milliseconds':elapsed,'firmware':result.get('firmware'),'bleConnected':(result.get('curtain') or {}).get('connected'),'error':result.get('error')}),flush=True)
            assert c['state']=='applied' and result.get('firmware') in ['1.1.13','1.1.14','1.1.15','1.1.16'],'Physical Nano failed diagnostic command'
            timings.append(elapsed)
          print('PIPELINE_VERIFIED',json.dumps({'firmware':result.get('firmware'),'transport':'wss-duplex','commands':5,'minMs':min(timings),'maxMs':max(timings),'averageMs':round(sum(timings)/len(timings)),'physicalLightOutputObserved':False}),flush=True)
          PY
