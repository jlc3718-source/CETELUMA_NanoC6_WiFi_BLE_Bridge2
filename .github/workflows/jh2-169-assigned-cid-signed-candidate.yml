name: JH2 1.1.69 SmartDawn Assigned CID Signed Candidate
on:
  push:
    branches: [release/jh2-nano-169-assigned-cid-20261024]
    paths: ['JasonHome2NanoC6_IDF/**', '.github/workflows/jh2-169-assigned-cid-signed-candidate.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: jh2-169-assigned-cid-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify production 1.1.68 signed recovery and 1.1.67 fallback
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          for ver in 1.1.67 1.1.68; do
            mkdir -p "backup-${ver}"
            gh release download "jason-home-2-nanoc6-v${ver}" --repo "$GITHUB_REPOSITORY" \
              --pattern "jh2-runtime-${ver}.bin" --pattern latest.json --pattern release.json \
              --dir "backup-${ver}"
            python3 - "$ver" <<'PY'
          import base64,hashlib,json,subprocess,sys,tempfile
          from pathlib import Path
          ver=sys.argv[1];d=Path('backup-'+ver)
          latest=json.loads((d/'latest.json').read_text())
          release=json.loads((d/'release.json').read_text())
          fields=dict(s.split('=',1) for s in latest['payload'].strip().splitlines())
          raw=(d/('jh2-runtime-'+ver+'.bin')).read_bytes()
          assert fields['product']=='jason-home-2-nanoc6'
          assert fields['version']==release['version']==ver
          assert hashlib.sha256(raw).hexdigest()==fields['sha256']
          assert len(raw)==int(fields['bytes']) and len(raw)<=0x290000
          assert raw[0]==0xe9 and raw[12]==13 and raw[13]==0
          with tempfile.TemporaryDirectory() as td:
           dtmp=Path(td)
           (dtmp/'payload').write_text(latest['payload'])
           (dtmp/'signature').write_bytes(base64.b64decode(latest['signature'],validate=True))
           subprocess.run(['openssl','dgst','-sha256','-verify','remote-update/anderson_ota_signing_public.pem','-signature',str(dtmp/'signature'),str(dtmp/'payload')],check=True)
          print('RECOVERY_SIGNED_VERIFIED',ver,len(raw),flush=True)
          PY
          done
      - name: Compile host tests and verify source isolation
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            JasonHome2NanoC6_IDF/main/native_slot_guard.c \
            JasonHome2NanoC6_IDF/tests/native_slot_guard_test.c -o /tmp/jh2-169-guard
          /tmp/jh2-169-guard
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            JasonHome2NanoC6_IDF/main/effectlist.c \
            JasonHome2NanoC6_IDF/tests/effectlist_test.c -o /tmp/jh2-169-catalog
          /tmp/jh2-169-catalog
          python3 - <<'PY'
          from pathlib import Path
          p=Path('JasonHome2NanoC6_IDF/main')
          bridge=(p/'bridge.c').read_text()
          recovery=(p/'web_recovery.c').read_text()
          main=(p/'main.c').read_text()
          guard=(p/'native_slot_guard.c').read_text()
          assert '#define NATIVE_FW_VERSION "1.1.69"' in bridge
          assert '1.1.69-assigned-cid' in recovery
          assert 'jh2_slot_packet_cid' in bridge
          assert 'jh2_ble_catalog_cid' in main
          assert 'ESP_PARTITION_SUBTYPE_APP_FACTORY' in (p/'signed_ota.c').read_text()
          assert 'Recovery / rollback to 1.1.67' in recovery
          assert '/settings/nano' in recovery and 'saved_oracle_endpoint' in recovery
          assert 'nvs_flash_erase(' not in bridge+main+recovery
          assert 'JH2_TEST_CID' not in guard
          print('PRODUCTION_BASE_168_AND_CID_GUARD_VERIFIED')
          PY
      - name: Use original 1.1.68 production build flags
        shell: bash
        run: |
          cat >> JasonHome2NanoC6_IDF/sdkconfig.defaults <<'EOF'
          CONFIG_JH2_NATIVE_ENABLE_ORACLE=y
          CONFIG_JH2_NATIVE_BROWSER_OTA_COMPAT=y
          CONFIG_JH2_NATIVE_READONLY_ACCEPTANCE=n
          EOF
      - name: Compile ESP32-C6 production candidate
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32c6
          path: JasonHome2NanoC6_IDF
          command: idf.py build
      - name: Sign and independently verify v1.1.69 (no release, no flash)
        shell: bash
        env: {OTA_SIGNING_KEY_B64: '${{ secrets.ANDERSON_OTA_SIGNING_KEY_B64 }}'}
        run: |
          set -euo pipefail
          test -n "$OTA_SIGNING_KEY_B64"
          mkdir -p signed-package
          cp JasonHome2NanoC6_IDF/build/jh2_native_ble_probe.bin signed-package/jh2-runtime-1.1.69.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          d=Path('signed-package');b=(d/'jh2-runtime-1.1.69.bin').read_bytes()
          assert 0x120000<len(b)<=0x290000 and b[0]==0xe9 and b[12]==13 and b[13]==0
          assert b'jason-home-2-nanoc6-runtime-v1' in b
          assert b'1.1.69-assigned-cid' in b
          assert b'/settings/nano' in b
          m={'product':'jason-home-2-nanoc6','version':'1.1.69','commit':os.environ['GITHUB_SHA'],
             'files':{'jh2-runtime-1.1.69.bin':{'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}}}
          (d/'release.json').write_text(json.dumps(m,indent=2)+'\n')
          print('PRODUCTION_CANDIDATE_VERIFIED',len(b),m['files']['jh2-runtime-1.1.69.bin']['sha256'])
          PY
          key="$RUNNER_TEMP/jh2-ota-sign.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$OTA_SIGNING_KEY_B64" | base64 -d > "$key"
          chmod 600 "$key"
          python3 JasonHome2NanoC6/tools/sign_manifest.py --key "$key" --release signed-package/release.json --output signed-package/latest.json
          python3 - <<'PY'
          import base64,json,subprocess,tempfile
          from pathlib import Path
          d=Path('signed-package');m=json.loads((d/'latest.json').read_text())
          assert m['schema']==1 and 'version=1.1.69\n' in m['payload']
          with tempfile.TemporaryDirectory() as tmp:
           p=Path(tmp);(p/'payload').write_text(m['payload'])
           (p/'signature').write_bytes(base64.b64decode(m['signature'],validate=True))
           subprocess.run(['openssl','dgst','-sha256','-verify','remote-update/anderson_ota_signing_public.pem',
                           '-signature',str(p/'signature'),str(p/'payload')],check=True)
          print('SIGNED_169_MANIFEST_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-1.1.69-SIGNED-CID-PRODUCTION-CANDIDATE-AND-RECOVERY
          path: |
            signed-package/
            backup-1.1.68/
            backup-1.1.67/
          retention-days: 30
          if-no-files-found: error
