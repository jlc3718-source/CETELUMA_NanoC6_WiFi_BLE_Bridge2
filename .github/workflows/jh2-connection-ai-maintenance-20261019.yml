name: Jason Home 2 connection-only local AI access maintenance
on:
  push:
    branches: [codex/oracle-direct-bootstrap-20261019]
    paths: ['.github/workflows/jh2-connection-ai-maintenance-20261019.yml']
permissions: {contents: read}
concurrency: {group: jason-home-oracle-production, cancel-in-progress: false}
jobs:
  maintain-connection-only:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check read-only access, authentication, bounded operation and image validation
        run: python3 -m unittest discover -s OracleDevelopment -p 'test_local_ai_smoke.py' -v
      - name: Update only the existing connection and verify unchanged application source
        run: sudo -n python3 OracleDevelopment/update_local_ai_connection.py
