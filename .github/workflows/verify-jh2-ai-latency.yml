name: Verify Jason Home 2 AI brightness and queue backpressure
on:
  push:
    branches: [fix/jh2-ai-live-brightness-latency-20261011]
  pull_request:
    branches: [jason-home-2-web]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build shared Oracle resolver and generated web before gateway tests
        run: |
          cd JasonHomeServer
          npm ci
          npm run build
          cd ..
          mkdir -p JasonHome2Server/shared
          cp JasonHomeServer/dist/effects.js JasonHomeServer/dist/calendar.js JasonHomeServer/dist/scheduler.js JasonHome2Server/shared/
          printf 'test-resolver-sha\n' > JasonHome2Server/shared/oracle-resolver.sha
          python3 JasonHome2Server/generate_catalog.py
          python3 JasonHome2Server/generate_web.py
      - run: node --check JasonHome2Server/server.mjs
      - run: node --test JasonHome2Server/tests/*.mjs
