name: SD300 V8 stylized Agnes Flash generation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sd300-full-ai-v8-start.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  start:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start V8 Flash
        shell: bash
        run: |
          set -euo pipefail
          sudo -n systemctl stop sd300-full-ai-v7.service || true
          root=/home/ubuntu/agnes-sd300-v8
          mkdir -p "$root"
          cp agnes-remote/sd300-full-ai-v8.py "$root/sd300-full-ai-v8.py"
          cp agnes-remote/sd300-full-ai-v8.json "$root/sd300-full-ai-v8.json"
          python3 -m py_compile "$root/sd300-full-ai-v8.py"
          python3 - <<'PY'
          import json
          c=json.load(open('/home/ubuntu/agnes-sd300-v8/sd300-full-ai-v8.json'))
          assert c['model']=='agnes-video-2.5-flash' and c['seconds']==12 and len(c['scenes'])==9
          assert abs(sum(x['target_seconds'] for x in c['scenes'])-103.2)<0.001
          print('V8_FLASH_MODEL_AND_TIMELINE_VALID')
          PY
          sudo -n systemd-run --unit=sd300-full-ai-v8 --property=Restart=on-failure --property=RestartSec=30 /usr/bin/python3 "$root/sd300-full-ai-v8.py"
          sleep 3
          echo V8_SERVICE=$(systemctl is-active sd300-full-ai-v8.service || true)
          journalctl -u sd300-full-ai-v8.service -n 15 --no-pager -o cat || true
