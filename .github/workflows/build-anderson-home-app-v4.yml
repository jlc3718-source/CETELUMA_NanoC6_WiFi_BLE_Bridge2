name: Build Anderson Home Android App V4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Anderson_Home_Complete_Project.zip'
      - '.github/workflows/build-anderson-home-app-v4.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Anderson Home project
        run: |
          rm -rf build_source
          mkdir build_source
          unzip -q Anderson_Home_Complete_Project.zip -d build_source
          test -f build_source/Anderson_Home_Complete_Project/android/settings.gradle.kts

      - name: Configure AndroidX and Java 17
        working-directory: build_source/Anderson_Home_Complete_Project/android
        run: |
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            > gradle.properties
          sed -i '/buildFeatures { viewBinding = false }/a\    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' app/build.gradle.kts
          cat app/build.gradle.kts

      - name: Build Android debug APK
        working-directory: build_source/Anderson_Home_Complete_Project/android
        run: gradle --no-daemon assembleDebug

      - name: Copy APK
        run: |
          cp build_source/Anderson_Home_Complete_Project/android/app/build/outputs/apk/debug/app-debug.apk Anderson_Home_Controller.apk
          ls -lh Anderson_Home_Controller.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-Android-App
          path: Anderson_Home_Controller.apk
          if-no-files-found: error
