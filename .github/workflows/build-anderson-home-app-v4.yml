name: Build Anderson Home Android App V6

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Anderson_Home_Complete_Project.zip'
      - '.github/workflows/build-anderson-home-app-v4.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore persistent Anderson signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: anderson-home-android-signing-v1

      - name: Create signing key on first build
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Anderson Home,O=Anderson Home,C=US"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Extract Anderson Home project
        run: |
          rm -rf build_source
          mkdir build_source
          unzip -q Anderson_Home_Complete_Project.zip -d build_source
          test -f build_source/Anderson_Home_Complete_Project/android/settings.gradle.kts

      - name: Configure Android build and version
        working-directory: build_source/Anderson_Home_Complete_Project/android
        run: |
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            > gradle.properties
          sed -i '/buildFeatures { viewBinding = false }/a\    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          s = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {1000 + run}', s)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "1.3.{run}"', s)
          p.write_text(s)
          PY
          cat app/build.gradle.kts

      - name: Build Android debug APK
        working-directory: build_source/Anderson_Home_Complete_Project/android
        run: gradle --no-daemon assembleDebug

      - name: Verify signature and copy APK
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
          cp build_source/Anderson_Home_Complete_Project/android/app/build/outputs/apk/debug/app-debug.apk Anderson_Home_Controller_Updateable.apk
          test -s Anderson_Home_Controller_Updateable.apk
          ls -lh Anderson_Home_Controller_Updateable.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-Android-App-Updateable
          path: Anderson_Home_Controller_Updateable.apk
          if-no-files-found: error

# Verification build: confirms cached signing key reuse plus incremented versionCode.
