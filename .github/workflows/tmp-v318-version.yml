name: Temporary Anderson v3.1.8 runtime version sync

on:
  push:
    branches: ['work/v3.1.8-ble-diagnostics']
    paths: ['.github/workflows/tmp-v318-version.yml']

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.1.8-ble-diagnostics
      - name: Sync committed runtime version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firmware/src/main.cpp')
          s=p.read_text()
          old='static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.7";'
          new='static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.8";'
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected v3.1.7 runtime marker was not found')
              p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/src/main.cpp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bump Anderson runtime version to v3.1.8'
          git push origin HEAD:work/v3.1.8-ble-diagnostics
