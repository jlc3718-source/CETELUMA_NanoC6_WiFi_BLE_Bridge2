name: Patch Anderson v3.0.28
on:
  push:
    branches:
      - staging/v3.0.28-wifi-subtab
    paths:
      - .github/workflows/patch-v3028.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/v3.0.28-wifi-subtab
          fetch-depth: 0
      - run: python tools/patch_v3028_wifi_subtab.py
      - run: node --check firmware/web/v3_mockup.js
      - run: |
          git config user.name jlc3718-source
          git config user.email jlc3718@gmail.com
          git add firmware/web/v3_mockup.js FIRMWARE_VERSION.txt README.md firmware/RELEASE_NOTES_v3.0.28.md
          git commit -m "Add dedicated Wi-Fi Settings tab for v3.0.28"
          git push origin HEAD:staging/v3.0.28-wifi-subtab
