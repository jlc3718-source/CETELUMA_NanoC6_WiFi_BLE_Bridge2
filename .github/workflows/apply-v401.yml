name: Apply v4.0.1 corrections
on:
  push:
    branches: ['work/v4.0.0-native-idf']
    paths: ['.github/workflows/apply-v401.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.0.0-native-idf
          fetch-depth: 0
      - name: Apply v4.0.1 patch
        run: python tools/apply_v401.py
      - name: Commit corrected source and remove temporary patch machinery
        run: |
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git rm tools/apply_v401.py .github/workflows/apply-v401.yml
          git add -A
          git commit -m 'Prepare v4.0.1 efficiency and login recovery'
          git push origin HEAD:work/v4.0.0-native-idf
