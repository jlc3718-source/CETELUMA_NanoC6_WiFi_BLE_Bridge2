name: One-time remove legacy Lights presets

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-remove-legacy-presets.yml'

permissions:
  contents: write

jobs:
  remove-legacy-presets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove legacy Lights-tab presets only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('firmware/web/index.html')
          s = p.read_text()

          old_panel = '<div class="panel"><strong>Saved Custom Lights</strong><div class="sub">Your saved shows appear here immediately. Use Add to Schedule to assign one to a date.</div><div id="customPresetList" class="presetList"><div class="sub">Loading saved custom lights…</div></div></div><div class="panel"><strong>Presets</strong><div class="sub">Favorites are managed from Events, not here.</div><div id="presetList" class="presetList"></div></div>'
          new_panel = '<div class="panel"><strong>Saved Custom Lights</strong><div class="sub">Your saved shows appear here immediately. Use Add to Schedule to assign one to a date.</div><div id="customPresetList" class="presetList"><div class="sub">Loading saved custom lights…</div></div></div>'
          if old_panel not in s:
              raise SystemExit('Legacy Presets panel block not found; refusing partial edit')
          s = s.replace(old_panel, new_panel, 1)

          old_presets = "const presets=[['Warm White',['#fff1c7'],'Solid'],['Cool White',['#eef7ff'],'Solid'],['Red',['#ff3b30'],'Solid'],['Blue',['#0a84ff'],'Solid'],['Purple',['#bf5af2'],'Solid'],['Rainbow',['#25a7ff'],'Rainbow'],['Patriotic',['#ef4444','#ffffff','#2563eb'],'Chase'],['Christmas',['#dc2626','#16a34a','#ffffff'],'Candy Cane'],['Halloween',['#ff7a00','#7e22ce','#16a34a'],'Twinkle'],['Suicide Prevention',['#14b8a6','#7e22ce'],'Gradient']];\npresets.forEach(([n,c,e])=>{const row=document.createElement('div');row.className='card presetRow';const info=document.createElement('div');info.innerHTML=`<div class=\"small\"><strong>${n}</strong></div><div class=\"sub\">${e}</div><div class=\"chips\">${c.map(x=>`<span class=\"chip\" style=\"background:${x}\"></span>`).join('')}</div>`;const b=document.createElement('button');b.className='btn presetApply';b.textContent='Apply';b.addEventListener('click',()=>manual({name:n,colors:c,effect:e,brightness:100,speed:1}));row.append(info,b);$('presetList').appendChild(row)});\n"
          if old_presets not in s:
              raise SystemExit('Legacy preset renderer not found; refusing partial edit')
          s = s.replace(old_presets, '', 1)

          s = s.replace('.small{font-size:12px}.status{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}.presetList{display:grid;gap:8px;margin-top:10px}.presetRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}', '.small{font-size:12px}.status{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}.presetList{display:grid;gap:8px;margin-top:10px}', 1)
          s = s.replace('@media(max-width:430px){.nav{gap:5px}.tab{padding:8px 4px;font-size:11px}.grid2,.monthHead{grid-template-columns:1fr}.event{grid-template-columns:auto 1fr}.event .previewEvent{grid-column:2}.presetRow{grid-template-columns:1fr}.presetRow .presetApply{grid-column:1}.favoriteGrid{grid-template-columns:1fr 1fr}}', '@media(max-width:430px){.nav{gap:5px}.tab{padding:8px 4px;font-size:11px}.grid2,.monthHead{grid-template-columns:1fr}.event{grid-template-columns:auto 1fr}.event .previewEvent{grid-column:2}.favoriteGrid{grid-template-columns:1fr 1fr}}', 1)

          if 'id="presetList"' in s or 'const presets=' in s or 'presetApply' in s or 'presetRow' in s:
              raise SystemExit('Legacy preset UI references remain')
          if 'id="customPresetList"' not in s or 'Save Custom Light' not in s or 'Add to Schedule' not in s:
              raise SystemExit('Custom-light workflow was unexpectedly damaged')

          p.write_text(s)
          PY

      - name: Commit canonical source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/web/index.html
          git diff --cached --check
          git commit -m 'Remove legacy presets from Lights tab'
          git push origin HEAD:main
