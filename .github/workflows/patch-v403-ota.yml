name: Apply v4.0.3 OTA downloader fix

on:
  push:
    branches: ['fix/v4.0.3-ota-download']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4.0.3-ota-download
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch and version bump
        run: python tools/patch_v403_ota.py
      - name: Commit exact v4.0.3 source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix native OTA release downloads in v4.0.3"
          git push origin HEAD:refs/heads/fix/v4.0.3-ota-download
