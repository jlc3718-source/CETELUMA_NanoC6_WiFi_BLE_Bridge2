name: JH2 Nano AI Animation and Sparse Loop Regression
on:
  push:
    branches: [codex/jh2-slot-inventory-fix-20261018]
    paths:
      - 'JasonHome2Server/**'
      - 'JasonHome2NanoC6_IDF/main/asset_stream.c'
      - '.github/workflows/jh2-local-test-regression-20261019.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Nano-local animated file rules and compile JS tests
        run: |
          set -euo pipefail
          node --check JasonHome2Server/curtain.js
          node --check JasonHome2Server/curtain_bridge.mjs
          node --check JasonHome2Server/curtain_asset.mjs
          node --check JasonHome2Server/server.mjs
          node --test JasonHome2Server/tests/curtain-relay.mjs JasonHome2Server/tests/curtain-studio.mjs
          python3 - <<'PY'
          from pathlib import Path
          root=Path('JasonHome2NanoC6_IDF/main')
          src=(root/'asset_stream.c').read_text()
          assert '#define MAX_ASSET (256U*1024U)' in src
          assert 'jh2_asset_local_available_bytes()' in src
          assert 'CACHE_RESERVED_BYTES' in src
          assert 'esp_littlefs_info("storage"' in src
          assert 'cache_asset_once(&job)' in src
          assert 'stream_local_once(&job' in src
          assert 'esp_littlefs_info("storage"' in src
          assert 'mbedtls_sha256_finish' in src
          assert 'unlink(CACHE_PATH)' in src and 'DIGEST_PATH' in src
          assert 'jh2_ble_asset_packet(channel,packet,bytes)' in src
          assert 'stream_once(&job' not in src
          web=Path('JasonHome2Server/curtain_ai_animation.html').read_text()
          assert 'seamlessAnimation:true' in web and 'assetSpeed' in web
          assert 'jh2CurtainAnimationTab' in Path('JasonHome2Server/curtain.js').read_text()
          assert not Path('JasonHome2Server/curtain_local_test.html').exists()
          assert 'jh2-nano-seamless-delta-v1' in Path('JasonHome2Server/curtain_asset.mjs').read_text()
          assert 'continued_loop' in src and 'seamless_loop' in src
          print('NANO_AI_ANIMATION_AND_SPARSE_LOOP_SOURCE_GUARDS_OK')
          PY
