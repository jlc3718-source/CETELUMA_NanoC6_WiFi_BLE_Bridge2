name: Verify Streamlight black second color
on:
  push:
    branches:
      - fix/oracle-streamlight-black-second-20261011
  pull_request:
    branches:
      - jason-home-cloudflare-rebuild
    paths:
      - 'JasonHomeServer/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: JasonHomeServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: JasonHomeServer/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
