name: Validate Anderson Home 3.1.21 Review Hardening

on:
  push:
    branches: ['codex/3.1.21-review-hardening']
    paths:
      - 'tools/apply_3_1_21_backup_hardening.py'
      - '.github/workflows/validate-3.1.21-review-hardening.yml'

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - name: Apply transactional backup hardening
        run: python tools/apply_3_1_21_backup_hardening.py
      - name: Install build tool
        run: python -m pip install -q -r tools/requirements-build.txt
      - name: Install pinned web minifier
        run: npm ci --prefix tools --no-audit --no-fund
      - name: Verify browser script and backup UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          w=Path('firmware/web/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',w,re.S|re.I)
          Path('/tmp/anderson-inline.js').write_text('\n;\n'.join(scripts))
          assert w.index('let savedColors=[],savedColorLabels=[];') < w.index('function semanticColorName') < w.index('renderColorBuilder();')
          assert 'id="backupSettingsTab"' in w and 'id="backupSettingsPanel"' in w
          assert '/api/backup/status' in w and '/api/backup/now' in w and '/api/backup/restore' in w
          assert "const EFFECT_BUTTON_VALUES=['Jump','Breath','Strobe','Solid']" in w
          assert "$('liveColorCode').textContent=h" in w
          assert '--accent:#29d8ff' in w or '#27aaff' in w
          print('UI startup, effect buttons, semantic colors, and backup tab checks passed')
          PY
          node --check /tmp/anderson-inline.js
      - name: Verify transactional backup invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          m=Path('firmware/src/main.cpp').read_text()
          required=[
            'ANDERSON_SETTINGS_BACKUP_V3_1_21_TRANSACTIONAL',
            'SETTINGS_BACKUP_FILE0','SETTINGS_BACKUP_FILE1','SETTINGS_RESTORE_ROLLBACK',
            'settingsBackupValidateDocument','settingsBackupCommitActive',
            'settingsBackupSetRestorePending(true)','settingsBackupRecoverPendingRestore',
            'settingsBackupMigrateLegacy','settingsBackupRetryAfter',
            'firmwareOperationBusy()'
          ]
          for s in required: assert s in m,s
          assert 'SPIFFS.begin' in m
          assert 'restorepend' in m
          assert 'delaySeconds>21600ULL' in m
          print('Transactional backup/restore invariants passed')
          PY
      - name: Run maintenance and recovery checks
        run: python tools/test_maintenance.py
      - name: Run regression checks
        run: python tools/test_regressions.py
      - name: Run audit checks
        run: python tools/test_audit_fixes.py
      - name: Check scheduled event coverage
        run: python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full
      - name: Verify no partition-map or Android changes
        run: |
          python - <<'PY'
          import subprocess
          base='c5a9f2f0bf32282a6167d8950225f9301ac7486f'
          changed=subprocess.check_output(['git','diff','--name-only',base]).decode().splitlines()
          assert not any(p.startswith('android/') for p in changed), changed
          assert 'firmware/platformio.ini' not in changed, changed
          assert 'firmware/partitions_ota.csv' not in changed, changed
          print('Partition map, build map, and Android tree unchanged')
          PY
      - name: Prepare release
        run: python tools/release.py prepare
      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package verified firmware
        run: python tools/release.py package
      - name: Verify packaged v3.1.21
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          assert Path('FIRMWARE_VERSION.txt').read_text().strip()=='3.1.21'
          p=Path('release/and_3.1.21.bin')
          assert p.exists() and p.stat().st_size>1000000 and p.read_bytes()[:1]==b'\xE9'
          r=json.loads(Path('release/release.json').read_text())
          assert r['version']=='3.1.21'
          info=r['files']['and_3.1.21.bin']
          assert info['bytes']==p.stat().st_size
          assert info['sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert p.stat().st_size < 0x1E0000
          print('v3.1.21 hardened package verified',p.stat().st_size,info['sha256'])
          PY
      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.21-Review-Hardening
          path: |
            release/*
            firmware/web/index.html
            firmware/RELEASE_NOTES_v3.1.21.md
          if-no-files-found: error
      - name: Materialize exact validated source and remove temporary validation files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tools/apply_3_1_21_backup_hardening.py .github/workflows/validate-3.1.21-review-hardening.yml
          git add -A
          git diff --cached --quiet && { echo 'No validated source changes to materialize'; exit 1; }
          git commit -m 'Anderson Home v3.1.21 harden settings backup and restore'
          git push origin HEAD:refs/heads/codex/3.1.21-review-hardening
