name: Verify Eufy AI pattern brightness follows manual adjustments
on:
  push:
    branches: [fix/jh2-eufy-ai-brightness-preview-20261011]
  pull_request:
    branches: [jason-home-2-web]
    paths:
      - 'JasonHome2Server/server.mjs'
      - 'JasonHome2Server/tests/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check JasonHome2Server/server.mjs
      - run: node --test JasonHome2Server/tests/ai-brightness.mjs
