name: Stage Anderson Home v3.0.23

on:
  push:
    branches: ['staging/v3.0.23-schedule2-dawn-retention']
    paths: ['.github/workflows/apply-v3023-staging.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/v3.0.23-schedule2-dawn-retention
      - name: Apply patch
        run: python .github/patches/v3023_schedule2.py
      - name: Commit staged firmware source
        run: |
          git rm .github/workflows/apply-v3023-staging.yml .github/patches/v3023_schedule2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FIRMWARE_VERSION.txt firmware .github/scripts/anderson-retention.sh
          git commit -m 'Add Schedule 2 dawn dimming, reseed Home favorites, and cap preset speeds for v3.0.23'
          git push origin HEAD:staging/v3.0.23-schedule2-dawn-retention
