name: Oracle Daily Manual Handoff
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oracle-daily-manual-handoff.yml"
      - ".github/oracle-daily-manual-handoff.trigger"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oracle-daily-runtime-maintenance
  cancel-in-progress: false
jobs:
  entries:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use bounded recoverable jobs and retain complete safe evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 oracle-daily/run-agent.py handoff
      - name: Publish current evidence without rebasing generated files
        if: always()
        run: python3 oracle-daily/publish-results.py .github/oracle-manual-handoff-result.json
