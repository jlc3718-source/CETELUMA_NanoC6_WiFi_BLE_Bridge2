name: Oracle Daily Manual Handoff
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oracle-daily-manual-handoff.yml"
      - ".github/oracle-daily-manual-handoff.trigger"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oracle-daily-runtime-maintenance
  cancel-in-progress: false
jobs:
  entries:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use bounded recoverable jobs and retain complete safe evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 oracle-daily/run-agent.py handoff
      - name: Publish current results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name oracle-runner
          git config user.email oracle-runner@users.noreply.github.com
          for file in .github/oracle-manual-handoff-result.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish handoff evidence with the reliable Oracle runtime"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
