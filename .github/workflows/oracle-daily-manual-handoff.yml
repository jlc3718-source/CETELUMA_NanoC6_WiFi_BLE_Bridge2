name: Oracle Daily Manual Handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oracle-daily-manual-handoff.yml"
      - ".github/oracle-daily-manual-handoff.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-daily-manual-handoff
  cancel-in-progress: false

jobs:
  entries:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover status of the already prepared Oracle session
        shell: bash
        run: |
          set -euo pipefail
          CID="$(sudo docker ps --format '{{.ID}} {{.Ports}}' | awk '/127\.0\.0\.1:8932->8932/{print $1; exit}')"
          test -n "$CID"
          sudo docker exec "$CID" node - <<'JS' > .github/oracle-current-session-result.json
          const fs=require("fs");
          const http=require("http");
          const source=fs.readFileSync("/app/src/server.js","utf8");
          const match=source.match(/if\s*\(task\s*===\s*["'](login_status|login_state|login_get)["']\)\s*\{/);
          const route=source.match(/app\.get\(["'](\/(?:login|session)\/(?:status|state))["']/);
          const allowed=["task","status","profile","target","targets","login_url","control_url","url","active","pages","title","ready","login_active"];
          function safe(v){
            if(Array.isArray(v))return v.slice(0,15).map(safe);
            if(v&&typeof v==="object"){let o={};for(const k of allowed){if(k in v)o[k]=safe(v[k]);}return o;}
            if(typeof v==="string")return v.slice(0,300);
            return v;
          }
          if(!match&&!route){console.log(JSON.stringify({status:"status_retrieval_unavailable",login_task_lines:source.split("\n").filter(x=>/task\s*===.*login/.test(x)).map(x=>x.trim()).slice(0,15)},null,2));}
          else{
            const data=match?JSON.stringify({id:"daily-existing-session-status",task:match[1]}):null;
            const req=http.request({host:"127.0.0.1",port:8932,path:match?"/run":route[1],method:match?"POST":"GET",headers:match?{"Content-Type":"application/json","Content-Length":Buffer.byteLength(data)}:{}},res=>{
              let body="";res.on("data",x=>body+=x);res.on("end",()=>{try{const j=JSON.parse(body);console.log(JSON.stringify({checked_at:new Date().toISOString(),ok:j.ok,status:"retrieved",result:safe(j.result||j)},null,2));}catch{console.log(JSON.stringify({status:"invalid_status_response"}));}});
            });
            req.setTimeout(12000,()=>req.destroy(new Error("status_timeout")));
            req.on("error",e=>console.log(JSON.stringify({status:"blocked",error:String(e.message).slice(0,100)})));
            req.end(data);
          }
          JS

      - name: Publish scrubbed daily results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "oracle-runner"
          git config user.email "oracle-runner@users.noreply.github.com"
          git add .github/oracle-current-session-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish scrubbed daily lane outcomes"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
