name: Patch Anderson v3.0.29
on:
  push:
    branches:
      - staging/v3.0.29-expanded-palette
    paths:
      - tools/patch_v3029_expanded_palette.py
      - .github/workflows/patch-v3029.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/v3.0.29-expanded-palette
      - name: Apply v3.0.29 palette patch
        run: python tools/patch_v3029_expanded_palette.py
      - name: Validate JavaScript
        run: node --check firmware/web/v3_mockup.js
      - name: Commit patched source
        run: |
          git config user.name jlc3718-source
          git config user.email jlc3718@gmail.com
          git add firmware/src/EventCatalog.cpp firmware/src/ColorCorrection.cpp firmware/src/PaletteMigration.cpp firmware/web/index.html firmware/RELEASE_NOTES_v3.0.29.md FIRMWARE_VERSION.txt README.md
          git commit -m "Apply revised 210-event colors and 16-color palette for v3.0.29"
          git push origin HEAD:staging/v3.0.29-expanded-palette
