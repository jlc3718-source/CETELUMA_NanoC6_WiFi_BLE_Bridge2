name: Patch Anderson v3.0.29
on:
  push:
    branches:
      - staging/v3.0.29-expanded-palette
    paths:
      - tools/patch_v3029_expanded_palette.py
      - tools/patch_v3029_expanded_palette_v2.py
      - .github/workflows/patch-v3029.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/v3.0.29-expanded-palette
      - name: Apply exact 210-event palette patch
        run: python tools/patch_v3029_expanded_palette_v2.py
      - name: Validate web JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('firmware/web/index.html').read_text()
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/anderson-web.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/anderson-web.js
      - name: Commit source changes
        run: |
          git config user.name jlc3718-source
          git config user.email jlc3718@gmail.com
          git add firmware/src/EventCatalog.cpp firmware/src/ColorCorrection.cpp firmware/web/index.html FIRMWARE_VERSION.txt README.md firmware/RELEASE_NOTES_v3.0.29.md
          git commit -m "Expand Anderson palette and revise 210 event colors for v3.0.29"
          git push origin HEAD:staging/v3.0.29-expanded-palette
