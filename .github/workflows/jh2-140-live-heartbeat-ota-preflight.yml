name: JH2 1.1.40 Recovery - Fresh Nano Heartbeat Preflight
on:
  push:
    branches: [codex/jh2-native-1-1-40-recover-no-dle-20261018]
    paths: ['.github/workflows/jh2-140-live-heartbeat-ota-preflight.yml']
permissions: {contents: read}
concurrency:
  group: jh2-production-signed-ota-singleton
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 4
    steps:
      - name: Verify fresh Nano state without dispatching any command
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 - <<'PY'
          import json,subprocess,urllib.request,time
          env=dict(x.split('=',1) for x in json.loads(subprocess.check_output(['docker','inspect','jason-home']))[0]['Config']['Env'] if '=' in x)
          host='http://127.0.0.1:8081'
          def api(path,body=None,cookie=''):
              b=json.dumps(body).encode() if body is not None else None
              headers={'Content-Type':'application/json'}
              if cookie:headers['Cookie']=cookie
              request=urllib.request.Request(host+path,data=b,headers=headers,method='POST' if b is not None else 'GET')
              with urllib.request.urlopen(request,timeout=12) as resp:return json.load(resp),resp.headers
          _,h=api('/api/session',{'token':env['JASON_HOME_API_TOKEN']})
          cookie=h['Set-Cookie'].split(';',1)[0]
          samples=[]
          for i in range(5):
              status,_=api('/api/curtain/status',cookie=cookie)
              c=status.get('curtain') or {}
              sample={'sample':i+1,'fw':status.get('firmware'),'online':status.get('online'),
                'uptime':status.get('uptimeSeconds'),'lastSync':status.get('lastSync'),
                'queued':status.get('queued'),'BLE':c.get('connected'),
                'mtu':c.get('mtu'),'dleRx':c.get('nativeDLERxOctets')}
              print('LIVE_HEARTBEAT',json.dumps(sample,sort_keys=True),flush=True)
              samples.append(sample)
              if i<4:time.sleep(4)
          fw=samples[-1]['fw']
          fresh=any((samples[i]['uptime'] or 0)>(samples[i-1]['uptime'] or 0) or
                     (samples[i]['lastSync'] or 0)!=(samples[i-1]['lastSync'] or 0)
                     for i in range(1,len(samples)))
          print('RECOVERY_140_PREFLIGHT',json.dumps({'firmware':fw,'fresh':fresh,'queued':samples[-1]['queued'],'onlineFlag':samples[-1]['online']},sort_keys=True),flush=True)
          if fw=='1.1.39' and not fresh:
              raise RuntimeError('Nano heartbeat stalled. OTA over Oracle cannot be verified until Nano restarts. NO_COMMAND_SENT')
          if fw not in ('1.1.39','1.1.40'):
              raise RuntimeError('Unexpected Nano version; no command sent')
          print('NO_COMMANDS_DISPATCHED',flush=True)
          PY
