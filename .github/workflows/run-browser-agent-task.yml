name: Run Oracle Browser Task

on:
  push:
    branches: [jason-home-cloudflare-rebuild]
    paths:
      - 'BrowserAgent/tasks/request.json'

permissions:
  contents: write

concurrency:
  group: oracle-browser-agent-task
  cancel-in-progress: true

jobs:
  run-task:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jason-home-cloudflare-rebuild

      - name: Prepare Oracle-only eufy browser credentials
        run: |
          set -euo pipefail
          SRC=/home/ubuntu/repo/JasonHomeServer/.env
          DEST=/home/ubuntu/browser-agent-data/secrets/eufy-login.env
          test -s "$SRC"
          sudo rm -rf /home/ubuntu/browser-agent-data/eufy-login.env
          sudo mkdir -p /home/ubuntu/browser-agent-data/secrets
          EMAIL="$(sudo sed -n 's/^EUFY_EMAIL=//p' "$SRC" | head -n1)"
          PASS="$(sudo sed -n 's/^EUFY_PASSWORD=//p' "$SRC" | head -n1)"
          test -n "$EMAIL"
          test -n "$PASS"
          umask 077
          printf 'EUFY_EMAIL=%s\nEUFY_PASSWORD=%s\n' "$EMAIL" "$PASS" | sudo tee "$DEST" >/dev/null
          sudo chown ubuntu:ubuntu "$DEST"
          sudo chmod 600 "$DEST"

      - name: Ensure current browser-agent code is deployed
        run: |
          set -euo pipefail
          SRC_HASH="$(
            {
              sha256sum BrowserAgent/package.json BrowserAgent/Dockerfile BrowserAgent/start.sh BrowserAgent/docker-compose.yml
              find BrowserAgent/src -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 sha256sum
            } | sha256sum | awk '{print $1}'
          )"
          STAMP=/home/ubuntu/browser-agent-data/deployed-source-sha
          DEPLOYED="$(cat "$STAMP" 2>/dev/null || true)"
          if [ "$SRC_HASH" != "$DEPLOYED" ]; then
            echo "Browser agent code changed; rebuilding once."
            sudo mkdir -p /home/ubuntu/browser-agent-data/profiles /home/ubuntu/browser-agent-data/logs
            sudo chown -R ubuntu:ubuntu /home/ubuntu/browser-agent-data
            cd BrowserAgent
            sudo docker compose up -d --build --remove-orphans
            cd ..
            echo "$SRC_HASH" | sudo tee "$STAMP" >/dev/null
          else
            echo "Browser agent already current; no rebuild needed."
          fi

      - name: Wait for local browser agent
        run: |
          set -e
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8932/health >/dev/null && exit 0
            sleep 2
          done
          sudo docker logs --tail=200 oracle-browser-agent || true
          exit 1

      - name: Run sanitized task
        run: |
          set -euo pipefail
          mkdir -p BrowserAgent/results
          curl -fsS --connect-timeout 5 --max-time 50 \
            -H 'Content-Type: application/json' \
            --data-binary @BrowserAgent/tasks/request.json \
            http://127.0.0.1:8932/run \
            > BrowserAgent/results/latest.json
          python3 -m json.tool BrowserAgent/results/latest.json

      - name: Publish sanitized result
        run: |
          set -euo pipefail
          git config user.name "Oracle Browser Agent"
          git config user.email "actions@users.noreply.github.com"
          git add BrowserAgent/results/latest.json
          git commit -m "browser-agent: publish task result [skip ci]" || exit 0
          git pull --rebase origin jason-home-cloudflare-rebuild
          git push origin HEAD:jason-home-cloudflare-rebuild
