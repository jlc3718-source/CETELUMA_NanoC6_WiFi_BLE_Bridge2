name: JH2 Uploaded Native Video Activation Probe
on:
  push:
    branches: [codex/jh2-slot-inventory-fix-20261018]
    paths: ['.github/workflows/jh2-native-file-activate-probe-20261018.yml']
permissions: {contents: read}
concurrency:
  group: jh2-native-slot-field-test
  cancel-in-progress: false
jobs:
  activate:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 4
    steps:
      - name: Play the acknowledged test file at its internal video index; restore prior display if unconfirmed
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 - <<'PY'
          import json,subprocess,urllib.request,time,base64
          env=dict(s.split('=',1) for s in json.loads(subprocess.check_output(['docker','inspect','jason-home'],text=True))[0]['Config']['Env'] if '=' in s)
          base='http://127.0.0.1:8081'
          def api(path,body=None,cookie=''):
              req=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers={'content-type':'application/json',**({'Cookie':cookie} if cookie else {})})
              with urllib.request.urlopen(req,timeout=25) as res:return json.load(res),res.headers
          _,headers=api('/api/session',{'token':env['JASON_HOME_API_TOKEN']});cookie=headers['Set-Cookie'].split(';')[0]
          s,_=api('/api/curtain/status',cookie=cookie)
          assert s.get('firmware')=='1.1.48' and s.get('online') and (s.get('curtain') or {}).get('connected') and int(s.get('queued') or 0)==0
          old=(s.get('desired') or {}).get('visual')
          notices,_=api('/api/curtain/notifications?since=0',cookie=cookie)
          cursor=max([0]+[int(x['id']) for x in notices.get('notifications',[])])
          def send(action,payload,key):
              q,_=api('/api/curtain/call',{'action':action,'payload':payload,'idempotencyKey':key},cookie=cookie)
              for i in range(100):
                  c,_=api('/api/curtain/command?id='+str(q['commandId']),cookie=cookie)
                  c=c.get('command') or {}
                  if c.get('state') in ('applied','failed','expired','superseded'):break
                  time.sleep(.5)
              print('ACTIVATE_COMMAND',json.dumps({'id':q['commandId'],'action':action,'state':c.get('state'),'result':c.get('result')}),flush=True)
              return c
          play=send('nativePlay',{'cid':83928,'slot':0},'native-83928-video-index-zero-20261018')
          time.sleep(12)
          packet=bytearray(24);packet[:6]=bytes([211,1,0,0,240,4]);packet[10:12]=(2904).to_bytes(2,'big')
          send('rawWrite',{'uuid':'01020074-1972-1925-3022-077119514e44','data':base64.b64encode(packet).decode()},'native-83928-after-play-read-20261018')
          time.sleep(12)
          replies,_=api('/api/curtain/notifications?since='+str(cursor),cookie=cookie)
          progress=[]
          for notice in replies.get('notifications',[]):
              raw=base64.b64decode(notice['data'])
              if len(raw)<24 or raw[4] not in (240,241):continue
              op=int.from_bytes(raw[10:12],'big')
              if op in (2606,2630,2904):print('ACTIVATE_REPLY',op,raw.hex(),flush=True)
              if op==2630:progress.append(raw.hex())
          if not progress and old:
              print('NO_NATIVE_PLAYBACK_PROGRESS_RESTORE_PRIOR_SELECTION',flush=True)
              send(old['action'],old['payload'],'native-83928-zero-probe-restore-20261018')
          print('ACTIVATION_RESULT',json.dumps({'controllerProgressReports':len(progress),'playApplied':play.get('state')=='applied','nativeSlotErased':False}),flush=True)
          PY
