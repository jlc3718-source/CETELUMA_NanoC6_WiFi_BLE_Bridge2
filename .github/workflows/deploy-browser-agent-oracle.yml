name: Deploy Oracle Browser Agent

on:
  push:
    branches: [jason-home-cloudflare-rebuild]
    paths:
      - 'BrowserAgent/package.json'
      - 'BrowserAgent/Dockerfile'
      - 'BrowserAgent/start.sh'
      - 'BrowserAgent/docker-compose.yml'
      - 'BrowserAgent/src/**'
      - '.github/workflows/deploy-browser-agent-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-browser-agent-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jason-home-cloudflare-rebuild

      - name: Prepare persistent browser data
        run: |
          sudo mkdir -p /home/ubuntu/browser-agent-data/profiles /home/ubuntu/browser-agent-data/logs
          sudo chown -R ubuntu:ubuntu /home/ubuntu/browser-agent-data

      - name: Build and start browser agent
        working-directory: BrowserAgent
        run: |
          sudo docker compose up -d --build --remove-orphans

      - name: Verify local browser API
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8932/health; then
              exit 0
            fi
            sleep 2
          done
          sudo docker logs --tail=200 oracle-browser-agent || true
          exit 1
