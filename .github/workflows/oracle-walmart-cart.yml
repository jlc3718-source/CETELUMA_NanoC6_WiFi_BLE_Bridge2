name: Oracle Walmart Cart
on:
  workflow_dispatch:
    inputs:
      url:
        description: Current Walmart product URL
        required: true
        type: string
      latest_arrival:
        description: Latest acceptable arrival date, YYYY-MM-DD
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: oracle-daily-runtime-maintenance
  cancel-in-progress: false
jobs:
  cart:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run requested Walmart cart
        env:
          WALMART_PRODUCT_URL: ${{ inputs.url }}
          WALMART_LATEST_ARRIVAL: ${{ inputs.latest_arrival }}
        shell: bash
        run: |
          set -euo pipefail
          python3 oracle-daily/run-agent.py walmart-cart --url "$WALMART_PRODUCT_URL" --latest-arrival "$WALMART_LATEST_ARRIVAL"
      - name: Publish current evidence without rebasing generated files
        if: always()
        run: python3 oracle-daily/publish-results.py .github/oracle-walmart-cart-result.json
