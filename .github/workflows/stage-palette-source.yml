name: Stage Anderson nine-color palette source

on:
  push:
    branches: ['staging/palette-holiday-update']

permissions:
  contents: write

jobs:
  stage-palette:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/palette-holiday-update
      - name: Apply nine-color palette source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Backend canonical palette / migration map.
          p = Path('firmware/src/ColorCorrection.cpp')
          s = p.read_text()
          s = s.replace(
          """const AndersonColorPaletteEntry ANDERSON_COLOR_PALETTE[] = {
            {0xFF0D00,0xFF0D00},
            {0xFF0024,0xFF0024},
            {0xFFFF44,0xFFFF44},
            {0x28FF00,0x28FF00},
            {0x0D00FF,0x0D00FF},
            {0x5B00E6,0x5B00E6},
            {0xFFFFFA,0xFFFFFA}
          };""",
          """const AndersonColorPaletteEntry ANDERSON_COLOR_PALETTE[] = {
            {0xFF0000,0xFF0000}, // Red
            {0xFF0D00,0xFF0D00}, // Orange
            {0xFF0024,0xFF0024}, // Pink
            {0xFFFF44,0xFFFF44}, // Yellow
            {0x28FF00,0x28FF00}, // Green
            {0x00BD4C,0x00BD4C}, // Cyan
            {0x0D00FF,0x0D00FF}, // Blue
            {0x5B00E6,0x5B00E6}, // Purple
            {0xFFFFFA,0xFFFFFA}  // White
          };""")
          s = s.replace('// Seven approved outputs are idempotent.', '// Nine approved outputs are idempotent.')
          s = s.replace(
          """  {0xFF0D00,0xFF0D00},{0xFF0024,0xFF0024},{0xFFFF44,0xFFFF44},
            {0x28FF00,0x28FF00},{0x0D00FF,0x0D00FF},{0x5B00E6,0x5B00E6},{0xFFFFFA,0xFFFFFA},""",
          """  {0xFF0000,0xFF0000},{0xFF0D00,0xFF0D00},{0xFF0024,0xFF0024},{0xFFFF44,0xFFFF44},
            {0x28FF00,0x28FF00},{0x00BD4C,0x00BD4C},{0x0D00FF,0x0D00FF},{0x5B00E6,0x5B00E6},{0xFFFFFA,0xFFFFFA},""")
          s = s.replace(
          """  {0xFF0000,0xFF0D00},{0xFF2900,0xFF0D00},{0xFF6E00,0xFFFF44},
            {0x4DFF00,0x28FF00},{0x05008A,0x0D00FF},{0x23018C,0x5B00E6},
            {0xBF0005,0xFF0024},{0x00BD4C,0x28FF00},
            {0xFFFFFF,0xFFFFFA},{0x360500,0xFF0D00},{0x220200,0xFF0D00},{0x000000,0x5B00E6},
            // Red / orange family -> approved orange.
            {0xFF3B30,0xFF0D00},{0xEF4444,0xFF0D00},{0xDC2626,0xFF0D00},{0xEF233C,0xFF0D00},
            {0xFF1744,0xFF0D00},{0xE11D48,0xFF0D00},{0xFF9500,0xFF0D00},{0xFF7A00,0xFF0D00},
            {0xF97316,0xFF0D00},{0xFF6B35,0xFF0D00},{0xFF3000,0xFF0D00},{0x92400E,0xFF0D00},
            {0xB45309,0xFF0D00},{0x7C2D12,0xFF0D00},{0x111111,0x5B00E6},
            // Yellow / gold / warm-white family -> approved yellow.
            {0xFFFF00,0xFFFF44},{0xFACC15,0xFFFF44},{0xF5D76E,0xFFFF44},{0xFBBF24,0xFFFF44},
            {0xF59E0B,0xFFFF44},{0xFDE68A,0xFFFF44},{0xF18900,0xFFFF44},{0xE44300,0xFFFF44},
            {0xFFDA7F,0xFFFF44},{0xFFF1C7,0xFFFF44},
            // Green / cyan / teal family -> approved green.
            {0x34C759,0x28FF00},{0x22C55E,0x28FF00},{0x16A34A,0x28FF00},{0x86EFAC,0x28FF00},
            {0x00FF00,0x28FF00},{0x2AD555,0x28FF00},{0x32D7D5,0x28FF00},{0x14B8A6,0x28FF00},
            {0x2DD4BF,0x28FF00},{0x00FFFF,0x28FF00},{0x00664D,0x28FF00},""",
          """  {0xFF2900,0xFF0D00},{0xFF6E00,0xFF0D00},
            {0x4DFF00,0x28FF00},{0x05008A,0x0D00FF},{0x23018C,0x5B00E6},
            {0xBF0005,0xFF0000},
            {0xFFFFFF,0xFFFFFA},{0x360500,0xFF0D00},{0x220200,0xFF0D00},{0x000000,0x5B00E6},
            // Red family -> approved red.
            {0xFF3B30,0xFF0000},{0xEF4444,0xFF0000},{0xDC2626,0xFF0000},{0xEF233C,0xFF0000},
            {0xFF1744,0xFF0000},{0xE11D48,0xFF0000},{0xFF020C,0xFF0000},
            // Orange / amber / brown family -> approved orange.
            {0xFF9500,0xFF0D00},{0xFF7A00,0xFF0D00},{0xF97316,0xFF0D00},{0xFF6B35,0xFF0D00},
            {0xFF3000,0xFF0D00},{0xF18900,0xFF0D00},{0xE44300,0xFF0D00},{0x92400E,0xFF0D00},
            {0xB45309,0xFF0D00},{0x7C2D12,0xFF0D00},{0x111111,0x5B00E6},
            // Yellow / gold / warm-white family -> approved yellow.
            {0xFFFF00,0xFFFF44},{0xFACC15,0xFFFF44},{0xF5D76E,0xFFFF44},{0xFBBF24,0xFFFF44},
            {0xF59E0B,0xFFFF44},{0xFDE68A,0xFFFF44},{0xFFDA7F,0xFFFF44},{0xFFF1C7,0xFFFF44},
            // Green family -> approved green.
            {0x34C759,0x28FF00},{0x22C55E,0x28FF00},{0x16A34A,0x28FF00},{0x86EFAC,0x28FF00},
            {0x00FF00,0x28FF00},{0x2AD555,0x28FF00},
            // Cyan / teal family -> approved cyan.
            {0x32D7D5,0x00BD4C},{0x14B8A6,0x00BD4C},{0x2DD4BF,0x00BD4C},{0x00FFFF,0x00BD4C},{0x00664D,0x00BD4C},""")
          # Keep pink aliases pink, but remove the duplicate red alias now handled above.
          s = s.replace("  {0xFF00FF,0xFF0024},{0xFF4D6D,0xFF0024},{0xFF2D55,0xFF0024},{0xFF69B4,0xFF0024},\n  {0xEC4899,0xFF0024},{0xFF2D92,0xFF0024},{0xF9A8D4,0xFF0024},{0xFF020C,0xFF0024},\n", "  {0xFF00FF,0xFF0024},{0xFF4D6D,0xFF0024},{0xFF2D55,0xFF0024},{0xFF69B4,0xFF0024},\n  {0xEC4899,0xFF0024},{0xFF2D92,0xFF0024},{0xF9A8D4,0xFF0024},\n")
          p.write_text(s)

          # Main web UI palette, aliases, and quick-color list.
          p = Path('firmware/web/index.html')
          s = p.read_text()
          old = """const NAMED_COLOR_PALETTE=[
            {name:'Orange',reference:'#FF0D00',output:'#FF0D00'},{name:'Pink',reference:'#FF0024',output:'#FF0024'},{name:'Yellow',reference:'#FFFF44',output:'#FFFF44'},
            {name:'Green',reference:'#28FF00',output:'#28FF00'},{name:'Blue',reference:'#0D00FF',output:'#0D00FF'},{name:'Purple',reference:'#5B00E6',output:'#5B00E6'}
          ];"""
          new = """const NAMED_COLOR_PALETTE=[
            {name:'Red',reference:'#FF0000',output:'#FF0000'},{name:'Orange',reference:'#FF0D00',output:'#FF0D00'},{name:'Pink',reference:'#FF0024',output:'#FF0024'},
            {name:'Yellow',reference:'#FFFF44',output:'#FFFF44'},{name:'Green',reference:'#28FF00',output:'#28FF00'},{name:'Cyan',reference:'#00BD4C',output:'#00BD4C'},
            {name:'Blue',reference:'#0D00FF',output:'#0D00FF'},{name:'Purple',reference:'#5B00E6',output:'#5B00E6'},{name:'White',reference:'#FFFFFA',output:'#FFFFFA'}
          ];"""
          if old not in s: raise SystemExit('NAMED_COLOR_PALETTE block not found')
          s = s.replace(old,new)
          old = "const REFERENCE_LED={'#FF0D00':'#FF0D00','#FF0024':'#FF0024','#FFFF44':'#FFFF44','#28FF00':'#28FF00','#0D00FF':'#0D00FF','#5B00E6':'#5B00E6','#FF0000':'#FF0D00','#FF9500':'#FF0D00','#FFFF00':'#FFFF44','#22C55E':'#28FF00','#2563EB':'#0D00FF','#7E22CE':'#5B00E6','#FF69B4':'#FF0024'};"
          new = "const REFERENCE_LED={'#FF0000':'#FF0000','#FF0D00':'#FF0D00','#FF0024':'#FF0024','#FFFF44':'#FFFF44','#28FF00':'#28FF00','#00BD4C':'#00BD4C','#0D00FF':'#0D00FF','#5B00E6':'#5B00E6','#FFFFFA':'#FFFFFA','#FF9500':'#FF0D00','#FFFF00':'#FFFF44','#22C55E':'#28FF00','#00FFFF':'#00BD4C','#2563EB':'#0D00FF','#7E22CE':'#5B00E6','#FF69B4':'#FF0024','#FFFFFF':'#FFFFFA'};"
          if old not in s: raise SystemExit('REFERENCE_LED line not found')
          s = s.replace(old,new)
          old = "const EXPLICIT_LED={'#FF3B30':'#FF0D00','#EF4444':'#FF0D00','#DC2626':'#FF0D00','#EF233C':'#FF0D00','#FF1744':'#FF0D00','#E11D48':'#FF0D00','#FF2900':'#FF0D00','#FF3000':'#FF0D00','#FF7A00':'#FF0D00','#F97316':'#FF0D00','#FF6B35':'#FF0D00','#92400E':'#FF0D00','#360500':'#FF0D00','#220200':'#FF0D00','#FF6E00':'#FFFF44','#F18900':'#FFFF44','#E44300':'#FFFF44','#FFDA7F':'#FFFF44','#FFF1C7':'#FFFF44','#FACC15':'#FFFF44','#F59E0B':'#FFFF44','#FFFFFF':'#FFFF44','#4DFF00':'#28FF00','#00FF00':'#28FF00','#2AD555':'#28FF00','#34C759':'#28FF00','#16A34A':'#28FF00','#00BD4C':'#28FF00','#00FFFF':'#28FF00','#00664D':'#28FF00','#05008A':'#0D00FF','#0000FF':'#0D00FF','#004BC6':'#0D00FF','#377CF9':'#0D00FF','#A7C8FC':'#0D00FF','#0A84FF':'#0D00FF','#3B82F6':'#0D00FF','#23018C':'#5B00E6','#7A62F9':'#5B00E6','#C4B5FD':'#5B00E6','#000000':'#5B00E6','#BF0005':'#FF0024','#FF020C':'#FF0024','#FF1560':'#FF0024','#EF4F98':'#FF0024','#FF00FF':'#FF0024','#FF2D55':'#FF0024','#F9A8D4':'#FF0024'};"
          new = "const EXPLICIT_LED={'#FF3B30':'#FF0000','#EF4444':'#FF0000','#DC2626':'#FF0000','#EF233C':'#FF0000','#FF1744':'#FF0000','#E11D48':'#FF0000','#BF0005':'#FF0000','#FF020C':'#FF0000','#FF2900':'#FF0D00','#FF3000':'#FF0D00','#FF7A00':'#FF0D00','#F97316':'#FF0D00','#FF6B35':'#FF0D00','#FF6E00':'#FF0D00','#F18900':'#FF0D00','#E44300':'#FF0D00','#92400E':'#FF0D00','#360500':'#FF0D00','#220200':'#FF0D00','#FFDA7F':'#FFFF44','#FFF1C7':'#FFFF44','#FACC15':'#FFFF44','#F59E0B':'#FFFF44','#FFFFFF':'#FFFFFA','#4DFF00':'#28FF00','#00FF00':'#28FF00','#2AD555':'#28FF00','#34C759':'#28FF00','#16A34A':'#28FF00','#00BD4C':'#00BD4C','#00FFFF':'#00BD4C','#00664D':'#00BD4C','#14B8A6':'#00BD4C','#2DD4BF':'#00BD4C','#32D7D5':'#00BD4C','#05008A':'#0D00FF','#0000FF':'#0D00FF','#004BC6':'#0D00FF','#377CF9':'#0D00FF','#A7C8FC':'#0D00FF','#0A84FF':'#0D00FF','#3B82F6':'#0D00FF','#23018C':'#5B00E6','#7A62F9':'#5B00E6','#C4B5FD':'#5B00E6','#000000':'#5B00E6','#FF1560':'#FF0024','#EF4F98':'#FF0024','#FF00FF':'#FF0024','#FF2D55':'#FF0024','#F9A8D4':'#FF0024'};"
          if old not in s: raise SystemExit('EXPLICIT_LED line not found')
          s = s.replace(old,new)
          old = "const LEGACY_DISPLAY={'#FF0000':'#FF0D00','#FF2900':'#FF0D00','#FF6E00':'#FFFF44','#4DFF00':'#28FF00','#00BD4C':'#28FF00','#05008A':'#0D00FF','#23018C':'#5B00E6','#BF0005':'#FF0024','#FFFFFF':'#FFFF44','#360500':'#FF0D00','#220200':'#FF0D00','#000000':'#5B00E6'};"
          new = "const LEGACY_DISPLAY={'#FF0000':'#FF0000','#FF2900':'#FF0D00','#FF6E00':'#FF0D00','#4DFF00':'#28FF00','#00BD4C':'#00BD4C','#05008A':'#0D00FF','#23018C':'#5B00E6','#BF0005':'#FF0000','#FFFFFF':'#FFFFFA','#360500':'#FF0D00','#220200':'#FF0D00','#000000':'#5B00E6'};"
          if old not in s: raise SystemExit('LEGACY_DISPLAY line not found')
          s = s.replace(old,new)
          s = s.replace("const suggestions=['#FF0D00','#FF0024','#FFFF44','#28FF00','#0D00FF','#5B00E6'];", "const suggestions=['#FF0000','#FF0D00','#FF0024','#FFFF44','#28FF00','#00BD4C','#0D00FF','#5B00E6','#FFFFFA'];")
          s = s.replace("const quick=['#FF0D00','#FF0024','#FFFF44','#28FF00','#0D00FF','#5B00E6'];", "const quick=['#FF0000','#FF0D00','#FF0024','#FFFF44','#28FF00','#00BD4C','#0D00FF','#5B00E6','#FFFFFA'];")
          p.write_text(s)

          # V3 dashboard fallback Favorite/Quick Colors.
          p = Path('firmware/web/v3_mockup.js')
          s = p.read_text()
          s = s.replace("const openColors=()=> { const chip=el('button',''); chip.dataset.color='#004BC6'; openRgbWheel(chip); };", "const openColors=()=> { const chip=el('button',''); chip.dataset.color='#0D00FF'; openRgbWheel(chip); };")
          old = "['#FF0000','#FF3000','#FFFF00','#00FF00','#00FFFF','#0000FF','#23018C','#FF00FF'].forEach(c=>{"
          new = "['#FF0000','#FF0D00','#FF0024','#FFFF44','#28FF00','#00BD4C','#0D00FF','#5B00E6','#FFFFFA'].forEach(c=>{"
          if old not in s: raise SystemExit('v3 quick-color fallback not found')
          s = s.replace(old,new)
          p.write_text(s)

          # Guardrails: exact user palette must be present in both backend and UI.
          expected = ['FF0000','FF0D00','FF0024','FFFF44','28FF00','00BD4C','0D00FF','5B00E6','FFFFFA']
          backend = Path('firmware/src/ColorCorrection.cpp').read_text()
          web = Path('firmware/web/index.html').read_text()
          for h in expected:
              assert ('0x'+h) in backend, h
              assert ('#'+h) in web, h
          assert "{0xFF0000,0xFF0D00}" not in backend
          assert "{0x00BD4C,0x28FF00}" not in backend
          assert "'#FF0000':'#FF0D00'" not in web
          assert "'#00BD4C':'#28FF00'" not in web
          PY
      - name: Commit staged source only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage-palette-source.yml
          git add firmware/src/ColorCorrection.cpp firmware/web/index.html firmware/web/v3_mockup.js
          git commit -m "Stage nine-color calibrated palette for next Anderson release"
          git push origin HEAD:staging/palette-holiday-update
