name: JH2 Nano 2.0.8 OTA Repair Build Sign Publish Oracle
on:
  push:
    branches:
      - fix/jh2-2.0.7-oracle-root-ble-reconnect-20261025
    paths:
      - JasonHome2NanoC6_IDF/**
      - .github/workflows/jh2-207-repair-build-sign-stage.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jh2-208-signed-repair
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Check narrow regression patches and secure recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          w=Path('JasonHome2NanoC6_IDF/main/web_recovery.c').read_text()
          b=Path('JasonHome2NanoC6_IDF/main/main.c').read_text()
          c=Path('JasonHome2NanoC6_IDF/main/bridge.c').read_text()
          p=Path('JasonHome2NanoC6_IDF/partitions.csv').read_text()
          assert 'if(strcmp(r->uri,"/")==0 && home_lan_request(r))' in w
          assert 'httpd_resp_set_hdr(r,"Location","http://150.136.245.51/jason");' in w
          assert 'jh2_bridge_autolink_verified() && jh2_bridge_ready()' not in w.split('static esp_err_t html_get(',1)[1].split('static bool unescape',1)[0]
          assert 'const bool nano_settings=strcmp(r->uri,"/settings/nano")==0;' in w
          assert 'const bool oracle_settings=strcmp(r->uri,"/settings/oracle")==0;' in w
          assert 'cfg.ap.authmode=WIFI_AUTH_OPEN' in w and 'JH2-Nano-Fresh' in w
          assert 'if(!selected && !named)return 0;' in b
          assert 'BLE_FULL_SCAN_COMPLETE found=%u; reconnect resumed' in b
          assert 'ble_last_connect_error=event->connect.status;' in b
          assert 'ble_last_scan_cancel_error=cancel_rc;' in b
          assert 'ble_service_tick();' in b and 'schedule_ble_retry("disconnected")' in b
          assert 'BLE_HS_FOREVER' not in b and 'ble_gap_set_prefered_le_phy(' not in b
          assert 'nativeLastConnectError' in b and 'nativeLastScanCancelError' in b
          assert '#define NATIVE_FW_VERSION "2.0.8"' in c
          ota=Path('JasonHome2NanoC6_IDF/main/signed_ota.c').read_text()
          assert 'jh2_ota_stage_signed_via_oracle' in ota
          assert 'lastHttpStatus' in ota and 'lastEspError' in ota
          assert 'ctx.downloaded==candidate->bytes' in ota
          assert 'strcasecmp(computed,candidate->sha)==0' in ota
          assert 'esp_ota_get_next_update_partition' in ota
          assert 'firmware_check_task' in w
          assert 'fw_check_busy' in w
          assert 'jh2_ota_install_staged(error,sizeof(error))' in w
          assert 'cJSON *firmware_status=cJSON_AddObjectToObject(status,"signedOta");' in c
          assert 'runtime, app, ota_0, 0x110000, 0x160000' in p
          assert 'runtime_b, app, ota_1, 0x270000, 0x160000' in p
          assert 'rescue, app, factory, 0x10000, 0x100000' in p
          print('JH2_208_SOURCE_REGRESSION_CHECKS_PASSED')
          PY
      - name: Enable production BLE Oracle and browser recovery
        shell: bash
        run: |
          cat >> JasonHome2NanoC6_IDF/sdkconfig.defaults <<'EOF'
          CONFIG_JH2_NATIVE_ENABLE_ORACLE=y
          CONFIG_JH2_NATIVE_BROWSER_OTA_COMPAT=y
          CONFIG_JH2_NATIVE_READONLY_ACCEPTANCE=n
          EOF
      - name: Compile A/B Nano C6 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32c6
          path: JasonHome2NanoC6_IDF
          command: idf.py build
      - name: Validate OTA image, no secrets, and pin source commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-package
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          data=Path('JasonHome2NanoC6_IDF/build/jh2_native_ble_probe.bin').read_bytes()
          assert 0x100000 < len(data) <= 0x160000 and data[0]==0xe9, 'Invalid A/B runtime image'
          assert b'2.0.8-native-upload-flow' in data
          assert b'http://150.136.245.51/jason' in data
          marker=b'JH2V200PRIVATEORACLETOKENREPLACEME'.ljust(64,b'_')
          assert data.count(marker)==1, 'Only unpersonalized runtime may be publicly signed'
          sha=hashlib.sha256(data).hexdigest()
          root=Path('signed-package')
          (root/'jh2-runtime-2.0.8.bin').write_bytes(data)
          manifest={'product':'jason-home-2-nanoc6','version':'2.0.8',
                    'commit':os.environ['GITHUB_SHA'],
                    'files':{'jh2-runtime-2.0.8.bin':{'bytes':len(data),'sha256':sha}}}
          (root/'release.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('JH2_208_RUNTIME_VERIFIED',len(data),sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-2.0.8-COMPILED
          path: signed-package/
          if-no-files-found: error
          retention-days: 45
  sign-publish:
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JH2-2.0.8-COMPILED
          path: signed-package
      - name: Sign manifest with existing protected project key
        shell: bash
        env:
          OTA_SIGNING_KEY_B64: ${{ secrets.ANDERSON_OTA_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$OTA_SIGNING_KEY_B64"
          key="$RUNNER_TEMP/jh2-sign-private.pem"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          printf '%s' "$OTA_SIGNING_KEY_B64" | base64 -d > "$key"
          chmod 600 "$key"
          python3 JasonHome2NanoC6/tools/sign_manifest.py --key "$key" --release signed-package/release.json --output signed-package/latest.json
      - name: Verify ECDSA and immutable SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,subprocess,tempfile
          from pathlib import Path
          root=Path('signed-package')
          release=json.loads((root/'release.json').read_text())
          m=json.loads((root/'latest.json').read_text())
          fields=dict(row.split('=',1) for row in m['payload'].strip().splitlines())
          data=(root/'jh2-runtime-2.0.8.bin').read_bytes()
          assert fields['version']=='2.0.8' and fields['product']=='jason-home-2-nanoc6'
          assert fields['sha256']==hashlib.sha256(data).hexdigest()
          assert len(data)==int(fields['bytes'])
          assert fields['commit']==release['commit']
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)
              (p/'payload').write_text(m['payload'])
              (p/'signature').write_bytes(base64.b64decode(m['signature']))
              subprocess.run(['openssl','dgst','-sha256','-verify',
                 'remote-update/anderson_ota_signing_public.pem',
                 '-signature',str(p/'signature'),str(p/'payload')],check=True)
          print('SIGNED_208_SHA_ECDSA_VERIFIED')
          PY
      - name: Publish 2.0.8 runtime-only release without touching 2.0.6
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='jason-home-2-nanoc6-v2.0.8'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite existing immutable 2.0.8 release';exit 1
          fi
          gh release create "$tag" signed-package/jh2-runtime-2.0.8.bin signed-package/latest.json signed-package/release.json             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title 'Jason Home 2 Nano C6 2.0.8 Oracle Launch + BLE Reconnect Repair'             --notes 'Signed A/B runtime 2.0.8. Nonblocking firmware UI checks, HTTPS Oracle signed mirror with strict SHA256+ECDSA validation and GitHub fallback; OTA error telemetry; BLE reconnection and Oracle homepage redirect. Hardware acceptance pending.'
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'jh2-runtime-2.0.8.bin'
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-2.0.8-SIGNED-RELEASE
          path: signed-package/
          retention-days: 45
          if-no-files-found: error
  stage-oracle:
    needs: sign-publish
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JH2-2.0.8-SIGNED-RELEASE
          path: signed-package
      - name: Verify signed runtime and atomically approve 2.0.8 on Oracle
        shell: bash
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo -n --preserve-env=GITHUB_WORKSPACE python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,tempfile,shutil
          from pathlib import Path
          repo=Path(os.environ['GITHUB_WORKSPACE'])
          work=repo/'signed-package'
          files=('jh2-runtime-2.0.8.bin','latest.json','release.json')
          m=json.loads((work/'latest.json').read_text())
          f=dict(row.split('=',1) for row in m['payload'].strip().splitlines())
          image=(work/files[0]).read_bytes()
          assert f['product']=='jason-home-2-nanoc6' and f['version']=='2.0.8'
          assert 0x100000<len(image)<=0x160000 and image[0]==0xe9
          assert f['sha256']==hashlib.sha256(image).hexdigest() and int(f['bytes'])==len(image)
          with tempfile.TemporaryDirectory() as tmp:
              p=Path(tmp)
              (p/'payload').write_text(m['payload'])
              (p/'signature').write_bytes(base64.b64decode(m['signature']))
              subprocess.run(['openssl','dgst','-sha256','-verify',
                str(repo/'remote-update/anderson_ota_signing_public.pem'),
                '-signature',str(p/'signature'),str(p/'payload')],check=True)
          inspect=json.loads(subprocess.check_output(['docker','inspect','jason-home-2-web'],text=True))[0]
          mounts=[x for x in inspect['Mounts'] if x['Destination']=='/data' and x['Type']=='bind']
          assert len(mounts)==1
          root=Path(mounts[0]['Source'])/'signed-ota'
          assert root.is_dir()
          dest=root/'2.0.8'
          if dest.exists():
              assert all((dest/x).read_bytes()==(work/x).read_bytes() for x in files)
          else:
              tmp=root/('.stage-2.0.8-'+str(os.getpid()))
              tmp.mkdir()
              for x in files:shutil.copy2(work/x,tmp/x)
              tmp.rename(dest)
          approved=root/'approved'
          if approved.exists() or approved.is_symlink():
              prev=json.loads((approved/'latest.json').read_text())
              ver=dict(x.split('=',1) for x in prev['payload'].strip().splitlines())['version']
              assert tuple(map(int,ver.split('.'))) <= (2,0,7)
          link=root/('.approved-2.0.8-'+str(os.getpid()))
          link.symlink_to('2.0.8',target_is_directory=True)
          os.replace(link,approved)
          assert all((approved/x).read_bytes()==(work/x).read_bytes() for x in files)
          print('ORACLE_APPROVED_SIGNED_208',len(image),f['sha256'])
          PY
      - name: Verify Oracle application serves exact signed 2.0.8
        shell: bash
        run: |
          set -euo pipefail
          sudo -n docker exec jason-home-2-web node -e '
          (async()=>{
          const base="http://127.0.0.1:"+(process.env.JH2_PORT||8081);
          const r=await fetch(base+"/api/curtain/firmware-manifest");
          const m=await r.json();
          const f=Object.fromEntries(m.payload.trim().split("\n").map(x=>x.split(/=(.*)/s).slice(0,2)));
          if(!r.ok||f.version!=="2.0.8")throw Error("Wrong OTA manifest");
          const d=await fetch(base+"/api/curtain/firmware-runtime/2.0.8.bin");
          const b=Buffer.from(await d.arrayBuffer());
          if(!d.ok||b.length!==Number(f.bytes)||require("node:crypto").createHash("sha256").update(b).digest("hex")!==f.sha256)throw Error("Wrong OTA bytes");
          console.log("ORACLE_208_SIGNED_DOWNLOAD_VERIFIED",b.length);
          })().catch(e=>{console.error(e);process.exitCode=1});'
