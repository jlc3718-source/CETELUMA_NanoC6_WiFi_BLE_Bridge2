name: One-time bump Anderson native firmware to v4.0.2

on:
  push:
    branches: ['work/v4.0.0-native-idf']

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.0.0-native-idf
          fetch-depth: 0
      - name: Bump exact firmware version markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = "4.0.1"
          printf '4.0.2\n' > FIRMWARE_VERSION.txt
          perl -0pi -e 's/static constexpr const char\* ANDERSON_FIRMWARE_VERSION="4\.0\.1";/static constexpr const char* ANDERSON_FIRMWARE_VERSION="4.0.2";/' firmware/src/main.cpp
          perl -0pi -e 's/CONFIG_APP_PROJECT_VER="4\.0\.1"/CONFIG_APP_PROJECT_VER="4.0.2"/' firmware/sdkconfig.defaults
          if [ -f README.md ]; then perl -0pi -e 's/\*\*v4\.0\.1\*\*/**v4.0.2**/g' README.md; fi
          grep -Fx 'static constexpr const char* ANDERSON_FIRMWARE_VERSION="4.0.2";' firmware/src/main.cpp
          grep -Fx 'CONFIG_APP_PROJECT_VER="4.0.2"' firmware/sdkconfig.defaults
          ! grep -Fq 'ANDERSON_FIRMWARE_VERSION="4.0.1"' firmware/src/main.cpp
          ! grep -Fq 'CONFIG_APP_PROJECT_VER="4.0.1"' firmware/sdkconfig.defaults
      - name: Commit v4.0.2 version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FIRMWARE_VERSION.txt firmware/src/main.cpp firmware/sdkconfig.defaults README.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No version changes staged'; exit 1; }
          git commit -m 'Advance Anderson native firmware to v4.0.2'
          git push origin HEAD:refs/heads/work/v4.0.0-native-idf
