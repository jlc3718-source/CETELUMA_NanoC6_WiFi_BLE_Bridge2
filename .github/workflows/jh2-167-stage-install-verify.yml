name: JH2 Nano 1.1.67 verified artifact staging retry
on:
  push:
    branches: [release/jh2-nano-status-forward-167-20261022]
    paths: [.github/workflows/jh2-167-stage-install-verify.yml]
permissions: {contents: read, actions: read}
concurrency:
  group: jh2-production-signed-ota-singleton
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 39817561848
          github-token: ${{ github.token }}
          name: JH2-1.1.67-FINAL-SIGNED-OTA
          path: signed-package
      - name: Validate ECDSA signature and image digest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,subprocess,tempfile
          d=Path('signed-package')
          m=json.loads((d/'latest.json').read_text())
          meta=json.loads((d/'release.json').read_text())
          fields=dict(x.split('=',1) for x in m['payload'].strip().splitlines())
          image=(d/'jh2-runtime-1.1.67.bin').read_bytes()
          checksum=hashlib.sha256(image).hexdigest()
          assert fields['version']==meta['version']=='1.1.67'
          assert fields['commit']==meta['commit']
          assert checksum==fields['sha256']==meta['files']['jh2-runtime-1.1.67.bin']['sha256']
          assert len(image)==int(fields['bytes'])
          with tempfile.TemporaryDirectory() as root:
              p=Path(root)
              (p/'payload').write_text(m['payload'])
              (p/'sig').write_bytes(base64.b64decode(m['signature'],validate=True))
              subprocess.run(['openssl','dgst','-sha256','-verify','remote-update/anderson_ota_signing_public.pem','-signature',str(p/'sig'),str(p/'payload')],check=True)
          print('SIGNED_167_VERIFIED',len(image),checksum)
          PY
      - name: Copy only signed assets into dedicated Oracle persistent volume
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          sudo -n --preserve-env=GITHUB_WORKSPACE python3 - <<'PY'
          from pathlib import Path
          import json,os,subprocess,shutil
          pkg=Path(os.environ['GITHUB_WORKSPACE'])/'signed-package'
          info=json.loads(subprocess.check_output(['docker','inspect','jason-home-2-web'],text=True))[0]
          mount=next(x for x in info['Mounts'] if x['Destination']=='/data' and x['Type']=='bind')
          base=Path(mount['Source'])/'signed-ota'
          target=base/'1.1.67'
          files=['jh2-runtime-1.1.67.bin','latest.json','release.json']
          base.mkdir(parents=True,exist_ok=True)
          if target.exists():
              assert all((target/f).read_bytes()==(pkg/f).read_bytes() for f in files)
              print('SIGNED_167_ASSETS_ALREADY_STAGED')
          else:
              temp=base/'1.1.67.staging'
              assert not temp.exists()
              temp.mkdir()
              try:
                  for f in files:shutil.copy2(pkg/f,temp/f)
                  temp.rename(target)
              except:
                  shutil.rmtree(temp)
                  raise
              print('SIGNED_167_ASSETS_STAGED; NO OTA SENT')
          PY
      - name: Install and verify physical Nano signed 1.1.67 without repeating an automatic OTA
        run: |
          sudo -n python3 .github/scripts/jh2-install-signed-167-on-oracle.py
      - name: Verify fresh SmartDawn 2103 power is identical in Nano and Oracle
        run: |
          sudo -n python3 - <<'PY'
          import json,time,subprocess,urllib.request
          info=json.loads(subprocess.check_output(['docker','inspect','jason-home'],text=True))[0]
          env=dict(e.split('=',1) for e in info['Config']['Env'] if '=' in e)
          base='http://127.0.0.1:8081'
          def api(path,cookie='',body=None):
              data=json.dumps(body).encode() if body is not None else None
              headers={'content-type':'application/json'}
              if cookie:headers['Cookie']=cookie
              req=urllib.request.Request(base+path,data=data,headers=headers,method='POST' if data is not None else 'GET')
              with urllib.request.urlopen(req,timeout=20) as response:return json.load(response),response.headers
          _,headers=api('/api/session',body={'token':env['JASON_HOME_API_TOKEN']})
          cookie=headers['Set-Cookie'].split(';')[0]
          assert cookie.startswith('jh2=')
          def read():
              st,_=api('/api/curtain/status',cookie)
              return st
          def valid(st):
              n=st.get('nanoControllerPower') or {}
              p=st.get('controllerPower') or {}
              raw=st.get('curtain') or {}
              return st.get('firmware')=='1.1.67' and st.get('online') is True and raw.get('connected') is True and \
                  isinstance(n.get('on'),bool) and n.get('opcode') in (2103,2105) and n.get('state')=='last-reported' and 0<=float(n.get('ageMs') or 1e9)<=60000 and \
                  p.get('known') is True and isinstance(p.get('on'),bool) and p.get('on')==n.get('on') and p.get('opcode') in (2103,2105)
          def check(seconds):
              for i in range(seconds):
                  st=read()
                  if valid(st):
                      print('END_TO_END_NANO_ORACLE_POWER_VERIFIED',json.dumps({
                        'firmware':st['firmware'],'power':st['controllerPower'].get('on'),
                        'nanoOpcode':st['nanoControllerPower'].get('opcode'),'oracleOpcode':st['controllerPower'].get('opcode'),
                        'nativePowerId':st['nanoControllerPower'].get('noticeId'),'oracleNoticeId':st['controllerPower'].get('noticeId'),
                        'raw2103':st['curtain'].get('nativeRawPower2103Seen'),
                        'nativePlayback':st.get('nanoControllerPlayback'),'oraclePlayback':st.get('controllerPlayback'),
                        'connected':True},sort_keys=True,default=str),flush=True)
                      return True
                  if i%10==0:print('WAITING_FOR_FRESH_POWER',json.dumps({
                    'version':st.get('firmware'),'native':st.get('nanoControllerPower'),'oracle':st.get('controllerPower'),
                    'raw2103':(st.get('curtain') or {}).get('nativeRawPower2103Seen')},sort_keys=True,default=str),flush=True)
                  time.sleep(1)
              return False
          if check(35):raise SystemExit(0)
          st=read()
          if int(st.get('queued') or 0)>0 or not st.get('curtain',{}).get('connected'):
              raise RuntimeError('Nano busy or BLE offline; no reconnect sent')
          result,_=api('/api/curtain/power-reconnect',cookie,{})
          print('BOUNDED_STATUS_RECONNECT',json.dumps(result,sort_keys=True),flush=True)
          if not result.get('requested'):raise RuntimeError('Cannot safely request fresh controller power: '+str(result.get('reason')))
          if check(80):raise SystemExit(0)
          raise RuntimeError('Read-only SmartDawn 2103 still not confirmed by both Nano and Oracle')
          PY
