name: JH2 Curtain Single Read-Only Catalog Diagnostic
on:
  push:
    branches: [codex/jh2-70k-buffers-studio-simplify-20261016]
    paths: ['.github/workflows/jh2-inventory-notification-forensics-once.yml']
permissions: {contents: read}
concurrency:
  group: jason-home-oracle-production
  cancel-in-progress: false
jobs:
  inspect:
    name: One native 205-167-2904 read and exact Oracle notice audit
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 4
    steps:
      - name: Read-only native catalog protocol; no delete, upload, or play
        shell: bash
        run: |
          sudo -n python3 - <<'PY'
          import json,time,base64,subprocess,urllib.request,uuid
          info=json.loads(subprocess.check_output(['docker','inspect','jason-home']))[0]
          token=dict(v.split('=',1) for v in info['Config']['Env'] if '=' in v)['JASON_HOME_API_TOKEN']
          host='http://127.0.0.1:8081'
          def api(path,body=None,cookie=''):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(host+path,data=data,
                headers={'content-type':'application/json',**({'Cookie':cookie} if cookie else {})},
                method='POST' if data is not None else 'GET')
              with urllib.request.urlopen(req,timeout=12) as f:return json.load(f),f.headers
          _,headers=api('/api/session',{'token':token})
          cookie=headers.get('Set-Cookie','').split(';')[0]
          status,_=api('/api/curtain/status',cookie=cookie)
          curtain=status.get('curtain') or {}
          safe={'online':status.get('online'),'connected':curtain.get('connected'),'mtu':curtain.get('mtu'),
                'autoUpdate':status.get('autoUpdate'),'uptime':status.get('uptimeSeconds'),
                'queued':status.get('queued'),'streaming':status.get('relayStreaming')}
          print('BEFORE',safe,flush=True)
          assert safe['online'] is True and safe['connected'] is True and (safe['mtu'] or 0)>=399, 'No BLE read allowed when disconnected or MTU too small'
          assert safe['autoUpdate'] is False and (safe['uptime'] or 0)>=80 and safe['queued']==0, 'Nano reboot/queue still unstable'
          assert not safe['streaming'],'Do not interrupt an active stream'
          old,_=api('/api/curtain/notifications?since=0',cookie=cookie)
          cursor=max([n['id'] for n in old.get('notifications',[])] or [0])
          print('CURSOR_BEFORE',cursor,flush=True)
          uuid_write='01020074-1972-1925-3022-077119514e44'
          def frame(op,identifier):
              p=bytearray(20);p[0]=240;p[1]=4;p[2]=identifier>>8;p[3]=identifier&255;p[6]=op>>8;p[7]=op&255
              return bytes([identifier&255,1,0,0])+bytes(p)
          for idx,op in enumerate([205,167,2904],start=10):
              payload={'uuid':uuid_write,'data':base64.b64encode(frame(op,idx)).decode()}
              queued,_=api('/api/curtain/call',{'action':'rawWrite','payload':payload,'idempotencyKey':'jhc-catalog-single-read-20261017-'+str(op)},cookie=cookie)
              ident=queued['commandId'];deadline=time.monotonic()+45
              while time.monotonic()<deadline:
                  command,_=api('/api/curtain/command?id='+str(ident),cookie=cookie)
                  row=command['command']
                  if row['state'] in ('applied','superseded','expired','failed'):break
                  time.sleep(.6)
              else:raise RuntimeError('Timed out waiting for read command '+str(ident))
              print('READ_WRITE_ACK',{'op':op,'id':ident,'state':row['state'],
                'bleTransmitted':(row.get('result') or {}).get('bleTransmitted')},flush=True)
              assert row['state']=='applied' and (row.get('result') or {}).get('bleTransmitted') is True,'BLE read command not applied; stop without retrying'
          time.sleep(13)
          data,_=api('/api/curtain/notifications?since='+str(cursor),cookie=cookie)
          notices=data.get('notifications',[])
          print('NEW_NOTICES',len(notices),'ID_RANGE',([notices[0]['id'],notices[-1]['id']] if notices else []),flush=True)
          gaps=[(a['id'],b['id']) for a,b in zip(notices,notices[1:]) if b['id']>a['id']+1]
          print('NOTICE_GAPS',gaps,flush=True)
          reports=[];counts={}
          for n in notices:
              try:
                  raw=base64.b64decode(n['data'],validate=True)
                  if len(raw)<24 or raw[3]!=0:continue
                  if raw[1]!=1:continue
                  ddp=raw[4:]
                  if ddp[0] not in (240,241):continue
                  op=int.from_bytes(ddp[6:8],'big');counts[op]=counts.get(op,0)+1
                  if op==2904:
                      reports.append({'id':n['id'],'msg':raw[0],'size':len(ddp),'payloadBytes':len(ddp)-20,'header':ddp[:8].hex()})
              except Exception as e:
                  print('PACKET_PARSE_ERROR',n.get('id'),type(e).__name__,flush=True)
          print('OPCODE_COUNTS',counts,flush=True)
          print('2904_ORACLE_PACKETS',reports,flush=True)
          print('AFTER',{'bootUptime':api('/api/curtain/status',cookie=cookie)[0].get('uptimeSeconds')},flush=True)
          PY
