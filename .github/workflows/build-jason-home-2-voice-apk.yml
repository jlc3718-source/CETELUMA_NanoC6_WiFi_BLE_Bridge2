name: Build Jason Home 2 Voice APK

on:
  push:
    branches: [jason-home-2-web]
    paths:
      - 'JasonHome2Android/**'
      - '.github/workflows/build-jason-home-2-voice-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build aligned unsigned Jason Home 2 APK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BT="$SDK/build-tools/35.0.0"
          JAR="$SDK/platforms/android-35/android.jar"
          OUT="$PWD/JasonHome2Android/build"
          rm -rf "$OUT"
          mkdir -p "$OUT/classes" "$OUT/dex"

          "$BT/aapt2" link -o "$OUT/unsigned.apk" -I "$JAR" --manifest JasonHome2Android/AndroidManifest.xml --min-sdk-version 26 --target-sdk-version 35

          javac --release 17 -cp "$JAR" -d "$OUT/classes" JasonHome2Android/src/com/jasonhome2/app/MainActivity.java

          "$BT/d8" --min-api 26 --lib "$JAR" --output "$OUT/dex" "$OUT/classes/com/jasonhome2/app/"*.class

          cp "$OUT/unsigned.apk" "$OUT/with-dex.apk"
          (cd "$OUT/dex" && zip -q -u "$OUT/with-dex.apk" classes.dex)
          "$BT/zipalign" -f 4 "$OUT/with-dex.apk" "$OUT/aligned.apk"
          cp "$OUT/aligned.apk" Jason-Home-2-2.0.2-VOICE-UNSIGNED.apk

          "$BT/aapt2" dump badging Jason-Home-2-2.0.2-VOICE-UNSIGNED.apk | grep -E "package:|uses-permission.*RECORD_AUDIO"
          sha256sum Jason-Home-2-2.0.2-VOICE-UNSIGNED.apk

          tar -czf android-build-tools-35.tar.gz -C "$SDK/build-tools" 35.0.0

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Jason-Home-2-2.0.2-VOICE-UNSIGNED
          path: Jason-Home-2-2.0.2-VOICE-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Jason-Home-2-Android-Build-Tools-35
          path: android-build-tools-35.tar.gz
          if-no-files-found: error
          retention-days: 7


  sign:
    name: Sign Jason Home 2 Voice APK
    needs: build
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Set up Java 17 for apksigner
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: Jason-Home-2-2.0.2-VOICE-UNSIGNED
          path: sign-work

      - name: Download Android signing tools
        uses: actions/download-artifact@v4
        with:
          name: Jason-Home-2-Android-Build-Tools-35
          path: sign-tools

      - name: Verify permanent Jason Home signing identity is present
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE=/home/ubuntu/.jason-home-signing/jason-home-release.jks
          PASSFILE=/home/ubuntu/.jason-home-signing/password
          test -s "$KEYSTORE"
          test -s "$PASSFILE"
          PASS="$(cat "$PASSFILE")"
          FINGERPRINT="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$PASS" -alias jason-home | sed -n 's/.*SHA256: //p' | head -1 | tr '[:lower:]' '[:upper:]')"
          test "$FINGERPRINT" = "76:B2:8E:FD:4F:5D:13:2A:D3:04:8F:19:BA:E6:C3:5A:A5:F8:4C:4A:39:0E:98:C8:0D:EE:EB:C0:C3:E7:3A:E1"
          echo "Permanent Jason Home signer verified: $FINGERPRINT"

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf sign-tools/android-build-tools-35.tar.gz -C sign-tools
          APKSIGNER="$(find sign-tools -type f -name apksigner | head -1)"
          test -n "$APKSIGNER"
          chmod +x "$APKSIGNER"

          KEYSTORE=/home/ubuntu/.jason-home-signing/jason-home-release.jks
          PASS="$(cat /home/ubuntu/.jason-home-signing/password)"
          IN="sign-work/Jason-Home-2-2.0.2-VOICE-UNSIGNED.apk"
          OUT="Jason-Home-2-2.0.2-VOICE-SIGNED.apk"

          test -s "$IN"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias jason-home --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$OUT" "$IN"

          VERIFY="$("$APKSIGNER" verify --verbose --print-certs "$OUT")"
          printf '%s\n' "$VERIFY"
          printf '%s\n' "$VERIFY" | grep -qi 'Signer #1 certificate SHA-256 digest: 76b28efd4f5d132ad3048f19bae6c35aa5f84c4a390e98c80deeebc0c3e73ae1'
          sha256sum "$OUT"

      - name: Upload signed installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Jason-Home-2-2.0.2-VOICE-SIGNED
          path: Jason-Home-2-2.0.2-VOICE-SIGNED.apk
          if-no-files-found: error
          retention-days: 14
