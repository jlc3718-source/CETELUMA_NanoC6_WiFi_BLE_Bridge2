name: JH2 Nano 2.0.20 guarded coexistence OTA and live BLE priority test
on:
  push:
    branches: [feature/jh2-nano-ble-coex-2-0-20-20261109]
    paths: ['.github/workflows/jh2-220-guarded-coex-ota-20261109.yml']
permissions: {contents: read}
concurrency: {group: jh2-production-signed-ota-singleton, cancel-in-progress: false}
jobs:
  upgrade:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Guarded signed A/B coexistence upgrade, stable curtain, Eufy BLE and API preference tests
        shell: bash
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/jh2-220-guarded-coex-ota-20261109.py
          sudo -n --preserve-env=GITHUB_WORKSPACE python3 .github/scripts/jh2-220-guarded-coex-ota-20261109.py
