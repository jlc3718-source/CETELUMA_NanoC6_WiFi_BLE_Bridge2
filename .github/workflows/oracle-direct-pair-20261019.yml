name: Approve exact Jason Home 2 ChatGPT connection request
on:
  push:
    branches: [codex/oracle-direct-bootstrap-20261019]
    paths: ['.github/workflows/oracle-direct-pair-20261019.yml']
permissions: {contents: read}
concurrency: {group: jason-home-oracle-production, cancel-in-progress: false}
jobs:
  pair-exact-request:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 2
    steps:
      - name: Approve only the owner-authorized PKCE-bound ChatGPT request
        run: sudo -n /opt/oracle-home-development/venv/bin/python /opt/oracle-home-development/oracle_dev.py --config /opt/oracle-home-development/config.json --approve-request 93994dbb8c346c005b6f93d0
