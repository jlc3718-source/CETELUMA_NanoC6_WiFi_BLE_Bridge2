name: Finish Jason Home 2 trusted OAuth callback policy
on:
  push:
    branches: [codex/oracle-direct-bootstrap-20261019]
    paths: ['.github/workflows/oracle-direct-pair-20261019.yml']
permissions: {contents: read}
concurrency: {group: jason-home-oracle-production, cancel-in-progress: false}
jobs:
  connection-maintenance:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify exact callback, Origin, CSRF and deployment protections
        run: python3 -m unittest discover -s OracleDevelopment -p 'test_*.py'
      - name: Update only connection service with source guard, backup and rollback
        run: sudo -n python3 OracleDevelopment/complete_setup.py
