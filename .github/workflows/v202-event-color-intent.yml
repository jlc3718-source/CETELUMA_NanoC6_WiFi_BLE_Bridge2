name: Finalize Anderson Home v2.0.2 event color intent

on:
  push:
    branches: ['codex/anderson-v2-0-2-event-color-intent']
    paths: ['.github/workflows/v202-event-color-intent.yml']

permissions:
  contents: write

jobs:
  finalize-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - name: Install build tool
        run: python -m pip install -q -r tools/requirements-build.txt
      - name: Restore PlatformIO dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
            firmware/.pio/libdeps
          key: ${{ runner.os }}-pio-v1-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-v1-
      - name: Restore compiled objects
        uses: actions/cache/restore@v4
        with:
          path: .pio-build-cache
          key: ${{ runner.os }}-anderson-objects-v1-${{ hashFiles('firmware/platformio.ini') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-anderson-objects-v1-${{ hashFiles('firmware/platformio.ini') }}-
      - name: Apply researched event intent and migration policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firmware/src/EventCatalog.cpp')
          s=p.read_text()
          old='{"holocaust","Holocaust Remembrance Day",EventKind::Awareness,RuleType::Fixed,1,27,0,0,0,1,Effect::Jump,C2(0xF18900,0xFFFFFF),2},'
          new='{"holocaust","Holocaust Remembrance Day",EventKind::Awareness,RuleType::Fixed,1,27,0,0,0,1,Effect::Jump,C2(0xFFFF00,0xFFFFFF),2},'
          assert s.count(old)==1
          s=s.replace(old,new)
          old='{"pride","Pride Month",EventKind::Awareness,RuleType::Month,6,0,0,0,0,1,Effect::Gradient,C6(0xFF0000,0xFF3000,0xF18900,0x00FF00,0x0000FF,0x23018C),6},'
          new='{"pride","Pride Month",EventKind::Awareness,RuleType::Month,6,0,0,0,0,1,Effect::Gradient,C6(0xFF0000,0xFF3000,0xFFFF00,0x00FF00,0x0000FF,0x23018C),6},'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('firmware/src/PaletteMigration.cpp')
          s=p.read_text()
          old='static constexpr uint8_t PALETTE_MIGRATION_REVISION=1;'
          new='static constexpr uint8_t BACKUP_FORMAT_VERSION=1;\nstatic constexpr uint8_t PALETTE_MIGRATION_REVISION=2;'
          assert s.count(old)==1
          s=s.replace(old,new)
          old='if(!raw.length()||deserializeJson(d,raw)||!d.is<JsonObject>())return false;if((d["version"]|0)!=PALETTE_MIGRATION_REVISION)return false;'
          new='if(!raw.length()||deserializeJson(d,raw)||!d.is<JsonObject>())return false;if((d["version"]|0)!=BACKUP_FORMAT_VERSION)return false;'
          assert s.count(old)==1
          s=s.replace(old,new)
          old='JsonDocument d;d["version"]=PALETTE_MIGRATION_REVISION;d["sourceFirmware"]="2.0.0a";d["provisionalCorrection"]=true;'
          new='JsonDocument d;d["version"]=BACKUP_FORMAT_VERSION;d["sourceFirmware"]="2.0.0a";d["provisionalCorrection"]=true;'
          assert s.count(old)==1
          s=s.replace(old,new)
          start=s.index('bool runPaletteColorMigration(){')
          end=s.index('bool restoreOriginalPaletteColors()',start)
          lines=[
            'bool runPaletteColorMigration(){',
            '  uint8_t state=migrationState(),revision=migrationRevision();',
            '  if(revision>=PALETTE_MIGRATION_REVISION&&(state==STATE_APPLIED||state==STATE_RESTORED))return true;',
            '  if(state==STATE_RESTORE_PENDING)return restoreFromBackup();if(state==STATE_APPLY_PENDING)return applyFromBackup();',
            '  // Preserve an intentional v1 restore while advancing the migration policy marker.',
            '  if(revision>0&&state==STATE_RESTORED)return setMigrationState(STATE_RESTORED,true);',
            '  // Re-derive an already-applied v1 migration from the verified original backup.',
            '  // Never feed already-corrected NVS values through the correction a second time.',
            '  if(revision>0&&state==STATE_APPLIED){JsonDocument backup;if(!loadBackup(backup))return false;if(!setMigrationState(STATE_APPLY_PENDING,false))return false;return applyFromBackup();}',
            '  if(!createBackup())return false;if(!setMigrationState(STATE_APPLY_PENDING,false))return false;return applyFromBackup();',
            '}',
            ''
          ]
          s=s[:start]+'\n'.join(lines)+s[end:]
          p.write_text(s)
          PY
      - name: Bump once and validate source
        shell: bash
        run: |
          test "$(cat FIRMWARE_VERSION.txt)" = "2.0.1"
          python tools/release.py bump
          test "$(cat FIRMWARE_VERSION.txt)" = "2.0.2"
          python tools/release.py prepare
          python - <<'PY'
          from pathlib import Path
          import re
          e=Path('firmware/src/EventCatalog.cpp').read_text()
          c=Path('firmware/src/ColorCorrection.cpp').read_text()
          m=Path('firmware/src/PaletteMigration.cpp').read_text()
          assert 'C2(0xFFFF00,0xFFFFFF)' in e
          assert 'C6(0xFF0000,0xFF3000,0xFFFF00,0x00FF00,0x0000FF,0x23018C)' in e
          assert 'C3(0x23018C,0x00FF00,0xF18900)' in e
          assert 'C2(0xF18900,0xE44300)' in e
          assert 'C3(0x0000FF,0x377CF9,0xFFFFFF)' in e
          assert 'C2(0x0000FF,0x377CF9)' in e
          assert 'C4(0xA7C8FC,0x377CF9,0xFFFFFF,0x004BC6)' in e
          assert '{0x3B82F6,0x0000FF}' in c
          assert '{0x5BC0EB,0x004BC6}' in c
          assert '{0x60A5FA,0x377CF9}' in c
          assert '{0xC4B5FD,0x7A62F9}' in c
          allowed={'FF0000','FF3000','FFFF00','F18900','E44300','00FF00','2AD555','0000FF','004BC6','377CF9','00FFFF','00664D','23018C','7A62F9','FF00FF','FF020C','FF1560','EF4F98','FFFFFF','FFDA7F','A7C8FC','360500','220200','000000'}
          block=e[e.index('const EventDef EVENTS[] = {'):e.index('const size_t EVENT_COUNT')]
          used=set(re.findall(r'0x([0-9A-Fa-f]{6})',block))
          assert used <= allowed, sorted(used-allowed)
          assert 'BACKUP_FORMAT_VERSION=1' in m
          assert 'PALETTE_MIGRATION_REVISION=2' in m
          assert 'revision>0&&state==STATE_APPLIED' in m
          assert 'loadBackup(backup)' in m
          print('Event intent, blue-family, palette coverage, and migration-v2 checks passed')
          PY
      - name: Commit exact release source
        shell: bash
        run: |
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git rm .github/workflows/v202-event-color-intent.yml
          git add -A
          git commit -m 'Anderson Home v2.0.2 researched event color intent'
          git push origin HEAD:codex/anderson-v2-0-2-event-color-intent
      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package verified firmware
        run: python tools/release.py package
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-NanoC6-v2.0.2-event-intent
          path: release/*
          if-no-files-found: error
