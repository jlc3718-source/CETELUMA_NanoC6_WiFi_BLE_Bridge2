name: Build FermataAuto APK

on:
  push:
    branches:
      - fermata-build-20260918
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out FermataAuto
        uses: actions/checkout@v4
        with:
          repository: Dt2285/FermataAuto
          ref: master
          submodules: recursive
          path: FermataAuto

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Android SDK 33 build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;33.0.1"

      - name: Build arm64 Fermata Auto universal APK
        working-directory: FermataAuto
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon packageAutoReleaseUniversalApk -PABI=arm64-v8a

      - name: Show APK outputs
        if: always()
        shell: bash
        run: find FermataAuto -type f -name '*.apk' -print || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FermataAuto-arm64-apk
          path: FermataAuto/**/*.apk
          if-no-files-found: error
          retention-days: 7
