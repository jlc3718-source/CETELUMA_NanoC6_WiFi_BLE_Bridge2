name: SD300 V5 hyperreal generation start
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sd300-full-ai-v5-start.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  start-v5:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install independent V5 and launch fresh Agnes render
        shell: bash
        run: |
          set -euo pipefail
          root=/home/ubuntu/agnes-sd300-v5
          mkdir -p "$root"
          cp agnes-remote/sd300-full-ai-v5.py "$root/sd300-full-ai-v5.py"
          cp agnes-remote/sd300-full-ai-v5.json "$root/sd300-full-ai-v5.json"
          python3 -m py_compile "$root/sd300-full-ai-v5.py"
          python3 - <<'PY'
          import json
          p='/home/ubuntu/agnes-sd300-v5/sd300-full-ai-v5.json'
          c=json.load(open(p))
          assert len(c['scenes'])==11 and all(x['id'].startswith('v5_') for x in c['scenes'])
          assert all('STRICT LIVE-ACTION PHOTOREALISM' in x['prompt'] for x in c['scenes'])
          print('SD300_V5_CONFIG_VALID scenes=11')
          PY
          if [ -f "$root/full-ai-v5-state.json" ]; then
            echo "SD300_V5_EXISTING_STATE_PRESERVED"
          fi
          if systemctl is-active --quiet sd300-full-ai-v5.service; then
            echo "SD300_V5_ALREADY_RUNNING"
          else
            sudo -n systemd-run --unit=sd300-full-ai-v5 --property=Restart=on-failure --property=RestartSec=30 /usr/bin/python3 "$root/sd300-full-ai-v5.py"
          fi
          sleep 3
          echo SD300_V5_SERVICE=$(systemctl is-active sd300-full-ai-v5.service || true)
          journalctl -u sd300-full-ai-v5.service -n 12 --no-pager -o cat || true
