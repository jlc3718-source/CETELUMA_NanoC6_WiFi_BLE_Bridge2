name: Prepare Anderson Home v2.0.5 OTA test
on:
  push:
    branches: ['codex/anderson-v2-0-5-remote-ota-test']
    paths: ['.github/workflows/v205-version-bootstrap.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump and validate OTA test release
        shell: bash
        run: |
          python tools/release.py bump
          test "$(cat FIRMWARE_VERSION.txt)" = "2.0.5"
          python tools/release.py prepare
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git add FIRMWARE_VERSION.txt README.md firmware/src/main.cpp firmware/web/index.html firmware/include/WebUIGzip.h
          git commit -m 'Anderson Home v2.0.5 remote OTA test release'
          git push
