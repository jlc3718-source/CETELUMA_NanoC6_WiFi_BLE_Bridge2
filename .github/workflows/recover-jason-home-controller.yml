name: Fix Eufy verification and connection status
on:
  push:
    branches: [fix/jh2-eufy-verification-20261015]
    paths: ['.github/workflows/recover-jason-home-controller.yml', 'JasonHomeServer/**', 'JasonHome/app/src/main/assets/android_eufy_ui.js']
permissions:
  contents: read
concurrency:
  group: jason-home-oracle-production
  cancel-in-progress: false
jobs:
  fix:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 12
    steps:
      - name: Restore build workspace ownership
        run: if test -d "$GITHUB_WORKSPACE"; then sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"; fi
      - uses: actions/checkout@v4
      - name: Compile and test Eufy verification flow
        run: |
          set -euo pipefail
          sudo docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src/JasonHomeServer node:22-slim sh -c 'npm ci && npm run build && node tests/eufy-verification.mjs'
          python3 JasonHome2Server/generate_catalog.py
          python3 JasonHome2Server/generate_web.py
          sudo docker run --rm -v "$PWD:/src" -w /src node:22-slim node --check JasonHome2Server/web/android_eufy_ui.js
      - name: Back up live state apply focused fix and verify real challenge
        run: sudo --preserve-env=GITHUB_RUN_ID python3 .github/scripts/deploy-eufy-verification.py
