name: Diagnose Eufy login challenge without changing credentials
on:
  push:
    branches: [jason-home-2-web]
    paths: ['.github/workflows/recover-jason-home-controller.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          umask 077
          TARGET="/home/ubuntu/jh2-eufy-diagnostic-${GITHUB_RUN_ID}"
          mkdir -p "$TARGET"
          sudo docker cp jason-home:/app/dist/eufy/client.js "$TARGET/client.js"
          sudo docker cp jason-home:/app/dist/server.js "$TARGET/server.js"
          sudo chown -R "$(id -u):$(id -g)" "$TARGET"
          python3 - <<'PY'
          import subprocess,json
          script="""import {EufyClient} from './dist/eufy/client.js';import {createHash} from 'node:crypto';
          const c=new EufyClient(process.env.EUFY_INSTALL_ID||createHash('sha256').update('jason-home-server:'+process.env.EUFY_EMAIL).digest('hex').slice(0,32));
          const raw=c.raw.bind(c);c.raw=async(...args)=>{const r=await raw(...args);if(args[1].includes('/passport/login')){let d=r.data;try{if(typeof d==='string'){const {aesDecryptText}=await import('./dist/eufy/crypto.js');d=JSON.parse(aesDecryptText(d,c.share));}}catch{};console.log(JSON.stringify({http:r._http,code:r.code,message:r.msg||r.message,dataType:typeof d,keys:d&&typeof d==='object'?Object.keys(d):[],hasCaptcha:!!(d?.captcha_id||d?.captchaId),hasImage:!!(d?.item||d?.captcha_image),fa:!!d?.fa_info}));}return r;};
          try{await c.login(process.env.EUFY_EMAIL,process.env.EUFY_PASSWORD);console.log('Login succeeded')}catch(e){console.log('Login result:',e.message)}"""
          p=subprocess.run(['sudo','docker','exec','-i','jason-home','node','--input-type=module','-e',script],capture_output=True,text=True,timeout=90)
          print(p.stdout);print('Diagnostic exit:',p.returncode)
          PY
          echo 'Live login continuation points:'
          rg -n 'async login|captcha|fa_info|Eufy .*failed|ensureEufy|statusPayload|api/reconnect|eufy:\{' "$TARGET/client.js" "$TARGET/server.js" | head -45
          