name: Fix v3.0.17 Palette Recovery Favorites
on:
  push:
    branches: ['codex/v3.0.17-canonical-palette']
    paths:
      - '.github/scripts/fix-v3.0.17-palette-recovery-favorites.py'
      - '.github/workflows/fix-v3.0.17-palette-recovery-favorites.yml'
permissions:
  contents: write
jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3.0.17-canonical-palette
          fetch-depth: 0
      - run: python .github/scripts/fix-v3.0.17-palette-recovery-favorites.py
      - name: Validate
        run: |
          python -m pip install -r tools/requirements-build.txt
          npm ci --prefix tools
          python tools/release.py check
          python - <<'PY'
          from pathlib import Path
          s=Path('firmware/src/PaletteMigration.cpp').read_text()
          assert 'writePrefStringVerified("anderson-colors","saved"' not in s
          assert Path('FIRMWARE_VERSION.txt').read_text().strip()=='3.0.17'
          PY
      - run: |
          rm .github/scripts/fix-v3.0.17-palette-recovery-favorites.py
          rm .github/workflows/fix-v3.0.17-palette-recovery-favorites.yml
      - name: Commit corrected source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep favorites isolated from palette recovery'
          git push origin HEAD:codex/v3.0.17-canonical-palette
