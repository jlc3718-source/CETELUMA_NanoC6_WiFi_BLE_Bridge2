name: SmartDawn one-shot on-controller saved-effect playlist trial
on:
  push:
    branches: [test/jh2-212-smartdawn-playlist-guard-20261026]
    paths: ['.github/workflows/jh2-212-live-native-playlist-once-20261026.yml']
permissions: {contents: read}
concurrency: {group: jh2-one-time-playlist-20261026, cancel-in-progress: false}
jobs:
  controlled-test:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read inventory then guarded playlist create, readback, play and rollback on failure
        run: |
          set -euo pipefail
          sudo -n python3 .github/scripts/jh2-212-native-playlist-two-effect-test-once-20261026.py
