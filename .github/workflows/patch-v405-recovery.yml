name: Apply v4.0.5 recovery upload fix

on:
  push:
    branches: ['fix/v4.0.5-recovery-upload']
    paths: ['.github/workflows/patch-v405-recovery.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4.0.5-recovery-upload
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release-check dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund

      - name: Apply v4.0.5 recovery patch
        run: python tools/patch_v405_recovery.py

      - name: Run focused regression and release checks
        run: |
          set -euo pipefail
          python tools/test_regressions.py
          python tools/test_maintenance.py
          python tools/test_audit_fixes.py
          python tools/release.py check

      - name: Commit v4.0.5 source
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-v405-recovery.yml tools/patch_v405_recovery.py
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git add -A
          git commit -m 'Anderson Home 4.0.5: harden emergency firmware recovery'
          git push origin HEAD:fix/v4.0.5-recovery-upload
