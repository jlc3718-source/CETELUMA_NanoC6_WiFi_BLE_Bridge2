name: Export SD300 hyperrealism clips 1 and 2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agnes-preview-first-two.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-clips:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate both new revision E MP4 files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,shutil,subprocess,os
          from pathlib import Path
          root=Path('/home/ubuntu/agnes-sd300')
          manifest=json.loads((root/'scene-manifest.json').read_text())
          if manifest.get('revision')!='sd300-full-film-cinematic-realism-2026-11-18-e':
              raise SystemExit('Wrong active scene revision; refusing old clips')
          state=json.loads((root/'state.json').read_text())
          jobs=[
              ('01_electrician','SD300_Hyperrealism_Clip_01_Electrician.mp4'),
              ('02_gear','SD300_Hyperrealism_Clip_02_Gear.mp4')
          ]
          for name,dest in jobs:
              info=state.get(name,{})
              if info.get('status')!='downloaded' or info.get('revision')!=manifest['revision']:
                  raise SystemExit('New clip not yet downloaded: '+name)
              src=root/(name+'.mp4')
              if not src.is_file() or src.stat().st_size<100000:raise SystemExit('MP4 missing: '+name)
              result=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1',str(src)],capture_output=True,text=True,check=True)
              print('VERIFIED_REVISION_E_CLIP',name,'bytes',src.stat().st_size,'duration',result.stdout.strip(),flush=True)
              shutil.copy2(src,Path(os.environ['GITHUB_WORKSPACE'])/dest)
          PY
      - name: Upload new AI preview clips for inspection
        uses: actions/upload-artifact@v4
        with:
          name: SD300_Hyperrealism_Preview_Clips_1_and_2
          path: |
            SD300_Hyperrealism_Clip_01_Electrician.mp4
            SD300_Hyperrealism_Clip_02_Gear.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
