name: Audit Factory Promotion Matches

on:
  push:
    branches: [jason-home-cloudflare-rebuild]
    paths: ['.github/workflows/audit-factory-promotions.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 8
    steps:
      - name: Verify live Factory promotions
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repo/JasonHomeServer
          sudo docker compose exec -T jason-home node --input-type=module - <<'NODE'
          import { resolveCalendar } from '/app/dist/calendar.js';
          const get=async path=>{
            const r=await fetch('http://127.0.0.1:8080'+path,{headers:{Authorization:'Bearer '+process.env.JASON_HOME_API_TOKEN}});
            if(!r.ok)throw new Error(path+' HTTP '+r.status);
            return r.json();
          };
          const [promos,factory,cal]=await Promise.all([
            get('/api/eufy/factory-promotions'),
            get('/api/eufy/factory-presets'),
            get('/api/calendar')
          ]);
          console.log('PROMOTED_COUNT',promos.count);
          console.log('FACTORY_REMAINING',factory.count);
          console.log('FACTORY_PROMOTED_REPORTED',factory.promotedCount);
          console.log('CHRISTMAS_PROMOTIONS',(promos.promotions||[]).filter(x=>x.eventId==='evt208').map(x=>x.name).join(' | '));
          console.log('NEW_YEAR_PROMOTIONS',(promos.promotions||[]).filter(x=>x.eventId==='evt006').map(x=>x.name).join(' | '));
          console.log('HALLOWEEN_PROMOTIONS',(promos.promotions||[]).filter(x=>x.eventId==='evt179').map(x=>x.name).join(' | '));
          if(promos.count!==22)throw new Error('Expected 22 promoted presets');
          if(factory.count!==65)throw new Error('Expected 65 presets remaining in Factory Lab');
          if(factory.promotedCount!==22)throw new Error('Factory promotedCount must be 22');

          const cfg=structuredClone(cal.calendar);
          for(const p of promos.promotions||[]){
            if(p.enabled===false)continue;
            const e=p.event,s=p.scene;
            cfg.events.push({...e,id:e.id+'::factory:'+p.lightId,name:p.name,effect:s.effect,speed:s.speed,colors:s.colors,enabled:true,favorite:false});
          }
          const ids=new Set(),names=[];
          for(const hour of [17,18,19,20,21,22]){
            const iso=new Date(Date.UTC(2026,11,25,hour+5,30));
            const r=resolveCalendar(cfg,iso,42.1507,-78.9452,'America/New_York');
            if(r){ids.add(r.id);names.push(hour+':30 '+r.id+' '+r.name);}
          }
          console.log('CHRISTMAS_ROTATION',names.join(' || '));
          console.log('CHRISTMAS_UNIQUE_IDS',ids.size);
          if(ids.size<4)throw new Error('Christmas scheduler did not expose all four scheduled looks');
          NODE
