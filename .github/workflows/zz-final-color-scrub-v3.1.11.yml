name: Final Anderson v3.1.11 Color Scrub

on:
  push:
    branches: ['codex/release-current']

permissions:
  contents: write

jobs:
  scrub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-current
      - name: Remove every residual retired color label
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove the only residual runtime/source label.
          cp=Path('firmware/src/ColorCorrection.cpp')
          s=cp.read_text().replace('Purple/Lavender','Purple')
          cp.write_text(s)

          # Replace the obsolete 16-color project note with the current retained set.
          ap=Path('AGENTS.md'); a=ap.read_text()
          a=re.sub(
            r'- v3\.0\.29 and later Favorite Colors are the firmware-locked 16-color master palette:.*?Changing this palette requires a firmware build\.\n',
            '- Favorite Colors are firmware-locked to the retained approved set: Red `#FF0000`, Orange `#FF0D00`, Pink `#FF0024`, Yellow `#E0B400`, Green `#28FF00`, Blue `#0D00FF`, Purple `#5B00E6`, White `#FFFFFA`, and Navy Blue `#001478`. `/api/colors` is read-only; the UI must not offer add/delete controls. Changing this palette requires a firmware build.\n',
            a, count=1)
          a=a.replace('Retired named colors are migrated to the nearest retained family and are not presented as selectable palette entries.','Legacy stored values are migrated to the nearest retained family and are not presented as selectable palette entries.')
          ap.write_text(a)

          # Tests should prove the reduced palette without keeping deleted display names in source.
          tp=Path('tools/test_regressions.py'); t=tp.read_text()
          t=re.sub(r"retired_names=\[.*?\]\nfor name in retired_names: assert f\"name:'\{name\}'\" not in web\n",'',t,count=1,flags=re.S)
          marker="assert \"{name:'Navy Blue',reference:'#000080',output:'#001478'}\" in web"
          assert marker in t
          if "palette_block=re.search" not in t:
            t=t.replace(marker,marker+"\npalette_block=re.search(r'const NAMED_COLOR_PALETTE=\\[(.*?)\\];',web,re.S); assert palette_block and palette_block.group(1).count(\"{name:'\")==9")
          tp.write_text(t)

          retired=['Burgundy','Cyan','Teal','Sky Blue','Amber Gold','Lavender','Silver Gray']
          targets=[Path('firmware/src/ColorCorrection.cpp'),Path('firmware/src/PaletteMigration.cpp'),Path('firmware/src/EventCatalog.cpp'),Path('firmware/web/index.html'),Path('tools/test_regressions.py'),Path('AGENTS.md')]
          for f in targets:
            text=f.read_text()
            for name in retired:
              assert name not in text,(str(f),name)

          web=Path('firmware/web/index.html').read_text()
          block=re.search(r'const NAMED_COLOR_PALETTE=\[(.*?)\];',web,re.S); assert block
          assert block.group(1).count("{name:'")==9
          assert "name:'Yellow',reference:'#FFFF00',output:'#E0B400'" in block.group(1)
          assert 'Modern Colors' not in web and 'eventColorsModern' not in web
          print('Final color scrub passed: 9 retained names; Yellow #E0B400; no retired labels.')
          PY
          python tools/test_regressions.py
          python tools/test_audit_fixes.py
      - name: Commit scrubbed source and remove helper
        run: |
          rm -f .github/workflows/zz-final-color-scrub-v3.1.11.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Finalize v3.1.11 color scrub"
          git push origin HEAD:refs/heads/codex/release-current
