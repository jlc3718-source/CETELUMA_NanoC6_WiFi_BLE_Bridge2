name: Jason Home 2 Signed Curtain APK 2.0.17
on:
  push:
    branches: [codex/jh2-70k-buffers-studio-simplify-20261016]
    paths:
      - 'JasonHome2Android/**'
      - '.github/workflows/jh2-curtain-apk-2.0.17.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jh2-curtain-apk-2-0-17
  cancel-in-progress: false
jobs:
  apk:
    name: Build unchanged-identity Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Compile Android WebView app
        shell: bash
        run: |
          set -euo pipefail
          SDK=/usr/local/lib/android/sdk
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          BT="$SDK/build-tools/35.0.0"
          JAR="$SDK/platforms/android-35/android.jar"
          OUT="$PWD/JasonHome2Android/build"
          mkdir -p "$OUT/classes" "$OUT/dex"
          "$BT/aapt2" link -o "$OUT/unsigned.apk" -I "$JAR" --manifest JasonHome2Android/AndroidManifest.xml --min-sdk-version 26 --target-sdk-version 35
          javac --release 17 -cp "$JAR" -d "$OUT/classes" JasonHome2Android/src/com/jasonhome2/app/*.java
          "$BT/d8" --min-api 26 --lib "$JAR" --output "$OUT/dex" "$OUT/classes/com/jasonhome2/app/"*.class
          cp "$OUT/unsigned.apk" "$OUT/with-dex.apk"
          (cd "$OUT/dex" && zip -q -u "$OUT/with-dex.apk" classes.dex)
          "$BT/zipalign" -f 4 "$OUT/with-dex.apk" Jason-Home-2-2.0.17-UNSIGNED.apk
          "$BT/aapt2" dump badging Jason-Home-2-2.0.17-UNSIGNED.apk > "$OUT/badging.txt"
          grep "package: name='com.jasonhome2.app' versionCode='18' versionName='2.0.17'" "$OUT/badging.txt"
          ! grep -q 'permission.BLUETOOTH' "$OUT/badging.txt"
          grep -q 'http://craumer.tplinkdns.com' JasonHome2Android/src/com/jasonhome2/app/CurtainBridge.java
          tar -czf android-tools.tar.gz -C "$BT" lib/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-Unsigned-2.0.17
          path: |
            Jason-Home-2-2.0.17-UNSIGNED.apk
            android-tools.tar.gz
          if-no-files-found: error
          retention-days: 7
  sign:
    name: Sign with existing trusted Jason Home key
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 12
    needs: apk
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@v4
        with: {name: JH2-Unsigned-2.0.17, path: sign}
      - name: Sign and verify established certificate
        shell: bash
        run: |
          set -euo pipefail
          cd sign
          tar -xzf android-tools.tar.gz
          export JH2_SIGN_PASS="$(cat /home/ubuntu/.jason-home-signing/password)"
          java -jar lib/apksigner.jar sign \
            --ks /home/ubuntu/.jason-home-signing/jason-home-release.jks \
            --ks-key-alias jason-home \
            --ks-pass env:JH2_SIGN_PASS \
            --key-pass env:JH2_SIGN_PASS \
            --out Jason-Home-2-2.0.17-ORACLE-RELAY-SIGNED.apk \
            Jason-Home-2-2.0.17-UNSIGNED.apk
          java -jar lib/apksigner.jar verify --verbose --print-certs Jason-Home-2-2.0.17-ORACLE-RELAY-SIGNED.apk > verify.txt
          grep -qi '76b28efd4f5d132ad3048f19bae6c35aa5f84c4a390e98c80deeebc0c3e73ae1' verify.txt
          sha256sum Jason-Home-2-2.0.17-ORACLE-RELAY-SIGNED.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-Signed-2.0.17
          path: |
            sign/Jason-Home-2-2.0.17-ORACLE-RELAY-SIGNED.apk
            sign/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Verify published signed APK
    needs: sign
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: JH2-Signed-2.0.17, path: apk}
      - name: Publish and verify byte-identical release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=jason-home-2-apk-v2.0.17
          gh release view "$TAG" >/dev/null 2>&1 && { echo "Existing signed release must never be overwritten"; exit 1; }
          gh release create "$TAG" apk/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title "Jason Home 2 APK 2.0.17" --notes "Signed APK with the existing trusted identity. Updated hosted Curtain Studio, settings layout, and Oracle streaming are deployed separately; the APK opens the live Oracle-hosted interface."
          mkdir -p verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir verify
          (cd apk && sha256sum --check SHA256SUMS)
          cmp apk/*.apk verify/*.apk
          echo "Jason Home 2 signed APK 2.0.17 published and byte-verified."
