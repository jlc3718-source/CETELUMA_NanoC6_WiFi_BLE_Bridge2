name: Benchmark Anderson Lean Pipeline

on:
  push:
    branches: ['analysis/pipeline-speed']
    paths: ['.github/workflows/benchmark-lean-pipeline.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt

      - name: Install Python and web tools
        run: |
          t=$SECONDS
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
          echo "TOOLS_SECONDS=$((SECONDS-t))" | tee -a "$GITHUB_ENV"

      - name: Restore lean PlatformIO runtime only
        id: piolean
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-lean-v2-${{ hashFiles('firmware/platformio.ini') }}

      - name: Restore branch compiled objects
        id: objects
        uses: actions/cache/restore@v4
        with:
          path: .pio-build-cache
          key: ${{ runner.os }}-anderson-objects-leanbench-v1-${{ hashFiles('firmware/platformio.ini') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-anderson-objects-leanbench-v1-${{ hashFiles('firmware/platformio.ini') }}-

      - name: Prepare release
        run: |
          t=$SECONDS
          python tools/release.py prepare
          echo "PREPARE_SECONDS=$((SECONDS-t))" | tee -a "$GITHUB_ENV"

      - name: Compile production-equivalent firmware
        run: |
          t=$SECONDS
          pio run -d firmware -e m5stack-nanoc6 -j 4
          echo "COMPILE_SECONDS=$((SECONDS-t))" | tee -a "$GITHUB_ENV"

      - name: Package and verify UI/size invariants
        run: |
          t=$SECONDS
          python tools/release.py package
          echo "PACKAGE_SECONDS=$((SECONDS-t))" | tee -a "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('release/release.json').read_text())
          f=r['files']['and_3.1.23.bin']
          assert f['bytes']==1817392, f
          assert r['ui_sha256']=='f99f55b5e163c8424867129fbc5c3410ae97c06b9186937d9a8ee824dd052419'
          print('Production size and UI identity reproduced; binary SHA differs only because build identity embeds this benchmark commit.')
          PY

      - name: Report cache footprint and benchmark
        run: |
          du -sh ~/.platformio/platforms ~/.platformio/packages firmware/.pio/libdeps .pio-build-cache 2>/dev/null || true
          echo "### Lean pipeline benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lean PIO cache hit: ${{ steps.piolean.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Object cache hit: ${{ steps.objects.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tool install: ${TOOLS_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prepare: ${PREPARE_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compile: ${COMPILE_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: ${PACKAGE_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Save compiled objects for warm benchmark
        if: steps.objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .pio-build-cache
          key: ${{ runner.os }}-anderson-objects-leanbench-v1-${{ hashFiles('firmware/platformio.ini') }}-${{ github.sha }}
