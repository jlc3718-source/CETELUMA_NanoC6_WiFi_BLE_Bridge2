name: Apply Anderson v3.1.5 UI Cleanup Once

on:
  push:
    branches: ['codex/release-v3.1.5-ui-cleanup']
    paths: ['.github/workflows/zz-v315-ui-cleanup-once.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-v3.1.5-ui-cleanup
          fetch-depth: 0
      - name: Apply exact UI cleanup and version bump
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'firmware/web/v3_mockup.js',
              '''    const actions = q('.headerActions'), meta = el('div','v3HomeMeta','<span class="v3HomeName">My Home</span>');\n    meta.appendChild(byId('connectionBadge'));\n    const profile = byId('activeProfile'); profile.className = 'v3ProfileName';\n    const switcher = byId('switchProfile'); switcher.innerHTML = icon('user'); switcher.setAttribute('aria-label','Switch user'); switcher.title = 'Switch user';\n    actions.replaceChildren(meta, profile, switcher);''',
              '''    const actions = q('.headerActions'), badge = byId('connectionBadge'), profile = byId('activeProfile');\n    badge.style.display = 'none';\n    profile.className = 'v3ProfileName'; profile.style.display = 'none';\n    const switcher = byId('switchProfile'); switcher.innerHTML = icon('user'); switcher.setAttribute('aria-label','Switch user'); switcher.title = 'Switch user';\n    actions.replaceChildren(badge, profile, switcher);'''
          )

          replace_once('firmware/web/index.html', '<small>v3.0.28 event palette</small>', '<small>Basic Scheme v 3.0.28</small>')
          replace_once('firmware/web/index.html', '<small>v3.0.29 revised palette</small>', '<small>Advanced Scheme v 3.0.29</small>')

          replace_once(
              'tools/test_regressions.py',
              '''assert "dot.style.background='#f3fbff'" not in mock\nversion=t('FIRMWARE_VERSION.txt').strip(); assert f'ANDERSON_FIRMWARE_VERSION="{version}"' in main''',
              '''assert "dot.style.background='#f3fbff'" not in mock\nassert 'v3HomeName">My Home' not in mock\nassert "badge.style.display = 'none'" in mock and "profile.style.display = 'none'" in mock\nassert 'Basic Scheme v 3.0.28' in web and 'v3.0.28 event palette' not in web\nassert 'Advanced Scheme v 3.0.29' in web and 'v3.0.29 revised palette' not in web\nversion=t('FIRMWARE_VERSION.txt').strip(); assert f'ANDERSON_FIRMWARE_VERSION="{version}"' in main'''
          )

          version = Path('FIRMWARE_VERSION.txt')
          if version.read_text().strip() != '3.1.4':
              raise SystemExit('Unexpected starting firmware version')
          version.write_text('3.1.5\n')
          replace_once('firmware/src/main.cpp', 'static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.4";', 'static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.5";')

          Path('.github/workflows/zz-v315-ui-cleanup-once.yml').unlink()
          PY
      - name: Commit exact release source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Prepare Anderson Home v3.1.5 UI cleanup"
          git push origin HEAD:refs/heads/codex/release-v3.1.5-ui-cleanup
