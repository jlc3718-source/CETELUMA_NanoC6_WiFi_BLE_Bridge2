name: Build CETELUMA NanoC6

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Extract firmware project
        run: unzip -o CETELUMA_NanoC6_WiFi_BLE_Bridge_Source_FIXED.zip

      - name: Build ESP32-C6 firmware
        working-directory: CETELUMA_NanoC6_WiFi_BLE_Bridge
        run: |
          set +e
          pio run -e m5stack-nanoc6
          BUILD_RC=$?
          set -e

          if [ -f .pio/build/m5stack-nanoc6/firmware.factory.bin ]; then
            cp .pio/build/m5stack-nanoc6/firmware.factory.bin \
              CETELUMA_NanoC6_WiFi_BLE_Bridge.bin
          else
            exit "$BUILD_RC"
          fi

      - name: Verify final BIN
        run: |
          test -f CETELUMA_NanoC6_WiFi_BLE_Bridge/CETELUMA_NanoC6_WiFi_BLE_Bridge.bin
          ls -lh CETELUMA_NanoC6_WiFi_BLE_Bridge/CETELUMA_NanoC6_WiFi_BLE_Bridge.bin
          sha256sum CETELUMA_NanoC6_WiFi_BLE_Bridge/CETELUMA_NanoC6_WiFi_BLE_Bridge.bin

      - uses: actions/upload-artifact@v4
        with:
          name: CETELUMA_NanoC6_WiFi_BLE_Bridge
          path: CETELUMA_NanoC6_WiFi_BLE_Bridge/CETELUMA_NanoC6_WiFi_BLE_Bridge.bin
          if-no-files-found: error
