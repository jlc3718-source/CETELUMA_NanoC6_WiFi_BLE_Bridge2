name: Finalize Anderson v3.0.11 hourly recovery

on:
  push:
    branches:
      - codex/v3.0.11-size-and-network
    paths:
      - .github/workflows/finalize-v3011-hourly.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3.0.11-size-and-network
          fetch-depth: 0
      - name: Apply exact one-hour maintenance interval
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text missing from {path}: {old!r}")
              p.write_text(text.replace(old, new))

          replace('firmware/src/main.cpp',
                  'static constexpr uint32_t MAINTENANCE_REBOOT_INTERVAL_MS=4UL*60UL*60UL*1000UL;',
                  'static constexpr uint32_t MAINTENANCE_REBOOT_INTERVAL_MS=60UL*60UL*1000UL;')
          replace('tools/test_maintenance.py',
                  'maintenanceRebootStartedAt=1000;tick=14400999;checkMaintenanceReboot();assert(ESP.count==0);\n tick=14401000;checkMaintenanceReboot();assert(ESP.count==1);\n ESP.count=0;Update.busy=true;tick=14500000;checkMaintenanceReboot();assert(ESP.count==0);',
                  'maintenanceRebootStartedAt=1000;tick=3600999;checkMaintenanceReboot();assert(ESP.count==0);\n tick=3601000;checkMaintenanceReboot();assert(ESP.count==1);\n ESP.count=0;Update.busy=true;tick=3700000;checkMaintenanceReboot();assert(ESP.count==0);')
          replace('tools/test_maintenance.py',
                  'maintenanceRebootStartedAt=UINT32_MAX-1000;tick=14398998;checkMaintenanceReboot();assert(ESP.count==0);\n tick=14398999;checkMaintenanceReboot();assert(ESP.count==1);',
                  'maintenanceRebootStartedAt=UINT32_MAX-1000;tick=3598998;checkMaintenanceReboot();assert(ESP.count==0);\n tick=3598999;checkMaintenanceReboot();assert(ESP.count==1);')
          replace('tools/test_maintenance.py', 'PASS: 4-hour boundaries', 'PASS: 1-hour boundaries')
          replace('README.md', 'Restart after 4 hours of uptime', 'Restart after 1 hour of uptime')
          replace('AGENTS.md', 'Maintenance reboot occurs after every 4 hours of uptime', 'Maintenance reboot occurs after every 1 hour of uptime')
          PY
      - name: Verify maintenance and network recovery tests
        run: python tools/test_maintenance.py
      - name: Commit finalized source and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-v3011-hourly.yml
          git add firmware/src/main.cpp tools/test_maintenance.py README.md AGENTS.md
          git commit -m "Finalize v3.0.11 hourly maintenance recovery"
          git push origin HEAD:codex/v3.0.11-size-and-network
