name: Build OpenAutoLink Personal AAB

on:
  push:
    paths:
      - ".github/workflows/build-openautolink-aab.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Build signed personal AAB
        env:
          OAL_NONINTERACTIVE: "1"
          OAL_APP_ID: "com.jlc3718.openautolink.silveradoev"
          OAL_SIGNER_NAME: "OpenAutoLink Silverado EV Personal"
          OAL_COUNTRY: "US"
          OAL_START_VERSION_CODE: "0"
          OAL_REF: "v0.1.497"
          OAL_BUILDER_STATE_DIR: "${{ runner.temp }}/openautolink-builder"
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/mossyhub/openautolink/v0.1.497/build-aab.sh -o /tmp/build-aab.sh
          chmod +x /tmp/build-aab.sh
          /tmp/build-aab.sh

          mkdir -p release
          cp "${OAL_BUILDER_STATE_DIR}"/output/*.aab release/
          sha256sum release/*.aab > release/SHA256SUMS.txt
          cat > release/BUILD_INFO.txt <<'EOF'
          OpenAutoLink personal AAB
          Upstream: mossyhub/openautolink
          Source ref: v0.1.497
          Application ID: com.jlc3718.openautolink.silveradoev
          Intended vehicle: Chevrolet Silverado EV LT (AAOS)
          Signing note: this automated build uses an ephemeral upload key.
          After the first Google Play upload, preserve the Play app identity and configure/reset a permanent upload key before future updates.
          EOF

      - name: Upload temporary Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: openautolink-personal-v0.1.497
          path: release/*
          retention-days: 7
          if-no-files-found: error

      - name: Publish downloadable GitHub release
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -euo pipefail
          TAG="openautolink-personal-v0.1.497"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" release/*             --title "OpenAutoLink Personal AAB v0.1.497"             --notes "Personal Google Play AAB built from mossyhub/openautolink v0.1.497 for AAOS. Application ID: com.jlc3718.openautolink.silveradoev. The build key is intentionally ephemeral; configure/reset a permanent Play upload key before the next update."
