name: Apply BLE Diagnostics Patch

on:
  push:
    branches: ['work/ble-diagnostics-v3.1.7']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ble-diagnostics-v3.1.7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted source patches
        run: python tools/ble_diag_patch.py
      - name: Verify requested source markers
        run: |
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.7"' firmware/src/main.cpp
          grep -q '/api/ble/diagnostics' firmware/src/main.cpp
          grep -q "\['testing','Testing'\]" firmware/web/v3_mockup.js
          grep -q 'BLE Command Verification' firmware/web/v3_mockup.js
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = '3.1.7'
      - name: Remove one-shot patch helpers
        run: rm -f tools/ble_diag_patch.py .github/workflows/ble-diag-patch.yml
      - name: Commit completed change set
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement Jason BLE diagnostics testing tab'
          git push origin HEAD:work/ble-diagnostics-v3.1.7
