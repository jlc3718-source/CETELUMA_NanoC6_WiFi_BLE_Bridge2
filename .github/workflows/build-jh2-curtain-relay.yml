name: Jason Home 2 Oracle Curtain Relay
on:
  push:
    branches: [feat/jh2-oracle-curtain-1.1.0]
    paths: ['JasonHome2NanoC6/**','JasonHome2Server/**','JasonHome2Android/**','.github/workflows/build-jh2-curtain-relay.yml','.github/scripts/deploy-curtain-relay.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jh2-curtain-relay-build
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            JasonHome2NanoC6/.pio/libdeps
          key: jh2-nanoc6-pio-${{ hashFiles('JasonHome2NanoC6/platformio.ini') }}
          restore-keys: jh2-nanoc6-pio-
      - run: python -m pip install platformio==6.2.0 esptool==5.5.0 Pillow==11.3.0
      - name: Test relay semantics and retained Studio features
        run: |
          node --check JasonHome2Server/server.mjs
          node --test JasonHome2Server/tests/curtain-relay.mjs JasonHome2Server/tests/curtain-quality.mjs JasonHome2Server/tests/curtain-images.mjs JasonHome2Server/tests/curtain-photo-import.mjs JasonHome2Server/tests/curtain-offline.mjs JasonHome2Server/tests/curtain-replace-play.mjs JasonHome2Server/tests/curtain-test-override.mjs
          python JasonHome2NanoC6/tests/test_bridge.py
          g++ -std=c++17 -O2 -I JasonHome2NanoC6/src JasonHome2NanoC6/tests/smartdawn.cpp JasonHome2NanoC6/src/SmartDawnProtocol.cpp -o /tmp/jh2-curtain
          /tmp/jh2-curtain
          python JasonHome2NanoC6/tools/prepare.py
      - name: Build and validate both firmware apps
        run: |
          python -m platformio run -d JasonHome2NanoC6 -e runtime -e boot -j 4
          python -m platformio run -d JasonHome2NanoC6 -e runtime -t buildfs
          python JasonHome2Server/generate_catalog.py
          python JasonHome2NanoC6/tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Jason-Home-2-NanoC6-1.1.1
          path: JasonHome2NanoC6/release/
          if-no-files-found: error
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build existing APK with Oracle transport
        shell: bash
        run: |
          set -euo pipefail
          SDK=/usr/local/lib/android/sdk
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          BT="$SDK/build-tools/35.0.0"
          JAR="$SDK/platforms/android-35/android.jar"
          OUT="$PWD/JasonHome2Android/build"
          mkdir -p "$OUT/classes" "$OUT/dex"
          "$BT/aapt2" link -o "$OUT/unsigned.apk" -I "$JAR" --manifest JasonHome2Android/AndroidManifest.xml --min-sdk-version 26 --target-sdk-version 35
          javac --release 17 -cp "$JAR" -d "$OUT/classes" JasonHome2Android/src/com/jasonhome2/app/*.java
          "$BT/d8" --min-api 26 --lib "$JAR" --output "$OUT/dex" "$OUT/classes/com/jasonhome2/app/"*.class
          cp "$OUT/unsigned.apk" "$OUT/with-dex.apk"
          (cd "$OUT/dex" && zip -q -u "$OUT/with-dex.apk" classes.dex)
          "$BT/zipalign" -f 4 "$OUT/with-dex.apk" Jason-Home-2-2.0.11-ORACLE-RELAY-UNSIGNED.apk
          "$BT/aapt2" dump badging Jason-Home-2-2.0.11-ORACLE-RELAY-UNSIGNED.apk > "$OUT/badging.txt"
          grep "package: name='com.jasonhome2.app' versionCode='12' versionName='2.0.11'" "$OUT/badging.txt"
          if grep -q 'permission.BLUETOOTH' "$OUT/badging.txt"; then exit 1; fi
          if grep -q 'android.bluetooth' JasonHome2Android/src/com/jasonhome2/app/CurtainBridge.java; then exit 1; fi
          tar -czf android-tools.tar.gz -C "$SDK/build-tools/35.0.0" lib/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Jason-Home-2-Relay-Unsigned
          path: |
            Jason-Home-2-2.0.11-ORACLE-RELAY-UNSIGNED.apk
            android-tools.tar.gz
  sign:
    needs: [firmware, apk]
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@v4
        with: {name: Jason-Home-2-Relay-Unsigned, path: relay-sign}
      - name: Sign with the established key and verify identity
        shell: bash
        run: |
          set -euo pipefail
          cd relay-sign
          tar -xzf android-tools.tar.gz
          export JH2_SIGN_PASS="$(cat /home/ubuntu/.jason-home-signing/password)"
          java -jar lib/apksigner.jar sign --ks /home/ubuntu/.jason-home-signing/jason-home-release.jks --ks-key-alias jason-home --ks-pass env:JH2_SIGN_PASS --key-pass env:JH2_SIGN_PASS --out Jason-Home-2-2.0.11-ORACLE-RELAY-SIGNED.apk Jason-Home-2-2.0.11-ORACLE-RELAY-UNSIGNED.apk
          java -jar lib/apksigner.jar verify --verbose --print-certs Jason-Home-2-2.0.11-ORACLE-RELAY-SIGNED.apk | tee verify.txt
          grep -qi '76b28efd4f5d132ad3048f19bae6c35aa5f84c4a390e98c80deeebc0c3e73ae1' verify.txt
          sha256sum Jason-Home-2-2.0.11-ORACLE-RELAY-SIGNED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jason-Home-2-Relay-Signed
          path: relay-sign/Jason-Home-2-2.0.11-ORACLE-RELAY-SIGNED.apk
  deploy:
    needs: [firmware, apk]
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 15
    concurrency:
      group: jason-home-oracle-production
      cancel-in-progress: false
    steps:
      - name: Restore runner checkout ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Back up, restore-test, stage, deploy and verify isolated gateway
        run: sudo --preserve-env=GITHUB_RUN_ID,GITHUB_SHA python3 .github/scripts/deploy-curtain-relay.py
  publish:
    needs: [sign, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: Jason-Home-2-NanoC6-1.1.1, path: relay-release}
      - uses: actions/download-artifact@v4
        with: {name: Jason-Home-2-Relay-Signed, path: relay-release}
      - name: Verify firmware, sign channel and publish exact artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_SIGNING_KEY_B64: ${{ secrets.ANDERSON_OTA_SIGNING_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          python relay-release/flash.py --verify-only
          test -n "$OTA_SIGNING_KEY_B64"
          key="$RUNNER_TEMP/jh2-relay-ota.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$OTA_SIGNING_KEY_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          python JasonHome2NanoC6/tools/sign_manifest.py --key "$key" --release relay-release/release.json --output relay-release/latest.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          p=Path('relay-release');m=json.loads((p/'release.json').read_text());assert m['commit']==os.environ['GITHUB_SHA']
          apk=p/'Jason-Home-2-2.0.11-ORACLE-RELAY-SIGNED.apk';m['apk']={'name':apk.name,'bytes':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'package':'com.jasonhome2.app','version':'2.0.11','certificateSha256':'76b28efd4f5d132ad3048f19bae6c35aa5f84c4a390e98c80deeebc0c3e73ae1'}
          m['deployment']={'gatewayBuild':os.environ['GITHUB_SHA'],'automationOwner':'oracle','eufyReady':4,'events':212,'snapshotRestoreVerified':True,'physicalBridgeVerified':False,'requiresBridgePairing':True}
          (p/'integration-release.json').write_text(json.dumps(m,indent=2)+'\n')
          with (p/'SHA256SUMS').open('a') as f:f.write(m['apk']['sha256']+'  '+apk.name+'\n')
          PY
          python - <<'PYTHON'
          import json,os,urllib.request
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def call(path,data=None):
           h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
           with urllib.request.urlopen(urllib.request.Request(api+path,None if data is None else json.dumps(data).encode(),h),timeout=45) as r:return json.load(r)
          source=os.environ['GITHUB_SHA'];repo=call('');default=call('/git/ref/heads/'+repo['default_branch'])['object']['sha']
          src=call('/git/commits/'+source);main=call('/git/commits/'+default)
          entries=call('/git/trees/'+main['tree']['sha']+'?recursive=1')['tree'];workflows=next(x['sha'] for x in entries if x['path']=='.github/workflows' and x['type']=='tree')
          tree=call('/git/trees',{'base_tree':src['tree']['sha'],'tree':[{'path':'.github/workflows','mode':'040000','type':'tree','sha':workflows}]})['sha']
          release=call('/git/commits',{'message':'Jason Home 2 curtain relay release source; compiled inputs unchanged','tree':tree,'parents':[default,source]})['sha']
          call('/git/refs',{'ref':'refs/heads/jh2-curtain-release-1.1.1','sha':release})
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('RELEASE_SOURCE='+release+'\n')
          PYTHON
          TAG=jason-home-2-nanoc6-v1.1.1
          gh release create "$TAG" --target "$RELEASE_SOURCE" --prerelease --latest=false --title 'Jason Home 2 · Oracle Curtain Relay 1.1.1 / APK 2.0.11' --notes-file JasonHome2NanoC6/TESTING.md
          gh release upload "$TAG" relay-release/*.bin relay-release/*.apk relay-release/*.zip relay-release/release.json relay-release/integration-release.json relay-release/SHA256SUMS relay-release/INSTALL.md relay-release/TESTING.md relay-release/latest.json
          mkdir downloaded
          gh release download "$TAG" -p 'jh2-runtime-1.1.1.bin' -p 'Jason-Home-2-2.0.11-ORACLE-RELAY-SIGNED.apk' -D downloaded
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('relay-release/integration-release.json').read_text())
          for n,s in [('jh2-runtime-1.1.1.bin',m['files']['jh2-runtime-1.1.1.bin']),(m['apk']['name'],m['apk'])]:
           b=Path('downloaded',n).read_bytes();assert len(b)==s['bytes'] and hashlib.sha256(b).hexdigest()==s['sha256']
          print('Public firmware and signed APK byte size/SHA-256 verified.')
          PY
          cp relay-release/latest.json "$RUNNER_TEMP/jh2-relay-latest.json"
          git config user.name 'Jason Home 2 release'
          git config user.email '325178451+jlc3718-source@users.noreply.github.com'
          git fetch origin jh2-nanoc6-ota
          git checkout -B jh2-nanoc6-ota FETCH_HEAD
          cp "$RUNNER_TEMP/jh2-relay-latest.json" latest.json
          git add latest.json
          git commit -m 'Publish signed Jason Home 2 Oracle curtain relay 1.1.1'
          git push origin HEAD:jh2-nanoc6-ota
