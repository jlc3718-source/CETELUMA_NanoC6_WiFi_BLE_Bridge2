name: Publish Anderson Home v3.0.16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-anderson-v3.0.16.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: '10286923411'
      ARTIFACT_ZIP_SHA256: 'ef2dc9199097842856c52d95dd67544cea03e708b5614ab8a10c51de97d337e7'
      TARGET_COMMIT: '0c79c057227dd620b6892865cc21fa92cb7eba2f'
      BIN_SHA256: 'be500ce60c4848f729bd689d23ac6a72e5d6f9c98e1c6e15a86a8cac0fcff60d'
      BIN_BYTES: '1818656'
      TAG: 'anderson-v3.0.16'
    steps:
      - uses: actions/checkout@v4
      - name: Download exact verified branch artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/anderson.zip
          echo "${ARTIFACT_ZIP_SHA256}  /tmp/anderson.zip" | sha256sum -c -
          mkdir -p /tmp/anderson
          unzip -q /tmp/anderson.zip -d /tmp/anderson
      - name: Verify exact firmware and provenance
        run: |
          test "$(stat -c %s /tmp/anderson/and_3.0.16.bin)" = "${BIN_BYTES}"
          echo "${BIN_SHA256}  /tmp/anderson/and_3.0.16.bin" | sha256sum -c -
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('/tmp/anderson/release.json').read_text())
          assert m['version']=='3.0.16'
          assert m['commit']==os.environ['TARGET_COMMIT']
          f=m['files']['and_3.0.16.bin']
          assert f['bytes']==int(os.environ['BIN_BYTES'])
          assert f['sha256']==os.environ['BIN_SHA256']
          assert int(m['ota_slot_bytes'])==0x1E0000
          PY
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "$(gh release view "${TAG}" --json tagName --jq .tagName 2>/dev/null || true)"
          gh release create "${TAG}" \
            /tmp/anderson/and_3.0.16.bin \
            /tmp/anderson/release.json \
            --target "${TARGET_COMMIT}" \
            --title 'Anderson Home v3.0.16' \
            --notes 'Adds Settings > Live Color Tuning with an embedded RGB color wheel, exact live HEX and RGB readout, on-screen swatch preview, switchable live-to-lights updates, an explicit Preview on Lights button, and debounced temporary Solid/Static physical preview. Color tuning does not save or rewrite event/theme colors. Existing Wi-Fi recovery, scheduled maintenance reboots, BLE, profiles/PINs, schedules, saved settings, OTA partition layout, recovery paths, and v3 dashboard behavior are preserved. Exact verified build commit: 0c79c057227dd620b6892865cc21fa92cb7eba2f. BIN SHA-256: be500ce60c4848f729bd689d23ac6a72e5d6f9c98e1c6e15a86a8cac0fcff60d.' \
            --latest
      - name: Retain newest release plus one backup
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_RELEASES: '1'
        run: bash .github/scripts/anderson-retention.sh
