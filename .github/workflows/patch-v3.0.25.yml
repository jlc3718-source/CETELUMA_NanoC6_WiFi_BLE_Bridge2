name: Patch v3.0.25 Event State and Storage Health
on:
  push:
    branches: ['codex/v3.0.25-eventstate-storage-health']
    paths: ['.github/workflows/patch-v3.0.25.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.0.25 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Repair event-state NVS namespace.
          p=Path('firmware/src/EventState.cpp')
          s=p.read_text()
          old='static constexpr const char* EVENT_STATE_NS = "anderson-evstate";'
          new='static constexpr char EVENT_STATE_NS[] = "anderson-evst";\nstatic_assert(sizeof(EVENT_STATE_NS) - 1 <= 15, "NVS namespace must fit 15 characters");'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # 2) Main firmware: preservation-safe migration, write error handling,
          # reboot storage-health optimization, and NVS diagnostics.
          p=Path('firmware/src/main.cpp')
          s=p.read_text()
          assert '#include <esp_timer.h>' in s
          s=s.replace('#include <esp_timer.h>','#include <esp_timer.h>\n#include <nvs_flash.h>',1)
          assert 'static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.0.24";' in s
          s=s.replace('static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.0.24";','static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.0.25";',1)

          old='''// v3.0.20 master calendar migration: replace built-in event/favorite state once while\n// preserving Wi-Fi, BLE, PINs, custom lights, and custom schedules.\n'''
          new='''// Complete the legacy calendar marker without resetting user data.\n// The compiled catalog, eventStateBegin(), and seedMasterSceneFavoritesV4() provide defaults.\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''static bool clearCustomPresetFavorites(){\n  JsonDocument presets;if(deserializeJson(presets,presetStoreRaw())||!presets.is<JsonArray>())return false;bool changed=false;\n  for(JsonObject p:presets.as<JsonArray>())if(p["favorite"]|false){p["favorite"]=false;changed=true;}\n  if(!changed)return true;String out;serializeJson(presets,out);return customFileWrite("/custom_lights.json",out);\n}\n'''
          assert old in s
          s=s.replace(old,'',1)

          old='''  if(!clearCustomPresetFavorites()||!writeMasterFavoriteColors())return false;\n  Preferences ep;if(!ep.begin("anderson-event",false))return false;bool cleared=ep.clear();ep.end();if(!cleared)return false;\n  if(!eventStateResetAll())return false;\n  auto&s=store.get();s.enabledMask=UINT64_MAX;s.favoriteMask=0;s.leadDays=0;s.trailDays=0;s.overlap=0;store.saveAll();\n'''
          new='''  // eventStateBegin() initializes the corrected event-state store before this call.\n  // A failed legacy migration must not erase subsequent event edits or custom favorites.\n  if(!writeMasterFavoriteColors())return false;\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''static bool storageSelfTest(){Preferences p;if(!p.begin("anderson-test",false))return false;const String t="ANDERSON_STORAGE_OK";size_t n=p.putString("rw",t);String r=p.getString("rw","");p.remove("rw");p.end();return n==t.length()&&r==t;}\n'''
          new='''static bool storageReadOnlyHealthCheck(){\n  Preferences p;if(!p.begin("anderson",true))return false;(void)p.getString("tz","");p.end();\n  return jsonArrayValid(presetStoreRaw())&&jsonArrayValid(scheduleStoreRaw());\n}\nstatic bool storageWriteSelfTest(){Preferences p;if(!p.begin("anderson-test",false))return false;const String t="ANDERSON_STORAGE_OK";size_t n=p.putString("rw",t);String r=p.getString("rw","");p.remove("rw");p.end();return n==t.length()&&r==t;}\nstatic bool storageHealthCheck(){\n  const bool readOk=storageReadOnlyHealthCheck();String lastTested;Preferences marker;\n  if(marker.begin("anderson",true)){lastTested=marker.getString("storver","");marker.end();}\n  if(readOk&&lastTested==ANDERSON_FIRMWARE_VERSION)return true;\n  if(!storageWriteSelfTest())return false;\n  if(!marker.begin("anderson",false))return false;const String version=ANDERSON_FIRMWARE_VERSION;size_t wrote=marker.putString("storver",version);String verify=marker.getString("storver","");marker.end();\n  return wrote==version.length()&&verify==version;\n}\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''    if(!d["enabled"].isNull())eventStateSetEnabled(i,d["enabled"].as<bool>());\n    if(!d["favorite"].isNull())eventStateSetFavorite(i,d["favorite"].as<bool>());\n'''
          new='''    if(!d["enabled"].isNull()&&!eventStateSetEnabled(i,d["enabled"].as<bool>())){\n      server.send(500,"text/plain","Event enabled preference write failed");return;\n    }\n    if(!d["favorite"].isNull()&&!eventStateSetFavorite(i,d["favorite"].as<bool>())){\n      server.send(500,"text/plain","Event favorite preference write failed");return;\n    }\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''  d["bleConnected"]=ble.connected();d["bleCount"]=ble.connectedCount();d["appBytes"]=appBytes;d["slotBytes"]=slotBytes;d["appFreeBytes"]=slotBytes>appBytes?slotBytes-appBytes:0;\n'''
          new='''  d["bleConnected"]=ble.connected();d["bleCount"]=ble.connectedCount();d["appBytes"]=appBytes;d["slotBytes"]=slotBytes;d["appFreeBytes"]=slotBytes>appBytes?slotBytes-appBytes:0;\n  nvs_stats_t nvsStats{};if(nvs_get_stats(nullptr,&nvsStats)==ESP_OK){d["nvsUsedEntries"]=(uint32_t)nvsStats.used_entries;d["nvsFreeEntries"]=(uint32_t)nvsStats.free_entries;d["nvsTotalEntries"]=(uint32_t)nvsStats.total_entries;}\n  d["storageHealth"]=customFsReady?"OK":"Failed";d["storageWriteTestPolicy"]="Firmware upgrade or read failure";\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='customFsReady=storageSelfTest();'
          assert old in s
          s=s.replace(old,'customFsReady=storageHealthCheck();',1)
          p.write_text(s)

          # 3) UI: recover checkbox state after a rejected write and show NVS health.
          p=Path('firmware/web/index.html')
          s=p.read_text()
          old="async function eventChange(id,change){try{await post('/api/event',{id,...change});await Promise.all([loadEvents(),loadFavorites()]);status('Event preference saved.')}catch(e){status(API_MODE?'Save failed: '+e.message:'Preview mode — preference simulated.')}}"
          new="""async function eventChange(id,change){\n  try{\n    await post('/api/event',{id,...change});\n    await Promise.all([loadEvents(),loadFavorites()]);\n    status('Event preference saved.');\n  }catch(e){\n    await Promise.all([loadEvents(),loadFavorites()]);\n    status(API_MODE?'Save failed: '+e.message:'Preview mode — preference simulated.');\n  }\n}"""
          assert old in s
          s=s.replace(old,new,1)
          old="<strong>Reboot schedule:</strong> ${d.rebootSchedule||'12:00 AM • 6:00 AM • 12:00 PM • 6:00 PM'}"
          new="<strong>Reboot schedule:</strong> ${d.rebootSchedule||'12:00 AM • 6:00 AM • 12:00 PM • 6:00 PM'}<br><strong>NVS:</strong> ${d.storageHealth||'—'} • ${d.nvsUsedEntries??'—'} used / ${d.nvsFreeEntries??'—'} free entries • write test: ${d.storageWriteTestPolicy||'upgrade/failure only'}"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # 4) Version and release documentation.
          Path('FIRMWARE_VERSION.txt').write_text('3.0.25\n')
          r=Path('README.md');t=r.read_text();assert 'v3.0.24' in t;t=t.replace('v3.0.24','v3.0.25',1);r.write_text(t)
          Path('firmware/RELEASE_NOTES_v3.0.25.md').write_text('''# Anderson Home v3.0.25\n\n- Repairs built-in event Favorite/Enabled persistence by moving event state to the valid 15-character NVS namespace `anderson-evst` and adds a compile-time namespace-length guard.\n- Makes the legacy master-calendar migration non-destructive so a pending migration cannot erase custom favorites, event overrides, or schedule settings.\n- Returns HTTP 500 when event Enabled/Favorite storage writes fail; the web UI reloads Events and Home Favorites after a rejected save.\n- Optimizes scheduled reboots: normal reboots perform read-only storage health validation instead of a write/delete flash test.\n- Performs the write/read/delete NVS self-test only after a firmware-version change or when the read-only health check fails, then records the tested firmware version.\n- Adds NVS used/free entry telemetry and storage-health status to System Monitor.\n- Preserves the approved 28 Scene Favorites, 210-event calendar, locked 9-color palette, independent Schedule 1/2 controls, all five manual speed choices, Wi-Fi, BLE, PINs, custom lights/schedules, partitions, and signed OTA trust.\n''')
          PY
      - name: Verify focused changes
        run: |
          grep -q 'EVENT_STATE_NS\[\] = "anderson-evst"' firmware/src/EventState.cpp
          grep -q 'NVS namespace must fit 15 characters' firmware/src/EventState.cpp
          ! grep -q 'anderson-evstate' firmware/src/EventState.cpp
          grep -q 'storageReadOnlyHealthCheck' firmware/src/main.cpp
          grep -q 'storageWriteSelfTest' firmware/src/main.cpp
          grep -q 'storageHealthCheck' firmware/src/main.cpp
          grep -q 'storageWriteTestPolicy' firmware/src/main.cpp
          grep -q 'Event favorite preference write failed' firmware/src/main.cpp
          ! grep -q 'clearCustomPresetFavorites' firmware/src/main.cpp
          grep -q 'await Promise.all(\[loadEvents(),loadFavorites()\]);' firmware/web/index.html
          grep -q '^3.0.25$' FIRMWARE_VERSION.txt
      - name: Commit patch
        run: |
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git add firmware/src/EventState.cpp firmware/src/main.cpp firmware/web/index.html FIRMWARE_VERSION.txt README.md firmware/RELEASE_NOTES_v3.0.25.md
          git commit -m 'Repair event persistence and optimize reboot storage checks for v3.0.25'
          git push origin HEAD:codex/v3.0.25-eventstate-storage-health
