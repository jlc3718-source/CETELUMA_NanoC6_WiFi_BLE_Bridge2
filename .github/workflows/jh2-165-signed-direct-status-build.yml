name: JH2 1.1.65 Signed Direct Nano Status Dashboard Build
on:
  push:
    branches: [release/jh2-nano-direct-status-165-20261022]
    paths:
      - 'JasonHome2NanoC6_IDF/**'
      - '.github/workflows/jh2-165-signed-direct-status-build.yml'
permissions: {contents: write, actions: read}
concurrency:
  group: jh2-production-signed-ota-singleton
  cancel-in-progress: false
jobs:
  build-and-package:
    name: Build native signed web runtime and full recovery backup (no flash)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Source safeguards and 88-effect parser tests
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            JasonHome2NanoC6_IDF/main/effectlist.c \
            JasonHome2NanoC6_IDF/tests/effectlist_test.c \
            -o /tmp/jh2-effectlist
          /tmp/jh2-effectlist
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            JasonHome2NanoC6_IDF/main/native_slot_guard.c \
            JasonHome2NanoC6_IDF/tests/native_slot_guard_test.c \
            -o /tmp/jh2-native-slot-guard
          /tmp/jh2-native-slot-guard
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            -I JasonHome2NanoC6_IDF/main \
            JasonHome2NanoC6_IDF/main/native_slot_guard.c \
            JasonHome2NanoC6_IDF/tests/status_2104_guard_test.c \
            -o /tmp/jh2-status-2104
          /tmp/jh2-status-2104
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            JasonHome2NanoC6_IDF/main/native_slot_guard.c \
            JasonHome2NanoC6_IDF/main/native_slot_upload.c \
            JasonHome2NanoC6_IDF/tests/native_slot_upload_test.c \
            -o /tmp/jh2-native-ram-upload
          /tmp/jh2-native-ram-upload
          python3 - <<'PY'
          from pathlib import Path
          a=Path('JasonHome2NanoC6_IDF/main')
          bridge=(a/'bridge.c').read_text()
          web=(a/'web_recovery.c').read_text()
          signed=(a/'signed_ota.c').read_text()
          main=(a/'main.c').read_text()
          assert 'NATIVE_FW_VERSION "1.1.65"' in bridge
          assert 'STATUS_HTML' in web and '.uri="/status"' in web
          assert 'nativeRawPower2103Seen' in main and 'nativeRawPower2105Seen' in main
          assert 'nativeRawPlayback2630Seen' in main
          assert 'jh2_bridge_set_auto_update_enabled' in bridge
          assert 'nvs_commit(n)' in bridge and 'jh2_load_auto_ota()' in bridge
          assert 'next_auto_ota_check_us' in bridge
          assert 'jh2_bridge_signed_firmware(true,newer' in bridge
          assert 'jh2_asset_stream_active()' in bridge
          assert 'jh2_native_sequence_running()' in bridge
          assert 'autoUpdate",jh2_bridge_auto_update_enabled()' in bridge
          assert 'Now Playing' not in web and 'drawPlaying' not in web and 'refreshPlaying' not in web
          assert 'jh2_ble_playback_status(o);' in web and 'controllerPlayback' in main
          assert 'firmware_auto_post' in web and '/api/firmware/auto' in web
          assert 'signedAutoUpdate' in web and 'jh2_bridge_auto_update_enabled()' in web
          assert '1.1.65-direct-status' in web
          assert 'jh2_native_curtain_reboot()' in web
          assert 'jh2_queue_signed_update(manifest' in bridge and 'mbedtls_pk_verify(' in signed
          assert 'format_if_mount_failed=false' in web and 'format_if_mount_failed=false' in bridge
          assert 'nvs_flash_erase(' not in bridge+web+main
          assert '/api/firmware/check' in web and '/api/firmware/install' in web
          assert 'jh2_enter_local_recovery()' in web
          assert 'ble_att_set_preferred_mtu(517);' in main
          assert '/api/curtain-bridge/preview/' in bridge
          print('FINAL_162_SOURCE_VALIDATED')

          PY
      - name: Enable Oracle, browser compatibility and safe catalog acceptance
        shell: bash
        run: |
          cat >> JasonHome2NanoC6_IDF/sdkconfig.defaults <<'EOF'
          CONFIG_JH2_NATIVE_ENABLE_ORACLE=y
          CONFIG_JH2_NATIVE_BROWSER_OTA_COMPAT=y
          CONFIG_JH2_NATIVE_READONLY_ACCEPTANCE=n
          EOF
      - name: Compile ESP-IDF 5.5.1 ESP32-C6 for 4MB, no flash
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32c6
          path: JasonHome2NanoC6_IDF
          command: idf.py build
      - name: Verify active ESP-IDF controller and host Msys configurations
        shell: bash
        run: |
          set -euo pipefail
          grep -x 'CONFIG_BT_NIMBLE_MSYS_2_BLOCK_SIZE=768' JasonHome2NanoC6_IDF/sdkconfig
          echo 'RX16_ACTIVE_NIMBLE_MSYS2_768_CONFIRMED'
      - name: Assemble and checksum complete 0x0 flash image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build-output
          gh release download jason-home-2-nanoc6-v1.1.27 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'jh2-full-install-1.1.27.bin' \
            --pattern 'SHA256SUMS' --dir build-output --clobber
          (
            cd build-output
            grep -F 'jh2-full-install-1.1.27.bin' SHA256SUMS | sha256sum -c -
          )
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('build-output')
          old=(root/'jh2-full-install-1.1.27.bin').read_bytes()
          app=Path('JasonHome2NanoC6_IDF/build/jh2_native_ble_probe.bin').read_bytes()
          if len(app)>=2546624:raise ValueError('optimized image is not smaller than 1.1.62 baseline')
          if len(old)!=0x400000:raise ValueError('base factory bundle must be exactly 4 MB')
          if not 0x120000<len(app)<=0x290000:raise ValueError('app violates factory OTA accepted size')
          if old[0]!=0xe9 or old[0x10000]!=0xe9:
              raise ValueError('factory updater or bootloader invalid')
          if app[0]!=0xe9 or app[12]!=13 or app[13]!=0:
              raise ValueError('runtime is not a valid ESP32-C6 image')
          if b'jason-home-2-nanoc6-runtime-v1' not in app:
              raise ValueError('missing factory-accepted runtime identity')
          if b'1.1.65-direct-status' not in app or b'/firmware/recovery' not in app:
              raise ValueError('native firmware browser OTA service missing')
          full=bytearray(old)
          full[0x130000:0x3c0000]=b'\xff'*0x290000
          full[0x130000:0x130000+len(app)]=app
          if full[:0x130000]!=old[:0x130000]:
              raise ValueError('factory updater/bootloader/NVS or partition changed')
          if full[0x3c0000:]!=old[0x3c0000:]:
              raise ValueError('recovery LittleFS template modified')
          if len(full)!=0x400000 or full[0x130000]!=0xe9:
              raise ValueError('not a valid 0x0 full flash image')
          fn=root/'JH2-RX16-2M-PHY-1.1.65-FULL-FLASH-0x0.bin'
          fn.write_bytes(full)
          ota=root/'JH2-RX16-2M-PHY-1.1.65-RUNTIME-OTA.bin'
          ota.write_bytes(app)
          manifest={
              'product':'Jason Home 2 NanoC6','version':'1.1.65-direct-status',
              'commit':os.environ.get('GITHUB_SHA'),'esp_idf':'5.5.1','target':'esp32c6',
              'flash_bytes':len(full),'runtime_offset_hex':'0x130000',
              'factory_offset_hex':'0x10000','storage_offset_hex':'0x3c0000',
              'runtime_bytes':len(app),
              'sha256_full':hashlib.sha256(full).hexdigest(),
              'sha256_ota':hashlib.sha256(app).hexdigest(),
              'factory_preserved':True,'local_firmware_web':True,
              'setup_ap':True,'oracle_enabled':True,'auto_ota':True,
              'physical_validation':'NOT TESTED: initial full-flash only'
          }
          (root/'BUILD-MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'SHA256SUMS-NEW.txt').write_text(
              manifest['sha256_full']+'  '+fn.name+'\n'+
              manifest['sha256_ota']+'  '+ota.name+'\n')
          print('FULL_IMAGE_VERIFIED',json.dumps(manifest,indent=2))
          PY
          cat > build-output/README-FIRST.md <<'EOF'
          # Jason Home 2 NanoC6 RX3 Deferred BLE Catalog + OTA Recovery v1.1.65 (ESP-IDF)

          EXPERIMENTAL: CI COMPILED AND PACKAGED; PHYSICAL FUNCTIONALITY NOT YET VERIFIED.

          FULL INSTALL: JH2-RX16-2M-PHY-1.1.65-FULL-FLASH-0x0.bin - exactly 4,194,304 bytes. USB-flash at 0x0.
          RUNTIME OTA: JH2-RX16-2M-PHY-1.1.65-RUNTIME-OTA.bin - for the local /firmware browser updater only.

          IMPORTANT: A complete 0x0 flash overwrites NVS and LittleFS, including your current
          Wi-Fi/Oracle credentials. Back up the chip privately if you need to preserve them.
          For first-time setup, connect to Wi-Fi SSID Jason-Home-2-Setup, password JasonHome2,
          then visit http://192.168.4.1/setup and enter your Wi-Fi, Oracle endpoint, bridge ID
          and bridge token if the original image contains no valid credentials.

          USB command example (replace COM4):
              python -m pip install --user esptool
              python -m esptool --chip esp32c6 --port COM4 write-flash 0x0 JH2-RX16-2M-PHY-1.1.65-FULL-FLASH-0x0.bin

          Local firmware web:
          http://jason-home-2.local/firmware OR http://192.168.4.1/firmware on Setup AP
          POST /firmware/recovery requests the existing 1.1.27 factory browser updater.
          Always use the runtime OTA BIN in the browser, NOT the 4MB full-flash BIN.

          Original updater at 0x10000, runtime OTA0 at 0x130000.
          Native slot writes are validated for the user-approved CID 83928 only; unrelated effects are protected. Local web pages do not enforce IP restrictions; do not forward Nano port 80 to the public internet. Only a fresh, unique test-CID mapping can authorize its replacement. Automatic signed OTA enabled with NVS preference and signature validation.
          EOF
          (
            cd build-output
            sha256sum -c SHA256SUMS-NEW.txt
            test "$(stat -c %s JH2-RX16-2M-PHY-1.1.65-FULL-FLASH-0x0.bin)" -eq 4194304
          )
          echo "BUILD_AND_SIGN_ONLY_NO_ORACLE_STAGE_NO_OTA"
      - name: ECDSA-sign runtime-only OTA and publish v1.1.65
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          OTA_SIGNING_KEY_B64: '${{ secrets.ANDERSON_OTA_SIGNING_KEY_B64 }}'
        run: |
          set -euo pipefail
          test -n "$OTA_SIGNING_KEY_B64"
          mkdir -p signed-package
          cp build-output/JH2-RX16-2M-PHY-1.1.65-RUNTIME-OTA.bin signed-package/jh2-runtime-1.1.65.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('signed-package')
          data=(root/'jh2-runtime-1.1.65.bin').read_bytes()
          assert 0x120000<len(data)<=0x290000 and data[0]==0xe9
          assert b'1.1.65-direct-status' in data
          release={'product':'jason-home-2-nanoc6','version':'1.1.65','commit':os.environ['GITHUB_SHA'],
                   'files':{'jh2-runtime-1.1.65.bin':{'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}}}
          (root/'release.json').write_text(json.dumps(release,indent=2)+'\n')
          PY
          key="$RUNNER_TEMP/jh2-ota-sign.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$OTA_SIGNING_KEY_B64" | base64 -d > "$key"
          chmod 600 "$key"
          python3 JasonHome2NanoC6/tools/sign_manifest.py --key "$key" --release signed-package/release.json --output signed-package/latest.json
          python3 - <<'PY'
          import base64,json,subprocess,tempfile
          from pathlib import Path
          m=json.loads(Path('signed-package/latest.json').read_text())
          assert m['schema']==1 and 'version=1.1.65\n' in m['payload']
          with tempfile.TemporaryDirectory() as d:
              p=Path(d);(p/'payload').write_text(m['payload'])
              (p/'signature').write_bytes(base64.b64decode(m['signature'],validate=True))
              subprocess.run(['openssl','dgst','-sha256','-verify','remote-update/anderson_ota_signing_public.pem',
                              '-signature',str(p/'signature'),str(p/'payload')],check=True)
          print('JH2_165_SIGNED_MANIFEST_VERIFIED')
          PY
          if gh release view jason-home-2-nanoc6-v1.1.65 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists: refusing to overwrite';exit 1
          fi
          gh release create jason-home-2-nanoc6-v1.1.65 signed-package/jh2-runtime-1.1.65.bin             signed-package/latest.json signed-package/release.json --repo "$GITHUB_REPOSITORY"             --title "Jason Home 2 NanoC6 1.1.65 — Direct Nano Status Dashboard"             --notes "Runtime-only signed OTA preserving recovery partition, NVS, BLE pairing and Oracle. Removes redundant compatibility padding, preserves factory OTA identity, unchanged flash layout, BLE pairing, Oracle, scheduling, effects and automatic signed update preference."
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-1.1.65-FINAL-SIGNED-OTA
          path: |
            signed-package/jh2-runtime-1.1.65.bin
            signed-package/latest.json
            signed-package/release.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload full-flash and OTA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JH2-RX16-2M-PHY-1.1.65-FULL-0x0-AND-OTA
          path: |
            build-output/JH2-RX16-2M-PHY-1.1.65-FULL-FLASH-0x0.bin
            build-output/JH2-RX16-2M-PHY-1.1.65-RUNTIME-OTA.bin
            build-output/README-FIRST.md
            build-output/BUILD-MANIFEST.json
            build-output/SHA256SUMS-NEW.txt
          retention-days: 21
          if-no-files-found: error

