name: JH2 1.1.55 Stage Verified Nano Local GIF OTA
on:
  push:
    branches: [codex/jh2-slot-inventory-fix-20261018]
    paths: ['.github/workflows/jh2-154-stage-signed-oracle-20261019.yml']
permissions: {contents: read, actions: read}
concurrency: {group: jh2-production-signed-ota-singleton, cancel-in-progress: false}
jobs:
  stage:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 20
    steps:
      - name: Fix source checkout owner
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Confirm AI Animation Oracle deployment completed successfully
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/39199311568'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req,timeout=20) as reply: run=json.load(reply)
          assert run['status']=='completed' and run['conclusion']=='success','AI Animation deployment not verified'
          print('AI_ANIMATION_DEPLOY_VERIFIED')
          PY
      - name: Wait for independently verified OTA ECDSA signature
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/39198843268'
          headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN']}
          for _ in range(120):
              request=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(request,timeout=12) as response:run=json.load(response)
              if run['status']=='completed':
                  if run.get('conclusion')!='success':raise SystemExit('SIGNING_FAILED')
                  print('SIGNED_PACKAGE_AVAILABLE',flush=True);break
              time.sleep(7)
          else:raise SystemExit('SIGNING_NOT_READY')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: JH2-1.1.55-SIGNED-NANO-LOCAL-CACHE-OTA
          run-id: 39198843268
          github-token: '${{ github.token }}'
          path: signed-package
      - name: Validate signed firmware and atomically stage Oracle routes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/jh2-stage-signed-155-on-oracle.py
          sudo -n --preserve-env=GITHUB_WORKSPACE python3 .github/scripts/jh2-stage-signed-155-on-oracle.py
