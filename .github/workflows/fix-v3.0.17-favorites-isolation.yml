name: Fix Anderson v3.0.17 Favorite Colors Isolation

on:
  push:
    branches: ['codex/v3.0.17-canonical-palette']
    paths:
      - '.github/scripts/fix-v3.0.17-favorites-isolation.py'
      - '.github/workflows/fix-v3.0.17-favorites-isolation.yml'

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3.0.17-canonical-palette
          fetch-depth: 0
      - name: Apply favorites isolation fix
        run: python .github/scripts/fix-v3.0.17-favorites-isolation.py
      - name: Validate rendered UI and firmware source
        run: |
          python -m pip install -r tools/requirements-build.txt
          npm ci --prefix tools
          python tools/release.py check
          python - <<'PY'
          from pathlib import Path
          m=Path('firmware/src/PaletteMigration.cpp').read_text()
          run=m.split('bool runPaletteColorMigration(){',1)[1].split('\n}',1)[0]
          canon=m.split('static bool canonicalizeCurrentStoredPalette(){',1)[1].split('\n}',1)[0]
          assert 'anderson-colors' not in run+canon
          assert 'favoriteColors' not in run+canon
          w=Path('firmware/web/index.html').read_text()
          assert 'async function saveCurrentColor(){const c=pickerHex();' in w
          print('Favorites isolation validation passed')
          PY
      - name: Remove temporary patch files
        run: |
          rm .github/scripts/fix-v3.0.17-favorites-isolation.py
          rm .github/workflows/fix-v3.0.17-favorites-isolation.yml
      - name: Commit corrected production source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep Favorite Colors exact in v3.0.17'
          git push origin HEAD:codex/v3.0.17-canonical-palette
