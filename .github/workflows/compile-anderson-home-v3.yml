name: Compile Anderson Home NanoC6 All-In-One

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Anderson_Home_Complete_Project.zip'
      - 'anderson_multi_overlay.zip'
      - '.github/workflows/compile-anderson-home-v3.yml'

jobs:
  build-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Extract Anderson Home project
        run: |
          rm -rf build_source
          mkdir build_source
          unzip -q Anderson_Home_Complete_Project.zip -d build_source

      - name: Apply multi-controller overlay
        run: |
          FW=build_source/Anderson_Home_Complete_Project/firmware
          unzip -oq anderson_multi_overlay.zip -d "$FW"
          test -s "$FW/src/BleController.cpp"
          test -s "$FW/include/BleController.h"
          test -s "$FW/include/WebUI.h"
          grep -n 'bleAddress2\|ELK-BLEDDM' "$FW/include/Types.h" "$FW/src/BleController.cpp" | head -20

      - name: Configure NanoC6 large app partition
        run: |
          FW=build_source/Anderson_Home_Complete_Project/firmware/platformio.ini
          sed -i 's/board_build.partitions = default.csv/board_build.partitions = huge_app.csv/' "$FW"
          grep -n 'board_.*flash\|partitions' "$FW" || true

      - name: Compile NanoC6 firmware and factory image
        run: |
          pio run -d build_source/Anderson_Home_Complete_Project/firmware -e m5stack-nanoc6

      - name: Export firmware images
        run: |
          BUILD=build_source/Anderson_Home_Complete_Project/firmware/.pio/build/m5stack-nanoc6
          test -s "$BUILD/firmware.factory.bin"
          test -s "$BUILD/firmware.bin"
          cp "$BUILD/firmware.factory.bin" Anderson_Home_NanoC6_MULTI_ALL_IN_ONE.bin
          cp "$BUILD/firmware.bin" Anderson_Home_NanoC6_MULTI_app_only.bin
          sha256sum Anderson_Home_NanoC6_MULTI_ALL_IN_ONE.bin Anderson_Home_NanoC6_MULTI_app_only.bin
          ls -lh Anderson_Home_NanoC6_MULTI_ALL_IN_ONE.bin Anderson_Home_NanoC6_MULTI_app_only.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-NanoC6-MULTI-CONTROLLER
          path: |
            Anderson_Home_NanoC6_MULTI_ALL_IN_ONE.bin
            Anderson_Home_NanoC6_MULTI_app_only.bin
          if-no-files-found: error
