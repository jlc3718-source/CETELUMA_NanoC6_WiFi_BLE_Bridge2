name: Compile Anderson Home NanoC6 All-In-One

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Anderson_Home_Complete_Project.zip'
      - '.github/workflows/compile-anderson-home-v3.yml'

jobs:
  build-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Extract Anderson Home project
        run: |
          rm -rf build_source
          mkdir build_source
          unzip -q Anderson_Home_Complete_Project.zip -d build_source

      - name: Inspect BLE scan implementation
        run: |
          BASE=build_source/Anderson_Home_Complete_Project/firmware/src
          echo '--- BleController.h ---'
          sed -n '1,260p' "$BASE/BleController.h" || true
          echo '--- BleController.cpp ---'
          sed -n '1,360p' "$BASE/BleController.cpp" || true
          echo '--- main.cpp BLE routes/setup ---'
          grep -n -C 15 -E 'api/ble|ble\.begin|ble\.scan|selectAndConnect|NimBLE|BLE' "$BASE/main.cpp" || true

      - name: Fix Wi-Fi scan in setup mode
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('build_source/Anderson_Home_Complete_Project/firmware/src/main.cpp')
          s = p.read_text()
          old = '''  server.on("/api/wifi/scan",HTTP_GET,[]{\n    int n=WiFi.scanNetworks(false,true);JsonDocument d;JsonArray a=d["networks"].to<JsonArray>();for(int i=0;i<n;i++){JsonObject x=a.add<JsonObject>();x["ssid"]=WiFi.SSID(i);x["rssi"]=WiFi.RSSI(i);}WiFi.scanDelete();String out;serializeJson(d,out);sendJson(out);\n  });'''
          new = '''  server.on("/api/wifi/scan",HTTP_GET,[]{\n    // ESP32-C6: keep both AP and STA enabled while the setup AP is active,\n    // then perform a synchronous active scan with an explicit dwell time.\n    if(setupAP) WiFi.mode(WIFI_AP_STA); else WiFi.mode(WIFI_STA);\n    WiFi.setSleep(false);\n    WiFi.scanDelete();\n    delay(150);\n    int n=WiFi.scanNetworks(false,true,false,500);\n    JsonDocument d;JsonArray a=d["networks"].to<JsonArray>();\n    if(n>0){\n      for(int i=0;i<n;i++){\n        String ssid=WiFi.SSID(i);\n        if(!ssid.length()) continue;\n        bool duplicate=false;\n        for(JsonObject x:a){if(x["ssid"].as<String>()==ssid){duplicate=true;break;}}\n        if(duplicate) continue;\n        JsonObject x=a.add<JsonObject>();x["ssid"]=ssid;x["rssi"]=WiFi.RSSI(i);\n      }\n    }\n    WiFi.scanDelete();String out;serializeJson(d,out);sendJson(out);\n  });'''
          if old not in s:
              raise SystemExit('Expected Wi-Fi scan handler not found; refusing blind patch')
          p.write_text(s.replace(old,new))
          PY
          SRC=build_source/Anderson_Home_Complete_Project/firmware/src/main.cpp
          grep -n -A 26 'api/wifi/scan' "$SRC"

      - name: Configure NanoC6 large app partition
        run: |
          FW=build_source/Anderson_Home_Complete_Project/firmware/platformio.ini
          sed -i 's/board_build.partitions = default.csv/board_build.partitions = huge_app.csv/' "$FW"
          grep -n 'board_.*flash\|partitions' "$FW" || true

      - name: Compile NanoC6 firmware and factory image
        run: |
          pio run -d build_source/Anderson_Home_Complete_Project/firmware -e m5stack-nanoc6

      - name: Export all-in-one flash image
        run: |
          BUILD=build_source/Anderson_Home_Complete_Project/firmware/.pio/build/m5stack-nanoc6
          test -s "$BUILD/firmware.factory.bin"
          test -s "$BUILD/firmware.bin"
          cp "$BUILD/firmware.factory.bin" Anderson_Home_NanoC6_ALL_IN_ONE.bin
          cp "$BUILD/firmware.bin" Anderson_Home_NanoC6_app_only.bin
          sha256sum Anderson_Home_NanoC6_ALL_IN_ONE.bin Anderson_Home_NanoC6_app_only.bin
          ls -lh Anderson_Home_NanoC6_ALL_IN_ONE.bin Anderson_Home_NanoC6_app_only.bin

      - name: Upload all-in-one firmware
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-NanoC6-WIFI-SCAN-FIX
          path: |
            Anderson_Home_NanoC6_ALL_IN_ONE.bin
            Anderson_Home_NanoC6_app_only.bin
          if-no-files-found: error
