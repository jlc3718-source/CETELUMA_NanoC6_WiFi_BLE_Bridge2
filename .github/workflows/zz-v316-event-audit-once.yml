name: Audit Anderson Event Coverage Once
on:
  push:
    branches: [codex/release-v3.1.6-event-fairness]
    paths:
      - 'tools/audit_event_coverage.py'
      - '.github/workflows/zz-v316-event-audit-once.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit 2026-2037 scheduler coverage
        run: python3 tools/audit_event_coverage.py --start-year 2026 --end-year 2037
