name: JH2 Native 2904 Catalog Packet Inspection (read-only)
on:
  push:
    branches: [codex/jh2-native-espidf-browser-ota-20261017]
    paths: ['.github/workflows/jh2-idf-read-catalog-packets.yml']
permissions: {contents: read}
concurrency:
  group: jh2-native-catalog-read
  cancel-in-progress: false
jobs:
  check:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 3
    steps:
      - name: Read notification headers only, never send any controller commands
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 - <<'PY'
          import json,subprocess,urllib.request,base64,collections
          ins=json.loads(subprocess.check_output(['docker','inspect','jason-home']))[0]
          env=dict(x.split('=',1) for x in ins['Config']['Env'] if '=' in x)
          token=env['JASON_HOME_API_TOKEN']
          base='http://127.0.0.1:8081'
          p=json.dumps({'token':token}).encode()
          req=urllib.request.Request(base+'/api/session',data=p,
              headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=10) as res:
              res.read();cookie=res.headers.get('Set-Cookie','').split(';',1)[0]
          assert cookie.startswith('jh2=')
          def get(path):
              req=urllib.request.Request(base+path,headers={'Cookie':cookie},method='GET')
              with urllib.request.urlopen(req,timeout=12) as resp:return json.load(resp)
          d=get('/api/curtain/notifications?since=0')
          notices=d.get('notifications',[])
          summary=[]
          for n in notices[-80:]:
              try:
                  raw=base64.b64decode(n['data'])
                  op=int.from_bytes(raw[10:12],'big') if len(raw)>=12 else None
                  summary.append({'id':n.get('id'),'bytes':len(raw),'head':list(raw[:4]),
                         'op':op,'frameType':raw[4] if len(raw)>4 else None})
              except Exception as ex:
                  summary.append({'id':n.get('id'),'parseError':type(ex).__name__})
          # Parse only the non-sensitive effect index values from the catalog.
          # This is read-only; no new BLE request or state mutation.
          def vi(b,i):
              n=0;shift=0
              for _ in range(10):
                  if i>=len(b):raise ValueError('truncated varint')
                  x=b[i];i+=1;n|=(x&127)<<shift
                  if not x&128:return n,i
                  shift+=7
              raise ValueError('varint overflow')
          def fields(b):
              out=[];i=0
              while i<len(b):
                  key,i=vi(b,i);wire=key&7;num=key>>3
                  if wire==0:v,i=vi(b,i)
                  elif wire==2:
                      n,i=vi(b,i);v=b[i:i+n];i+=n
                  elif wire==1:v=b[i:i+8];i+=8
                  elif wire==5:v=b[i:i+4];i+=4
                  else:raise ValueError('bad protobuf wire')
                  out.append((num,wire,v))
              return out
          all_effects=set()
          for n in notices[-80:]:
              try:
                  raw=base64.b64decode(n['data'])
                  if len(raw)<24 or int.from_bytes(raw[10:12],'big')!=2904:continue
                  effect_ids=[]
                  for field,wire,payload in fields(raw[24:]):
                      if field!=1 or wire!=2:continue
                      detail=fields(payload)
                      effect_id=next((val for key,kind,val in detail if key==1 and kind==0),None)
                      cid=next((val for key,kind,val in detail if key==4 and kind==0),None)
                      if effect_id is not None and cid is not None:
                          effect_ids.append(effect_id)
                          if 0<=effect_id<88:all_effects.add(effect_id)
                  print('NATIVE_EFFECT_REPLY',json.dumps({'noticeId':n.get('id'),
                       'entries':len(effect_ids),'range':[min(effect_ids),max(effect_ids)] if effect_ids else [],
                       'effectIds':effect_ids}),flush=True)
              except Exception as ex:
                  print('NATIVE_EFFECT_REPLY_PARSE_ERROR',n.get('id'),type(ex).__name__,flush=True)
          print('NATIVE_EFFECT_MISSING',sorted(set(range(88))-all_effects),flush=True)
          print('NATIVE_PACKET_SUMMARY',json.dumps(summary,separators=(',',':')),flush=True)
          print('NATIVE_OPCODE_COUNTS',dict(collections.Counter(str(x.get('op')) for x in summary)),flush=True)
          s=get('/api/curtain/status');c=s.get('curtain') or {}
          print('NATIVE_COUNTERS',json.dumps({'version':s.get('firmware'),'online':s.get('online'),
              'connected':c.get('connected'),'mtu':c.get('mtu'),'unique':c.get('nativeCatalogUnique'),
              'packets':c.get('nativeCatalogPackets'),'notices':c.get('nativeNotificationsSeen'),
              'drops':c.get('nativeNoticeDrops')},sort_keys=True),flush=True)
          PY
