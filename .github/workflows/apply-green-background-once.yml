name: Apply Anderson Green Background Once

on:
  push:
    branches:
      - codex/anderson-green-background
    paths:
      - '.github/workflows/apply-green-background-once.yml'
      - 'firmware/**'
      - 'FIRMWARE_VERSION.txt'
      - 'README.md'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/anderson-green-background
          fetch-depth: 0

      - name: Apply green background and bump firmware once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'ANDERSON_GREEN_BACKGROUND' firmware/web/index.html; then
            echo 'Green background already applied; nothing to do.'
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          p = Path('firmware/web/index.html')
          s = p.read_text()

          replacements = [
              (
                  'body{background:linear-gradient(155deg,#041a38 0%,#0a3f88 48%,#03142b 100%)!important;background-attachment:fixed!important;}',
                  'body{background:linear-gradient(155deg,#062b16 0%,#0b6b2e 48%,#03190c 100%)!important;background-attachment:fixed!important;}'
              ),
              (
                  'background:linear-gradient(155deg,#061934 0%,#0b438d 52%,#04152d 100%)',
                  'background:linear-gradient(155deg,#062b16 0%,#0b6b2e 52%,#03190c 100%)'
              ),
              (
                  '/* ANDERSON_BLUE_BACKGROUND */\nhtml,body{background:#0a3f88!important;background-image:linear-gradient(160deg,#0f5fc4 0%,#0a3f88 48%,#03142b 100%)!important;background-attachment:fixed!important;}',
                  '/* ANDERSON_GREEN_BACKGROUND */\nhtml,body{background:#0b6b2e!important;background-image:linear-gradient(160deg,#18a64a 0%,#0b6b2e 48%,#03190c 100%)!important;background-attachment:fixed!important;}'
              ),
          ]

          for before, after in replacements:
              count = s.count(before)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {before[:80]}')
              s = s.replace(before, after)

          p.write_text(s)
          PY

          python tools/release.py bump
          python tools/release.py prepare

          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git add firmware/web/index.html firmware/src/main.cpp FIRMWARE_VERSION.txt README.md
          git commit -m 'Change Anderson web interface background to green'
          git push origin HEAD:codex/anderson-green-background
