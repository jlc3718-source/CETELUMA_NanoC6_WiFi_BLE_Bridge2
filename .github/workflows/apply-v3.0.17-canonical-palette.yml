name: Apply Anderson v3.0.17 Canonical Palette

on:
  push:
    branches: ['codex/v3.0.17-canonical-palette']
    paths:
      - '.github/scripts/apply-v3.0.17-canonical-palette.py'
      - '.github/workflows/apply-v3.0.17-canonical-palette.yml'

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3.0.17-canonical-palette
          fetch-depth: 0
      - name: Apply calibrated palette patch
        run: python .github/scripts/apply-v3.0.17-canonical-palette.py
      - name: Validate exact canonical palette and favorites isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          event=Path('firmware/src/EventCatalog.cpp').read_text()
          allowed={'FF0000','23018C','05008A','00BD4C','BF0005','FF2900','FF6E00','4DFF00','FFFFFF','360500','220200','000000'}
          vals=set(re.findall(r'0x([0-9A-Fa-f]{6})',event))
          assert vals <= allowed, sorted(vals-allowed)
          web=Path('firmware/web/index.html').read_text()
          for code in ['FF0000','23018C','05008A','00BD4C','BF0005','FF2900','FF6E00','4DFF00']:
              assert '#'+code in web
          mig=Path('firmware/src/PaletteMigration.cpp').read_text()
          assert 'PALETTE_MIGRATION_REVISION=3' in mig
          seg=mig.split('static bool canonicalizeCurrentStoredPalette(){',1)[1].split('\n}',1)[0]
          assert 'anderson-colors' not in seg
          assert Path('FIRMWARE_VERSION.txt').read_text().strip()=='3.0.17'
          print('Canonical palette validation passed')
          PY
      - name: Validate rendered UI and JavaScript
        run: |
          python -m pip install -r tools/requirements-build.txt
          npm ci --prefix tools
          python tools/release.py check
      - name: Remove temporary patch files
        run: |
          rm .github/scripts/apply-v3.0.17-canonical-palette.py
          rm .github/workflows/apply-v3.0.17-canonical-palette.yml
      - name: Commit production source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply calibrated canonical event palette (v3.0.17)'
          git push origin HEAD:codex/v3.0.17-canonical-palette
