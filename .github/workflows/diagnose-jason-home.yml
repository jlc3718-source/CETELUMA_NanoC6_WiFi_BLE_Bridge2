name: Diagnose Jason Home Recent Commands

on:
  push:
    branches: [jason-home-cloudflare-rebuild]
    paths:
      - '.github/workflows/diagnose-jason-home.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - name: Inspect recent Oracle command log
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repo/JasonHomeServer
          python3 - <<'PY'
          import sqlite3, json, datetime
          db=sqlite3.connect('data/jason-home.sqlite')
          rows=db.execute("SELECT at,target,action,ok,detail FROM command_log ORDER BY id DESC LIMIT 80").fetchall()
          for at,target,action,ok,detail in reversed(rows):
              ts=datetime.datetime.fromtimestamp(at/1000,datetime.timezone.utc).isoformat()
              try:
                  d=json.loads(detail) if detail else None
              except Exception:
                  d=detail
              print(json.dumps({"ts":ts,"target":target,"action":action,"ok":bool(ok),"detail":d},separators=(',',':')))
          PY
