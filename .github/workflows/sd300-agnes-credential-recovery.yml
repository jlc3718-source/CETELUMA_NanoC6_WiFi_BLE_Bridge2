name: SD300 Agnes encrypted credential recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sd300-agnes-credential-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decrypt private Agnes API key only on Oracle and restore dedicated key file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          base64 -d agnes-recovery/agnes_key.rsa-oaep-sha256.b64 > "$tmpdir/credential.bin"
          openssl pkeyutl -decrypt -inkey "$HOME/.sd300-agnes-restore/private.pem" -in "$tmpdir/credential.bin" -out "$tmpdir/agnes.key" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          python3 - "$tmpdir/agnes.key" <<'PY'
          import sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_bytes()
          assert 24 <= len(raw) <= 256 and raw.startswith(b'sk-') and b'\n' not in raw, 'Malformed Agnes token'
          print('AGNES_KEY_DECRYPTION_VALID',flush=True)
          PY
          if [ -L /home/ubuntu/agnes-sd300 ]; then echo "unsafe target symlink"; exit 2; fi
          sudo -n install -d -o "$(id -un)" -g "$(id -gn)" -m 700 /home/ubuntu/agnes-sd300
          sudo -n install -o "$(id -un)" -g "$(id -gn)" -m 600 "$tmpdir/agnes.key" /home/ubuntu/agnes-sd300/key
          test -s /home/ubuntu/agnes-sd300/key
          echo "AGNES_PRIVATE_KEY_RESTORED_NO_PLAINTEXT_OUTPUT"
