name: Diagnose Jason Home 2 latency
# Post-final-deploy latency verification
# Triggered from regular chat to capture Jason Home 2 latency before broker-path optimization.
on:
  push:
    branches: [jason-home-2-web]
    paths: ['.github/workflows/diagnose-jason-home-2.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - name: Measure existing and new services without changing lights
        shell: bash
        run: |
          set +e
          TOKEN="$(sed -n 's/^JASON_HOME_API_TOKEN=//p' /home/ubuntu/repo/JasonHomeServer/.env)"
          for path in /api/health /api/calendar /api/status; do
            echo "Original ${path}"
            curl --noproxy '*' -sS -m 20 -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8080${path}"
          done
          echo 'Jason Home 2 health'
          curl --noproxy '*' -sS -m 10 -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' http://127.0.0.1:8081/api/health
          echo 'HTTPS routes'
          for path in /jason-home-2/api/health /api/health; do
            curl --noproxy '*' -sS -m 20 --resolve 150.136.245.51:443:127.0.0.1 -o /dev/null -w "$path HTTP %{http_code} in %{time_total}s\n" "https://150.136.245.51${path}"
          done
          sudo docker ps --format '{{.Names}} {{.Status}}'
          TOKEN="$(sed -n 's/^JASON_HOME_API_TOKEN=//p' /home/ubuntu/repo/JasonHomeServer/.env)"
          curl --noproxy '*' -fsS -m 30 -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/status >/tmp/jh2-command-diagnostic.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/jh2-command-diagnostic.json'))
          print('MQTT connection:',d.get('eufy',{}).get('connection'))
          c=d.get('lastCommand') or {}
          if isinstance(c,str):
              try: c=json.loads(c)
              except Exception: c={'raw':c}
          print('Last command:',{k:c.get(k) for k in ('at','target','queued','sequence','ok','failed','total','error')})
          for item in c.get('detail') or []:
              print('Light:',{k:item.get(k) for k in ('name','ok','error','instance','brokerAccepted','deviceReported','connectionMode')})
          PY
          echo 'Host DNS and TLS reachability'
          python3 - <<'PY'
          import socket,ssl,time
          for host,port in [('mega-us-pr.eufy.com',443),('aiot-mqtt-us.anker.com',8883)]:
              started=time.monotonic()
              try:
                  addresses=socket.getaddrinfo(host,port,type=socket.SOCK_STREAM)
                  print(host,'DNS',sorted({x[4][0] for x in addresses})[:4],flush=True)
                  with socket.create_connection((host,port),timeout=8) as raw:
                      with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as tls:
                          print(host,'TLS',tls.version(),'seconds',round(time.monotonic()-started,2),flush=True)
              except Exception as e: print(host,type(e).__name__,str(e),'seconds',round(time.monotonic()-started,2),flush=True)
          PY
          echo 'Container DNS and TLS reachability'
          sudo docker exec jason-home node -e 'const dns=require("node:dns").promises,tls=require("node:tls");(async()=>{for(const [host,port] of [["mega-us-pr.eufy.com",443],["aiot-mqtt-us.anker.com",8883]]){try{const a=await dns.lookup(host);console.log(host,"DNS",a.address);await new Promise((resolve,reject)=>{const s=tls.connect({host,port,servername:host,timeout:8000},()=>{console.log(host,"TLS",s.getProtocol());s.end();resolve()});s.on("error",reject);s.on("timeout",()=>{s.destroy();reject(Error("timeout"))})})}catch(e){console.log(host,e.message)}}})()'
