name: Implement Anderson Customized Settings Backup v3.1.12

on:
  push:
    branches:
      - work/v3.1.12-customized-backup

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.1.12-customized-backup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration
        run: python tools/apply_customized_backup_v312.py
      - name: Bump and validate
        run: |
          python tools/release.py bump
          python tools/test_regressions.py
          python tools/test_audit_fixes.py
      - name: Commit complete source
        run: |
          rm -f .github/workflows/zz-build-customized-backup-v3.1.12.yml
          rm -f tools/apply_customized_backup_v312.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Add weekly customized settings backup and restore"
          git push origin HEAD:refs/heads/work/v3.1.12-customized-backup
