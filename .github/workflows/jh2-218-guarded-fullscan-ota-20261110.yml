name: JH2 Nano 2.0.18 signed Eufy BLE diagnostic OTA guarded and show-safe
on:
  push:
    branches: [feature/jh2-nano-eufy-from-2.0.14-20261109]
    paths: ['.github/workflows/jh2-218-guarded-fullscan-ota-20261110.yml']
permissions: {contents: read}
concurrency: {group: jh2-218-guarded-diagnostic-ota, cancel-in-progress: false}
jobs:
  upgrade:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed source, preserve startup show and old firmware, guarded OTA, restore show
        shell: bash
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/jh2-218-guarded-ota-20261110.py
          sudo -n --preserve-env=GITHUB_WORKSPACE python3 .github/scripts/jh2-218-guarded-ota-20261110.py
