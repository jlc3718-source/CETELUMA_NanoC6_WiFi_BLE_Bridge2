name: Prepare Anderson v2.0.3 remote-update source
on:
  push:
    branches: ['codex/anderson-v2-0-3-remote-update']
    paths: ['.github/workflows/v203-source-bootstrap.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source patch
        shell: bash
        run: |
          mkdir -p firmware/include firmware/src remote-update tools
          cat > firmware/include/RemoteUpdate.h <<'EOF'
          #pragma once
          #include <Arduino.h>
          String remoteUpdateStatusJson(const char* currentVersion);
          String remoteUpdateCheckJson(const char* currentVersion);
          EOF
          sed -i 's/^          //' firmware/include/RemoteUpdate.h
          cat > remote-update/anderson_ota_signing_public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE3Dw/xqxEPbvkJQAcMeZxBAxwujxN
          kuGHPepzClPYMrJ4h5r8iNlyUFpJZcPI/FXe8+atedYKpIZZB5XlOj964Q==
          -----END PUBLIC KEY-----
          EOF
          sed -i 's/^          //' remote-update/anderson_ota_signing_public.pem
          cat > firmware/src/RemoteUpdate.cpp <<'EOF'
          #include "RemoteUpdate.h"
          #include <ArduinoJson.h>
          #include <HTTPClient.h>
          #include <WiFi.h>
          #include <WiFiClientSecure.h>
          #include <mbedtls/base64.h>
          #include <mbedtls/pk.h>
          #include <mbedtls/sha256.h>
          #include <mbedtls/version.h>

          static constexpr const char* OTA_MANIFEST_URL="https://raw.githubusercontent.com/jlc3718-source/CETELUMA_NanoC6_WiFi_BLE_Bridge2/ota/latest.json";
          static constexpr const char* OTA_RELEASE_PREFIX="https://github.com/jlc3718-source/CETELUMA_NanoC6_WiFi_BLE_Bridge2/releases/download/anderson-v";
          static constexpr size_t OTA_SLOT_BYTES=0x1E0000;
          static constexpr const char OTA_PUBLIC_KEY[]=R"KEY(-----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE3Dw/xqxEPbvkJQAcMeZxBAxwujxN
          kuGHPepzClPYMrJ4h5r8iNlyUFpJZcPI/FXe8+atedYKpIZZB5XlOj964Q==
          -----END PUBLIC KEY-----
          )KEY";
          struct RemoteStatus{bool checked=false,ok=false,signatureValid=false,updateAvailable=false;int httpStatus=0;size_t bytes=0;String availableVersion,sha256,commit,url,message="Not checked yet";};
          static RemoteStatus last;
          static bool allHex(const String&s,size_t n){if(s.length()!=n)return false;for(size_t i=0;i<s.length();i++){char c=s[i];if(!((c>='0'&&c<='9')||(c>='a'&&c<='f')||(c>='A'&&c<='F')))return false;}return true;}
          struct VersionParts{int major=0,minor=0,patch=0;char suffix=0;bool valid=false;};
          static VersionParts parseVersion(const String&input){VersionParts v;String s=input;s.trim();int p1=s.indexOf('.'),p2=p1<0?-1:s.indexOf('.',p1+1);if(p1<=0||p2<=p1+1)return v;String a=s.substring(0,p1),b=s.substring(p1+1,p2),c=s.substring(p2+1);if(c.length()&&c[c.length()-1]>='a'&&c[c.length()-1]<='z'){v.suffix=c[c.length()-1];c.remove(c.length()-1);}auto digits=[](const String&x){if(!x.length())return false;for(size_t i=0;i<x.length();i++)if(x[i]<'0'||x[i]>'9')return false;return true;};if(!digits(a)||!digits(b)||!digits(c))return v;v.major=a.toInt();v.minor=b.toInt();v.patch=c.toInt();v.valid=true;return v;}
          static int compareVersion(const String&a,const String&b){VersionParts x=parseVersion(a),y=parseVersion(b);if(!x.valid||!y.valid)return 0;if(x.major!=y.major)return x.major>y.major?1:-1;if(x.minor!=y.minor)return x.minor>y.minor?1:-1;if(x.patch!=y.patch)return x.patch>y.patch?1:-1;if(x.suffix==y.suffix)return 0;if(!x.suffix)return 1;if(!y.suffix)return -1;return x.suffix>y.suffix?1:-1;}
          static bool verifySignature(const String&payload,const String&sig64){uint8_t sig[96];size_t sigLen=0;if(mbedtls_base64_decode(sig,sizeof(sig),&sigLen,(const unsigned char*)sig64.c_str(),sig64.length())!=0||!sigLen)return false;uint8_t digest[32];if(mbedtls_sha256((const unsigned char*)payload.c_str(),payload.length(),digest,0)!=0)return false;mbedtls_pk_context pk;mbedtls_pk_init(&pk);
          #if MBEDTLS_VERSION_MAJOR >= 3
          int rc=mbedtls_pk_parse_public_key(&pk,(const unsigned char*)OTA_PUBLIC_KEY,sizeof(OTA_PUBLIC_KEY),nullptr,nullptr);
          #else
          int rc=mbedtls_pk_parse_public_key(&pk,(const unsigned char*)OTA_PUBLIC_KEY,sizeof(OTA_PUBLIC_KEY));
          #endif
          if(rc==0)rc=mbedtls_pk_verify(&pk,MBEDTLS_MD_SHA256,digest,sizeof(digest),sig,sigLen);mbedtls_pk_free(&pk);return rc==0;}
          static bool parsePayload(const String&payload,RemoteStatus&out){bool gv=false,gb=false,gs=false,gc=false,gu=false;int start=0;while(start<(int)payload.length()){int nl=payload.indexOf('\n',start);if(nl<0)nl=payload.length();String line=payload.substring(start,nl);start=nl+1;if(!line.length())continue;int eq=line.indexOf('=');if(eq<=0)return false;String k=line.substring(0,eq),v=line.substring(eq+1);if(k=="version"&&!gv){out.availableVersion=v;gv=true;}else if(k=="bytes"&&!gb){if(!v.length())return false;for(size_t i=0;i<v.length();i++)if(v[i]<'0'||v[i]>'9')return false;out.bytes=(size_t)v.toInt();gb=true;}else if(k=="sha256"&&!gs){out.sha256=v;out.sha256.toLowerCase();gs=true;}else if(k=="commit"&&!gc){out.commit=v;out.commit.toLowerCase();gc=true;}else if(k=="url"&&!gu){out.url=v;gu=true;}else return false;}if(!gv||!gb||!gs||!gc||!gu)return false;if(!parseVersion(out.availableVersion).valid||out.bytes==0||out.bytes>=OTA_SLOT_BYTES||!allHex(out.sha256,64)||!allHex(out.commit,40))return false;String expected=String(OTA_RELEASE_PREFIX)+out.availableVersion+"/and_"+out.availableVersion+".bin";return out.url==expected;}
          static String statusJson(const char*current){JsonDocument d;d["checked"]=last.checked;d["ok"]=last.ok;d["signatureValid"]=last.signatureValid;d["currentVersion"]=current;d["updateAvailable"]=last.updateAvailable;d["autoInstall"]=false;d["downloadEnabled"]=false;d["manifestUrl"]=OTA_MANIFEST_URL;d["otaSlotBytes"]=OTA_SLOT_BYTES;d["httpStatus"]=last.httpStatus;d["message"]=last.message;if(last.availableVersion.length())d["availableVersion"]=last.availableVersion;if(last.bytes)d["bytes"]=(uint32_t)last.bytes;if(last.sha256.length())d["sha256"]=last.sha256;if(last.commit.length())d["commit"]=last.commit;if(last.url.length())d["url"]=last.url;String j;serializeJson(d,j);return j;}
          String remoteUpdateStatusJson(const char*current){return statusJson(current);}
          String remoteUpdateCheckJson(const char*current){last=RemoteStatus();last.checked=true;if(WiFi.status()!=WL_CONNECTED){last.message="Wi-Fi is not connected";return statusJson(current);}WiFiClientSecure client;client.setInsecure();HTTPClient http;http.setConnectTimeout(6000);http.setTimeout(8000);if(!http.begin(client,OTA_MANIFEST_URL)){last.message="Could not open the remote manifest URL";return statusJson(current);}last.httpStatus=http.GET();if(last.httpStatus!=HTTP_CODE_OK){last.message=String("Manifest request failed (HTTP ")+String(last.httpStatus)+")";http.end();return statusJson(current);}String body=http.getString();http.end();if(body.length()==0||body.length()>4096){last.message="Remote manifest size is invalid";return statusJson(current);}JsonDocument d;if(deserializeJson(d,body)||!d.is<JsonObject>()||(d["schema"]|0)!=1){last.message="Remote manifest format is invalid";return statusJson(current);}String payload=d["payload"]|String(""),sig=d["signature"]|String("");if(!payload.length()||!sig.length()){last.message="Remote manifest is missing its signed payload";return statusJson(current);}last.signatureValid=verifySignature(payload,sig);if(!last.signatureValid){last.message="Remote manifest signature is invalid";return statusJson(current);}if(!parsePayload(payload,last)){last.message="Signed manifest payload is invalid";return statusJson(current);}int cmp=compareVersion(last.availableVersion,String(current));last.ok=true;last.updateAvailable=cmp>0;if(cmp>0)last.message=String("Verified update available: ")+last.availableVersion+" (download/install disabled in this transitional release)";else if(cmp==0)last.message=String("Signed manifest verified. Anderson Home ")+current+" is current.";else last.message=String("Signed manifest verified but advertises older firmware ")+last.availableVersion+"; downgrade is blocked.";return statusJson(current);}
          EOF
          sed -i 's/^          //' firmware/src/RemoteUpdate.cpp
          cat > tools/sign_ota_manifest.py <<'EOF'
          #!/usr/bin/env python3
          import argparse,base64,json,subprocess,tempfile
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1];PUBLIC_KEY=ROOT/'remote-update/anderson_ota_signing_public.pem'
          def hx(s,n):return len(s)==n and all(c in '0123456789abcdefABCDEF' for c in s)
          p=argparse.ArgumentParser();p.add_argument('--key',required=True);p.add_argument('--version',required=True);p.add_argument('--bytes',required=True,type=int);p.add_argument('--sha256',required=True);p.add_argument('--commit',required=True);p.add_argument('--url',required=True);p.add_argument('--output',required=True);a=p.parse_args()
          if not hx(a.sha256,64) or not hx(a.commit,40) or a.bytes<=0 or a.bytes>=0x1E0000:raise SystemExit('Invalid OTA manifest inputs')
          expected=f'https://github.com/jlc3718-source/CETELUMA_NanoC6_WiFi_BLE_Bridge2/releases/download/anderson-v{a.version}/and_{a.version}.bin'
          if a.url!=expected:raise SystemExit('Unexpected OTA release URL')
          payload=f'version={a.version}\nbytes={a.bytes}\nsha256={a.sha256.lower()}\ncommit={a.commit.lower()}\nurl={a.url}\n';key=Path(a.key)
          with tempfile.TemporaryDirectory() as td:
              t=Path(td);data=t/'payload';sig=t/'sig';pub=t/'pub.pem';data.write_text(payload);subprocess.run(['openssl','dgst','-sha256','-sign',str(key),'-out',str(sig),str(data)],check=True);subprocess.run(['openssl','pkey','-in',str(key),'-pubout','-out',str(pub)],check=True,stdout=subprocess.DEVNULL)
              if pub.read_text().strip()!=PUBLIC_KEY.read_text().strip():raise SystemExit('Signing key does not match Anderson OTA public key')
              subprocess.run(['openssl','dgst','-sha256','-verify',str(PUBLIC_KEY),'-signature',str(sig),str(data)],check=True,stdout=subprocess.DEVNULL);signature=base64.b64encode(sig.read_bytes()).decode()
          Path(a.output).write_text(json.dumps({'schema':1,'payload':payload,'signature':signature},indent=2)+'\n')
          EOF
          sed -i 's/^          //' tools/sign_ota_manifest.py
          python - <<'PY'
          from pathlib import Path
          p=Path('firmware/src/main.cpp');s=p.read_text();inc='#include "PaletteMigration.h"';assert s.count(inc)==1;s=s.replace(inc,inc+'\n#include "RemoteUpdate.h"');anchor='  server.on("/api/firmware",HTTP_GET,[]{sendJson(firmwareJson());});';assert s.count(anchor)==1;s=s.replace(anchor,'  server.on("/api/remote-update",HTTP_GET,[]{if(!requireAdmin())return;sendJson(remoteUpdateStatusJson(ANDERSON_FIRMWARE_VERSION));});\n  server.on("/api/remote-update/check",HTTP_POST,[]{if(!requireAdmin())return;sendJson(remoteUpdateCheckJson(ANDERSON_FIRMWARE_VERSION));});\n\n'+anchor);p.write_text(s)
          p=Path('firmware/web/index.html');s=p.read_text();a='      <div id="fwMeta" class="card small" style="margin-top:10px">Loading firmware information…</div>\n      <div class="label">App-only firmware BIN</div>';b='      <div id="fwMeta" class="card small" style="margin-top:10px">Loading firmware information…</div>\n      <button id="checkRemoteFirmware" class="btn" style="width:100%;margin-top:9px">Check for Remote Update</button>\n      <div id="remoteFwStatus" class="sub" style="margin-top:6px">Signed remote-update discovery is ready. Automatic download and installation are disabled in this transitional release.</div>\n      <div class="label">App-only firmware BIN</div>';assert s.count(a)==1;s=s.replace(a,b);j="$('uploadFirmware').addEventListener('click',stageFirmware);";assert s.count(j)==1;r="async function checkRemoteFirmware(){const b=$('checkRemoteFirmware'),out=$('remoteFwStatus');b.disabled=true;out.textContent='Checking the signed Anderson update manifest…';try{const d=await post('/api/remote-update/check',{});if(d.ok&&d.signatureValid){out.textContent=d.updateAvailable?`Verified update ${d.availableVersion} is available. Automatic download/install is intentionally disabled in this release.`:(d.message||'Signed manifest verified; this firmware is current.')}else out.textContent=d.message||'Remote-update verification failed.'}catch(e){out.textContent='Remote-update check failed: '+e.message}finally{b.disabled=false}}\n$('checkRemoteFirmware').addEventListener('click',checkRemoteFirmware);\n";s=s.replace(j,r+j);p.write_text(s)
          PY
          python tools/release.py bump
          test "$(cat FIRMWARE_VERSION.txt)" = "2.0.3"
          python tools/release.py prepare
          python -m py_compile tools/sign_ota_manifest.py
          python - <<'PY'
          from pathlib import Path
          m=Path('firmware/src/main.cpp').read_text();w=Path('firmware/web/index.html').read_text();r=Path('firmware/src/RemoteUpdate.cpp').read_text()
          assert 'remoteUpdateCheckJson(ANDERSON_FIRMWARE_VERSION)' in m
          assert 'Check for Remote Update' in w and 'Automatic download/install is intentionally disabled' in w
          assert 'ota/latest.json' in r and 'downloadEnabled' in r and 'autoInstall' in r and 'mbedtls_pk_verify' in r
          print('v2.0.3 signed remote-update discovery checks passed')
          PY
      - name: Commit source
        shell: bash
        run: |
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git add FIRMWARE_VERSION.txt README.md firmware tools remote-update
          git commit -m 'Anderson Home v2.0.3 signed remote-update discovery'
          git push
