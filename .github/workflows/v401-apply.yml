name: Apply v4.0.1 login recovery patch
on:
  push:
    branches: ['work/v4.0.1-login-recovery']
    paths: ['.github/workflows/v401-apply.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.0.1-login-recovery
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v401_patch.py
          python /tmp/v401_patch.py
          rm -f .github/workflows/v401-apply.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build v4.0.1 login recovery and native fixes"
          git push origin HEAD:work/v4.0.1-login-recovery
