name: Apply v4.0.1 login recovery patch
on:
  push:
    branches: ['work/v4.0.1-login-recovery']
    paths: ['.github/workflows/v401-apply.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.0.1-login-recovery
          fetch-depth: 0
      - name: Apply readable v4.0.1 patch
        run: python tools/v401_patch.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/v401_patch.py
          git add FIRMWARE_VERSION.txt firmware/src/main.cpp firmware/src/ArduinoCompat.cpp firmware/sdkconfig.defaults firmware/web/index.html firmware/web/v3_mockup.js tools/test_regressions.py tools/v401_patch.py
          git commit -m "Build v4.0.1 login recovery and native fixes"
          git push origin HEAD:work/v4.0.1-login-recovery
