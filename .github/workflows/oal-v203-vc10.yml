name: Build OpenAutoLink v2.08 VC15

on:
  push:
    branches:
      - oal-v208-vc15-build
    paths:
      - '.github/workflows/oal-v203-vc10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Clone OpenAutoLink source
        run: |
          git clone --depth 1 --branch v0.1.497 --recurse-submodules https://github.com/mossyhub/openautolink.git oal

      - name: Patch parked-state handling and gear mapping
        working-directory: oal
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path('app/src/main/java/com/openautolink/app/session/SessionManager.kt')
          s = p.read_text()

          helper = '''    /** Map AAOS VehicleGear bit values to Android Auto's Gear enum. */
              private fun vhalGearToAaGear(raw: Int): Int = when (raw) {
                  0, 1 -> 0
                  2 -> 102
                  4 -> 101
                  8 -> 100
                  16 -> 1
                  32 -> 2
                  64 -> 3
                  128 -> 4
                  256 -> 5
                  512 -> 6
                  1024 -> 7
                  2048 -> 8
                  4096 -> 9
                  8192 -> 10
                  else -> 0
              }

              /**
               * Stationary test override. Any real motion restores live VHAL state.
               */
              private fun hardParkOverrideActive(vd: ControlMessage.VehicleData?): Boolean {
                  if (!alwaysInPark) return false
                  val speed = vd?.speedKmh
                  if (speed != null) return kotlin.math.abs(speed) < 1.0f
                  return vd?.gearRaw in listOf(0, 1, 4)
              }

              private fun pushHardParkState(session: AasdkSession) {
                  lastSentGearRaw = 4
                  lastSentParkingBrake = true
                  lastSentDriving = false
                  session.sendSpeed(0)
                  session.sendGear(101)
                  session.sendParkingBrake(true)
                  session.sendDrivingStatus(false)
              }

          '''
          needle = '    private fun observeAlwaysInPark() {'
          if needle not in s:
              raise SystemExit('observe function anchor not found')
          s = s.replace(needle, helper + needle, 1)

          observe_new = '''    private fun observeAlwaysInPark() {
                  if (alwaysInParkObserverStarted) return
                  val ctx = context ?: return
                  alwaysInParkObserverStarted = true
                  val prefs = AppPreferences.getInstance(ctx)
                  scope.launch {
                      prefs.alwaysInPark.collect { enabled ->
                          val changed = alwaysInPark != enabled
                          alwaysInPark = enabled
                          if (changed) {
                              val vd = _vehicleDataForwarder?.latestVehicleData?.value
                              val session = aasdkSession
                              if (session != null && hardParkOverrideActive(vd)) {
                                  pushHardParkState(session)
                                  DiagnosticLog.i("vhal", "alwaysInPark=$enabled — pushed coherent PARK test state")
                              } else if (session != null) {
                                  vd?.speedKmh?.let { session.sendSpeed((it / 3.6f * 1000).toInt()) }
                                  vd?.gearRaw?.let { lastSentGearRaw = it; session.sendGear(vhalGearToAaGear(it)) }
                                  vd?.parkingBrake?.let { lastSentParkingBrake = it; session.sendParkingBrake(it) }
                                  val realDriving = vd?.driving ?: false
                                  lastSentDriving = realDriving
                                  session.sendDrivingStatus(realDriving)
                                  DiagnosticLog.i("vhal", "alwaysInPark=$enabled — restored live vehicle state")
                              }
                          }
                      }
                  }
              }

              @Synchronized'''
          s, n = re.subn(r'    private fun observeAlwaysInPark\(\) \{.*?\n    \}\n\n    @Synchronized', observe_new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('observe function replacement failed')

          forward_new = '''    private fun forwardVehicleData(vd: ControlMessage.VehicleData) {
                  val session = aasdkSession ?: return
                  val hardPark = hardParkOverrideActive(vd)
                  if (hardPark) {
                      session.sendSpeed(0)
                      if (lastSentGearRaw != 4) { lastSentGearRaw = 4; session.sendGear(101) }
                      if (lastSentParkingBrake != true) { lastSentParkingBrake = true; session.sendParkingBrake(true) }
                      if (lastSentDriving != false) { lastSentDriving = false; session.sendDrivingStatus(false) }
                  } else {
                      vd.speedKmh?.let { session.sendSpeed((it / 3.6f * 1000).toInt()) }
                      vd.gearRaw?.let {
                          if (lastSentGearRaw != it) { lastSentGearRaw = it; session.sendGear(vhalGearToAaGear(it)) }
                      }
                      vd.parkingBrake?.let {
                          if (lastSentParkingBrake != it) { lastSentParkingBrake = it; session.sendParkingBrake(it) }
                      }
                      vd.driving?.let {
                          if (lastSentDriving != it) { lastSentDriving = it; session.sendDrivingStatus(it) }
                      }
                  }
                  vd.nightMode?.let {
                      if (lastSentNightMode != it) { lastSentNightMode = it; session.sendNightMode(it) }
                  }
                  if (vd.fuelLevelPct != null || vd.rangeKm != null) {
                      session.sendFuel(
                          vd.fuelLevelPct ?: 0,
                          ((vd.rangeKm ?: 0f) * 1000).toInt(),
                          vd.lowFuel ?: false,
                      )
                  }
                  vd.rpmE3?.let { session.sendRpm(it) }
                  if (vd.evBatteryLevelWh != null || vd.evBatteryCapacityWh != null) {
                      val batteryWh = vd.evBatteryLevelWh?.toInt() ?: 0
                      val capacityWh = vd.evBatteryCapacityWh?.toInt() ?: 0
                      val rangeM = ((vd.rangeKm ?: 0f) * 1000).toInt()
                      val chargeW = vd.evChargeRateW?.toInt() ?: 0
                      if (capacityWh > 0) {
                          _vehicleBatteryCapacityWh.value = capacityWh
                          ClusterNavigationState.batteryCapacityWh = capacityWh
                      }
                      val now = SystemClock.elapsedRealtime()
                      evLearnedEstimator?.onVehicleTick(vd, now)
                      refreshEvProfileLookup(vd)
                      val movedBattery = kotlin.math.abs(batteryWh - lastVemBatteryWh) >= 100
                      val movedRange = kotlin.math.abs(rangeM - lastVemRangeM) >= 500
                      val movedCharge = kotlin.math.abs(chargeW - lastVemChargeW) >= 100
                      val firstEmit = lastVemLogMs == 0L
                      val staleEnough = (now - lastVemLogMs) >= VEM_LOG_MIN_GAP_MS
                      if (firstEmit || movedBattery || movedRange || movedCharge || staleEnough) {
                          DiagnosticLog.i(
                              "vem",
                              "sendEnergyModel: level=${batteryWh}Wh cap=${capacityWh}Wh range=${rangeM}m charge=${chargeW}W${evTuningSummary(batteryWh, rangeM)}",
                          )
                          lastVemLogMs = now
                          lastVemBatteryWh = batteryWh
                          lastVemRangeM = rangeM
                          lastVemChargeW = chargeW
                      }
                      sendEnergyModelWithTuning(session, batteryWh, capacityWh, rangeM, chargeW)
                  }
              }

              /**
               * The phone subscribed'''
          s, n = re.subn(r'    private fun forwardVehicleData\(vd: ControlMessage\.VehicleData\) \{.*?\n    \}\n\n    /\*\*\n     \* The phone subscribed', forward_new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('forward function replacement failed')

          subscribed_new = '''    private fun onPhoneSubscribedSensor(sensorType: Int) {
                  if (sensorType == SENSOR_TYPE_VEHICLE_ENERGY_MODEL) {
                      sendCurrentEnergyModel("sensor-subscribe")
                      return
                  }
                  val session = aasdkSession ?: return
                  val vd = _vehicleDataForwarder?.latestVehicleData?.value
                  resetLatchedVehicleSensorState("sensor_subscribe_$sensorType")
                  val hardPark = hardParkOverrideActive(vd)
                  when (sensorType) {
                      SENSOR_TYPE_DRIVING_STATUS -> {
                          val driving = if (hardPark) false else (vd?.driving ?: false)
                          lastSentDriving = driving
                          session.sendDrivingStatus(driving)
                          DiagnosticLog.i("vhal", "pushed driving=$driving on subscribe (gear=${vd?.gearRaw}, hardPark=$hardPark)")
                      }
                      SENSOR_TYPE_GEAR -> {
                          if (hardPark) {
                              lastSentGearRaw = 4
                              session.sendGear(101)
                          } else {
                              vd?.gearRaw?.let { lastSentGearRaw = it; session.sendGear(vhalGearToAaGear(it)) }
                          }
                      }
                      SENSOR_TYPE_PARKING_BRAKE -> {
                          if (hardPark) {
                              lastSentParkingBrake = true
                              session.sendParkingBrake(true)
                          } else {
                              vd?.parkingBrake?.let { lastSentParkingBrake = it; session.sendParkingBrake(it) }
                          }
                      }
                      SENSOR_TYPE_NIGHT_MODE -> {
                          val night = vd?.nightMode ?: lastKnownUiNightMode ?: currentUiNightMode()
                          night?.let { lastSentNightMode = it; session.sendNightMode(it) }
                      }
                      SENSOR_TYPE_SPEED -> {
                          if (hardPark) session.sendSpeed(0)
                          else vd?.speedKmh?.let { session.sendSpeed((it / 3.6f * 1000).toInt()) }
                      }
                  }
              }

              private fun seedCurrentUiNightMode'''
          s, n = re.subn(r'    private fun onPhoneSubscribedSensor\(sensorType: Int\) \{.*?\n    \}\n\n    private fun seedCurrentUiNightMode', subscribed_new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('subscribe function replacement failed')

          control_new = '''            is ControlMessage.VehicleData -> {
                      val hardPark = hardParkOverrideActive(message)
                      if (hardPark) {
                          session.sendSpeed(0)
                          if (lastSentGearRaw != 4) { lastSentGearRaw = 4; session.sendGear(101) }
                          if (lastSentParkingBrake != true) { lastSentParkingBrake = true; session.sendParkingBrake(true) }
                          if (lastSentDriving != false) { lastSentDriving = false; session.sendDrivingStatus(false) }
                      } else {
                          message.speedKmh?.let { session.sendSpeed((it / 3.6f * 1000).toInt()) }
                          message.gearRaw?.let {
                              if (lastSentGearRaw != it) { lastSentGearRaw = it; session.sendGear(vhalGearToAaGear(it)) }
                          }
                          message.parkingBrake?.let {
                              if (lastSentParkingBrake != it) { lastSentParkingBrake = it; session.sendParkingBrake(it) }
                          }
                          message.driving?.let {
                              if (lastSentDriving != it) { lastSentDriving = it; session.sendDrivingStatus(it) }
                          }
                      }
                      message.nightMode?.let {
                          if (lastSentNightMode != it) { lastSentNightMode = it; session.sendNightMode(it) }
                      }
                  }
                  is ControlMessage.Gnss ->'''
          s, n = re.subn(r'            is ControlMessage\.VehicleData -> \{.*?\n            \}\n            is ControlMessage\.Gnss ->', control_new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('control-message replacement failed')

          p.write_text(s)
          print('Patch applied successfully')
          PY

      - name: Harden Always-in-Park latch and request AAOS runtime permissions
        working-directory: oal
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          # Make the parked override deterministic from the real gear/parking-brake state.
          p = Path('app/src/main/java/com/openautolink/app/session/SessionManager.kt')
          s = p.read_text()

          park_new = '''    private var lastRealGearRaw: Int? = null
              private var lastRealParkingBrake: Boolean? = null
              private var lastRealSpeedKmh: Float? = null

              private fun hardParkOverrideActive(vd: ControlMessage.VehicleData?): Boolean {
                  if (!alwaysInPark) return false
                  val gear = vd?.gearRaw ?: lastRealGearRaw
                  val brake = vd?.parkingBrake ?: lastRealParkingBrake
                  val speed = vd?.speedKmh ?: lastRealSpeedKmh

                  // PARK from VHAL is authoritative even when CAR_SPEED has not been granted.
                  if (gear == 4) return true
                  // Neutral is accepted only with the parking brake set.
                  if (gear == 1 && brake == true) return true
                  // Final fallback when a speed sample exists.
                  return speed != null && kotlin.math.abs(speed) < 0.5f && brake == true
              }'''
          s, n = re.subn(
              r'    private fun hardParkOverrideActive\(vd: ControlMessage\.VehicleData\?\): Boolean \{.*?\n    \}',
              park_new, s, count=1, flags=re.S
          )
          if n != 1:
              raise SystemExit('hardParkOverrideActive replacement failed')

          old = '''    private fun forwardVehicleData(vd: ControlMessage.VehicleData) {
                  val session = aasdkSession ?: return
                  val hardPark = hardParkOverrideActive(vd)'''
          new = '''    private fun forwardVehicleData(vd: ControlMessage.VehicleData) {
                  val session = aasdkSession ?: return
                  vd.gearRaw?.let { lastRealGearRaw = it }
                  vd.parkingBrake?.let { lastRealParkingBrake = it }
                  vd.speedKmh?.let { lastRealSpeedKmh = it }
                  val hardPark = hardParkOverrideActive(vd)'''
          if old not in s:
              raise SystemExit('forward cache insertion anchor not found')
          s = s.replace(old, new, 1)

          old = '''            is ControlMessage.VehicleData -> {
                      val hardPark = hardParkOverrideActive(message)'''
          new = '''            is ControlMessage.VehicleData -> {
                      message.gearRaw?.let { lastRealGearRaw = it }
                      message.parkingBrake?.let { lastRealParkingBrake = it }
                      message.speedKmh?.let { lastRealSpeedKmh = it }
                      val hardPark = hardParkOverrideActive(message)'''
          if old not in s:
              raise SystemExit('control cache insertion anchor not found')
          s = s.replace(old, new, 1)

          old = '''        val hardPark = hardParkOverrideActive(vd)
                  when (sensorType) {'''
          new = '''        val hardPark = hardParkOverrideActive(vd)
                  if (hardPark && sensorType in setOf(
                          SENSOR_TYPE_DRIVING_STATUS, SENSOR_TYPE_GEAR,
                          SENSOR_TYPE_PARKING_BRAKE, SENSOR_TYPE_SPEED
                      )) {
                      // Re-push the complete coherent state whenever Gearhead subscribes
                      // to any safety-related sensor, regardless of subscription order.
                      pushHardParkState(session)
                      DiagnosticLog.i("vhal", "re-pushed full PARK state on sensor subscribe type=$sensorType")
                      return
                  }
                  when (sensorType) {'''
          if old not in s:
              raise SystemExit('subscribe repush insertion anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          # CAR_SPEED and CAR_ENERGY are dangerous AAOS permissions and must be
          # requested at runtime, not merely declared in AndroidManifest.xml.
          p = Path('app/src/main/java/com/openautolink/app/MainActivity.kt')
          s = p.read_text()
          old = '''    private fun requestMissingPermissions() {
                  val missing = requiredPermissions.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      Log.i("MainActivity", "Requesting permissions: $missing")
                      permissionLauncher.launch(missing.toTypedArray())
                  }
              }'''
          new = '''    private fun requestMissingPermissions() {
                  val candidates = requiredPermissions.toMutableList()
                  if (packageManager.hasSystemFeature(PackageManager.FEATURE_AUTOMOTIVE)) {
                      candidates += "android.car.permission.CAR_SPEED"
                      candidates += "android.car.permission.CAR_ENERGY"
                  }
                  val missing = candidates.distinct().filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      Log.i("MainActivity", "Requesting permissions: $missing")
                      permissionLauncher.launch(missing.toTypedArray())
                  }
              }'''
          if old not in s:
              raise SystemExit('requestMissingPermissions replacement failed')
          p.write_text(s.replace(old, new, 1))
          print('VC12 park latch and runtime permission fixes applied')
          PY
      - name: Fix sensor subscription ACK ordering and pre-load Park preference
        working-directory: oal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Native race fix: Gearhead must receive SensorStartResponse before
          # we emit the first SensorBatch for that subscription.
          p = Path('app/src/main/cpp/jni_channel_handlers.cpp')
          s = p.read_text()
          old = '''    auto promise = aasdk::channel::SendPromise::defer(strand_);
              promise->then([]() {}, [this](const auto& e) { this->onChannelError(e); });
              channel_->sendSensorStartResponse(response, std::move(promise));

              // Push current vehicle state for this sensor immediately. Gearhead defaults
              // its driving-status restriction to FULLY_RESTRICTED(31) and only leaves
              // that state once a real sample arrives (teardown: p000/rqd.java f65655d).
              // A parked car generates no VHAL change events, so without this the phone
              // stays restricted for the whole session — no Maps keyboard. Issue #61.
              session_.notifySensorSubscribed(static_cast<int>(request.type()));'''
          new = '''    const int sensorType = static_cast<int>(request.type());
              auto promise = aasdk::channel::SendPromise::defer(strand_);
              promise->then(
                  [this, sensorType]() {
                      LOGI("Sensor start response sent: type=%d; pushing current value", sensorType);
                      session_.notifySensorSubscribed(sensorType);
                  },
                  [this](const auto& e) { this->onChannelError(e); });
              channel_->sendSensorStartResponse(response, std::move(promise));'''
          if old not in s:
              raise SystemExit('native sensor ACK block not found')
          p.write_text(s.replace(old, new, 1))

          # Make the toggle value available synchronously before any phone
          # sensor subscriptions can arrive, then issue one delayed insurance
          # re-push after the post-ACK immediate push.
          p = Path('app/src/main/java/com/openautolink/app/session/SessionManager.kt')
          s = p.read_text()

          old = '''        resetLatchedVehicleSensorState("start_session")
                  observeAlwaysInPark()
                  ensureVehicleDataForwarder()'''
          new = '''        alwaysInPark = AppPreferences.getInstance(requireNotNull(context)).alwaysInPark.first()
                  DiagnosticLog.i("vhal", "startup alwaysInPark=$alwaysInPark")
                  resetLatchedVehicleSensorState("start_session")
                  observeAlwaysInPark()
                  ensureVehicleDataForwarder()'''
          if old not in s:
              raise SystemExit('startup park preload anchor not found')
          s = s.replace(old, new, 1)

          old = '''            pushHardParkState(session)
                      DiagnosticLog.i("vhal", "re-pushed full PARK state on sensor subscribe type=$sensorType")
                      return'''
          new = '''            pushHardParkState(session)
                      DiagnosticLog.i("vhal", "post-ACK full PARK state pushed type=$sensorType")
                      scope.launch {
                          kotlinx.coroutines.delay(250)
                          val latest = _vehicleDataForwarder?.latestVehicleData?.value
                          if (aasdkSession === session && hardParkOverrideActive(latest)) {
                              pushHardParkState(session)
                              DiagnosticLog.i("vhal", "delayed full PARK state re-pushed type=$sensorType")
                          }
                      }
                      return'''
          if old not in s:
              raise SystemExit('post-subscribe retry anchor not found')
          p.write_text(s.replace(old, new, 1))
          print('VC13 native ACK ordering + preference preload applied')
          PY
      - name: Fix Android Auto key-binding handshake
        working-directory: oal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/cpp/jni_channel_handlers.cpp')
          s = p.read_text()

          resp_inc = '#include <aap_protobuf/service/media/sink/message/KeyBindingResponse.pb.h>'
          if resp_inc not in s:
              anchor = '#include <aap_protobuf/service/media/shared/message/Config.pb.h>'
              if anchor not in s:
                  raise SystemExit('media sink include anchor not found')
              s = s.replace(anchor, anchor + '\n' + resp_inc, 1)

          fn_start = s.find('void JniInputHandler::onKeyBindingRequest(')
          if fn_start < 0:
              raise SystemExit('onKeyBindingRequest start not found')
          fn_end = s.find('\nvoid JniInputHandler::onChannelError', fn_start)
          if fn_end < 0:
              raise SystemExit('onKeyBindingRequest end not found')

          replacement = '''void JniInputHandler::onKeyBindingRequest(
              const aap_protobuf::service::media::sink::message::KeyBindingRequest& request)
          {
              LOGI("Key binding request");
              logProtoRaw("KeyBinding", request);

              aap_protobuf::service::media::sink::message::KeyBindingResponse response;
              response.set_status(0);
              auto promise = aasdk::channel::SendPromise::defer(strand_);
              promise->then(
                  [this]() { LOGI("Key binding response sent OK"); },
                  [this](const auto& e) { this->onChannelError(e); });
              channel_->sendKeyBindingResponse(response, std::move(promise));
              channel_->receive(shared_from_this());
          }
          '''
          s = s[:fn_start] + replacement + s[fn_end:]
          p.write_text(s)
          print('AA key-binding response added')
          PY
      - name: VC14 stationary Park test, dual-path keys, and icon cache bust
        working-directory: oal
        run: |
          python3 - <<'PY'
          import re, shutil
          from pathlib import Path

          # 1) ALWAYS-IN-PARK TEST MODE
          p = Path('app/src/main/java/com/openautolink/app/session/SessionManager.kt')
          s = p.read_text()

          pattern = r'''    private var lastRealGearRaw: Int\? = null
              private var lastRealParkingBrake: Boolean\? = null
              private var lastRealSpeedKmh: Float\? = null

              private fun hardParkOverrideActive\(vd: ControlMessage\.VehicleData\?\): Boolean \{.*?
              \}'''
          replacement = '''    private var lastRealGearRaw: Int? = null
              private var lastRealParkingBrake: Boolean? = null
              private var lastRealSpeedKmh: Float? = null
              @Volatile private var lastGnssSpeedMps: Float? = null
              private var parkOverrideKeepAliveJob: kotlinx.coroutines.Job? = null

              private fun hardParkOverrideActive(vd: ControlMessage.VehicleData?): Boolean {
                  if (!alwaysInPark) return false
                  val vhalKmh = vd?.speedKmh ?: lastRealSpeedKmh
                  if (vhalKmh != null) return kotlin.math.abs(vhalKmh) < 0.5f
                  val gpsMps = lastGnssSpeedMps
                  if (gpsMps != null) return kotlin.math.abs(gpsMps) < 0.30f
                  return (vd?.gearRaw ?: lastRealGearRaw) == 4
              }'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('VC14 hardPark block replacement failed')

          obs_start = s.find('    private fun observeAlwaysInPark() {')
          obs_end = s.find('\n    @Synchronized', obs_start)
          if obs_start < 0 or obs_end < 0:
              raise SystemExit('VC14 observeAlwaysInPark bounds not found')
          observer = '''    private fun observeAlwaysInPark() {
                  if (alwaysInParkObserverStarted) return
                  val ctx = context ?: return
                  alwaysInParkObserverStarted = true
                  val prefs = AppPreferences.getInstance(ctx)
                  scope.launch {
                      prefs.alwaysInPark.collect { enabled ->
                          val changed = alwaysInPark != enabled
                          alwaysInPark = enabled
                          parkOverrideKeepAliveJob?.cancel()
                          parkOverrideKeepAliveJob = null

                          if (enabled) {
                              parkOverrideKeepAliveJob = scope.launch {
                                  while (alwaysInPark) {
                                      val session = aasdkSession
                                      val vd = _vehicleDataForwarder?.latestVehicleData?.value
                                      if (session != null) {
                                          if (hardParkOverrideActive(vd)) {
                                              pushHardParkState(session)
                                              DiagnosticLog.i("vhal", "VC14_PARK_OVERRIDE_KEEPALIVE")
                                          } else {
                                              vd?.speedKmh?.let {
                                                  session.sendSpeed((it / 3.6f * 1000).toInt())
                                              } ?: lastGnssSpeedMps?.let {
                                                  session.sendSpeed((it * 1000f).toInt())
                                              }
                                              vd?.gearRaw?.let {
                                                  lastSentGearRaw = it
                                                  session.sendGear(vhalGearToAaGear(it))
                                              }
                                              vd?.parkingBrake?.let {
                                                  lastSentParkingBrake = it
                                                  session.sendParkingBrake(it)
                                              }
                                              val rawGear = vd?.gearRaw ?: lastRealGearRaw
                                              val realDriving = vd?.driving ?: (rawGear != null && rawGear !in listOf(0, 1, 4))
                                              lastSentDriving = realDriving
                                              session.sendDrivingStatus(realDriving)
                                          }
                                      }
                                      kotlinx.coroutines.delay(500)
                                  }
                              }
                          }

                          if (changed) {
                              val vd = _vehicleDataForwarder?.latestVehicleData?.value
                              val session = aasdkSession
                              if (session != null && hardParkOverrideActive(vd)) {
                                  pushHardParkState(session)
                                  DiagnosticLog.i("vhal", "alwaysInPark=$enabled — forced PARK while stationary")
                              } else if (session != null) {
                                  vd?.speedKmh?.let { session.sendSpeed((it / 3.6f * 1000).toInt()) }
                                  vd?.gearRaw?.let { lastSentGearRaw = it; session.sendGear(vhalGearToAaGear(it)) }
                                  vd?.parkingBrake?.let { lastSentParkingBrake = it; session.sendParkingBrake(it) }
                                  val realDriving = vd?.driving ?: false
                                  lastSentDriving = realDriving
                                  session.sendDrivingStatus(realDriving)
                                  DiagnosticLog.i("vhal", "alwaysInPark=$enabled — live state active")
                              }
                          }
                      }
                  }
              }
          '''
          s = s[:obs_start] + observer + s[obs_end:]

          needle = 'val listener = android.location.LocationListener { location ->'
