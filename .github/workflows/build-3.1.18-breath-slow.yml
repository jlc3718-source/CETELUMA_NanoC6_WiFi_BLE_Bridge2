name: Build Anderson Home 3.1.18 Breath Slow Events

on:
  push:
    branches: ['codex/3.1.18-breath-slow-events']

permissions:
  contents: write
  actions: write

concurrency:
  group: anderson-3-1-18-breath-slow
  cancel-in-progress: true

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/3.1.18-breath-slow-events
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - name: Apply v3.1.18 source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_one(path, old, new):
              p=Path(path); s=p.read_text()
              count=s.count(old)
              assert count==1, f'{path}: expected one match, found {count}: {old[:100]!r}'
              p.write_text(s.replace(old,new,1))

          Path('FIRMWARE_VERSION.txt').write_text('3.1.18\n')
          replace_one('firmware/src/main.cpp','ANDERSON_FIRMWARE_VERSION="3.1.17"','ANDERSON_FIRMWARE_VERSION="3.1.18"')

          # Built-in event overrides are capped at Slow (1=Very Slow, 2=Slow).
          main=Path('firmware/src/main.cpp')
          s=main.read_text()
          old='    if(head.startsWith("v3|")){int b1=head.indexOf(\'|\',3);if(b1<0)continue;o.effect=effectFromString(head.substring(3,b1));o.speed=constrain(head.substring(b1+1).toInt(),1,5);}\n'
          new='    if(head.startsWith("v4|")){int b1=head.indexOf(\'|\',3);if(b1<0)continue;o.effect=effectFromString(head.substring(3,b1));o.speed=constrain(head.substring(b1+1).toInt(),1,2);}\n    else if(head.startsWith("v3|")){int b1=head.indexOf(\'|\',3);if(b1<0)continue;o.effect=effectFromString(head.substring(3,b1));o.speed=constrain(head.substring(b1+1).toInt(),1,2);}\n'
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('o.speed=constrain(head.substring(b1+1,b2).toInt(),1,5);','o.speed=constrain(head.substring(b1+1,b2).toInt(),1,2);',1)
          s=s.replace('o.speed=constrain(head.substring(bar+1).toInt(),1,5);','o.speed=constrain(head.substring(bar+1).toInt(),1,2);',1)
          old='    String list=raw.substring(sep+1);'
          new='    if(!head.startsWith("v4|")&&o.effect==Effect::Breath)o.effect=Effect::Jump;\n    String list=raw.substring(sep+1);'
          assert old in s;s=s.replace(old,new,1)
          assert 'scheduledEventSpeedHint=constrain(o.speed,1,5);' in s
          s=s.replace('scheduledEventSpeedHint=constrain(o.speed,1,5);','scheduledEventSpeedHint=constrain(o.speed,1,2);',1)
          assert 'next.speed=constrain(sp,1,5);' in s
          s=s.replace('next.speed=constrain(sp,1,5);','next.speed=constrain(sp,1,2);',1)
          assert 'String raw=String("v3|")+effectName(next.effect)' in s
          s=s.replace('String raw=String("v3|")+effectName(next.effect)','String raw=String("v4|")+effectName(next.effect)',1)
          main.write_text(s)

          # The compiled 210-event defaults already contain only 1/2; enforce the cap in code too.
          replace_one('firmware/src/EventCatalog.cpp','uint8_t eventSpeed(size_t index){return index<EVENT_COUNT?EVENT_SPEEDS[index]:1;}','uint8_t eventSpeed(size_t index){return index<EVENT_COUNT?(EVENT_SPEEDS[index]>2?2:EVENT_SPEEDS[index]):1;}')

          # Breath is selectable again, but legacy pre-3.1.18 event overrides remain Jump unless explicitly re-saved.
          types=Path('firmware/include/Types.h');s=types.read_text()
          assert 'case Effect::Breath: return "Jump";' in s;s=s.replace('case Effect::Breath: return "Jump";','case Effect::Breath: return "Breath";',1)
          assert 'if (s=="Breath" || s=="Pulse") return Effect::Jump;' in s;s=s.replace('if (s=="Breath" || s=="Pulse") return Effect::Jump;','if (s=="Breath" || s=="Pulse") return Effect::Breath;',1)
          s=s.replace('// Current Anderson Home effect set. Legacy names are intentionally mapped so\n  // old presets/API calls cannot reintroduce retired effects.','// Current Anderson Home effect set. Breath is supported again; unrelated retired\n  // legacy names remain mapped to safe supported effects.',1)
          types.write_text(s)

          # Restore the real software Breath engine while keeping the zero-gap dual-controller write path.
          ble=Path('firmware/src/BleController.cpp');s=ble.read_text()
          old='  Theme normalized=t;if(normalized.effect==Effect::Breath)normalized.effect=Effect::Jump;const Theme& syncTheme=normalized;'
          assert old in s;s=s.replace(old,'  const Theme& syncTheme=t;',1)
          old='  if(!starting&&(uint32_t)(nowMs-lastControlReassert)>=CONTROL_REASSERT_INTERVAL_MS){setPower(true);setBrightness(bright,true);lastControlReassert=nowMs;}'
          new='  if(!starting&&(uint32_t)(nowMs-lastControlReassert)>=CONTROL_REASSERT_INTERVAL_MS){setPower(true);if(syncTheme.effect!=Effect::Breath)setBrightness(bright,true);lastControlReassert=nowMs;}'
          assert old in s;s=s.replace(old,new,1)
          needle='  if(syncTheme.effect==Effect::Strobe){uint32_t half=max((uint32_t)45,interval/2);if(!force&&nowMs-lastEffect<half)return;lastEffect=nowMs;uint32_t phase=nowMs/half;if((phase&1)==0)setColor(0x000000,true);else setColor(syncTheme.colors[(phase/2)%count],true);return;}\n}'
          breath='  if(syncTheme.effect==Effect::Strobe){uint32_t half=max((uint32_t)45,interval/2);if(!force&&nowMs-lastEffect<half)return;lastEffect=nowMs;uint32_t phase=nowMs/half;if((phase&1)==0)setColor(0x000000,true);else setColor(syncTheme.colors[(phase/2)%count],true);return;}\n  if(syncTheme.effect==Effect::Breath){uint32_t frame=max((uint32_t)55,interval/5);if(!force&&nowMs-lastEffect<frame)return;lastEffect=nowMs;float cycleMs=(float)(interval*8UL),phase=fmodf((float)nowMs,cycleMs)/cycleMs;int idx=(int)(phase*count)%count,nxt=(idx+1)%count;float local=fmodf(phase*count,1.0f);uint32_t a=syncTheme.colors[idx],z=syncTheme.colors[nxt];uint8_t R=(uint8_t)(r8(a)+(r8(z)-r8(a))*local),G=(uint8_t)(g8(a)+(g8(z)-g8(a))*local),B=(uint8_t)(b8(a)+(b8(z)-b8(a))*local);uint32_t color=((uint32_t)R<<16)|((uint32_t)G<<8)|B;float wave=0.5f-0.5f*cosf(phase*2.0f*PI);uint8_t level=(uint8_t)max(1.0f,bright*(0.10f+0.90f*wave));setColor(count>1?color:syncTheme.colors[0],starting);setBrightness(level,false);return;}\n}'
          assert needle in s;s=s.replace(needle,breath,1)
          ble.write_text(s)

          # No automatic scheduler scene is assigned Breath. Combined monthly mode uses Jump.
          replace_one('firmware/src/Scheduler.cpp','Theme t;t.name="Combined monthly events";t.effect=Effect::Breath;t.colorCount=0;','Theme t;t.name="Combined monthly events";t.effect=Effect::Jump;t.colorCount=0;')

          # Restore Breath to manual/custom/event selectors; built-in event editing cannot exceed Slow.
          web=Path('firmware/web/index.html');s=web.read_text()
          s=s.replace('<select id="homeEffect" class="field"><option value="Jump">Jump</option><option value="Strobe">Strobe</option><option value="Solid">Solid / Static</option></select>','<select id="homeEffect" class="field"><option value="Jump">Jump</option><option value="Breath">Breath</option><option value="Strobe">Strobe</option><option value="Solid">Solid / Static</option></select>',1)
          s=s.replace('<div class="label">Effect</div><select id="effectSelect" class="field"><option value="Jump">Jump</option><option value="Strobe">Strobe</option><option value="Solid">Solid / Static</option></select>','<div class="label">Effect</div><select id="effectSelect" class="field"><option value="Jump">Jump</option><option value="Breath">Breath</option><option value="Strobe">Strobe</option><option value="Solid">Solid / Static</option></select>',1)
          assert "['Jump','Strobe','Solid'].forEach" in s;s=s.replace("['Jump','Strobe','Solid'].forEach","['Jump','Breath','Strobe','Solid'].forEach",1)
          assert "evSpeed.max='5'" in s;s=s.replace("evSpeed.max='5'","evSpeed.max='2'",1)
          assert 'id="eventsSpeed" type="range" min="1" max="5"' in s;s=s.replace('id="eventsSpeed" type="range" min="1" max="5"','id="eventsSpeed" type="range" min="1" max="2"',1)
          # Simulated offline preview should not make an event appear automatically assigned to Breath.
          assert "setRunning('Suicide Prevention Awareness Month',['#28FF00','#5B00E6'],'Breath')" in s
          s=s.replace("setRunning('Suicide Prevention Awareness Month',['#28FF00','#5B00E6'],'Breath')","setRunning('Suicide Prevention Awareness Month',['#28FF00','#5B00E6'],'Jump')",1)
          web.write_text(s)

          # Update regression gates for the restored selectable effect and strict event-speed cap.
          tests=Path('tools/test_regressions.py');s=tests.read_text()
          s=s.replace('# v3.1.17 selectable historical event palettes, editable preset slots, OTA verification','# v3.1.18 Breath restored, built-in events capped at Slow, selectable historical palettes',1)
          old="assert 't.effect=Effect::Breath' in sched"
          new="""assert 't.effect=Effect::Breath' not in sched
assert 'Effect::Breath' not in ev
assert 'if(syncTheme.effect==Effect::Breath)' in ble
assert 'normalized.effect==Effect::Breath' not in ble
assert 'case Effect::Breath: return \"Breath\";' in types
assert 'if (s==\"Breath\" || s==\"Pulse\") return Effect::Breath;' in types
assert '<option value=\"Breath\">Breath</option>' in web and \"['Jump','Breath','Strobe','Solid']\" in web
speed_block=re.search(r'static const uint8_t EVENT_SPEEDS\\[\\]\\s*=\\s*\\{(.*?)\\};',ev,re.S); assert speed_block
speed_values=[int(x) for x in re.findall(r'\\b\\d+\\b',speed_block.group(1))]; assert len(speed_values)==210 and max(speed_values)<=2
assert 'EVENT_SPEEDS[index]>2?2:EVENT_SPEEDS[index]' in ev
assert 'scheduledEventSpeedHint=constrain(o.speed,1,2)' in main and 'next.speed=constrain(sp,1,2)' in main
assert 'String raw=String(\"v4|\")+effectName(next.effect)' in main and '!head.startsWith(\"v4|\")&&o.effect==Effect::Breath' in main
assert \"evSpeed.max='2'\" in web and 'id=\"eventsSpeed\" type=\"range\" min=\"1\" max=\"2\"' in web"""
          assert old in s;s=s.replace(old,new,1)
          tests.write_text(s)

          Path('firmware/RELEASE_NOTES_v3.1.18.md').write_text('''# Anderson Home v3.1.18\n\n- Restores the Breath effect as a selectable manual, custom-light, and event-edit effect.\n- Restores the software Breath renderer without reintroducing the removed 18 ms BLE write gap.\n- Caps every built-in scheduled event at Slow or Very Slow, including saved built-in event overrides.\n- Existing pre-v3.1.18 Breath event overrides remain Jump until deliberately re-saved, preventing automatic Breath assignments.\n- No built-in event or automatic combined-monthly scene is assigned Breath by default.\n''')

          # The helper workflow is intentionally absent from the validated source tree.
          Path('.github/workflows/build-3.1.18-breath-slow.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Anderson Home v3.1.18 restore Breath and cap event speed"
          git push origin HEAD:refs/heads/codex/3.1.18-breath-slow-events
      - name: Install build dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Run maintenance and recovery checks
        run: python tools/test_maintenance.py
      - name: Run regression checks
        run: python tools/test_regressions.py
      - name: Run audit checks
        run: python tools/test_audit_fixes.py
      - name: Check scheduled event coverage
        run: python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full
      - name: Prepare release
        run: python tools/release.py prepare
      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package verified firmware
        run: python tools/release.py package
      - name: Verify v3.1.18 packaged identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          r=json.loads(Path('release/release.json').read_text());f=Path('release/and_3.1.18.bin');data=f.read_bytes();digest=hashlib.sha256(data).hexdigest()
          assert r['version']=='3.1.18' and r['commit']==sha
          assert data and data[0]==0xE9 and len(data)<0x1E0000
          assert r['files'][f.name]['bytes']==len(data) and r['files'][f.name]['sha256']==digest
          print('bytes',len(data),'sha256',digest,'commit',sha)
          PY
      - name: Upload verified v3.1.18
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.18-Breath-Slow-Validated
          path: release/*
          if-no-files-found: error
