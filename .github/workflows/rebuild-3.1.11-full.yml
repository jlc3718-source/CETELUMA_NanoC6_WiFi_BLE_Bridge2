name: Rebuild Anderson 3.1.11 Full Flash

on:
  push:
    branches: ['codex/rebuild-3.1.11-full']
    paths: ['.github/workflows/rebuild-3.1.11-full.yml']

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Verify exact 3.1.11 source
        run: |
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = "3.1.11"
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.11"' firmware/src/main.cpp
      - name: Validate and prepare release
        run: |
          python tools/test_maintenance.py
          python tools/test_regressions.py
          python tools/test_audit_fixes.py
          python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full
          python tools/release.py prepare
      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package full flash image
        run: python tools/release.py package --full
      - name: Verify package
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          manifest=json.loads(Path('release/release.json').read_text())
          assert manifest['version']=='3.1.11'
          for n in ('and_3.1.11.bin','and_3.1.11_full.bin'):
              p=Path('release')/n
              assert p.is_file() and p.stat().st_size>0
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              assert manifest['files'][n]['bytes']==p.stat().st_size
              assert manifest['files'][n]['sha256']==digest
              print(n,p.stat().st_size,digest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.11-FULL-FLASH
          path: release/*
          if-no-files-found: error
          retention-days: 30
