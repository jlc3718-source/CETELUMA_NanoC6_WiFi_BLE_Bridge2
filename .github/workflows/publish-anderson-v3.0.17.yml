name: Publish Anderson Home v3.0.17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-anderson-v3.0.17.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: '10287477467'
      ARTIFACT_ZIP_SHA256: '3b2a7e41b8fb837c9cef698e22756816d4648ce44008252850de10ebd513a9fe'
      TARGET_COMMIT: '132c5da5791544618d7fe6992ca06caac43b26bd'
      BIN_SHA256: 'b6258be2451ac57550952a10a82c5ad31737cafea08550cfe1c5291c760371d6'
      BIN_BYTES: '1818752'
      TAG: 'anderson-v3.0.17'
    steps:
      - uses: actions/checkout@v4
      - name: Download exact verified branch artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/anderson.zip
          echo "${ARTIFACT_ZIP_SHA256}  /tmp/anderson.zip" | sha256sum -c -
          mkdir -p /tmp/anderson
          unzip -q /tmp/anderson.zip -d /tmp/anderson
      - name: Verify exact firmware and provenance
        run: |
          test "$(stat -c %s /tmp/anderson/and_3.0.17.bin)" = "${BIN_BYTES}"
          echo "${BIN_SHA256}  /tmp/anderson/and_3.0.17.bin" | sha256sum -c -
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('/tmp/anderson/release.json').read_text())
          assert m['version']=='3.0.17'
          assert m['commit']==os.environ['TARGET_COMMIT']
          f=m['files']['and_3.0.17.bin']
          assert f['bytes']==int(os.environ['BIN_BYTES'])
          assert f['sha256']==os.environ['BIN_SHA256']
          assert int(m['ota_slot_bytes'])==0x1E0000
          PY
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "$(gh release view "${TAG}" --json tagName --jq .tagName 2>/dev/null || true)"
          gh release create "${TAG}" \
            /tmp/anderson/and_3.0.17.bin \
            /tmp/anderson/release.json \
            --target "${TARGET_COMMIT}" \
            --title 'Anderson Home v3.0.17' \
            --notes 'Applies the user-calibrated canonical event palette across all built-in events, saved custom lights, future event overrides, and schedules that reference saved custom lights: Red #FF0000, Purple #23018C, Blue #05008A, Cyan #00BD4C, Pink #BF0005, Orange #FF2900, Yellow #FF6E00, Green #4DFF00. Legacy shades are mapped by their intended basic color family. Existing and future Favorite Colors remain exact and are excluded from palette migration. Intentional white, black, and autumn brown colors remain distinct. Exact verified build commit: 132c5da5791544618d7fe6992ca06caac43b26bd. BIN SHA-256: b6258be2451ac57550952a10a82c5ad31737cafea08550cfe1c5291c760371d6.' \
            --latest
      - name: Retain newest release plus one backup
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_RELEASES: '1'
        run: bash .github/scripts/anderson-retention.sh
