name: Temporary Anderson v3.1.10 audited fixes
on:
  push:
    branches: ['work/v3.1.10-audit-fixes']
    paths: ['.github/workflows/tmp-v310-audit-fixes.yml']
permissions:
  contents: write
jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.1.10-audit-fixes
          fetch-depth: 0
      - name: Apply audited fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/v310_apply_audit_fixes.py');s=p.read_text()
          s=s.replace("js=helper+r'''\\nconst assert=", 'js=helper+"""\nconst assert=', 1)
          s=s.replace("process.exitCode=1});\\n'''\nsubprocess.run", 'process.exitCode=1});\n"""\nsubprocess.run', 1)
          s=s.replace("assert 'actions/runs/$BUILD_RUN_ID' in pub and 'head_repository.full_name' in pub","assert 'actions/runs/$BUILD_RUN_ID' in pub and 'head_repository' in pub and 'full_name' in pub",1)
          lines=s.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('start=html.index("let otaBeforePartition'):
                  lines[i]='start=html.index("let otaBeforePartition")'
                  break
          else:
              raise SystemExit('UI patch anchor line not found in helper')
          p.write_text('\n'.join(lines)+'\n')
          PY
          python tools/v310_apply_audit_fixes.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/test_audit_fixes.py');s=p.read_text()
          s=s.replace("'status=in_progress'", "'in_progress'")
          p.write_text(s)
          PY
          python -m py_compile tools/release.py tools/test_connection_recovery.py tools/test_maintenance.py tools/test_audit_fixes.py
          python tools/test_connection_recovery.py
          python tools/test_audit_fixes.py
      - name: Commit final source and remove temporary helper
        run: |
          git rm -f tools/v310_apply_audit_fixes.py .github/workflows/tmp-v310-audit-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply Anderson Home v3.1.10 audit fixes"
          git push origin HEAD:work/v3.1.10-audit-fixes
