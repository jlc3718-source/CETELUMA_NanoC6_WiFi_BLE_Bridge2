name: Generate Jason Home Server Lockfile

on:
  push:
    branches: [jason-home-cloudflare-rebuild]
    paths: ['.github/workflows/generate-jason-home-server-lock.yml']

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile
        working-directory: JasonHomeServer
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          echo LOCKFILE_BEGIN
          base64 -w0 package-lock.json
          echo
          echo LOCKFILE_END
