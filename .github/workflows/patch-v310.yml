name: Patch Anderson v3.1.0
on:
  push:
    branches:
      - staging/v3.1.0-major-repair
    paths:
      - tools/patch_v310_core.py
      - tools/patch_v310_web.py
      - tools/patch_v310_ci.py
      - tools/patch_v310_fixups.py
      - tools/patch_v310_jsfix.py
      - .github/workflows/patch-v310.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/v3.1.0-major-repair
          fetch-depth: 1
      - name: Fetch exact v3.0.28 original event colors
        run: |
          git fetch --depth=1 origin bfc3fa765f2d789f441d749ad54e86a3ab95820e
          git show FETCH_HEAD:firmware/src/EventCatalog.cpp > /tmp/EventCatalog_v3028.cpp
      - name: Apply v3.1.0 core repairs
        run: python tools/patch_v310_core.py
      - name: Apply v3.1.0 web repairs
        run: python tools/patch_v310_web.py
      - name: Apply v3.1.0 CI and metadata changes
        run: python tools/patch_v310_ci.py
      - name: Apply final source safety fixups
        run: python tools/patch_v310_fixups.py
      - name: Clean removed schedule-handler JavaScript
        run: python tools/patch_v310_jsfix.py
      - name: Validate source regression gates
        run: |
          python tools/test_v310_regressions.py
          python tools/test_maintenance.py
          python tools/test_connection_recovery.py
      - name: Validate web JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for src,name in [(Path('firmware/web/index.html').read_text(),'index'),(Path('firmware/web/recovery.html').read_text(),'recovery')]:
              blocks=re.findall(r'<script[^>]*>(.*?)</script>',src,re.S)
              Path('/tmp/'+name+'.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/index.js
          node --check firmware/web/v3_mockup.js
          node --check /tmp/recovery.js
      - name: Confirm no unsupported/dead UI paths remain
        run: |
          ! grep -R "Effect::Gradient" firmware/src firmware/include
          ! grep -R "api/events/bulk" firmware/src firmware/web
          ! grep -R "eventsSchedule1Toggle\|eventsSchedule2Toggle\|enableMonth\|clearMonth" firmware/web
      - name: Commit repaired source
        run: |
          git config user.name jlc3718-source
          git config user.email jlc3718@gmail.com
          git add firmware FIRMWARE_VERSION.txt README.md tools/test_v310_regressions.py .github/scripts/anderson-cache-cleanup.sh
          git commit -m "Prepare Anderson Home v3.1.0 major repair"
          git push origin HEAD:staging/v3.1.0-major-repair
