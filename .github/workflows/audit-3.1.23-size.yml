name: Audit Anderson Home 3.1.23 Size

on:
  push:
    branches: ['analysis/3.1.23-size-audit']
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/3.1.23-size-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install canonical build dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund

      - name: Enable linker map for this audit only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firmware/platformio.ini')
          s=p.read_text()
          anchor='    -Wl,--gc-sections\n'
          assert anchor in s
          s=s.replace(anchor,anchor+'    -Wl,-Map=firmware.map\n',1)
          p.write_text(s)
          PY

      - name: Compile exact production source
        run: pio run -d firmware -e m5stack-nanoc6 -j 4

      - name: Generate detailed size audit
        run: |
          set -euo pipefail
          mkdir -p size-audit
          ELF=firmware/.pio/build/m5stack-nanoc6/firmware.elf
          BIN=firmware/.pio/build/m5stack-nanoc6/firmware.bin
          SIZE=$(find "$HOME/.platformio/packages" -type f -name 'riscv32-esp-elf-size' | head -n1)
          NM=$(find "$HOME/.platformio/packages" -type f -name 'riscv32-esp-elf-nm' | head -n1)
          test -x "$SIZE"
          test -x "$NM"
          "$SIZE" "$ELF" | tee size-audit/size-summary.txt
          "$SIZE" -A "$ELF" > size-audit/sections.txt
          "$NM" -S --size-sort --radix=d --demangle "$ELF" > size-audit/symbols-all.txt
          tail -n 250 size-audit/symbols-all.txt | tac > size-audit/largest-symbols.txt
          MAP=$(find firmware -name 'firmware.map' -o -name '*.map' | head -n1 || true)
          if [ -n "$MAP" ]; then cp "$MAP" size-audit/firmware.map; fi
          cp "$ELF" size-audit/firmware.elf
          cp "$BIN" size-audit/firmware.bin
          python - <<'PY'
          from pathlib import Path
          import re, os
          slot=0x1E0000
          binp=Path('size-audit/firmware.bin')
          b=binp.stat().st_size
          headroom=slot-b
          pct=b/slot*100
          sec=[]
          for line in Path('size-audit/sections.txt').read_text(errors='ignore').splitlines():
              m=re.match(r'^(\S+)\s+(\d+)\s+',line)
              if m:
                  sec.append((m.group(1),int(m.group(2))))
          sec_sorted=sorted(sec,key=lambda x:x[1],reverse=True)
          syms=[]
          for line in Path('size-audit/symbols-all.txt').read_text(errors='ignore').splitlines():
              parts=line.split(maxsplit=4)
              if len(parts)>=4 and parts[1].isdigit():
                  try: syms.append((int(parts[1]),parts[-1]))
                  except: pass
          syms=sorted(syms,reverse=True)
          md=[]
          md.append('# Anderson Home 3.1.23 linked-image size audit')
          md.append('')
          md.append(f'- Firmware BIN: **{b:,} bytes**')
          md.append(f'- OTA slot: **{slot:,} bytes**')
          md.append(f'- Slot utilization: **{pct:.2f}%**')
          md.append(f'- Remaining OTA headroom: **{headroom:,} bytes ({100-pct:.2f}%)**')
          md.append('')
          md.append('## Largest ELF sections')
          md.append('')
          md.append('| Section | Bytes |')
          md.append('|---|---:|')
          for name,size in sec_sorted[:20]: md.append(f'| `{name}` | {size:,} |')
          md.append('')
          md.append('## Largest linked symbols')
          md.append('')
          md.append('| Bytes | Symbol |')
          md.append('|---:|---|')
          for size,name in syms[:40]:
              name=name.replace('|','\\|')
              md.append(f'| {size:,} | `{name}` |')
          Path('size-audit/report.md').write_text('\n'.join(md)+'\n')
          print('\n'.join(md[:30]))
          PY

      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.23-Size-Audit
          path: size-audit/*
          if-no-files-found: error
