name: Inspect Anderson MainActivity Temp

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-mainactivity-temp.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Android source files
        run: |
          rm -rf inspect_android
          mkdir inspect_android
          unzip -q Anderson_Home_Complete_Project.zip -d inspect_android
          echo '===== MAIN ACTIVITY ====='
          cat inspect_android/Anderson_Home_Complete_Project/android/app/src/main/java/com/andersonhome/controller/MainActivity.kt
          echo '===== MANIFEST ====='
          cat inspect_android/Anderson_Home_Complete_Project/android/app/src/main/AndroidManifest.xml
          echo '===== LAYOUT ====='
          cat inspect_android/Anderson_Home_Complete_Project/android/app/src/main/res/layout/activity_main.xml
          echo '===== BUILD GRADLE ====='
          cat inspect_android/Anderson_Home_Complete_Project/android/app/build.gradle.kts
