name: SD300 Agnes full-model video-reference pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sd300-agnes-reference-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sd300-agnes-reference-pilot
  cancel-in-progress: false
jobs:
  render:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 9
    steps:
      - name: Render source-faithful opening with Agnes Video 2.5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,time,os,sys
          from pathlib import Path
          root=Path('/home/ubuntu/agnes-sd300-remake')
          root.mkdir(mode=0o700,parents=True,exist_ok=True)
          key=Path('/home/ubuntu/agnes-sd300/key').read_text().strip()
          url='https://d2ol7oe51mr4n9.cloudfront.net/user_3I78bAgAKSQ09I3KPQ5JmJ4WjHY/fa54c58f-9b51-457e-8051-99efb53753a3.mp4'
          payload={'model':'agnes-video-2.5','mode':'reference','seconds':'10',
             'size':'1080P','aspect_ratio':'9:16','n':1,
             'prompt':('Faithful, ultra-photorealistic luxury commercial video-to-video remaster of the referenced REAL 10-second outdoor work-gear clip. '+
               'Match the actual reference every moment: worn black work boots, red and black Milwaukee work gloves, wet gravel, grass and fallen leaves. '+
               'Keep EXACT boot and glove silhouettes, color, logos, textures, placement, movement and timing, and identical camera angle and composition. '+
               'Visually refine into immaculate cinematic documentary-grade detail, balanced dynamic range, rich true blacks, natural material texture, clear fine detail, and realistic professional lighting. '+
               'Do not add, remove, substitute or morph any object; no AI-fake footwear, new hands, people, cartoon rendering, artificial water spray, logos, captions, or scene changes. '+
               'Strictly no added audio, voice, music or narration.'),
             'videos':[{'url':url}]}
          req=urllib.request.Request('https://apihub.agnes-ai.com/v1/videos',
            data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+key,
              'Content-Type':'application/json','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=60) as resp:
                  code=resp.status; body=json.load(resp)
          except urllib.error.HTTPError as e:
              code=e.code
              try: body=json.loads(e.read(6000))
              except Exception:body={}
          print('PILOT_SUBMIT_HTTP',code,flush=True)
          result=body.get('data') or body.get('result') or body
          if not isinstance(result,dict):result={}
          vid=result.get('video_id') or result.get('id') or result.get('task_id')
          state={'model':'agnes-video-2.5','status':'submitted' if vid else 'blocked',
                 'http':code,'video_id':str(vid) if vid else None,'created_at':int(time.time())}
          if code>=400 or not vid:
              state['error']=str(body.get('message') or body.get('error') or body.get('detail') or '')[:250]
              (root/'pilot.json').write_text(json.dumps(state,indent=2)+'\n')
              print('PILOT_BLOCKED',code,state['error'],flush=True)
              raise SystemExit(0)
          (root/'pilot.json').write_text(json.dumps(state,indent=2)+'\n')
          print('PILOT_VIDEO_ID',vid,flush=True)
          for attempt in range(19):
              time.sleep(15)
              q=urllib.parse.urlencode({'video_id':str(vid),'model_name':'agnes-video-2.5'})
              try:
                  with urllib.request.urlopen(urllib.request.Request('https://apihub.agnes-ai.com/agnesapi?'+q,
                    headers={'Authorization':'Bearer '+key,'Accept':'application/json'}),timeout=35) as resp: info=json.load(resp)
              except urllib.error.HTTPError as e:
                  print('PILOT_POLL_HTTP',e.code,'attempt',attempt+1,flush=True)
                  continue
              r=info.get('data') or info.get('result') or info
              if not isinstance(r,dict):r=info
              status=str(r.get('status') or info.get('status') or 'unknown').lower()
              state['status']=status
              (root/'pilot.json').write_text(json.dumps(state,indent=2)+'\n')
              print('PILOT_STATUS',attempt+1,status,flush=True)
              if status in ('failed','error','canceled','cancelled'):
                  state['error']=str(info.get('message') or info.get('error') or r.get('message') or '')[:250]
                  (root/'pilot.json').write_text(json.dumps(state,indent=2)+'\n')
                  break
              if status in ('completed','succeeded','success','done'):
                  video_url=r.get('url') or r.get('video_url') or info.get('url')
                  if not video_url:print('PILOT_COMPLETED_NO_URL',flush=True);break
                  try:
                      with urllib.request.urlopen(video_url,timeout=180) as resp:data=resp.read(80000001)
                      assert 10000<len(data)<=80000000 and b'ftyp' in data[:64], 'Video failed MP4 validation'
                      out=root/'pilot_00.mp4'
                      tmp=root/'pilot_00.tmp'
                      tmp.write_bytes(data);tmp.replace(out)
                      state['file_bytes']=len(data)
                      state['status']='downloaded'
                      (root/'pilot.json').write_text(json.dumps(state,indent=2)+'\n')
                      print('PILOT_VIDEO_DOWNLOADED_BYTES',len(data),flush=True)
                  except Exception as err:
                      print('PILOT_DOWNLOAD_FAILED',type(err).__name__,flush=True)
                  break
          print('PILOT_FINAL_STATUS',state['status'],flush=True)
          PY
      - name: Attach pilot preview when available
        uses: actions/upload-artifact@v4
        with:
          name: SD300-Agnes-Reference-Pilot
          path: /home/ubuntu/agnes-sd300-remake/pilot_00.mp4
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
