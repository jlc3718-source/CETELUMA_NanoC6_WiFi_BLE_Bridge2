name: Stage Exact Local Anderson BIN 3.1.34

on:
  push:
    branches: ['staging-upload-3.1.34']
    paths: ['.github/transfer-trigger-3.1.34.txt']

permissions:
  contents: write

jobs:
  stage-exact-local-bin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-upload-3.1.34
          fetch-depth: 1
      - name: Download and verify exact locally built BIN
        run: |
          set -euo pipefail
          URL='https://sdmntpreastus2.oaiusercontent.com/files/00000000-7dcc-81f6-9618-c5fddc95e5b5/raw?se=2026-09-15T01%3A39%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=99a8c6b2-8265-5721-bb53-60c16507ae79&skoid=c36a4874-d531-4a8d-99fc-7da0d9143d9c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A18%3A03Z&ske=2026-09-15T20%3A18%3A03Z&sks=b&skv=2026-02-06&sig=AQpeQBr/UKCb88jF/CRaZWx44zYiEmtzfJ3Qy0jssJM%3D'
          curl --fail --location --retry 2 --connect-timeout 20 "$URL" -o /tmp/and_3.1.34.bin
          test "$(stat -c%s /tmp/and_3.1.34.bin)" = "1826112"
          echo '8c07e9d1630bb7cb73be19e20abb8221118bb1d77dc46cfe6edf626e356301b9  /tmp/and_3.1.34.bin' | sha256sum -c -
          test "$(od -An -tx1 -N1 /tmp/and_3.1.34.bin | tr -d ' \n')" = "e9"
          mkdir -p prebuilt
          xz -9 -c /tmp/and_3.1.34.bin > prebuilt/and_3.1.34.bin.xz
          cat > prebuilt/release.json <<'JSON'
          {
            "version": "3.1.34",
            "commit": "2015be4747b5c6d09b191be01a7a8d833d3edd0e",
            "ota_slot_bytes": 1966080,
            "ui_sha256": "713a85a571c97f0dcdb13e66b756298c53e64c295e8fdd63e543b467fdd871c1",
            "files": {
              "and_3.1.34.bin": {
                "bytes": 1826112,
                "sha256": "8c07e9d1630bb7cb73be19e20abb8221118bb1d77dc46cfe6edf626e356301b9"
              }
            },
            "web_assets": {
              "WEB_UI": {
                "bytes": 190325,
                "sha256": "713a85a571c97f0dcdb13e66b756298c53e64c295e8fdd63e543b467fdd871c1",
                "gzip_bytes": 48721,
                "gzip_sha256": "12956e951991e3950184a40b0b1bcbb1a79837fe5ca475aaff2a7b0a09d80f48"
              },
              "RECOVERY_UI": {
                "bytes": 5403,
                "sha256": "f02f1ba346a9dfbfb319afadfb7e288382c04d59565dad7ee3bd0b5d215f8c34",
                "gzip_bytes": 2499,
                "gzip_sha256": "3cfc110bbb267f78bd3f7c2b0f0afc6f884ca626d4fe7090c392cf57fdeeeb96"
              }
            },
            "web_compression": "zopfli-0.2.3.post1-gzip-1000-unlimited-blocks"
          }
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prebuilt/and_3.1.34.bin.xz prebuilt/release.json
          git commit -m 'Stage exact locally built Anderson 3.1.34 BIN for OTA publication'
          git push origin HEAD:staging-upload-3.1.34
