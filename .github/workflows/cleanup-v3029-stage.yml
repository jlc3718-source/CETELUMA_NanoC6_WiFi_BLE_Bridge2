name: Clean v3.0.29 staging helpers
on:
  push:
    branches:
      - staging/v3.0.29-expanded-palette
    paths:
      - .github/workflows/cleanup-v3029-stage.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/v3.0.29-expanded-palette
      - name: Remove temporary patch tooling
        run: |
          git config user.name jlc3718-source
          git config user.email jlc3718@gmail.com
          git rm -f .github/workflows/patch-v3029.yml .github/workflows/finalize-v3029.yml .github/workflows/cleanup-v3029-stage.yml tools/patch_v3029_expanded_palette.py tools/patch_v3029_expanded_palette_v2.py tools/finalize_v3029.py
          git commit -m "Remove temporary v3.0.29 patch tooling"
          git push origin HEAD:staging/v3.0.29-expanded-palette
