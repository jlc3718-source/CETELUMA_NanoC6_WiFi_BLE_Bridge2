name: JH2 Nano 1.1.68 Signed Oracle Launcher - Build and Back Up
on:
  push:
    branches: [feature/jh2-nano-oracle-launch-settings-20261024]
    paths: [.github/workflows/jh2-168-signed-oracle-launch.yml]
permissions: {contents: write, actions: read}
concurrency:
  group: jh2-168-signed-oracle-launch-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify known-good recovery image and pinned signed manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup-167
          gh release download jason-home-2-nanoc6-v1.1.67 --repo "$GITHUB_REPOSITORY" \
            --pattern jh2-runtime-1.1.67.bin --pattern latest.json --pattern release.json \
            --dir backup-167
          python3 - <<'PY'
          import base64,hashlib,json,subprocess,tempfile
          from pathlib import Path
          d=Path('backup-167')
          m=json.loads((d/'latest.json').read_text())
          meta=json.loads((d/'release.json').read_text())
          f=dict(x.split('=',1) for x in m['payload'].strip().splitlines())
          image=(d/'jh2-runtime-1.1.67.bin').read_bytes()
          assert f['product']=='jason-home-2-nanoc6' and f['version']==meta['version']=='1.1.67'
          assert len(image)==int(f['bytes']) and len(image)<=0x290000
          assert hashlib.sha256(image).hexdigest()==f['sha256']
          assert image[0]==0xe9 and image[12]==13 and image[13]==0
          assert b'jason-home-2-nanoc6-runtime-v1' in image
          with tempfile.TemporaryDirectory() as tmp:
              p=Path(tmp)
              (p/'payload').write_text(m['payload'])
              (p/'signature').write_bytes(base64.b64decode(m['signature'],validate=True))
              subprocess.run(['openssl','dgst','-sha256','-verify','remote-update/anderson_ota_signing_public.pem','-signature',str(p/'signature'),str(p/'payload')],check=True)
          print('BACKUP_167_EXISTING_SIGNED_RUNTIME_VERIFIED',len(image),f['sha256'])
          PY
      - name: Verify launcher and factory recovery constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          w=Path('JasonHome2NanoC6_IDF/main/web_recovery.c').read_text()
          b=Path('JasonHome2NanoC6_IDF/main/bridge.c').read_text()
          s=Path('JasonHome2NanoC6_IDF/main/signed_ota.c').read_text()
          assert '#define NATIVE_FW_VERSION "1.1.68"' in b
          assert '1.1.68-oracle-launch' in w
          assert 'request_on_sta(r)' in w and 'ip!=0xc0a80401UL' in w
          assert 'saved_oracle_endpoint[len-1]' in w
          assert '{.uri="/settings/nano",.method=HTTP_GET,.handler=html_get}' in w
          assert '{.uri="/setup",.method=HTTP_GET,.handler=html_get}' in w
          assert '{.uri="/firmware",.method=HTTP_GET,.handler=html_get}' in w
          assert '{.uri="/status",.method=HTTP_GET,.handler=html_get}' in w
          assert 'Recovery / rollback to 1.1.67' in w
          assert 'jh2-runtime-1.1.67.bin' in w
          assert 'jh2_enter_local_recovery()' in w
          assert 'esp_ota_get_running_partition()' in s
          assert 'ESP_PARTITION_SUBTYPE_APP_FACTORY' in s
          assert 'format_if_mount_failed=false' in w
          assert 'nvs_flash_erase(' not in w+b+s
          print('NANO_168_SAFE_LAUNCHER_AND_MANUAL_ROLLBACK_CHECKS_PASS')
          PY
          gcc -std=c11 -Wall -Wextra -Werror -O2 JasonHome2NanoC6_IDF/main/effectlist.c JasonHome2NanoC6_IDF/tests/effectlist_test.c -o /tmp/jh2-effects
          /tmp/jh2-effects
      - name: Compile signed-release candidate using production flags
        shell: bash
        run: |
          cat >> JasonHome2NanoC6_IDF/sdkconfig.defaults <<'EOF'
          CONFIG_JH2_NATIVE_ENABLE_ORACLE=y
          CONFIG_JH2_NATIVE_BROWSER_OTA_COMPAT=y
          CONFIG_JH2_NATIVE_READONLY_ACCEPTANCE=n
          EOF
      - name: Build ESP-IDF 5.5.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32c6
          path: JasonHome2NanoC6_IDF
          command: idf.py build
      - name: Verify image and sign the v1.1.68 release
        env:
          OTA_SIGNING_KEY_B64: ${{ secrets.ANDERSON_OTA_SIGNING_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OTA_SIGNING_KEY_B64"
          mkdir -p signed-package
          cp JasonHome2NanoC6_IDF/build/jh2_native_ble_probe.bin signed-package/jh2-runtime-1.1.68.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          d=Path('signed-package');b=(d/'jh2-runtime-1.1.68.bin').read_bytes()
          assert 0x120000<len(b)<=0x290000 and b[0]==0xe9 and b[12]==13 and b[13]==0
          assert b'jason-home-2-nanoc6-runtime-v1' in b
          assert b'1.1.68-oracle-launch' in b and b'/settings/nano' in b
          m={'product':'jason-home-2-nanoc6','version':'1.1.68','commit':os.environ['GITHUB_SHA'],
             'files':{'jh2-runtime-1.1.68.bin':{'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}}}
          (d/'release.json').write_text(json.dumps(m,indent=2)+'\n')
          print('FIRMWARE_168_IMAGE_VERIFIED',len(b),m['files']['jh2-runtime-1.1.68.bin']['sha256'])
          PY
          key="$RUNNER_TEMP/jh2-ota-sign.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$OTA_SIGNING_KEY_B64" | base64 -d > "$key"
          chmod 600 "$key"
          python3 JasonHome2NanoC6/tools/sign_manifest.py --key "$key" --release signed-package/release.json --output signed-package/latest.json
          python3 - <<'PY'
          import base64,json,subprocess,tempfile
          from pathlib import Path
          d=Path('signed-package');m=json.loads((d/'latest.json').read_text())
          assert m['schema']==1 and 'version=1.1.68\n' in m['payload']
          with tempfile.TemporaryDirectory() as tmp:
              p=Path(tmp);(p/'payload').write_text(m['payload'])
              (p/'signature').write_bytes(base64.b64decode(m['signature'],validate=True))
              subprocess.run(['openssl','dgst','-sha256','-verify','remote-update/anderson_ota_signing_public.pem','-signature',str(p/'signature'),str(p/'payload')],check=True)
          print('SIGNED_168_MANIFEST_VERIFIED')
          PY
      - name: Publish immutable 1.1.68 rollback-capable release - no device install
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view jason-home-2-nanoc6-v1.1.68 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing signed firmware release'
            exit 1
          fi
          gh release create jason-home-2-nanoc6-v1.1.68 \
            signed-package/jh2-runtime-1.1.68.bin signed-package/latest.json signed-package/release.json \
            --repo "$GITHUB_REPOSITORY" --title "Jason Home 2 NanoC6 1.1.68 — Oracle Launcher" \
            --notes "Verified prior 1.1.67 image retained for manual factory recovery. Local Nano / redirects to saved Oracle website when Wi-Fi is ready. /settings/nano, /firmware, /status and Setup AP are preserved. Single runtime slot: no automatic dual-slot rollback."
          echo "SIGNED_RELEASE_PUBLISHED_NO_NANO_INSTALL"
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-1.1.68-SIGNED-RELEASE-AND-1.1.67-ROLLBACK
          path: |
            signed-package/
            backup-167/
          retention-days: 30
          if-no-files-found: error
