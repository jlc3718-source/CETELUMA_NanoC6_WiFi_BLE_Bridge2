name: Fix Customized Backup Path v3.1.13

on:
  push:
    branches: ['work/v3.1.13-backup-path-fix']

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.1.13-backup-path-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release test dependencies
        run: python -m pip install -q -r tools/requirements-build.txt
      - name: Apply SPIFFS-safe backup path fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('firmware/src/CustomizedBackup.cpp')
          s=p.read_text()
          old='static constexpr const char* CUSTOM_BACKUP_PATH="/customized-settings-backup.json";\nstatic constexpr const char* CUSTOM_BACKUP_TMP="/customized-settings-backup.tmp";'
          new='// ESP32 SPIFFS object names are limited; keep live paths <=31 characters including the leading slash.\nstatic constexpr const char* CUSTOM_BACKUP_PATH="/cust-backup.json";\nstatic constexpr const char* CUSTOM_BACKUP_TMP="/cust-backup.tmp";\n// v3.1.12 used an overlength final name. The temp name was valid and can contain a verified backup after the failed promotion.\nstatic constexpr const char* LEGACY_BACKUP_PATH="/customized-settings-backup.json";\nstatic constexpr const char* LEGACY_BACKUP_TMP="/customized-settings-backup.tmp";\nstatic_assert(sizeof("/cust-backup.json")-1<=31,"SPIFFS backup path too long");\nstatic_assert(sizeof("/cust-backup.tmp")-1<=31,"SPIFFS backup temp path too long");'
          assert old in s
          s=s.replace(old,new,1)
          pattern=r'void customizedSettingsBackupBegin\(\)\{.*?\n\}\n\nbool customizedSettingsBackupCreate'
          replacement='void customizedSettingsBackupBegin(){\n  backupFsReady=SPIFFS.begin(false);if(!backupFsReady)return;\n\n  // Recover the verified v3.1.12 temporary backup left behind when its overlength\n  // destination filename could not be created. Also accept the legacy final name\n  // if a filesystem implementation happened to allow it.\n  const char* legacyCandidates[]={LEGACY_BACKUP_TMP,LEGACY_BACKUP_PATH};\n  if(!SPIFFS.exists(CUSTOM_BACKUP_PATH)){\n    for(const char* candidate:legacyCandidates){\n      if(!SPIFFS.exists(candidate))continue;\n      String raw=readFile(candidate);JsonDocument d;\n      if(parseBackup(raw,d,nullptr)){\n        String ignored;\n        if(writeBackupPayload(raw,ignored)){SPIFFS.remove(candidate);break;}\n      }else SPIFFS.remove(candidate);\n    }\n  }\n\n  // Recover an interrupted write using only SPIFFS-safe short filenames.\n  if(SPIFFS.exists(CUSTOM_BACKUP_TMP)){\n    if(SPIFFS.exists(CUSTOM_BACKUP_PATH)){SPIFFS.remove(CUSTOM_BACKUP_TMP);}\n    else{\n      String raw=readFile(CUSTOM_BACKUP_TMP);JsonDocument d;\n      if(parseBackup(raw,d,nullptr)){\n        if(!SPIFFS.rename(CUSTOM_BACKUP_TMP,CUSTOM_BACKUP_PATH))SPIFFS.remove(CUSTOM_BACKUP_TMP);\n      }else SPIFFS.remove(CUSTOM_BACKUP_TMP);\n    }\n  }\n\n  // Once a valid short-name backup exists, stale v3.1.12 artifacts are no longer needed.\n  if(SPIFFS.exists(CUSTOM_BACKUP_PATH)){\n    if(SPIFFS.exists(LEGACY_BACKUP_TMP))SPIFFS.remove(LEGACY_BACKUP_TMP);\n    if(SPIFFS.exists(LEGACY_BACKUP_PATH))SPIFFS.remove(LEGACY_BACKUP_PATH);\n  }\n}\n\nbool customizedSettingsBackupCreate'
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          assert n==1
          p.write_text(s2)
          Path('FIRMWARE_VERSION.txt').write_text('3.1.13\n')
          text=p.read_text()
          for value in ['/cust-backup.json','/cust-backup.tmp']:
            assert len(value)<=31,(value,len(value))
            assert f'"{value}"' in text
          assert 'LEGACY_BACKUP_TMP="/customized-settings-backup.tmp"' in text
          assert 'writeBackupPayload(raw,ignored)' in text
          assert Path('FIRMWARE_VERSION.txt').read_text().strip()=='3.1.13'
          print('PASS v3.1.13 SPIFFS-safe backup names and legacy temp recovery')
          PY
          python tools/test_regressions.py
          python tools/test_audit_fixes.py
          python tools/test_maintenance.py
      - name: Commit fix and remove helper
        run: |
          rm -f .github/workflows/zz-fix-backup-path-v3.1.13.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix customized backup SPIFFS promotion path"
          git push origin HEAD:refs/heads/work/v3.1.13-backup-path-fix
