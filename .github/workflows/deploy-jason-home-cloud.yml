name: Deploy Jason Home Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - jason-home-cloudflare-rebuild
    paths:
      - 'JasonHomeCloud/DEPLOY_NOW'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: JasonHomeCloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EUFY_EMAIL: ${{ secrets.EUFY_EMAIL }}
      EUFY_PASSWORD: ${{ secrets.EUFY_PASSWORD }}
      JASON_HOME_API_TOKEN: ${{ secrets.JASON_HOME_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$EUFY_EMAIL" || { echo "Missing EUFY_EMAIL"; exit 1; }
          test -n "$EUFY_PASSWORD" || { echo "Missing EUFY_PASSWORD"; exit 1; }
          test -n "$JASON_HOME_API_TOKEN" || { echo "Missing JASON_HOME_API_TOKEN"; exit 1; }
      - name: Install
        run: npm install
      - name: Type check
        run: npm run check
      - name: Set Worker secrets
        shell: bash
        run: |
          printf '%s' "$EUFY_EMAIL" | npx wrangler secret put EUFY_EMAIL
          printf '%s' "$EUFY_PASSWORD" | npx wrangler secret put EUFY_PASSWORD
          printf '%s' "$JASON_HOME_API_TOKEN" | npx wrangler secret put JASON_HOME_API_TOKEN
      - name: Deploy existing production Worker
        run: npx wrangler deploy
