name: Deploy Jason Home Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - jason-home-cloudflare-rebuild
    paths:
      - 'JasonHomeCloud/MQTT_VERIFY_NOW'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: JasonHomeCloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EUFY_EMAIL: ${{ secrets.EUFY_EMAIL }}
      EUFY_PASSWORD: ${{ secrets.EUFY_PASSWORD }}
      JASON_HOME_API_TOKEN: ${{ secrets.JASON_HOME_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$EUFY_EMAIL" || { echo "Missing EUFY_EMAIL"; exit 1; }
          test -n "$EUFY_PASSWORD" || { echo "Missing EUFY_PASSWORD"; exit 1; }
          test -n "$JASON_HOME_API_TOKEN" || { echo "Missing JASON_HOME_API_TOKEN"; exit 1; }
      - name: Install
        run: npm install
      - name: Type check
        run: npm run check
      - name: Set Worker secrets
        shell: bash
        run: |
          printf '%s' "$EUFY_EMAIL" | npx wrangler secret put EUFY_EMAIL
          printf '%s' "$EUFY_PASSWORD" | npx wrangler secret put EUFY_PASSWORD
          printf '%s' "$JASON_HOME_API_TOKEN" | npx wrangler secret put JASON_HOME_API_TOKEN
      - name: Deploy existing production Worker
        run: npx wrangler deploy
      - name: Verify live health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://jason-home-cloud.jlc3718.workers.dev/api/health" -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True, d
          assert d.get('service')=='jason-home-cloud', d
          print('LIVE HEALTH PASS', d.get('architecture'), d.get('time'))
          PY
      - name: Verify authenticated Eufy cloud status
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/status.json -w '%{http_code}' -H "Authorization: Bearer $JASON_HOME_API_TOKEN" "https://jason-home-cloud.jlc3718.workers.dev/api/status?refresh=1")"
          python - "$code" <<'PY'
          import json,sys
          code=int(sys.argv[1])
          d=json.load(open('/tmp/status.json'))
          print('HTTP',code)
          print('controller=',d.get('controller'))
          print('eufy=',d.get('eufy'))
          print('devices=',[(x.get('name'),x.get('ready')) for x in d.get('devices',[])])
          if code!=200 or d.get('ok') is not True:
              raise SystemExit(d.get('error') or f'status HTTP {code}')
          e=d.get('eufy') or {}
          if not e.get('ready'):
              raise SystemExit('Eufy cloud is not ready: '+str(e.get('status')))
          names=set(e.get('readyNames') or [])
          expected={'Pool','House','Garage','Shed'}
          if names!=expected:
              raise SystemExit(f'Expected 4 ready strings, got {sorted(names)}')
          print('AUTHENTICATED EUFY STATUS PASS 4/4')
          PY
