name: Oracle Daily Entry Recovery

on:
  push:
    paths:
      - ".github/workflows/oracle-daily-entry-recovery.yml"
      - ".github/oracle-daily-entry-recovery.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-daily-entry-recovery
  cancel-in-progress: false

jobs:
  entries:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test agent and submit eligible online entries
        shell: bash
        run: |
          set -euo pipefail
          OUT=".github/oracle-daily-entry-recovery-result.jsonl"
          : > "$OUT"

          HEALTH="$(curl -sS --max-time 5 http://127.0.0.1:8932/health || true)"
          echo "Agent health: $HEALTH"
          if echo "$HEALTH" | grep -q '"login_active":true'; then
            echo "A tracked login session is active; refusing to terminate its browser."
            exit 2
          fi
          CID="$(sudo docker ps --filter name=oracle-browser-agent --format '{{.ID}}' | head -1)"
          if [ -z "$CID" ]; then echo "Oracle browser container not found"; exit 3; fi
          echo "Checking for stale Chromium processes holding the daily profile."
          sudo docker exec "$CID" sh -lc 'pkill -TERM -f "^/usr/lib/chromium/chromium .*--user-data-dir=/data/profiles/daily" || true'
          sleep 2
          echo "Remaining daily-profile Chromium processes:"
          sudo docker exec "$CID" sh -lc 'ps -ef | grep -E "[c]hromium .*--user-data-dir=/data/profiles/daily" || true'

          run_job() {
            local id="$1"
            local payload="$2"
            echo "Running $id"
            curl -sS --max-time 65 -X POST http://127.0.0.1:8932/run \
              -H 'Content-Type: application/json' --data "$payload" |
              python3 -c 'import sys,json,re; x=json.load(sys.stdin); r=x.get("result") or {}; o={"id":x.get("id",""),"ok":bool(x.get("ok")),"task":r.get("task",""),"status":r.get("status",r.get("state","")),"submitted":r.get("submitted",r.get("entry_submitted")),"confirmation":r.get("confirmation",r.get("confirmation_text","")),"reason":r.get("reason",r.get("need_action","")),"missing":r.get("missing",[]),"error":None if x.get("ok") else re.sub(r"[\\w.+-]+@[\\w.-]+\\.[A-Za-z]{2,}", "[EMAIL]", str(x.get("error","")))[:300]}; print(json.dumps(o))' >> "$OUT"
          }

          run_job "housecalls-ryobi" '{"id":"daily-housecalls-2026-10-09-final","task":"generic_form_entry","url":"https://housecallsdiy.com/sweepstakes","submit":true}'
          run_job "toolnut-monthly" '{"id":"daily-toolnut-2026-10-09","task":"generic_form_entry","url":"https://www.toolnut.com/pages/tool-nut-monthly-giveaway-win-free-tools","submit":true}'
          run_job "skilled-trades-study-prepare" '{"id":"daily-trades-study-2026-10-09","task":"generic_form_entry","url":"https://www.focusgroupplacement.com/study/98633/feedback-opportunity-for-skilled-trades-professionals","submit":false}'
          run_job "manual-only-queue" '{"id":"daily-manual-queue-2026-10-09","task":"manual_queue_add","items":[{"id":"concrete-tools-direct-oct-2026","title":"Concrete Tools Direct $1,039 Tool Bundle","url":"https://concretetoolsdirect.com/pages/sweepstakes","reason":"Official rules prohibit automated entry; manual entry only"},{"id":"klein-tools-expedition-oct-2026","title":"Klein Tools New Product Expedition","url":"https://www.kleintools.com/2026q3promo","reason":"Official rules require distributor QR or mail-in entry; manual entry only"}]}'

          cat "$OUT"

      - name: Publish scrubbed entry results
        shell: bash
        run: |
          set -e
          git config user.name "oracle-runner"
          git config user.email "oracle-runner@users.noreply.github.com"
          git add .github/oracle-daily-entry-recovery-result.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Oracle daily entry recovery results"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
