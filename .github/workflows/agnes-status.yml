name: Agnes VM Status Sync
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'agnes-remote/control.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agnes-status-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sanitized VM status
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 25 'https://oracle-home-dev.150.136.245.51.sslip.io/agnes-health.json' -o agnes-remote/status.json
          python3 -m json.tool agnes-remote/status.json >/dev/null
      - name: Commit updated status
        run: |
          git config user.name 'agnes-status-bot'
          git config user.email 'agnes-status-bot@users.noreply.github.com'
          git add agnes-remote/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Agnes VM status [skip ci]'
            git push
          fi
