name: Cleanup Old Workflow Run History

on:
  push:
    paths:
      - '.github/workflows/cleanup-run-history.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_PRODUCTION_RUN: '34307892076'
        run: |
          set -euo pipefail
          echo "Keeping production run $KEEP_PRODUCTION_RUN and current cleanup run $GITHUB_RUN_ID"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' |
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            if [ "$run_id" = "$KEEP_PRODUCTION_RUN" ] || [ "$run_id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            echo "Deleting workflow run $run_id"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          done
