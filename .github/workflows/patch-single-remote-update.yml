name: Patch Single Remote Update Button

on:
  push:
    branches: ['codex/release-current']
    paths: ['.github/trigger-single-remote-update.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-current
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collapse remote update controls into one automatic action
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1))

          p=Path('firmware/web/index.html')
          text=p.read_text()

          old_buttons='''      <button id="checkRemoteFirmware" class="btn" style="width:100%;margin-top:9px">Check for Remote Update</button>\n      <button id="installRemoteFirmware" class="btn primary" style="width:100%;margin-top:9px" disabled>Install Verified Remote Update</button><button id="resumeRemoteFirmware" class="btn" style="width:100%;margin-top:9px" hidden>Resume Automatic Updates</button>'''
          new_buttons='''      <button id="remoteFirmware" class="btn primary" style="width:100%;margin-top:9px">Remote Update</button><button id="resumeRemoteFirmware" class="btn" style="width:100%;margin-top:9px" hidden>Resume Automatic Updates</button>'''
          if text.count(old_buttons)!=1:
              raise SystemExit('remote update button block did not match exactly once')
          text=text.replace(old_buttons,new_buttons,1)

          old_status='''Automatic signed updates are enabled. The NanoC6 checks 20 seconds after boot and every 5 minutes while healthy, verifies the signature and SHA-256, installs to the inactive OTA slot, then reboots. Manual Check/Install remain available as fallback.'''
          new_status='''Automatic signed updates are enabled. Tap Remote Update to check the signed release, verify its signature and SHA-256, download and install any newer verified firmware to the inactive OTA slot, then reboot automatically.'''
          if text.count(old_status)!=1:
              raise SystemExit('remote update status copy did not match exactly once')
          text=text.replace(old_status,new_status,1)

          pattern=r'''async function checkRemoteFirmware\(\)\{.*?\}async function installRemoteFirmware\(\)\{.*?\}\}function refreshVisibleState'''
          replacement='''async function remoteFirmwareUpdate(){const e=$("remoteFirmware"),t=$("remoteFwStatus");e.disabled=!0,t.textContent="Checking for a verified remote update…";try{const n=await post("/api/remote-update/check",{},1e4);if(!n.operationId)throw new Error(n.message||"update check could not be queued");const o=await pollRemoteOperation(n.operationId,45e3);$("resumeRemoteFirmware").hidden=!o.updateHold;if(!o.ok||!o.signatureValid)throw new Error(o.message||"remote-update verification failed");if(!o.updateAvailable)return void(t.textContent=o.message||"Signed manifest verified; this firmware is current.");const a=o.availableVersion||"",s=o.commit||"";t.textContent=`Verified Anderson Home ${a||"update"}. Downloading and installing automatically…`;beginFirmwareOperation(await api("/api/firmware?ts="+Date.now()),{version:a,commit:s});const r=await post("/api/remote-update/install",{},1e4);if(!r.operationId)throw new Error(r.message||"install could not be queued");const i=await pollRemoteOperation(r.operationId,2e5);if(!i.ok||!i.installReady)throw new Error(i.message||"remote firmware installation failed");otaOperation.expectedVersion=i.availableVersion||a,otaOperation.expectedCommit=i.commit||s,t.textContent=`Anderson Home ${otaOperation.expectedVersion||"update"} verified and installed. NanoC6 is rebooting…`,$("fwStatus").textContent=t.textContent,waitForFirmwareReturn()}catch(n){t.textContent="Remote update failed: "+n.message,e.disabled=!1,clearFirmwareOperation()}}function refreshVisibleState'''
          text2,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if count!=1:
              raise SystemExit(f'remote update function block replacement count={count}')
          text=text2

          old_listeners='''$("checkRemoteFirmware").addEventListener("click",checkRemoteFirmware),$("installRemoteFirmware").addEventListener("click",installRemoteFirmware),$("resumeRemoteFirmware").addEventListener'''
          new_listeners='''$("remoteFirmware").addEventListener("click",remoteFirmwareUpdate),$("resumeRemoteFirmware").addEventListener'''
          if text.count(old_listeners)!=1:
              raise SystemExit('remote update listener block did not match exactly once')
          text=text.replace(old_listeners,new_listeners,1)

          if 'checkRemoteFirmware' in text or 'installRemoteFirmware' in text:
              raise SystemExit('legacy two-button remote update references remain')
          p.write_text(text)

          replace_once('FIRMWARE_VERSION.txt','3.1.46\n','3.1.47\n')
          replace_once(
              'firmware/src/main.cpp',
              'static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.46";',
              'static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.47";'
          )
          Path('firmware/RELEASE_NOTES_v3.1.47.md').write_text(
              '# Anderson Home v3.1.47\n\n'
              '- Replaces the separate **Check for Remote Update** and **Install Verified Remote Update** buttons with one **Remote Update** button.\n'
              '- One tap now checks the signed manifest, verifies the release, downloads it, installs it to the inactive OTA slot, and reboots automatically.\n'
              '- Existing signature, SHA-256, firmware identity, rollback, and update-hold protections remain in place.\n'
          )
          PY
      - name: Run focused regression checks
        run: |
          python tools/test_regressions.py
          python tools/test_audit_fixes.py
          python tools/test_connection_recovery.py
          grep -q 'id="remoteFirmware"' firmware/web/index.html
          grep -q '>Remote Update</button>' firmware/web/index.html
          grep -q 'remoteFirmwareUpdate' firmware/web/index.html
          ! grep -q 'checkRemoteFirmware' firmware/web/index.html
          ! grep -q 'installRemoteFirmware' firmware/web/index.html
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = "3.1.47"
      - name: Commit patch and remove one-shot scaffolding
        run: |
          rm -f .github/workflows/patch-single-remote-update.yml .github/trigger-single-remote-update.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Anderson Home 3.1.47 single automatic remote update"
          git push origin HEAD:codex/release-current
