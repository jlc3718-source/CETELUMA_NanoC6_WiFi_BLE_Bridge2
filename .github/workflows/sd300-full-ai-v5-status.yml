name: SD300 V5 live status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sd300-full-ai-v5-status.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - name: Report V5 actual render progress
        shell: bash
        run: |
          set -euo pipefail
          echo SD300_V5_SERVICE=$(systemctl is-active sd300-full-ai-v5.service || true)
          journalctl -u sd300-full-ai-v5.service -n 20 --no-pager -o cat | sed -E 's/(Bearer |api_key|token=)[^ ]+/\\1[REDACTED]/g' || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/home/ubuntu/agnes-sd300-v5/full-ai-v5-state.json')
          if not p.exists():
              print('SD300_V5_STATE_NOT_YET_CREATED')
          else:
              s=json.loads(p.read_text())
              print('SD300_V5_UPDATED',s.get('updated_utc'))
              print('SD300_V5_ASSEMBLY',s.get('assemble_status'))
              for k,v in sorted(s.get('scenes',{}).items()):
                  print('SD300_V5_SCENE',k,'status='+str(v.get('status')),'http='+str(v.get('http')),'attempts='+str(v.get('attempts')),'bytes='+str(v.get('file_bytes',0)),'job='+str(bool(v.get('job_id'))))
          PY

# Refresh V5 live status
