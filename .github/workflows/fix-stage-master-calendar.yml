name: Fix master calendar staging assertion
on:
  push:
    branches: [staging/palette-holiday-update]
    paths: [.github/workflows/fix-stage-master-calendar.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/palette-holiday-update
      - name: Correct event count assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/stage-master-calendar.yml')
          s=p.read_text()
          old="assert ev.count('{\"evt')==210, ev.count('{\"evt')"
          new="assert ev.split('};\\nconst size_t EVENT_COUNT',1)[0].count('EventKind::')==210"
          if old not in s: raise SystemExit('old assertion not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/fix-stage-master-calendar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix master calendar staging event count"
          git push origin HEAD:staging/palette-holiday-update
