name: JH2 Nano 2.0.21 Eufy Wi-Fi-first Bluetooth fallback signed BUILD ONLY
on:
  push:
    branches: [feature/jh2-eufy-wifi-primary-ble-fallback-20261109]
    paths: ['.github/workflows/jh2-221-eufy-wifi-fallback-signed-buildonly-20261109.yml', 'JasonHome2NanoC6_IDF/**']
permissions: {contents: read}
concurrency: {group: jh2-221-eufy-wifi-fallback-signed-build-only, cancel-in-progress: false}
jobs:
  signed-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Safety preflight and native tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('JasonHome2NanoC6_IDF')
          table=(p/'partitions.csv').read_text()
          for item in ['rescue, app, factory, 0x10000, 0x100000','runtime, app, ota_0, 0x110000, 0x160000','runtime_b, app, ota_1, 0x270000, 0x160000','storage, data, spiffs, 0x3D0000, 0x2F000']:
              assert item in table,item
          bridge=(p/'main/bridge.c').read_text()
          for required in ('esp_wifi_set_max_tx_power','esp_wifi_get_max_tx_power',
             'esp_ble_tx_power_set_enhanced','esp_ble_tx_power_get_enhanced',
             'radio_status(status)','radio_command(payload,result','jh2_bridge_signed_firmware'):
              assert required in bridge,required
          for feature in ('esp_coex_preference_set','nanoCoexistence','coex_status(status)',
             'esp_wifi_set_ps','esp_wifi_get_ps','nvs_open("jh2_coex"'):
              assert feature in bridge,feature
          assert 'ESP_COEX_SW_COEXIST_ENABLE=y' in (p/'sdkconfig.defaults').read_text()
          assert 'esp_coex' in (p/'main/CMakeLists.txt').read_text()
          assert 'surveysDeferredDuringCurtainStreaming' in (p/'main/eufy_ble.c').read_text()
          assert 'jh2_asset_stream_active()&&!bg_manual_scan_request' in (p/'main/eufy_ble.c').read_text()
          print('JH2_221_ESP_COEX_API_MANUAL_SURVEY_AND_WIFI_PS_GUARDS_PASS')
          codec=(p/'main/eufy_e10.c').read_text()
          eufy=(p/'main/eufy_ble.c').read_text()
          for feature in ('eufy_e10_read_status','eufy_e10_preset','eufy_e10_dynamic','eufy_parse_state','0x4A00','0x4204'):
              assert feature in codec,feature
          for feature in ('eufy_device_state_mismatch','expected_device_state','query_device_state',
                          'automaticScansDisabledForWifiPriority','reportedCloudEffectId'):
              assert feature in eufy,feature
          assert '#define NATIVE_FW_VERSION "2.0.21"' in bridge
          assert 'preset_bytes[191]' in bridge and 'EUFY_BLE_PRESET' in bridge
          print('JH2_221_REAL_DEVICE_READBACK_E22_EFFECT_FALLBACK_GUARDS_PASS')
          assert 'jh2_ble_connection_handle(void)' in (p/'main/main.c').read_text()
          assert 'nvs_flash_erase(' not in (p/'main/main.c').read_text()
          print('JH2_221_TX_POWER_HARDWARE_READBACK_NVS_RESTORE_AND_OTA_PRESERVATION_PASS')
          assert '#define NATIVE_FW_VERSION "2.0.21"' in bridge
          assert 'format_if_mount_failed=false' in bridge
          assert 'jh2_eufy_ble_execute' in bridge
          assert 'CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2' in (p/'sdkconfig.defaults').read_text()
          assert 'eufy_ble.c' in (p/'main/CMakeLists.txt').read_text()
          eufy=(p/'main/eufy_ble.c').read_text()
          assert 'background_event' in eufy and 'lastAdvertisementAgeSeconds' in eufy
          assert 'ble_gap_conn_cancel()' in eufy and 'jh2_eufy_ble_rescan' in eufy
          assert 'ble_gap_connect_cancel()' not in eufy
          assert 'jh2_eufy_ble_rescan' in bridge
          assert 'scanResults' in eufy and 'record_advert' in eufy
          assert 'EUFY_BLE_PROBE' in eufy and 'lastProbeAgeSeconds' in eufy
          assert 'request.operation=EUFY_BLE_PROBE' in bridge
          print('JH2_221_PASSIVE_ALL_BLE_INVENTORY_AND_READONLY_E10_PROBE_TEST_PASS')
          print('JH2_221_EUFY_PER_DEVICE_PRESENCE_AND_GATT_RECONNECT_TEST_PASS')
          assert 'static cJSON *https_json_sync(' in bridge
          assert '.keep_alive_enable=true' in bridge
          assert 'if(strcmp(path,"/api/curtain-bridge/sync")==0)' in bridge
          assert 'esp_http_client_cleanup(sync_http)' in bridge
          assert '"JH2_SYNC_TRANSPORT' in bridge
          print('JH2_221_PERSISTENT_TLS_RETRY_ISOLATION_TEST_PASS')
          assert 'nvs_flash_erase(' not in bridge
          asset=(p/'main/asset_stream.c').read_text()
          assert 'jh2_slot_type3_verified' in asset
          assert '#include "esp_timer.h"' in asset
          assert 'frame_started_us=esp_timer_get_time()' in asset
          assert 'remaining_ms=adjusted>ble_ms?adjusted-ble_ms:0' in asset
          assert 'elapsed<remaining_ms' in asset
          assert 'elapsed<adjusted' not in asset
          assert 'frame_deadline_overruns' in asset
          print('JH2_221_FRAME_CADENCE_DEADLINE_TEST_PASS')
          assert 'op==2626' in (p/'main/native_slot_guard.c').read_text() and 'op==2622' in (p/'main/native_slot_guard.c').read_text()
          assert 'op==2660' in (p/'main/native_slot_guard.c').read_text()
          print('JH2_221_PARTITIONS_RECOVERY_SECRETS_UNCHANGED')
          PY
          gcc -std=c11 -Wall -Wextra -Werror -O2 JasonHome2NanoC6_IDF/main/native_slot_guard.c JasonHome2NanoC6_IDF/tests/native_slot_guard_test.c -o /tmp/jh2-219-native-guard
          /tmp/jh2-219-native-guard
          gcc -std=c11 -Wall -Wextra -Werror -O2 JasonHome2NanoC6_IDF/main/native_slot_guard.c JasonHome2NanoC6_IDF/main/native_slot_upload.c JasonHome2NanoC6_IDF/tests/native_slot_upload_test.c -o /tmp/jh2-219-native-upload
          /tmp/jh2-219-native-upload
      - name: Verify Eufy encrypted E10 commands with non-secret synthetic session
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -DEUFY_E10_HOST_TEST \
            -I JasonHome2NanoC6_IDF/main \
            JasonHome2NanoC6_IDF/main/eufy_e10.c \
            JasonHome2NanoC6_IDF/tests/test_eufy_e10.c -lcrypto -o /tmp/jh2-eufy-e10
          /tmp/jh2-eufy-e10
      - name: Use exact production Oracle and BLE compile flags
        shell: bash
        run: |
          cat >> JasonHome2NanoC6_IDF/sdkconfig.defaults <<'EOF'
          CONFIG_JH2_NATIVE_ENABLE_ORACLE=y
          CONFIG_JH2_NATIVE_BROWSER_OTA_COMPAT=y
          CONFIG_JH2_NATIVE_READONLY_ACCEPTANCE=n
          EOF
      - name: Cross compile 2.0.21 runtime (not flashed)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32c6
          path: JasonHome2NanoC6_IDF
          command: idf.py build
      - name: Verify image, sign with existing project key, verify detached ECDSA
        shell: bash
        env:
          OTA_SIGNING_KEY_B64: ${{ secrets.ANDERSON_OTA_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          b=Path('JasonHome2NanoC6_IDF/build/jh2_native_ble_probe.bin').read_bytes()
          assert 0x100000 < len(b)<=0x160000 and b[0]==0xe9
          assert b'2.0.21' in b and b'JH2TEST' in b
          marker=b'JH2V200PRIVATEORACLETOKENREPLACEME'.ljust(64,b'_')
          assert b.count(marker)==1, 'Refuse source without one unpersonalized credential placeholder'
          root=Path('signed-package');root.mkdir(exist_ok=True)
          (root/'jh2-runtime-2.0.21.bin').write_bytes(b)
          sha=hashlib.sha256(b).hexdigest()
          (root/'release.json').write_text(json.dumps({'product':'jason-home-2-nanoc6','version':'2.0.21','commit':os.environ['GITHUB_SHA'],
           'files':{'jh2-runtime-2.0.21.bin':{'bytes':len(b),'sha256':sha}}},indent=2)+'\n')
          print('JH2_221_SHA_TEST_IMAGE',len(b),sha)
          PY
          test -n "$OTA_SIGNING_KEY_B64"
          key="$RUNNER_TEMP/jh2-sign-key.pem"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          printf '%s' "$OTA_SIGNING_KEY_B64" | base64 -d > "$key"
          chmod 600 "$key"
          python3 JasonHome2NanoC6/tools/sign_manifest.py --key "$key" --release signed-package/release.json --output signed-package/latest.json
          python3 - <<'PY'
          from pathlib import Path
          import json,base64,hashlib,subprocess,tempfile
          p=Path('signed-package');sig=json.loads((p/'latest.json').read_text())
          manifest=json.loads((p/'release.json').read_text())
          fields=dict(row.split('=',1) for row in sig['payload'].strip().splitlines())
          fw=(p/'jh2-runtime-2.0.21.bin').read_bytes()
          assert fields['version']=='2.0.21' and fields['product']=='jason-home-2-nanoc6'
          assert fields['sha256']==hashlib.sha256(fw).hexdigest() and int(fields['bytes'])==len(fw)
          assert fields['commit']==manifest['commit']
          with tempfile.TemporaryDirectory() as t:
           temp=Path(t);(temp/'payload').write_text(sig['payload'])
           (temp/'sig').write_bytes(base64.b64decode(sig['signature']))
           subprocess.run(['openssl','dgst','-sha256','-verify','remote-update/anderson_ota_signing_public.pem',
             '-signature',str(temp/'sig'),str(temp/'payload')],check=True)
          print('JH2_221_EXISTING_KEY_ECDSA_VERIFIED_NO_OTA')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-2.0.21-EUFY-BLE-SIGNED-NOT-PUBLISHED
          path: signed-package/
          if-no-files-found: error
          retention-days: 30
