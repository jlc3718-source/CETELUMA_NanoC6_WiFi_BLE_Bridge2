name: Stop Superseded JH2 Native ESP-IDF Builds
on:
  push:
    branches: [codex/jh2-native-espidf-c6-ble-inventory-20261017]
    paths: ['.github/workflows/jh2-cancel-old-idf-builds-once.yml']
permissions: {actions: write, contents: read}
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only obsolete build attempts; preserve latest 39081241379
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=jlc3718-source/CETELUMA_NanoC6_WiFi_BLE_Bridge2
          for id in 39081182092 39081196121 39081219499; do
            status="$(gh api "repos/$repo/actions/runs/$id" --jq .status)"
            if [ "$status" = "in_progress" ] || [ "$status" = "queued" ]; then
              gh run cancel "$id" --repo "$repo" || true
              echo "CANCELLED_SUPERSEDED_RUN $id"
            else
              echo "ALREADY_FINISHED $id $status"
            fi
          done
          echo "KEPT_LATEST_RUN 39081241379"
