name: Jason Home 2 1.1.46 Curtain Trace UI Production Deploy
on:
  push:
    branches: [codex/jh2-native-1-1-46-targeted-928-parity-20261018]
    paths:
      - '.github/workflows/jh2-146-oracle-curtain-parity-deploy-20261018.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jason-home-oracle-production
  cancel-in-progress: false

jobs:
  validate:
    name: Oracle, Nano trace UI, GIF Studio and relay tests (no device writes)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Check syntax, compressed GIF and storage lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/deploy-curtain-relay.py
          node --check JasonHome2Server/server.mjs
          node --check JasonHome2Server/curtain_bridge.mjs
          node --check JasonHome2Server/curtain_remote.js
          node --check JasonHome2Server/curtain.js
          test -s JasonHome2Server/nano_remote.html
          node --test \
            JasonHome2Server/tests/curtain-relay.mjs \
            JasonHome2Server/tests/curtain-quality.mjs \
            JasonHome2Server/tests/curtain-images.mjs \
            JasonHome2Server/tests/curtain-photo-import.mjs \
            JasonHome2Server/tests/curtain-offline.mjs \
            JasonHome2Server/tests/curtain-replace-play.mjs \
            JasonHome2Server/tests/curtain-test-override.mjs \
            JasonHome2Server/tests/nanoc6-sync.mjs
  deploy:
    name: Back up, stage, deploy and verify Oracle curtain (no host reboot, no BLE scan)
    needs: validate
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 20
    env:
      JH2_NONINVASIVE_DEPLOY: '1'
    steps:
      - name: Fix self-hosted checkout ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Encrypted backup, SQLite restore test, staged API test, live auth recovery and web-only deployment
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SHA,JH2_NONINVASIVE_DEPLOY \
            python3 .github/scripts/deploy-curtain-relay.py
          test -s deployment-verification.json
          sudo -n docker exec jason-home-2-web test -s /app/nano_remote.html
          python3 - <<'PY'
          import json,pathlib,os
          d=json.loads(pathlib.Path('deployment-verification.json').read_text())
          assert d['build']==os.environ['GITHUB_SHA']
          assert d['bridgeAuthRecovered'] is True
          assert d['eufyReady']==4 and d['events']==212
          assert d['snapshotRestoreVerified'] and d['schedulerReconciled']
          assert d['liveCommandAckVerified'] is False and d['physicalBridgeVerified'] is False
          print('Oracle hot-deploy verified; live SmartDawn BLE deliberately untouched.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Jason-Home-2-Oracle-Only-Verification
          path: deployment-verification.json
          retention-days: 7
          if-no-files-found: error
