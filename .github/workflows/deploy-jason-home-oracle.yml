name: Deploy Jason Home Oracle

on:
  push:
    branches:
      - jason-home-cloudflare-rebuild
    paths:
      - 'JasonHomeServer/**'
      - '.github/workflows/deploy-jason-home-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jason-home-oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64, jason-home-oracle]
    timeout-minutes: 25
    steps:
      - name: Sync stable Oracle working tree
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/ubuntu/repo
          test -d "$REPO/.git"
          git -C "$REPO" fetch origin jason-home-cloudflare-rebuild
          git -C "$REPO" checkout jason-home-cloudflare-rebuild
          git -C "$REPO" reset --hard origin/jason-home-cloudflare-rebuild

      - name: Verify persistent server configuration
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repo/JasonHomeServer
          test -s .env
          chmod 600 .env

      - name: Build and restart Jason Home
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repo/JasonHomeServer
          sudo docker compose up -d --build
          sudo docker compose ps

      - name: Verify local API
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/api/health >/tmp/jh-health.json; then
              cat /tmp/jh-health.json
              exit 0
            fi
            sleep 2
          done
          cd /home/ubuntu/repo/JasonHomeServer
          sudo docker compose logs --tail=150
          exit 1

      - name: Verify public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://150.136.245.51/api/health

      - name: Show recent server logs
        if: always()
        shell: bash
        run: |
          cd /home/ubuntu/repo/JasonHomeServer
          sudo docker compose logs --tail=80 || true
