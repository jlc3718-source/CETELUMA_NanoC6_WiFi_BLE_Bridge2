name: Deploy Jason Home to Oracle

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact tested commit SHA to deploy manually
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jason-home-oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'jlc3718-source/CETELUMA_NanoC6_WiFi_BLE_Bridge2'
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ inputs.sha }}
    steps:
      - name: Validate immutable deploy revision
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SHA"
          test "${#DEPLOY_SHA}" -ge 7
          echo "Deploying tested commit: $DEPLOY_SHA"

      - name: Update production checkout to exact tested commit
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repo
          git fetch origin "$DEPLOY_SHA"
          git reset --hard "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$DEPLOY_SHA^{commit}")"

      - name: Protect production secrets
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repo/JasonHomeServer
          test -s .env
          sed -i 's/^HOME_LAT=42\.0529$/HOME_LAT=42.1507/' .env
          sed -i 's/^HOME_LON=-79\.0576$/HOME_LON=-78.9452/' .env
          chmod 600 .env

      - name: Preserve rollback image
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repo/JasonHomeServer
          if sudo docker image inspect jasonhomeserver-jason-home:latest >/dev/null 2>&1; then
            sudo docker tag jasonhomeserver-jason-home:latest jasonhomeserver-jason-home:rollback || true
          fi

      - name: Build and restart Jason Home
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repo/JasonHomeServer
          sudo docker compose build
          sudo docker compose up -d --remove-orphans

      - name: Wait for health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health >/tmp/jason-home-health.json; then
              cat /tmp/jason-home-health.json
              exit 0
            fi
            sleep 2
          done
          sudo docker compose ps
          sudo docker compose logs --tail=150
          exit 1

      - name: Verify authenticated Oracle status
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repo/JasonHomeServer
          TOKEN="$(sed -n 's/^JASON_HOME_API_TOKEN=//p' .env)"
          test -n "$TOKEN"
          STATUS="$(curl -fsS -H "Authorization: Bearer $TOKEN" 'http://127.0.0.1:8080/api/status?refresh=1')"
          python3 - "$STATUS" "$DEPLOY_SHA" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          deploy_sha=sys.argv[2]
          e=d.get("eufy",{})
          names=set(e.get("readyNames",[]))
          expected={"Pool","House","Garage","Shed"}
          if not e.get("ready") or names != expected:
              raise SystemExit("Eufy validation failed: "+json.dumps(e))
          print("Oracle deploy validation: PASS — Eufy Ready 4/4")
          loc=d.get("location",{})
          if loc.get("zip")!="14772" or abs(float(loc.get("lat",0))-42.1507)>0.001 or abs(float(loc.get("lon",0))+78.9452)>0.001:
              raise SystemExit("Scheduler location validation failed: "+json.dumps(loc))
          print("Scheduler location: PASS — ZIP 14772", json.dumps(loc))
          cal=d.get("calendar",{})
          if not cal.get("synced") or not cal.get("enabled") or int(cal.get("eventCount") or 0)<1:
              raise SystemExit("Holiday calendar validation failed: "+json.dumps(cal))
          print("Holiday calendar:", json.dumps({
              "synced": cal.get("synced"),
              "enabled": cal.get("enabled"),
              "eventCount": cal.get("eventCount"),
              "customCount": cal.get("customCount")
          }))
          print("Deployed commit:", deploy_sha)
          PY

      - name: Container status
        if: always()
        shell: bash
        run: |
          cd /home/ubuntu/repo/JasonHomeServer
          sudo docker compose ps
