name: JH2 1.1.57 Stage Verified Nano Now Playing OTA
on:
  push:
    branches: [codex/jh2-slot-inventory-fix-20261018]
    paths: ['.github/workflows/jh2-157-stage-signed-oracle.yml']
permissions: {contents: read, actions: read}
concurrency: {group: jh2-production-signed-ota-singleton, cancel-in-progress: false}
jobs:
  stage:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 25
    steps:
      - name: Repair checkout owner
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Verify independently completed v1.1.57 signing
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/39362573180'
          headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN']}
          for attempt in range(120):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as response:run=json.load(response)
              if run['status']=='completed':
                  assert run['conclusion']=='success','Firmware signing failed: '+str(run['conclusion'])
                  print('PINNED_SIGNED_157_VALIDATED',flush=True)
                  break
              time.sleep(6)
          else:raise SystemExit('SIGNING_TIMEOUT')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: JH2-1.1.57-SIGNED-NANO-LOCAL-CACHE-OTA
          run-id: 39362573180
          github-token: '${{ github.token }}'
          path: signed-package
      - name: Verify ECDSA and atomically stage v1.1.57 for Nano only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/jh2-stage-signed-157-on-oracle.py
          sudo -n --preserve-env=GITHUB_WORKSPACE python3 .github/scripts/jh2-stage-signed-157-on-oracle.py
