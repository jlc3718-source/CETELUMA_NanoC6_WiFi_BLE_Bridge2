name: Stage v3.0.21 Locked Master Favorites
on:
  push:
    branches:
      - staging/v3.0.21-locked-favorites
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/v3.0.21-locked-favorites
      - name: Apply focused firmware changes
        run: python .github/scripts/stage_v3021_locked_favorites.py
      - name: Commit staged source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FIRMWARE_VERSION.txt README.md AGENTS.md firmware/src/main.cpp firmware/web/index.html
          git commit -m "Lock master Favorite Colors and label tiles for v3.0.21"
          git push origin HEAD:staging/v3.0.21-locked-favorites
