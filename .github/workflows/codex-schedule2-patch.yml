name: Apply Schedule 2 Controls Patch

on:
  push:
    branches: ['codex/release-current']
    paths: ['.github/workflows/codex-schedule2-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-current
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply schedule controls
        run: python tools/apply_schedule_controls_3142.py
      - name: Run focused regression checks
        run: |
          python tools/test_regressions.py
          python tools/test_maintenance.py
      - name: Commit patch and trigger production build
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/codex-schedule2-patch.yml tools/apply_schedule_controls_3142.py
          printf 'schedule-controls-3.1.42\n' > .github/trigger-build.txt
          git config user.name "Anderson Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add configurable Schedule 2 brightness/end and dusk/dawn scheduling"
          git push origin HEAD:codex/release-current
