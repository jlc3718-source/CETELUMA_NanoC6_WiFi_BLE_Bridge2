name: JH2 1.1.56 Stage Verified Nano Now Playing OTA
on:
  push:
    branches: [codex/jh2-slot-inventory-fix-20261018]
    paths: ['.github/workflows/jh2-156-stage-signed-oracle.yml']
permissions: {contents: read, actions: read}
concurrency: {group: jh2-production-signed-ota-singleton, cancel-in-progress: false}
jobs:
  stage:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 25
    steps:
      - name: Repair checkout owner
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Wait for independent v1.1.56 build and signature verification
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          for i in {1..150}; do
            state="$(gh run view 39360942964 --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status + " " + (.conclusion // "")')"
            if [[ "$state" == "completed success" ]]; then echo "PINNED_SIGNED_156_VALIDATED";exit 0;fi
            if [[ "$state" == "completed "* ]]; then echo "SIGNING_FAILED $state";exit 1;fi
            sleep 7
          done
          echo SIGNING_WAIT_TIMEOUT;exit 1
      - uses: actions/download-artifact@v4
        with:
          name: JH2-1.1.56-SIGNED-NANO-LOCAL-CACHE-OTA
          run-id: 39360942964
          github-token: '${{ github.token }}'
          path: signed-package
      - name: Verify ECDSA and atomically stage v1.1.56 for Nano only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/jh2-stage-signed-156-on-oracle.py
          sudo -n --preserve-env=GITHUB_WORKSPACE python3 .github/scripts/jh2-stage-signed-156-on-oracle.py
