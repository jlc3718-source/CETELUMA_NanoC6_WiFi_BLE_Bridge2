name: Jason Home 2 isolated image runtime compatibility rebuild
on:
  push:
    branches: [codex/jh2-image-model-benchmark-20261019]
    paths: ['.github/workflows/jh2-image-model-rebuild-20261019.yml']
permissions: {contents: read}
concurrency: {group: jason-home-oracle-production, cancel-in-progress: false}
jobs:
  rebuild:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 20
    steps:
      - name: Fix optional attention build setting within isolated runtime only
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,subprocess,time
          ROOT=pathlib.Path('/opt/jh2-image-benchmark-20261019')
          def docker(*args):return subprocess.run(['sudo','-n','docker',*args],capture_output=True,text=True,timeout=300 if args[0]=='commit' else 30)
          original='jh2-image-benchmark-build-20261019'
          toolchain='jh2-image-benchmark-toolchain:20261019'
          old=docker('inspect',original)
          if old.returncode==0:
              info=json.loads(old.stdout)[0]
              assert info['State']['Running'] is False and info['Config']['Image']=='ubuntu:24.04'
              assert info['HostConfig']['Memory']==1610612736
              if docker('image','inspect',toolchain).returncode!=0:
                  assert docker('commit',original,toolchain).returncode==0
              assert docker('rm',original).returncode==0
          else:assert docker('image','inspect',toolchain).returncode==0
          name='jh2-image-benchmark-rebuild-20261019'
          assert docker('inspect',name).returncode!=0
          code='''set -eu
          cmake -S /work/source -B /work/source/build -DCMAKE_BUILD_TYPE=Release -DSD_FLASH_ATTN=OFF -DSD_BUILD_SHARED_LIBS=OFF
          cmake --build /work/source/build --target sd -j1
          cp /work/source/build/bin/sd /work/bin/sd
          /work/bin/sd --help
          '''
          args=['sudo','-n','docker','run','--name',name,'--label','org.jasonhome2.benchmark=true','--cpus=0.55','--cpu-shares=128','--memory=1536m','--memory-swap=1536m','--pids-limit=256','--security-opt','no-new-privileges','--mount','type=bind,source='+str(ROOT)+',target=/work',toolchain,'bash','-lc',code]
          start=time.monotonic();peak=0;guard=False
          with (ROOT/'runtime_rebuild.log').open('w') as log:
              proc=subprocess.Popen(args,stdout=log,stderr=subprocess.STDOUT)
              while proc.poll() is None:
                  available=int(next(l.split()[1] for l in pathlib.Path('/proc/meminfo').read_text().splitlines() if l.startswith('MemAvailable:')))*1024
                  if available<700*1024**2 or time.monotonic()-start>900:
                      guard=True;docker('stop','--time','5',name);proc.wait(timeout=30);break
                  time.sleep(.5)
              rc=proc.wait()
          state=json.loads(docker('inspect',name,'--format','{{json .State}}').stdout)
          result={'returnCode':rc,'wallSeconds':round(time.monotonic()-start,3),'oomKilled':state['OOMKilled'],
                  'runtimeRevision':'ac54e0076052a196b7df961eb1f792c9ff4d7f22','flashAttention':False,'headroomGuardStopped':guard,
                  'buildLimits':{'cpu':.55,'memoryBytes':1610612736,'swapBytes':0}}
          if rc==0:
              image='jh2-image-benchmark-runtime:20261019'
              assert docker('commit',name,image).returncode==0
              assert docker('rm',name).returncode==0
              result['image']=image;result['binarySha256']=hashlib.file_digest((ROOT/'bin/sd').open('rb'),'sha256').hexdigest()
          else:print('\n'.join((ROOT/'runtime_rebuild.log').read_text(errors='replace').splitlines()[-40:]))
          (ROOT/'runtime_setup_result.json').write_text(json.dumps(result,indent=2))
          print('RUNTIME_SETUP '+json.dumps(result),flush=True)
          assert rc==0
          PYTHON
