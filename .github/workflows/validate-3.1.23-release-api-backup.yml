name: Validate Anderson Home 3.1.23 Release API Backup

on:
  push:
    branches: ['codex/3.1.23-release-api-ota']
  workflow_dispatch:

permissions:
  contents: write

env:
  PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/3.1.23-release-api-ota
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize clean v3.1.23 source
        run: |
          python tools/apply_3_1_23_release_api_backup_fix.py
          rm -f tools/apply_3_1_23_release_api_backup_fix.py .github/workflows/validate-3.1.23-release-api-backup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Anderson Home v3.1.23 permanent fast OTA and backup restore repair'
          git push origin HEAD:codex/3.1.23-release-api-ota
      - name: Install canonical dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Verify release API and backup UI invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          remote=Path('firmware/src/RemoteUpdate.cpp').read_text()
          web=Path('firmware/web/index.html').read_text()
          mock=Path('firmware/web/v3_mockup.js').read_text()
          main=Path('firmware/src/main.cpp').read_text()
          pub=Path('.github/workflows/publish-anderson-home.yml').read_text()
          assert 'OTA_RELEASE_API_URL="https://api.github.com/repos/jlc3718-source/CETELUMA_NanoC6_WiFi_BLE_Bridge2/releases/latest"' in remote
          assert 'OTA_RELEASE_MANIFEST_ASSET="ota-manifest.json"' in remote
          assert 'discoverLatestReleaseManifest' in remote and 'OTA_MANIFEST_FALLBACK_URL=' in remote
          assert 'id="settingsSubnav"' not in web and 'id="backupSettingsPanel"' not in web
          assert 'ANDERSON_BACKUP_RESTORE_UI_V3_1_13' in mock and "['backup','Backup & Restore']" in mock
          assert "post('/api/backup/settings',{mask:backupMaskFromUi()})" in mock
          assert "post('/api/backup/manual',{mask:backupMaskFromUi()})" in mock
          assert "post('/api/backup/restore',{})" in mock
          assert 'maybeWeeklySettingsBackup();' in main
          assert 'SETTINGS_BACKUP_WEEK_SECONDS=7UL*24UL*60UL*60UL' in main
          assert 'publish-input/ota-manifest.json' in pub and '--pattern ota-manifest.json' in pub
          assert '<strong>v3.1.23</strong>' in web
          print('v3.1.23 fast OTA and backup invariants passed')
          PY
      - name: Check maintenance and recovery
        run: python tools/test_maintenance.py
      - name: Check source regressions
        run: python tools/test_regressions.py
      - name: Check audited delivery invariants
        run: python tools/test_audit_fixes.py
      - name: Check all 210 events for lockout and yearly coverage
        run: python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full
      - name: Verify no partition or Android changes
        run: test -z "$(git diff --name-only f20ce917d30173847d56ac80fd44259ca85547e4 -- firmware/platformio.ini android/)"
      - name: Prepare release
        run: python tools/release.py prepare
      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package firmware
        run: python tools/release.py package
      - name: Verify packaged v3.1.23 firmware
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          v=Path('FIRMWARE_VERSION.txt').read_text().strip(); assert v=='3.1.23'
          p=Path('release')/f'and_{v}.bin'; assert p.exists() and p.stat().st_size>1000000 and p.stat().st_size<0x1E0000
          d=hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.loads((Path('release')/'release.json').read_text())
          assert m['version']==v and m['files'][p.name]['bytes']==p.stat().st_size and m['files'][p.name]['sha256']==d
          print(p.name,p.stat().st_size,d)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.23-Validated
          path: release/*
          if-no-files-found: error
