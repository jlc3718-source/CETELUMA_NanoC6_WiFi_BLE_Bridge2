name: Diagnose E22 Eufy State

on:
  push:
    branches: [jason-home-cloudflare-rebuild]
    paths:
      - '.github/workflows/diagnose-e22-state.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - name: Inspect sanitized Eufy device records
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repo/JasonHomeServer
          set -a
          . ./.env
          set +a
          node --input-type=module <<'NODE'
          import { DatabaseSync } from 'node:sqlite';
          import { EufyClient } from './dist/eufy/client.js';
          const db=new DatabaseSync(process.env.JASON_HOME_DB||'data/jason-home.sqlite');
          const get=(k)=>db.prepare('SELECT value FROM meta WHERE key=?').get(k)?.value||'';
          const sessionRaw=get('eufy_session');
          const installId=(get('install_id')||process.env.EUFY_INSTALL_ID||'').trim().toLowerCase();
          if(!sessionRaw||!installId) throw new Error('Missing persisted Eufy session/install id');
          const c=new EufyClient(installId,JSON.parse(sessionRaw));
          await c.findLights();
          const lights=c.lights;
          const safeKey=(k)=>/status|online|connect|wifi|signal|model|category|name|firmware|version|type|station|battery|update|serial|device_sn/i.test(k)
            && !/token|key|secret|member|admin|account|user/i.test(k);
          for(const name of ['Garage','Shed']){
            const d=lights.get(name)||{};
            const safe={};
            for(const [k,v] of Object.entries(d)){
              if(!safeKey(k)) continue;
              if(v==null||['string','number','boolean'].includes(typeof v)) safe[k]=v;
            }
            console.log(JSON.stringify({name,safe,keys:Object.keys(d).sort()}));
          }
          NODE
