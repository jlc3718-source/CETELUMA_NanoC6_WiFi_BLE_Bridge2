name: JH2 Curtain Oracle/APK Parity Source Validation
on:
  push:
    branches: [codex/jh2-native-1-1-46-targeted-928-parity-20261018]
    paths: ['.github/workflows/jh2-146-curtain-oracle-ui-validation-20261018.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate Oracle route, Javascript, original curtain studio and relay tests without deploying
        shell: bash
        run: |
          set -euo pipefail
          node --check JasonHome2Server/server.mjs
          node --check JasonHome2Server/curtain_bridge.mjs
          node --check JasonHome2Server/curtain_remote.js
          node --check JasonHome2Server/curtain.js
          python3 -m py_compile .github/scripts/deploy-curtain-relay.py
          node --test \
            JasonHome2Server/tests/curtain-relay.mjs \
            JasonHome2Server/tests/curtain-quality.mjs \
            JasonHome2Server/tests/curtain-images.mjs \
            JasonHome2Server/tests/curtain-photo-import.mjs \
            JasonHome2Server/tests/curtain-offline.mjs \
            JasonHome2Server/tests/curtain-replace-play.mjs \
            JasonHome2Server/tests/curtain-test-override.mjs \
            JasonHome2Server/tests/nanoc6-sync.mjs
          python3 - <<'PY'
          from pathlib import Path
          server=Path('JasonHome2Server/server.mjs').read_text()
          remote=Path('JasonHome2Server/nano_remote.html').read_text()
          studio=Path('JasonHome2Server/curtain_converter.html').read_text()
          assert 'nano_remote.html' in server and '/nano/' in server
          assert 'nativeTarget83928' in remote and 'traceId' in remote
          assert 'curtain_converter.html' in remote and 'JH2_ORACLE_CURTAIN' in studio
          print('NANO_ORACLE_APK_TRACE_UI_STATIC_INTEGRATION_PASSED')
          PY
