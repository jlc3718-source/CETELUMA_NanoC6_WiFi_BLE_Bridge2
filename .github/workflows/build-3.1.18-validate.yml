name: Validate Anderson Home 3.1.18

on:
  push:
    branches: ['codex/3.1.18-breath-slow-events']

permissions:
  contents: write
  actions: write

concurrency:
  group: anderson-3-1-18-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/3.1.18-breath-slow-events
          fetch-depth: 0
      - name: Remove temporary validator from candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/build-3.1.18-validate.yml
          git commit -m "Remove temporary v3.1.18 validator"
          git push origin HEAD:refs/heads/codex/3.1.18-breath-slow-events
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - name: Install build dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Run maintenance and recovery checks
        run: python tools/test_maintenance.py
      - name: Run regression checks
        run: python tools/test_regressions.py
      - name: Run audit checks
        run: python tools/test_audit_fixes.py
      - name: Check scheduled event coverage
        run: python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full
      - name: Prepare release
        run: python tools/release.py prepare
      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package verified firmware
        run: python tools/release.py package
      - name: Verify v3.1.18 packaged identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          r=json.loads(Path('release/release.json').read_text())
          f=Path('release/and_3.1.18.bin')
          data=f.read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          assert r['version']=='3.1.18' and r['commit']==sha
          assert data and data[0]==0xE9 and len(data)<0x1E0000
          assert r['files'][f.name]['bytes']==len(data) and r['files'][f.name]['sha256']==digest
          print('bytes',len(data),'sha256',digest,'commit',sha)
          PY
      - name: Upload verified v3.1.18
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.18-Breath-Slow-Validated
          path: release/*
          if-no-files-found: error
