name: Audit segmented Jason Home events

on:
  push:
    branches: [jason-home-2-web]
    paths:
      - '.github/workflows/read-current-jason-lights.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - name: Read-only audit of palettes, layers, effects and segment maps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,ssl,socket,urllib.request
          from pathlib import Path

          token=next(line.split('=',1)[1] for line in Path('/home/ubuntu/repo/JasonHomeServer/.env').read_text().splitlines() if line.startswith('JASON_HOME_API_TOKEN='))

          def oracle(path):
              req=urllib.request.Request('http://127.0.0.1:8080'+path,headers={'Authorization':'Bearer '+token})
              return json.load(urllib.request.urlopen(req,timeout=60))

          calendar=oracle('/api/calendar')['calendar']
          originals={e['id']:e for e in calendar.get('events',[]) if not str(e.get('id','')).startswith('ai-once-')}

          resolve=socket.getaddrinfo
          socket.getaddrinfo=lambda host,port,*a,**kw: resolve('127.0.0.1' if host=='150.136.245.51' else host,port,*a,**kw)
          base='https://150.136.245.51/jason-home-2'
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),urllib.request.HTTPSHandler(context=ssl.create_default_context()))
          login=opener.open(urllib.request.Request(base+'/api/session',json.dumps({'token':token}).encode(),{'Content-Type':'application/json'}),timeout=60)
          cookie=login.headers['Set-Cookie'].split(';',1)[0]
          def jh2(path):
              req=urllib.request.Request(base+path,headers={'Cookie':cookie})
              return json.load(opener.open(req,timeout=60))

          displayed={}
          for month in range(1,13):
              for e in jh2(f'/api/events?year=2026&month={month}').get('events',[]):
                  displayed[e['id']]=e

          missing=[]
          palette_errors=[]
          layer_errors=[]
          effect_errors=[]
          audited=0
          segmented=0
          for eid,src in originals.items():
              e=displayed.get(eid)
              if not e:
                  missing.append(eid)
                  continue
              audited+=1
              expected=['#'+format(int(c)&0xffffff,'06X') for c in src.get('colors',[])]
              if e.get('colors')!=expected:
                  palette_errors.append({'id':eid,'name':e.get('name'),'expected':expected,'actual':e.get('colors')})
              layers=e.get('layers') or []
              if len(layers)<2:
                  layer_errors.append({'id':eid,'name':e.get('name'),'reason':'fewer than two layers','layers':layers})
                  continue
              effects={str(x.get('effect')) for x in layers}
              if len(effects)<2:
                  effect_errors.append({'id':eid,'name':e.get('name'),'effects':sorted(effects)})
              if len(expected)>=2:
                  segmented+=1
                  for n,x in enumerate(layers,1):
                      p=x.get('pattern') or {}
                      blocks=p.get('blocks') or []
                      if len(blocks)!=len(expected) or any((not isinstance(v,int)) or v<1 or v>12 for v in blocks):
                          layer_errors.append({'id':eid,'name':e.get('name'),'layer':n,'colors':len(expected),'pattern':p})
                          break

          print(json.dumps({
              'oracleEvents':len(originals),
              'displayedEvents':len(displayed),
              'audited':audited,
              'multiColorSegmented':segmented,
              'missing':missing,
              'paletteErrors':palette_errors,
              'layerErrors':layer_errors,
              'effectErrors':effect_errors
          },indent=2))
          if missing: raise SystemExit('Some Oracle events were not exposed by the 2026 event views')
          if palette_errors: raise SystemExit('At least one event palette changed')
          if layer_errors: raise SystemExit('At least one event failed multi-layer/segmented validation')
          if effect_errors: raise SystemExit('At least one event failed multi-effect validation')
          print('PASS: every event preserved its Oracle palette; every event is multi-layer/multi-effect; every multi-color layer has valid addressable blocks')
          PY
