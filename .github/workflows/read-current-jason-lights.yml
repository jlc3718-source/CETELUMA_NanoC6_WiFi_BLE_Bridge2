name: Read current Jason Home light scenes

on:
  push:
    branches: [jason-home-2-web]
    paths:
      - '.github/workflows/read-current-jason-lights.yml'

permissions:
  contents: read

jobs:
  read-scenes:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - name: Read live scenes without changing lights
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(sed -n 's/^JASON_HOME_API_TOKEN=//p' /home/ubuntu/repo/JasonHomeServer/.env)"
          test -n "$TOKEN"
          STATUS="$(curl -fsS -H "Authorization: Bearer $TOKEN" 'http://127.0.0.1:8080/api/status?refresh=1')"
          python3 - "$STATUS" <<'PY'
          import json,sys
          s=json.loads(sys.argv[1])
          print("AUTOMATION_OWNER",s.get("automationOwner"))
          print("OVERRIDE",json.dumps(s.get("override"),sort_keys=True))
          print("CALENDAR_CURRENT",json.dumps((s.get("calendar") or {}).get("current"),sort_keys=True))
          print("LAST_COMMAND",json.dumps(s.get("lastCommand"),sort_keys=True))
          for row in s.get("desired",[]):
              try: scene=json.loads(row.get("scene") or "{}")
              except Exception: scene={"raw":row.get("scene")}
              print("DESIRED",row.get("name"),json.dumps(scene,sort_keys=True),row.get("updated_at"))
          PY
          for NAME in Pool House Garage Shed; do
            PROBE="$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'               --data "{"target":"$NAME"}" 'http://127.0.0.1:8080/api/mqtt-probe')"
            python3 - "$NAME" "$PROBE" <<'PY'
          import json,sys
          name=sys.argv[1]; p=json.loads(sys.argv[2])
          print("PROBE",name,json.dumps({
            "brokerAccepted":p.get("brokerAccepted"),
            "deviceReported":p.get("deviceReported"),
            "report":p.get("report")
          },sort_keys=True))
          PY
          done
