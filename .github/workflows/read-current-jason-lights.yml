name: Read current Jason Home light scenes

on:
  push:
    branches: [jason-home-2-web]
    paths:
      - '.github/workflows/read-current-jason-lights.yml'

permissions:
  contents: read

jobs:
  read-scenes:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - name: Resolve current native Eufy effect IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3,json
          db=sqlite3.connect('/home/ubuntu/repo/JasonHomeServer/data/jason-home.sqlite')
          row=db.execute("select value from meta where key='factory_catalog'").fetchone()
          if not row:
              raise SystemExit('factory_catalog missing')
          catalog=json.loads(row[0])
          wanted={10057,10700}
          hits=[p for p in catalog.get('presets',[]) if int(p.get('lightId') or 0) in wanted]
          print('FACTORY_MATCHES',json.dumps(hits,sort_keys=True))
          current=db.execute("select value from meta where key='calendar_config'").fetchone()
          cfg=json.loads(current[0]) if current else {}
          evt=next((e for e in cfg.get('events',[]) if e.get('id')=='evt134'),None)
          print('CURRENT_EVT134',json.dumps(evt,sort_keys=True))
          PY
