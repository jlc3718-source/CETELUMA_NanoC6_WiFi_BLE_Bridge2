name: Agnes remote runner audit (no changes)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agnes-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect Agnes runner structure without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,os,subprocess,hashlib,time
          from pathlib import Path
          for p in (Path('/home/ubuntu/agnes-sd300/run.py'),Path('/opt/agnes-remote/poller.py')):
            print('FILE',str(p),'exists',p.exists(),'owner',p.stat().st_uid if p.exists() else None)
            if not p.exists():continue
            s=p.read_text(); t=ast.parse(s)
            print('LENGTH',len(s),'SHA',hashlib.sha256(s.encode()).hexdigest()[:18])
            for n in t.body:
              if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)):
                print('FUNCTION',n.name,'args',[a.arg for a in n.args.args],'line',n.lineno)
              elif isinstance(n,ast.Assign):
                targets=[x.id for x in n.targets if isinstance(x,ast.Name)]
                if targets:
                  name=targets[0]
                  if name not in ('key','KEY','token','TOKEN','headers','HEADERS','api_key','API_KEY'):
                    shape=type(n.value).__name__
                    print('TOP_ASSIGN',name,shape,'line',n.lineno,'keys', [k.value if isinstance(k,ast.Constant) and isinstance(k.value,str) else '?' for k in n.value.keys] if isinstance(n.value,ast.Dict) else '','items',len(n.value.elts) if isinstance(n.value,(ast.List,ast.Tuple)) else '')
            for n in ast.walk(t):
              if isinstance(n,ast.Call):
                fn=n.func
                f=(getattr(fn.value,'id','')+'.'+fn.attr) if isinstance(fn,ast.Attribute) else (fn.id if isinstance(fn,ast.Name) else '')
                if f in ('requests.post','requests.get','urllib.request.urlopen','urlopen','json.dumps','json.loads'):
                  print('CALL',f,'line',n.lineno,'kwargs',[a.arg for a in n.keywords])
              if isinstance(n,ast.Dict):
                keys=[k.value for k in n.keys if isinstance(k,ast.Constant) and isinstance(k.value,str)]
                if any(x in ('prompt','model','image_url','first_frame','image','url','duration','aspect_ratio','input','scene') for x in keys):
                  print('DICT_KEYS',n.lineno,keys)
              if isinstance(n,ast.Constant) and isinstance(n.value,str) and len(n.value)>100:
                if any(x in n.value.lower() for x in ('boot dryer','sd300','electrician','night mode','muddy')):
                  print('PROMPT_TEXT',n.lineno,repr(n.value[:850]))
          print('SUDO_NONINTERACTIVE',subprocess.run(['sudo','-n','true'],capture_output=True).returncode)
          for svc in ('agnes-sd300','agnes-remote','agnes-publish'):
            r=subprocess.run(['systemctl','is-active',svc],capture_output=True,text=True)
            print('SERVICE',svc,r.stdout.strip())
          print('=== SANITIZED_RUNNER_SOURCE ===')
          import re
          source=Path('/home/ubuntu/agnes-sd300/run.py')
          if source.exists():
            for i,line in enumerate(source.read_text().splitlines(),1):
              if re.search(r'(?i)(key|secret|token|password|authorization|bearer|credential)',line):
                print('RUNNER_LINE',i,'[SENSITIVE LINE OMITTED]')
              else:
                print('RUNNER_LINE',i,line[:350])
          print('=== END_SANITIZED_SOURCE ===')
          print('=== SHOPIFY_IMAGE_PROBE ===')
          import urllib.request,json
          try:
            u='https://airthereal.com/products/sd300-shoe-dryer.js'
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as resp:
              d=json.loads(resp.read())
            im=d.get('images') or []
            print('PRODUCT',str(d.get('title',''))[:100],'IMAGES',len(im),'FIRST_URL',str(im[0])[:350] if im else '')
          except Exception as e:print('PRODUCT_REFERENCE_UNAVAILABLE',type(e).__name__,str(e)[:120])
          print('=== END_SHOPIFY_IMAGE_PROBE ===')
          print('=== MANAGED_RUNNER_DIAGNOSTICS ===')
          import datetime
          for p in (Path('/home/ubuntu/agnes-sd300/run.py'),Path('/home/ubuntu/agnes-sd300/scene-manifest.json'),Path('/home/ubuntu/agnes-sd300/state.json')):
            print('RUNTIME_FILE',p.name,'mtime',datetime.datetime.fromtimestamp(p.stat().st_mtime,datetime.timezone.utc).isoformat() if p.exists() else 'missing')
          for cmd in (['systemctl','is-active','agnes-sd300.service'],['systemctl','show','agnes-sd300.service','--property=ExecMainStatus,ExecMainPID,NRestarts,SubState'],['journalctl','-u','agnes-sd300.service','-n','35','--no-pager','-o','cat']):
            out=subprocess.run(cmd,capture_output=True,text=True,timeout=10)
            txt=(out.stdout or '')+' '+(out.stderr or '')
            txt=re.sub(r'(?i)(bearer\s+)[a-z0-9._-]+',r'\1[REDACTED]',txt)
            print('DIAG',cmd[0],cmd[1:3],txt[-2200:])
          state_path=Path('/home/ubuntu/agnes-sd300/state.json')
          if state_path.exists():
            states=json.loads(state_path.read_text())
            rl=states.get('_rate_limit',{})
            print('RATE_LIMIT_MODE',str(rl.get('source','none')),'SECONDS',rl.get('delay_seconds'),'RETRY_UNIX',round(rl.get('until',0)),'LEFT',max(0,round(rl.get('until',0)-time.time())))
            for name,info in sorted(states.items()):
              if not isinstance(info,dict):continue
              print('SCENE_RESULT',name,'status='+str(info.get('status')),'http='+str(info.get('http')),'id_set='+str(bool(info.get('id'))),'error='+str(info.get('error',''))[:130])
          print('=== END_MANAGED_DIAGNOSTICS ===')
          print('AGNES_AUDIT_DONE')
          PY
