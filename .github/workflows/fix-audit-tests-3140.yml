name: Fix Anderson 3.1.40 Regression Tests

on:
  push:
    branches: ['audit/3.1.40-final-try']
    paths: ['.github/trigger-fix-tests-3140.txt']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/3.1.40-final-try
          fetch-depth: 0
      - name: Migrate regression assertions to consolidated v3 effect owner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/test_regressions.py'); s=p.read_text()
          old='''assert '<option value="Breath">Breath</option>' in web and ("['Jump','Breath','Strobe','Solid']" in web or '["Jump","Breath","Strobe","Solid"]' in web)\nassert 'const EFFECT_BUTTON_VALUES=[' in web and ("'Jump','Breath','Strobe','Solid'" in web or '["Jump","Breath","Strobe","Solid"]' in web)\nassert 'effectButtonGroup' in web and 'enhanceEffectSelect' in web and 'effectSelectHidden' in web\n'''
          new='''assert '<option value="Breath">Breath</option>' in web\nassert ('const e=["Jump","Breath","Strobe","Solid"]' in mock or "const e=['Jump','Breath','Strobe','Solid']" in mock)\nassert 'v3EffectPicker' in mock and 'v3EffectButton' in mock and 'v3EffectNative' in mock\nassert 'EFFECT_BUTTON_VALUES' not in web and 'enhanceEffectSelect' not in web and 'enhanceEffectButtons' not in web\n'''
          if s.count(old)!=1: raise SystemExit('effect assertion block mismatch')
          s=s.replace(old,new,1)
          old="assert re.search(r'\\._syncEffectButtons=sync', web) and re.search(r'setAttribute\\([\"\\']aria-pressed[\"\\']', web)"
          new="assert re.search(r'\\._syncEffectButtons=\\(\\)=>sync\\(', mock) and re.search(r'setAttribute\\([\"\\']aria-pressed[\"\\']', mock)"
          if s.count(old)!=1: raise SystemExit('sync assertion mismatch')
          s=s.replace(old,new,1)
          old="assert '.anderson-no-plain-effect-buttons' in web and 'enhanceEffectButtons' in web"
          new="assert '.anderson-no-plain-effect-buttons' not in web and 'enhanceEffectButtons' not in web"
          if s.count(old)!=1: raise SystemExit('legacy enhancer assertion mismatch')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python tools/test_regressions.py
          printf '%s\n' '3.1.40 audit optimization bundle run 2' > .github/trigger-build.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/test_regressions.py .github/trigger-build.txt
          git diff --cached --check
          git commit -m 'Update regression guards for consolidated effect UI'
          git push origin HEAD:audit/3.1.40-final-try
