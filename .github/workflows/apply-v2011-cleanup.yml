name: Apply Anderson v2.0.11 cleanup
on:
  push:
    branches: ['codex/anderson-code-cleanup-v2-0-11']
    paths: ['.github/workflows/apply-v2011-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/anderson-code-cleanup-v2-0-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - name: Apply behavior-neutral cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, before, after):
              p=Path(path); s=p.read_text(); n=s.count(before)
              if n != 1: raise SystemExit(f'{path}: expected exactly one match, found {n}: {before[:80]!r}')
              p.write_text(s.replace(before,after))

          p=Path('firmware/web/index.html'); s=p.read_text()
          replacements=[
            ('--bg:#0b0e13;',''),
            ('--warn:#ffb020',''),
            ('body{margin:0;background:linear-gradient(180deg,#090c11,#111722);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}',
             'body{margin:0;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}'),
            ('body{background:linear-gradient(155deg,#062b16 0%,#0b6b2e 48%,#03190c 100%)!important;background-attachment:fixed!important;}\n\n',''),
            ('Save All Three PINs &amp; Enable','Save Both PINs &amp; Enable'),
            ('All three PINs must be different.','Both PINs must be different.'),
            ("let currentRole='none',currentUser='';","let currentRole='none';"),
            ("currentRole=event.detail?.role||'none';currentUser=event.detail?.name||'';","currentRole=event.detail?.role||'none';"),
            ("window.addEventListener('anderson-profile-cleared',()=>{currentRole='none';currentUser=''});","window.addEventListener('anderson-profile-cleared',()=>{currentRole='none'});"),
            ('Disable all three profile PINs?','Disable both profile PINs?'),
            ('All three saved PINs can be replaced','Both saved PINs can be replaced'),
          ]
          for before,after in replacements:
              n=s.count(before)
              if n != 1: raise SystemExit(f'index.html: expected one match, found {n}: {before[:80]!r}')
              s=s.replace(before,after)
          recovery_css=(r'\.recoveryPanel\{[^}]*\}\.recoveryPanel h2\{[^}]*\}\.recoveryPanel progress\{[^}]*\}'
                        r'\.recoveryLink\{[^}]*\}\.recoveryNote\{[^}]*\}\.profileLockedMessage\{[^}]*\}')
          s,n=re.subn(recovery_css,'',s,count=1)
          if n != 1: raise SystemExit('index.html: recovery-only CSS block was not found exactly once')
          p.write_text(s)

          replace_once('firmware/include/Types.h','#include <vector>\n','')
          replace_once('firmware/src/EventCatalog.cpp','#include <math.h>\n','')
          replace_once('firmware/src/BleController.cpp','#include <math.h>\n','#include <algorithm>\n#include <math.h>\n')
          replace_once('firmware/src/BleController.cpp',
              'slots[0].name="ELK-BLEDDM AB";slots[0].address="MOCK-A";slots[0].protocol=4;\n  slots[1].name="ELK-BLEDDM 06";slots[1].address="MOCK-B";slots[1].protocol=4;',
              'slots[0].name="ELK-BLEDDM AB";slots[0].address="MOCK-A";\n  slots[1].name="ELK-BLEDDM 06";slots[1].address="MOCK-B";')
          replace_once('firmware/include/ColorCorrection.h','  const char* name;\n','')
          p=Path('firmware/src/ColorCorrection.cpp'); s=p.read_text()
          s,n=re.subn(r'\{"[^"]+",(0x[0-9A-Fa-f]+),(0x[0-9A-Fa-f]+)\}',r'{\1,\2}',s)
          if n != 24: raise SystemExit(f'ColorCorrection.cpp: expected 24 unused palette-name removals, found {n}')
          p.write_text(s)

          p=Path('firmware/src/main.cpp'); s=p.read_text()
          for before,after in [
            ('static bool pinAuthConfigured(){return basePinAuthConfigured();}\n',''),
            ('d["configured"]=pinAuthConfigured();','d["configured"]=basePinAuthConfigured();'),
            ('d["localOnly"]=false;','')]:
              n=s.count(before)
              if n != 1: raise SystemExit(f'main.cpp: expected one match, found {n}: {before!r}')
              s=s.replace(before,after)
          s,n=re.subn(r'^  server\.on\("/api/config",HTTP_GET,\[\]\{.*\}\);\n','',s,count=1,flags=re.M)
          if n != 1: raise SystemExit('main.cpp: unused /api/config route was not found exactly once')
          p.write_text(s)

          replace_once('firmware/include/RemoteUpdate.h',
            '// v2.0.8: signed discovery, verified manual install, and periodic automatic OTA install.',
            '// Signed discovery, verified manual install, and periodic automatic OTA install.')
          PY
          python tools/release.py bump
          python tools/release.py prepare
          git diff --check
          ! grep -RniE 'currentUser|Save All Three|All three PIN|all three profile|All three saved|recoveryPanel|recoveryLink|recoveryNote|profileLockedMessage|localOnly|server\.on\("/api/config"' firmware
      - name: Compile mock BLE/Wokwi path
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          pio run -d firmware -e wokwi -j 4
      - name: Commit verified cleanup
        run: |
          git rm .github/workflows/apply-v2011-cleanup.yml
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git add FIRMWARE_VERSION.txt README.md firmware
          git commit -m 'Clean redundant Anderson firmware code for v2.0.11'
          git push origin HEAD:codex/anderson-code-cleanup-v2-0-11
