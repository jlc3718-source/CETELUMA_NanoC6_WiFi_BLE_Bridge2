name: JH2 1.1.70 Publish Verified Signed Firmware
on:
  push:
    branches: [feature/jh2-native-local-upload-no-repartition-20261024]
    paths: [.github/workflows/jh2-170-publish-verified-release.yml]
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish 1.1.70 signed release after confirmed physical Nano heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          root='https://api.github.com/repos/'+os.environ['REPO']
          hdr={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          def get(url,method='GET',data=None):
              raw=json.dumps(data).encode() if data is not None else None
              req=urllib.request.Request(url,data=raw,headers=hdr,method=method)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          releases=get(root+'/releases?per_page=10')
          matches=[r for r in releases if r['tag_name']=='jason-home-2-nanoc6-v1.1.70']
          assert len(matches)==1,'Expected one pinned 1.1.70 draft'
          r=matches[0]
          assert r['id']==423101134 and r['target_commitish']=='3647871bdc4ce4654921941516338249fbb21fe0'
          assert {a['name'] for a in r['assets']}=={'jh2-runtime-1.1.70.bin','latest.json','release.json'}
          if r['draft']:r=get(root+'/releases/'+str(r['id']),'PATCH',{'draft':False,'prerelease':False})
          assert r['draft'] is False and r['published_at']
          print('SIGNED_170_PUBLIC_RELEASE_PUBLISHED',r['html_url'],r['published_at'],flush=True)
          PY
