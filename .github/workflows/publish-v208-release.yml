name: Publish Anderson v2.0.8 OTA release
on:
  push:
    branches: ['codex/publish-anderson-v2-0-8-release']
    paths: ['.github/workflows/publish-v208-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download exact verified branch artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34494372140 --repo "$GITHUB_REPOSITORY" -n Anderson-Home-NanoC6-v2.0.8 -D /tmp/v208
          test -f /tmp/v208/and_2.0.8.bin
          test -f /tmp/v208/release.json
          test "$(jq -r .version /tmp/v208/release.json)" = "2.0.8"
          test "$(jq -r .commit /tmp/v208/release.json)" = "6f28a3ebbf04796c78ecbc0664249b35baa32fbf"
          test "$(jq -r .ota_slot_bytes /tmp/v208/release.json)" = "1966080"
          test "$(stat -c%s /tmp/v208/and_2.0.8.bin)" = "1793296"
          test "$(sha256sum /tmp/v208/and_2.0.8.bin | awk '{print $1}')" = "ed384e9b60454c07171c0ad21c4aef1a50bebdeac04cdd38efaa2c7febb738cc"
      - name: Publish stable OTA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=anderson-v2.0.8
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target 6f28a3ebbf04796c78ecbc0664249b35baa32fbf --title "Anderson Home v2.0.8" --notes "Removes the emergency APP-only firmware flash/recovery section from the login screen while retaining existing backend/manual recovery paths. Android APK unchanged."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" /tmp/v208/and_2.0.8.bin /tmp/v208/release.json --clobber
      - name: Retain current release plus one backup
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_RELEASES: '1'
        run: bash .github/scripts/anderson-retention.sh
