name: Apply Anderson Home 3.1.28 UI

on:
  push:
    branches: ['codex/release-current']
    paths:
      - '.github/workflows/apply-anderson-3.1.28-ui.yml'

concurrency:
  group: apply-anderson-3-1-28-ui
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-current
          fetch-depth: 0

      - name: Apply exact 3.1.28 source-only UI changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          expected_base = '3.1.27'
          new_version = '3.1.28'

          version_file = root / 'FIRMWARE_VERSION.txt'
          if version_file.read_text().strip() != expected_base:
              raise SystemExit('Refusing update: production baseline is not 3.1.27')
          version_file.write_text(new_version + '\n')

          def replace_once(path, old, new):
              p = root / path
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'firmware/src/main.cpp',
              'static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.27";',
              'static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.28";'
          )

          old_pts = 'pts=[[58,82],[72,76],[86,69],[100,62],[114,55],[128,49],[142,42],[156,35],[170,28],[184,28],[198,35],[212,42],[226,49],[240,55],[254,62],[268,69],[282,76],[300,82],[285,92],[285,106],[285,120],[285,134],[270,145],[250,145],[230,145],[210,145],[190,145],[170,145],[150,145],[130,145],[110,145],[90,145],[75,134],[75,118],[75,102],[75,88]];'
          new_pts = 'pts=[[58,82],[72,76],[86,69],[100,62],[114,55],[128,49],[142,42],[156,35],[170,28],[184,28],[198,35],[212,42],[226,49],[240,55],[254,62],[268,69],[282,76],[300,82]];'
          replace_once('firmware/web/index.html', old_pts, new_pts)

          replace_once(
              'firmware/web/v3_mockup.js',
              "const navLabels={home:'Home',lights:'Create',events:'Schedules',favorites:'Collection',settings:'Settings'};",
              "const navLabels={home:'Home',lights:'Create',events:'Schedules',favorites:'Favorites',settings:'Settings'};"
          )

          readme = root / 'README.md'
          if readme.exists():
              text = readme.read_text()
              if '**v3.1.27**' in text:
                  readme.write_text(text.replace('**v3.1.27**', '**v3.1.28**', 1))

          html = (root / 'firmware/web/index.html').read_text()
          js = (root / 'firmware/web/v3_mockup.js').read_text()
          match = re.search(r'\bpts=(\[\[.*?\]\]);', html, re.S)
          if not match:
              raise SystemExit('3.1.28 roofline point list missing')
          if match.group(1).count('],[') + 1 != 18:
              raise SystemExit('3.1.28 roofline must contain exactly 18 points')
          if "favorites:'Favorites'" not in js or "favorites:'Collection'" in js:
              raise SystemExit('Favorites bottom-nav label validation failed')
          if 'THE COLOR COLLECTION' not in js:
              raise SystemExit('Color Collection heading was unexpectedly changed')

          notes = root / 'firmware/RELEASE_NOTES_v3.1.28.md'
          notes.write_text('''# Anderson Home v3.1.28\n\nUI-only refinement from the verified v3.1.27 production baseline.\n\n- Home house preview lights now trace only the roofline; base/side LEDs were removed from the preview.\n- Bottom navigation label `Collection` is now `Favorites`.\n- The separate `THE COLOR COLLECTION` heading is unchanged.\n- Controller behavior, BLE, Wi-Fi recovery, schedules/events, profiles/PINs, NVS, recovery, OTA security, and safety logic are unchanged.\n''')

          print('Applied and validated Anderson Home v3.1.28 source changes')
          PY

      - name: Remove one-shot workflow and commit production source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-anderson-3.1.28-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Anderson Home v3.1.28 roofline and Favorites UI'
          git push origin HEAD:codex/release-current
