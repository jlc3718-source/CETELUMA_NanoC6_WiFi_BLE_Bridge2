name: Stage v4 Native IDF UI Migration
on:
  push:
    branches:
      - work/v4.0.0-native-idf
    paths:
      - .github/workflows/zz-v4-ui-migration.yml
      - .github/scripts/v4-ui-migration.py
permissions:
  contents: write
jobs:
  migrate-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.0.0-native-idf
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply UI migration
        run: python .github/scripts/v4-ui-migration.py
      - name: Validate browser JavaScript and transport markers
        run: |
          node --check firmware/web/v3_mockup.js
          grep -q "X-Anderson-Filename',file.name" firmware/web/index.html
          grep -q "X-Anderson-Filename',file.name" firmware/web/recovery.html
          grep -q 'Emergency Firmware Flash' firmware/web/v3_mockup.js
          git diff --check
      - name: Commit migration
        run: |
          rm -f .github/workflows/zz-v4-ui-migration.yml .github/scripts/v4-ui-migration.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Jason emergency APP flash for native IDF"
          git push origin HEAD:refs/heads/work/v4.0.0-native-idf
