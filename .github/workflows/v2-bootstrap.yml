name: Bootstrap Anderson Home v2.0.0

on:
  push:
    branches: ['codex/anderson-v2-home-holiday-favorites']
    paths: ['.github/workflows/v2-bootstrap.yml']

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - name: Apply v2.0.0 source change
        run: |
          python - <<'PY'
          from pathlib import Path

          Path('FIRMWARE_VERSION.txt').write_text('2.0.0\n')

          p = Path('firmware/src/main.cpp')
          s = p.read_text()
          s = s.replace('static constexpr const char* ANDERSON_FIRMWARE_VERSION="1.1.11";', 'static constexpr const char* ANDERSON_FIRMWARE_VERSION="2.0.0";')
          needle = 'static void migrateLegacyCustomStorage(){String lights=presetStoreRaw();if(!jsonArrayValid(lights))customFileWrite("/custom_lights.json","[]");String schedules=scheduleStoreRaw();if(!jsonArrayValid(schedules))customFileWrite("/custom_schedules.json","[]");}\n'
          addition = '''\n// v2.0 Home favorite baseline: all built-in holidays, and only holidays.\n// Apply once to existing NVS so an OTA upgrade changes the live device rather than\n// merely changing fresh-install defaults. After migration, favorites remain user-editable.\nstatic uint64_t holidayFavoriteMask(){\n  uint64_t mask=0;\n  for(size_t i=0;i<EVENT_COUNT&&i<64;i++)if(EVENTS[i].kind==EventKind::Holiday)mask|=(1ULL<<i);\n  return mask;\n}\nstatic bool migrateV2HomeFavorites(){\n  Preferences marker;\n  if(!marker.begin("anderson",true))return false;\n  uint8_t revision=marker.getUChar("homefavrev",0);\n  marker.end();\n  if(revision>=2)return true;\n\n  // Clear custom-show favorites once so Home starts with holiday favorites only.\n  JsonDocument presets;\n  if(deserializeJson(presets,presetStoreRaw())||!presets.is<JsonArray>())return false;\n  bool customChanged=false;\n  for(JsonObject p:presets.as<JsonArray>()){\n    if(p["favorite"]|false){p["favorite"]=false;customChanged=true;}\n  }\n  if(customChanged){String out;serializeJson(presets,out);if(!customFileWrite("/custom_lights.json",out))return false;}\n\n  const uint64_t favorites=holidayFavoriteMask();\n  Preferences prefs;\n  if(!prefs.begin("anderson",false))return false;\n  prefs.putULong64("favorite",favorites);\n  bool favoriteOk=prefs.getULong64("favorite",0)==favorites;\n  if(favoriteOk)prefs.putUChar("homefavrev",2);\n  bool markerOk=favoriteOk&&prefs.getUChar("homefavrev",0)>=2;\n  prefs.end();\n  if(!markerOk)return false;\n  store.get().favoriteMask=favorites;\n  return true;\n}\n'''
          if needle not in s:
              raise SystemExit('Expected custom-storage migration marker not found')
          s = s.replace(needle, needle + addition, 1)
          old_setup = 'store.begin();loadPinAuthConfig();customFsReady=storageSelfTest();if(customFsReady)migrateLegacyCustomStorage();else Serial.println("Anderson NVS persistent storage self-test failed");loadEventOverrides();connectWiFi();setupMdns();ble.begin(&store.get());'
          new_setup = 'store.begin();loadPinAuthConfig();customFsReady=storageSelfTest();if(customFsReady){migrateLegacyCustomStorage();if(!migrateV2HomeFavorites())Serial.println("Anderson v2.0 Home favorites migration pending");}else Serial.println("Anderson NVS persistent storage self-test failed");loadEventOverrides();connectWiFi();setupMdns();ble.begin(&store.get());'
          if old_setup not in s:
              raise SystemExit('Expected setup sequence not found')
          s = s.replace(old_setup, new_setup, 1)
          p.write_text(s)

          p = Path('firmware/web/index.html')
          s = p.read_text()
          if s.count('<strong>v1.1.11</strong>') != 1:
              raise SystemExit('Expected UI version marker not found exactly once')
          p.write_text(s.replace('<strong>v1.1.11</strong>', '<strong>v2.0.0</strong>', 1))

          p = Path('README.md')
          s = p.read_text()
          s = s.replace('Current firmware: **v1.1.11**.', 'Current firmware: **v2.0.0**.', 1)
          anchor = '- Saved custom lighting shows appear on Home with Preview, Enabled, and Favorite controls; disabling a show pauses its automatic calendar runs without deleting it.\n'
          note = '- v2.0 resets the Home favorites baseline once on upgrade so every built-in Holiday is favorited and Awareness/Seasonal/custom-show favorites are cleared; favorites remain user-editable afterward.\n'
          if note not in s:
              if anchor not in s:
                  raise SystemExit('Expected README anchor not found')
              s = s.replace(anchor, anchor + note, 1)
          p.write_text(s)

          Path('.github/workflows/v2-bootstrap.yml').unlink()
          PY

          python tools/release.py prepare
          python - <<'PY'
          import re
          from pathlib import Path
          rows=[]
          for line in Path('firmware/src/EventCatalog.cpp').read_text().splitlines():
              m=re.match(r'\{"([^"]+)","([^"]+)",EventKind::(Holiday|Awareness|Seasonal),',line)
              if m: rows.append((len(rows),*m.groups()))
          holidays=[row for row in rows if row[3]=='Holiday']
          mask=sum(1<<row[0] for row in holidays)
          assert len(rows)==43, len(rows)
          assert len(holidays)==24, len(holidays)
          assert mask==0x7B321F193E5, hex(mask)
          print('Verified 24 holiday favorites; mask',hex(mask))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Anderson Home v2.0.0: holiday-only Home favorites baseline"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Install build tool
        run: python -m pip install -q -r tools/requirements-build.txt
      - name: Restore PlatformIO dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
            firmware/.pio/libdeps
          key: ${{ runner.os }}-pio-v1-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-v1-
      - name: Restore compiled objects
        uses: actions/cache/restore@v4
        with:
          path: .pio-build-cache
          key: ${{ runner.os }}-anderson-objects-v1-${{ hashFiles('firmware/platformio.ini') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-anderson-objects-v1-${{ hashFiles('firmware/platformio.ini') }}-
      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package verified firmware
        run: python tools/release.py package
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-NanoC6-v2.0.0
          path: release/*
          if-no-files-found: error
