name: Build Anderson Android

on:
  push:
    branches:
      - codex/anderson-android-v1
    paths:
      - 'android-app/**'
      - '.github/workflows/build-anderson-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build unsigned release APK and AAB
        run: gradle -p android-app :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Package Android outputs and signing tools
        run: |
          set -euo pipefail
          mkdir -p android-artifact/sign-tools/lib
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk android-artifact/Anderson-Home-1.0.0-unsigned.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab android-artifact/Anderson-Home-1.0.0-unsigned.aab
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" android-artifact/sign-tools/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android-artifact/sign-tools/lib/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" android-artifact/sign-tools/zipalign
          chmod +x android-artifact/sign-tools/apksigner android-artifact/sign-tools/zipalign

      - uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-Android-v1.0.0-unsigned
          path: android-artifact/**
          retention-days: 7
