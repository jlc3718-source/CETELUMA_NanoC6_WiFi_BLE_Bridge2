name: JH2 Nano 2.0.21 guarded Eufy Wi-Fi-first BLE fallback OTA
on:
  push:
    branches: [feature/jh2-eufy-wifi-primary-ble-fallback-20261109]
    paths: ['.github/workflows/jh2-221-guarded-wifi-ble-ota-20261109.yml']
permissions: {contents: read}
concurrency: {group: jh2-production-signed-ota-singleton, cancel-in-progress: false}
jobs:
  upgrade:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Guarded 2.0.21 OTA with Wi-Fi-primary, Eufy offline fallback capability, SmartDawn preservation
        shell: bash
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/jh2-221-guarded-wifi-ble-ota-20261109.py
          sudo -n --preserve-env=GITHUB_WORKSPACE python3 .github/scripts/jh2-221-guarded-wifi-ble-ota-20261109.py
