name: Build Anderson Home 3.1.15 Sync Fix

on:
  push:
    branches: ['codex/3.1.14-sync']
    paths:
      - '.github/workflows/build-3.1.15-sync.yml'
      - 'tools/bump_3_1_15_sync.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERSION: 3.1.15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Bump synchronized source to 3.1.15
        run: |
          if [ "$(cat FIRMWARE_VERSION.txt)" = "3.1.14" ]; then
            python tools/bump_3_1_15_sync.py
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add FIRMWARE_VERSION.txt README.md firmware
            if ! git diff --cached --quiet; then
              git commit -m "Anderson Home v3.1.15 synchronized dual-controller BLE dispatch"
              git push origin HEAD:codex/3.1.14-sync
            fi
          fi
      - name: Check BLE synchronization regression
        run: python tools/test_connection_recovery.py
      - name: Check maintenance and recovery regressions
        run: python tools/test_maintenance.py
      - name: Check Anderson source regressions
        run: python tools/test_regressions.py
      - name: Check audited delivery invariants
        run: python tools/test_audit_fixes.py
      - name: Validate release source
        run: python tools/release.py check
      - name: Prepare release
        run: python tools/release.py prepare
      - name: Compile NanoC6 app-only firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package app-only firmware
        run: python tools/release.py package
      - name: Verify packaged firmware
        run: |
          set -euo pipefail
          test -s "release/and_${VERSION}.bin"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          v=os.environ['VERSION']
          p=Path(f'release/and_{v}.bin')
          m=json.loads(Path('release/release.json').read_text())
          data=p.read_bytes()
          assert data[0]==0xE9
          assert m['version']==v
          assert m['files'][p.name]['bytes']==len(data)
          assert m['files'][p.name]['sha256']==hashlib.sha256(data).hexdigest()
          print(json.dumps({'name':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'commit':m['commit']}))
          PY
      - name: Upload verified firmware
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-3.1.15-SYNC
          path: release/*
          if-no-files-found: error
          retention-days: 30
