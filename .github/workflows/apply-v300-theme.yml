name: Apply Anderson v3.0.0 theme

on:
  push:
    branches:
      - codex/anderson-v3-theme
    paths:
      - .github/workflows/apply-v300-theme.yml

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/anderson-v3-theme
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply theme
        run: python .github/scripts/apply_v300_theme.py
      - name: Validate
        run: |
          python tools/release.py prepare
          git diff --check
      - name: Commit themed source
        run: |
          git config user.name "jlc3718-source"
          git config user.email "jlc3718@gmail.com"
          git add -A FIRMWARE_VERSION.txt README.md firmware
          git commit -m "Anderson Home v3.0.0 neon theme"
          git push origin HEAD:codex/anderson-v3-theme
