name: JH2 One-Time Authorized Curtain Source Inspection
on:
  push:
    branches: [codex/jh2-slot-inventory-fix-20261018]
    paths: ['.github/workflows/jh2-curtain-inventory-inspect-20261018.yml']
permissions: {contents: read}
concurrency:
  group: jason-home-oracle-production
  cancel-in-progress: false
jobs:
  inspect:
    if: github.run_number == 2
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 4
    steps:
      - name: Read only light-project sources explicitly authorized on October 18
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=RUNNER_TEMP,GITHUB_RUN_ID -n python3 - <<'PY'
          import json, subprocess, pathlib, hashlib, os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/('jh2-curtain-inventory-'+os.environ['GITHUB_RUN_ID'])
          root.mkdir(mode=0o700)
          listing=json.loads(subprocess.check_output(['docker','exec','jason-home-2-web','node','-e',"const f=require('fs'); console.log(JSON.stringify(['/app','/app/web'].flatMap(p=>f.readdirSync(p).filter(n=>/^curtain(?:_|\\.|$)/i.test(n)&&/\\.(?:mjs|js|html)$/.test(n)&&!n.startsWith('curtain_real_')).map(n=>p+'/'+n))));"],text=True))
          print('LIGHT_PROJECT_SOURCES',json.dumps(listing),flush=True)
          for source in listing:
              target=root/source.removeprefix('/app/')
              target.parent.mkdir(exist_ok=True,parents=True)
              subprocess.run(['docker','cp','jason-home-2-web:'+source,str(target)],check=True)
              data=target.read_bytes()
              print('SOURCE',str(target.relative_to(root)),len(data),hashlib.sha256(data).hexdigest(),flush=True)
          os.chmod(root,0o755)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-Deployed-Curtain-Inventory-Sources
          path: ${{ runner.temp }}/jh2-curtain-inventory-${{ github.run_id }}/
          retention-days: 1
          if-no-files-found: error
