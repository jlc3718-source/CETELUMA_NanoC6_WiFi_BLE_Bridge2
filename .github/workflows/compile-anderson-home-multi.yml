name: Compile Anderson Home Multi Controller 4FX

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Anderson_Home_MultiController_4FX_Source.zip'
      - '.github/workflows/compile-anderson-home-multi.yml'

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Extract final multi-controller source
        run: |
          rm -rf build_source
          mkdir build_source
          unzip -q Anderson_Home_MultiController_4FX_Source.zip -d build_source
          test -d build_source/src
          test -d build_source/include
          sed -i 's/board_build.partitions = default.csv/board_build.partitions = huge_app.csv/' build_source/platformio.ini
          grep -n 'board_.*flash\|partitions' build_source/platformio.ini || true
          grep -n '<option>Jump</option><option>Breath</option><option>Strobe</option><option>Gradient</option>' build_source/include/WebUI.h
          ! grep -q 'Effect::Solid\|Effect::Fade\|Effect::Pulse\|Effect::Rainbow\|Effect::Chase\|Effect::Twinkle\|Effect::Meteor\|Effect::CandyCane\|Effect::Fire\|Effect::Water' build_source/src/EventCatalog.cpp

      - name: Compile NanoC6 firmware
        run: pio run -d build_source -e m5stack-nanoc6

      - name: Export firmware images
        run: |
          BUILD=build_source/.pio/build/m5stack-nanoc6
          test -s "$BUILD/firmware.factory.bin"
          test -s "$BUILD/firmware.bin"
          cp "$BUILD/firmware.factory.bin" Anderson_Home_NanoC6_MULTI_4FX_ALL_IN_ONE.bin
          cp "$BUILD/firmware.bin" Anderson_Home_NanoC6_MULTI_4FX_APP_ONLY.bin
          sha256sum Anderson_Home_NanoC6_MULTI_4FX_ALL_IN_ONE.bin Anderson_Home_NanoC6_MULTI_4FX_APP_ONLY.bin
          ls -lh Anderson_Home_NanoC6_MULTI_4FX_ALL_IN_ONE.bin Anderson_Home_NanoC6_MULTI_4FX_APP_ONLY.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-NanoC6-MULTI-4FX
          path: |
            Anderson_Home_NanoC6_MULTI_4FX_ALL_IN_ONE.bin
            Anderson_Home_NanoC6_MULTI_4FX_APP_ONLY.bin
          if-no-files-found: error
