name: Build Anderson Home Firmware

on:
  workflow_dispatch:
    inputs:
      full_image:
        description: Include a full serial-recovery image
        type: boolean
        default: false
  # Normal delivery builds once from the exact codex/ change branch. Merging the
  # already-verified source to main does not repeat an identical firmware build.
  push:
    branches: ['codex/**']
    paths: ['firmware/**', 'tools/**', 'FIRMWARE_VERSION.txt']
  pull_request:
    branches: [main]
    paths: ['firmware/**', 'tools/**', 'FIRMWARE_VERSION.txt', '.github/workflows/compile-anderson-home-multi.yml']

# A newer revision replaces an unfinished build of the same branch.
concurrency:
  group: anderson-firmware-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-firmware:
    # Same-repo changes build on codex/ push. Retain PR builds for contributions from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - name: Install build tool
        run: python -m pip install -q -r tools/requirements-build.txt
      - name: Restore PlatformIO dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
            firmware/.pio/libdeps
          key: ${{ runner.os }}-pio-v1-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-v1-
      - name: Restore compiled objects
        id: objects
        uses: actions/cache/restore@v4
        with:
          path: .pio-build-cache
          key: ${{ runner.os }}-anderson-objects-v1-${{ hashFiles('firmware/platformio.ini') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-anderson-objects-v1-${{ hashFiles('firmware/platformio.ini') }}-
      - name: Prepare release
        run: python tools/release.py prepare
      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package verified firmware
        env:
          FULL_IMAGE: ${{ inputs.full_image }}
        run: |
          if [ "$FULL_IMAGE" = true ]; then
            python tools/release.py package --full
          else
            python tools/release.py package
          fi
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-NanoC6-v${{ env.VERSION }}
          path: release/*
          if-no-files-found: error
      - name: Save compiled objects for the next revision
        if: steps.objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .pio-build-cache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - name: Remove old completed workflow runs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Keep the successful run that produced the current artifact. Remove every
          # older completed run in the repository, regardless of workflow/conclusion.
          while true; do
            RUN_IDS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .status == \"completed\") | .id")"
            [ -n "$RUN_IDS" ] || break
            while read -r RUN_ID; do
              [ -n "$RUN_ID" ] || continue
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            done <<< "$RUN_IDS"
          done
