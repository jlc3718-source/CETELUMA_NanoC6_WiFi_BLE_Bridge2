name: Build Anderson Home Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - 'FIRMWARE_VERSION.txt'
      - '.github/workflows/compile-anderson-home-multi.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - 'FIRMWARE_VERSION.txt'
      - '.github/workflows/compile-anderson-home-multi.yml'

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned PlatformIO
        run: pip install platformio==6.2.0

      - name: Restore PlatformIO dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
            firmware/.pio/libdeps
          key: ${{ runner.os }}-pio-v1-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-v1-

      - name: Generate compressed web UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip
          html=Path('firmware/web/index.html').read_bytes()
          gz=gzip.compress(html,compresslevel=9,mtime=0)
          out=Path('firmware/include/WebUIGzip.h')
          lines=['#pragma once','#include <Arduino.h>','',f'static const size_t WEB_UI_GZ_LEN={len(gz)};','static const uint8_t WEB_UI_GZ[] PROGMEM = {']
          for i in range(0,len(gz),20):
              lines.append('  '+','.join(f'0x{b:02x}' for b in gz[i:i+20])+',')
          lines.append('};')
          out.write_text('\n'.join(lines)+'\n')
          print(f'Web UI: {len(html)} bytes -> {len(gz)} bytes gzip; saved {len(html)-len(gz)} bytes')
          PY

      - name: Verify release source
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < FIRMWARE_VERSION.txt)"
          grep -q "ANDERSON_FIRMWARE_VERSION=\"${VERSION}\"" firmware/src/main.cpp
          grep -q ">v${VERSION}<" firmware/web/index.html
          grep -q 'anderson-preset' firmware/src/main.cpp
          grep -q 'anderson-csched' firmware/src/main.cpp
          grep -q 'r\["id"\]=newId' firmware/src/main.cpp
          grep -q 'r\["backend"\]="NVS"' firmware/src/main.cpp
          grep -Fq 'String deleteId=d["deleteId"] | ""' firmware/src/main.cpp
          ! grep -Fq 'd["deleteId"].as<String>()' firmware/src/main.cpp
          grep -q 'server.sendHeader("Content-Encoding","gzip")' firmware/src/main.cpp
          grep -q 'server.sendHeader("Cache-Control","no-store, no-cache, must-revalidate")' firmware/src/main.cpp
          ! grep -R -q 'SPIFFS\|LittleFS' firmware/src firmware/include
          ! grep -q '/api/login\|AHSESS\|loginOverlay\|Signed out' firmware/src/main.cpp firmware/web/index.html
          grep -q 'id="profileGate"' firmware/web/index.html
          grep -q 'data-profile="shirley"' firmware/web/index.html
          grep -q 'data-profile="jason"' firmware/web/index.html
          grep -q 'ANDERSON_LOCKOUT_SAFE_PROFILE_GATE' firmware/web/index.html
          grep -q 'Emergency APP-only Firmware Recovery' firmware/web/index.html firmware/src/main.cpp
          grep -q 'href="/recovery"' firmware/web/index.html
          grep -Fq 'server.on("/recovery",HTTP_GET' firmware/src/main.cpp
          grep -q "let currentRole='none',currentUser=''" firmware/web/index.html
          grep -q 'ANDERSON_FOUR_DIGIT_PIN_AUTH' firmware/src/main.cpp
          grep -Fq 'server.on("/api/auth/unlock",HTTP_POST' firmware/src/main.cpp
          grep -Fq 'server.on("/api/auth/config",HTTP_POST' firmware/src/main.cpp
          grep -q 'X-Anderson-Session' firmware/src/main.cpp firmware/web/index.html
          grep -q 'mbedtls_sha256' firmware/src/main.cpp
          grep -q 'pin.length()!=4' firmware/src/main.cpp
          grep -q 'id="profilePinForm"' firmware/web/index.html
          grep -q 'id="shirleyPinConfirm"' firmware/web/index.html
          grep -q 'id="jasonPinConfirm"' firmware/web/index.html
          grep -Fq 'action="/api/update?recovery=1"' firmware/web/index.html firmware/src/main.cpp
          grep -q 'otaRecoveryRequest&&pinProtectionEnabled&&!disablePinProtection()' firmware/src/main.cpp
          grep -q 'ANDERSON_PROTECTED_OTA' firmware/src/main.cpp
          grep -q 'X-Anderson-Recovery-PIN' firmware/src/main.cpp firmware/web/index.html
          grep -q 'id="recoveryPin"' firmware/web/index.html
          grep -q 'id="homeCustomLightList"' firmware/web/index.html
          grep -q 'ANDERSON_HOME_CUSTOM_LIGHTS' firmware/src/main.cpp
          grep -Fq 'o["enabled"]=true;o["favorite"]=false' firmware/src/main.cpp
          grep -Fq 'loadPresetTheme(o["presetId"].as<String>(),q,qb,qs,nullptr,true)' firmware/src/main.cpp
          grep -q 'data-tab="lights"' firmware/web/index.html
          grep -q 'id="customPresetList"' firmware/web/index.html
          ! grep -q 'id="presetList"' firmware/web/index.html
          ! grep -q '^const presets=' firmware/web/index.html
          grep -q 'Save was acknowledged, but the custom light could not be read back' firmware/web/index.html
          grep -q '/api/update' firmware/src/main.cpp
          grep -q 'FFF0' firmware/src/BleController.cpp
          grep -q 'FFF3' firmware/src/BleController.cpp
          grep -q '32f6bf400b276b0f61cf42c50490a7808ee3457e' firmware/platformio.ini
          python3 - <<'PY'
          from pathlib import Path
          source=Path('firmware/src/main.cpp').read_text()
          update=source.split('server.on("/api/update",HTTP_POST',1)[1].split('server.on("/api/reboot",HTTP_POST',1)[0]
          if 'verifyProfilePin("jason",recoveryPin,recoveryRole)' not in update:
              raise SystemExit('Independent recovery must verify Jason PIN directly')
          if 'uint8_t role=requestRole()' not in update:
              raise SystemExit('Routine firmware update must verify the active Jason session')
          html=Path('firmware/web/index.html').read_text()
          if "x.setRequestHeader('X-Anderson-Session',window.andersonAuthToken)" not in html:
              raise SystemExit('Routine firmware upload must send the Jason session')
          ble=Path('firmware/src/BleController.cpp').read_text()
          expected='{2000,1000,500,250,100}'
          if f'intervalsMs[5]={expected}' not in ble:
              raise SystemExit('NanoC6 software-effect speed intervals do not match the release contract')
          if '[0,2000,1000,500,250,100]' not in html or '||500}' not in html:
              raise SystemExit('Web preview speed intervals do not match the NanoC6 firmware')
          if 'map(constrain(speedLevel,1,5),1,5,700,95)' in ble:
              raise SystemExit('Legacy software-effect timing map is still present')
          for marker in ('nowMs-lastEffect<interval','nowMs/interval','interval/2','interval/5','interval*8UL'):
              if marker not in ble:
                  raise SystemExit(f'Software effect no longer derives its timing from the selected interval: {marker}')
          PY

      - name: Check web UI JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('firmware/web/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if len(scripts)<3:
              raise SystemExit(f'Expected at least 3 inline scripts; found {len(scripts)}')
          Path('/tmp/anderson-web-ui.js').write_text('\n'.join(scripts))
          print(f'Checking {len(scripts)} inline scripts')
          PY
          node --check /tmp/anderson-web-ui.js

      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6

      - name: Verify OTA capacity and export release files
        run: |
          set -euo pipefail
          BUILD="firmware/.pio/build/m5stack-nanoc6"
          VERSION="$(tr -d '\r\n' < FIRMWARE_VERSION.txt)"
          test -s "$BUILD/firmware.factory.bin"
          test -s "$BUILD/firmware.bin"
          python3 - <<'PY'
          from pathlib import Path
          app=Path('firmware/.pio/build/m5stack-nanoc6/firmware.bin').stat().st_size
          slot=0x1E0000
          print(f'App size: {app} bytes; OTA slot: {slot} bytes; headroom: {slot-app} bytes')
          if app >= slot:
              raise SystemExit('Firmware does not fit in OTA slot')
          PY
          cp "$BUILD/firmware.bin" "Anderson_Home_NanoC6_v${VERSION}_APP_ONLY.bin"
          cp "$BUILD/firmware.factory.bin" "Anderson_Home_NanoC6_v${VERSION}_ALL_IN_ONE.bin"
          sha256sum "Anderson_Home_NanoC6_v${VERSION}_APP_ONLY.bin" "Anderson_Home_NanoC6_v${VERSION}_ALL_IN_ONE.bin"
          ls -lh "Anderson_Home_NanoC6_v${VERSION}_APP_ONLY.bin" "Anderson_Home_NanoC6_v${VERSION}_ALL_IN_ONE.bin"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-NanoC6-v${{ env.VERSION }}
          path: |
            Anderson_Home_NanoC6_v${{ env.VERSION }}_APP_ONLY.bin
            Anderson_Home_NanoC6_v${{ env.VERSION }}_ALL_IN_ONE.bin
          if-no-files-found: error
