name: Compile Anderson Home OTA Roles Custom Lights

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'multi_overlay/**'
      - '.github/workflows/compile-anderson-home-multi.yml'

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Extract base and apply multi-controller overlay
        run: |
          rm -rf build_source
          mkdir build_source
          unzip -q Anderson_Home_Complete_Project.zip -d build_source
          FW=build_source/Anderson_Home_Complete_Project/firmware
          test -d "$FW/src"
          test -d "$FW/include"
          cp -v multi_overlay/include/BleController.h "$FW/include/BleController.h"
          cp -v multi_overlay/include/Types.h "$FW/include/Types.h"
          cp -v multi_overlay/src/BleController.cpp "$FW/src/BleController.cpp"
          cp -v multi_overlay/src/SettingsStore.cpp "$FW/src/SettingsStore.cpp"
          cp -v multi_overlay/src/main.cpp "$FW/src/main.cpp"
          python multi_overlay/patch_webui.py "$FW/include/WebUI.h"
          python multi_overlay/reconfigure_effects.py "$FW"
          python multi_overlay/fix_preview_events.py "$FW/include/WebUI.h"
          python multi_overlay/edit_events_defaults.py "$FW"
          python multi_overlay/rgb_wheel_saved_colors.py "$FW"
          python multi_overlay/label_event_checkboxes.py "$FW/include/WebUI.h"
          python multi_overlay/ota_firmware_and_lights_wheel.py "$FW"
          python multi_overlay/auth_roles.py "$FW"
          python multi_overlay/custom_light_schedule.py "$FW"
          python multi_overlay/ui_roles.py "$FW/include/WebUI.h"
          python multi_overlay/ui_custom_lights.py "$FW/include/WebUI.h"
          cp -v multi_overlay/partitions_ota.csv "$FW/partitions_ota.csv"
          sed -i 's/board_build.partitions = default.csv/board_build.partitions = partitions_ota.csv/' "$FW/platformio.ini"
          grep -n 'board_.*flash\|partitions' "$FW/platformio.ini" || true

          # Guardrails for the complete Anderson Home feature set.
          grep -q '<option>Jump</option><option>Breath</option><option>Strobe</option><option>Gradient</option>' "$FW/include/WebUI.h"
          ! grep -q 'Effect::Solid\|Effect::Fade\|Effect::Pulse\|Effect::Rainbow\|Effect::Chase\|Effect::Twinkle\|Effect::Meteor\|Effect::CandyCane\|Effect::Fire\|Effect::Water' "$FW/src/EventCatalog.cpp"
          grep -q 'bleAddress2' "$FW/include/Types.h"
          grep -q 'setTarget' "$FW/include/BleController.h"
          grep -q 'FFF0' "$FW/src/BleController.cpp"
          grep -q 'FFF3' "$FW/src/BleController.cpp"
          grep -q 'speedInterval(level)' "$FW/include/WebUI.h"
          grep -q 'previewing on all light strings' "$FW/include/WebUI.h"
          grep -q 'brightness=100,speedLevel=1' "$FW/src/main.cpp"
          grep -q 'RGB Color Wheel' "$FW/include/WebUI.h"
          grep -q 'Saved Colors' "$FW/include/WebUI.h"
          grep -q '/api/update' "$FW/src/main.cpp"
          grep -q 'Firmware Update' "$FW/include/WebUI.h"
          grep -q 'lightSavedColorGrid' "$FW/include/WebUI.h"
          grep -q '/api/login' "$FW/src/main.cpp"
          grep -q 'AHROLE=J' "$FW/src/main.cpp"
          grep -q 'Shirley' "$FW/include/WebUI.h"
          grep -q 'Jason — Administrator' "$FW/include/WebUI.h"
          grep -q '/api/presets' "$FW/src/main.cpp"
          grep -q '/api/custom-schedules' "$FW/src/main.cpp"
          grep -q 'customPresetName' "$FW/include/WebUI.h"
          grep -q 'Saved Custom Lights' "$FW/include/WebUI.h"
          grep -q 'Custom Scheduled Lights' "$FW/include/WebUI.h"
          grep -q 'role-user' "$FW/include/WebUI.h"
          grep -q 'partitions_ota.csv' "$FW/platformio.ini"

      - name: Compile NanoC6 firmware
        run: pio run -d build_source/Anderson_Home_Complete_Project/firmware -e m5stack-nanoc6

      - name: Verify OTA slot capacity and export firmware images
        run: |
          FW=build_source/Anderson_Home_Complete_Project/firmware
          BUILD="$FW/.pio/build/m5stack-nanoc6"
          test -s "$BUILD/firmware.factory.bin"
          test -s "$BUILD/firmware.bin"
          python3 - <<'PY'
          from pathlib import Path
          app=Path('build_source/Anderson_Home_Complete_Project/firmware/.pio/build/m5stack-nanoc6/firmware.bin').stat().st_size
          slot=0x1E0000
          print(f'App size: {app} bytes; OTA slot: {slot} bytes; headroom: {slot-app} bytes')
          if app >= slot:
              raise SystemExit('Firmware does not fit in OTA slot')
          PY
          cp "$BUILD/firmware.factory.bin" Anderson_Home_NanoC6_OTA_ROLES_CUSTOM_ALL_IN_ONE.bin
          cp "$BUILD/firmware.bin" Anderson_Home_NanoC6_OTA_ROLES_CUSTOM_APP_ONLY.bin
          sha256sum Anderson_Home_NanoC6_OTA_ROLES_CUSTOM_ALL_IN_ONE.bin Anderson_Home_NanoC6_OTA_ROLES_CUSTOM_APP_ONLY.bin
          ls -lh Anderson_Home_NanoC6_OTA_ROLES_CUSTOM_ALL_IN_ONE.bin Anderson_Home_NanoC6_OTA_ROLES_CUSTOM_APP_ONLY.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-NanoC6-OTA-ROLES-CUSTOM-LIGHTS
          path: |
            Anderson_Home_NanoC6_OTA_ROLES_CUSTOM_ALL_IN_ONE.bin
            Anderson_Home_NanoC6_OTA_ROLES_CUSTOM_APP_ONLY.bin
          if-no-files-found: error
