name: Build Anderson Home Firmware

on:
  push:
    branches: ['codex/release-current']
    paths: ['.github/trigger-build.txt']
  workflow_dispatch:
    inputs:
      full_image:
        description: Include a full serial-recovery image
        type: boolean
        default: false

concurrency:
  group: anderson-firmware-build
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  validate-source:
    name: Validate source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check maintenance, Wi-Fi recovery, and update timing
        run: python tools/test_maintenance.py
      - name: Check Anderson source regressions
        run: python tools/test_regressions.py
      - name: Check audited delivery invariants
        run: python tools/test_audit_fixes.py
      - name: Check scheduled event coverage
        run: python tools/audit_event_coverage.py --start-year 2026 --end-year 2037 --require-full

  build-firmware:
    name: Compile, verify, and package firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install build dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt
          npm ci --prefix tools --no-audit --no-fund
      - name: Resolve firmware version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < FIRMWARE_VERSION.txt)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+[a-z]?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Restore PlatformIO dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
            firmware/.pio/libdeps
          key: ${{ runner.os }}-pio-v1-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-v1-
      - name: Restore compiled objects
        id: objects
        uses: actions/cache/restore@v4
        with:
          path: .pio-build-cache
          key: ${{ runner.os }}-anderson-objects-v2-${{ hashFiles('firmware/platformio.ini') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-anderson-objects-v2-${{ hashFiles('firmware/platformio.ini') }}-${{ github.ref_name }}-
      - name: Prepare release
        run: python tools/release.py prepare
      - name: Compile NanoC6 firmware
        run: pio run -d firmware -e m5stack-nanoc6 -j 4
      - name: Package firmware
        env:
          FULL_IMAGE: ${{ inputs.full_image }}
        run: |
          if [ "${FULL_IMAGE:-false}" = true ]; then
            python tools/release.py package --full
          else
            python tools/release.py package
          fi
      - name: Verify packaged app image and manifest
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('release');version=os.environ['VERSION'];expected_commit=os.environ['EXPECTED_COMMIT']
          manifest=json.loads((root/'release.json').read_text());name=f'and_{version}.bin';app=root/name;data=app.read_bytes();digest=hashlib.sha256(data).hexdigest()
          assert manifest.get('version')==version
          assert manifest.get('commit')==expected_commit
          assert int(manifest.get('ota_slot_bytes',0))==0x1E0000
          assert data and data[0]==0xE9 and len(data)<0x1E0000
          meta=manifest.get('files',{}).get(name);assert meta and meta.get('bytes')==len(data) and meta.get('sha256')==digest
          print(f'VERIFIED {name}: {len(data)} bytes sha256={digest}')
          PY
      - name: Upload verified firmware candidate
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Home-NanoC6-v${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
      - name: Save compiled objects for the next revision
        if: steps.objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .pio-build-cache
          key: ${{ steps.objects.outputs.cache-primary-key }}
