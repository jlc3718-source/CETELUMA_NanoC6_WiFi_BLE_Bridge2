name: Materialize Anderson Home 4.5.2 OTA repair
on:
  push:
    branches: ['codex/4.5.2-nvs-ota-repair']
    paths: ['tools/apply_452_ota_repair.py']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/4.5.2-nvs-ota-repair
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_452_ota_repair.py
      - name: Verify repair markers
        run: |
          grep -F '#include <esp_ota_ops.h>' firmware/src/RemoteUpdate.cpp
          grep -F 'esp_ota_set_boot_partition' firmware/src/RemoteUpdate.cpp
          grep -F 'ANDERSON_FIRMWARE_VERSION="4.5.2"' firmware/src/main.cpp
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = '4.5.2'
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add firmware/src/RemoteUpdate.cpp firmware/src/main.cpp FIRMWARE_VERSION.txt
          git commit -m 'Anderson Home 4.5.2: native OTA repair'
          git push origin HEAD:refs/heads/codex/4.5.2-nvs-ota-repair
