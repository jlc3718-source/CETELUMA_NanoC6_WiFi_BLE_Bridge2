name: Remove Retired Anderson Colors v3.1.11

on:
  push:
    branches: ['work/v3.1.11-yellow-unified']

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.1.11-yellow-unified
      - name: Remove retired named colors and migrate their values
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Retained named colors and LED outputs.
          keep = [
            ('Red','FF0000','FF0000'),('Orange','FFA500','FF0D00'),('Pink','FFC0CB','FF0024'),
            ('Yellow','FFFF00','E0B400'),('Green','008000','28FF00'),('Blue','0000FF','0D00FF'),
            ('Purple','800080','5B00E6'),('White','FFFFFF','FFFFFA'),('Navy Blue','000080','001478')
          ]
          # Legacy output -> retained output. These inputs remain accepted only so stored old scenes migrate safely.
          legacy = {
            '00BD4C':'28FF00','00B4B4':'28FF00','0096FF':'0D00FF','FFA000':'E0B400',
            'B464FF':'5B00E6','87002D':'FF0000','A0A5AF':'FFFFFA'
          }

          # Firmware correction palette: only retained named outputs are candidates.
          cp=Path('firmware/src/ColorCorrection.cpp'); s=cp.read_text()
          a=s.index('const AndersonColorPaletteEntry ANDERSON_COLOR_PALETTE[] = {')
          b=s.index('};',a)+2
          table='const AndersonColorPaletteEntry ANDERSON_COLOR_PALETTE[] = {\n' + ''.join(
            f'  {{0x{out},0x{out}}}, // {name}\n' for name,ref,out in keep
          ) + '};'
          s=s[:a]+table+s[b:]
          s=s.replace('// Sixteen approved outputs are idempotent.','// Retained approved outputs are idempotent; retired outputs migrate forward.')
          # Replace the direct-map approved-output prefix through the historical-output comment.
          dm_start=s.index('  // Retained approved outputs are idempotent; retired outputs migrate forward.')
          dm_end=s.index('  // Historical Anderson outputs retain their intended named family.',dm_start)
          direct='  // Retained approved outputs are idempotent; retired outputs migrate forward.\n'
          direct+='  {0xFF0000,0xFF0000},{0xFF0D00,0xFF0D00},{0xFF0024,0xFF0024},{0xE0B400,0xE0B400},{0xFFFF44,0xE0B400},\n'
          direct+='  {0x28FF00,0x28FF00},{0x0D00FF,0x0D00FF},{0x5B00E6,0x5B00E6},{0xFFFFFA,0xFFFFFA},{0x001478,0x001478},\n'
          direct+='  {0x00BD4C,0x28FF00},{0x00B4B4,0x28FF00},{0x0096FF,0x0D00FF},{0xFFA000,0xE0B400},\n'
          direct+='  {0xB464FF,0x5B00E6},{0x87002D,0xFF0000},{0xA0A5AF,0xFFFFFA},\n'
          s=s[:dm_start]+direct+s[dm_end:]
          s=s.replace('// Cyan / teal family -> approved cyan.','// Blue-green legacy family -> approved green.')
          s=s.replace('0x00BD4C}', '0x28FF00}')
          s=s.replace('// Purple / lavender family -> approved purple.','// Purple family -> approved purple.')
          cp.write_text(s)

          # Built-in events cannot emit any retired palette outputs.
          ep=Path('firmware/src/EventCatalog.cpp'); ev=ep.read_text()
          for old,new in legacy.items(): ev=ev.replace('0x'+old,'0x'+new)
          ep.write_text(ev)

          # Reset Favorite Colors to only the retained set and force a new migration pass.
          pp=Path('firmware/src/PaletteMigration.cpp'); p=pp.read_text()
          p=p.replace('static constexpr uint8_t PALETTE_MIGRATION_REVISION=7;','static constexpr uint8_t PALETTE_MIGRATION_REVISION=8;')
          fav=''.join(f'a.add("#{out}");' for _,_,out in keep)
          p=re.sub(r'a\.add\("#FF0000"\);.*?a\.add\("#A0A5AF"\);',fav,p,count=1,flags=re.S)
          p=p.replace('// Revision 7 normalizes current custom lights and the one retained event-override set,\n  // then resets Favorite Colors to the sixteen approved user baselines.','// Revision 8 normalizes current custom lights and the retained event overrides,\n  // then resets Favorite Colors to the retained approved baselines.')
          pp.write_text(p)

          # Browser named palette: remove the retired choices completely.
          wp=Path('firmware/web/index.html'); w=wp.read_text()
          arr_start=w.index('const NAMED_COLOR_PALETTE=[')
          arr_end=w.index('];',arr_start)+2
          rows=['const NAMED_COLOR_PALETTE=[']+[f"  {{name:'{name}',reference:'#{ref}',output:'#{out}'}}" for name,ref,out in keep]
          array='\n'.join(rows[0:1]+[row+(',' if i<len(keep)-1 else '') for i,row in enumerate(rows[1:])])+'\n];'
          w=w[:arr_start]+array+w[arr_end:]
          # Browser legacy conversion may accept old stored RGB values, but can only emit retained outputs.
          for old,new in legacy.items():
            w=w.replace(f"'#{old}':'#{old}'",f"'#{old}':'#{new}'")
          # Existing blue-green family mappings formerly emitted the retired cyan output.
          w=w.replace("':'#00BD4C'","':'#28FF00'")
          wp.write_text(w)

          # Keep project guidance consistent with the reduced palette.
          ap=Path('AGENTS.md'); ag=ap.read_text()
          ag=ag.replace('v3.1.11 unified event palette uses the retained Original Colors scheme, with Yellow calibrated to #E0B400.','v3.1.11 unified event palette uses the retained approved color set, with Yellow calibrated to #E0B400.')
          ag += '\n- v3.1.11 approved named colors: Red, Orange, Pink, Yellow, Green, Blue, Purple, White/Warm White, and Navy Blue. Retired named colors are migrated to the nearest retained family and are not presented as selectable palette entries.\n'
          ap.write_text(ag)

          # Strengthen regression checks for the reduced palette.
          tp=Path('tools/test_regressions.py'); t=tp.read_text()
          anchor='assert "\'#FFFF44\':\'#E0B400\'" in web'
          assert anchor in t
          extra='''\nretired_names=['Burgundy','Cyan','Teal','Sky Blue','Amber Gold','Lavender','Silver Gray']\nfor name in retired_names: assert f"name:'{name}'" not in web\nfor value in ['0x00BD4C','0x00B4B4','0x0096FF','0xFFA000','0xB464FF','0x87002D','0xA0A5AF']: assert value not in ev\nassert "{name:'Navy Blue',reference:'#000080',output:'#001478'}" in web\nassert 'PALETTE_MIGRATION_REVISION=8' in t('firmware/src/PaletteMigration.cpp')\n'''
          t=t.replace(anchor,anchor+extra)
          tp.write_text(t)

          # Structural assertions: no retired choice remains visible or built into events.
          web=wp.read_text(); ev=ep.read_text(); corr=cp.read_text(); mig=pp.read_text()
          for name in ['Burgundy','Cyan','Teal','Sky Blue','Amber Gold','Lavender','Silver Gray']:
            assert f"name:'{name}'" not in web
            assert ('// '+name) not in corr
          for old in legacy:
            assert ('0x'+old) not in ev
          assert "name:'Yellow',reference:'#FFFF00',output:'#E0B400'" in web
          assert 'a.add("#E0B400")' in mig
          print('Retired named colors removed; legacy stored values migrate to retained families.')
          PY
          python tools/test_regressions.py
          python tools/test_audit_fixes.py
      - name: Commit final palette reduction and remove helper
        run: |
          rm -f .github/workflows/zz-remove-retired-colors-v3.1.11.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Remove retired named colors from v3.1.11"
          git push origin HEAD:refs/heads/work/v3.1.11-yellow-unified
