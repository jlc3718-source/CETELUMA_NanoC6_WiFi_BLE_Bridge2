name: JH2 2.0.18 Pool encrypted read-only BLE response retest
on:
  push:
    branches: [feature/jh2-nano-eufy-from-2.0.14-20261109]
    paths: ['.github/workflows/jh2-218-pool-readonly-ble-retest-20261110.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Retest Pool session only, never send a light command
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 - <<'PY'
          import subprocess,json,time,urllib.request
          d=json.loads(subprocess.check_output(['docker','inspect','jason-home-2-web']))[0]
          env=dict(x.split('=',1) for x in d['Config']['Env'] if '=' in x)
          token=env['JH2_UPSTREAM_TOKEN']
          def api(path,body=None):
           headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
           r=urllib.request.Request('http://127.0.0.1:8081'+path,headers=headers,
            data=json.dumps(body).encode() if body is not None else None,
            method='POST' if body is not None else 'GET')
           with urllib.request.urlopen(r,timeout=25) as f:return json.load(f)
          st=api('/api/eufy/local-ble/status')
          assert st.get('nanoFirmware')=='2.0.18'
          for attempt in range(1,3):
           cmd=api('/api/eufy/local-ble/command',{'target':'Pool','operation':'probe'})
           ident=cmd['commandIds'][0]
           result=None
           for i in range(65):
            time.sleep(2)
            st=api('/api/eufy/local-ble/status')
            hits=[x for x in st.get('commands') or [] if x.get('id')==ident]
            if hits and hits[0].get('state') in ('applied','failed','expired','superseded'):
             result=hits[0];break
           assert result is not None,'Pool probe did not finish'
           unit=next(x for x in st['devices'] if x['name']=='Pool')
           print('JH2_POOL_ENCRYPTED_PROBE_RETEST',json.dumps({'attempt':attempt,'state':result['state'],
             'failure':unit.get('lastFailureStage'),
             'seenAge':unit.get('lastAdvertisementAgeSeconds'),
             'probeAge':unit.get('lastProbeAgeSeconds')}),flush=True)
           if result['state']=='applied':
            print('JH2_POOL_RESPONSE_RECOVERED',flush=True)
            break
           if attempt==1:time.sleep(5)
          else:raise RuntimeError('Pool still fails encrypted service discovery after bounded retest')
          PY
