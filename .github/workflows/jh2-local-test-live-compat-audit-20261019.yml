name: JH2 Local Test Acknowledgment Read Only Audit
on:
  push:
    branches: [codex/jh2-slot-inventory-fix-20261018]
    paths: ['.github/workflows/jh2-local-test-live-compat-audit-20261019.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - name: Read recent test acknowledgments and acknowledgment guards without changing service or lights
        shell: bash
        run: |
          set -euo pipefail
          sudo docker exec -i jason-home-2-web node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const base='http://127.0.0.1:8081';
          const response=await fetch(base+'/api/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:process.env.JH2_UPSTREAM_TOKEN})});
          if(!response.ok)throw Error('Existing service authentication failed');
          const cookie=response.headers.get('set-cookie').split(';')[0];
          const get=async path=>{const r=await fetch(base+path,{headers:{cookie}});return {http:r.status,data:await r.json()}};
          const {data:status}=await get('/api/curtain/status');
          console.log('CURRENT_BRIDGE',JSON.stringify({firmware:status.firmware,online:status.online,queued:status.queued,connected:status.curtain?.connected,streaming:status.relayStreaming,retainedBytes:status.assetRetention?.retainedBytes}));
          const end=Number(status.lastCommand?.id)||0;
          for(let id=Math.max(1,end-10);id<=end;id++){
           const {http,data}=await get('/api/curtain/command?id='+id),c=data.command||{},r=c.result||{};
           console.log('RECENT_COMMAND',JSON.stringify({id,http,topLevelOk:data.ok,action:c.action,state:c.state,message:r.message,error:r.error,ok:r.ok,bleTransmitted:r.bleTransmitted}));
          }
          const source=fs.readFileSync('/app/curtain_bridge.mjs','utf8');
          const start=source.indexOf('for(const ack of');
          const section=source.slice(start,start+9000);
          for(const line of section.split('\n')){
           if(/token|authorization|credential/i.test(line))continue;
           if(/ack\.state|bleTransmitted|UPDATE curtain_commands SET state|const result|old\.action|SELECT state,action,payload/.test(line))console.log('ACK_GUARD',line.trim().slice(0,500));
          }
          JS
