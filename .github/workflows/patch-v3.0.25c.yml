name: Patch v3.0.25 Final Source
on:
  push:
    branches: ['codex/v3.0.25-eventstate-storage-health']
    paths: ['.github/workflows/patch-v3.0.25c.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply final source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          def once(text,old,new,label):
              if old not in text: raise SystemExit('missing source marker: '+label)
              return text.replace(old,new,1)

          p=Path('firmware/src/EventState.cpp');s=p.read_text()
          s=once(s,'static constexpr const char* EVENT_STATE_NS = "anderson-evstate";','static constexpr char EVENT_STATE_NS[] = "anderson-evst";\nstatic_assert(sizeof(EVENT_STATE_NS) - 1 <= 15, "NVS namespace must fit 15 characters");','event namespace');p.write_text(s)

          p=Path('firmware/src/main.cpp');s=p.read_text()
          s=once(s,'#include <esp_timer.h>','#include <esp_timer.h>\n#include <nvs_flash.h>','nvs include')
          s=once(s,'static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.0.24";','static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.0.25";','version')
          s=once(s,'// v3.0.20 master calendar migration: replace built-in event/favorite state once while\n// preserving Wi-Fi, BLE, PINs, custom lights, and custom schedules.\n','// Complete the legacy calendar marker without resetting user data.\n// The compiled catalog, eventStateBegin(), and seedMasterSceneFavoritesV4() provide defaults.\n','migration comment')
          s,n=re.subn(r'static bool clearCustomPresetFavorites\(\)\{.*?\n\}\n(?=static bool migrateMasterCalendarV1)', '', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('missing source marker: clearCustomPresetFavorites')
          s=once(s,'  if(!clearCustomPresetFavorites()||!writeMasterFavoriteColors())return false;\n  Preferences ep;if(!ep.begin("anderson-event",false))return false;bool cleared=ep.clear();ep.end();if(!cleared)return false;\n  if(!eventStateResetAll())return false;\n  auto&s=store.get();s.enabledMask=UINT64_MAX;s.favoriteMask=0;s.leadDays=0;s.trailDays=0;s.overlap=0;store.saveAll();\n','  // eventStateBegin() initializes the corrected event-state store before this call.\n  // A failed legacy migration must not erase subsequent event edits or custom favorites.\n  if(!writeMasterFavoriteColors())return false;\n','migration body')
          s=once(s,'static bool storageSelfTest(){Preferences p;if(!p.begin("anderson-test",false))return false;const String t="ANDERSON_STORAGE_OK";size_t n=p.putString("rw",t);String r=p.getString("rw","");p.remove("rw");p.end();return n==t.length()&&r==t;}','''static bool storageReadOnlyHealthCheck(){\n  Preferences p;if(!p.begin("anderson",true))return false;(void)p.getString("tz","");p.end();\n  return jsonArrayValid(presetStoreRaw())&&jsonArrayValid(scheduleStoreRaw());\n}\nstatic bool storageWriteSelfTest(){Preferences p;if(!p.begin("anderson-test",false))return false;const String t="ANDERSON_STORAGE_OK";size_t n=p.putString("rw",t);String r=p.getString("rw","");p.remove("rw");p.end();return n==t.length()&&r==t;}\nstatic bool storageHealthCheck(){\n  const bool readOk=storageReadOnlyHealthCheck();String lastTested;Preferences marker;\n  if(marker.begin("anderson",true)){lastTested=marker.getString("storver","");marker.end();}\n  if(readOk&&lastTested==ANDERSON_FIRMWARE_VERSION)return true;\n  if(!storageWriteSelfTest())return false;\n  if(!marker.begin("anderson",false))return false;const String version=ANDERSON_FIRMWARE_VERSION;size_t wrote=marker.putString("storver",version);String verify=marker.getString("storver","");marker.end();\n  return wrote==version.length()&&verify==version;\n}''','storage health')
          s=once(s,'    if(!d["enabled"].isNull())eventStateSetEnabled(i,d["enabled"].as<bool>());\n    if(!d["favorite"].isNull())eventStateSetFavorite(i,d["favorite"].as<bool>());','    if(!d["enabled"].isNull()&&!eventStateSetEnabled(i,d["enabled"].as<bool>())){\n      server.send(500,"text/plain","Event enabled preference write failed");return;\n    }\n    if(!d["favorite"].isNull()&&!eventStateSetFavorite(i,d["favorite"].as<bool>())){\n      server.send(500,"text/plain","Event favorite preference write failed");return;\n    }','event write errors')
          s=once(s,'d["appFreeBytes"]=slotBytes>appBytes?slotBytes-appBytes:0;','d["appFreeBytes"]=slotBytes>appBytes?slotBytes-appBytes:0;\n  nvs_stats_t nvsStats{};if(nvs_get_stats(nullptr,&nvsStats)==ESP_OK){d["nvsUsedEntries"]=(uint32_t)nvsStats.used_entries;d["nvsFreeEntries"]=(uint32_t)nvsStats.free_entries;d["nvsTotalEntries"]=(uint32_t)nvsStats.total_entries;}\n  d["storageHealth"]=customFsReady?"OK":"Failed";d["storageWriteTestPolicy"]="Firmware upgrade or read failure";','nvs telemetry')
          s=once(s,'customFsReady=storageSelfTest();','customFsReady=storageHealthCheck();','setup storage health')
          p.write_text(s)

          p=Path('firmware/web/index.html');s=p.read_text()
          s=once(s,"async function eventChange(id,change){try{await post('/api/event',{id,...change});await Promise.all([loadEvents(),loadFavorites()]);status('Event preference saved.')}catch(e){status(API_MODE?'Save failed: '+e.message:'Preview mode — preference simulated.')}}","""async function eventChange(id,change){\n  try{\n    await post('/api/event',{id,...change});\n    await Promise.all([loadEvents(),loadFavorites()]);\n    status('Event preference saved.');\n  }catch(e){\n    await Promise.all([loadEvents(),loadFavorites()]);\n    status(API_MODE?'Save failed: '+e.message:'Preview mode — preference simulated.');\n  }\n}""",'eventChange');p.write_text(s)

          Path('FIRMWARE_VERSION.txt').write_text('3.0.25\n')
          Path('firmware/RELEASE_NOTES_v3.0.25.md').write_text('''# Anderson Home v3.0.25\n\n- Repairs built-in event Favorite/Enabled persistence by moving event state to valid NVS namespace `anderson-evst` and adds a compile-time 15-character guard.\n- Makes the pending legacy calendar migration non-destructive: it no longer clears custom favorites, event overrides, event state, or schedule settings.\n- Returns a real HTTP 500 if an event Enabled/Favorite write fails; the UI reloads Events and Home Favorites after a rejected save.\n- Optimizes reboot housekeeping: routine reboots use a read-only storage health check instead of writing/deleting a test key every boot.\n- Runs the NVS write/read/delete self-test only after a firmware-version change or when the read-only check fails, then records the tested version.\n- Adds NVS used/free entry counts and storage-health policy fields to `/api/system`.\n- Preserves the 28 approved Scene Favorites, 210-event calendar, locked 9-color palette, independent Schedule 1/2 controls, all five manual speed choices, Wi-Fi, BLE, PINs, custom lights/schedules, partitions, and signed OTA trust.\n''')
          PY
      - name: Verify
        run: |
          grep -q 'EVENT_STATE_NS\[\] = "anderson-evst"' firmware/src/EventState.cpp
          grep -q 'storageHealthCheck' firmware/src/main.cpp
          grep -q 'Event favorite preference write failed' firmware/src/main.cpp
          grep -q 'nvsFreeEntries' firmware/src/main.cpp
          ! grep -q 'clearCustomPresetFavorites' firmware/src/main.cpp
          grep -q '^3.0.25$' FIRMWARE_VERSION.txt
      - name: Commit
        run: |
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git add firmware/src/EventState.cpp firmware/src/main.cpp firmware/web/index.html FIRMWARE_VERSION.txt firmware/RELEASE_NOTES_v3.0.25.md
          git commit -m 'Repair event persistence and optimize reboot storage checks for v3.0.25'
          git push origin HEAD:codex/v3.0.25-eventstate-storage-health
