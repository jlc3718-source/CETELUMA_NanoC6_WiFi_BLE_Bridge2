name: Patch Anderson v3.1.1 Persistence
on:
  push:
    branches:
      - staging/v3.1.1-persistence
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/v3.1.1-persistence
          fetch-depth: 0
      - name: Apply focused v3.1.1 changes
        run: |
          python tools/patch_v311_persistence.py
          python tools/patch_v311_display_colors.py
      - name: Validate source and rendered UI
        run: |
          python tools/release.py check
          test ! -e firmware/web/v3_hero.b64
          ! grep -R "__V3_HERO_DATA_URI__\|var(--v3-art)\|v3EffectArt" firmware/web tools/release.py
          grep -q 'eventOverrideKey(i,activeEventColorTheme)' firmware/src/main.cpp
          grep -q "reference:'#FFA500',output:'#FF0D00'" firmware/web/index.html
          grep -q "reference:'#FFC0CB',output:'#FF0024'" firmware/web/index.html
      - name: Commit source and remove temporary patch tooling
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-v311-persistence.yml tools/patch_v311_persistence.py tools/patch_v311_display_colors.py
          git add -A
          git commit -m "Fix palette-specific settings persistence in v3.1.1"
          git push origin HEAD:staging/v3.1.1-persistence
