name: Patch Anderson v3.1.1 Persistence
on:
  push:
    branches:
      - staging/v3.1.1-persistence
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/v3.1.1-persistence
          fetch-depth: 0
      - name: Apply palette persistence foundation
        shell: bash
        run: |
          set +e
          output="$(python tools/patch_v311_persistence.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          grep -q "hero sprite references remain in CSS" <<<"$output"
          grep -q 'eventOverrideKey(i,activeEventColorTheme)' firmware/src/main.cpp
      - name: Complete UI and persistence changes
        run: python tools/patch_v311_finish.py
      - name: Validate source and rendered UI
        run: |
          python tools/release.py check
          test ! -e firmware/web/v3_hero.b64
          ! grep -R "__V3_HERO_DATA_URI__\|var(--v3-art)\|v3EffectArt\|v3Scene" firmware/web tools/release.py
          grep -q 'loadEventOverrides();evaluateSchedule(true)' firmware/src/main.cpp
          grep -q "reference:'#FFA500',output:'#FF0D00'" firmware/web/index.html
          grep -q "reference:'#FFC0CB',output:'#FF0024'" firmware/web/index.html
          grep -q "b.textContent=favoriteName(c)" firmware/web/index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('firmware/src/main.cpp').read_text()
          assert 'eventOverrideKey(i);' not in s
          assert 'eventOverrideKey(i,activeEventColorTheme)' in s
          assert 'migrateLegacyEventOverrides();loadEventOverrides();' in s
          ui=Path('firmware/web/index.html').read_text()
          assert "await post('/api/event',{id:ev.id,favorite:false})" in ui
          assert "await post('/api/preset',{id:ev.id,favorite:false})" in ui
          assert "b.className='savedSwatch quickColorTile'" in ui
          assert 'andersonHero' not in ui
          PY
      - name: Commit source and remove temporary patch tooling
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-v311-persistence.yml tools/patch_v311_persistence.py tools/patch_v311_display_colors.py tools/patch_v311_finish.py
          git add -A
          git commit -m "Fix palette-specific settings persistence in v3.1.1"
          git push origin HEAD:staging/v3.1.1-persistence
