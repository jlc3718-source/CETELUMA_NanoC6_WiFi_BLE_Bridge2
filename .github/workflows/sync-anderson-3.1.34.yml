name: Patch Anderson 3.1.37 Intensity Face

on:
  push:
    branches: ['codex/release-current']
    paths: ['.github/trigger-sync-3.1.34.txt']

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make intensity face visibly follow slider
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = '3.1.36'
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.36"' firmware/src/main.cpp
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('firmware/web/v3_mockup.js')
          s=p.read_text()
          pattern=r'const applyBrightnessLook=e=>\{.*?\};const applyBrightnessValue='
          replacement='''const applyBrightnessLook=e=>{const t=Math.max(0,Math.min(100,e))/100,visual=Math.pow(t,1.05),lerp=(e,a)=>Math.round(e+(a-e)*visual),base=[lerp(6,224),lerp(14,235),lerp(31,252)],highlight=[lerp(13,255),lerp(31,255),lerp(61,255)],accent=[lerp(42,52),lerp(82,108),lerp(165,235)],rgb=e=>`rgb(${e[0]} ${e[1]} ${e[2]})`,linear=e=>{const t=e/255;return t<=.04045?t/12.92:Math.pow((t+.055)/1.055,2.4)},lum=.2126*linear(base[0])+.7152*linear(base[1])+.0722*linear(base[2]),lightText=lum<.48,text=lightText?"#f8fbff":"#102b54",sub=lightText?"#d8e6ff":"#536b91";f.style.setProperty("--dial-base",rgb(base));f.style.setProperty("--dial-highlight",rgb(highlight));f.style.setProperty("--dial-accent",rgb(accent));f.style.setProperty("--dial-ring-muted",lightText?"#d7e5ff24":"#5477b229");f.style.setProperty("--dial-text",text);f.style.setProperty("--dial-subtext",sub);f.style.setProperty("--dial-text-shadow",lightText?"#000b":"#fff8");f.style.setProperty("--dial-shadow",lightText?"#0009":"#6f85ac30");f.style.setProperty("--dial-upper-shadow",lightText?"#5f7fb344":"#fff9");f.style.setProperty("--dial-inner-highlight",lightText?"#b8d0ff22":"#fff");f.dataset.contrast=lightText?"light":"dark";const slider=byId("homeBrightness");slider&&slider.style.setProperty("background",`linear-gradient(90deg,rgb(6 14 31),rgb(255 255 255))`,`important`)};const applyBrightnessValue='''
          s2,count=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one intensity-face block, found {count}')
          if 'visual=Math.pow(t,1.05)' not in s2 or 'rgb(6 14 31)' not in s2:
              raise SystemExit('intensity face patch verification failed')
          p.write_text(s2)
          PY
          node --check firmware/web/v3_mockup.js
          sed -i 's/ANDERSON_FIRMWARE_VERSION="3\.1\.36"/ANDERSON_FIRMWARE_VERSION="3.1.37"/' firmware/src/main.cpp
          printf '3.1.37\n' > FIRMWARE_VERSION.txt
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.37"' firmware/src/main.cpp
          grep -q 'visual=Math.pow(t,1.05)' firmware/web/v3_mockup.js
      - name: Commit 3.1.37 source and trigger build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf '3.1.37 strong intensity face response run 1\n' > .github/trigger-build.txt
          git add FIRMWARE_VERSION.txt firmware/src/main.cpp firmware/web/v3_mockup.js .github/trigger-build.txt
          git commit -m 'Anderson Home v3.1.37: visible intensity face response'
          git push origin HEAD:refs/heads/codex/release-current
