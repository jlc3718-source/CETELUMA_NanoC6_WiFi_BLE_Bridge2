name: Patch Anderson 3.1.36 Brightness Dial

on:
  push:
    branches: ['codex/release-current']
    paths: ['.github/trigger-sync-3.1.34.txt']

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch brightness dial to follow slider value live
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = '3.1.35'
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.35"' firmware/src/main.cpp
          python - <<'PY'
          from pathlib import Path
          p=Path('firmware/web/v3_mockup.js')
          s=p.read_text()
          old='const sync=()=>{const e=Math.max(0,Math.min(100,parseFloat(h.textContent)||0));f.style.setProperty("--intensity",e),applyBrightnessLook(e),byId("ah27SceneName").textContent=running.name||byId("nowTheme").textContent||"Your lights"};new MutationObserver(sync).observe(h,{childList:!0,subtree:!0,characterData:!0}),byId("homeBrightness")?.addEventListener("input",sync),new MutationObserver(sync).observe(byId("nowTheme"),{childList:!0,subtree:!0,characterData:!0}),sync()'
          new='const applyBrightnessValue=e=>{e=Math.max(0,Math.min(100,Number(e)||0)),f.style.setProperty("--intensity",e),applyBrightnessLook(e),byId("ah27SceneName").textContent=running.name||byId("nowTheme").textContent||"Your lights"},sync=()=>applyBrightnessValue(parseFloat(h.textContent)||parseFloat(byId("homeBrightness")?.value)||0),syncSlider=()=>{const e=Math.max(0,Math.min(100,parseFloat(byId("homeBrightness")?.value)||0));h.textContent=`${Math.round(e)}%`,applyBrightnessValue(e)};new MutationObserver(sync).observe(h,{childList:!0,subtree:!0,characterData:!0}),byId("homeBrightness")?.addEventListener("input",syncSlider),byId("homeBrightness")?.addEventListener("change",syncSlider),new MutationObserver(sync).observe(byId("nowTheme"),{childList:!0,subtree:!0,characterData:!0}),syncSlider()'
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one brightness sync block, found {count}')
          s=s.replace(old,new,1)
          if 'addEventListener("input",syncSlider)' not in s or 'parseFloat(byId("homeBrightness")?.value)' not in s:
              raise SystemExit('live brightness slider patch verification failed')
          p.write_text(s)
          PY
          node --check firmware/web/v3_mockup.js
          sed -i 's/ANDERSON_FIRMWARE_VERSION="3\.1\.35"/ANDERSON_FIRMWARE_VERSION="3.1.36"/' firmware/src/main.cpp
          printf '3.1.36\n' > FIRMWARE_VERSION.txt
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.36"' firmware/src/main.cpp
          grep -q 'addEventListener("input",syncSlider)' firmware/web/v3_mockup.js
      - name: Commit 3.1.36 source and trigger build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf '3.1.36 brightness dial live run 1\n' > .github/trigger-build.txt
          git add FIRMWARE_VERSION.txt firmware/src/main.cpp firmware/web/v3_mockup.js .github/trigger-build.txt
          git commit -m 'Anderson Home v3.1.36: live brightness dial response'
          git push origin HEAD:refs/heads/codex/release-current
