name: Sync Anderson 3.1.34 Source

on:
  push:
    branches: ['codex/release-current']
    paths: ['.github/trigger-sync-3.1.34.txt']

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify 3.1.34 source payload
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprcentralus.oaiusercontent.com/files/00000000-4ca0-81f5-9615-1c7012aa5256/raw?se=2026-09-15T00%3A29%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=a2063a5e-466b-5ee9-b100-27a6ae2ed062&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T18%3A52%3A50Z&ske=2026-09-15T18%3A52%3A50Z&sks=b&skv=2026-02-06&sig=KDAwDYqwwuJCP1uUJjK0LHTLIE4lkKQlYdEfJGFfw9c%3D'
          curl --fail --location --retry 2 --connect-timeout 15 "$URL" -o /tmp/anderson-3.1.34-payload.zip
          echo 'b9e701170ce71eb74b5b3e7d29210c256e461f8a767bb23061ffd167bc1cac18  /tmp/anderson-3.1.34-payload.zip' | sha256sum -c -
          unzip -oq /tmp/anderson-3.1.34-payload.zip -d .
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = '3.1.34'
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.34"' firmware/src/main.cpp
          grep -q 'speedGlyphs=.*🐌.*🐢.*🚲.*🐇.*🚀' firmware/web/v3_mockup.js
          grep -q 'applyBrightnessLook' firmware/web/v3_mockup.js
      - name: Commit exact 3.1.34 source and trigger GitHub build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf '3.1.34\n' > .github/trigger-build.txt
          git add FIRMWARE_VERSION.txt firmware/src/main.cpp firmware/web/index.html firmware/web/v3_mockup.js firmware/web/v3_mockup.css tools/test_regressions.py tools/test_audit_fixes.py tools/test_connection_recovery.py .github/trigger-build.txt
          git commit -m 'Anderson Home v3.1.34: responsive brightness control'
          git push origin HEAD:refs/heads/codex/release-current
