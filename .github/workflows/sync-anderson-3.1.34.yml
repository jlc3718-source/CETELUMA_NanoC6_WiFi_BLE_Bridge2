name: Sync Anderson 3.1.35 Source

on:
  push:
    branches: ['codex/release-current']
    paths: ['.github/trigger-sync-3.1.34.txt']

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reindex current 3.1.34 source to 3.1.35
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = '3.1.35'
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.34"' firmware/src/main.cpp
          grep -q 'applyBrightnessLook' firmware/web/v3_mockup.js
          grep -q 'homeBrightness' firmware/web/v3_mockup.js
          sed -i 's/ANDERSON_FIRMWARE_VERSION="3\.1\.34"/ANDERSON_FIRMWARE_VERSION="3.1.35"/' firmware/src/main.cpp
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.35"' firmware/src/main.cpp
      - name: Commit 3.1.35 source and trigger build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf '3.1.35 run 3\n' > .github/trigger-build.txt
          git add FIRMWARE_VERSION.txt firmware/src/main.cpp firmware/web/v3_mockup.js .github/trigger-build.txt
          git commit -m 'Anderson Home v3.1.35: brightness slider release'
          git push origin HEAD:refs/heads/codex/release-current
