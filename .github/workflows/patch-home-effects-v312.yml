name: Patch Anderson Home v3.1.2 effect controls

on:
  push:
    branches:
      - codex/v3.1.2-home-effect-buttons
    paths:
      - .github/workflows/patch-home-effects-v312.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3.1.2-home-effect-buttons
          fetch-depth: 0

      - name: Patch Home effect controls and previews
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('firmware/web/v3_mockup.js')
          text = path.read_text()

          old_anim = (
              '.v3EffectButton[data-effect="Jump"] .v3EffectMini i{animation:v3FxJump 2000ms steps(1,end) infinite}\n'
              '.v3EffectButton[data-effect="Breath"] .v3EffectMini i{animation:v3FxBreath 2000ms ease-in-out infinite;background:#45d9ff;color:#45d9ff}\n'
              '.v3EffectButton[data-effect="Strobe"] .v3EffectMini i{animation:v3FxStrobe 1000ms steps(1,end) infinite;background:#f3fbff;color:#f3fbff}\n'
              '.v3EffectButton[data-effect="Solid"] .v3EffectMini i{background:#45d9ff;color:#45d9ff}\n'
              '@keyframes v3FxJump{0%,24.9%{background:#42d8ff;color:#42d8ff}25%,49.9%{background:#ff4ebd;color:#ff4ebd}50%,74.9%{background:#ffd24a;color:#ffd24a}75%,100%{background:#7cff74;color:#7cff74}}\n'
              '@keyframes v3FxBreath{0%,100%{opacity:.22;filter:brightness(.65)}50%{opacity:1;filter:brightness(1.35)}}\n'
              '@keyframes v3FxStrobe{0%,49.9%{opacity:1}50%,100%{opacity:.08}}20%{background:#7cff74;color:#7cff74}40%{background:#ffd24a;color:#ffd24a}60%{background:#ff4ebd;color:#ff4ebd}80%{background:#7c72ff;color:#7c72ff}100%{background:#42d8ff;color:#42d8ff}}\n'
          )
          new_anim = (
              '.v3EffectButton[data-effect="Jump"] .v3EffectMini i{animation:v3FxJump 1000ms steps(1,end) infinite}\n'
              '.v3EffectButton[data-effect="Jump"] .v3EffectMini i:nth-child(1){background:#42d8ff;color:#42d8ff;animation-delay:0ms}\n'
              '.v3EffectButton[data-effect="Jump"] .v3EffectMini i:nth-child(2){background:#ff4ebd;color:#ff4ebd;animation-delay:-200ms}\n'
              '.v3EffectButton[data-effect="Jump"] .v3EffectMini i:nth-child(3){background:#ffd24a;color:#ffd24a;animation-delay:-400ms}\n'
              '.v3EffectButton[data-effect="Jump"] .v3EffectMini i:nth-child(4){background:#7cff74;color:#7cff74;animation-delay:-600ms}\n'
              '.v3EffectButton[data-effect="Jump"] .v3EffectMini i:nth-child(5){background:#7c72ff;color:#7c72ff;animation-delay:-800ms}\n'
              '.v3EffectButton[data-effect="Breath"] .v3EffectMini i{animation:v3FxBreath 2000ms ease-in-out infinite;background:#45d9ff;color:#45d9ff}\n'
              '.v3EffectButton[data-effect="Strobe"] .v3EffectMini i{animation:v3FxStrobe 1000ms steps(1,end) infinite;background:#f3fbff;color:#f3fbff}\n'
              '.v3EffectButton[data-effect="Solid"] .v3EffectMini i{background:#45d9ff;color:#45d9ff;opacity:1;transform:scale(1)}\n'
              '@keyframes v3FxJump{0%,19.9%{opacity:1;transform:scale(1.12)}20%,100%{opacity:.28;transform:scale(.76)}}\n'
              '@keyframes v3FxBreath{0%,100%{opacity:.22;filter:brightness(.65)}50%{opacity:1;filter:brightness(1.35)}}\n'
              '@keyframes v3FxStrobe{0%,44.9%{opacity:1;filter:brightness(1.4)}45%,100%{opacity:.08;filter:brightness(.55)}}\n'
          )
          old_home = '.v3EffectCard .v3EffectPicker{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:7px}.v3EffectCard .v3EffectButton{min-height:54px;padding:5px 4px;gap:4px}.v3EffectCard .v3EffectButton:last-child{grid-column:1/-1}.v3EffectCard .v3EffectMini{max-width:58px;min-height:18px;padding:4px 5px}.v3EffectCard .v3EffectName{font-size:9px}\n'
          new_home = '.v3EffectCard .v3EffectPicker{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:7px}.v3EffectCard .v3EffectButton{min-height:56px;padding:5px 3px;gap:4px}.v3EffectCard .v3EffectMini{max-width:52px;min-height:18px;padding:4px}.v3EffectCard .v3EffectName{font-size:9px}\n'

          if text.count(old_anim) != 1:
              raise SystemExit('Expected exactly one old effect animation block')
          if text.count(old_home) != 1:
              raise SystemExit('Expected exactly one old Home effect layout block')

          text = text.replace(old_anim, new_anim, 1).replace(old_home, new_home, 1)
          path.write_text(text)

          assert 'v3EffectButton:last-child{grid-column:1/-1}' not in text
          assert 'grid-template-columns:repeat(4,minmax(0,1fr));gap:5px' in text
          assert '@keyframes v3FxStrobe{0%,44.9%' in text
          assert '20%{background:#7cff74' not in text
          PY

      - name: Bump firmware version once
        run: |
          python - <<'PY'
          from pathlib import Path
          version = Path('FIRMWARE_VERSION.txt')
          if version.read_text().strip() != '3.1.1':
              raise SystemExit('Expected v3.1.1 baseline')
          version.write_text('3.1.2\n')
          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('**v3.1.1**', '**v3.1.2**')
          readme.write_text(text)
          PY

      - name: Focused validation
        run: |
          test "$(cat FIRMWARE_VERSION.txt)" = "3.1.2"
          node --check firmware/web/v3_mockup.js
          grep -F 'grid-template-columns:repeat(4,minmax(0,1fr));gap:5px' firmware/web/v3_mockup.js
          grep -F '@keyframes v3FxStrobe{0%,44.9%' firmware/web/v3_mockup.js
          ! grep -F 'v3EffectButton:last-child{grid-column:1/-1}' firmware/web/v3_mockup.js

      - name: Commit clean source change
        run: |
          rm .github/workflows/patch-home-effects-v312.yml
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git add firmware/web/v3_mockup.js FIRMWARE_VERSION.txt README.md .github/workflows/patch-home-effects-v312.yml
          git commit -m 'v3.1.2 fix Home effect buttons and previews'
          git push origin HEAD:codex/v3.1.2-home-effect-buttons

      - name: Dispatch exact firmware build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run compile-anderson-home-multi.yml --ref codex/v3.1.2-home-effect-buttons
