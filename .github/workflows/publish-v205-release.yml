name: Publish Anderson v2.0.5 OTA test release
on:
  push:
    branches: ['codex/publish-anderson-v2-0-5-release']
    paths: ['.github/workflows/publish-v205-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download exact verified branch artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34433017337 --repo "$GITHUB_REPOSITORY" -n Anderson-Home-NanoC6-v2.0.5 -D /tmp/v205
          test -f /tmp/v205/and_2.0.5.bin
          test -f /tmp/v205/release.json
          test "$(jq -r .version /tmp/v205/release.json)" = "2.0.5"
          test "$(jq -r .commit /tmp/v205/release.json)" = "6edd53bc4f115914d45a8c622f2dcebe8e2d5caf"
          test "$(stat -c%s /tmp/v205/and_2.0.5.bin)" = "1794336"
          test "$(sha256sum /tmp/v205/and_2.0.5.bin | awk '{print $1}')" = "8f3cc3b0605b149b26ac2668512db61ea6c916c98032dccd6c67b1c16da854bc"
      - name: Publish stable OTA test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=anderson-v2.0.5
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target 6edd53bc4f115914d45a8c622f2dcebe8e2d5caf --title "Anderson Home v2.0.5" --notes "Version-only end-to-end remote OTA test release for v2.0.4."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" /tmp/v205/and_2.0.5.bin /tmp/v205/release.json --clobber
