name: Prepare Anderson v3.1.4 Audit

on:
  push:
    branches: [codex/release-v3.1.4-audit]
    paths: ['.github/workflows/prepare-v3.1.4-audit.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-v3.1.4-audit
          fetch-depth: 0
      - name: Apply audited v3.1.4 changes
        run: python .github/scripts/prepare_v314.py
      - name: Commit audited source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v3.1.4 harden OTA and streamline release source'
          git push origin HEAD:codex/release-v3.1.4-audit
