name: Apply Anderson v2.0.10 profile removal
on:
  push:
    branches: ['codex/remove-kelly-v2-0-10']
    paths: ['.github/workflows/inventory-kelly-refs.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-kelly-v2-0-10
      - name: Remove third profile and all active code references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          main_path = Path('firmware/src/main.cpp')
          s = main_path.read_text()
          replacements = [
              ('static String shirleyPinSalt,shirleyPinHash,kellyPinSalt,kellyPinHash,jasonPinSalt,jasonPinHash;',
               'static String shirleyPinSalt,shirleyPinHash,jasonPinSalt,jasonPinHash;', 'PIN storage fields'),
              ('static bool kellyPinConfigured(){return pinRecordConfigured(kellyPinSalt,kellyPinHash);}\nstatic bool pinAuthConfigured(){return basePinAuthConfigured()&&kellyPinConfigured();}',
               'static bool pinAuthConfigured(){return basePinAuthConfigured();}', 'PIN configured helpers'),
              ('static uint8_t profileRole(const String& profile){return profile=="jason"?ROLE_ADMIN:((profile=="shirley"||profile=="kelly")?ROLE_USER:ROLE_NONE);}',
               'static uint8_t profileRole(const String& profile){return profile=="jason"?ROLE_ADMIN:(profile=="shirley"?ROLE_USER:ROLE_NONE);}', 'profile role'),
              ('static const char* profileDisplayName(const String& profile){if(profile=="shirley")return "Shirley";if(profile=="kelly")return "Kelly";if(profile=="jason")return "Jason";return "";}',
               'static const char* profileDisplayName(const String& profile){if(profile=="shirley")return "Shirley";if(profile=="jason")return "Jason";return "";}', 'profile display name'),
              ('static bool storePinAuthConfig(bool enabled,const String& ss,const String& sh,const String& ks,const String& kh,const String& js,const String& jh){JsonDocument d;d["version"]=2;d["enabled"]=enabled;d["shirleySalt"]=ss;d["shirleyHash"]=sh;d["kellySalt"]=ks;d["kellyHash"]=kh;d["jasonSalt"]=js;d["jasonHash"]=jh;String raw;serializeJson(d,raw);Preferences p;if(!p.begin("anderson-auth",false))return false;size_t wrote=p.putString("config",raw);String verify=p.getString("config","");p.end();return wrote==raw.length()&&verify==raw;}',
               'static bool storePinAuthConfig(bool enabled,const String& ss,const String& sh,const String& js,const String& jh){JsonDocument d;d["version"]=3;d["enabled"]=enabled;d["shirleySalt"]=ss;d["shirleyHash"]=sh;d["jasonSalt"]=js;d["jasonHash"]=jh;String raw;serializeJson(d,raw);Preferences p;if(!p.begin("anderson-auth",false))return false;size_t wrote=p.putString("config",raw);String verify=p.getString("config","");p.end();return wrote==raw.length()&&verify==raw;}', 'PIN config storage'),
              ('static void loadPinAuthConfig(){Preferences p;if(!p.begin("anderson-auth",true))return;String raw=p.getString("config","");p.end();JsonDocument d;if(!raw.length()||deserializeJson(d,raw))return;shirleyPinSalt=d["shirleySalt"]|String("");shirleyPinHash=d["shirleyHash"]|String("");kellyPinSalt=d["kellySalt"]|String("");kellyPinHash=d["kellyHash"]|String("");jasonPinSalt=d["jasonSalt"]|String("");jasonPinHash=d["jasonHash"]|String("");pinProtectionEnabled=(d["enabled"]|false)&&basePinAuthConfigured();}',
               'static void loadPinAuthConfig(){Preferences p;if(!p.begin("anderson-auth",true))return;String raw=p.getString("config","");p.end();JsonDocument d;if(!raw.length()||deserializeJson(d,raw))return;int schema=d["version"]|0;shirleyPinSalt=d["shirleySalt"]|String("");shirleyPinHash=d["shirleyHash"]|String("");jasonPinSalt=d["jasonSalt"]|String("");jasonPinHash=d["jasonHash"]|String("");pinProtectionEnabled=(d["enabled"]|false)&&basePinAuthConfigured();if(schema<3)storePinAuthConfig(pinProtectionEnabled,shirleyPinSalt,shirleyPinHash,jasonPinSalt,jasonPinHash);}', 'PIN config load/migration'),
              ('static bool configureProfilePins(const String& shirleyPin,const String& kellyPin,const String& jasonPin){if(!fourDigitPin(shirleyPin)||!fourDigitPin(kellyPin)||!fourDigitPin(jasonPin)||shirleyPin==kellyPin||shirleyPin==jasonPin||kellyPin==jasonPin)return false;String ss=randomHex(16),ks=randomHex(16),js=randomHex(16),sh=pinDigest("shirley",shirleyPin,ss),kh=pinDigest("kelly",kellyPin,ks),jh=pinDigest("jason",jasonPin,js);if(sh.length()!=64||kh.length()!=64||jh.length()!=64||!storePinAuthConfig(true,ss,sh,ks,kh,js,jh))return false;shirleyPinSalt=ss;shirleyPinHash=sh;kellyPinSalt=ks;kellyPinHash=kh;jasonPinSalt=js;jasonPinHash=jh;pinProtectionEnabled=true;clearAuthSessions();return true;}',
               'static bool configureProfilePins(const String& shirleyPin,const String& jasonPin){if(!fourDigitPin(shirleyPin)||!fourDigitPin(jasonPin)||shirleyPin==jasonPin)return false;String ss=randomHex(16),js=randomHex(16),sh=pinDigest("shirley",shirleyPin,ss),jh=pinDigest("jason",jasonPin,js);if(sh.length()!=64||jh.length()!=64||!storePinAuthConfig(true,ss,sh,js,jh))return false;shirleyPinSalt=ss;shirleyPinHash=sh;jasonPinSalt=js;jasonPinHash=jh;pinProtectionEnabled=true;clearAuthSessions();return true;}', 'configure PINs'),
              ('static bool disablePinProtection(){if(!basePinAuthConfigured())return false;if(!storePinAuthConfig(false,shirleyPinSalt,shirleyPinHash,kellyPinSalt,kellyPinHash,jasonPinSalt,jasonPinHash))return false;pinProtectionEnabled=false;clearAuthSessions();return true;}',
               'static bool disablePinProtection(){if(!basePinAuthConfigured())return false;if(!storePinAuthConfig(false,shirleyPinSalt,shirleyPinHash,jasonPinSalt,jasonPinHash))return false;pinProtectionEnabled=false;clearAuthSessions();return true;}', 'disable PIN protection'),
              ('static bool verifyProfilePin(const String& profile,const String& pin,uint8_t& role){role=profileRole(profile);if(role==ROLE_NONE||!fourDigitPin(pin))return false;const String& salt=profile=="jason"?jasonPinSalt:(profile=="kelly"?kellyPinSalt:shirleyPinSalt);const String& expected=profile=="jason"?jasonPinHash:(profile=="kelly"?kellyPinHash:shirleyPinHash);return constantTimeEqual(pinDigest(profile,pin,salt),expected);}',
               'static bool verifyProfilePin(const String& profile,const String& pin,uint8_t& role){role=profileRole(profile);if(role==ROLE_NONE||!fourDigitPin(pin))return false;const String& salt=profile=="jason"?jasonPinSalt:shirleyPinSalt;const String& expected=profile=="jason"?jasonPinHash:shirleyPinHash;return constantTimeEqual(pinDigest(profile,pin,salt),expected);}', 'verify profile PIN'),
              ('static String pinAuthStatusJson(){JsonDocument d;String token=server.header(AUTH_HEADER);uint8_t role=pinProtectionEnabled?sessionRoleForToken(token,false):ROLE_NONE;String profile=role!=ROLE_NONE?sessionProfileForToken(token):String("");d["pinEnabled"]=pinProtectionEnabled;d["configured"]=pinAuthConfigured();d["kellyConfigured"]=kellyPinConfigured();d["pinLength"]=4;d["authenticated"]=role!=ROLE_NONE;if(role!=ROLE_NONE){d["role"]=role==ROLE_ADMIN?"admin":"user";d["name"]=profileDisplayName(profile);}String out;serializeJson(d,out);return out;}',
               'static String pinAuthStatusJson(){JsonDocument d;String token=server.header(AUTH_HEADER);uint8_t role=pinProtectionEnabled?sessionRoleForToken(token,false):ROLE_NONE;String profile=role!=ROLE_NONE?sessionProfileForToken(token):String("");d["pinEnabled"]=pinProtectionEnabled;d["configured"]=pinAuthConfigured();d["pinLength"]=4;d["authenticated"]=role!=ROLE_NONE;if(role!=ROLE_NONE){d["role"]=role==ROLE_ADMIN?"admin":"user";d["name"]=profileDisplayName(profile);}String out;serializeJson(d,out);return out;}', 'PIN status JSON'),
              ('    if(role==ROLE_NONE){server.send(400,"application/json","{\\"ok\\":false,\\"error\\":\\"Choose Shirley, Kelly, or Jason\\"}");return;}',
               '    if(role==ROLE_NONE){server.send(400,"application/json","{\\"ok\\":false,\\"error\\":\\"Choose Shirley or Jason\\"}");return;}', 'unlock profile error'),
              ('    if(profile=="kelly"&&!kellyPinConfigured()){server.send(409,"application/json","{\\"ok\\":false,\\"error\\":\\"Jason must configure Kelly\'s PIN in Settings before Kelly can sign in\\"}");return;}\n',
               '', 'third-profile unlock gate'),
              ('    String shirleyPin=d["shirleyPin"]|String(""),kellyPin=d["kellyPin"]|String(""),jasonPin=d["jasonPin"]|String("");if(!fourDigitPin(shirleyPin)||!fourDigitPin(kellyPin)||!fourDigitPin(jasonPin)){server.send(400,"application/json","{\\"ok\\":false,\\"error\\":\\"All three PINs must contain exactly four digits\\"}");return;}if(shirleyPin==kellyPin||shirleyPin==jasonPin||kellyPin==jasonPin){server.send(400,"application/json","{\\"ok\\":false,\\"error\\":\\"Shirley, Kelly, and Jason must use three different PINs\\"}");return;}if(!configureProfilePins(shirleyPin,kellyPin,jasonPin)){server.send(500,"application/json","{\\"ok\\":false,\\"error\\":\\"PINs could not be saved and verified\\"}");return;}JsonDocument out;out["ok"]=true;out["pinEnabled"]=true;out["token"]=issueAuthSession(ROLE_ADMIN,"jason");String json;serializeJson(out,json);sendJson(json);',
               '    String shirleyPin=d["shirleyPin"]|String(""),jasonPin=d["jasonPin"]|String("");if(!fourDigitPin(shirleyPin)||!fourDigitPin(jasonPin)){server.send(400,"application/json","{\\"ok\\":false,\\"error\\":\\"Both PINs must contain exactly four digits\\"}");return;}if(shirleyPin==jasonPin){server.send(400,"application/json","{\\"ok\\":false,\\"error\\":\\"Shirley and Jason must use different PINs\\"}");return;}if(!configureProfilePins(shirleyPin,jasonPin)){server.send(500,"application/json","{\\"ok\\":false,\\"error\\":\\"PINs could not be saved and verified\\"}");return;}JsonDocument out;out["ok"]=true;out["pinEnabled"]=true;out["token"]=issueAuthSession(ROLE_ADMIN,"jason");String json;serializeJson(out,json);sendJson(json);', 'PIN config route'),
          ]
          for old, new, label in replacements:
              s = replace_once(s, old, new, label)
          if 'kelly' in s.lower():
              raise SystemExit('main.cpp still contains removed-profile references')
          main_path.write_text(s)

          web_path = Path('firmware/web/index.html')
          w = web_path.read_text()
          web_replacements = [
              ('.profilePinGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}', '.profilePinGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}', 'PIN grid columns'),
              ('.profileChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}', '.profileChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}', 'profile grid columns'),
              ('body[data-profile="shirley"] .nav,body[data-profile="kelly"] .nav{grid-template-columns:repeat(2,1fr)}', 'body[data-profile="shirley"] .nav{grid-template-columns:repeat(2,1fr)}', 'limited profile nav'),
              ('      <button class="profileChoice" type="button" data-profile="kelly" disabled><span class="profileAvatar">K</span><span class="profileName">Kelly</span><span class="profileAccess">Home &amp; Events</span></button>\n', '', 'profile button'),
              ("  let pinProtectionEnabled=false,kellyPinReady=false,pendingProfile='';", "  let pinProtectionEnabled=false,pendingProfile='';", 'gate variables'),
              ("    try{const response=await fetch('/api/auth/status?gate='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('unavailable');const data=await response.json();pinProtectionEnabled=data.pinEnabled===true;kellyPinReady=data.kellyConfigured===true;status.textContent=note||(pinProtectionEnabled&&!kellyPinReady?'PIN protection is on. Jason must add Kelly’s PIN in Settings.':(pinProtectionEnabled?'Four-digit PIN protection is on.':'PIN protection is off. Jason can configure it in Settings.'));}",
               "    try{const response=await fetch('/api/auth/status?gate='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('unavailable');const data=await response.json();pinProtectionEnabled=data.pinEnabled===true;status.textContent=note||(pinProtectionEnabled?'Four-digit PIN protection is on.':'PIN protection is off. Jason can configure it in Settings.');}", 'gate status success'),
              ("    catch(error){pinProtectionEnabled=location.protocol!=='file:';kellyPinReady=true;status.textContent=note||(pinProtectionEnabled?'PIN status could not be checked. You can retry the PIN.':'Preview mode — PIN protection is simulated as off.');}",
               "    catch(error){pinProtectionEnabled=location.protocol!=='file:';status.textContent=note||(pinProtectionEnabled?'PIN status could not be checked. You can retry the PIN.':'Preview mode — PIN protection is simulated as off.');}", 'gate status failure'),
              ("    document.querySelectorAll('.profileChoice').forEach(button=>button.disabled=button.dataset.profile==='kelly'&&pinProtectionEnabled&&!kellyPinReady);", "    document.querySelectorAll('.profileChoice').forEach(button=>button.disabled=false);", 'gate enable buttons'),
              ("  function showPinPrompt(profile){pendingProfile=profile;const name=profile==='shirley'?'Shirley':(profile==='kelly'?'Kelly':'Jason');byId('profilePinTitle').textContent='Enter '+name+'’s four-digit PIN';byId('profilePin').value='';byId('profilePinError').textContent='';byId('profilePinForm').hidden=false;setTimeout(()=>byId('profilePin').focus(),0)}",
               "  function showPinPrompt(profile){pendingProfile=profile;const name=profile==='shirley'?'Shirley':'Jason';byId('profilePinTitle').textContent='Enter '+name+'’s four-digit PIN';byId('profilePin').value='';byId('profilePinError').textContent='';byId('profilePinForm').hidden=false;setTimeout(()=>byId('profilePin').focus(),0)}", 'PIN prompt name'),
              ("    const limited=profile==='shirley'||profile==='kelly',name=profile==='shirley'?'Shirley':(profile==='kelly'?'Kelly':'Jason'),allowed=limited?['home','events']:['home','lights','events','wifi','settings'];",
               "    const limited=profile==='shirley',name=profile==='shirley'?'Shirley':'Jason',allowed=limited?['home','events']:['home','lights','events','wifi','settings'];", 'profile access routing'),
              ('      <strong>Profile PINs</strong><div class="sub">Set a different four-digit PIN for Shirley, Kelly, and Jason. Existing two-person protection stays active; Kelly remains unavailable until all three PINs are saved.</div>',
               '      <strong>Profile PINs</strong><div class="sub">Set a different four-digit PIN for Shirley and Jason.</div>', 'PIN settings description'),
              ('<div><div class="label">Kelly PIN</div><input id="kellyPinConfig" class="field" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" placeholder="4 digits"><div class="label">Confirm Kelly PIN</div><input id="kellyPinConfirm" class="field" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" placeholder="Repeat 4 digits"></div>', '', 'PIN settings fields'),
              ("['shirleyPinConfig','shirleyPinConfirm','kellyPinConfig','kellyPinConfirm','jasonPinConfig','jasonPinConfirm'].forEach(id=>$(id).addEventListener('input',scrubPinInput));",
               "['shirleyPinConfig','shirleyPinConfirm','jasonPinConfig','jasonPinConfirm'].forEach(id=>$(id).addEventListener('input',scrubPinInput));", 'PIN input listeners'),
              ("async function loadPinSettings(){const meta=$('pinConfigMeta');try{const d=await api('/api/auth/status?settings='+Date.now());meta.innerHTML=d.pinEnabled?(d.kellyConfigured?'<strong>PIN protection is ON</strong><br><span class=\"sub\">Each fresh page load requires that person’s own four-digit PIN.</span>':'<strong>PIN protection is ON for Shirley and Jason</strong><br><span class=\"sub\">Enter all three PINs below to add Kelly securely.</span>'):'<strong>PIN protection is OFF</strong><br><span class=\"sub\">Set all three PINs below when you are ready to turn it on.</span>';$('disablePinConfig').disabled=!d.pinEnabled;$('savePinConfig').textContent=d.pinEnabled?'Change All Three PINs & Keep Enabled':'Save All Three PINs & Enable'}catch(e){meta.textContent=API_MODE?'PIN status unavailable.':'Preview mode — PIN settings require the NanoC6.'}}",
               "async function loadPinSettings(){const meta=$('pinConfigMeta');try{const d=await api('/api/auth/status?settings='+Date.now());meta.innerHTML=d.pinEnabled?'<strong>PIN protection is ON</strong><br><span class=\"sub\">Each fresh page load requires that person’s own four-digit PIN.</span>':'<strong>PIN protection is OFF</strong><br><span class=\"sub\">Set both PINs below when you are ready to turn it on.</span>';$('disablePinConfig').disabled=!d.pinEnabled;$('savePinConfig').textContent=d.pinEnabled?'Change Both PINs & Keep Enabled':'Save Both PINs & Enable'}catch(e){meta.textContent=API_MODE?'PIN status unavailable.':'Preview mode — PIN settings require the NanoC6.'}}", 'load PIN settings'),
              ("$('savePinConfig').addEventListener('click',async()=>{const shirleyPin=$('shirleyPinConfig').value,shirleyConfirm=$('shirleyPinConfirm').value,kellyPin=$('kellyPinConfig').value,kellyConfirm=$('kellyPinConfirm').value,jasonPin=$('jasonPinConfig').value,jasonConfirm=$('jasonPinConfirm').value,pins=[shirleyPin,kellyPin,jasonPin];if(pins.some(pin=>!/^\\d{4}$/.test(pin)))return status('All three profile PINs must contain exactly four digits.');if(shirleyPin!==shirleyConfirm||kellyPin!==kellyConfirm||jasonPin!==jasonConfirm)return status('Each confirmation must match its four-digit PIN.');if(new Set(pins).size!==3)return status('Shirley, Kelly, and Jason must use three different PINs.');$('savePinConfig').disabled=true;try{const d=await post('/api/auth/config',{enabled:true,shirleyPin,kellyPin,jasonPin});if(d.token)window.andersonAuthToken=d.token;['shirleyPinConfig','shirleyPinConfirm','kellyPinConfig','kellyPinConfirm','jasonPinConfig','jasonPinConfirm'].forEach(id=>$(id).value='');await loadPinSettings();status('All three four-digit PINs were saved and verified. PIN protection is now on.')}catch(e){status('PIN setup failed: '+e.message)}finally{$('savePinConfig').disabled=false}});",
               "$('savePinConfig').addEventListener('click',async()=>{const shirleyPin=$('shirleyPinConfig').value,shirleyConfirm=$('shirleyPinConfirm').value,jasonPin=$('jasonPinConfig').value,jasonConfirm=$('jasonPinConfirm').value,pins=[shirleyPin,jasonPin];if(pins.some(pin=>!/^\\d{4}$/.test(pin)))return status('Both profile PINs must contain exactly four digits.');if(shirleyPin!==shirleyConfirm||jasonPin!==jasonConfirm)return status('Each confirmation must match its four-digit PIN.');if(new Set(pins).size!==2)return status('Shirley and Jason must use different PINs.');$('savePinConfig').disabled=true;try{const d=await post('/api/auth/config',{enabled:true,shirleyPin,jasonPin});if(d.token)window.andersonAuthToken=d.token;['shirleyPinConfig','shirleyPinConfirm','jasonPinConfig','jasonPinConfirm'].forEach(id=>$(id).value='');await loadPinSettings();status('Both four-digit PINs were saved and verified. PIN protection is now on.')}catch(e){status('PIN setup failed: '+e.message)}finally{$('savePinConfig').disabled=false}});", 'save PIN settings'),
          ]
          for old, new, label in web_replacements:
              w = replace_once(w, old, new, label)
          if 'kelly' in w.lower():
              raise SystemExit('index.html still contains removed-profile references')
          web_path.write_text(w)

          agents = Path('AGENTS.md')
          a = agents.read_text()
          a = replace_once(a,
              '- Shirley/Kelly/Jason independent PINs, access rules, and protected recovery.',
              '- Shirley/Jason independent PINs, access rules, and protected recovery.',
              'AGENTS profile rule')
          agents.write_text(a)

          readme = Path('README.md')
          r = readme.read_text()
          r = replace_once(r,
              '- Optional, independent four-digit Shirley/Kelly/Jason PINs are verified by the NanoC6 with role-limited API sessions; Shirley and Kelly receive Home/Events access while Jason retains all controls.',
              '- Optional, independent four-digit Shirley/Jason PINs are verified by the NanoC6 with role-limited API sessions; Shirley receives Home/Events access while Jason retains all controls.',
              'README profile description')
          readme.write_text(r)
          PY

          python tools/release.py bump
          python tools/release.py prepare
          ! grep -RniI --exclude-dir=.git --exclude='inventory-kelly-refs.yml' 'kelly' firmware AGENTS.md README.md
          rm .github/workflows/inventory-kelly-refs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Anderson Home v2.0.10: remove third user profile'
          git push origin HEAD:codex/remove-kelly-v2-0-10
