name: Jason Home 2 Oracle Read-Only Readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jason-home-2-oracle-readiness.yml'

permissions:
  contents: read

concurrency:
  group: jason-home-2-oracle-readiness
  cancel-in-progress: true

jobs:
  inspect:
    name: Read-only Oracle host and backup prerequisites
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 5
    steps:
      - name: Inspect availability without printing secrets or changing state
        shell: bash
        run: |
          set -euo pipefail
          echo 'Oracle GitHub runner: AVAILABLE'
          printf 'UTC: '; date -u +'%Y-%m-%d %H:%M:%S'
          for pair in 'controller http://127.0.0.1:8080/api/health' 'gateway http://127.0.0.1:8081/api/health'; do
            service="${pair%% *}"; url="${pair#* }"
            if curl --max-time 8 -fsS "${url}" >/dev/null; then
              printf 'Jason Home 2 %s health: PASS\n' "${service}"
            else
              printf 'Jason Home 2 %s health: NOT AVAILABLE\n' "${service}"
            fi
          done
          for path in \
            /home/ubuntu/repo/JasonHomeServer/data/jason-home.sqlite \
            /home/ubuntu/repo/JasonHomeServer/.env \
            /opt/jason-home-2/private.env \
            /opt/jason-home-2/data \
            /etc/nginx/sites-available/jason-home
          do
            if test -e "${path}"; then
              printf 'Required runtime object exists: %s\n' "${path##*/}"
            else
              printf 'Required runtime object missing/unreadable: %s\n' "${path##*/}"
            fi
          done
          if command -v docker >/dev/null 2>&1; then
            if sudo -n docker ps --format '{{.Names}}' >/dev/null 2>&1; then
              echo 'Docker container management: AVAILABLE'
            else
              echo 'Docker container management: NOT AVAILABLE to runner without intervention'
            fi
          fi
          echo 'Encrypted snapshot prerequisites:'
          if command -v openssl >/dev/null && command -v tar >/dev/null && command -v python3 >/dev/null; then
            echo 'OpenSSL, tar, Python: AVAILABLE'
          else
            echo 'Snapshot prerequisite: MISSING'
          fi
          df -Pm /home/ubuntu | awk 'NR==2 {printf "Oracle root volume available MB: %s\\n",$4}'
          if test -s /home/ubuntu/jh2-private-snapshot/oracle-recovery.tar.gz.aes && test -s /home/ubuntu/jh2-private-snapshot/password.rsa-oaep-sha256.enc && test -s /home/ubuntu/jh2-private-snapshot/SHA256SUMS.txt; then
            echo 'Previously generated encrypted private-runtime snapshot: PRESENT'
            (cd /home/ubuntu/jh2-private-snapshot && sha256sum -c SHA256SUMS.txt >/dev/null) && echo 'Snapshot encrypted-file checksums: PASS' || echo 'Snapshot encrypted-file checksums: FAIL'
          else
            echo 'Previously generated encrypted private-runtime snapshot: NOT FOUND'
          fi
          echo 'Backup helper privilege probes:'
          for item in python3 cp tar chown rm docker; do
            case "$item" in
              python3) if sudo -n python3 -c 'pass' >/dev/null 2>&1; then result=YES; else result=NO; fi ;;
              cp) if sudo -n cp --version >/dev/null 2>&1; then result=YES; else result=NO; fi ;;
              tar) if sudo -n tar --version >/dev/null 2>&1; then result=YES; else result=NO; fi ;;
              chown) if sudo -n chown --version >/dev/null 2>&1; then result=YES; else result=NO; fi ;;
              rm) if sudo -n rm --version >/dev/null 2>&1; then result=YES; else result=NO; fi ;;
              docker) if sudo -n docker ps --format '{{.Names}}' >/dev/null 2>&1; then result=YES; else result=NO; fi ;;
            esac
            printf 'Backup helper privilege: %s %s\\n' "$item" "$result"
          done
          echo 'Read-only audit finished. No tokens, backups, database contents, or environment values were printed.'
