name: Prepare Anderson 3.1.50 Category Color Fix

on:
  push:
    branches: ['codex/release-current']
    paths: ['.github/trigger-3150-color-fix.txt']

permissions:
  contents: write

concurrency:
  group: anderson-3150-color-fix
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bump and validate 3.1.50
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          ver=root/'FIRMWARE_VERSION.txt'
          if ver.read_text().strip()!='3.1.49': raise SystemExit('Expected 3.1.49 baseline')
          ver.write_text('3.1.50\n')
          main=root/'firmware/src/main.cpp'
          text=main.read_text()
          text,n=re.subn(r'static constexpr const char\* ANDERSON_FIRMWARE_VERSION="3\.1\.49";', 'static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.1.50";', text, count=1)
          if n!=1: raise SystemExit('Runtime version marker not found exactly once')
          main.write_text(text)
          readme=root/'README.md'
          if readme.exists():
              r=readme.read_text().replace('**v3.1.49**','**v3.1.50**')
              readme.write_text(r)
          cat=(root/'firmware/src/EventCategories.cpp').read_text()
          colors=re.findall(r'\{"[^"]+",\s*"[^"]+",\s*"(#[0-9A-F]{6})"\}',cat)
          if len(colors)!=15 or len(set(colors))!=15: raise SystemExit(f'Expected 15 unique built-in category colors, got {len(colors)} / {len(set(colors))}')
          js=(root/'firmware/web/event_categories.js').read_text()
          if 'Unchecked to disable category' not in js: raise SystemExit('Category disable title missing')
          if 'color:"#2885C7"' not in js: raise SystemExit('Custom category unique color missing')
          PY
          node --check firmware/web/event_categories.js
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.50"' firmware/src/main.cpp
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = "3.1.50"
          printf '%s\n' 'anderson-home-3.1.50-unique-category-colors' > .github/trigger-build.txt
          git rm .github/workflows/anderson-3150-color-fix.yml .github/trigger-3150-color-fix.txt
      - name: Commit and launch production build
        run: |
          set -euo pipefail
          git config user.name "Anderson Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add FIRMWARE_VERSION.txt firmware/src/main.cpp README.md .github/trigger-build.txt
          git diff --cached --check
          git commit -m "Release Anderson Home 3.1.50 category color fix"
          git push origin HEAD:codex/release-current
