name: Patch v3.0.24 Schedule Page
on:
  push:
    branches: ['codex/v3.0.24-favorites-schedule-controls']
    paths: ['.github/workflows/patch-v3.0.24-schedule-page.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Add direct schedule toggles to Schedules page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firmware/web/index.html')
          s=p.read_text()
          old='''<div class="row between wraprow"><div><strong>Events This Month</strong><div class="sub">Enable events and mark Home favorites.</div></div></div>'''
          new='''<div class="row between wraprow"><div><strong>Events This Month</strong><div class="sub">Enable events and mark Home favorites.</div></div></div>\n      <div class="grid2" style="margin-top:10px"><label class="card row between" style="cursor:pointer"><span><strong>Schedule 1</strong><br><span class="sub">Normal evening schedule</span></span><input id="eventsSchedule1Toggle" type="checkbox" checked aria-label="Enable Schedule 1 from Schedules page"></label><label class="card row between" style="cursor:pointer"><span><strong>Schedule 2</strong><br><span class="sub">30% from Schedule 1 end until dawn</span></span><input id="eventsSchedule2Toggle" type="checkbox" checked aria-label="Enable Schedule 2 from Schedules page"></label></div>'''
          assert old in s
          s=s.replace(old,new,1)
          old_apply='''if(typeof s.settings.scheduler==='boolean')$('eventsMaster').checked=s.settings.scheduler;if(typeof s.settings.scheduler2==='boolean'&&$('schedule2Master'))$('schedule2Master').checked=s.settings.scheduler2;'''
          new_apply='''if(typeof s.settings.scheduler==='boolean'){$('eventsMaster').checked=s.settings.scheduler;if($('eventsSchedule1Toggle'))$('eventsSchedule1Toggle').checked=s.settings.scheduler}if(typeof s.settings.scheduler2==='boolean'&&$('schedule2Master')){$('schedule2Master').checked=s.settings.scheduler2;if($('eventsSchedule2Toggle'))$('eventsSchedule2Toggle').checked=s.settings.scheduler2}'''
          assert old_apply in s
          s=s.replace(old_apply,new_apply,1)
          old_listeners='''$('eventsMaster').addEventListener('change',()=>post('/api/settings',{scheduler:$('eventsMaster').checked}).then(applyState).catch(()=>{}));\n$('schedule2Master').addEventListener('change',()=>post('/api/settings',{scheduler2:$('schedule2Master').checked}).then(applyState).catch(()=>{}));'''
          new_listeners='''$('eventsMaster').addEventListener('change',()=>post('/api/settings',{scheduler:$('eventsMaster').checked}).then(applyState).catch(()=>{}));\n$('schedule2Master').addEventListener('change',()=>post('/api/settings',{scheduler2:$('schedule2Master').checked}).then(applyState).catch(()=>{}));\nif($('eventsSchedule1Toggle'))$('eventsSchedule1Toggle').addEventListener('change',()=>post('/api/settings',{scheduler:$('eventsSchedule1Toggle').checked}).then(applyState).catch(e=>{ $('eventsSchedule1Toggle').checked=$('eventsMaster').checked;status('Schedule 1 change failed: '+e.message)}));\nif($('eventsSchedule2Toggle'))$('eventsSchedule2Toggle').addEventListener('change',()=>post('/api/settings',{scheduler2:$('eventsSchedule2Toggle').checked}).then(applyState).catch(e=>{ $('eventsSchedule2Toggle').checked=$('schedule2Master').checked;status('Schedule 2 change failed: '+e.message)}));'''
          assert old_listeners in s
          s=s.replace(old_listeners,new_listeners,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'eventsSchedule1Toggle' firmware/web/index.html
          grep -q 'eventsSchedule2Toggle' firmware/web/index.html
      - name: Commit
        run: |
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git add firmware/web/index.html
          git commit -m 'Expose independent schedules on Schedules page'
          git push origin HEAD:codex/v3.0.24-favorites-schedule-controls
