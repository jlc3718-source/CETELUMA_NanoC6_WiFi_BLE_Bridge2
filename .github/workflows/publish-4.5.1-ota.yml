name: Publish Anderson Home 4.5.1 OTA

on:
  push:
    branches: ['codex/release-4.5.1']
    paths: ['.github/workflows/publish-4.5.1-ota.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: '34786175237'
      BUILD_SHA: '8a18f2805ef4125a9606ba21352aebcae98189e1'
      VERSION: '4.5.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - name: Download exact verified firmware artifact
        run: gh run download "$BUILD_RUN_ID" --name "Anderson-Home-NanoC6-v$VERSION" --dir release-work
      - name: Independently verify OTA artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('release-work'); v=os.environ['VERSION']; sha=os.environ['BUILD_SHA']
          manifest=json.loads((root/'release.json').read_text())
          binary=root/f'and_{v}.bin'; data=binary.read_bytes(); digest=hashlib.sha256(data).hexdigest()
          assert manifest['version']==v, manifest
          assert manifest['commit']==sha, manifest
          assert manifest['ota_slot_bytes']==0x1E0000
          assert 0 < len(data) < 0x1E0000
          assert data[0]==0xE9
          assert manifest['files'][binary.name]['bytes']==len(data)
          assert manifest['files'][binary.name]['sha256']==digest
          print(f'VERIFIED {binary.name}: {len(data)} bytes SHA256={digest}')
          PY
      - name: Publish GitHub OTA release
        run: |
          TAG="anderson-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "release-work/and_$VERSION.bin" release-work/release.json \
            --target "$BUILD_SHA" \
            --title "Anderson Home v$VERSION" \
            --notes "Verified APP-only OTA release. Restores Save / Restore Custom Settings for custom lights and custom schedules. Wi-Fi credentials and profile PINs are intentionally excluded from backups. Built and packaged by successful workflow run $BUILD_RUN_ID from commit $BUILD_SHA."
      - name: Verify published release bytes
        run: |
          rm -rf public-check && mkdir public-check
          gh release download "anderson-v$VERSION" --pattern "and_$VERSION.bin" --pattern release.json --dir public-check
          cmp "release-work/and_$VERSION.bin" "public-check/and_$VERSION.bin"
          cmp release-work/release.json public-check/release.json
