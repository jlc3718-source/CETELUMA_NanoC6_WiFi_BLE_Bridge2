name: Prepare Anderson Home v2.0.3 signed remote-update check

on:
  push:
    branches: ['codex/anderson-v2-0-3-remote-update']
    paths: ['.github/workflows/v203-remote-update-bootstrap.yml']

permissions:
  contents: write

jobs:
  prepare-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply remote-update foundation
        shell: bash
        run: |
          mkdir -p firmware/include firmware/src remote-update tools
          cat > firmware/include/RemoteUpdate.h <<'EOF'
          #pragma once
          #include <Arduino.h>

          // Read-only signed remote-update discovery. This release never downloads or flashes
          // a remote BIN; it only authenticates the signed manifest and reports availability.
          String remoteUpdateStatusJson(const char* currentVersion);
          String remoteUpdateCheckJson(const char* currentVersion);
          EOF
          sed -i 's/^          //' firmware/include/RemoteUpdate.h

          cat > remote-update/anderson_ota_signing_public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE3Dw/xqxEPbvkJQAcMeZxBAxwujxN
          kuGHPepzClPYMrJ4h5r8iNlyUFpJZcPI/FXe8+atedYKpIZZB5XlOj964Q==
          -----END PUBLIC KEY-----
          EOF
          sed -i 's/^          //' remote-update/anderson_ota_signing_public.pem

          python - <<'PY'
          from pathlib import Path
          remote_cpp = Path('/tmp/RemoteUpdate.cpp')
          remote_cpp.write_text(r'''#include "RemoteUpdate.h"
          #include <ArduinoJson.h>
          #include <HTTPClient.h>
          #include <WiFi.h>
          #include <WiFiClientSecure.h>
          #include <mbedtls/base64.h>
          #include <mbedtls/pk.h>
          #include <mbedtls/sha256.h>
          #include <mbedtls/version.h>

          static constexpr const char* OTA_MANIFEST_URL =
            "https://raw.githubusercontent.com/jlc3718-source/CETELUMA_NanoC6_WiFi_BLE_Bridge2/ota/latest.json";
          static constexpr const char* OTA_RELEASE_PREFIX =
            "https://github.com/jlc3718-source/CETELUMA_NanoC6_WiFi_BLE_Bridge2/releases/download/anderson-v";
          static constexpr size_t OTA_SLOT_BYTES = 0x1E0000;

          // P-256 public key for Anderson OTA manifest signatures. The private key is never
          // stored in firmware or this repository.
          static constexpr const char OTA_PUBLIC_KEY[] = R"KEY(-----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE3Dw/xqxEPbvkJQAcMeZxBAxwujxN
          kuGHPepzClPYMrJ4h5r8iNlyUFpJZcPI/FXe8+atedYKpIZZB5XlOj964Q==
          -----END PUBLIC KEY-----
          )KEY";

          struct RemoteStatus {
            bool checked=false;
            bool ok=false;
            bool signatureValid=false;
            bool updateAvailable=false;
            int httpStatus=0;
            size_t bytes=0;
            String availableVersion;
            String sha256;
            String commit;
            String url;
            String message="Not checked yet";
          };
          static RemoteStatus last;

          static bool allHex(const String& s,size_t expected){
            if(s.length()!=expected)return false;
            for(size_t i=0;i<s.length();i++){
              char c=s[i];
              if(!((c>='0'&&c<='9')||(c>='a'&&c<='f')||(c>='A'&&c<='F')))return false;
            }
            return true;
          }

          struct VersionParts{int major=0,minor=0,patch=0;char suffix=0;bool valid=false;};
          static VersionParts parseVersion(const String& input){
            VersionParts v;String s=input;s.trim();int p1=s.indexOf('.'),p2=p1<0?-1:s.indexOf('.',p1+1);
            if(p1<=0||p2<=p1+1)return v;
            String a=s.substring(0,p1),b=s.substring(p1+1,p2),c=s.substring(p2+1);
            if(c.length()&&c[c.length()-1]>='a'&&c[c.length()-1]<='z'){v.suffix=c[c.length()-1];c.remove(c.length()-1);}
            auto digits=[](const String& x){if(!x.length())return false;for(size_t i=0;i<x.length();i++)if(x[i]<'0'||x[i]>'9')return false;return true;};
            if(!digits(a)||!digits(b)||!digits(c))return v;
            v.major=a.toInt();v.minor=b.toInt();v.patch=c.toInt();v.valid=true;return v;
          }
          static int compareVersion(const String& a,const String& b){
            VersionParts x=parseVersion(a),y=parseVersion(b);if(!x.valid||!y.valid)return 0;
            if(x.major!=y.major)return x.major>y.major?1:-1;if(x.minor!=y.minor)return x.minor>y.minor?1:-1;if(x.patch!=y.patch)return x.patch>y.patch?1:-1;
            if(x.suffix==y.suffix)return 0;if(!x.suffix)return 1;if(!y.suffix)return -1;return x.suffix>y.suffix?1:-1;
          }

          static bool verifySignature(const String& payload,const String& signatureB64){
            uint8_t signature[96];size_t signatureLen=0;
            if(mbedtls_base64_decode(signature,sizeof(signature),&signatureLen,
                (const unsigned char*)signatureB64.c_str(),signatureB64.length())!=0||!signatureLen)return false;
            uint8_t digest[32];
            if(mbedtls_sha256((const unsigned char*)payload.c_str(),payload.length(),digest,0)!=0)return false;
            mbedtls_pk_context pk;mbedtls_pk_init(&pk);
          #if MBEDTLS_VERSION_MAJOR >= 3
            int rc=mbedtls_pk_parse_public_key(&pk,(const unsigned char*)OTA_PUBLIC_KEY,sizeof(OTA_PUBLIC_KEY),nullptr,nullptr);
          #else
            int rc=mbedtls_pk_parse_public_key(&pk,(const unsigned char*)OTA_PUBLIC_KEY,sizeof(OTA_PUBLIC_KEY));
          #endif
            if(rc==0)rc=mbedtls_pk_verify(&pk,MBEDTLS_MD_SHA256,digest,sizeof(digest),signature,signatureLen);
            mbedtls_pk_free(&pk);return rc==0;
          }

          static bool parsePayload(const String& payload,RemoteStatus& out){
            bool gotVersion=false,gotBytes=false,gotSha=false,gotCommit=false,gotUrl=false;
            int start=0;
            while(start<(int)payload.length()){
              int nl=payload.indexOf('\n',start);if(nl<0)nl=payload.length();String line=payload.substring(start,nl);start=nl+1;
              if(!line.length())continue;int eq=line.indexOf('=');if(eq<=0)return false;String key=line.substring(0,eq),value=line.substring(eq+1);
              if(key=="version"&&!gotVersion){out.availableVersion=value;gotVersion=true;}
              else if(key=="bytes"&&!gotBytes){for(size_t i=0;i<value.length();i++)if(value[i]<'0'||value[i]>'9')return false;out.bytes=(size_t)value.toInt();gotBytes=true;}
              else if(key=="sha256"&&!gotSha){out.sha256=value;out.sha256.toLowerCase();gotSha=true;}
              else if(key=="commit"&&!gotCommit){out.commit=value;out.commit.toLowerCase();gotCommit=true;}
              else if(key=="url"&&!gotUrl){out.url=value;gotUrl=true;}
              else return false;
            }
            if(!gotVersion||!gotBytes||!gotSha||!gotCommit||!gotUrl)return false;
            if(!parseVersion(out.availableVersion).valid||out.bytes==0||out.bytes>=OTA_SLOT_BYTES||!allHex(out.sha256,64)||!allHex(out.commit,40))return false;
            String expected=String(OTA_RELEASE_PREFIX)+out.availableVersion+"/and_"+out.availableVersion+".bin";
            return out.url==expected;
          }

          static String statusJson(const char* currentVersion){
            JsonDocument d;d["checked"]=last.checked;d["ok"]=last.ok;d["signatureValid"]=last.signatureValid;d["currentVersion"]=currentVersion;
            d["updateAvailable"]=last.updateAvailable;d["autoInstall"]=false;d["downloadEnabled"]=false;d["manifestUrl"]=OTA_MANIFEST_URL;d["otaSlotBytes"]=OTA_SLOT_BYTES;d["httpStatus"]=last.httpStatus;d["message"]=last.message;
            if(last.availableVersion.length())d["availableVersion"]=last.availableVersion;if(last.bytes)d["bytes"]=(uint32_t)last.bytes;if(last.sha256.length())d["sha256"]=last.sha256;if(last.commit.length())d["commit"]=last.commit;if(last.url.length())d["url"]=last.url;
            String json;serializeJson(d,json);return json;
          }

          String remoteUpdateStatusJson(const char* currentVersion){return statusJson(currentVersion);}

          String remoteUpdateCheckJson(const char* currentVersion){
            last=RemoteStatus();last.checked=true;
            if(WiFi.status()!=WL_CONNECTED){last.message="Wi-Fi is not connected";return statusJson(currentVersion);}
            WiFiClientSecure client;
            // Authenticity and integrity come from the embedded P-256 signing key. The future
            // BIN downloader will likewise require the signed SHA-256 before any OTA write.
            client.setInsecure();
            HTTPClient http;http.setConnectTimeout(6000);http.setTimeout(8000);
            if(!http.begin(client,OTA_MANIFEST_URL)){last.message="Could not open the remote manifest URL";return statusJson(currentVersion);}
            last.httpStatus=http.GET();
            if(last.httpStatus!=HTTP_CODE_OK){last.message=String("Manifest request failed (HTTP ")+String(last.httpStatus)+")";http.end();return statusJson(currentVersion);}
            String body=http.getString();http.end();if(body.length()==0||body.length()>4096){last.message="Remote manifest size is invalid";return statusJson(currentVersion);}
            JsonDocument d;if(deserializeJson(d,body)||!d.is<JsonObject>()||(d["schema"]|0)!=1){last.message="Remote manifest format is invalid";return statusJson(currentVersion);}
            String payload=d["payload"]|String(""),signature=d["signature"]|String("");
            if(!payload.length()||!signature.length()){last.message="Remote manifest is missing its signed payload";return statusJson(currentVersion);}
            last.signatureValid=verifySignature(payload,signature);if(!last.signatureValid){last.message="Remote manifest signature is invalid";return statusJson(currentVersion);}
            if(!parsePayload(payload,last)){last.signatureValid=true;last.message="Signed manifest payload is invalid";return statusJson(currentVersion);}
            int cmp=compareVersion(last.availableVersion,String(currentVersion));last.ok=true;last.updateAvailable=cmp>0;
            if(cmp>0)last.message=String("Verified update available: ")+last.availableVersion+" (download/install disabled in this transitional release)";
            else if(cmp==0)last.message=String("Signed manifest verified. Anderson Home ")+currentVersion+" is current.";
            else last.message=String("Signed manifest verified but advertises older firmware ")+last.availableVersion+"; downgrade is blocked.";
            return statusJson(currentVersion);
          }
          ''')
          text=remote_cpp.read_text()
          lines=text.splitlines();nonempty=[len(x)-len(x.lstrip()) for x in lines if x.strip()];trim=min(nonempty) if nonempty else 0
          Path('firmware/src/RemoteUpdate.cpp').write_text('\n'.join(x[trim:] for x in lines)+'\n')

          sign = r'''#!/usr/bin/env python3
          import argparse, base64, json, subprocess, tempfile
          from pathlib import Path

          ROOT=Path(__file__).resolve().parents[1]
          PUBLIC_KEY=ROOT/'remote-update/anderson_ota_signing_public.pem'

          def is_hex(s,n):
              return len(s)==n and all(c in '0123456789abcdefABCDEF' for c in s)

          def main():
              p=argparse.ArgumentParser()
              p.add_argument('--key',required=True);p.add_argument('--version',required=True)
              p.add_argument('--bytes',required=True,type=int);p.add_argument('--sha256',required=True)
              p.add_argument('--commit',required=True);p.add_argument('--url',required=True);p.add_argument('--output',required=True)
              a=p.parse_args()
              if not is_hex(a.sha256,64) or not is_hex(a.commit,40) or a.bytes<=0 or a.bytes>=0x1E0000: raise SystemExit('Invalid OTA manifest inputs')
              expected=f'https://github.com/jlc3718-source/CETELUMA_NanoC6_WiFi_BLE_Bridge2/releases/download/anderson-v{a.version}/and_{a.version}.bin'
              if a.url!=expected: raise SystemExit('Unexpected OTA release URL')
              payload=(f'version={a.version}\nbytes={a.bytes}\nsha256={a.sha256.lower()}\ncommit={a.commit.lower()}\nurl={a.url}\n')
              key=Path(a.key)
              with tempfile.TemporaryDirectory() as td:
                  t=Path(td);data=t/'payload';sig=t/'sig';derived=t/'pub.pem';data.write_text(payload)
                  subprocess.run(['openssl','dgst','-sha256','-sign',str(key),'-out',str(sig),str(data)],check=True)
                  subprocess.run(['openssl','pkey','-in',str(key),'-pubout','-out',str(derived)],check=True,stdout=subprocess.DEVNULL)
                  if derived.read_text().strip()!=PUBLIC_KEY.read_text().strip(): raise SystemExit('Signing key does not match Anderson OTA public key')
                  subprocess.run(['openssl','dgst','-sha256','-verify',str(PUBLIC_KEY),'-signature',str(sig),str(data)],check=True,stdout=subprocess.DEVNULL)
                  signature=base64.b64encode(sig.read_bytes()).decode()
              Path(a.output).write_text(json.dumps({'schema':1,'payload':payload,'signature':signature},indent=2)+'\n')
          if __name__=='__main__': main()
          '''
          lines=sign.splitlines();nonempty=[len(x)-len(x.lstrip()) for x in lines if x.strip()];trim=min(nonempty)
          Path('tools/sign_ota_manifest.py').write_text('\n'.join(x[trim:] for x in lines)+'\n')

          p=Path('firmware/src/main.cpp');s=p.read_text();inc='#include "PaletteMigration.h"';assert s.count(inc)==1;s=s.replace(inc,inc+'\n#include "RemoteUpdate.h"')
          anchor='  server.on("/api/firmware",HTTP_GET,[]{sendJson(firmwareJson());});';assert s.count(anchor)==1
          routes='''  server.on("/api/remote-update",HTTP_GET,[]{if(!requireAdmin())return;sendJson(remoteUpdateStatusJson(ANDERSON_FIRMWARE_VERSION));});\n  server.on("/api/remote-update/check",HTTP_POST,[]{if(!requireAdmin())return;sendJson(remoteUpdateCheckJson(ANDERSON_FIRMWARE_VERSION));});\n\n'''
          s=s.replace(anchor,routes+anchor);p.write_text(s)

          p=Path('firmware/web/index.html');s=p.read_text()
          anchor='''      <div id="fwMeta" class="card small" style="margin-top:10px">Loading firmware information…</div>\n      <div class="label">App-only firmware BIN</div>'''
          repl='''      <div id="fwMeta" class="card small" style="margin-top:10px">Loading firmware information…</div>\n      <button id="checkRemoteFirmware" class="btn" style="width:100%;margin-top:9px">Check for Remote Update</button>\n      <div id="remoteFwStatus" class="sub" style="margin-top:6px">Signed remote-update discovery is ready. Automatic download and installation are disabled in this transitional release.</div>\n      <div class="label">App-only firmware BIN</div>'''
          assert s.count(anchor)==1;s=s.replace(anchor,repl)
          js="$('uploadFirmware').addEventListener('click',stageFirmware);";assert s.count(js)==1
          remote_js="async function checkRemoteFirmware(){const b=$('checkRemoteFirmware'),out=$('remoteFwStatus');b.disabled=true;out.textContent='Checking the signed Anderson update manifest…';try{const d=await post('/api/remote-update/check',{});if(d.ok&&d.signatureValid){if(d.updateAvailable)out.textContent=`Verified update ${d.availableVersion} is available. Automatic download/install is intentionally disabled in this release.`;else out.textContent=d.message||'Signed manifest verified; this firmware is current.'}else out.textContent=d.message||'Remote-update verification failed.'}catch(e){out.textContent='Remote-update check failed: '+e.message}finally{b.disabled=false}}\n$('checkRemoteFirmware').addEventListener('click',checkRemoteFirmware);\n"
          s=s.replace(js,remote_js+js);p.write_text(s)

          p=Path('.github/workflows/compile-anderson-home-multi.yml');s=p.read_text();assert 'permissions:\n  contents: read' in s;s=s.replace('permissions:\n  contents: read','permissions:\n  contents: write')
          marker='      - name: Save compiled objects for the next revision\n';assert s.count(marker)==1
          publish='''      - name: Publish stable OTA release\n        if: github.event_name == 'push' && github.ref == 'refs/heads/main'\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          TAG="anderson-v${VERSION}"\n          if ! gh release view "$TAG" >/dev/null 2>&1; then\n            gh release create "$TAG" --target "$GITHUB_SHA" --title "Anderson Home v${VERSION}" --notes "Verified APP-only Anderson Home firmware."\n          fi\n          gh release upload "$TAG" "release/and_${VERSION}.bin" "release/release.json" --clobber\n      - name: Publish signed latest manifest\n        if: github.event_name == 'push' && github.ref == 'refs/heads/main'\n        env:\n          GH_TOKEN: ${{ github.token }}\n          OTA_SIGNING_KEY_B64: ${{ secrets.ANDERSON_OTA_SIGNING_KEY_B64 }}\n        run: |\n          if [ -z "$OTA_SIGNING_KEY_B64" ]; then\n            echo "ANDERSON_OTA_SIGNING_KEY_B64 is not configured; stable release published, signed latest.json skipped."\n            exit 0\n          fi\n          echo "$OTA_SIGNING_KEY_B64" | base64 -d > /tmp/anderson-ota-key.pem\n          FILE="release/and_${VERSION}.bin"\n          BYTES=$(stat -c%s "$FILE")\n          SHA256=$(sha256sum "$FILE" | awk '{print $1}')\n          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/anderson-v${VERSION}/and_${VERSION}.bin"\n          python tools/sign_ota_manifest.py --key /tmp/anderson-ota-key.pem --version "$VERSION" --bytes "$BYTES" --sha256 "$SHA256" --commit "$GITHUB_SHA" --url "$URL" --output /tmp/latest.json\n          CONTENT=$(base64 -w0 /tmp/latest.json)\n          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/contents/latest.json?ref=ota" --jq .sha 2>/dev/null || true)\n          if [ -n "$EXISTING" ]; then\n            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/latest.json" -f message="Publish Anderson Home v${VERSION} signed OTA manifest" -f content="$CONTENT" -f branch=ota -f sha="$EXISTING" >/dev/null\n          else\n            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/latest.json" -f message="Publish Anderson Home v${VERSION} signed OTA manifest" -f content="$CONTENT" -f branch=ota >/dev/null\n          fi\n          rm -f /tmp/anderson-ota-key.pem\n'''
          s=s.replace(marker,publish+marker);p.write_text(s)
          PY

          python tools/release.py bump
          test "$(cat FIRMWARE_VERSION.txt)" = "2.0.3"
          python tools/release.py prepare
          python -m py_compile tools/sign_ota_manifest.py
          python - <<'PY'
          from pathlib import Path
          m=Path('firmware/src/main.cpp').read_text();w=Path('firmware/web/index.html').read_text();r=Path('firmware/src/RemoteUpdate.cpp').read_text();y=Path('.github/workflows/compile-anderson-home-multi.yml').read_text()
          assert 'remoteUpdateCheckJson(ANDERSON_FIRMWARE_VERSION)' in m
          assert 'Check for Remote Update' in w and 'automatic download/install is intentionally disabled' in w
          assert 'ota/latest.json' in r and 'downloadEnabled' in r and 'autoInstall' in r
          assert 'ANDERSON_OTA_SIGNING_KEY_B64' in y and 'gh release upload' in y
          assert 'client.setInsecure()' in r and 'mbedtls_pk_verify' in r
          print('Remote-update foundation checks passed')
          PY

      - name: Commit release source
        shell: bash
        run: |
          git config user.name 'jlc3718-source'
          git config user.email 'jlc3718@gmail.com'
          git rm .github/workflows/v203-remote-update-bootstrap.yml
          git add -A
          git commit -m 'Anderson Home v2.0.3 signed remote-update discovery'
          git push origin HEAD:codex/anderson-v2-0-3-remote-update
