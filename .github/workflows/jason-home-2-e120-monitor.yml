name: Jason Home 2 live E120 monitor
on:
  push:
    branches: [jason-home-cloudflare-rebuild]
    paths: ['.github/workflows/jason-home-2-e120-monitor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 3
    steps:
      - name: Start bounded read-only capture or read current samples
        run: |
          python3 - <<'PY'
          import os,json,subprocess,time
          from pathlib import Path
          folder=Path('/tmp/jh2-e120-monitor')
          folder.mkdir(exist_ok=True)
          script=folder/'monitor.py'
          previousScript=script.read_text() if script.exists() else ''
          script.write_text("""import json,time,urllib.request,datetime
          from pathlib import Path
          folder=Path('/tmp/jh2-e120-monitor')
          token=next(line.split('=',1)[1] for line in Path('/home/ubuntu/repo/JasonHomeServer/.env').read_text().splitlines() if line.startswith('JASON_HOME_API_TOKEN='))
          def call(path,data=None):
              payload=None if data is None else json.dumps(data).encode()
              request=urllib.request.Request('http://127.0.0.1:8080'+path,payload,{'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              return json.load(urllib.request.urlopen(request,timeout=15))
          def record(value):
              with (folder/'samples.jsonl').open('a') as output: output.write(json.dumps(value)+'\\n')
          original=json.loads((folder/'session.json').read_text()).get('originalOwner','oracle') if (folder/'session.json').exists() else call('/api/health').get('automationOwner','oracle')
          deadline=time.time()+1800
          (folder/'session.json').write_text(json.dumps({'startedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'endsAt':datetime.datetime.fromtimestamp(deadline,datetime.timezone.utc).isoformat(),'originalOwner':original}))
          try:
              call('/api/automation/ownership',{'owner':'direct'})
              record({'monitor':'started','scheduler':'paused'})
              while time.time()<deadline:
                  for target in ['Pool']:
                      now=datetime.datetime.now(datetime.timezone.utc).isoformat()
                      try:
                          data=call('/api/mqtt-probe',{'target':target})
                          record({'at':now,'target':target,'deviceReported':data.get('deviceReported'),'report':data.get('report')})
                      except Exception as error: record({'at':now,'target':target,'error':str(error)})
                  time.sleep(3)
          finally:
              if original=='oracle':
                  try: call('/api/automation/ownership',{'owner':'oracle'});record({'monitor':'stopped','scheduler':'resumed'})
                  except Exception as error: record({'monitor':'restore-failed','error':str(error)})
          """)
          pidfile=folder/'pid'
          running=False
          if pidfile.exists():
              try: os.kill(int(pidfile.read_text()),0);running=True
              except (ProcessLookupError,ValueError): pass
          if running and "['Pool','House']" in previousScript:
              os.kill(int(pidfile.read_text()),15)
              running=False
          if not running:
              if not (folder/'samples.jsonl').exists(): (folder/'samples.jsonl').write_text('')
              env=dict(os.environ);env['RUNNER_TRACKING_ID']=''
              with (folder/'process.log').open('a') as log:
                  process=subprocess.Popen(['python3',str(script)],env=env,stdin=subprocess.DEVNULL,stdout=log,stderr=log,start_new_session=True)
              pidfile.write_text(str(process.pid))
          time.sleep(10)
          if (folder/'session.json').exists(): print((folder/'session.json').read_text())
          lines=(folder/'samples.jsonl').read_text().splitlines()
          for line in lines[-12:]: print(line)
          assert any('"target"' in line for line in lines),'Monitor has not captured any controller samples'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e120-live-samples
          path: /tmp/jh2-e120-monitor/samples.jsonl
