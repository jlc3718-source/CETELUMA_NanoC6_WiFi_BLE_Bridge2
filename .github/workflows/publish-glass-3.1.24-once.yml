name: Stage Anderson Glass v3.1.24 Once

on:
  push:
    branches: ['codex/publish-glass-3.1.24']

permissions:
  contents: write

jobs:
  stage:
    if: github.event.head_commit.message == 'Stage one-time Anderson v3.1.24 publisher'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/publish-glass-3.1.24
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump only release identity to v3.1.24
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = "3.1.23"
          python tools/release.py bump
          test "$(tr -d '\r\n' < FIRMWARE_VERSION.txt)" = "3.1.24"
          grep -q 'ANDERSON_FIRMWARE_VERSION="3.1.24"' firmware/src/main.cpp
      - name: Remove one-time staging workflow and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-glass-3.1.24-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Anderson Home v3.1.24 glass facelift"
      - name: Promote exact candidate to production release branch
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/codex/publish-glass-3.1.24
          git fetch origin codex/release-current --quiet
          git push --force-with-lease origin HEAD:refs/heads/codex/release-current
