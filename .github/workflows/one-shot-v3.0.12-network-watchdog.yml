name: One-shot Anderson v3.0.12 network watchdog

on:
  push:
    branches: ['codex/v3.0.12-network-watchdog']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3.0.12-network-watchdog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release helper dependencies
        run: python -m pip install -q -r tools/requirements-build.txt
      - name: Bump once and apply watchdog timing changes
        shell: bash
        run: |
          python tools/release.py bump
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          root=Path('.')
          main=root/'firmware/src/main.cpp'
          s=main.read_text()
          s,n=re.subn(r'static constexpr const char\* ANDERSON_FIRMWARE_VERSION="3\.0\.11";', 'static constexpr const char* ANDERSON_FIRMWARE_VERSION="3.0.12";', s, count=1)
          assert n==1
          s,n=re.subn(r'static uint32_t lastWiFiRetry=0;', 'static uint32_t lastWiFiRetry=0,wifiOfflineSince=0;\nstatic bool wifiOfflineTimerStarted=false;\nstatic constexpr uint32_t WIFI_RETRY_INTERVAL_MS=30UL*1000UL;\nstatic constexpr uint32_t WIFI_OFFLINE_REBOOT_MS=10UL*60UL*1000UL;', s, count=1)
          assert n==1
          old=re.search(r'static void maintainWiFiConnection\(\)\{.*?\n\}\nvoid setupRoutes\(\)\{', s, re.S)
          assert old
          replacement='''static void maintainWiFiConnection(){
            if(Update.isRunning()||otaAutoRebootPending)return;
            uint32_t now=millis();
            if(WiFi.status()==WL_CONNECTED){
              wifiOfflineTimerStarted=false;
              if(setupAP&&WiFi.mode(WIFI_STA))setupAP=false;
              if(!wifiWasConnected){
                configTzTime(store.get().tz.c_str(),"pool.ntp.org","time.nist.gov");
                MDNS.end();setupMdns();
              }
              wifiWasConnected=true;return;
            }
            wifiWasConnected=false;
            if(!store.get().ssid.length()){wifiOfflineTimerStarted=false;return;}
            if(!wifiOfflineTimerStarted){wifiOfflineTimerStarted=true;wifiOfflineSince=now;}
            if(WiFi.scanComplete()!=WIFI_SCAN_RUNNING&&(uint32_t)(now-lastWiFiRetry)>=WIFI_RETRY_INTERVAL_MS){
              lastWiFiRetry=now;WiFi.reconnect();
            }
            if((uint32_t)(now-wifiOfflineSince)>=WIFI_OFFLINE_REBOOT_MS){
              delay(40);ESP.restart();
            }
          }
          void setupRoutes(){'''
          s=s[:old.start()]+replacement+s[old.end():]
          s,n=re.subn(r'\n// An uptime timer works without Wi-Fi/NTP and does not write periodic markers to flash\.\nstatic constexpr uint32_t MAINTENANCE_REBOOT_INTERVAL_MS=.*?\n\}\n\nvoid setup\(\)\{', '\nvoid setup(){', s, count=1, flags=re.S)
          assert n==1
          s=s.replace('setupRoutes();server.begin();evaluateSchedule(true);digitalWrite(BLUE_LED,LOW);maintenanceRebootStartedAt=millis();', 'setupRoutes();server.begin();evaluateSchedule(true);digitalWrite(BLUE_LED,LOW);')
          s=s.replace('checkMaintenanceReboot();maintainWiFiConnection();', 'maintainWiFiConnection();')
          assert 'MAINTENANCE_REBOOT_INTERVAL_MS' not in s and 'checkMaintenanceReboot' not in s and 'maintenanceRebootStartedAt' not in s
          main.write_text(s)

          readme=root/'README.md'
          t=readme.read_text()
          old='- While disconnected, retry saved Wi-Fi every 30 minutes; successful recovery closes the setup AP and renews time sync/mDNS. Restart after 1 hour of uptime, deferring during firmware updates. A restart ends PIN sessions and returns manual lighting to the saved schedule.'
          new='- While disconnected with saved credentials, retry Wi-Fi every 30 seconds. If the controller remains continuously offline for 10 minutes despite retries, reboot as a last-resort recovery. Successful recovery cancels the watchdog, closes the setup AP, and renews time sync/mDNS. There is no unconditional maintenance reboot.'
          assert old in t
          readme.write_text(t.replace(old,new))

          agents=root/'AGENTS.md'
          t=agents.read_text()
          old='- Maintenance reboot occurs after every 1 hour of uptime, independently of Wi-Fi/NTP; defer it while a firmware upload or another scheduled reboot is pending. This replaces the old daily 18:00 reboot.\n- While disconnected, retry the saved Wi-Fi network every 30 minutes; stop fallback AP mode and renew NTP/mDNS after reconnection. Preserve saved credentials.'
          new='- Do not use an unconditional maintenance reboot. While saved Wi-Fi credentials exist and the controller is disconnected, retry the saved network every 30 seconds; if it remains continuously offline for 10 minutes despite retries, reboot as a last-resort recovery. Reset the offline watchdog immediately after reconnection.\n- Successful Wi-Fi recovery must stop fallback AP mode and renew NTP/mDNS. Preserve saved credentials. Do not reboot repeatedly when no credentials are configured.'
          assert old in t
          agents.write_text(t.replace(old,new))

          test=root/'tools/test_maintenance.py'
          prior=test.read_text()
          marker='# Test the actual automatic-update loop and monitor countdown with simulated time.\n'
          assert marker in prior
          remote=prior.split(marker,1)[1]
          prefix=textwrap.dedent(r"""# Anderson v3.0.12 network-recovery regression gate.
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          source=(Path(__file__).resolve().parents[1]/'firmware/src/main.cpp').read_text()
          wifi=source[source.index('static void maintainWiFiConnection(){'):source.index('void setupRoutes(){')]
          stubs=r'''
          #include <cstdint>
          #include <string>
          #include <cassert>
          #include <iostream>
          uint32_t tick=0; uint32_t millis(){return tick;} void delay(int){}
          struct {int count=0;void restart(){++count;}} ESP;
          struct {bool busy=false;bool isRunning(){return busy;}} Update;
          constexpr int WL_CONNECTED=3,WIFI_STA=1,WIFI_SCAN_RUNNING=-1;
          struct {int state=0,retries=0,modes=0,scan=-2;int scanComplete(){return scan;}int status(){return state;}bool reconnect(){++retries;return true;}bool mode(int v){assert(v==WIFI_STA);++modes;return true;}} WiFi;
          struct Config{std::string ssid="test",tz="test";};struct {Config cfg;Config& get(){return cfg;}} store;
          struct {int stops=0;void end(){++stops;}} MDNS;
          int timeSyncs=0,mdnsStarts=0;void configTzTime(const char*,const char*,const char*){++timeSyncs;}void setupMdns(){++mdnsStarts;}
          bool otaAutoRebootPending=false,setupAP=false,wifiWasConnected=false;
          uint32_t lastWiFiRetry=0,wifiOfflineSince=0;bool wifiOfflineTimerStarted=false;
          constexpr uint32_t WIFI_RETRY_INTERVAL_MS=30UL*1000UL;
          constexpr uint32_t WIFI_OFFLINE_REBOOT_MS=10UL*60UL*1000UL;
          '''
          tests=r'''
          int main(){
           tick=0;maintainWiFiConnection();assert(wifiOfflineTimerStarted&&wifiOfflineSince==0&&WiFi.retries==0&&ESP.count==0);
           tick=29999;maintainWiFiConnection();assert(WiFi.retries==0&&ESP.count==0);
           tick=30000;maintainWiFiConnection();assert(WiFi.retries==1&&ESP.count==0);
           tick=59999;maintainWiFiConnection();assert(WiFi.retries==1);
           tick=60000;WiFi.scan=WIFI_SCAN_RUNNING;maintainWiFiConnection();assert(WiFi.retries==1&&ESP.count==0);
           WiFi.scan=-2;maintainWiFiConnection();assert(WiFi.retries==2);
           tick=599999;maintainWiFiConnection();assert(ESP.count==0);
           tick=600000;maintainWiFiConnection();assert(ESP.count==1);
           ESP.count=0;WiFi.state=WL_CONNECTED;setupAP=true;maintainWiFiConnection();
           assert(!wifiOfflineTimerStarted&&!setupAP&&wifiWasConnected&&WiFi.modes==1&&timeSyncs==1&&mdnsStarts==1&&MDNS.stops==1);
           maintainWiFiConnection();assert(timeSyncs==1&&mdnsStarts==1);
           WiFi.state=0;tick=700000;lastWiFiRetry=tick;maintainWiFiConnection();assert(wifiOfflineTimerStarted&&wifiOfflineSince==tick&&ESP.count==0);
           tick=729999;maintainWiFiConnection();int before=WiFi.retries;assert(ESP.count==0);
           tick=730000;maintainWiFiConnection();assert(WiFi.retries==before+1&&ESP.count==0);
           store.cfg.ssid="";tick=800000;maintainWiFiConnection();assert(!wifiOfflineTimerStarted&&ESP.count==0);
           store.cfg.ssid="test";Update.busy=true;tick=900000;maintainWiFiConnection();assert(!wifiOfflineTimerStarted&&ESP.count==0);
           Update.busy=false;otaAutoRebootPending=true;maintainWiFiConnection();assert(!wifiOfflineTimerStarted&&ESP.count==0);
           otaAutoRebootPending=false;lastWiFiRetry=UINT32_MAX-1000;wifiOfflineSince=UINT32_MAX-1000;wifiOfflineTimerStarted=true;WiFi.state=0;
           int wrapRetries=WiFi.retries;tick=28998;maintainWiFiConnection();assert(WiFi.retries==wrapRetries&&ESP.count==0);
           tick=28999;maintainWiFiConnection();assert(WiFi.retries==wrapRetries+1&&ESP.count==0);
           lastWiFiRetry=tick;tick=598998;maintainWiFiConnection();assert(ESP.count==0);
           tick=598999;maintainWiFiConnection();assert(ESP.count==1);
           WiFi.state=WL_CONNECTED;maintainWiFiConnection();assert(!wifiOfflineTimerStarted);
           std::cout<<"PASS: 30-second retry cadence, 10-minute continuous-offline watchdog, reconnection reset, no-credentials case, OTA deferral, fallback AP recovery, and timer wraparound\n";
          }
          '''
          with tempfile.TemporaryDirectory() as directory:
              p=Path(directory)/'maintenance.cpp'
              p.write_text(stubs+wifi+tests)
              subprocess.run(['g++','-std=c++17','-Wall','-Wextra','-Werror',str(p),'-o',str(p.with_suffix(''))],check=True)
              subprocess.run([str(p.with_suffix(''))],check=True)

          """)
          test.write_text(prefix+marker+remote)
          PY
      - name: Run focused timing regression tests
        run: python tools/test_maintenance.py
      - name: Commit exact v3.0.12 source revision
        run: |
          git rm .github/workflows/one-shot-v3.0.12-network-watchdog.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add firmware/src/main.cpp tools/test_maintenance.py FIRMWARE_VERSION.txt README.md AGENTS.md
          git commit -m "Apply v3.0.12 Wi-Fi recovery watchdog"
          git push origin HEAD:codex/v3.0.12-network-watchdog
