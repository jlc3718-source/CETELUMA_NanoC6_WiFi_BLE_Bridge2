name: JH2 Nano 2.0.16 Eufy House Garage Shed E10 GATT ON smoke
on:
  push:
    branches: [feature/jh2-nano-eufy-from-2.0.14-20261109]
    paths: ['.github/workflows/jh2-216-eufy-remaining-power-test-20261110.yml']
permissions: {contents: read}
jobs:
  remaining-lights:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Verify 3 remaining Eufy E10 connections and SmartDawn survival
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/jh2-216-eufy-remaining-power-test-20261110.py
          sudo -n python3 .github/scripts/jh2-216-eufy-remaining-power-test-20261110.py
