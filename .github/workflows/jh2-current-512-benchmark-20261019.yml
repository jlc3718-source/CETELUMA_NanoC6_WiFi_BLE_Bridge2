name: Jason Home 2 finite SmolVLM actual pixel calibration
true:
  push:
    branches:
    - codex/jh2-image-model-benchmark-20261019
    paths:
    - .github/workflows/jh2-current-512-benchmark-20261019.yml
permissions:
  contents: read
concurrency:
  group: jason-home-oracle-production
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on:
    - self-hosted
    - Linux
    - ARM64
    - oracle
    - jason-home
    timeout-minutes: 75
    steps:
    - name: Finite pinned local SmolVLM pixel calibration at fixed 2 GiB cap
      shell: bash
      run: "python3 - <<'PYTHON'\n# Finite isolated SmolVLM calibration only; no production routes or device I/O.\nimport hashlib,json,os,pathlib,subprocess,time,urllib.request,threading,uuid\nROOT=pathlib.Path('/opt/jh2-image-benchmark-20261019')\nWORK=ROOT/'vision-runtime';OUT=ROOT/'output'/('smolvlm-calibration-'+os.environ['GITHUB_RUN_ID'])\nMODEL=ROOT/'models'/'smolvlm-500m-calibration'\nREVISION='a7da5b986cb59b408707209984f360a5f4ad7e47'\nIMAGE='sha256:b21fe589dfbe5cc39365d0544b9be3f1f33f55f3c86c87a76ff65a02f8f5848e'\nassert hashlib.sha256((WORK/'package-lock.json').read_bytes()).hexdigest()=='6b2ce9f6efd07c54411897336c77d48d5f82a9b87efa1ffec4fad513e22798ba'\nassert json.loads((WORK/'node_modules'/'@huggingface'/'transformers'/'package.json').read_text())['version']=='3.8.1'\nOUT.mkdir(exist_ok=False);MODEL.mkdir(exist_ok=True)\nimport shutil\nassert shutil.disk_usage(ROOT).free>1600*1024**2,'Insufficient free disk for bounded model evaluation'\nPROBE='\"\"\"Finite read-only Jason Home 2 admin-path discovery. Never prints env values.\\nWrites only a new audit JSON in the existing isolated benchmark output tree.\\nNo workflow dispatch, source export, service mutation or hardware operation.\\n\"\"\"\\nimport argparse,json,os,pathlib,re,subprocess\\nROOT=pathlib.Path(\\'/opt/jh2-image-benchmark-20261019\\')\\nUNIT_MATCH=re.compile(r\\'jason.*dev|oracle.*dev|home.*dev|mcp\\',re.I)\\ndef command(args):\\n try:\\n  r=subprocess.run(args,capture_output=True,text=True,timeout=20)\\n  if r.returncode:return None\\n  if len(r.stdout.encode())>2*1024**2:return None\\n  return r.stdout\\n except (OSError,subprocess.TimeoutExpired):return None\\ndef docker(*args):return command([\\'sudo\\',\\'-n\\',\\'docker\\',*args])\\ndef parse(raw):\\n try:return json.loads(raw) if raw is not None else None\\n except (ValueError,TypeError):return None\\ndef probe():\\n report={\\'scope\\':\\'jason-home-2-web only\\',\\'readOnly\\':True,\\'physicalCommandsSent\\':0}\\n # Read only these four nonsecret values inside the app. Never serialize env.\\n script=\"const p=require(\\'node:path\\'); console.log(JSON.stringify({uid:process.getuid(),gid:process.getgid(),cwd:process.cwd(),dataDir:p.resolve(process.env.JH2_DATA_DIR||\\'./data\\')}))\"\\n runtime=parse(docker(\\'exec\\',\\'jason-home-2-web\\',\\'node\\',\\'-e\\',script))\\n if not isinstance(runtime,dict) or set(runtime)!={\\'uid\\',\\'gid\\',\\'cwd\\',\\'dataDir\\'}:runtime=None\\n report[\\'applicationRuntime\\']=runtime\\n # Docker\\'s template selects only mounts; no Config.Env or full inspection.\\n mounts=parse(docker(\\'inspect\\',\\'jason-home-2-web\\',\\'--format\\',\\'{{json .Mounts}}\\'))\\n selected=None\\n if runtime and isinstance(mounts,list):\\n  target=runtime.get(\\'dataDir\\',\\'\\')\\n  if isinstance(target,str) and target.startswith(\\'/\\'):\\n   candidates=[m for m in mounts if isinstance(m,dict) and isinstance(m.get(\\'Destination\\'),str) and (target==m[\\'Destination\\'] or target.startswith(m[\\'Destination\\'].rstrip(\\'/\\')+\\'/\\'))]\\n   if candidates:\\n    m=max(candidates,key=lambda x:len(x[\\'Destination\\']))\\n    selected={k:m.get(k) for k in (\\'Type\\',\\'Source\\',\\'Destination\\',\\'RW\\')}\\n    source=m.get(\\'Source\\');destination=m.get(\\'Destination\\')\\n    if isinstance(source,str) and source.startswith(\\'/\\'):\\n     selected[\\'resolvedHostDataDir\\']=str(pathlib.Path(source)/target[len(destination):].lstrip(\\'/\\'))\\n report[\\'dataMount\\']=selected\\n info=parse(docker(\\'inspect\\',\\'jason-home-2-web\\',\\'--format\\',\\'{\"configuredUser\":{{json .Config.User}},\"imageId\":{{json .Image}}}\\'))\\n report[\\'applicationContainer\\']=info if isinstance(info,dict) and set(info)=={\\'configuredUser\\',\\'imageId\\'} else None\\n # Metadata contains the already benchmarked fixed image tag; expose no other keys.\\n setup_file=ROOT/\\'runtime-lean/runtime_current_result.json\\'\\n try:\\n  if setup_file.is_symlink() or setup_file.stat().st_size>1024*1024:raise ValueError()\\n  setup=json.loads(setup_file.read_text());tag=setup.get(\\'image\\')\\n  if not isinstance(tag,str) or len(tag)>200 or not re.fullmatch(r\\'[A-Za-z0-9_./:@-]+\\',tag):raise ValueError()\\n  image_id=docker(\\'image\\',\\'inspect\\',tag,\\'--format\\',\\'{{.Id}}\\')\\n  report[\\'cachedNativeRuntime\\']={\\'tag\\':tag,\\'imageId\\':image_id.strip() if image_id and re.fullmatch(r\\'sha256:[0-9a-f]{64}\\\\s*\\',image_id) else None}\\n except (OSError,ValueError,TypeError):report[\\'cachedNativeRuntime\\']=None\\n # Discover unit names only. FragmentPath is useful for a subsequent narrowly\\n # authorized review; never request ExecStart/environment or cat the unit.\\n listing=command([\\'systemctl\\',\\'list-unit-files\\',\\'--type=service\\',\\'--no-legend\\',\\'--no-pager\\'])\\n units=[]\\n if listing:\\n  for line in listing.splitlines():\\n   name=line.split()[0] if line.split() else \\'\\'\\n   if not re.fullmatch(r\\'[A-Za-z0-9_.@:-]+\\\\.service\\',name) or not UNIT_MATCH.search(name):continue\\n   fragment=command([\\'systemctl\\',\\'show\\',name,\\'--property=FragmentPath\\',\\'--value\\',\\'--no-pager\\'])\\n   value=fragment.strip() if fragment else None\\n   if value and (not value.startswith(\\'/\\') or \\'\\\\n\\' in value):value=None\\n   units.append({\\'unit\\':name,\\'fragmentPath\\':value})\\n report[\\'possibleDevelopmentServices\\']=units\\n # Deliberately omit optional ExecStart parsing: no raw command is requested,\\n # and no guessed filesystem locations or secret-bearing files are inspected.\\n return report\\ndef main():\\n p=argparse.ArgumentParser();p.add_argument(\\'--output\\',required=True);args=p.parse_args();output=pathlib.Path(args.output)\\n allowed=ROOT/\\'output\\'\\n if not output.is_absolute() or output.resolve()!=output or allowed not in output.parents or output.suffix!=\\'.json\\':raise ValueError(\\'New JSON output must be inside the isolated benchmark output tree\\')\\n # Parent must already be provisioned by the benchmark, and cannot be symlinked.\\n if not output.parent.is_dir() or any(x.is_symlink() for x in (output,*output.parents)):raise ValueError(\\'Existing canonical output directory required\\')\\n result=probe();raw=json.dumps(result,indent=2,allow_nan=False).encode()\\n fd=os.open(output,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\\n with os.fdopen(fd,\\'wb\\') as f:f.write(raw)\\n print(json.dumps({\\'ok\\':True,\\'auditWritten\\':True,\\'scope\\':\\'Jason Home 2 read-only metadata\\',\\'physicalCommandsSent\\':0}))\\nif __name__==\\'__main__\\':main()\\n'\nprobe_namespace={'__name__':'jh2_readonly_probe'}\nexec(compile(PROBE,'jh2_readonly_probe','exec'),probe_namespace)\n(OUT/'oracle_readonly_probe.json').write_text(json.dumps(probe_namespace['probe'](),indent=2))\nSOURCE=\"/** Finite actual local pixel-inference calibration experiment; no auto acceptance. */\\nimport fs from 'node:fs/promises';\\nimport {createHash} from 'node:crypto';\\nimport {performance} from 'node:perf_hooks';\\nimport {Idefics3ForConditionalGeneration,AutoProcessor,RawImage,env} from '@huggingface/transformers';\\nconst digest=b=>createHash('sha256').update(b).digest('hex');\\nconst cases=JSON.parse(await fs.readFile('/workspace/smolvlm-calibration-cases.json','utf8'));\\nconst item=cases.find(c=>c.id===process.argv[2]);if(!item)throw Error('Unknown finite calibration case');\\nconst modelManifest=JSON.parse(await fs.readFile('/model/model_manifest.json','utf8'));\\nif(modelManifest.modelRevision!=='a7da5b986cb59b408707209984f360a5f4ad7e47')throw Error('Unexpected pinned model revision');\\nconst started=performance.now(),out='/output/'+item.id+'.json';\\nlet image,sourceSha;\\nif(item.rgbaBase64){\\n const rgba=Buffer.from(item.rgbaBase64,'base64');if(rgba.length!==item.width*item.height*4||digest(rgba)!==item.rgbaSha256)throw Error('Embedded actual rendered RGBA hash mismatch');\\n image=new RawImage(new Uint8ClampedArray(rgba),item.width,item.height,4).rgb();sourceSha=item.sourceImageSha256;\\n}else{\\n const filename='/input/'+item.hostRelativePath;\\n const bytes=await fs.readFile(filename);sourceSha=digest(bytes);if(sourceSha!==item.sourceImageSha256)throw Error('Retained actual source PNG hash mismatch');\\n image=(await RawImage.read(filename)).rgb();\\n}\\nenv.allowRemoteModels=false;env.allowLocalModels=true;env.backends.onnx.wasm.numThreads=1;\\nconst report={case:item.id,sourceImageSha256:sourceSha,sourceRGBAHash:item.rgbaSha256||null,sourceSize:image.size,\\n model:modelManifest.model,modelRevision:modelManifest.modelRevision,modelFiles:modelManifest.files,\\n library:'@huggingface/transformers@3.8.1',device:'cpu',dtype:'q8',intraOpThreads:1,interOpThreads:1,\\n doImageSplitting:false,maxNewTokens:80,doSample:false,numBeams:1,answers:[],\\n semanticAcceptance:'REQUIRES_MANUAL_CALIBRATION',productionIntegrated:false,physicalCommandsSent:0};\\nawait fs.writeFile(out,JSON.stringify(report,null,2));\\nlet model;\\ntry{\\n model=await Idefics3ForConditionalGeneration.from_pretrained('/model',{local_files_only:true,dtype:'q8',device:'cpu',session_options:{intraOpNumThreads:1,interOpNumThreads:1,executionMode:'sequential'}});\\n const processor=await AutoProcessor.from_pretrained('/model',{local_files_only:true});\\n // Avoid the official default 2048-pixel preprocessing and 17 square patches.\\n // Both properties are present in the pinned JS image-processor constructor.\\n processor.image_processor.size={longest_edge:512};\\n processor.image_processor.do_image_splitting=false;\\n report.loadSeconds=(performance.now()-started)/1000;\\n for(const question of ['Describe exactly what is visibly present in this image: the main subjects, their colors, visible body parts, and any clothing or held objects. State uncertainty instead of guessing.',item.question]){\\n  const messages=[{role:'user',content:[{type:'image'},{type:'text',text:question}]}];\\n  const prompt=processor.apply_chat_template(messages,{add_generation_prompt:true,tokenize:false});\\n  const begin=performance.now(),inputs=await processor(prompt,image,{do_image_splitting:false});\\n  if(JSON.stringify(inputs.pixel_values.dims)!=='[1,1,3,512,512]')throw Error('Unsafe unexpected image-patch dimensions '+JSON.stringify(inputs.pixel_values.dims));\\n  const inputTokens=inputs.input_ids.dims.at(-1);\\n  const outputs=await model.generate({...inputs,max_new_tokens:80,do_sample:false,num_beams:1});\\n  const outputIds=outputs.tolist()[0],generatedIds=outputIds.slice(inputTokens);\\n  const rawAnswer=processor.decode(generatedIds,{skip_special_tokens:false}),answer=processor.decode(generatedIds,{skip_special_tokens:true});\\n  const row={question,prompt,inputTokens,pixelValuesDimensions:inputs.pixel_values.dims,pixelAttentionDimensions:inputs.pixel_attention_mask?.dims,\\n   generatedTokens:generatedIds.length,generatedTokenIds:generatedIds.map(String),rawAnswer,answer,seconds:(performance.now()-begin)/1000};\\n  report.answers.push(row);report.wallSeconds=(performance.now()-started)/1000;\\n  await fs.writeFile(out,JSON.stringify(report,null,2));\\n  console.log('SMOLVLM_ACTUAL_ANSWER '+JSON.stringify({case:item.id,...row}));\\n }\\n report.completed=true;\\n}catch(error){report.completed=false;report.error=String(error.stack||error);throw error;}\\nfinally{\\n if(model)await model.dispose();\\n report.wallSeconds=(performance.now()-started)/1000;await fs.writeFile(out,JSON.stringify(report,null,2));\\n}\\n\"\nCASES=[{'id': 'processed_blue_ghost_40', 'width': 40, 'height': 40, 'rgbaBase64': '', 'rgbaSha256': 'e5bff4569f9f1503451df3f0f5621a1f7629b37dfa794c889c29a3da46c64b80', 'sourceImageSha256': '701e4e51033fbffa70020e948d3645b0f12f855d5798292a8664fe835b4ca17b', 'question': 'What color is the main body? Describe its visible eyes and mouth. State if details are unclear.'}, {'id': 'source_white_ghost_512', 'hostRelativePath': 'sd-turbo-q8-cartoon-512/ghost_sd_turbo_q8_cartoon_512.png', 'sourceImageSha256': '521b7132c3b19957bc33db890cb27341210ce9d2258ed43962bf337c9228d9cf', 'question': 'What color is the main body? Describe its visible eyes and mouth. State if details are unclear.'}, {'id': 'axolotl_missing_coat', 'hostRelativePath': 'q8-regression/axolotl/axolotl.png', 'sourceImageSha256': 'f87a2918e5ab95303dfbceab0e4e74c073ff9301c179a44b04e152f7ddda8bc5', 'question': 'Describe the visible animal anatomy and any clothing. If no clothing is visible, say no clothing. Do not infer hidden details.'}, {'id': 'cat_cauldron_failed_layout', 'hostRelativePath': 'q8-regression/cat_cauldron/cat_cauldron.png', 'sourceImageSha256': '5a8a9555e43e865f58084775735c9990eaccc74c3c3c24da8bc6575f446e660f', 'question': 'List visible objects and their colors. Is the animal inside a vessel, beside a vessel, or separate from it? Describe any visible headwear.'}, {'id': 'processed_bunny_40', 'width': 40, 'height': 40, 'rgbaBase64': '', 'rgbaSha256': 'c8e0c723231a440be1db6460d5bdd5a2c360a9a4f992da734ab6c40853ab9c38', 'sourceImageSha256': '025b02812564a183718044a8ee3e3a076e1681e015ca6e871b6cf17169b0ec6a', 'question': 'Describe the visible subject, its ears, limbs, face, and colors. State which details are unclear.'}, {'id': 'red_panda_missing_can', 'hostRelativePath': 'q8-regression/red_panda/red_panda.png', 'sourceImageSha256': '51d92cb4e2b16cf3efc55851f802585bed2cf18087b9d3fa52d6c5f0d91896cb', 'question': 'Describe the visible animal, tail, and anything it is holding. If no hand-held object is visible, say none. Do not invent hidden items.'}]\nFILES=[{'file': 'config.json', 'size': 7339, 'sha256': 'daacbbca6af3c34e50466c72aed2df4553a08084f6a0551d4ae420a241cb66c6'}, {'file': 'generation_config.json', 'size': 136, 'sha256': '067a2a54e5f87162ecac6e0e911cc4665fc8f7f3324794ecbac0f76badb56636'}, {'file': 'preprocessor_config.json', 'size': 486, 'sha256': '6cb6e36d6fcb88ca1502c4a26750715dc3e7dedddc9a8f17b27d8d167d1457e7'}, {'file': 'processor_config.json', 'size': 68, 'sha256': 'e7bff42da73ae9eec9042ef20e066e11f1ee20f025358ff79131e3c0fb549b46'}, {'file': 'tokenizer.json', 'size': 3548256, 'sha256': '5ece781dc8d2b2f3e2f289ca0ae50b17cfc27dd27bfe7971bb8241e0b964331a'}, {'file': 'tokenizer_config.json', 'size': 28249, 'sha256': '36c6fd44d07d10fd8180ee6b46dcccf69fb7c06753968ff0d7e17b8bfe17b777'}, {'file': 'special_tokens_map.json', 'size': 1069, 'sha256': 'aa0ff906077086dfa9734a7f97f68c825877a48f9468807be65504495cdeef09'}, {'file': 'README.md', 'size': 9918, 'sha256': '8465c1a46b0db5d5d0d0945df04032d1b405bb2fa12cdab3da1652bd75fca4b9'}, {'file': 'onnx/decoder_model_merged_quantized.onnx', 'size': 365039089, 'sha256': '69f48213b59637eee88e2b1af3c6bb23677fce77774a7237e8c1516c6b78ce47'}, {'file': 'onnx/embed_tokens_quantized.onnx', 'size': 47309344, 'sha256': 'f5f14887bf9b756d9fff2e412d474f0b5403e91f33b23460c9411f0ca54d945b'}, {'file': 'onnx/vision_encoder_quantized.onnx', 'size': 98966563, 'sha256': '0612873758c96d759910a45dddbd150ea26d40cffb1ae49f391ea39dcbf50c09'}]\n\ndef sha(path):\n h=hashlib.sha256()\n with path.open('rb') as f:\n  for b in iter(lambda:f.read(4*1024**2),b''):h.update(b)\n return h.hexdigest()\ndef available():return int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))*1024\ndef docker(*args):return subprocess.run(['sudo','-n','docker',*args],capture_output=True,text=True,timeout=30)\nassert docker('image','inspect',IMAGE).returncode==0,'Existing pinned Node image unavailable; do not pull a replacement'\nstarted=time.monotonic();stop=threading.Event();guard_reason=[];health=[];minimum=[available()]\ndef check_guard():\n memory=available();minimum[0]=min(minimum[0],memory)\n try:\n  with urllib.request.urlopen('http://127.0.0.1:8081/api/health',timeout=3) as response:ok=json.load(response).get('ok') is True\n except Exception:ok=False\n health.append({'elapsedSeconds':time.monotonic()-started,'ok':ok,'hostAvailableBytes':memory})\n if not ok:guard_reason.append('application_health_guard');stop.set()\n elif memory<750*1024**2:guard_reason.append('host_headroom_guard');stop.set()\n elif time.monotonic()-started>4200:guard_reason.append('global_time_guard');stop.set()\ndef health_loop():\n while not stop.wait(20):check_guard()\ncheck_guard();assert not stop.is_set(),'Initial health/headroom guard failed'\nassert available()>=2300*1024**2,'Need 2300 MiB available before calibration startup'\nmonitor=threading.Thread(target=health_loop,daemon=True);monitor.start()\nreport={'model':'HuggingFaceTB/SmolVLM-500M-Instruct','modelRevision':REVISION,'license':'Apache-2.0','runtimeImageId':IMAGE,'packageLockSha256':'6b2ce9f6efd07c54411897336c77d48d5f82a9b87efa1ffec4fad513e22798ba','memoryCapBytes':2048*1024**2,'memorySwapCapBytes':2048*1024**2,'cpuCap':.85,'maxNewTokens':80,'cases':[],'productionIntegrated':False,'physicalCommandsSent':0,'semanticAcceptance':'REQUIRES_MANUAL_CALIBRATION'}\ndef save_report():\n report.update(wallSeconds=time.monotonic()-started,healthSamples=health,minHostAvailableBytes=minimum[0],guardReasons=guard_reason)\n (OUT/'host_smolvlm_calibration_results.json').write_text(json.dumps(report,indent=2))\ntry:\n for item in FILES:\n  if stop.is_set():raise RuntimeError('Health/headroom guard stopped model preparation')\n  dest=MODEL/item['file'];dest.parent.mkdir(exist_ok=True)\n  if dest.is_file() and dest.stat().st_size==item['size'] and sha(dest)==item['sha256']:continue\n  temporary=dest.with_name(dest.name+'.'+uuid.uuid4().hex+'.part')\n  try:\n   request=urllib.request.Request('https://huggingface.co/HuggingFaceTB/SmolVLM-500M-Instruct/resolve/'+REVISION+'/'+item['file'],headers={'User-Agent':'JasonHome2-finite-local-calibration'})\n   with urllib.request.urlopen(request,timeout=20) as response,temporary.open('xb') as output:\n    count=0\n    while True:\n     if stop.is_set():raise RuntimeError('Health/headroom guard stopped model download')\n     chunk=response.read(1024**2)\n     if not chunk:break\n     output.write(chunk);count+=len(chunk)\n     if count>item['size']:raise RuntimeError('Pinned model file exceeds expected size')\n   assert temporary.stat().st_size==item['size'] and sha(temporary)==item['sha256'],'Pinned file checksum mismatch: '+item['file']\n   temporary.replace(dest)\n  finally:\n   if temporary.exists():temporary.unlink()\n with urllib.request.urlopen('https://www.apache.org/licenses/LICENSE-2.0.txt',timeout=20) as response:license_bytes=response.read(20001)\n assert len(license_bytes)<=20000 and b'Apache License' in license_bytes and b'Version 2.0' in license_bytes and b'END OF TERMS AND CONDITIONS' in license_bytes\n (MODEL/'APACHE_LICENSE.txt').write_bytes(license_bytes);(OUT/'APACHE_LICENSE.txt').write_bytes(license_bytes)\n assert 'license: apache-2.0' in (MODEL/'README.md').read_text(),'Pinned model-card Apache license declaration missing'\n model_manifest={'model':report['model'],'modelRevision':REVISION,'license':'Apache-2.0','licenseEvidence':{'file':'README.md','sha256':next(f['sha256'] for f in FILES if f['file']=='README.md'),'declaration':'license: apache-2.0'},'licenseTextSha256':hashlib.sha256(license_bytes).hexdigest(),'licenseTextSource':'https://www.apache.org/licenses/LICENSE-2.0.txt','files':FILES,'downloadedFrom':'official pinned HuggingFaceTB model repository'}\n (MODEL/'model_manifest.json').write_text(json.dumps(model_manifest,indent=2));(OUT/'model_manifest.json').write_text(json.dumps(model_manifest,indent=2))\n (WORK/'smolvlm-calibration.mjs').write_text(SOURCE);(WORK/'smolvlm-calibration-cases.json').write_text(json.dumps(CASES))\n for case in CASES:\n  if stop.is_set():raise RuntimeError('Health/headroom guard stopped calibration')\n  assert available()>=2300*1024**2,'Need 2300 MiB available before each new model process'\n  if 'hostRelativePath' in case:assert sha(ROOT/'output'/case['hostRelativePath'])==case['sourceImageSha256'],'Source hash mismatch'\n  name='jh2-smolvlm-calibration-'+case['id'];assert docker('inspect',name).returncode!=0,'Pre-existing container; do not modify it'\n  common=['--network','none','--read-only','--cap-drop','ALL','--security-opt','no-new-privileges','--user',str(os.getuid())+':'+str(os.getgid()),'--cpus=0.85','--cpu-shares=128','--memory=2048m','--memory-swap=2048m','--pids-limit=128','--tmpfs','/tmp:rw,nosuid,size=128m','--mount','type=bind,source='+str(WORK)+',target=/workspace,readonly','--workdir','/workspace','--mount','type=bind,source='+str(MODEL)+',target=/model,readonly','--mount','type=bind,source='+str(ROOT/'output')+',target=/input,readonly','--mount','type=bind,source='+str(OUT)+',target=/output']\n  result=docker('create','--name',name,*common,IMAGE,'node','smolvlm-calibration.mjs',case['id']);assert result.returncode==0,result.stderr\n  begin=time.monotonic();peak=0;cg=None;reason=None\n  try:\n   result=docker('start',name);assert result.returncode==0,result.stderr\n   while True:\n    state=json.loads(docker('inspect',name,'--format','{{json .State}}').stdout)\n    if cg:\n     try:peak=max(peak,int((cg/'memory.peak').read_text()))\n     except (OSError,ValueError):pass\n    if not state['Running']:break\n    if cg is None:\n     try:\n      line=next(l for l in pathlib.Path('/proc/'+str(state['Pid'])+'/cgroup').read_text().splitlines() if l.startswith('0::'));cg=pathlib.Path('/sys/fs/cgroup')/line[3:].lstrip('/')\n     except (OSError,StopIteration):pass\n    memory=available();minimum[0]=min(minimum[0],memory)\n    if memory<750*1024**2:guard_reason.append('host_headroom_guard');stop.set()\n    if stop.is_set():reason=guard_reason[-1] if guard_reason else 'guard_stop'\n    elif time.monotonic()-begin>600:reason='per_case_600_second_limit'\n    if reason:\n     docker('stop','--time','5',name)\n     state=json.loads(docker('inspect',name,'--format','{{json .State}}').stdout);break\n    time.sleep(.4)\n   logs=docker('logs',name);(OUT/(case['id']+'.log')).write_text(logs.stdout+logs.stderr)\n   row={'case':case['id'],'wallSeconds':time.monotonic()-begin,'peakMemoryBytes':peak,'exitCode':state['ExitCode'],'oomKilled':state['OOMKilled'],'stopReason':reason,'memoryCapBytes':2048*1024**2,'sourceImageSha256':case['sourceImageSha256']}\n   report['cases'].append(row);save_report();print('SMOLVLM_HOST_CASE '+json.dumps(row),flush=True);print((logs.stdout+logs.stderr)[-8000:],flush=True)\n   if state['OOMKilled']:raise RuntimeError('SmolVLM exceeded fixed 2 GiB cap; do not raise cap or retry automatically')\n   if state['ExitCode']!=0 or reason:raise RuntimeError('Finite SmolVLM case failed; no automatic retries/cap changes')\n  finally:\n   current=docker('inspect',name,'--format','{{.State.Running}}')\n   if current.returncode==0 and current.stdout.strip()=='true':docker('stop','--time','5',name)\n   if current.returncode==0:docker('rm',name)\n report['completed']=True\nexcept Exception as error:\n report['completed']=False;report['error']=str(error);raise\nfinally:\n stop.set();monitor.join(timeout=4);save_report();print('SMOLVLM_CALIBRATION_HOST '+json.dumps(report),flush=True)\n\nPYTHON\n"
