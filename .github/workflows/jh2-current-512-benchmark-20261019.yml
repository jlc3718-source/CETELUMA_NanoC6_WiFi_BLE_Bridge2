bject identity and source provenance required');\\n const objectArea=objectMask.reduce((n,v)=>n+(v>=128),0);if(objectArea<width*height*.01||objectArea>width*height*.85)fail('Object mask size rejected');\\n const corrected=tintNeutral(image,objectMask,requestedBodyRGB),body=shrink(corrected.pixels,objectMask,width,height),parts=[],evidence=[];\\n for(const group of featureGroups){\\n  if(group.role!=='eyes')fail('Only a reviewed eye-group refinement is implemented');\\n  if(!(group.mask instanceof Uint8Array)||group.mask.length!==objectMask.length)fail('Invalid feature mask');\\n  const area=group.mask.reduce((n,v)=>n+(v>=128),0);let inside=0;\\n  for(let i=0;i<objectMask.length;i++)if(group.mask[i]>=128&&objectMask[i]>=128)inside++;\\n  if(area<8||area>objectArea*.2||inside/area<.97)fail('Feature group is not a localized subset of its semantic object');\\n  const all=components(group.mask,width,height),smallLimit=Math.max(4,Math.round(width*height*.00002));\\n  const found=all.filter(p=>p.length>=smallLimit).map(p=>({pixels:p,bbox:box(p,width)})).sort((a,b)=>a.bbox.x-b.bbox.x);\\n  if(found.length!==2)fail('Reviewed eye group must contain exactly two separate actual pixel regions');\\n  const [a,b]=found;if(a.bbox.x+a.bbox.w>=b.bbox.x||Math.abs((a.bbox.y+a.bbox.h/2)-(b.bbox.y+b.bbox.h/2))>Math.max(a.bbox.h,b.bbox.h))fail('Eye group geometry rejected');\\n  for(let index=0;index<2;index++){\\n   const part=found[index],mask=new Uint8Array(objectMask.length);for(const i of part.pixels)mask[i]=255;\\n   parts.push({id:object.id+'-eye-'+(index?'right':'left'),objectId:object.id,role:'eye-'+(index?'right':'left'),rgba:shrink(corrected.pixels,mask,width,height)});\\n  }\\n  evidence.push({semanticLabel:group.semanticLabel,operation:'split disconnected regions of the real reviewed mask',components:found.map(v=>({pixels:v.pixels.length,bbox:v.bbox}))});\\n }\\n // Fill behind internal movable features from neighboring pixels of the SAME\\n // actual object. Otherwise the original eye remains baked into the body.\\n const occupied=new Uint8Array(1600);for(const p of parts)for(let i=0;i<1600;i++)if(p.rgba[i*4+3])occupied[i]=1;\\n for(const part of parts){const candidates=[[],[],[]];\\n  for(let i=0;i<1600;i++){if(!part.rgba[i*4+3])continue;const x=i%40,y=Math.floor(i/40);\\n   for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=40||Y>=40)continue;const j=Y*40+X,k=j*4;\\n    if(occupied[j]||!body[k+3]||body[k]+body[k+1]+body[k+2]<100)continue;\\n    for(let c=0;c<3;c++)candidates[c].push(body[k+c]);\\n   }\\n  }\\n  if(candidates[0].length<4)fail('Cannot infer a safe body underpaint behind the real internal feature');\\n  const fill=candidates.map(median);for(let i=0;i<1600;i++)if(part.rgba[i*4+3])body.set([...fill,255],i*4);\\n }\\n const layers=[{id:object.id+'-body',objectId:object.id,role:'body',rgba:body},...parts],palette=paletteFor(layers,paletteSize);\\n for(const l of layers)for(let k=0;k<6400;k+=4){if(!l.rgba[k+3])continue;let best=palette[0],distance=Infinity;\\n  for(const c of palette){const d=2*(l.rgba[k]-c[0])**2+4*(l.rgba[k+1]-c[1])**2+3*(l.rgba[k+2]-c[2])**2;if(d<distance){distance=d;best=c;}}\\n  l.rgba.set(best,k);\\n }\\n const scene=validateScene({version:SCENE_VERSION,width:40,height:40,originalPrompt:prompt,objects:[object],layers,background:'#000000',palette,\\n  provenance:{...provenance,maskRefinement:evidence,neutralBodyColorCorrection:{requestedBodyRGB,sourcePixelsChanged:corrected.changed},semanticAcceptance:'REQUIRES_RENDERED_REVIEW'}});\\n return {scene,artwork:composeGroundedScene(scene)};\\n}\\n\\n/** Arrange actual independently grounded raster objects. Layout never invents\\n * subject pixels, anatomy, accessories, or a missing object. */\\nexport function composeGroundedObjects(items,{prompt='',paletteSize=12}={}){\\n if(!Number.isInteger(paletteSize)||paletteSize<2||paletteSize>16)fail('Palette must contain 2\u201316 colors');\\n if(!Array.isArray(items)||!items.length||items.length>4)fail('Scene composition supports 1\u20134 grounded objects');\\n const ids=new Set(),objects=[],layers=[],sources=[];\\n for(const item of items){\\n  const source=validateScene(item.scene),id=String(item.id||''),b=item.box;\\n  if(!/^[\\\\w-]{1,32}$/.test(id)||ids.has(id))fail('Composition requires unique object identities');ids.add(id);\\n  if(!b||!['x','y','w','h'].every(k=>Number.isFinite(b[k]))||b.x<0||b.y<0||b.w<9||b.h<9||b.x+b.w>40||b.y+b.h>40)fail('Grounded object layout is too small or outside the canvas');\\n  if(new Set(source.layers.map(l=>l.objectId)).size!==1)fail('Each composition input must be one independently grounded object');\\n  const left=Math.min(...source.layers.map(l=>l.bbox.x)),top=Math.min(...source.layers.map(l=>l.bbox.y));\\n  const right=Math.max(...source.layers.map(l=>l.bbox.x+l.bbox.w)),bottom=Math.max(...source.layers.map(l=>l.bbox.y+l.bbox.h));\\n  const scale=Math.min(b.w/(right-left),b.h/(bottom-top)),ox=b.x+(b.w-(right-left)*scale)/2,oy=b.y+(b.h-(bottom-top)*scale)/2;\\n  for(let index=0;index<source.layers.length;index++){\\n   const l=source.layers[index],rgba=new Uint8ClampedArray(6400);\\n   for(let y=0;y<40;y++)for(let x=0;x<40;x++){\\n    const x0=Math.max(left,Math.floor(left+(x-ox)/scale)),x1=Math.min(right,Math.ceil(left+(x+1-ox)/scale));\\n    const y0=Math.max(top,Math.floor(top+(y-oy)/scale)),y1=Math.min(bottom,Math.ceil(top+(y+1-oy)/scale));\\n    let n=0,r=0,g=0,blue=0;for(let Y=y0;Y<y1;Y++)for(let X=x0;X<x1;X++){const k=(Y*40+X)*4;if(l.rgba[k+3]<128)continue;n++;r+=l.rgba[k];g+=l.rgba[k+1];blue+=l.rgba[k+2];}\\n    if(n)rgba.set([Math.round(r/n),Math.round(g/n),Math.round(blue/n),255],(y*40+x)*4);\\n   }\\n   layers.push({...l,id:id+'-layer-'+index,objectId:id,rgba,anchor:[ox+(l.anchor[0]-left+.5)*scale-.5,oy+(l.anchor[1]-top+.5)*scale-.5]});\\n  }\\n  objects.push({...(source.objects?.[0]||{}),id,label:String(item.label||source.objects?.[0]?.label||id)});\\n  sources.push({id,sourceProvenance:s