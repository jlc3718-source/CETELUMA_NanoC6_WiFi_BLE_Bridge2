name: Jason Home 2 real Q8 artwork regression
'on':
  push:
    branches:
    - codex/jh2-image-model-benchmark-20261019
    paths:
    - .github/workflows/jh2-current-512-benchmark-20261019.yml
permissions:
  contents: read
concurrency:
  group: jason-home-oracle-production
  cancel-in-progress: false
jobs:
  artwork:
    name: real artwork - ${{ matrix.case.label }}
    runs-on:
    - self-hosted
    - Linux
    - ARM64
    - oracle
    - jason-home
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        case:
        - label: pumpkin
          subject: a scary orange jack-o-lantern with a carved face and yellow flames glowing inside
        - label: cat_cauldron
          subject: a black cat wearing a purple wizard hat beside a separate black cauldron filled with green potion
        - label: bunny
          subject: a cute Easter bunny with long rabbit ears, a rabbit face, short front paws and two back feet
        - label: chicken
          subject: a chicken with a red comb, yellow beak, two wings and two feet
        - label: snowman
          subject: a snowman with three stacked snowballs, a carrot nose and two stick arms
        - label: firework
          subject: a red firework rocket with fins and a burning fuse
        - label: witch
          subject: a witch wearing a purple pointed hat and riding a broom
        - label: cauldron
          subject: a black cauldron filled with bubbling bright green potion
        - label: axolotl
          subject: a turquoise axolotl with feathery external gills wearing a yellow raincoat
        - label: red_panda
          subject: a red panda with a striped tail holding a green watering can
    env:
      JH2_CASE: ${{ toJSON(matrix.case) }}
    steps:
    - name: Generate a real resource-capped 512px image
      shell: bash
      run: "python3 - <<'PYTHON'\n\"\"\"Finite, no-network inference tests. Only new benchmark containers/files are touched.\"\"\"\nimport hashlib,json,os,pathlib,struct,subprocess,time,urllib.request\nROOT=pathlib.Path('/opt/jh2-image-benchmark-20261019')\nsetup=json.loads((ROOT/'runtime-lean'/'runtime_current_result.json').read_text())\nassert setup['returnCode']==0\nassert setup['binarySha256']=='57e173f4562bf5ead34ccb703cae400ab47750f0480d1a2217a389f27262f435'\nimport shutil\nmodel_repo='gpustack/stable-diffusion-v2-1-turbo-GGUF'\nwith urllib.request.urlopen('https://huggingface.co/api/models/'+model_repo+'?blobs=true',timeout=45) as response: metadata=json.load(response)\nrevision=metadata['sha'];assert len(revision)==40 and all(c in '0123456789abcdef' for c in revision)\nfilename='stable-diffusion-v2-1-turbo-Q8_0.gguf'\nentry=next(x for x in metadata['siblings'] if x['rfilename']==filename)\nexpected=entry['lfs']['sha256'];size=entry['lfs']['size']\nassert 1500000000<size<2600000000\nmodel_dir=ROOT/'models'/'sd-turbo-q8';model_dir.mkdir(exist_ok=True)\nassert shutil.disk_usage(ROOT).free>size+3*1024**3,'Insufficient free disk'\nwith urllib.request.urlopen('https://huggingface.co/'+model_repo+'/resolve/'+revision+'/LICENSE.md',timeout=45) as response: license_text=response.read(100000)\nassert b'STABILITY AI COMMUNITY LICENSE AGREEMENT' in license_text and b'Non-Commercial Purpose' in license_text\n(model_dir/'LICENSE.md').write_bytes(license_text)\ndef file_sha(path):\n    h=hashlib.sha256()\n    with path.open('rb') as f:\n        for chunk in iter(lambda:f.read(1024**2),b''):h.update(chunk)\n    return h.hexdigest()\nmodel_file=model_dir/filename\nif not model_file.exists():\n    partial=model_file.with_suffix('.partial')\n    with urllib.request.urlopen('https://huggingface.co/'+model_repo+'/resolve/'+revision+'/'+filename,timeout=120) as response,partial.open('wb') as target:\n        total=0\n        while True:\n            chunk=response.read(1024**2)\n            if not chunk:break\n            total+=len(chunk);assert total<=size\n            target.write(chunk)\n    assert total==size and file_sha(partial)==expected\n    partial.replace(model_file)\nassert model_file.stat().st_size==size and file_sha(model_file)==expected\nmodel={'repository':model_repo,'revision':revision,'file':filename,'sha256':expected,'bytes':size,'license':'Stability AI Community License','upstream':'stabilityai/sd-turbo','use':'personal hobbyist evaluation','productionIntegrated':False}\ncase=json.loads(os.environ['JH2_CASE'])\nOUTPUT=ROOT/'output'/'q8-regression'/case['label']\nOUTPUT.mkdir(parents=True,exist_ok=True)\ndecoder=ROOT/'models'/'taesd-official.safetensors'\nassert hashlib.sha256(decoder.read_bytes()).hexdigest()=='db169d69145ec4ff064e49d99c95fa05d3eb04ee453de35824a6d0f325513549'\ndef docker(*args,**kw):return subprocess.run(['sudo','-n','docker',*args],capture_output=True,text=True,timeout=30,**kw)\ndef memory_available():\n    return int(next(l.split()[1] for l in pathlib.Path('/proc/meminfo').read_text().splitlines() if l.startswith('MemAvailable:')))*1024\ndef cgroup(pid):\n    lines=pathlib.Path('/proc/'+str(pid)+'/cgroup').read_text().splitlines()\n    cg=next(l.split(':',2)[2] for l in lines if l.startswith('0::'))\n    return pathlib.Path('/sys/fs/cgroup')/cg.lstrip('/')\ncase=json.loads(os.environ['JH2_CASE'])\ntests=[(case['label'],512,case['subject'],2,600)]\nreport={'model':model,'runtime':{k:setup[k] for k in ['runtimeRevision','binarySha256','image']},'tests':[],\n        'productionIntegrated':False,'physicalCommandsSent':0,'templatesUsed':False}\nfor label,res,subject,steps,timeout in tests:\n    if memory_available()<2600*1024**2:\n        report['tests'].append({'label':label,'status':'not_run','reason':'Insufficient headroom while preserving running applications'});break\n    name='jh2-image-current-'+label.replace('_','-')\n    assert docker('inspect',name).returncode!=0,'Existing test container must not be overwritten'\n    prompt='A flat 2D cartoon illustration of '+subject+', full body, centered alone on a plain black background, clean silhouette, simple solid colors, no text, no border'\n    args=['create','--name',name,'--network','none','--read-only','--cap-drop','ALL','--security-opt','no-new-privileges',\n          '--user',str(os.getuid())+':'+str(os.getgid()),'--cpus=0.85','--cpu-shares=128','--memory=3072m','--memory-swap=3072m',\n          '--pids-limit=64','--mount','type=bind,source='+str(ROOT/'runtime-lean'/'bin')+',target=/inference-bin,readonly',\n          '--mount','type=bind,source='+str(model_dir)+',target=/models,readonly',\n          '--mount','type=bind,source='+str(ROOT/'models')+',target=/decoder,readonly',\n          '--mount','type=bind,source='+str(OUTPUT)+',target=/output',\n          '--entrypoint','/inference-bin/sd-cli',setup['image'],'--mmap','--diffusion-fa','--diffusion-conv-direct','-m','/models/'+model['file'],\n          '-p',prompt,'--sampling-method','euler','--scheduler','sgm_uniform','--cfg-scale','1','--steps',str(steps),'-t','1',\n          '-W',str(res),'-H',str(res),'--seed','42','--taesd','/decoder/'+decoder.name,'-o','/output/'+label+'.png']\n    assert not (OUTPUT/(label+'.png')).exists(), 'Existing benchmark output must not be reused'\n    created=docker(*args);assert created.returncode==0,created.stderr\n    started=time.monotonic();assert docker('start',name).returncode==0\n    peak=0;cpu=0;minimum=memory_available();cg=None;stopped=None;health_samples=[];next_health=started\n    while True:\n        s=docker('inspect',name,'--format','{{json .State}}');state=json.loads(s.stdout)\n        if not state['Running']:break\n        try:\n            if cg is None and state.get('Pid'):cg=cgroup(state['Pid'])\n            if cg:\n                peak=max(peak,int((cg/'memory.peak').read_text()))\n                stats=dict(l.split() for l in (cg/'cpu.stat').read_text().splitlines());cpu=int(stats['usage_usec'])\n        except (OSError,ValueError):pass\n        if time.monotonic()>=next_health:\n            health_begin=time.monotonic()\n            try:\n                with urllib.request.urlopen('http://127.0.0.1:8081/api/health',timeout=3) as r: health=json.load(r)\n                health_samples.append({'seconds':time.monotonic()-started,'latencySeconds':time.monotonic()-health_begin,'ok':health.get('ok') is True})\n                if health.get('ok') is not True:stopped='application_health_guard'\n            except Exception as error:\n                stopped='application_health_guard';health_samples.append({'seconds':time.monotonic()-started,'ok':False,'error':type(error).__name__})\n            next_health=time.monotonic()+20\n        available=memory_available();minimum=min(minimum,available)\n        if available<750*1024**2:stopped='host_headroom_guard'\n        elif time.monotonic()-started>timeout:stopped='inference_time_limit'\n        if stopped:docker('stop','--time','5',name)\n        time.sleep(.3)\n    elapsed=time.monotonic()-started\n    log=docker('logs',name);(OUTPUT/(label+'.log')).write_text(log.stdout+log.stderr)\n    row={'label':label,'prompt':prompt,'resolution':res,'steps':steps,'wallSeconds':round(elapsed,3),\n         'cpuSeconds':round(cpu/1e6,3),'sampledPeakMemoryBytes':peak,'minHostAvailableBytes':minimum,\n         'exitCode':state['ExitCode'],'oomKilled':state['OOMKilled'],'stopReason':stopped,\n         'applicationHealthSamples':health_samples,'cpuLimit':.85,'memoryLimitBytes':3221225472,'swapBytes':0,'templateFallback':False,'decoder':'taesd'}\n    path=OUTPUT/(label+'.png')\n    if path.exists():\n        b=path.read_bytes();assert b[:8]==b'\\x89PNG\\r\\n\\x1a\\n';width,height=struct.unpack('>II',b[16:24]);assert (width,height)==(res,res)\n        row.update(status='generated_requires_visual_review',file=path.name,bytes=len(b),sha256=hashlib.sha256(b).hexdigest())\n    else:\n        row['status']='failed';row['errorTail']=(log.stdout+log.stderr).splitlines()[-12:]\n    report['tests'].append(row);print('IMAGE_BENCHMARK '+json.dumps(row),flush=True)\n    (OUTPUT/'image_benchmark_results.json').write_text(json.dumps(report,indent=2))\n    assert docker('rm',name).returncode==0\n    if row['status']=='failed':break\ntry:\n    with urllib.request.urlopen('http://127.0.0.1:8081/api/health',timeout=8) as response:report['applicationHealth']=json.load(response)\nexcept Exception as e:report['applicationHealth']={'ok':False,'error':type(e).__name__}\n(OUTPUT/'image_benchmark_results.json').write_text(json.dumps(report,indent=2))\nprint('BENCHMARK_SUMMARY '+json.dumps({'cases':len(report['tests']),'applicationHealth':report['applicationHealth'],'productionIntegrated':False}),flush=True)\nPYTHON"
    - name: Retain actual image and measured result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jh2-real-regression-${{ matrix.case.label }}
        path: /opt/jh2-image-benchmark-20261019/output/q8-regression/${{ matrix.case.label }}/*
        retention-days: 3
        if-no-files-found: warn
