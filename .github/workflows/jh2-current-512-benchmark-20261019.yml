name: Jason Home 2 real generated image grounding check
on:
  push:
    branches: [codex/jh2-image-model-benchmark-20261019]
    paths: ['.github/workflows/jh2-current-512-benchmark-20261019.yml']
permissions: {contents: read}
concurrency: {group: jason-home-oracle-production, cancel-in-progress: false}
jobs:
  benchmark:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 15
    steps:
      - name: Measure actual local segmentation on generated ghost pixels
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,subprocess,time,urllib.request
          ROOT=pathlib.Path('/opt/jh2-image-benchmark-20261019')
          WORK=ROOT/'vision-runtime';OUT=ROOT/'output'/'vision-q8';OUT.mkdir(exist_ok=True)
          SOURCE="/** Isolated pixel-based caption/segmentation experiment; never a production acceptance claim. */\nimport fs from 'node:fs/promises';\nimport path from 'node:path';\nimport {performance} from 'node:perf_hooks';\nimport {Florence2ForConditionalGeneration,AutoProcessor,RawImage,env,cat,ones} from '@huggingface/transformers';\n\nenv.allowRemoteModels=false;\nenv.allowLocalModels=true;\nenv.backends.onnx.wasm.numThreads=1;\nconst modelPath='/vision-model';\nconst output='/output/vision-q8';\nawait fs.mkdir(output,{recursive:true});\nconst started=performance.now();\nconst model=await Florence2ForConditionalGeneration.from_pretrained(modelPath,{\n  local_files_only:true,dtype:'q8',device:'cpu',\n  session_options:{intraOpNumThreads:1,interOpNumThreads:1,executionMode:'sequential'},\n});\nconst processor=await AutoProcessor.from_pretrained(modelPath,{local_files_only:true});\nconst report={model:'onnx-community/Florence-2-base-ft',library:'@huggingface/transformers@3.8.1',\n  loadSeconds:(performance.now()-started)/1000,tests:[],productionIntegrated:false,physicalCommandsSent:0};\n\n// Florence's official processor quantizes coordinates into 1000 bins. The pinned\n// JS processor does not implement polygons, so retain raw tokens and decode only\n// explicitly present coordinate runs. Empty/malformed output remains a failure.\nfunction polygons(text,width,height){\n  const runs=[...text.matchAll(/(?:<loc_\\d+>){6,}/g)];\n  return runs.map(([run])=>{\n    const q=[...run.matchAll(/<loc_(\\d+)>/g)].map(x=>Number(x[1]));\n    if(q.length%2||q.some(x=>x<0||x>999))throw Error('Invalid polygon coordinate tokens');\n    return q.map((v,i)=>(v+.5)/1000*(i%2?height:width));\n  });\n}\n\nfor(const [file,labels] of [['ghost_sd_turbo_q8_cartoon_512.png',['the ghost','the left eye of the ghost','the right eye of the ghost','the mouth of the ghost']]]){\n  const image=await RawImage.read('/input/'+file);\n  const processed=await processor(image);\n  const visionStart=performance.now();\n  const features=await model.encode_image({pixel_values:processed.pixel_values});\n  const imageRow={file,visionSeconds:(performance.now()-visionStart)/1000,results:[]};\n  const tasks=[['<MORE_DETAILED_CAPTION>','',160],...labels.map(x=>['<REFERRING_EXPRESSION_SEGMENTATION>',x,640])];\n  for(const [task,label,max] of tasks){\n    const text=processor.tokenizer(processor.construct_prompts(task+label));\n    const inputs_embeds=cat([features,await model.encode_text({input_ids:text.input_ids})],1);\n    const attention_mask=cat([ones(features.dims.slice(0,2)),text.attention_mask],1);\n    const begin=performance.now();\n    const generated=await model.generate({inputs_embeds,attention_mask,max_new_tokens:max,do_sample:false,num_beams:1});\n    const raw=processor.batch_decode(generated,{skip_special_tokens:false})[0];\n    const row={task,label,seconds:(performance.now()-begin)/1000,raw};\n    if(task.includes('SEGMENTATION')){\n      row.polygons=polygons(raw,...image.size);\n      row.status=row.polygons.length?'polygon_requires_visual_review':'no_polygon';\n    }else row.caption=processor.post_process_generation(raw,task,image.size)[task];\n    imageRow.results.push(row);\n    console.log('VISION_RESULT '+JSON.stringify({file,...row}));\n    report.tests=[...report.tests.filter(x=>x.file!==file),imageRow];\n    await fs.writeFile(path.join(output,'vision_probe_results.json'),JSON.stringify(report,null,2));\n  }\n}\nreport.totalSeconds=(performance.now()-started)/1000;\nawait fs.writeFile(path.join(output,'vision_probe_results.json'),JSON.stringify(report,null,2));\nawait model.dispose();\n"
          (WORK/'probe-q8.mjs').write_text(SOURCE)
          assert hashlib.sha256((ROOT/'output'/'sd-turbo-q8-cartoon-512'/'ghost_sd_turbo_q8_cartoon_512.png').read_bytes()).hexdigest()=='521b7132c3b19957bc33db890cb27341210ce9d2258ed43962bf337c9228d9cf'
          assert hashlib.sha256((WORK/'package-lock.json').read_bytes()).hexdigest()=='6b2ce9f6efd07c54411897336c77d48d5f82a9b87efa1ffec4fad513e22798ba'
          manifest=json.loads((ROOT/'output'/'vision-probe'/'vision_model_manifest.json').read_text())
          image=manifest['runtimeImageId'];assert image=='sha256:b21fe589dfbe5cc39365d0544b9be3f1f33f55f3c86c87a76ff65a02f8f5848e'
          for item in manifest['files']:
           path=ROOT/'models'/'florence-2-base-ft'/item['file']
           assert hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256']
          def docker(*args):return subprocess.run(['sudo','-n','docker',*args],capture_output=True,text=True,timeout=30)
          def available():return int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))*1024
          assert available()>2200*1024**2
          name='jh2-vision-real-q8-20261019';assert docker('inspect',name).returncode!=0
          common=['--network','none','--read-only','--cap-drop','ALL','--security-opt','no-new-privileges','--user',str(os.getuid())+':'+str(os.getgid()),'--cpus=0.85','--cpu-shares=128','--memory=1536m','--memory-swap=1536m','--pids-limit=128','--tmpfs','/tmp:rw,nosuid,size=128m','--mount','type=bind,source='+str(WORK)+',target=/workspace,readonly','--workdir','/workspace','--mount','type=bind,source='+str(ROOT/'models'/'florence-2-base-ft')+',target=/vision-model,readonly','--mount','type=bind,source='+str(ROOT/'output'/'sd-turbo-q8-cartoon-512')+',target=/input,readonly','--mount','type=bind,source='+str(ROOT/'output')+',target=/output']
          created=docker('create','--name',name,*common,image,'node','probe-q8.mjs');assert created.returncode==0,created.stderr
          begin=time.monotonic();reason=None;peak=0;cg=None;minimum=available();health=[];next_health=begin
          try:
           assert docker('start',name).returncode==0
           while True:
            state=json.loads(docker('inspect',name,'--format','{{json .State}}').stdout)
            if not state['Running']:break
            try:
             if cg is None:
              line=next(l for l in pathlib.Path('/proc/'+str(state['Pid'])+'/cgroup').read_text().splitlines() if l.startswith('0::'))
              cg=pathlib.Path('/sys/fs/cgroup')/line[3:].lstrip('/')
             peak=max(peak,int((cg/'memory.peak').read_text()))
            except (OSError,ValueError):pass
            minimum=min(minimum,available())
            if time.monotonic()>=next_health:
             try:
              with urllib.request.urlopen('http://127.0.0.1:8081/api/health',timeout=3) as r:ok=json.load(r).get('ok') is True
             except Exception:ok=False
             health.append({'elapsedSeconds':time.monotonic()-begin,'ok':ok});next_health=time.monotonic()+20
             if not ok:reason='application_health_guard'
            if available()<750*1024**2:reason='host_headroom_guard'
            elif time.monotonic()-begin>600:reason='time_limit'
            if reason:docker('stop','--time','5',name)
            time.sleep(.4)
           log=docker('logs',name);(OUT/'vision-real-q8.log').write_text(log.stdout+log.stderr)
           report={'wallSeconds':time.monotonic()-begin,'peakMemoryBytes':peak,'minHostAvailableBytes':minimum,'exitCode':state['ExitCode'],'oomKilled':state['OOMKilled'],'stopReason':reason,'healthSamples':health,'productionIntegrated':False,'physicalCommandsSent':0,'maskAcceptance':'REQUIRES_RENDERED_REVIEW'}
           (OUT/'host_vision_results.json').write_text(json.dumps(report,indent=2));print('REAL_VISION_RESULT '+json.dumps(report),flush=True)
           print((log.stdout+log.stderr)[-12000:])
           assert state['ExitCode']==0 and not reason
          finally:
           state=docker('inspect',name,'--format','{{.State.Running}}')
           if state.returncode==0 and state.stdout.strip()=='true':docker('stop','--time','5',name)
           if state.returncode==0:docker('rm',name)
          PYTHON
      - name: Retain real vision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jh2-real-q8-vision-20261019
          path: /opt/jh2-image-benchmark-20261019/output/vision-q8/*
          retention-days: 3
          if-no-files-found: warn
