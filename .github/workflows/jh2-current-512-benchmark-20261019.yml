name: Jason Home 2 finite actual file queue and cropped grounding test
'on':
  push:
    branches:
    - codex/jh2-image-model-benchmark-20261019
    paths:
    - .github/workflows/jh2-current-512-benchmark-20261019.yml
permissions:
  contents: read
concurrency:
  group: jason-home-oracle-production
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on:
    - self-hosted
    - Linux
    - ARM64
    - oracle
    - jason-home
    timeout-minutes: 40
    steps:
    - name: Test actual new isolated worker modules and revised sources
      shell: bash
      run: "python3 - <<'PYTHON'\n\"\"\"Finite actual file-queue runtime test. No production edits/services/network.\"\"\"\nimport base64,hashlib,importlib.util,json,os,pathlib,shutil,subprocess,time,uuid,urllib.request\nROOT=pathlib.Path('/opt/jh2-image-benchmark-20261019');RUNTIME=ROOT/'vision-runtime'\nRUN=ROOT/'output'/('worker-e2e-'+str(uuid.uuid4()));RUN.mkdir()\nSPOOL=RUN/'spool';SPOOL.mkdir();SPOOL.chmod(0o2770)\nCONTROL=RUN/'control';CONTROL.mkdir(mode=0o700)\nRESULTS=RUN/'results';RESULTS.mkdir()\nFILES={'native_image_worker.py': '\"\"\"Finite LOCAL image invocation. No downloads, external inference, or app edits.\\nIntended for an administrator-controlled host worker, never Docker access in web.\\nConsumes bounded JSON stdin; creates only UUID-scoped files under isolated root.\\n\"\"\"\\nimport fcntl,hashlib,json,os,pathlib,signal,struct,subprocess,sys,time,urllib.request,uuid\\nROOT=pathlib.Path(\\'/opt/jh2-image-benchmark-20261019\\')\\nMODEL={\\'repository\\':\\'gpustack/stable-diffusion-v2-1-turbo-GGUF\\',\\'revision\\':\\'1316499e70f0adaf26589a8012b26572cb9d13d5\\',\\'file\\':\\'stable-diffusion-v2-1-turbo-Q8_0.gguf\\',\\'sha256\\':\\'b5216f49d888da0e7d33c1c5b0bbb84947c3bd105a7294a56204a910d0c24079\\',\\'bytes\\':2322705024,\\'upstream\\':\\'stabilityai/sd-turbo\\',\\'license\\':\\'Stability AI Community License\\'}\\nBINARY_SHA=\\'57e173f4562bf5ead34ccb703cae400ab47750f0480d1a2217a389f27262f435\\'\\nDECODER_SHA=\\'db169d69145ec4ff064e49d99c95fa05d3eb04ee453de35824a6d0f325513549\\'\\ndef digest(p):\\n h=hashlib.sha256()\\n with p.open(\\'rb\\') as f:\\n  for b in iter(lambda:f.read(1024**2),b\\'\\'):h.update(b)\\n return h.hexdigest()\\ndef docker(*args):return subprocess.run([\\'sudo\\',\\'-n\\',\\'docker\\',*args],capture_output=True,text=True,timeout=30)\\ndef available():return int(next(l.split()[1] for l in pathlib.Path(\\'/proc/meminfo\\').read_text().splitlines() if l.startswith(\\'MemAvailable:\\')))*1024\\ndef health():\\n start=time.monotonic()\\n try:\\n  with urllib.request.urlopen(\\'http://127.0.0.1:8081/api/health\\',timeout=3) as r:ok=json.load(r).get(\\'ok\\') is True\\n except Exception:ok=False\\n return {\\'ok\\':ok,\\'latencySeconds\\':time.monotonic()-start}\\ndef generate(request):\\n if not isinstance(request,dict) or set(request)-{\\'prompt\\',\\'seed\\'}:raise ValueError(\\'Unsupported image request fields\\')\\n prompt=request.get(\\'prompt\\');seed=request.get(\\'seed\\',42)\\n if not isinstance(prompt,str) or not 3<=len(prompt.strip())<=700 or \\'\\\\x00\\' in prompt:raise ValueError(\\'Image prompt must contain 3\u2013700 characters\\')\\n if type(seed) is not int or not 0<=seed<=2147483647:raise ValueError(\\'Invalid image seed\\')\\n # These are provisioned, pinned artifacts. Inference has no model-download path.\\n setup=json.loads((ROOT/\\'runtime-lean/runtime_current_result.json\\').read_text())\\n if setup.get(\\'returnCode\\')!=0 or setup.get(\\'binarySha256\\')!=BINARY_SHA:raise RuntimeError(\\'Unverified local image runtime\\')\\n model_dir=ROOT/\\'models/sd-turbo-q8\\';model=model_dir/MODEL[\\'file\\'];decoder=ROOT/\\'models/taesd-official.safetensors\\'\\n if digest(ROOT/\\'runtime-lean/bin/sd-cli\\')!=BINARY_SHA or model.stat().st_size!=MODEL[\\'bytes\\'] or digest(model)!=MODEL[\\'sha256\\'] or digest(decoder)!=DECODER_SHA:raise RuntimeError(\\'Pinned image artifact integrity check failed\\')\\n if available()<2600*1024**2 or not health()[\\'ok\\']:raise RuntimeError(\\'Local inference paused to preserve application health/headroom\\')\\n token=str(uuid.uuid4());output=ROOT/\\'output/worker\\'/token;output.mkdir(parents=True,mode=0o700)\\n name=\\'jh2-image-worker-\\'+token;created=False;begin=time.monotonic();peak=0;minimum=available();samples=[];reason=None;next_health=begin;cg=None\\n report={\\'id\\':token,\\'model\\':MODEL,\\'runtimeBinarySha256\\':BINARY_SHA,\\'prompt\\':prompt,\\'seed\\':seed,\\'resolution\\':512,\\'steps\\':2,\\'scheduler\\':\\'sgm_uniform\\',\\'cfgScale\\':1,\\'cpuLimit\\':.85,\\'memoryLimitBytes\\':3072*1024**2,\\'physicalCommandsSent\\':0,\\'templatesUsed\\':False,\\'status\\':\\'working\\'}\\n try:\\n  args=[\\'create\\',\\'--name\\',name,\\'--network\\',\\'none\\',\\'--read-only\\',\\'--cap-drop\\',\\'ALL\\',\\'--security-opt\\',\\'no-new-privileges\\',\\'--user\\',str(os.getuid())+\\':\\'+str(os.getgid()),\\'--cpus=.85\\',\\'--cpu-shares=128\\',\\'--memory=3072m\\',\\'--memory-swap=3072m\\',\\'--pids-limit=64\\',\\n   \\'--mount\\',\\'type=bind,source=\\'+str(ROOT/\\'runtime-lean/bin\\')+\\',target=/inference-bin,readonly\\',\\'--mount\\',\\'type=bind,source=\\'+str(model_dir)+\\',target=/models,readonly\\',\\'--mount\\',\\'type=bind,source=\\'+str(ROOT/\\'models\\')+\\',target=/decoder,readonly\\',\\'--mount\\',\\'type=bind,source=\\'+str(output)+\\',target=/output\\',\\n   \\'--entrypoint\\',\\'/inference-bin/sd-cli\\',setup[\\'image\\'],\\'--mmap\\',\\'--diffusion-fa\\',\\'--diffusion-conv-direct\\',\\'-m\\',\\'/models/\\'+MODEL[\\'file\\'],\\'-p\\',prompt,\\'--sampling-method\\',\\'euler\\',\\'--scheduler\\',\\'sgm_uniform\\',\\'--cfg-scale\\',\\'1\\',\\'--steps\\',\\'2\\',\\'-t\\',\\'1\\',\\'-W\\',\\'512\\',\\'-H\\',\\'512\\',\\'--seed\\',str(seed),\\'--taesd\\',\\'/decoder/\\'+decoder.name,\\'-o\\',\\'/output/source.png\\']\\n  made=docker(*args)\\n  if made.returncode:raise RuntimeError(\\'Could not create isolated image worker: \\'+made.stderr[-300:])\\n  created=True\\n  if docker(\\'start\\',name).returncode:raise RuntimeError(\\'Could not start isolated image worker\\')\\n  while True:\\n   state_result=docker(\\'inspect\\',name,\\'--format\\',\\'{{json .State}}\\')\\n   if state_result.returncode:raise RuntimeError(\\'Image worker state unavailable\\')\\n   state=json.loads(state_result.stdout)\\n   if not state[\\'Running\\']:break\\n   try:\\n    if cg is None:\\n     line=next(l for l in pathlib.Path(\\'/proc/\\'+str(state[\\'Pid\\'])+\\'/cgroup\\').read_text().splitlines() if l.startswith(\\'0::\\'));cg=pathlib.Path(\\'/sys/fs/cgroup\\')/line[3:].lstrip(\\'/\\')\\n    peak=max(peak,int((cg/\\'memory.peak\\').read_text()))\\n   except (OSError,ValueError):pass\\n   minimum=min(minimum,available())\\n   if time.monotonic()>=next_health:\\n    sample={\\'elapsedSeconds\\':time.monotonic()-begin,**health()};samples.append(sample);next_health=time.monotonic()+20\\n    if not sample[\\'ok\\']:reason=\\'application_health_guard\\'\\n   if available()<750*1024**2:reason=\\'host_headroom_guard\\'\\n   elif time.monotonic()-begin>600:reason=\\'inference_time_limit\\'\\n   if reason:docker(\\'stop\\',\\'--time\\',\\'5\\',name)\\n   time.sleep(.4)\\n  logs=docker(\\'logs\\',name);(output/\\'inference.log\\').write_text(logs.stdout+logs.stderr)\\n  report.update(wallSeconds=time.monotonic()-begin,peakMemoryBytes=peak,minHostAvailableBytes=minimum,healthSamples=samples,exitCode=state[\\'ExitCode\\'],oomKilled=state[\\'OOMKilled\\'],stopReason=reason)\\n  if state[\\'ExitCode\\'] or state[\\'OOMKilled\\'] or reason:raise RuntimeError(\\'Local image inference failed: \\'+str(reason or state[\\'ExitCode\\']))\\n  png=output/\\'source.png\\'\\n  if not png.exists() or not 100<=png.stat().st_size<=10*1024**2:raise RuntimeError(\\'Local generator produced no valid bounded PNG\\')\\n  with png.open(\\'rb\\') as f:header=f.read(24)\\n  if header[:8]!=b\\'\\\\x89PNG\\\\r\\\\n\\\\x1a\\\\n\\' or struct.unpack(\\'>II\\',header[16:24])!=(512,512):raise RuntimeError(\\'Unexpected image dimensions/encoding\\')\\n  if not health()[\\'ok\\']:raise RuntimeError(\\'Application health check failed after image generation\\')\\n  report.update(ok=True,status=\\'generated_requires_semantic_inspection\\',file=str(png),sourceImageSha256=digest(png));return report\\n except Exception as e:\\n  report.update(ok=False,status=\\'failed\\',error=str(e)[:400]);raise\\n finally:\\n  report.setdefault(\\'wallSeconds\\',time.monotonic()-begin);(output/\\'result.json\\').write_text(json.dumps(report,indent=2))\\n  if created:\\n   state=docker(\\'inspect\\',name,\\'--format\\',\\'{{.State.Running}}\\')\\n   if state.returncode==0 and state.stdout.strip()==\\'true\\':docker(\\'stop\\',\\'--time\\',\\'5\\',name)\\n   docker(\\'rm\\',name)\\ndef main():\\n raw=sys.stdin.read(8193)\\n if len(raw)>8192:raise ValueError(\\'Image request too large\\')\\n request=json.loads(raw)\\n (ROOT/\\'output/worker\\').mkdir(parents=True,exist_ok=True)\\n # Cooperative host-worker serialization; deployment orchestration must also\\n # serialize image/text/vision stages to respect the measured host memory cap.\\n with (ROOT/\\'output/worker/.inference.lock\\').open(\\'a\\') as lock:\\n  try:fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\\n  except BlockingIOError:raise RuntimeError(\\'Another local image request is active\\')\\n  print(json.dumps(generate(request)),flush=True)\\nif __name__==\\'__main__\\':\\n def terminate(signum,frame):raise RuntimeError(\\'Local image worker cancelled\\')\\n signal.signal(signal.SIGTERM,terminate)\\n signal.signal(signal.SIGINT,terminate)\\n try:main()\\n except Exception as e:print(json.dumps({\\'ok\\':False,\\'error\\':str(e)[:400]}),flush=True);sys.exit(1)\\n', 'spool_host.py': '\"\"\"Fixed host-side dual-AI spool controller. Never run inside the web container.\\nNo installation is performed. Administrator selects fixed paths at startup.\\n\"\"\"\\nimport argparse,fcntl,json,os,pathlib,re,signal,subprocess,tempfile,time,urllib.request,uuid\\nMAX_REQUEST=4*1024**2\\nMAX_RESPONSE=8*1024**2\\nUUID=re.compile(r\\'^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$\\')\\nNODE_IMAGE=\\'sha256:b21fe589dfbe5cc39365d0544b9be3f1f33f55f3c86c87a76ff65a02f8f5848e\\'\\nROOT=pathlib.Path(\\'/opt/jh2-image-benchmark-20261019\\')\\nclass Rejected(ValueError):pass\\ndef regular_read(path,limit):\\n fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)\\n try:\\n  import stat\\n  if not stat.S_ISREG(os.fstat(fd).st_mode) or os.fstat(fd).st_size>limit:raise Rejected(\\'Invalid bounded regular file\\')\\n  with os.fdopen(fd,\\'rb\\',closefd=False) as f:raw=f.read(limit+1)\\n  if len(raw)>limit:raise Rejected(\\'File exceeds byte limit\\')\\n  return raw\\n finally:os.close(fd)\\ndef atomic_json(path,value,limit=MAX_RESPONSE,mode=0o600):\\n raw=json.dumps(value,separators=(\\',\\',\\':\\'),allow_nan=False).encode()\\n if len(raw)>limit:raise Rejected(\\'Result exceeds byte limit\\')\\n fd,tmp=tempfile.mkstemp(prefix=\\'.\\'+path.name+\\'.\\',dir=path.parent)\\n try:\\n  os.fchmod(fd,mode)\\n  with os.fdopen(fd,\\'wb\\') as f:f.write(raw);f.flush();os.fsync(f.fileno())\\n  # Never replace a symlink or previous terminal response.\\n  os.link(tmp,path,follow_symlinks=False)\\n finally:\\n  try:os.unlink(tmp)\\n  except FileNotFoundError:pass\\ndef available():\\n return int(next(x.split()[1] for x in pathlib.Path(\\'/proc/meminfo\\').read_text().splitlines() if x.startswith(\\'MemAvailable:\\')))*1024\\ndef healthy():\\n try:\\n  with urllib.request.urlopen(\\'http://127.0.0.1:8081/api/health\\',timeout=3) as r:return json.load(r).get(\\'ok\\') is True\\n except Exception:return False\\ndef docker(*args):\\n return subprocess.run([\\'sudo\\',\\'-n\\',\\'docker\\',*args],capture_output=True,text=True,timeout=30)\\ndef remove_container(name):\\n docker(\\'stop\\',\\'--time\\',\\'5\\',name);docker(\\'rm\\',\\'-f\\',name)\\ndef validate_request(value,filename_id,now=None):\\n if not isinstance(value,dict) or set(value)!={\\'id\\',\\'operation\\',\\'payload\\',\\'createdAt\\',\\'expiresAt\\'}:raise Rejected(\\'Invalid request envelope\\')\\n if value[\\'id\\']!=filename_id or not UUID.fullmatch(filename_id):raise Rejected(\\'Invalid request ID\\')\\n if value[\\'operation\\'] not in (\\'image\\',\\'ground\\',\\'caption\\') or not isinstance(value[\\'payload\\'],dict):raise Rejected(\\'Invalid operation\\')\\n # Client timestamps are milliseconds since epoch; never accept unbounded lifetimes.\\n now=time.time()*1000 if now is None else now\\n created,expires=value[\\'createdAt\\'],value[\\'expiresAt\\']\\n if any(type(v) not in (int,float) for v in (created,expires)) or not now-3600000<=created<=now+60000 or not created<expires<=created+3600000 or expires<=now:raise Rejected(\\'Expired or invalid request lifetime\\')\\n p=value[\\'payload\\']\\n if value[\\'operation\\']==\\'image\\':\\n  if set(p)-{\\'prompt\\',\\'seed\\'} or not isinstance(p.get(\\'prompt\\'),str) or not 3<=len(p[\\'prompt\\'].strip())<=700 or \\'\\\\x00\\' in p[\\'prompt\\']:raise Rejected(\\'Invalid image prompt\\')\\n  if \\'seed\\' in p and (type(p[\\'seed\\']) is not int or not 0<=p[\\'seed\\']<=2147483647):raise Rejected(\\'Invalid seed\\')\\n else:\\n  # Vision operations receive actual pixels, never arbitrary host paths.\\n  if set(p)-{\\'rgba\\',\\'width\\',\\'height\\',\\'label\\',\\'partLabels\\'} or not isinstance(p.get(\\'rgba\\'),str):raise Rejected(\\'Invalid vision pixels\\')\\n  if any(type(p.get(k)) is not int or not 40<=p[k]<=1024 for k in (\\'width\\',\\'height\\')):raise Rejected(\\'Invalid vision dimensions\\')\\n  import base64\\n  try:raw=base64.b64decode(p[\\'rgba\\'],validate=True)\\n  except Exception:raise Rejected(\\'Invalid pixel encoding\\')\\n  if len(raw)!=p[\\'width\\']*p[\\'height\\']*4:raise Rejected(\\'Invalid pixel length\\')\\n  if value[\\'operation\\']==\\'ground\\':\\n   if not isinstance(p.get(\\'label\\'),str) or not 2<=len(p[\\'label\\'])<=100:raise Rejected(\\'Invalid object label\\')\\n   labels=p.get(\\'partLabels\\',[])\\n   if not isinstance(labels,list) or len(labels)>12 or any(not isinstance(x,str) or not 2<=len(x)<=80 for x in labels):raise Rejected(\\'Invalid part labels\\')\\n return value\\nclass Controller:\\n def __init__(self,spool,runtime,script,control):\\n  self.spool=spool;self.runtime=runtime;self.script=script;self.control=control\\n def vision(self,token,operation,payload):\\n  token=str(uuid.uuid4())\\n  internal=self.control/(token+\\'.internal.json\\');output=self.control/(token+\\'.vision.json\\');name=\\'jh2-vision-worker-\\'+token\\n  if internal.exists() or internal.is_symlink() or output.exists() or output.is_symlink():raise Rejected(\\'Internal job already exists\\')\\n  atomic_json(internal,{\\'operation\\':operation,\\'payload\\':payload},MAX_REQUEST)\\n  made=False;start=time.monotonic();next_health=start;samples=[];minimum=available();peak=0;cg=None\\n  try:\\n   if minimum<2300*1024**2 or not healthy():raise Rejected(\\'Inference paused to preserve application health/headroom\\')\\n   args=[\\'create\\',\\'--name\\',name,\\'--network\\',\\'none\\',\\'--read-only\\',\\'--cap-drop\\',\\'ALL\\',\\'--security-opt\\',\\'no-new-privileges\\',\\'--user\\',str(os.getuid())+\\':\\'+str(os.getgid()),\\'--cpus=.85\\',\\'--cpu-shares=128\\',\\'--memory=2048m\\',\\'--memory-swap=2048m\\',\\'--pids-limit=64\\',\\'--env\\',\\'HF_HUB_OFFLINE=1\\',\\'--env\\',\\'TRANSFORMERS_OFFLINE=1\\',\\'--env\\',\\'HF_HOME=/tmp/hf\\',\\'--tmpfs\\',\\'/tmp:rw,noexec,nosuid,size=64m\\',\\'--mount\\',\\'type=bind,source=\\'+str(self.runtime)+\\',target=/workspace,readonly\\',\\'--mount\\',\\'type=bind,source=\\'+str(ROOT/\\'models/florence-2-base-ft\\')+\\',target=/vision-model,readonly\\',\\'--mount\\',\\'type=bind,source=\\'+str(ROOT/\\'output/worker\\')+\\',target=/generated,readonly\\',\\'--mount\\',\\'type=bind,source=\\'+str(self.control)+\\',target=/jobs\\',\\'--workdir\\',\\'/workspace\\',NODE_IMAGE,\\'node\\',\\'vision_worker.mjs\\',\\'/jobs/\\'+internal.name,\\'/jobs/\\'+output.name]\\n   result=docker(*args)\\n   if result.returncode:raise RuntimeError(\\'Could not create isolated vision worker\\')\\n   made=True\\n   if docker(\\'start\\',name).returncode:raise RuntimeError(\\'Could not start isolated vision worker\\')\\n   while True:\\n    result=docker(\\'inspect\\',name,\\'--format\\',\\'{{json .State}}\\')\\n    if result.returncode:raise RuntimeError(\\'Vision state unavailable\\')\\n    state=json.loads(result.stdout)\\n    if not state[\\'Running\\']:break\\n    try:\\n     if cg is None:\\n      line=next(x for x in pathlib.Path(\\'/proc/\\'+str(state[\\'Pid\\'])+\\'/cgroup\\').read_text().splitlines() if x.startswith(\\'0::\\'));cg=pathlib.Path(\\'/sys/fs/cgroup\\')/line[3:].lstrip(\\'/\\')\\n     peak=max(peak,int((cg/\\'memory.peak\\').read_text()))\\n    except (OSError,ValueError,StopIteration):pass\\n    current=available();minimum=min(current,minimum)\\n    if current<750*1024**2:raise RuntimeError(\\'Host headroom guard\\')\\n    if time.monotonic()-start>900:raise RuntimeError(\\'Vision time limit\\')\\n    if time.monotonic()>=next_health:\\n     ok=healthy();samples.append({\\'elapsedSeconds\\':round(time.monotonic()-start,2),\\'ok\\':ok});next_health=time.monotonic()+20\\n     if not ok:raise RuntimeError(\\'Application health guard\\')\\n    time.sleep(.5)\\n   if state.get(\\'ExitCode\\') or state.get(\\'OOMKilled\\'):raise RuntimeError(\\'Local vision inference failed\\')\\n   envelope=json.loads(regular_read(output,MAX_RESPONSE))\\n   if not isinstance(envelope,dict) or envelope.get(\\'ok\\') is not True or not isinstance(envelope.get(\\'result\\'),dict):raise RuntimeError(str(envelope.get(\\'error\\',\\'Invalid vision result\\'))[:400] if isinstance(envelope,dict) else \\'Invalid vision result\\')\\n   result=envelope[\\'result\\']\\n   if operation==\\'decode\\':\\n    import base64\\n    if set(result)!={\\'width\\',\\'height\\',\\'rgba\\'} or result.get(\\'width\\')!=512 or result.get(\\'height\\')!=512 or not isinstance(result.get(\\'rgba\\'),str):raise Rejected(\\'Invalid decoded source shape\\')\\n    if len(base64.b64decode(result[\\'rgba\\'],validate=True))!=512*512*4:raise Rejected(\\'Invalid decoded source length\\')\\n   elif operation==\\'caption\\':\\n    if not isinstance(result.get(\\'caption\\'),str) or len(result[\\'caption\\'])>10000:raise Rejected(\\'Invalid caption result\\')\\n   elif not isinstance(result.get(\\'object\\'),dict) or not isinstance(result[\\'object\\'].get(\\'mask\\'),str) or not isinstance(result.get(\\'parts\\'),list) or len(result[\\'parts\\'])>12:raise Rejected(\\'Invalid ground result\\')\\n   if not healthy():raise RuntimeError(\\'Application health check failed after vision\\')\\n   result[\\'workerMetrics\\']={\\'wallSeconds\\':time.monotonic()-start,\\'minHostAvailableBytes\\':minimum,\\'healthSamples\\':samples,\\'cpuLimit\\':.85,\\'memoryLimitBytes\\':2048*1024**2,\\'physicalCommandsSent\\':0}\\n   if peak:result[\\'workerMetrics\\'][\\'peakMemoryBytes\\']=peak\\n   return result\\n  finally:\\n   if made:remove_container(name)\\n   for p in (internal,output):\\n    try:p.unlink()\\n    except FileNotFoundError:pass\\n def image(self,payload):\\n  # Native CLI validates pinning, resources, health and generates its own UUID.\\n  # Temporary files bound stdout/stderr growth without PIPE deadlocks.\\n  with tempfile.TemporaryFile() as out,tempfile.TemporaryFile() as err:\\n   process=subprocess.Popen([\\'/usr/bin/python3\\',str(self.script)],stdin=subprocess.PIPE,stdout=out,stderr=err,start_new_session=True)\\n   try:\\n    process.stdin.write(json.dumps(payload).encode());process.stdin.close();process.wait(timeout=900)\\n    out.seek(0);raw=out.read(MAX_RESPONSE+1)\\n    if len(raw)>MAX_RESPONSE:raise Rejected(\\'Native worker result too large\\')\\n    result=json.loads(raw)\\n    if process.returncode or result.get(\\'ok\\') is not True:raise RuntimeError(str(result.get(\\'error\\',\\'Local image inference failed\\'))[:400])\\n   finally:\\n    if process.poll() is None:os.killpg(process.pid,signal.SIGTERM);process.wait(timeout=15)\\n  generated=result.get(\\'id\\');file=result.get(\\'file\\')\\n  if not isinstance(generated,str) or not UUID.fullmatch(generated):raise Rejected(\\'Invalid native result ID\\')\\n  expected=ROOT/\\'output/worker\\'/generated/\\'source.png\\'\\n  if file!=str(expected) or expected.is_symlink() or expected.parent.is_symlink():raise Rejected(\\'Invalid native result path\\')\\n  data=regular_read(expected,10*1024**2)\\n  if data[:8]!=b\\'\\\\x89PNG\\\\r\\\\n\\\\x1a\\\\n\\':raise Rejected(\\'Invalid native PNG\\')\\n  decoded=self.vision(str(uuid.uuid4()),\\'decode\\',{\\'file\\':\\'/generated/\\'+generated+\\'/source.png\\'})\\n  return {**{k:v for k,v in result.items() if k!=\\'file\\'},**decoded}\\n def handle(self,path):\\n  token=path.name.removesuffix(\\'.request.json\\');response=self.spool/(token+\\'.response.json\\')\\n  if not UUID.fullmatch(token) or response.exists() or response.is_symlink():return\\n  try:\\n   request=validate_request(json.loads(regular_read(path,MAX_REQUEST)),token)\\n   result=self.image(request[\\'payload\\']) if request[\\'operation\\']==\\'image\\' else self.vision(token,request[\\'operation\\'],request[\\'payload\\'])\\n   value={\\'id\\':token,\\'ok\\':True,\\'result\\':result}\\n  except Exception as e:value={\\'id\\':token,\\'ok\\':False,\\'error\\':str(e)[:400]}\\n  try:atomic_json(response,value,mode=0o660)\\n  except FileExistsError:pass\\n  # Keep original request for bounded operator/client retention, never follow it.\\n def run(self,once=False):\\n  fd=os.open(self.control/\\'.controller.lock\\',os.O_CREAT|os.O_WRONLY|os.O_NOFOLLOW,0o600)\\n  try:\\n   fcntl.flock(fd,fcntl.LOCK_EX|fcntl.LOCK_NB)\\n   while True:\\n    for path in sorted(self.spool.glob(\\'*.request.json\\')):\\n     token=path.name.removesuffix(\\'.request.json\\')\\n     if UUID.fullmatch(token) and not (self.spool/(token+\\'.response.json\\')).exists():\\n      self.handle(path)\\n      if once:return\\n    if once:return\\n    time.sleep(.5)\\n  finally:os.close(fd)\\ndef main():\\n parser=argparse.ArgumentParser();parser.add_argument(\\'--spool\\',required=True);parser.add_argument(\\'--vision-runtime\\',required=True);parser.add_argument(\\'--image-script\\',required=True);parser.add_argument(\\'--control\\',required=True);parser.add_argument(\\'--once\\',action=\\'s