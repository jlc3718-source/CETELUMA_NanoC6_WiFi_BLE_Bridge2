\\n}\\nfor(const input of config.newSources){\\n await evaluate(input.label+'_native_image_and_grounding',async()=>{\\n  const source=await adapters.imageGenerator({prompt:input.prompt});\\n  await fs.writeFile('/results/'+input.label+'_source.json',JSON.stringify({...source,rgba:Buffer.from(source.rgba).toString('base64')}));\\n  const vision=await adapters.visionFactory();let grounding;\\n  try{grounding=await vision.ground({rgba:source.rgba,width:source.width,height:source.height,label:input.objectLabel,partLabels:input.partLabels});}finally{await vision.dispose();}\\n  const serial={...grounding,object:{...grounding.object,mask:Buffer.from(grounding.object.mask).toString('base64')},parts:grounding.parts.map(p=>({...p,...(p.mask?{mask:Buffer.from(p.mask).toString('base64')}:{})}))};\\n  await fs.writeFile('/results/'+input.label+'_grounding.json',JSON.stringify(serial));\\n  const candidate=createGroundedRasterScene({image:source.rgba,width:source.width,height:source.height,objectMask:grounding.object.mask,object:{id:input.label,label:input.objectLabel},prompt:input.prompt,paletteSize:12,provenance:{sourceImageSha256:source.sourceImageSha256,groundingModel:grounding.model}});\\n  const finalVision=await adapters.visionFactory();let caption;try{caption=await finalVision.caption({rgba:candidate.artwork,width:40,height:40});}finally{await finalVision.dispose();}\\n  await fs.writeFile('/results/'+input.label+'_candidate.json',JSON.stringify({scene:{...candidate.scene,layers:candidate.scene.layers.map(l=>({...l,rgba:Buffer.from(l.rgba).toString('base64')}))},artwork:Buffer.from(candidate.artwork).toString('base64'),caption,semanticAcceptance:'REQUIRES_RENDERED_REVIEW'}));\\n  return {sourceImageSha256:source.sourceImageSha256,model:source.model,sourceHealth:source.healthSamples,sourceCaption:grounding.caption,candidateCaption:caption,partResults:grounding.parts.map(p=>({label:p.label,status:p.status,metrics:p.metrics,error:p.error})),semanticAcceptance:'REQUIRES_RENDERED_REVIEW'};\\n });\\n}\\nawait checkpoint();console.log(JSON.stringify({ok:report.tests.every(t=>t.ok),cases:report.tests.length,productionIntegrated:false}));\\n\"}\nfor name,source in FILES.items():\n target=RUN/name if name.endswith('.py') else RUNTIME/name\n if target.exists():\n  marker=RUNTIME/'dual_ai_worker_benchmark_owned.json'\n  assert marker.exists() and name in json.loads(marker.read_text()),'Refuse to overwrite unrelated runtime file'\n target.write_text(source)\n(RUNTIME/'dual_ai_worker_benchmark_owned.json').write_text(json.dumps(list(FILES)))\n(ROOT/'output/worker').mkdir(exist_ok=True)\nspec=importlib.util.spec_from_file_location('spool_benchmark_host',RUN/'spool_host.py');module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)\ncontroller=module.Controller(SPOOL,RUNTIME,RUN/'native_image_worker.py',CONTROL)\nexisting=[]\nfor label,relative,expected,obj,parts in [('ghost', 'sd-turbo-q8-cartoon-512/ghost_sd_turbo_q8_cartoon_512.png', '521b7132c3b19957bc33db890cb27341210ce9d2258ed43962bf337c9228d9cf', 'ghost', ['eyes', 'mouth']), ('chicken', 'q8-regression/chicken/chicken.png', '78f988433f4921b5b96c8b321353f3380a6aa4db3d8b3eac9aa81aa4aa8e2d66', 'chicken', ['wings', 'feet', 'eyes']), ('snowman', 'q8-regression/snowman/snowman.png', '4fd158ea29a229cbeaee02b666071a2f42748faf3ccd8aab1ca837c8e3d1f80a', 'snowman', ['arms', 'eyes']), ('firework', 'q8-regression/firework/firework.png', '7a09adc679cf830d87f49cab1f833a12e9deac541ea01dd4e8fb4ec960e5c47f', 'rocket', []), ('pumpkin', 'q8-regression/pumpkin/pumpkin.png', 'eacb86219a32a3b70a37db714fc805174f41515a3c6b36d9cb46bd4378ad21a9', 'pumpkin', ['flames', 'mouth']), ('cauldron', 'q8-regression/cauldron/cauldron.png', '1710a3753c63a23b44f133bfefff2af9235bcdfb3bb7928062e8ab6d4fffd23b', 'cauldron', ['potion', 'steam']), ('witch', 'q8-regression/witch/witch.png', 'd219757db06483e26e6228db091ca19c4d0389386b8951f10f04f796ab39a2cf', 'witch', []), ('axolotl', 'q8-regression/axolotl/axolotl.png', 'f87a2918e5ab95303dfbceab0e4e74c073ff9301c179a44b04e152f7ddda8bc5', 'axolotl', [])]:\n source=ROOT/'output'/relative;assert hashlib.sha256(source.read_bytes()).hexdigest()==expected\n token=str(uuid.uuid4());folder=ROOT/'output/worker'/token;folder.mkdir();shutil.copyfile(source,folder/'source.png')\n decoded=controller.vision(str(uuid.uuid4()),'decode',{'file':'/generated/'+token+'/source.png'})\n existing.append({'label':label,'objectLabel':obj,'partLabels':parts,'sourceImageSha256':expected,**decoded})\nconfig={'blueGhost40':'','existingSources':existing,'newSources':[\n {'label':'cat_standing','objectLabel':'cat','partLabels':['legs','tail','hat'],'prompt':'Flat cartoon of one black cat wearing a purple pointed wizard hat, full body standing side view, four separate visible legs and long tail, alone, plain black background, no pot, no scenery, crisp simple colors.'},\n {'label':'pumpkin_inner_fire','objectLabel':'pumpkin','partLabels':['flames','mouth'],'prompt':'Flat cartoon of one scary orange jack-o-lantern, carved eyes and open jagged mouth, bright yellow fire burning INSIDE the hollow pumpkin visible through its mouth, full pumpkin centered alone, plain black background, no outer flames, no scenery, simple colors.'},\n {'label':'armadillo','objectLabel':'armadillo','partLabels':[],'prompt':'A flat cartoon of one armadillo, gray armored shell with horizontal bands, long pointed snout, four short legs and long tapered tail, full animal side view, alone on a plain black background, clean clear silhouette, no extra objects.'}\n]}\n(RUN/'input.json').write_text(json.dumps(config))\nclient='jh2-worker-client-'+str(uuid.uuid4());daemon=None\ntry:\n daemon=subprocess.Popen(['/usr/bin/python3',str(RUN/'spool_host.py'),'--spool',str(SPOOL),'--vision-runtime',str(RUNTIME),'--image-script',str(RUN/'native_image_worker.py'),'--control',str(CONTROL)],stdout=(RUN/'host.log').open('w'),stderr=subprocess.STDOUT)\n args=['create','--name',client,'--network','none','--read-only','--cap-drop','ALL','--security-opt','no-new-privileges','--user',str(os.getuid())+':'+str(os.getgid()),'--cpus=.1','--memory=256m','--memory-swap=256m','--pids-limit=64','--mount','type=bind,source='+str(RUNTIME)+',target=/workspace,readonly','--mount','type=bind,source='+str(SPOOL)+',target=/queue','--mount','type=bind,source='+str(RESULTS)+',target=/results','--mount','type=bind,source='+str(RUN/'input.json')+',target=/input.json,readonly','--workdir','/workspace',module.NODE_IMAGE,'node','oracle_worker_test.mjs']\n made=module.docker(*args);assert made.returncode==0,made.stderr\n assert module.docker('start',client).returncode==0\n start=time.monotonic()\n while True:\n  state=json.loads(module.docker('inspect',client,'--format','{{json .State}}').stdout)\n  if not state['Running']:break\n  assert daemon.poll() is None,'Host controller exited'\n  assert time.monotonic()-start<2100,'Finite test time limit'\n  assert module.available()>750*1024**2,'Host headroom guard'\n  assert module.healthy(),'Application health guard'\n  time.sleep(5)\n log=module.docker('logs',client);(RESULTS/'client.log').write_text(log.stdout+log.stderr)\n assert state['ExitCode']==0 and not state['OOMKilled'],log.stderr[-300:]\n print('WORKER_E2E_RESULT '+(RESULTS/'worker_test_results.json').read_text()[:1500])\nfinally:\n module.remove_container(client)\n if daemon:\n  daemon.terminate()\n  try:daemon.wait(timeout=45)\n  except subprocess.TimeoutExpired:daemon.kill();daemon.wait()\n target=ROOT/'output'/('worker-e2e-'+os.environ['GITHUB_RUN_ID'])\n target.mkdir(exist_ok=True)\n for f in RESULTS.glob('*'):\n  if f.is_file():shutil.copyfile(f,target/f.name)\n if (RUN/'host.log').exists():shutil.copyfile(RUN/'host.log',target/'host.log')\n (target/'finite_run.json').write_text(json.dumps({'directory':str(RUN),'productionIntegrated':False,'physicalCommandsSent':0,'sourceHashes':{n:hashlib.sha256(s.encode()).hexdigest() for n,s in FILES.items()}}))\n\nPYTHON\n"
