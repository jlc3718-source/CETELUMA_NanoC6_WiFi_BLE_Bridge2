name: JH2 1.1.70 Native Local File Upload Build Only
on:
  push:
    branches: [feature/jh2-native-local-upload-no-repartition-20261024]
    paths:
      - 'JasonHome2NanoC6_IDF/**'
      - '.github/workflows/jh2-170-native-local-stage-build-only.yml'
permissions: {contents: read}
concurrency:
  group: jh2-170-native-local-stage-ci
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check no partitions, NVS, factory recovery or existing BLE protocol modified
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('JasonHome2NanoC6_IDF')
          partition=(p/'partitions.csv').read_text()
          assert 'runtime, app, ota_0, 0x130000, 0x290000' in partition
          assert 'storage, data, spiffs, 0x3C0000, 0x40000' in partition
          main=(p/'main/main.c').read_text()
          assert 'ble_gattc_write_no_rsp_flat' in main
          bridge=(p/'main/bridge.c').read_text()
          asset=(p/'main/asset_stream.c').read_text()
          native=(p/'main/native_slot_upload.c').read_text()
          assert '#define NATIVE_FW_VERSION "1.1.70"' in bridge
          assert 'nativeSlotStage' in bridge and 'nativeSlotCommit' in bridge
          assert 'jh2_asset_stage_native' in asset and 'jh2_asset_native_verified' in asset
          assert 'jh2_slot_transfer_file' in native and 'jh2_slot_transfer(' in native
          assert 'jH2_asset_stream_start(' not in asset
          assert 'format_if_mount_failed=false' in bridge
          assert 'nvs_flash_erase(' not in bridge+main+asset
          print('STORAGE_UNCHANGED_NVS_FACTORY_PROTECTED_TWO_PHASE_NATIVE_LOCAL_UPLOAD')
          PY
          gcc -std=c11 -Wall -Wextra -Werror -O2 JasonHome2NanoC6_IDF/main/native_slot_guard.c JasonHome2NanoC6_IDF/tests/native_slot_guard_test.c -o /tmp/jh2-native-guard
          /tmp/jh2-native-guard
          gcc -std=c11 -Wall -Wextra -Werror -O2 JasonHome2NanoC6_IDF/main/effectlist.c JasonHome2NanoC6_IDF/tests/effectlist_test.c -o /tmp/jh2-native-effects
          /tmp/jh2-native-effects
      - name: Use existing production runtime configuration without flash formatting
        run: |
          cat >> JasonHome2NanoC6_IDF/sdkconfig.defaults <<'EOF'
          CONFIG_JH2_NATIVE_ENABLE_ORACLE=y
          CONFIG_JH2_NATIVE_BROWSER_OTA_COMPAT=y
          CONFIG_JH2_NATIVE_READONLY_ACCEPTANCE=n
          EOF
      - name: Cross-compile ESP32-C6 firmware (no flash, no OTA, no release)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32c6
          path: JasonHome2NanoC6_IDF
          command: idf.py build
      - name: Inspect built firmware without publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          b=Path('JasonHome2NanoC6_IDF/build/jh2_native_ble_probe.bin').read_bytes()
          assert len(b)<0x290000 and b[0]==0xe9 and b[12]==13
          assert b'1.1.70' in b and b'curtain-native.eff' in b
          print('NANO_170_BUILD_ONLY_SUCCESS',len(b))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-1.1.70-LOCAL-NATIVE-BUILD-ONLY
          path: |
            JasonHome2NanoC6_IDF/build/jh2_native_ble_probe.bin
            JasonHome2NanoC6_IDF/build/partition_table/partition-table.bin
          retention-days: 10
