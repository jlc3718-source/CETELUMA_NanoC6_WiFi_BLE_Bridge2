name: Export Verified Jason Home 2 Encrypted Backup in Recoverable Parts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jh2-verified-encrypted-backup-chunks-20261108.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-encrypted:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 25
    env:
      BACKUP_ROOT: /home/ubuntu/jh2-private-snapshot-42460350607
    steps:
      - name: Verify existing finished encrypted backup and prepare safe chunks
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BACKUP_ROOT/oracle-recovery.tar.gz.aes"
          test -s "$BACKUP_ROOT/password.rsa-oaep-sha256.enc"
          test -s "$BACKUP_ROOT/SHA256SUMS.txt"
          (cd "$BACKUP_ROOT" && sha256sum -c SHA256SUMS.txt)
          mkdir -p "$RUNNER_TEMP/jh2-chunks" "$RUNNER_TEMP/jh2-checks"
          split -b 250M "$BACKUP_ROOT/oracle-recovery.tar.gz.aes" "$RUNNER_TEMP/jh2-chunks/part-"
          test "$(find "$RUNNER_TEMP/jh2-chunks" -name 'part-*' -type f | wc -l)" -eq 5
          (cd "$RUNNER_TEMP/jh2-chunks" && sha256sum part-* > SHA256SUMS-PARTS.txt)
          cat "$RUNNER_TEMP/jh2-chunks"/part-* | sha256sum | cut -d ' ' -f1 > "$RUNNER_TEMP/jh2-checks/reassembled.sha256"
          sha256sum "$BACKUP_ROOT/oracle-recovery.tar.gz.aes" | cut -d ' ' -f1 > "$RUNNER_TEMP/jh2-checks/original.sha256"
          cmp "$RUNNER_TEMP/jh2-checks/reassembled.sha256" "$RUNNER_TEMP/jh2-checks/original.sha256"
          cp "$BACKUP_ROOT/password.rsa-oaep-sha256.enc" "$RUNNER_TEMP/jh2-checks/"
          cp "$BACKUP_ROOT/SHA256SUMS.txt" "$RUNNER_TEMP/jh2-checks/ORIGINAL-SHA256SUMS.txt"
          cp "$RUNNER_TEMP/jh2-chunks/SHA256SUMS-PARTS.txt" "$RUNNER_TEMP/jh2-checks/"
          printf '%s\n' 'These files are encrypted. Concatenate part-aa, part-ab, part-ac, part-ad, part-ae in that order to restore oracle-recovery.tar.gz.aes. Verify against ORIGINAL-SHA256SUMS.txt. Keep the RSA private decryption key secure and separate.' > "$RUNNER_TEMP/jh2-checks/RESTORE.txt"
          echo "VERIFIED_PARTS_AND_REASSEMBLY"
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-20261108-Part-aa
          path: ${{ runner.temp }}/jh2-chunks/part-aa
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-20261108-Part-ab
          path: ${{ runner.temp }}/jh2-chunks/part-ab
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-20261108-Part-ac
          path: ${{ runner.temp }}/jh2-chunks/part-ac
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-20261108-Part-ad
          path: ${{ runner.temp }}/jh2-chunks/part-ad
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-20261108-Part-ae
          path: ${{ runner.temp }}/jh2-chunks/part-ae
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: JH2-20261108-Private-Metadata
          path: ${{ runner.temp }}/jh2-checks/*
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
