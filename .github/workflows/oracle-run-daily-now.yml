name: Oracle Daily Follow-up Entries

on:
  push:
    paths:
      - ".github/workflows/oracle-run-daily-now.yml"

permissions:
  contents: write

jobs:
  entries:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run follow-up entry paths
        shell: bash
        run: |
          set -u
          run_one() {
            NAME="$1"
            PAYLOAD="$2"
            RAW="$(mktemp)"
            OUT=".github/${NAME}.json"
            if curl -sS --fail --max-time 65 -H 'Content-Type: application/json' -d "$PAYLOAD" http://127.0.0.1:8932/run > "$RAW"; then
              python3 -c 'import json,re,sys;d=json.load(open(sys.argv[1]));r=d.get("result") if isinstance(d,dict) else {};r=r if isinstance(r,dict) else {};keys=("task","status","url","confirmation","missing","challenge","prepared","reason","need","action","confirmed","prize","message","detail","count","eligible");o={"id":d.get("id"),"ok":d.get("ok"),"started":d.get("started"),"finished":d.get("finished"),"error":d.get("error"),"result":{k:r.get(k) for k in keys if k in r}};s=json.dumps(o);s=re.sub(r"[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}","[REDACTED_EMAIL]",s,flags=re.I);s=re.sub(r"\b\d{5}(?:-\d{4})?\b","[REDACTED_ZIP]",s);print(s)' "$RAW" > "$OUT"
            else
              printf '{"id":"%s","ok":false,"error":"oracle_request_failed_or_timed_out"}\n' "$NAME" > "$OUT"
            fi
            rm -f "$RAW"
          }

          run_one "oracle-mova-direct-result" '{"id":"mova-direct-daily","task":"mova_direct_entry"}'
          run_one "oracle-slickdeals-result" '{"id":"slickdeals-daily-2026-10-07","task":"generic_form_entry","url":"https://slickdeals.net/giveaway/daily-draw/2026-10-07/","submit":true}'
          run_one "oracle-lenovo-legion-result" '{"id":"lenovo-legion-oct-2026","task":"generic_form_entry","url":"https://gaming.lenovo.com/giveaways/post/na-eu-uk-jp-october-2026-giveaway---legion-go-s-cDL2Bea0XrQajM4","submit":true}'
          run_one "oracle-lenovo-thinkbook-result" '{"id":"lenovo-thinkbook-oct-2026","task":"generic_form_entry","url":"https://smbcommunity.lenovo.com/giveaways/post/na-october-2026-giveaway---thinkbook-14x-intel-qlhrgOWeowlMofo","submit":true}'

      - name: Publish scrubbed follow-up results
        shell: bash
        run: |
          set -e
          git config user.name "oracle-runner"
          git config user.email "oracle-runner@users.noreply.github.com"
          git add .github/oracle-mova-direct-result.json .github/oracle-slickdeals-result.json .github/oracle-lenovo-legion-result.json .github/oracle-lenovo-thinkbook-result.json
          git commit -m "Publish scrubbed Daily follow-up entry results" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
