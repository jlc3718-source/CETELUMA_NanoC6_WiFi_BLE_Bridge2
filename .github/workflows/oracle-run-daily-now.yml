name: Oracle Run Daily Now

on:
  push:
    paths:
      - ".github/workflows/oracle-run-daily-now.yml"

permissions:
  contents: write

jobs:
  daily:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Daily through Oracle Browser Agent
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(mktemp)"
          trap 'rm -f "$RAW"' EXIT
          curl -sS --fail --max-time 150 \
            -H 'Content-Type: application/json' \
            -d '{"id":"run-daily-now","task":"run_daily_fast","fresh":true,"force_rescan":true,"lane_timeout_ms":55000}' \
            http://127.0.0.1:8932/run > "$RAW"
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const bad=/address|email|phone|mobile|first.?name|last.?name|full.?name|street|city|state|zip|postal|cookie|token|secret|password|credential|profile.?data|form.?data|payload|html|screenshot/i;const keep=/^(id|ok|task|status|action|outcome|result|results|parallel|lane_timeout_ms|entered|entry|entry_status|confirmation|confirmed|already_entered|skipped|skip_reason|reason|manual|manual_action|title|prize|brand|site|source|url|href|message|detail|details|new|changed|found|count|time|started|finished|elapsed_ms|duration_ms|error)$/i;const str=x=>{x=x.replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,"[REDACTED_EMAIL]").replace(/\b\d{5}(?:-\d{4})?\b/g,"[REDACTED_ZIP]").replace(/\+?1?[ .()\-]*\d{3}[ .()\-]*\d{3}[ .\-]*\d{4}/g,"[REDACTED_PHONE]");if(/^https?:\/\//i.test(x)){try{const u=new URL(x);x=u.origin+u.pathname}catch{}}return x.length>1200?x.slice(0,1200)+"…":x};const walk=(v,k="")=>{if(v==null||typeof v==="number"||typeof v==="boolean")return v;if(typeof v==="string")return str(v);if(Array.isArray(v))return v.slice(0,100).map(x=>walk(x,k));if(typeof v==="object"){const o={};for(const [q,z] of Object.entries(v)){if(bad.test(q)){o[q]="[REDACTED]";continue}if(keep.test(q)||k==="result"||k==="results")o[q]=walk(z,q)}return o}return String(v)};fs.writeFileSync(".github/oracle-run-daily-result.json",JSON.stringify(walk(d),null,2));' "$RAW"

      - name: Publish scrubbed Daily result
        shell: bash
        run: |
          set -e
          git config user.name "oracle-runner"
          git config user.email "oracle-runner@users.noreply.github.com"
          git add .github/oracle-run-daily-result.json
          git commit -m "Publish scrubbed Oracle Run Daily result" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
