name: Oracle Browser Route List

on:
  push:
    paths:
      - ".github/workflows/oracle-browser-route-list.yml"

permissions:
  contents: write

jobs:
  routes:
    runs-on: [self-hosted, oracle, jason-home]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract route list
        shell: bash
        run: |
          set -e
          CID="$(sudo docker ps --format '{{.ID}} {{.Ports}}' | awk '/127\.0\.0\.1:8932->8932/{print $1; exit}')"
          test -n "$CID"
          sudo docker exec "$CID" node -e 'const fs=require("fs");const s=fs.readFileSync("/app/src/server.js","utf8");const re=/app\.(get|post|put|delete|patch)\(\s*["\x27\x60]([^"\x27\x60]+)["\x27\x60]/g;let m;while((m=re.exec(s)))console.log(m[1].toUpperCase()+" "+m[2]);' > .github/oracle-browser-routes.txt
          cat .github/oracle-browser-routes.txt
          sudo docker exec "$CID" node -e 'const fs=require("fs");const s=fs.readFileSync("/app/src/server.js","utf8");const i=s.indexOf("app.post");const j=s.indexOf("/run",i);const a=Math.max(0,j-1800),b=Math.min(s.length,j+5000);console.log(s.slice(a,b));' | sed -E 's/(token|password|secret|key)([[:space:]]*[:=][[:space:]]*)[^,;}]+/\\1\\2REDACTED/Ig' > .github/oracle-browser-run-schema.txt
          cat .github/oracle-browser-run-schema.txt
          sudo docker exec "$CID" sh -lc "grep -nE 'task ===|task ==|const allowed|allowed =|includes\\(String\\(t\\)\\)|runTask|case ' /app/src/server.js" > .github/oracle-browser-task-list.txt
          cat .github/oracle-browser-task-list.txt
          sudo docker exec "$CID" sh -lc 'grep -R -n "genericFormEntry" /app/src 2>/dev/null | head -20' > .github/oracle-generic-entry-locations.txt
          cat .github/oracle-generic-entry-locations.txt
          sudo docker exec "$CID" node -e 'const fs=require("fs"),cp=require("child_process");const m=cp.execSync("grep -R -l genericFormEntry /app/src 2>/dev/null | head -1").toString().trim();if(!m)process.exit(2);const s=fs.readFileSync(m,"utf8");const j=s.indexOf("genericFormEntry");console.log("FILE="+m);console.log(s.slice(Math.max(0,j-2500),Math.min(s.length,j+8500)));' | sed -E 's/(token|password|secret|key)([[:space:]]*[:=][[:space:]]*)[^,;}]+/\\1\\2REDACTED/Ig' > .github/oracle-generic-entry-schema.txt
          cat .github/oracle-generic-entry-schema.txt
      - name: Publish route list
        shell: bash
        run: |
          set -e
          git config user.name "oracle-runner"
          git config user.email "oracle-runner@users.noreply.github.com"
          git add .github/oracle-browser-routes.txt .github/oracle-browser-run-schema.txt .github/oracle-browser-task-list.txt .github/oracle-generic-entry-locations.txt .github/oracle-generic-entry-schema.txt
          git commit -m "Publish Oracle Browser Agent route list" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

