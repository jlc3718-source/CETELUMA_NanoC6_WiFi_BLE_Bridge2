name: Audit Eufy Factory Master Toggle

on:
  push:
    branches: [jason-home-cloudflare-rebuild]
    paths: ['.github/workflows/audit-factory-master.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 8
    steps:
      - name: Verify live group endpoint
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/repo/JasonHomeServer
          sudo docker compose exec -T jason-home node --input-type=module - <<'NODE'
          const token=process.env.JASON_HOME_API_TOKEN;
          const call=async(method,path,body)=>{
            const r=await fetch('http://127.0.0.1:8080'+path,{
              method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:body?JSON.stringify(body):undefined
            });
            const j=await r.json();
            if(!r.ok)throw new Error(path+' '+r.status+' '+JSON.stringify(j));
            return j;
          };
          const before=await call('GET','/api/eufy/factory-promotions');
          console.log('MASTER_BEFORE',JSON.stringify(before.group));
          if(before.count!==22)throw new Error('Expected 22 promoted presets');
          if(before.group?.allEnabled||before.group?.allDisabled){
            const wanted=!!before.group.allEnabled;
            const same=await call('POST','/api/eufy/factory-promotions/group',{enabled:wanted});
            console.log('MASTER_POST_SAME',JSON.stringify(same.group));
            if(same.group?.total!==22)throw new Error('Bulk toggle did not return 22 presets');
            if(wanted&&!same.group?.allEnabled)throw new Error('Bulk enable did not remain fully enabled');
            if(!wanted&&!same.group?.allDisabled)throw new Error('Bulk disable did not remain fully disabled');
          }else{
            console.log('MASTER_POST_SKIPPED','mixed state preserved');
          }
          NODE
