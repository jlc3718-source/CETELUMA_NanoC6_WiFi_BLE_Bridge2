name: Agnes remote deployment
on:
  push:
    branches: [main]
    paths:
      - 'agnes-remote/runner-v2.py'
      - 'agnes-remote/scene-manifest.json'
      - 'agnes-remote/deploy.py'
      - '.github/workflows/agnes-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agnes-remote-deploy
  cancel-in-progress: false
jobs:
  install:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate all seven prompts and compile runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile agnes-remote/runner-v2.py agnes-remote/deploy.py
          python3 agnes-remote/runner-v2.py --check-config agnes-remote/scene-manifest.json
      - name: Single atomic installer - private credentials stay on the VM
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 agnes-remote/deploy.py agnes-remote/runner-v2.py agnes-remote/scene-manifest.json
