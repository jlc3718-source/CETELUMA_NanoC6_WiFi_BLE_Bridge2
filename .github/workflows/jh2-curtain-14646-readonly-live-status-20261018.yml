name: JH2 Curtain 14646 Live Relay Diagnostics (read only)
on:
  push:
    branches: [codex/jh2-native-1-1-46-targeted-928-parity-20261018]
    paths: ['.github/workflows/jh2-curtain-14646-readonly-live-status-20261018.yml']
permissions: {contents: read}
concurrency:
  group: jh2-curtain-14646-readonly
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle, jason-home]
    timeout-minutes: 4
    steps:
      - name: Inspect live Oracle relay command and Nano status without changing it
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 - <<'PY'
          import json,subprocess,urllib.request,urllib.error,time
          dc=json.loads(subprocess.check_output(['docker','inspect','jason-home'],text=True))[0]
          env=dict(x.split('=',1) for x in dc['Config']['Env'] if '=' in x)
          token=env['JASON_HOME_API_TOKEN']
          host='http://127.0.0.1:8081'
          def api(path,body=None,cookie=''):
              data=json.dumps(body).encode() if body is not None else None
              req=urllib.request.Request(host+path,data=data,headers={'Content-Type':'application/json',**({'Cookie':cookie} if cookie else {})},method='POST' if data is not None else 'GET')
              try:
                  with urllib.request.urlopen(req,timeout=15) as response:
                      return json.load(response),response.headers
              except urllib.error.HTTPError as ex:
                  return {'error':ex.code,'message':ex.reason},{}
          _,head=api('/api/session',{'token':token})
          cookie=head.get('Set-Cookie','').split(';')[0]
          if not cookie.startswith('jh2='):raise SystemExit('Session auth failed (no changes made)')
          status,_=api('/api/curtain/status',cookie=cookie)
          curtain=status.get('curtain') or {}
          last=status.get('lastCommand') or {}
          summary={
              'online':status.get('online'),'lastSeen':status.get('lastSeen'),
              'firmware':status.get('firmware'),
              'bleConnected':curtain.get('connected'),'bleMtu':curtain.get('mtu'),
              'catalogUnique':curtain.get('nativeCatalogUnique'),
              'catalogPacketCount':curtain.get('nativeCatalogPackets'),
              'missingHciNotify396':curtain.get('nativeHCINotify396'),
              'target83928Count':curtain.get('nativeTarget83928Count'),
              'queued':status.get('queued'),
              'lastCommand':{k:last.get(k) for k in ('id','action','state','created')},
              'autoUpdate':status.get('autoUpdate'),
          }
          print('LIVE_NANO_RELAY_STATUS',json.dumps(summary,sort_keys=True),flush=True)
          target,_=api('/api/curtain/command?id=14646',cookie=cookie)
          c=target.get('command') or {}
          details={'id':c.get('id'),'action':c.get('action'),'state':c.get('state'),
                   'created':c.get('created'),'source':c.get('source'),
                   'result':c.get('result')}
          print('COMMAND_14646',json.dumps(details,sort_keys=True),flush=True)
          if status.get('online') is not True:
              print('BLOCKER: Nano did not send a fresh relay heartbeat.',flush=True)
          elif curtain.get('connected') is not True:
              print('BLOCKER: Bluetooth link not connected; no GATT delivery possible.',flush=True)
          print('READ_ONLY_NO_BLE_WRITES_NO_OTA_NO_ASSET_CHANGE',flush=True)
          PY
