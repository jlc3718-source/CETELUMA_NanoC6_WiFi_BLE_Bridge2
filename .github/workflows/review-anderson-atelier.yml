name: Review Anderson Atelier UI
on:
  push:
    branches: ['codex/atelier-review']
    paths: ['firmware/web/**', 'tools/test_atelier_3_1_27.py', '.github/workflows/review-anderson-atelier.yml']
permissions:
  contents: read
jobs:
  visual-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser review dependencies
        run: |
          python -m pip install -q -r tools/requirements-build.txt playwright==1.55.0
          npm ci --prefix tools --no-audit --no-fund
          python -m playwright install --with-deps chromium
          git fetch --depth=1 origin 949294c0346bcf3c0a167062fc3ac973f05882bd
      - name: Exercise the redesigned interface
        run: python tools/test_atelier_3_1_27.py
      - name: Save rendered interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anderson-Atelier-Review
          path: ui-review/*.jpg
          if-no-files-found: ignore
