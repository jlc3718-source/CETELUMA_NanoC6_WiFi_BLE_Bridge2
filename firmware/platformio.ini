[platformio]
default_envs = m5stack-nanoc6

[env:m5stack-nanoc6]
platform = https://github.com/pioarduino/platform-espressif32/archive/32f6bf400b276b0f61cf42c50490a7808ee3457e.zip
board = esp32-c6-devkitc-1
framework = arduino
extra_scripts = post:scripts/c6_toolchain_path.py
; GCC 14.2.0 (20260121) rejects the ESP-IDF C6 zaamo/zalrsc ISA flags.
; Use the supported GCC 15.2 toolchain without changing the Arduino core.
platform_packages =
    platformio/toolchain-riscv32-esp @ 15.2.0+20251204
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_ota.csv
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Oz
    -flto
    -ffunction-sections
    -fdata-sections
    -fmerge-constants
    -fno-ident
    -fno-exceptions
    -fno-rtti
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -Wl,--gc-sections
    -Wl,-Map=.pio/build/m5stack-nanoc6/firmware.map
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.2
    bblanchon/ArduinoJson @ 7.4.3

[env:wokwi]
extends = env:m5stack-nanoc6
build_flags =
    ${env:m5stack-nanoc6.build_flags}
    -DMOCK_BLE=1
