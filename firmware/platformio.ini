[platformio]
default_envs = m5stack-nanoc6

[env:m5stack-nanoc6]
platform = https://github.com/pioarduino/platform-espressif32/archive/32f6bf400b276b0f61cf42c50490a7808ee3457e.zip
board = esp32-c6-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_ota.csv
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Os
    -flto
    -fno-exceptions
    -fno-rtti
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -Wl,--gc-sections
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.1
    bblanchon/ArduinoJson @ 7.4.3

[env:wokwi]
extends = env:m5stack-nanoc6
build_flags =
    ${env:m5stack-nanoc6.build_flags}
    -DMOCK_BLE=1
